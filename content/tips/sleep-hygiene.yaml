article: sleep-hygiene
emoji: "🛏️"
tips:
  - key: weinig-getoetst
    kind: fact
    en:
      title: "Sleep tips"
      body: "They're linked to how people sleep. What each tip does on its own has mostly not been tested."
    nl:
      title: "Slaaptips"
      body: "Die hangen samen met hoe mensen slapen. Wat elke tip los doet, is meestal niet getest."
    de:
      title: "Schlaftipps"
      body: "Sie hängen mit dem Schlaf zusammen. Was jeder Tipp allein bewirkt, ist meist nicht getestet."
    es:
      title: "Consejos de sueño"
      body: "Se asocian con cómo duerme la gente. Lo que hace cada uno por separado casi no se ha probado."
    fr:
      title: "Conseils sommeil"
      body: "Ils sont liés à la façon dont on dort. Ce que chaque conseil fait seul n'est presque pas testé."
    pt:
      title: "Dicas de sono"
      body: "Estão ligadas a como as pessoas dormem. O que cada dica faz sozinha quase não foi testado."
    tr:
      title: "Uyku ipuçları"
      body: "İnsanların uykusuyla bağlantılı. Her ipucunun tek başına ne yaptığı çoğunlukla test edilmedi."

  - key: laatste-koffie
    kind: fact
    en:
      title: "8.8 hours"
      body: "Between your last coffee and bed, a model estimates. Going to bed at 23:00? Then stop before about 14:00."
    nl:
      title: "8,8 uur"
      body: "Zoveel tijd hoort er tussen je laatste koffie en bedtijd, schat een model. Om 23 uur slapen? Stop dan rond 14 uur."
    de:
      title: "8,8 Stunden"
      body: "So viel Zeit gehört zwischen letzten Kaffee und Bett, schätzt ein Modell. Um 23 Uhr ins Bett? Dann bis etwa 14 Uhr."
    es:
      title: "8,8 horas"
      body: "Entre tu último café y la cama, según un modelo. ¿Te acuestas a las 23:00? Entonces para hacia las 14:00."
    fr:
      title: "8,8 heures"
      body: "Entre ton dernier café et le coucher, selon un modèle. Couché à 23 h ? Alors arrête vers 14 h."
    pt:
      title: "8,8 horas"
      body: "Entre o último café e a cama, estima um modelo. Deitas-te às 23h? Então para por volta das 14h."
    tr:
      title: "8,8 saat"
      body: "Bir modele göre son kahve ile yatış arasında bu kadar olmalı. 23:00'te mi yatıyorsun? O zaman 14:00 civarı bırak."

  - key: slaapmutsje
    kind: myth
    en:
      title: "Nightcap"
      body: "Myth: a nightcap helps you sleep. From about two drinks, alcohol already delays and shortens REM sleep."
    nl:
      title: "Slaapmutsje"
      body: "Mythe: een slaapmutsje helpt je slapen. Vanaf zo'n twee glazen vertraagt en verkort alcohol je REM-slaap."
    de:
      title: "Schlummertrunk"
      body: "Mythos: Ein Schlummertrunk hilft beim Schlafen. Ab etwa zwei Gläsern verzögert und verkürzt Alkohol den REM-Schlaf."
    es:
      title: "Copa de antes"
      body: "Mito: una copa antes de dormir ayuda. Desde unas dos copas, el alcohol retrasa y acorta el sueño REM."
    fr:
      title: "Verre du soir"
      body: "Mythe : un verre aide à dormir. Dès deux verres environ, l'alcool retarde et raccourcit le sommeil paradoxal."
    pt:
      title: "Copo antes de dormir"
      body: "Mito: um copo ajuda a dormir. A partir de cerca de dois, o álcool atrasa e encurta o sono REM."
    tr:
      title: "Yatmadan bir kadeh"
      body: "Efsane: yatmadan içmek uyutur. Yaklaşık iki kadehten itibaren alkol REM uykusunu geciktirip kısaltır."

  - key: avondtraining
    kind: myth
    en:
      title: "Evening training"
      body: "Myth: it ruins your sleep. In 23 studies it didn't. Hard sessions ending within an hour of bed might."
    nl:
      title: "'s Avonds trainen"
      body: "Mythe: dat verpest je slaap. In 23 studies niet. Zware training die binnen een uur voor bedtijd eindigt misschien wel."
    de:
      title: "Abendtraining"
      body: "Mythos: Es ruiniert den Schlaf. In 23 Studien nicht. Harte Einheiten bis eine Stunde vor dem Bett vielleicht."
    es:
      title: "Entrenar de noche"
      body: "Mito: arruina tu sueño. En 23 estudios no. Una sesión dura que acabe a menos de una hora de dormir, quizá."
    fr:
      title: "Séance du soir"
      body: "Mythe : ça gâche le sommeil. Pas dans 23 études. Une séance dure finie moins d'une heure avant, peut-être."
    pt:
      title: "Treinar à noite"
      body: "Mito: estraga o sono. Em 23 estudos não. Um treino duro a acabar a menos de uma hora de dormir, talvez."
    tr:
      title: "Akşam antrenmanı"
      body: "Efsane: uykunu mahveder. 23 çalışmada etmedi. Yatmaya bir saatten az kala biten sert antrenman edebilir."

  - key: zwaar-trainen-laat
    kind: fact
    en:
      title: "2 to 4 hours"
      body: "Before bed, a hard session didn't disrupt sleep in healthy adults. Leave at least an hour."
    nl:
      title: "2 tot 4 uur"
      body: "Voor bedtijd verstoorde een zware training de slaap bij gezonde volwassenen niet. Houd minstens een uur."
    de:
      title: "2 bis 4 Stunden"
      body: "Vor dem Schlafen störte eine harte Einheit den Schlaf Gesunder nicht. Lass mindestens eine Stunde."
    es:
      title: "2 a 4 horas"
      body: "Antes de dormir, una sesión dura no alteró el sueño de adultos sanos. Deja al menos una hora."
    fr:
      title: "2 à 4 heures"
      body: "Avant le coucher, une séance dure n'a pas gêné le sommeil d'adultes sains. Garde au moins une heure."
    pt:
      title: "2 a 4 horas"
      body: "Antes de dormir, um treino duro não perturbou o sono de adultos saudáveis. Deixa pelo menos uma hora."
    tr:
      title: "2-4 saat"
      body: "Sağlıklı yetişkinlerde yatmadan bu kadar önce biten sert antrenman uykuyu bozmadı. En az bir saat bırak."

  - key: schermen
    kind: fact
    en:
      title: "10 minutes"
      body: "Longer to fall asleep after 4 hours on an e-reader instead of a book, with less melatonin. One small study."
    nl:
      title: "10 minuten"
      body: "Langer om in slaap te vallen na 4 uur e-reader in plaats van een boek, met minder melatonine. Eén kleine studie."
    de:
      title: "10 Minuten"
      body: "Länger zum Einschlafen nach 4 Stunden E-Reader statt Buch, mit weniger Melatonin. Eine kleine Studie."
    es:
      title: "10 minutos"
      body: "Más en dormirse tras 4 horas de lector electrónico en vez de libro, y menos melatonina. Un estudio pequeño."
    fr:
      title: "10 minutes"
      body: "De plus pour s'endormir après 4 heures de liseuse au lieu d'un livre, et moins de mélatonine. Petite étude."
    pt:
      title: "10 minutos"
      body: "A mais para adormecer após 4 horas de e-reader em vez de livro, com menos melatonina. Um estudo pequeno."
    tr:
      title: "10 dakika"
      body: "Kitap yerine 4 saat e-okuyucudan sonra uykuya dalmak bu kadar uzadı, melatonin düştü. Küçük bir çalışma."

  - key: niet-te-warm
    kind: fact
    en:
      title: "Too warm"
      body: "A hot bedroom makes you wake more and cuts deep and REM sleep. Cold didn't, if you had enough bedding."
    nl:
      title: "Te warm"
      body: "Een warme slaapkamer laat je vaker wakker worden en kost diepe slaap en REM. Kou niet, met genoeg dekens."
    de:
      title: "Zu warm"
      body: "Ein heißes Schlafzimmer weckt dich öfter und kostet Tief- und REM-Schlaf. Kälte nicht, mit genug Decken."
    es:
      title: "Demasiado calor"
      body: "Un cuarto caluroso te despierta más y quita sueño profundo y REM. El frío no, con mantas suficientes."
    fr:
      title: "Trop chaud"
      body: "Une chambre chaude réveille plus et rogne sommeil profond et paradoxal. Le froid non, bien couvert."
    pt:
      title: "Calor a mais"
      body: "Um quarto quente faz-te acordar mais e tira sono profundo e REM. O frio não, com roupa de cama."
    tr:
      title: "Fazla sıcak"
      body: "Sıcak yatak odası daha çok uyandırır, derin ve REM uykusunu azaltır. Yeterli örtüyle soğuk azaltmadı."

  - key: geen-ideale-graad
    kind: myth
    en:
      title: "18 to 20 °C"
      body: "Myth: 18 to 20 °C is the ideal bedroom. The review on sleep gives no ideal number. Just don't let it get too warm."
    nl:
      title: "18 tot 20 °C"
      body: "Mythe: 18 tot 20 °C is ideaal in de slaapkamer. De review noemt geen ideaal getal. Laat het alleen niet te warm worden."
    de:
      title: "18 bis 20 °C"
      body: "Mythos: 18 bis 20 °C sind ideal im Schlafzimmer. Die Übersicht nennt keine Idealzahl. Nur nicht zu warm werden lassen."
    es:
      title: "18 a 20 °C"
      body: "Mito: 18 a 20 °C es lo ideal en el dormitorio. La revisión no da cifra ideal. Solo evita que haga demasiado calor."
    fr:
      title: "18 à 20 °C"
      body: "Mythe : 18 à 20 °C, c'est l'idéal pour dormir. La revue ne donne aucun chiffre. Évite juste qu'il fasse trop chaud."
    pt:
      title: "18 a 20 °C"
      body: "Mito: 18 a 20 °C é o ideal no quarto. A revisão não dá um número ideal. Só não deixes aquecer demais."
    tr:
      title: "18-20 °C"
      body: "Efsane: yatak odası için ideal sıcaklık 18-20 °C. Derleme ideal sayı vermiyor. Sadece fazla ısınmasın."

  - key: vaste-bedtijd
    kind: fact
    en:
      title: "20 to 48%"
      body: "Lower risk of dying in more regular sleepers, among 60,977 people. A link from observation, not proof."
    nl:
      title: "20 tot 48%"
      body: "Lager sterfterisico bij regelmatige slapers, onder 60.977 mensen. Een verband, geen bewijs."
    de:
      title: "20 bis 48 %"
      body: "Geringeres Sterberisiko bei regelmäßigen Schläfern, unter 60.977 Menschen. Ein Zusammenhang, kein Beweis."
    es:
      title: "20 a 48 %"
      body: "Menos riesgo de morir en quienes dormían con más regularidad, entre 60.977 personas. Relación, no prueba."
    fr:
      title: "20 à 48 %"
      body: "De risque de décès en moins chez les dormeurs réguliers, sur 60 977 personnes. Un lien, pas une preuve."
    pt:
      title: "20 a 48%"
      body: "Menos risco de morte em quem dormia com regularidade, em 60.977 pessoas. Uma ligação, não prova."
    tr:
      title: "%20-48"
      body: "60.977 kişide düzenli uyuyanlarda ölüm riski bu kadar düşüktü. Gözlemsel bir bağ, kanıt değil."

  - key: geen-oplossing-insomnia
    kind: myth
    en:
      title: "Insomnia"
      body: "Myth: sleep tips fix insomnia. They helped less than CBT-I, a therapy for it. Awake for weeks? See a doctor."
    nl:
      title: "Slapeloosheid"
      body: "Mythe: slaaptips lossen slapeloosheid op. Ze hielpen minder dan CBT-I, een therapie. Weken wakker? Naar de huisarts."
    de:
      title: "Schlaflosigkeit"
      body: "Mythos: Schlaftipps heilen Schlaflosigkeit. Sie halfen weniger als KVT-I, eine Therapie. Wochenlang wach? Zum Arzt."
    es:
      title: "Insomnio"
      body: "Mito: los consejos curan el insomnio. Ayudaron menos que la TCC-I, una terapia. ¿Semanas sin dormir? Ve al médico."
    fr:
      title: "Insomnie"
      body: "Mythe : les conseils guérissent l'insomnie. Ils aident moins que la TCC-I. Des semaines sans dormir ? Consulte."
    pt:
      title: "Insónia"
      body: "Mito: as dicas curam a insónia. Ajudaram menos do que a TCC-I, uma terapia. Semanas sem dormir? Vai ao médico."
    tr:
      title: "Uykusuzluk"
      body: "Efsane: uyku ipuçları uykusuzluğu çözer. Bir terapi olan BDT-I'den az işe yaradı. Haftalardır uyanık mısın? Doktora git."

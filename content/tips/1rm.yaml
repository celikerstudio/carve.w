article: 1rm
emoji: "🏋️"
tips:
  - key: schatten
    kind: fact
    en:
      title: "RPE 8 to 9"
      body: "One heavy single at RPE 8 to 9 estimates your max. Less risk and less time than a real test."
    nl:
      title: "RPE 8 tot 9"
      body: "Eén zware herhaling op RPE 8 tot 9 schat je max. Minder risico en minder tijd dan een echte test."
    de:
      title: "RPE 8 bis 9"
      body: "Eine schwere Wiederholung bei RPE 8 bis 9 schätzt dein Maximum. Weniger Risiko und Zeit als ein echter Test."
    es:
      title: "RPE 8 a 9"
      body: "Una repetición pesada a RPE 8 a 9 estima tu máximo. Menos riesgo y menos tiempo que un test real."
    fr:
      title: "RPE 8 à 9"
      body: "Une répétition lourde à RPE 8 à 9 estime ton max. Moins de risque et de temps qu'un vrai test."
    pt:
      title: "RPE 8 a 9"
      body: "Uma repetição pesada a RPE 8 a 9 estima o teu máximo. Menos risco e menos tempo do que um teste real."
    tr:
      title: "RPE 8-9"
      body: "RPE 8-9'da tek ağır tekrar maksimumunu tahmin eder. Gerçek testten daha az risk, daha az zaman."

  - key: niet-wekelijks-maxen
    kind: myth
    en:
      title: "Every week"
      body: "Myth: test your max every week. It piles up fatigue and raises injury risk. Save it for planned checkpoints."
    nl:
      title: "Elke week"
      body: "Mythe: test elke week je max. Dat stapelt vermoeidheid op en vergroot je blessurerisico. Bewaar het voor vaste momenten."
    de:
      title: "Jede Woche"
      body: "Mythos: Teste jede Woche dein Maximum. Das häuft Ermüdung an und erhöht das Verletzungsrisiko. Plane feste Termine."
    es:
      title: "Cada semana"
      body: "Mito: prueba tu máximo cada semana. Acumula fatiga y sube el riesgo de lesión. Resérvalo para fechas planeadas."
    fr:
      title: "Chaque semaine"
      body: "Mythe : teste ton max chaque semaine. Ça accumule la fatigue et le risque de blessure. Garde-le pour des dates prévues."
    pt:
      title: "Todas as semanas"
      body: "Mito: testa o teu máximo todas as semanas. Acumula fadiga e aumenta o risco de lesão. Guarda-o para datas planeadas."
    tr:
      title: "Her hafta"
      body: "Efsane: maksimumunu her hafta test et. Bu yorgunluk biriktirir ve sakatlık riskini artırır. Planlı günlere sakla."

  - key: wanneer-testen
    kind: fact
    en:
      title: "After a deload"
      body: "That's the time to test a true max. Warm up well and use spotters or safeties."
    nl:
      title: "Na een deload"
      body: "Dan test je een echte max. Warm goed op en zorg voor een spotter of veiligheidsstangen."
    de:
      title: "Nach einem Deload"
      body: "Dann testest du ein echtes Maximum. Wärm dich gut auf und nutze Spotter oder Sicherheitsablagen."
    es:
      title: "Tras una descarga"
      body: "Es el momento de probar un máximo real. Calienta bien y usa un ayudante o barras de seguridad."
    fr:
      title: "Après une décharge"
      body: "C'est le moment de tester un vrai max. Échauffe-toi bien et prends un pareur ou des sécurités."
    pt:
      title: "Depois de um deload"
      body: "É a altura de testar um máximo real. Aquece bem e usa alguém a ajudar ou barras de segurança."
    tr:
      title: "Deload sonrası"
      body: "Gerçek maksimumu test etme zamanı. İyi ısın, yardımcı ya da güvenlik barı kullan."

  - key: elke-3-6-weken
    kind: fact
    en:
      title: "3 to 6 weeks"
      body: "Update your estimated max that often, and base the weights for your main lifts on it."
    nl:
      title: "3 tot 6 weken"
      body: "Zo vaak werk je je geschatte max bij. De gewichten voor je hoofdoefeningen baseer je erop."
    de:
      title: "3 bis 6 Wochen"
      body: "So oft aktualisierst du dein geschätztes Maximum. Darauf baust du die Gewichte deiner Hauptübungen auf."
    es:
      title: "3 a 6 semanas"
      body: "Es cada cuánto actualizas tu máximo estimado. Basa en él los pesos de tus ejercicios principales."
    fr:
      title: "3 à 6 semaines"
      body: "C'est le rythme pour mettre à jour ton max estimé. Base dessus les charges de tes exercices principaux."
    pt:
      title: "3 a 6 semanas"
      body: "É de quanto em quanto atualizas o teu máximo estimado. Baseia nele os pesos dos exercícios principais."
    tr:
      title: "3-6 hafta"
      body: "Tahmini maksimumunu bu aralıkla güncelle. Ana hareketlerdeki ağırlıkları ona göre belirle."

  - key: techniek-telt
    kind: fact
    en:
      title: "Bad form"
      body: "A max lifted with sloppy technique isn't a reliable number. Stop when your form breaks down."
    nl:
      title: "Slechte techniek"
      body: "Een max met slordige techniek is geen betrouwbaar getal. Stop zodra je techniek inzakt."
    de:
      title: "Schlechte Technik"
      body: "Ein Maximum mit schlampiger Technik ist keine verlässliche Zahl. Hör auf, wenn die Form bricht."
    es:
      title: "Mala técnica"
      body: "Un máximo con técnica descuidada no es un número fiable. Para cuando se rompa tu técnica."
    fr:
      title: "Mauvaise technique"
      body: "Un max soulevé avec une technique bâclée n'est pas fiable. Arrête dès que ta technique lâche."
    pt:
      title: "Má técnica"
      body: "Um máximo com técnica desleixada não é um número fiável. Para quando a técnica começar a falhar."
    tr:
      title: "Kötü teknik"
      body: "Özensiz teknikle kaldırılan maksimum güvenilir değil. Formun bozulunca dur."

  - key: dagvorm
    kind: fact
    en:
      title: "Off day"
      body: "Your percentages are a starting point. When your readiness shifts, adjust the weight with RPE."
    nl:
      title: "Slechte dag"
      body: "Je percentages zijn een startpunt. Voel je je anders dan normaal, stel het gewicht dan bij met RPE."
    de:
      title: "Schlechter Tag"
      body: "Deine Prozente sind ein Startpunkt. Wenn deine Tagesform schwankt, pass das Gewicht mit RPE an."
    es:
      title: "Mal día"
      body: "Tus porcentajes son un punto de partida. Si tu forma cambia de un día a otro, ajusta el peso con RPE."
    fr:
      title: "Jour sans"
      body: "Tes pourcentages sont un point de départ. Si ta forme varie d'un jour à l'autre, ajuste la charge avec le RPE."
    pt:
      title: "Dia mau"
      body: "As tuas percentagens são um ponto de partida. Se a forma muda de dia para dia, ajusta o peso com RPE."
    tr:
      title: "Kötü gün"
      body: "Yüzdeler sadece başlangıç noktası. Günlük formun değişirse ağırlığı RPE ile ayarla."

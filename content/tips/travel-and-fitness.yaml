article: travel-and-fitness
emoji: "✈️"
tips:
  - key: geen-volledige-pauze
    kind: myth
    en:
      title: "20 to 40 minutes"
      body: "Myth: travel means a training break. Short sessions keep skill and strength better than stopping."
    nl:
      title: "20 tot 40 minuten"
      body: "Mythe: op reis neem je pauze van trainen. Korte sessies houden techniek en kracht beter vast dan stoppen."
    de:
      title: "20 bis 40 Minuten"
      body: "Mythos: Reisen heißt Trainingspause. Kurze Einheiten halten Technik und Kraft besser als Aufhören."
    es:
      title: "20 a 40 minutos"
      body: "Mito: de viaje se descansa del entreno. Sesiones cortas mantienen técnica y fuerza mejor que parar."
    fr:
      title: "20 à 40 minutes"
      body: "Mythe : en voyage, on fait une pause. Des séances courtes gardent technique et force mieux qu'arrêter."
    pt:
      title: "20 a 40 minutos"
      body: "Mito: em viagem faz-se pausa. Treinos curtos mantêm técnica e força melhor do que parar."
    tr:
      title: "20-40 dakika"
      body: "Efsane: seyahatte antrenmana ara verilir. Kısa seanslar tekniği ve gücü bırakmaktan iyi korur."

  - key: elastieken-mee
    kind: fact
    en:
      title: "Bands"
      body: "Pack them with a simple plan: push, pull and legs with bodyweight plus bands. Or book a hotel with a gym."
    nl:
      title: "Elastieken"
      body: "Neem ze mee met een simpel plan: duwen, trekken en benen met lichaamsgewicht plus elastiek. Of boek een hotel met gym."
    de:
      title: "Bänder"
      body: "Pack sie ein, mit einem einfachen Plan: Drücken, Ziehen, Beine mit Körpergewicht und Band. Oder Hotel mit Gym."
    es:
      title: "Gomas"
      body: "Llévalas con un plan sencillo: empuje, tirón y pierna con peso corporal y gomas. O busca hotel con gimnasio."
    fr:
      title: "Élastiques"
      body: "Emporte-les avec un plan simple : pousser, tirer, jambes au poids du corps plus élastiques. Ou un hôtel avec salle."
    pt:
      title: "Elásticos"
      body: "Leva-os com um plano simples: empurrar, puxar e pernas com peso corporal e elásticos. Ou hotel com ginásio."
    tr:
      title: "Bantlar"
      body: "Basit bir planla yanına al: vücut ağırlığı ve bantla itiş, çekiş, bacak. Ya da spor salonlu otel seç."

  - key: eiwit-bij-elke-maaltijd
    kind: fact
    en:
      title: "Eggs and yoghurt"
      body: "Build each meal around protein like that, or lean meat. Add fruit and veg, and go easy on rich extras."
    nl:
      title: "Eieren en yoghurt"
      body: "Bouw elke maaltijd rond zulk eiwit, of mager vlees. Doe er fruit en groente bij en wees zuinig op vette extra's."
    de:
      title: "Eier und Joghurt"
      body: "Bau jede Mahlzeit um solches Protein oder mageres Fleisch. Dazu Obst und Gemüse, wenig fette Extras."
    es:
      title: "Huevos y yogur"
      body: "Monta cada comida con proteína así o carne magra. Añade fruta y verdura, y modera los extras grasos."
    fr:
      title: "Œufs et yaourt"
      body: "Construis chaque repas autour de ces protéines ou de viande maigre. Fruits, légumes, et peu d'extras riches."
    pt:
      title: "Ovos e iogurte"
      body: "Monta cada refeição com proteína assim ou carne magra. Junta fruta e legumes, e poupa nos extras gordos."
    tr:
      title: "Yumurta ve yoğurt"
      body: "Her öğünü böyle bir protein ya da yağsız etle kur. Meyve, sebze ekle, ağır ekstralardan kaçın."

  - key: vroeg-trainen
    kind: fact
    en:
      title: "Train early"
      body: "On a work trip, train early in the day, before meetings and dinners take over."
    nl:
      title: "Train vroeg"
      body: "Op een werkreis train je vroeg op de dag, voor vergaderingen en etentjes het overnemen."
    de:
      title: "Früh trainieren"
      body: "Auf Dienstreise früh am Tag trainieren, bevor Meetings und Abendessen übernehmen."
    es:
      title: "Entrena temprano"
      body: "En un viaje de trabajo, entrena temprano, antes de que reuniones y cenas se lo coman todo."
    fr:
      title: "Entraîne-toi tôt"
      body: "En déplacement pro, entraîne-toi tôt, avant que réunions et dîners prennent le dessus."
    pt:
      title: "Treina cedo"
      body: "Numa viagem de trabalho, treina cedo, antes que reuniões e jantares tomem conta."
    tr:
      title: "Erken çalış"
      body: "İş seyahatinde toplantılar ve yemekler günü ele geçirmeden önce, sabah erken çalış."

  - key: vliegen
    kind: fact
    en:
      title: "After a flight"
      body: "Drink enough on the flight and take a walk once you land. It helps with travel fatigue."
    nl:
      title: "Na een vlucht"
      body: "Drink genoeg in het vliegtuig en maak een wandeling na de landing. Dat helpt tegen reismoeheid."
    de:
      title: "Nach dem Flug"
      body: "Trink genug im Flieger und geh nach der Landung spazieren. Das hilft gegen Reisemüdigkeit."
    es:
      title: "Tras un vuelo"
      body: "Bebe suficiente en el avión y camina al aterrizar. Ayuda con el cansancio del viaje."
    fr:
      title: "Après un vol"
      body: "Bois assez pendant le vol et marche en arrivant. Ça aide contre la fatigue du voyage."
    pt:
      title: "Depois de um voo"
      body: "Bebe o suficiente no avião e caminha quando aterrares. Ajuda no cansaço da viagem."
    tr:
      title: "Uçuştan sonra"
      body: "Uçakta yeterince iç ve inince yürüyüş yap. Yolculuk yorgunluğuna iyi gelir."

  - key: jetlag
    kind: fact
    en:
      title: "Local time"
      body: "Line up your light and sleep with it, with steady bed and wake times. Ignoring jet lag drags the fatigue out."
    nl:
      title: "Lokale tijd"
      body: "Stem licht en slaap daarop af, met vaste bed- en wektijden. Jetlag negeren rekt de vermoeidheid."
    de:
      title: "Ortszeit"
      body: "Richte Licht und Schlaf danach aus, mit festen Schlafens- und Aufstehzeiten. Jetlag ignorieren zieht die Müdigkeit."
    es:
      title: "Hora local"
      body: "Ajusta luz y sueño a ella, con horarios fijos de dormir y despertar. Ignorar el jet lag alarga el cansancio."
    fr:
      title: "Heure locale"
      body: "Cale lumière et sommeil dessus, avec des heures fixes. Ignorer le jet lag fait traîner la fatigue."
    pt:
      title: "Hora local"
      body: "Ajusta luz e sono a ela, com horas fixas de deitar e acordar. Ignorar o jet lag prolonga o cansaço."
    tr:
      title: "Yerel saat"
      body: "Işığı ve uykunu ona göre ayarla, sabit yatış-kalkış saatleriyle. Jet lag'i görmezden gelmek yorgunluğu uzatır."

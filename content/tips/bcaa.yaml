article: bcaa
emoji: "🧪"
tips:
  - key: drie-van-negen
    kind: fact
    en:
      title: "3 of 9"
      body: "Essential amino acids are BCAAs: leucine, isoleucine and valine. Leucine is the main switch for muscle building."
    nl:
      title: "3 van de 9"
      body: "Essentiële aminozuren zijn BCAA's: leucine, isoleucine en valine. Leucine is de hoofdschakelaar voor spieropbouw."
    de:
      title: "3 von 9"
      body: "Von den essenziellen Aminosäuren sind 3 BCAAs: Leucin, Isoleucin, Valin. Leucin startet den Muskelaufbau."
    es:
      title: "3 de 9"
      body: "De los aminoácidos esenciales, 3 son BCAA: leucina, isoleucina y valina. La leucina activa el músculo."
    fr:
      title: "3 sur 9"
      body: "Des acides aminés essentiels, 3 sont des BCAA : leucine, isoleucine, valine. La leucine lance le muscle."
    pt:
      title: "3 de 9"
      body: "Dos aminoácidos essenciais, 3 são BCAA: leucina, isoleucina e valina. A leucina liga o músculo."
    tr:
      title: "9'da 3"
      body: "Temel amino asitlerin 3'ü BCAA'dır: lösin, izolösin ve valin. Kas yapımını asıl başlatan lösin."

  - key: half-van-whey
    kind: fact
    en:
      title: "22%"
      body: "More muscle building from 5.6 g of BCAAs after lifting, in one study. About half of what whey usually does."
    nl:
      title: "22%"
      body: "Meer spieropbouw met 5,6 gram BCAA na het trainen, in één studie. Ongeveer de helft van wat whey meestal doet."
    de:
      title: "22 %"
      body: "Mehr Muskelaufbau mit 5,6 g BCAAs nach dem Training, in einer Studie. Etwa halb so viel wie sonst mit Whey."
    es:
      title: "22 %"
      body: "Más síntesis muscular con 5,6 g de BCAA tras entrenar, en un estudio. Más o menos la mitad que con whey."
    fr:
      title: "22 %"
      body: "De construction musculaire en plus avec 5,6 g de BCAA, dans une étude. Environ la moitié de l'effet de la whey."
    pt:
      title: "22%"
      body: "Mais síntese muscular com 5,6 g de BCAA após o treino, num estudo. Cerca de metade do que a whey costuma dar."
    tr:
      title: "%22"
      body: "Bir çalışmada antrenman sonrası 5,6 g BCAA kas yapımını bu kadar artırdı. Whey'in etkisinin yarısı kadar."

  - key: vervangt-eiwit
    kind: myth
    en:
      title: "Instead of protein"
      body: "Myth: BCAAs can replace protein. Leucine starts muscle building, but the other amino acids are the bricks."
    nl:
      title: "In plaats van eiwit"
      body: "Mythe: BCAA's kunnen eiwit vervangen. Leucine start de spieropbouw, maar de andere aminozuren zijn de stenen."
    de:
      title: "Statt Protein"
      body: "Mythos: BCAAs ersetzen Protein. Leucin startet den Aufbau, aber die anderen Aminosäuren sind die Bausteine."
    es:
      title: "En vez de proteína"
      body: "Mito: los BCAA sustituyen a la proteína. La leucina inicia el proceso, pero el resto son los ladrillos."
    fr:
      title: "Au lieu de protéines"
      body: "Mythe : les BCAA remplacent les protéines. La leucine lance le chantier, les autres acides aminés sont les briques."
    pt:
      title: "Em vez de proteína"
      body: "Mito: os BCAA substituem a proteína. A leucina dá o arranque, mas os outros aminoácidos são os tijolos."
    tr:
      title: "Protein yerine"
      body: "Efsane: BCAA proteinin yerini tutar. Lösin kas yapımını başlatır ama tuğlalar diğer amino asitlerdir."

  - key: spiergroei
    kind: myth
    en:
      title: "8 weeks"
      body: "Myth: BCAAs give you more muscle. In 8 weeks of lifting, 9 g a day made no difference to body composition."
    nl:
      title: "8 weken"
      body: "Mythe: BCAA's geven meer spier. Na 8 weken trainen maakte 9 gram per dag geen verschil in lichaamssamenstelling."
    de:
      title: "8 Wochen"
      body: "Mythos: BCAAs bringen mehr Muskeln. In 8 Wochen Training änderten 9 g am Tag nichts am Körperbau."
    es:
      title: "8 semanas"
      body: "Mito: los BCAA dan más músculo. En 8 semanas de pesas, 9 g al día no cambiaron la composición corporal."
    fr:
      title: "8 semaines"
      body: "Mythe : les BCAA font plus de muscle. Sur 8 semaines de muscu, 9 g par jour n'ont rien changé au physique."
    pt:
      title: "8 semanas"
      body: "Mito: os BCAA dão mais músculo. Em 8 semanas de treino, 9 g por dia não mudaram a composição corporal."
    tr:
      title: "8 hafta"
      body: "Efsane: BCAA daha çok kas yaptırır. 8 haftalık antrenmanda günde 9 g vücut kompozisyonunu değiştirmedi."

  - key: spierpijn
    kind: fact
    en:
      title: "Less sore"
      body: "Several studies found less soreness and strength loss after tough training. For endurance it's mixed."
    nl:
      title: "Minder spierpijn"
      body: "Meerdere studies zagen minder spierpijn en krachtverlies na zware training. Bij duursport is het wisselend."
    de:
      title: "Weniger Muskelkater"
      body: "Mehrere Studien sahen weniger Muskelkater und Kraftverlust nach hartem Training. Beim Ausdauersport gemischt."
    es:
      title: "Menos agujetas"
      body: "Varios estudios vieron menos agujetas y menos pérdida de fuerza tras entrenar duro. En resistencia, resultados mixtos."
    fr:
      title: "Moins de courbatures"
      body: "Plusieurs études ont vu moins de courbatures et de perte de force après un effort dur. En endurance, c'est mitigé."
    pt:
      title: "Menos dores"
      body: "Vários estudos viram menos dores e menos perda de força após treino duro. Na resistência, os resultados variam."
    tr:
      title: "Daha az ağrı"
      body: "Birkaç çalışma zorlu antrenman sonrası daha az ağrı ve güç kaybı buldu. Dayanıklılıkta sonuçlar karışık."

  - key: alleen-leucine
    kind: myth
    en:
      title: "Leucine alone"
      body: "Myth: leucine alone is enough. All essential amino acids together keep muscle building going best."
    nl:
      title: "Alleen leucine"
      body: "Mythe: alleen leucine is genoeg. Alle essentiële aminozuren samen houden de spieropbouw het best op gang."
    de:
      title: "Nur Leucin"
      body: "Mythos: Leucin allein reicht. Alle essenziellen Aminosäuren zusammen halten den Muskelaufbau am besten in Gang."
    es:
      title: "Solo leucina"
      body: "Mito: con leucina basta. Todos los aminoácidos esenciales juntos mantienen mejor la síntesis muscular."
    fr:
      title: "Que de la leucine"
      body: "Mythe : la leucine seule suffit. C'est l'ensemble des acides aminés essentiels qui entretient le mieux le muscle."
    pt:
      title: "Só leucina"
      body: "Mito: só leucina chega. Todos os aminoácidos essenciais juntos mantêm melhor a síntese muscular."
    tr:
      title: "Sadece lösin"
      body: "Efsane: tek başına lösin yeter. Kas yapımını en iyi tüm temel amino asitler birlikte sürdürür."

  - key: leucine-per-maaltijd
    kind: fact
    en:
      title: "1 to 3 g"
      body: "Leucine per meal, the ISSN advises. Good protein sources give you that, with the other amino acids included."
    nl:
      title: "1 tot 3 gram"
      body: "Leucine per maaltijd, adviseert de ISSN. Goede eiwitbronnen geven je dat, met de andere aminozuren erbij."
    de:
      title: "1 bis 3 g"
      body: "Leucin pro Mahlzeit empfiehlt die ISSN. Gute Proteinquellen liefern das, mit den anderen Aminosäuren dazu."
    es:
      title: "1 a 3 g"
      body: "De leucina por comida, aconseja la ISSN. Las buenas fuentes de proteína te lo dan, con el resto de aminoácidos."
    fr:
      title: "1 à 3 g"
      body: "De leucine par repas, conseille l'ISSN. Les bonnes sources de protéines te l'apportent, avec les autres acides aminés."
    pt:
      title: "1 a 3 g"
      body: "De leucina por refeição, aconselha a ISSN. Boas fontes de proteína dão-te isso, com os outros aminoácidos."
    tr:
      title: "1-3 g"
      body: "ISSN öğün başına bu kadar lösin öneriyor. İyi protein kaynakları bunu diğer amino asitlerle birlikte verir."

  - key: losse-eaa
    kind: fact
    en:
      title: "6 to 12 g"
      body: "Of essential amino acids raises muscle building for a few hours. Proof that it adds muscle over time is limited."
    nl:
      title: "6 tot 12 gram"
      body: "Essentiële aminozuren verhoogt de spieropbouw een paar uur. Bewijs dat het op termijn spier oplevert is beperkt."
    de:
      title: "6 bis 12 g"
      body: "Essenzielle Aminosäuren steigern den Muskelaufbau für ein paar Stunden. Ob das auf Dauer Muskeln bringt, ist offen."
    es:
      title: "6 a 12 g"
      body: "De aminoácidos esenciales suben la síntesis muscular unas horas. Que sumen músculo a la larga está poco probado."
    fr:
      title: "6 à 12 g"
      body: "D'acides aminés essentiels relancent le muscle quelques heures. Qu'ils en ajoutent à long terme est peu prouvé."
    pt:
      title: "6 a 12 g"
      body: "De aminoácidos essenciais aumentam a síntese muscular por umas horas. Que deem músculo a prazo está pouco provado."
    tr:
      title: "6-12 g"
      body: "Temel amino asit, kas yapımını birkaç saat artırır. Zamanla kas kazandırdığına dair kanıt sınırlı."

  - key: ouderen-whey
    kind: fact
    en:
      title: "15 g of whey"
      body: "Raised muscle building in older adults' legs, in a small study. A matched amino acid mix did not."
    nl:
      title: "15 gram whey"
      body: "Verhoogde de spieropbouw in de benen van ouderen, in een kleine studie. Een vergelijkbare aminozuurmix niet."
    de:
      title: "15 g Whey"
      body: "Steigerten den Muskelaufbau in den Beinen älterer Menschen, in einer kleinen Studie. Ein passender Aminomix nicht."
    es:
      title: "15 g de whey"
      body: "Subieron la síntesis muscular en las piernas de personas mayores, en un estudio pequeño. Una mezcla de aminoácidos no."
    fr:
      title: "15 g de whey"
      body: "Ont relancé le muscle des jambes chez des seniors, dans une petite étude. Un mélange d'acides aminés équivalent, non."
    pt:
      title: "15 g de whey"
      body: "Aumentaram a síntese muscular nas pernas de idosos, num estudo pequeno. Uma mistura de aminoácidos igual não."
    tr:
      title: "15 g whey"
      body: "Küçük bir çalışmada yaşlıların bacağında kas yapımını artırdı. Ona denk bir amino asit karışımı artırmadı."

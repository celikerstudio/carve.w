article: rpe
emoji: "📶"
tips:
  - key: wat-is-rpe
    kind: fact
    en:
      title: "1 to 10"
      body: "That's the RPE scale for how hard a set feels. It's often tied to how many reps you had left."
    nl:
      title: "1 tot 10"
      body: "Dat is de RPE-schaal voor hoe zwaar een set voelt. Vaak gekoppeld aan hoeveel herhalingen je nog had."
    de:
      title: "1 bis 10"
      body: "Das ist die RPE-Skala dafür, wie hart ein Satz ist. Oft gekoppelt an die Wiederholungen, die noch gingen."
    es:
      title: "1 a 10"
      body: "Es la escala RPE de lo duro que se siente una serie. Suele ir ligada a las repeticiones que te quedaban."
    fr:
      title: "1 à 10"
      body: "C'est l'échelle RPE de la difficulté d'une série. Souvent liée aux reps qu'il te restait."
    pt:
      title: "1 a 10"
      body: "É a escala RPE para o esforço de uma série. Costuma estar ligada às repetições que ainda tinhas."
    tr:
      title: "1-10"
      body: "Setin ne kadar zor geldiğini ölçen RPE ölçeği. Çoğu zaman kaç tekrarın kaldığına bağlanır."

  - key: hoe-zwaar-genoeg
    kind: fact
    en:
      title: "2 to 3 reps left"
      body: "Or near failure: that's high effort, the ACSM says. Make most of your sets that hard."
    nl:
      title: "2 à 3 over"
      body: "Of vlak bij falen: dat is flinke inzet, zegt de ACSM. Maak de meeste sets zo zwaar."
    de:
      title: "2 bis 3 übrig"
      body: "Oder nah am Versagen: das ist hoher Einsatz, sagt das ACSM. Mach die meisten Sätze so hart."
    es:
      title: "2 o 3 en reserva"
      body: "O cerca del fallo: eso es esfuerzo alto, dice el ACSM. Haz así de duras casi todas tus series."
    fr:
      title: "2 à 3 en réserve"
      body: "Ou près de l'échec : c'est un gros effort, dit l'ACSM. Rends la plupart de tes séries aussi dures."
    pt:
      title: "2 a 3 de reserva"
      body: "Ou perto da falha: isso é esforço alto, diz o ACSM. Faz a maioria das séries assim."
    tr:
      title: "2-3 tekrar kala"
      body: "Ya da tükenişe yakın: ACSM'ye göre bu yüksek efor. Setlerinin çoğunu bu kadar zor yap."

  - key: geen-exact-getal
    kind: myth
    en:
      title: "The right RPE"
      body: "Myth: there's one right RPE. Evidence for an exact target is lacking, says the ACSM. Use it as a guide."
    nl:
      title: "De juiste RPE"
      body: "Mythe: er is één juiste RPE. Bewijs voor een exact doel ontbreekt, zegt de ACSM. Gebruik het als richting."
    de:
      title: "Die richtige RPE"
      body: "Mythos: Es gibt die eine richtige RPE. Für einen exakten Wert fehlen Belege, so das ACSM. Nimm es als Richtwert."
    es:
      title: "El RPE correcto"
      body: "Mito: hay un RPE correcto. Faltan pruebas para una cifra exacta, dice el ACSM. Úsalo como guía."
    fr:
      title: "Le bon RPE"
      body: "Mythe : il existe un bon RPE. Pas de preuve pour un chiffre exact, dit l'ACSM. Sers-t'en comme repère."
    pt:
      title: "O RPE certo"
      body: "Mito: há um RPE certo. Faltam provas para um valor exato, diz o ACSM. Usa-o como guia."
    tr:
      title: "Doğru RPE"
      body: "Efsane: tek bir doğru RPE var. ACSM'ye göre kesin bir hedef için kanıt yok. Yol gösterici olarak kullan."

  - key: niet-elke-set-falen
    kind: myth
    en:
      title: "Every set"
      body: "Myth: push every set to failure. The ACSM found no extra strength, muscle or power. Unwise for some, like older adults."
    nl:
      title: "Elke set"
      body: "Mythe: elke set tot falen. De ACSM zag geen extra kracht, spier of explosiviteit. Voor ouderen mogelijk onverstandig."
    de:
      title: "Jeder Satz"
      body: "Mythos: Jeder Satz bis zum Versagen. Das ACSM fand keinen Extra-Nutzen. Für manche, etwa Ältere, eher unklug."
    es:
      title: "Cada serie"
      body: "Mito: lleva cada serie al fallo. El ACSM no vio más fuerza, músculo ni potencia. Poco sensato para mayores."
    fr:
      title: "Chaque série"
      body: "Mythe : chaque série à l'échec. L'ACSM n'a vu aucun gain en plus. Peu sage pour certains, comme les seniors."
    pt:
      title: "Cada série"
      body: "Mito: leva cada série à falha. O ACSM não viu mais força, músculo ou potência. Pouco sensato para idosos."
    tr:
      title: "Her set"
      body: "Efsane: her seti tükenişe götür. ACSM ek güç, kas ya da patlayıcılık bulmadı. Yaşlılar için akıllıca olmayabilir."

  - key: voor-wie
    kind: fact
    en:
      title: "18 and up"
      body: "Healthy adults are who the ACSM advice is for. Much of its evidence comes from people with little experience."
    nl:
      title: "18 en ouder"
      body: "Voor gezonde volwassenen is het ACSM-advies bedoeld. Veel bewijs komt van mensen met weinig trainingservaring."
    de:
      title: "Ab 18"
      body: "Für gesunde Erwachsene ist der ACSM-Rat gedacht. Viele Belege stammen von Menschen mit wenig Erfahrung."
    es:
      title: "Desde los 18"
      body: "El consejo del ACSM es para adultos sanos. Mucha de su evidencia viene de gente con poca experiencia."
    fr:
      title: "Dès 18 ans"
      body: "Le conseil de l'ACSM vise les adultes en bonne santé. Une bonne part des preuves vient de débutants."
    pt:
      title: "A partir dos 18"
      body: "O conselho do ACSM é para adultos saudáveis. Muita da evidência vem de pessoas com pouca experiência."
    tr:
      title: "18 ve üstü"
      body: "ACSM önerisi sağlıklı yetişkinler için. Kanıtların çoğu az deneyimli kişilerden geliyor."

article: injury-prevention
emoji: "🩹"
tips:
  - key: geen-richtlijn
    kind: fact
    en:
      title: "No guideline"
      body: "The ACSM's 2026 stand on strength training has no advice aimed at preventing injuries."
    nl:
      title: "Geen richtlijn"
      body: "Het ACSM-standpunt van 2026 over krachttraining geeft geen advies gericht op blessurepreventie."
    de:
      title: "Keine Leitlinie"
      body: "Die ACSM-Stellungnahme 2026 zum Krafttraining enthält keinen Rat zur Verletzungsvorbeugung."
    es:
      title: "Sin guía"
      body: "La postura del ACSM de 2026 sobre fuerza no da ningún consejo para prevenir lesiones."
    fr:
      title: "Pas de consigne"
      body: "La prise de position ACSM 2026 sur la muscu ne donne aucun conseil contre les blessures."
    pt:
      title: "Sem orientação"
      body: "A posição do ACSM de 2026 sobre força não dá nenhum conselho para prevenir lesões."
    tr:
      title: "Rehber yok"
      body: "ACSM'nin 2026 kuvvet antrenmanı bildirgesinde sakatlık önlemeye yönelik bir öneri yok."

  - key: krachttraining-is-veilig
    kind: myth
    en:
      title: "Risky"
      body: "Myth: lifting is a risky sport. The ACSM calls it safe at all ages. Minor complaints matched aerobic exercise."
    nl:
      title: "Riskant"
      body: "Mythe: krachttraining is riskant. De ACSM noemt het veilig op elke leeftijd. Kleine klachten: net als bij cardio."
    de:
      title: "Riskant"
      body: "Mythos: Krafttraining ist riskant. Das ACSM nennt es in jedem Alter sicher. Kleine Beschwerden wie bei Ausdauer."
    es:
      title: "Arriesgado"
      body: "Mito: levantar pesas es arriesgado. El ACSM lo ve seguro a cualquier edad. Las molestias, como en el cardio."
    fr:
      title: "Risqué"
      body: "Mythe : la muscu est risquée. L'ACSM la juge sûre à tout âge. Petits bobos : pareil qu'en cardio."
    pt:
      title: "Arriscado"
      body: "Mito: o treino de força é arriscado. O ACSM considera-o seguro em qualquer idade. Queixas como no cardio."
    tr:
      title: "Riskli"
      body: "Efsane: ağırlık riskli bir spor. ACSM her yaşta güvenli diyor. Küçük şikâyetler kardiyo ile aynı."

  - key: belastingbeheer
    kind: fact
    en:
      title: "Load management"
      body: "Poor load management is a big injury risk in elite athletes, says the IOC. How that carries to the gym is unclear."
    nl:
      title: "Belasting"
      body: "Slecht beheerde belasting is een groot blessurerisico bij topsporters, zegt het IOC. Voor de gym is dat onduidelijk."
    de:
      title: "Belastung"
      body: "Schlecht gesteuerte Belastung ist laut IOC ein großes Risiko bei Spitzensportlern. Fürs Gym ist das unklar."
    es:
      title: "Gestión de carga"
      body: "Gestionar mal la carga es un gran riesgo de lesión en la élite, dice el COI. En el gym no está claro."
    fr:
      title: "Gestion de charge"
      body: "Mal gérer la charge est un gros risque de blessure chez l'élite, dit le CIO. En salle, c'est flou."
    pt:
      title: "Gestão de carga"
      body: "Gerir mal a carga é um grande risco de lesão na elite, diz o COI. No ginásio não é claro."
    tr:
      title: "Yük yönetimi"
      body: "IOC'ye göre kötü yük yönetimi elit sporcularda büyük sakatlık riski. Salona ne kadar uyduğu belirsiz."

  - key: geleidelijk-opbouwen
    kind: fact
    en:
      title: "Build up slowly"
      body: "Raising intensity and volume gradually may reduce risk, says the ACSM. Controlled studies are lacking."
    nl:
      title: "Geleidelijk opbouwen"
      body: "Intensiteit en volume geleidelijk opvoeren verkleint mogelijk het risico, zegt de ACSM. Harde studies ontbreken."
    de:
      title: "Langsam steigern"
      body: "Intensität und Volumen schrittweise zu steigern senkt womöglich das Risiko, so das ACSM. Belege fehlen."
    es:
      title: "Sube poco a poco"
      body: "Subir intensidad y volumen gradualmente quizá baje el riesgo, dice el ACSM. Faltan estudios controlados."
    fr:
      title: "Monte doucement"
      body: "Augmenter intensité et volume petit à petit réduit peut-être le risque, dit l'ACSM. Sans preuve solide."
    pt:
      title: "Sobe aos poucos"
      body: "Aumentar intensidade e volume aos poucos talvez reduza o risco, diz o ACSM. Faltam estudos controlados."
    tr:
      title: "Yavaş artır"
      body: "ACSM'ye göre yoğunluk ve hacmi kademeli artırmak riski azaltabilir. Kontrollü çalışma eksik."

  - key: een-ding-tegelijk
    kind: fact
    en:
      title: "One at a time"
      body: "Raise load, sets or reps in small steps, one at a time. No sudden jumps like doubling your sets in a week."
    nl:
      title: "Eén ding tegelijk"
      body: "Verhoog gewicht, sets of herhalingen in kleine stapjes, één tegelijk. Geen sprong als je sets verdubbelen."
    de:
      title: "Eins nach dem anderen"
      body: "Steigere Gewicht, Sätze oder Wiederholungen in kleinen Schritten, einzeln. Keine Sprünge wie doppelte Sätze."
    es:
      title: "Una cosa cada vez"
      body: "Sube peso, series o repeticiones en pasos pequeños, de uno en uno. Nada de doblar series en una semana."
    fr:
      title: "Une chose à la fois"
      body: "Monte charge, séries ou reps par petits pas, un seul à la fois. Pas de saut comme doubler tes séries."
    pt:
      title: "Uma coisa de cada vez"
      body: "Sobe peso, séries ou repetições aos poucos, uma de cada vez. Nada de dobrar as séries numa semana."
    tr:
      title: "Tek seferde bir şey"
      body: "Ağırlığı, seti ya da tekrarı küçük adımlarla, birer birer artır. Seti bir haftada ikiye katlamak gibi sıçrama yok."

  - key: rekken-tegen-blessures
    kind: myth
    en:
      title: "Stretching"
      body: "Myth: stretching prevents injuries. Experts don't recommend it for that. Fewer muscle injuries may mean more joint ones."
    nl:
      title: "Rekken"
      body: "Mythe: rekken voorkomt blessures. Experts raden het daar niet voor aan. Mogelijk ruil je spier- voor gewrichtsletsel."
    de:
      title: "Dehnen"
      body: "Mythos: Dehnen verhindert Verletzungen. Fachleute raten es dafür nicht. Weniger Muskel-, eventuell mehr Gelenkschäden."
    es:
      title: "Estirar"
      body: "Mito: estirar previene lesiones. Los expertos no lo aconsejan. Quizá cambie lesiones musculares por articulares."
    fr:
      title: "S'étirer"
      body: "Mythe : s'étirer évite les blessures. Pas conseillé pour ça. Moins de lésions musculaires, peut-être plus articulaires."
    pt:
      title: "Alongar"
      body: "Mito: alongar previne lesões. Os especialistas não o aconselham. Talvez troque lesões musculares por articulares."
    tr:
      title: "Esneme"
      body: "Efsane: esneme sakatlığı önler. Uzmanlar bunun için önermiyor. Daha az kas, belki daha çok eklem sakatlığı."

  - key: krachttraining-helpt
    kind: fact
    en:
      title: "Strength work"
      body: "Has benefits for injury prevention in sport, notes an expert panel on stretching. A remark, with no dose given."
    nl:
      title: "Krachttraining"
      body: "Heeft voordelen voor blessurepreventie in sport, merkt een expertpanel op. Een opmerking, zonder dosis."
    de:
      title: "Krafttraining"
      body: "Hat Vorteile für die Verletzungsvorbeugung im Sport, merkt ein Expertengremium an. Ohne Dosisangabe."
    es:
      title: "Trabajo de fuerza"
      body: "Tiene beneficios para prevenir lesiones en el deporte, señala un panel de expertos. Sin dosis concreta."
    fr:
      title: "Le renforcement"
      body: "Aide à prévenir les blessures en sport, note un panel d'experts. Une remarque, sans dose précise."
    pt:
      title: "Treino de força"
      body: "Tem benefícios para prevenir lesões no desporto, nota um painel de especialistas. Sem dose indicada."
    tr:
      title: "Kuvvet çalışması"
      body: "Bir uzman paneline göre sporda sakatlık önlemeye faydası var. Bir not, doz verilmemiş."

  - key: tot-falen-ouderen
    kind: fact
    en:
      title: "Failure when older"
      body: "Lifting to failure may be unwise for older people, says the ACSM, because poor form raises injury risk."
    nl:
      title: "Falen op leeftijd"
      body: "Tot falen trainen is voor ouderen misschien onverstandig, zegt de ACSM, want slechte vorm vergroot het risico."
    de:
      title: "Versagen im Alter"
      body: "Bis zum Versagen ist für Ältere eventuell unklug, so das ACSM, weil schlechte Technik das Risiko erhöht."
    es:
      title: "Fallo y edad"
      body: "Llegar al fallo quizá no convenga a personas mayores, dice el ACSM: la mala técnica sube el riesgo."
    fr:
      title: "Échec et âge"
      body: "Aller à l'échec n'est peut-être pas sage chez les seniors, dit l'ACSM : une technique dégradée accroît le risque."
    pt:
      title: "Falha e idade"
      body: "Ir até à falha talvez não seja sensato em idosos, diz o ACSM: má técnica aumenta o risco."
    tr:
      title: "Yaşlılıkta tükeniş"
      body: "ACSM'ye göre yaşlılarda tükenişe kadar çalışmak akıllıca olmayabilir, bozuk form riski artırır."

  - key: techniek-niet-getoetst
    kind: myth
    en:
      title: "Perfect form"
      body: "Myth: good form is proven to stop injuries. No source here tested that. Learning a lift light first is still sound."
    nl:
      title: "Perfecte techniek"
      body: "Mythe: goede techniek voorkomt bewezen blessures. Geen bron hier toetste dat. Eerst licht leren blijft verstandig."
    de:
      title: "Perfekte Technik"
      body: "Mythos: Gute Technik verhindert nachweislich Verletzungen. Keine Quelle hier prüfte das. Erst leicht lernen bleibt klug."
    es:
      title: "Técnica perfecta"
      body: "Mito: está probado que la buena técnica evita lesiones. Ninguna fuente lo probó. Aprender ligero sigue siendo sensato."
    fr:
      title: "Technique parfaite"
      body: "Mythe : une bonne technique évite les blessures, c'est prouvé. Rien ne l'a testé. Apprendre léger reste sage."
    pt:
      title: "Técnica perfeita"
      body: "Mito: está provado que boa técnica evita lesões. Nenhuma fonte testou isso. Aprender leve continua sensato."
    tr:
      title: "Kusursuz teknik"
      body: "Efsane: iyi tekniğin sakatlığı önlediği kanıtlı. Hiçbir kaynak bunu test etmedi. Önce hafifle öğrenmek yine mantıklı."

  - key: pijn-die-blijft
    kind: fact
    en:
      title: "Lasting pain"
      body: "Something hurts and won't settle? Do less and see a doctor or physio rather than training through it."
    nl:
      title: "Pijn die blijft"
      body: "Doet iets pijn en gaat het niet over? Doe minder en ga naar een arts of fysio, in plaats van door te trainen."
    de:
      title: "Anhaltender Schmerz"
      body: "Tut etwas weh und wird nicht besser? Mach weniger und geh zum Arzt oder Physio, statt durchzutrainieren."
    es:
      title: "Dolor que no se va"
      body: "¿Algo duele y no mejora? Haz menos y ve al médico o fisio en vez de entrenar con dolor."
    fr:
      title: "Douleur qui dure"
      body: "Une douleur qui ne passe pas ? Fais moins et vois un médecin ou un kiné plutôt que de forcer."
    pt:
      title: "Dor que não passa"
      body: "Algo dói e não melhora? Faz menos e vai ao médico ou fisio em vez de treinar com dor."
    tr:
      title: "Geçmeyen ağrı"
      body: "Bir yer ağrıyor ve geçmiyorsa daha az yap, üstüne çalışmak yerine doktora ya da fizyoterapiste git."

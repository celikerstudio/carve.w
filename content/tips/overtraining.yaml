article: overtraining
emoji: "🥵"
tips:
  - key: de-combinatie
    kind: fact
    en:
      title: "Too little recovery"
      body: "Hard training isn't the problem. Too much overload combined with too little recovery is."
    nl:
      title: "Te weinig herstel"
      body: "Hard trainen is het probleem niet. Te veel belasting in combinatie met te weinig herstel wel."
    de:
      title: "Zu wenig Erholung"
      body: "Hartes Training ist nicht das Problem. Zu viel Belastung plus zu wenig Erholung schon."
    es:
      title: "Poca recuperación"
      body: "Entrenar duro no es el problema. Demasiada carga con poca recuperación, sí."
    fr:
      title: "Trop peu de récup"
      body: "S'entraîner dur n'est pas le problème. Trop de charge avec trop peu de récupération, si."
    pt:
      title: "Pouca recuperação"
      body: "Treinar forte não é o problema. Carga a mais com recuperação a menos, sim."
    tr:
      title: "Az toparlanma"
      body: "Sert antrenman sorun değil. Fazla yükle birlikte az toparlanma sorun."

  - key: functionele-overreaching
    kind: fact
    en:
      title: "A short dip"
      body: "After hard training, it can turn into better performance once you've recovered. Evidence for that is limited."
    nl:
      title: "Korte dip"
      body: "Na zware training kan die omslaan in betere prestaties als je hersteld bent. Het bewijs daarvoor is beperkt."
    de:
      title: "Kurzes Tief"
      body: "Nach hartem Training kann es nach der Erholung in bessere Leistung umschlagen. Belege dafür sind dünn."
    es:
      title: "Bajón corto"
      body: "Tras entrenar duro, puede convertirse en mejor rendimiento al recuperarte. Hay pocas pruebas de ello."
    fr:
      title: "Petit creux"
      body: "Après un entraînement dur, il peut se muer en meilleure perf une fois récupéré. Les preuves sont minces."
    pt:
      title: "Quebra curta"
      body: "Depois de treino duro, pode virar melhor rendimento ao recuperares. Há poucas provas disso."
    tr:
      title: "Kısa düşüş"
      body: "Sert antrenmandan sonra toparlanınca daha iyi performansa dönebilir. Bunun kanıtı sınırlı."

  - key: weken-of-maanden
    kind: fact
    en:
      title: "Weeks or months"
      body: "That's how long nonfunctional overreaching takes to clear. A short dip clears in about two weeks."
    nl:
      title: "Weken of maanden"
      body: "Zo lang duurt herstel van niet-functionele overbelasting. Een korte dip trekt in zo'n twee weken weg."
    de:
      title: "Wochen oder Monate"
      body: "So lange braucht nicht-funktionelles Overreaching. Ein kurzes Tief ist nach etwa zwei Wochen weg."
    es:
      title: "Semanas o meses"
      body: "Es lo que tarda en pasar la sobrecarga no funcional. Un bajón corto se va en unas dos semanas."
    fr:
      title: "Semaines ou mois"
      body: "C'est le temps pour sortir d'un surmenage non fonctionnel. Un petit creux passe en deux semaines environ."
    pt:
      title: "Semanas ou meses"
      body: "É o que demora a passar a sobrecarga não funcional. Uma quebra curta passa em cerca de duas semanas."
    tr:
      title: "Haftalar ya da aylar"
      body: "İşlevsel olmayan aşırı yüklenme bu kadar sürede geçer. Kısa düşüş yaklaşık iki haftada geçer."

  - key: zelden-bij-krachtsport
    kind: myth
    en:
      title: "47 articles"
      body: "Myth: lifters often get overtrained. A review found minimal evidence of true overtraining in strength training."
    nl:
      title: "47 artikelen"
      body: "Mythe: krachtsporters raken vaak overtraind. Een review vond nauwelijks bewijs voor echte overtraining bij krachtsport."
    de:
      title: "47 Artikel"
      body: "Mythos: Kraftsportler sind oft übertrainiert. Eine Übersicht fand kaum Belege für echtes Übertraining im Kraftsport."
    es:
      title: "47 artículos"
      body: "Mito: con pesas te sobreentrenas a menudo. Una revisión apenas halló pruebas de sobreentrenamiento real."
    fr:
      title: "47 articles"
      body: "Mythe : en muscu, on est souvent surentraîné. Une revue n'a trouvé presque aucune preuve de vrai surentraînement."
    pt:
      title: "47 artigos"
      body: "Mito: quem treina força fica muitas vezes sobretreinado. Uma revisão quase não achou provas disso."
    tr:
      title: "47 makale"
      body: "Efsane: ağırlık çalışanlar sık sık aşırı antrenmana girer. Bir derleme gerçek aşırı antrenmana dair çok az kanıt buldu."

  - key: kracht-als-laatste
    kind: fact
    en:
      title: "Max strength"
      body: "Is one of the last things to drop with too much heavy volume. Speed and power go among the first."
    nl:
      title: "Maximale kracht"
      body: "Is een van de laatste dingen die zakken bij te veel zwaar volume. Snelheid en explosiviteit gaan als eerste."
    de:
      title: "Maximalkraft"
      body: "Sinkt bei zu viel schwerem Volumen als eines der Letzten. Tempo und Schnellkraft gehen zuerst."
    es:
      title: "Fuerza máxima"
      body: "Es de lo último en caer con demasiado volumen pesado. La velocidad y la potencia caen antes."
    fr:
      title: "Force max"
      body: "C'est l'une des dernières à baisser avec trop de volume lourd. Vitesse et puissance partent en premier."
    pt:
      title: "Força máxima"
      body: "É das últimas a cair com volume pesado a mais. A velocidade e a potência caem primeiro."
    tr:
      title: "Maksimum güç"
      body: "Fazla ağır hacimde en son düşenlerden biri. Hız ve patlayıcılık ilk gidenlerden."

  - key: niet-elke-slechte-week
    kind: myth
    en:
      title: "Bad week"
      body: "Myth: a bad week means you're overtrained. Most bad weeks are just bad weeks."
    nl:
      title: "Slechte week"
      body: "Mythe: een slechte week betekent overtraind. De meeste slechte weken zijn gewoon slechte weken."
    de:
      title: "Schlechte Woche"
      body: "Mythos: Eine schlechte Woche heißt übertrainiert. Meist ist es einfach eine schlechte Woche."
    es:
      title: "Mala semana"
      body: "Mito: una mala semana es sobreentrenamiento. Casi siempre es solo una mala semana."
    fr:
      title: "Mauvaise semaine"
      body: "Mythe : une mauvaise semaine, c'est du surentraînement. La plupart sont juste de mauvaises semaines."
    pt:
      title: "Semana má"
      body: "Mito: uma semana má é sobretreino. Quase sempre é só uma semana má."
    tr:
      title: "Kötü hafta"
      body: "Efsane: kötü bir hafta aşırı antrenman demek. Çoğu kötü hafta sadece kötü bir haftadır."

  - key: niet-alleen-training
    kind: myth
    en:
      title: "Not just training"
      body: "Myth: overtraining is just too much training. Stress from work or family and poor sleep can play a part."
    nl:
      title: "Niet alleen training"
      body: "Mythe: overtraining is gewoon te veel trainen. Stress van werk of thuis en slecht slapen kunnen meespelen."
    de:
      title: "Nicht nur Training"
      body: "Mythos: Übertraining ist nur zu viel Training. Stress in Job oder Familie und schlechter Schlaf spielen mit."
    es:
      title: "No solo entreno"
      body: "Mito: el sobreentrenamiento es solo entrenar de más. El estrés del trabajo o la familia y dormir mal influyen."
    fr:
      title: "Pas que l'entraînement"
      body: "Mythe : le surentraînement, c'est trop s'entraîner. Stress du travail, famille et mauvais sommeil jouent."
    pt:
      title: "Não só treino"
      body: "Mito: sobretreino é só treinar demais. Stress do trabalho ou da família e dormir mal também contam."
    tr:
      title: "Sadece antrenman değil"
      body: "Efsane: aşırı antrenman sadece çok çalışmaktır. İş ya da aile stresi ve kötü uyku da rol oynar."

  - key: eerst-uitsluiten
    kind: fact
    en:
      title: "Rule it out"
      body: "Before calling it overtraining, check for a calorie deficit, too few carbs or protein, or low iron."
    nl:
      title: "Eerst uitsluiten"
      body: "Voor je het overtraining noemt: check op een tekort, te weinig koolhydraten of eiwit, of ijzertekort."
    de:
      title: "Erst ausschließen"
      body: "Bevor du es Übertraining nennst, prüf Defizit, zu wenig Kohlenhydrate oder Protein und Eisenmangel."
    es:
      title: "Descarta antes"
      body: "Antes de llamarlo sobreentrenamiento, mira si hay déficit, pocos hidratos o proteína, o falta de hierro."
    fr:
      title: "Écarte d'abord"
      body: "Avant de parler de surentraînement, vérifie déficit, manque de glucides ou protéines, ou de fer."
    pt:
      title: "Exclui primeiro"
      body: "Antes de lhe chamar sobretreino, vê se há défice, poucos hidratos ou proteína, ou falta de ferro."
    tr:
      title: "Önce ele"
      body: "Aşırı antrenman demeden önce kalori açığı, az karbonhidrat ya da protein ve demir eksikliğine bak."

  - key: ziek-terugschakelen
    kind: fact
    en:
      title: "When ill"
      body: "Stop or cut back training during an infection, and take time to recover afterwards."
    nl:
      title: "Als je ziek bent"
      body: "Stop of train minder tijdens een infectie, en neem daarna de tijd om te herstellen."
    de:
      title: "Wenn du krank bist"
      body: "Hör auf oder trainier weniger bei einer Infektion und nimm dir danach Zeit zur Erholung."
    es:
      title: "Si estás enfermo"
      body: "Para o reduce el entreno durante una infección, y tómate tiempo para recuperarte después."
    fr:
      title: "Malade"
      body: "Arrête ou réduis l'entraînement pendant une infection, et prends le temps de récupérer ensuite."
    pt:
      title: "Doente"
      body: "Para ou reduz o treino durante uma infeção, e dá tempo para recuperar depois."
    tr:
      title: "Hastayken"
      body: "Enfeksiyon sırasında antrenmanı bırak ya da azalt, sonra toparlanmak için zaman ayır."

  - key: naar-de-dokter
    kind: fact
    en:
      title: "Flat for weeks"
      body: "Worn out and performing worse for weeks despite rest? See a doctor to look for other causes."
    nl:
      title: "Weken leeg"
      body: "Weken uitgeput en slechter presteren ondanks rust? Ga naar een arts om andere oorzaken te zoeken."
    de:
      title: "Wochenlang platt"
      body: "Wochenlang erschöpft und schwächer trotz Ruhe? Geh zum Arzt, um andere Ursachen zu suchen."
    es:
      title: "Semanas sin fuerza"
      body: "¿Semanas agotado y rindiendo peor pese al descanso? Ve al médico para buscar otras causas."
    fr:
      title: "À plat des semaines"
      body: "Épuisé et moins performant depuis des semaines malgré le repos ? Vois un médecin."
    pt:
      title: "Semanas sem forças"
      body: "Semanas esgotado e a render pior apesar do descanso? Vai ao médico procurar outras causas."
    tr:
      title: "Haftalardır bitkin"
      body: "Dinlenmeye rağmen haftalardır yorgun ve performansın düşükse diğer sebepler için doktora git."

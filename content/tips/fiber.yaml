article: fiber
emoji: "🥦"
tips:
  - key: hoeveel-vezels
    kind: fact
    en:
      title: "25 g"
      body: "Fibre a day for adults, say WHO and EFSA. The Netherlands advises at least 30 g for men, 24 g for women."
    nl:
      title: "30 gram"
      body: "Vezels per dag minimaal voor mannen, 24 gram voor vrouwen, adviseert Nederland. WHO en EFSA zeggen 25 gram."
    de:
      title: "25 g"
      body: "Ballaststoffe am Tag für Erwachsene, sagen WHO und EFSA. Die Niederlande raten Männern zu 30 g, Frauen zu 24 g."
    es:
      title: "25 g"
      body: "De fibra al día para adultos, según la OMS y la EFSA. Países Bajos aconseja 30 g a hombres y 24 g a mujeres."
    fr:
      title: "25 g"
      body: "De fibres par jour pour un adulte, selon l'OMS et l'EFSA. Les Pays-Bas visent 30 g pour les hommes, 24 pour les femmes."
    pt:
      title: "25 g"
      body: "De fibra por dia para adultos, dizem a OMS e a EFSA. Os Países Baixos aconselham 30 g a homens e 24 g a mulheres."
    tr:
      title: "25 g"
      body: "DSÖ ve EFSA'ya göre yetişkine günlük lif. Hollanda erkeğe en az 30 g, kadına 24 g öneriyor."

  - key: per-duizend-kcal
    kind: fact
    en:
      title: "12.6 to 14.6 g"
      body: "Fibre per 1,000 kcal. At 2,000 kcal that's about 25 to 29 g a day."
    nl:
      title: "12,6 tot 14,6 gram"
      body: "Vezels per 1.000 kcal. Bij 2.000 kcal is dat zo'n 25 tot 29 gram per dag."
    de:
      title: "12,6 bis 14,6 g"
      body: "Ballaststoffe pro 1.000 kcal. Bei 2.000 kcal sind das etwa 25 bis 29 g am Tag."
    es:
      title: "12,6 a 14,6 g"
      body: "De fibra por cada 1.000 kcal. Con 2.000 kcal son unos 25 a 29 g al día."
    fr:
      title: "12,6 à 14,6 g"
      body: "De fibres pour 1 000 kcal. À 2 000 kcal, ça fait environ 25 à 29 g par jour."
    pt:
      title: "12,6 a 14,6 g"
      body: "De fibra por cada 1.000 kcal. Com 2.000 kcal são cerca de 25 a 29 g por dia."
    tr:
      title: "12,6-14,6 g"
      body: "1.000 kcal başına lif. 2.000 kcal'de günde yaklaşık 25-29 g."

  - key: actief-meer-vezels
    kind: fact
    en:
      title: "40 to 47 g"
      body: "Fibre a day for an active Dutch man aged 18 to 29. Lightly active: 31 to 37 g."
    nl:
      title: "40 tot 47 gram"
      body: "Vezels per dag voor een actieve man van 18 tot 29. Licht actief: 31 tot 37 gram."
    de:
      title: "40 bis 47 g"
      body: "Ballaststoffe am Tag für einen aktiven Mann von 18 bis 29, laut niederländischem Rat. Leicht aktiv: 31 bis 37 g."
    es:
      title: "40 a 47 g"
      body: "De fibra al día para un hombre activo de 18 a 29 años, según Países Bajos. Poco activo: 31 a 37 g."
    fr:
      title: "40 à 47 g"
      body: "De fibres par jour pour un homme actif de 18 à 29 ans, aux Pays-Bas. Peu actif : 31 à 37 g."
    pt:
      title: "40 a 47 g"
      body: "De fibra por dia para um homem ativo de 18 a 29 anos, nos Países Baixos. Pouco ativo: 31 a 37 g."
    tr:
      title: "40-47 g"
      body: "Hollanda'da 18-29 yaş aktif bir erkeğe önerilen günlük lif. Az aktifse 31-37 g."

  - key: wat-vezels-doen
    kind: fact
    en:
      title: "Lower blood pressure"
      body: "More fibre went with lower weight, blood pressure and cholesterol, in trials with healthy adults."
    nl:
      title: "Lagere bloeddruk"
      body: "Meer vezels ging samen met lager gewicht, lagere bloeddruk en lager cholesterol, bij gezonde volwassenen."
    de:
      title: "Niedrigerer Blutdruck"
      body: "Mehr Ballaststoffe gingen mit weniger Gewicht, Blutdruck und Cholesterin einher, bei Gesunden."
    es:
      title: "Menos tensión"
      body: "Más fibra fue de la mano de menos peso, tensión y colesterol, en ensayos con adultos sanos."
    fr:
      title: "Tension plus basse"
      body: "Plus de fibres allait avec moins de poids, de tension et de cholestérol, chez des adultes sains."
    pt:
      title: "Tensão mais baixa"
      body: "Mais fibra andou de mãos dadas com menos peso, tensão e colesterol, em adultos saudáveis."
    tr:
      title: "Daha düşük tansiyon"
      body: "Sağlıklı yetişkinlerde daha çok lif, daha düşük kilo, tansiyon ve kolesterolle birlikte görüldü."

  - key: vezels-laten-afvallen
    kind: myth
    en:
      title: "Weight loss"
      body: "Myth: fibre makes you lose weight. In trials the effect on bodyweight was small. It helps, it's no fix."
    nl:
      title: "Afvallen"
      body: "Mythe: van vezels val je af. In studies was het effect op gewicht klein. Het helpt, het is geen oplossing."
    de:
      title: "Abnehmen"
      body: "Mythos: Ballaststoffe lassen dich abnehmen. In Studien war der Effekt aufs Gewicht klein. Hilft, löst es nicht."
    es:
      title: "Adelgazar"
      body: "Mito: la fibra te hace adelgazar. En los ensayos el efecto en el peso fue pequeño. Ayuda, no lo resuelve."
    fr:
      title: "Maigrir"
      body: "Mythe : les fibres font maigrir. Dans les essais, l'effet sur le poids était faible. Ça aide, sans tout régler."
    pt:
      title: "Emagrecer"
      body: "Mito: a fibra faz emagrecer. Nos ensaios o efeito no peso foi pequeno. Ajuda, não resolve."
    tr:
      title: "Kilo vermek"
      body: "Efsane: lif kilo verdirir. Çalışmalarda kiloya etkisi küçüktü. Yardım eder, çözüm değildir."

  - key: stroperige-vezels
    kind: fact
    en:
      title: "59%"
      body: "Of tests showed thick fibres like pectin and beta-glucans curbing appetite. Thinner fibres: 14%."
    nl:
      title: "59%"
      body: "Van de tests liet zien dat stroperige vezels zoals pectine en bètaglucanen de eetlust remden. Dunnere: 14%."
    de:
      title: "59 %"
      body: "Der Tests zeigten, dass zähe Fasern wie Pektin und Beta-Glucane den Appetit bremsten. Dünnere: 14 %."
    es:
      title: "59 %"
      body: "De las pruebas vieron que fibras espesas como pectina y betaglucanos frenaban el apetito. Las finas: 14 %."
    fr:
      title: "59 %"
      body: "Des tests ont vu des fibres visqueuses comme la pectine et les bêta-glucanes freiner l'appétit. Les fluides : 14 %."
    pt:
      title: "59%"
      body: "Dos testes viram fibras espessas como pectina e betaglucanos travar o apetite. As mais finas: 14%."
    tr:
      title: "%59"
      body: "Testlerin bu kadarında pektin ve beta-glukan gibi koyu lifler iştahı azalttı. Daha akışkanlarda %14."

  - key: vezelsupplement
    kind: myth
    en:
      title: "Fibre supplement"
      body: "Myth: a fibre supplement works just as well. Most research is on foods like whole grains, pulses and veg."
    nl:
      title: "Vezelsupplement"
      body: "Mythe: een vezelsupplement werkt net zo goed. Het meeste onderzoek gaat over volkoren, peulvruchten en groente."
    de:
      title: "Ballaststoffpulver"
      body: "Mythos: Ein Faserpräparat wirkt genauso. Die meisten Studien gehen um Vollkorn, Hülsenfrüchte und Gemüse."
    es:
      title: "Suplemento de fibra"
      body: "Mito: un suplemento de fibra funciona igual. Casi todo lo estudiado son integrales, legumbres y verdura."
    fr:
      title: "Complément de fibres"
      body: "Mythe : un complément vaut autant. La plupart des études portent sur céréales complètes, légumineuses, légumes."
    pt:
      title: "Suplemento de fibra"
      body: "Mito: um suplemento de fibra funciona igual. Quase tudo o estudado são integrais, leguminosas e legumes."
    tr:
      title: "Lif takviyesi"
      body: "Efsane: lif takviyesi aynı işi görür. Araştırmaların çoğu tam tahıl, baklagil ve sebze üzerine."

  - key: rustig-opbouwen
    kind: fact
    en:
      title: "Build up slowly"
      body: "A lot of fibre at once can bring wind, cramps or constipation. Swap one thing at a time."
    nl:
      title: "Rustig opbouwen"
      body: "Veel vezels ineens kan winderigheid, krampen of verstopping geven. Ruil één ding tegelijk."
    de:
      title: "Langsam steigern"
      body: "Viele Ballaststoffe auf einmal können Blähungen, Krämpfe oder Verstopfung machen. Tausch eins nach dem anderen."
    es:
      title: "Poco a poco"
      body: "Mucha fibra de golpe puede dar gases, calambres o estreñimiento. Cambia una cosa cada vez."
    fr:
      title: "Petit à petit"
      body: "Beaucoup de fibres d'un coup peut donner gaz, crampes ou constipation. Change une chose à la fois."
    pt:
      title: "Aos poucos"
      body: "Muita fibra de uma vez pode dar gases, cólicas ou prisão de ventre. Troca uma coisa de cada vez."
    tr:
      title: "Yavaş yavaş"
      body: "Birden çok lif gaz, kramp ya da kabızlık yapabilir. Her seferinde tek bir şeyi değiştir."

  - key: vezels-en-drinken
    kind: fact
    en:
      title: "Drink up"
      body: "Fibre binds fluid. When you eat more of it, drink enough too."
    nl:
      title: "Drink genoeg"
      body: "Vezels binden vocht. Eet je er meer van, drink dan ook genoeg."
    de:
      title: "Genug trinken"
      body: "Ballaststoffe binden Flüssigkeit. Isst du mehr davon, trink auch genug."
    es:
      title: "Bebe suficiente"
      body: "La fibra retiene líquido. Si comes más, bebe también lo suficiente."
    fr:
      title: "Bois assez"
      body: "Les fibres retiennent l'eau. Si tu en manges plus, bois assez aussi."
    pt:
      title: "Bebe o suficiente"
      body: "A fibra retém líquido. Se comeres mais, bebe também o suficiente."
    tr:
      title: "Yeterince iç"
      body: "Lif sıvı tutar. Daha çok yiyorsan yeterince de su iç."

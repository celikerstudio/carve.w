article: foam-rolling
emoji: "🪵"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Foam roller"
      body: "Rolling a muscle over it eases stiffness and gives a bit more range of motion for a short while."
    nl:
      title: "Foamroller"
      body: "Een spier eroverheen rollen verlicht stijfheid en geeft even wat meer bewegingsruimte."
    de:
      title: "Faszienrolle"
      body: "Einen Muskel darüber rollen löst Steifheit und gibt kurz etwas mehr Bewegungsumfang."
    es:
      title: "Rodillo de espuma"
      body: "Pasar un músculo por él alivia la rigidez y da algo más de movilidad durante un rato."
    fr:
      title: "Rouleau de massage"
      body: "Rouler un muscle dessus détend les raideurs et donne un peu plus d'amplitude, pour un moment."
    pt:
      title: "Rolo de espuma"
      body: "Rolar um músculo nele alivia a rigidez e dá um pouco mais de amplitude por um tempo."
    tr:
      title: "Köpük rulo"
      body: "Kası üzerinde yuvarlamak tutukluğu azaltır ve kısa süreliğine biraz daha hareket açıklığı verir."

  - key: dertig-tot-negentig-seconden
    kind: fact
    en:
      title: "30 to 90 seconds"
      body: "Per muscle before lifting is enough. 5 to 10 minutes covers quads, glutes and lats."
    nl:
      title: "30 tot 90 seconden"
      body: "Per spier voor de training is genoeg. In 5 tot 10 minuten doe je quads, billen en lats."
    de:
      title: "30 bis 90 Sekunden"
      body: "Pro Muskel vor dem Training reichen. In 5 bis 10 Minuten schaffst du Quads, Po und Lat."
    es:
      title: "30 a 90 segundos"
      body: "Por músculo antes de entrenar bastan. En 5 a 10 minutos cubres cuádriceps, glúteos y dorsales."
    fr:
      title: "30 à 90 secondes"
      body: "Par muscle avant la séance, ça suffit. En 5 à 10 minutes, tu fais quadris, fessiers et dorsaux."
    pt:
      title: "30 a 90 segundos"
      body: "Por músculo antes do treino chegam. Em 5 a 10 minutos fazes quadríceps, glúteos e dorsais."
    tr:
      title: "30-90 saniye"
      body: "Antrenmandan önce kas başına yeterli. 5-10 dakikada ön bacak, kalça ve kanatları hallet."

  - key: daarna-bewegen
    kind: fact
    en:
      title: "Then move"
      body: "The extra range from rolling is temporary. Follow it with dynamic drills for that area, or you lose it."
    nl:
      title: "Daarna bewegen"
      body: "De extra ruimte van rollen is tijdelijk. Doe er dynamische oefeningen voor die plek achteraan, anders is ze weg."
    de:
      title: "Dann bewegen"
      body: "Der Gewinn vom Rollen ist vorübergehend. Häng dynamische Übungen für die Stelle dran, sonst ist er weg."
    es:
      title: "Luego muévete"
      body: "La movilidad extra del rodillo es temporal. Sigue con ejercicios dinámicos de esa zona o la pierdes."
    fr:
      title: "Puis bouge"
      body: "L'amplitude gagnée est temporaire. Enchaîne avec des exercices dynamiques pour la zone, sinon elle part."
    pt:
      title: "Depois mexe-te"
      body: "A amplitude extra do rolo é temporária. Segue com exercícios dinâmicos para essa zona ou perde-la."
    tr:
      title: "Sonra hareket et"
      body: "Rulodan gelen ekstra açıklık geçicidir. O bölge için dinamik hareketlerle devam et, yoksa kaybolur."

  - key: waarom-het-losser-voelt
    kind: fact
    en:
      title: "Looser"
      body: "Pressure may calm muscle tone and raise your stretch tolerance. That briefly adds range and eases soreness."
    nl:
      title: "Losser"
      body: "Druk dempt mogelijk spierspanning en maakt je toleranter voor rek. Dat geeft even meer ruimte en minder pijn."
    de:
      title: "Lockerer"
      body: "Druck dämpft womöglich den Muskeltonus und erhöht die Dehntoleranz. Kurz mehr Bewegung, milderer Kater."
    es:
      title: "Más suelto"
      body: "La presión quizá calme el tono muscular y aumente tu tolerancia al estiramiento. Más movilidad, menos dolor."
    fr:
      title: "Plus souple"
      body: "La pression calme peut-être le tonus et aide à tolérer l'étirement. Un peu plus d'amplitude, moins mal."
    pt:
      title: "Mais solto"
      body: "A pressão talvez acalme o tónus e aumente a tolerância ao alongamento. Mais amplitude, menos dor."
    tr:
      title: "Daha gevşek"
      body: "Baskı kas tonusunu azaltıp esnemeye toleransı artırabilir. Kısa süre daha çok açıklık, daha az ağrı."

  - key: harder-is-niet-beter
    kind: myth
    en:
      title: "Harder"
      body: "Myth: the harder you roll, the better. Too much pressure can bruise. Moderate is enough. Stay off bones and joints."
    nl:
      title: "Harder"
      body: "Mythe: hoe harder je rolt, hoe beter. Te veel druk geeft blauwe plekken. Matig is genoeg, en blijf van botten af."
    de:
      title: "Härter"
      body: "Mythos: Je fester du rollst, desto besser. Zu viel Druck gibt blaue Flecken. Mäßig reicht, Knochen meiden."
    es:
      title: "Más fuerte"
      body: "Mito: cuanto más fuerte, mejor. Demasiada presión deja moratones. Basta con moderada, lejos de huesos."
    fr:
      title: "Plus fort"
      body: "Mythe : plus tu appuies, mieux c'est. Trop de pression laisse des bleus. Modéré suffit, évite les os."
    pt:
      title: "Mais forte"
      body: "Mito: quanto mais forte, melhor. Pressão a mais deixa nódoas negras. Moderada chega, longe dos ossos."
    tr:
      title: "Daha sert"
      body: "Efsane: ne kadar sert, o kadar iyi. Fazla baskı morartır. Orta baskı yeter, kemik ve eklemlerden uzak dur."

  - key: geen-vervanging-warming-up
    kind: myth
    en:
      title: "Warm-up"
      body: "Myth: rolling can replace your warm-up. It adds to a proper warm-up and full-range strength work, nothing more."
    nl:
      title: "Warming-up"
      body: "Mythe: rollen vervangt je warming-up. Het is een aanvulling op een goede warming-up, geen vervanging."
    de:
      title: "Aufwärmen"
      body: "Mythos: Rollen ersetzt das Aufwärmen. Es ergänzt ein gutes Aufwärmen und Kraft im vollen Bewegungsumfang."
    es:
      title: "Calentamiento"
      body: "Mito: el rodillo sustituye al calentamiento. Lo complementa, junto a la fuerza en todo el recorrido."
    fr:
      title: "Échauffement"
      body: "Mythe : rouler remplace l'échauffement. Ça le complète, avec la force sur toute l'amplitude."
    pt:
      title: "Aquecimento"
      body: "Mito: o rolo substitui o aquecimento. Complementa-o, junto com força em toda a amplitude."
    tr:
      title: "Isınma"
      body: "Efsane: rulo ısınmanın yerini tutar. Sadece iyi bir ısınmayı ve tam açıklıkta kuvvet çalışmasını tamamlar."

  - key: techniek-en-belasting
    kind: myth
    en:
      title: "Tight spot"
      body: "Myth: rolling fixes a nagging tight spot. Not on its own. Look at your technique and how much load you handle."
    nl:
      title: "Vast plekje"
      body: "Mythe: rollen lost een hardnekkig strak plekje op. Niet alleen. Kijk ook naar je techniek en hoeveel je tilt."
    de:
      title: "Verspannte Stelle"
      body: "Mythos: Rollen löst eine hartnäckige Verspannung. Nicht allein. Schau auf Technik und Belastung."
    es:
      title: "Zona tensa"
      body: "Mito: el rodillo arregla una zona tensa de siempre. No solo. Revisa tu técnica y cuánta carga manejas."
    fr:
      title: "Point tendu"
      body: "Mythe : rouler règle un point tendu tenace. Pas seul. Regarde ta technique et la charge que tu gères."
    pt:
      title: "Zona tensa"
      body: "Mito: o rolo resolve uma zona tensa teimosa. Sozinho não. Vê a tua técnica e quanta carga aguentas."
    tr:
      title: "Gergin nokta"
      body: "Efsane: rulo inatçı bir gerginliği çözer. Tek başına değil. Tekniğine ve yük miktarına da bak."

article: ashwagandha
emoji: "🌿"
tips:
  - key: advies-tegen
    kind: fact
    en:
      title: "Advised against"
      body: "The Dutch RIVM and German BfR both advise against it. There are reports of liver damage, even liver failure."
    nl:
      title: "Afgeraden"
      body: "Het RIVM en het Duitse BfR raden het allebei af. Er zijn meldingen van leverschade, tot leverfalen aan toe."
    de:
      title: "Abgeraten"
      body: "Das BfR und das niederländische RIVM raten ab. Es gibt Berichte über Leberschäden bis zum Leberversagen."
    es:
      title: "Desaconsejada"
      body: "El RIVM neerlandés y el BfR alemán la desaconsejan. Hay casos de daño hepático, incluso de fallo hepático."
    fr:
      title: "Déconseillée"
      body: "Le RIVM néerlandais et le BfR allemand la déconseillent. Des lésions du foie ont été signalées, jusqu'à l'insuffisance."
    pt:
      title: "Desaconselhada"
      body: "O RIVM neerlandês e o BfR alemão desaconselham-na. Há relatos de lesões no fígado, até insuficiência hepática."
    tr:
      title: "Önerilmiyor"
      body: "Hollanda'da RIVM, Almanya'da BfR ashwagandhayı önermiyor. Karaciğer hasarı, hatta yetmezliği bildirildi."

  - key: natuurlijk-is-veilig
    kind: myth
    en:
      title: "Natural"
      body: "Myth: natural means safe. Liver injury showed up with products holding only ashwagandha, without harmful additives."
    nl:
      title: "Natuurlijk"
      body: "Mythe: natuurlijk is veilig. Ook pure ashwagandha zonder schadelijke toevoegingen gaf leverschade."
    de:
      title: "Natürlich"
      body: "Mythos: Natürlich heißt sicher. Auch reines Ashwagandha ohne schädliche Zusätze führte zu Leberschäden."
    es:
      title: "Natural"
      body: "Mito: natural significa seguro. Productos solo con ashwagandha, sin aditivos dañinos, dañaron el hígado."
    fr:
      title: "Naturel"
      body: "Mythe : naturel veut dire sans danger. De la pure ashwagandha, sans additif nocif, a abîmé des foies."
    pt:
      title: "Natural"
      body: "Mito: natural é seguro. Produtos só com ashwagandha, sem aditivos nocivos, causaram lesões no fígado."
    tr:
      title: "Doğal"
      body: "Efsane: doğal olan güvenlidir. Zararlı katkı içermeyen saf ashwagandha ürünleri de karaciğere zarar verdi."

  - key: thee
    kind: fact
    en:
      title: "Tea"
      body: "Nobody has studied ashwagandha tea. The RIVM assumes the supplement advice applies, so it advises against it too."
    nl:
      title: "Thee"
      body: "Niemand heeft ashwagandha-thee onderzocht. Het RIVM gaat uit van hetzelfde als bij supplementen en raadt het ook af."
    de:
      title: "Tee"
      body: "Ashwagandha-Tee wurde nie untersucht. Das RIVM nimmt an, dass dasselbe gilt, und rät auch davon ab."
    es:
      title: "Infusión"
      body: "Nadie ha estudiado la infusión de ashwagandha. El RIVM le aplica el mismo consejo y también la desaconseja."
    fr:
      title: "Tisane"
      body: "Personne n'a étudié la tisane d'ashwagandha. Le RIVM lui applique le même avis et la déconseille aussi."
    pt:
      title: "Chá"
      body: "Ninguém estudou o chá de ashwagandha. O RIVM aplica-lhe o mesmo conselho e também o desaconselha."
    tr:
      title: "Çay"
      body: "Ashwagandha çayı hiç araştırılmadı. RIVM aynı uyarının geçerli olduğunu varsayıyor ve onu da önermiyor."

  - key: geen-veilige-dosis
    kind: fact
    en:
      title: "Safe dose"
      body: "There isn't one. The BfR couldn't work one out, so a dose copied from a study is no guarantee."
    nl:
      title: "Veilige dosis"
      body: "Die is er niet. Het BfR kon er geen vaststellen, dus een dosis uit een studie is ook geen garantie."
    de:
      title: "Sichere Dosis"
      body: "Gibt es nicht. Das BfR konnte keine ableiten. Eine Dosis aus einer Studie ist also keine Garantie."
    es:
      title: "Dosis segura"
      body: "No existe. El BfR no pudo fijarla, así que copiar la dosis de un estudio tampoco garantiza nada."
    fr:
      title: "Dose sûre"
      body: "Il n'y en a pas. Le BfR n'a pas pu en fixer, donc copier la dose d'une étude ne garantit rien."
    pt:
      title: "Dose segura"
      body: "Não existe. O BfR não a conseguiu definir, por isso copiar a dose de um estudo não garante nada."
    tr:
      title: "Güvenli doz"
      body: "Yok. BfR bir doz belirleyemedi, yani bir çalışmadan aldığın doz da garanti değil."

  - key: gele-ogen-jeuk
    kind: fact
    en:
      title: "Yellow eyes"
      body: "Taking ashwagandha? Stop and see a doctor if your skin or eyes turn yellow, or you itch all over."
    nl:
      title: "Gele ogen"
      body: "Slik je ashwagandha? Stop en ga naar de dokter als je huid of oogwit geel wordt, of je overal jeuk hebt."
    de:
      title: "Gelbe Augen"
      body: "Du nimmst Ashwagandha? Hör auf und geh zum Arzt, wenn Haut oder Augen gelb werden oder alles juckt."
    es:
      title: "Ojos amarillos"
      body: "¿Tomas ashwagandha? Déjala y ve al médico si tu piel o tus ojos amarillean o te pica todo el cuerpo."
    fr:
      title: "Yeux jaunes"
      body: "Tu prends de l'ashwagandha ? Arrête et consulte si ta peau ou tes yeux jaunissent, ou si tout te gratte."
    pt:
      title: "Olhos amarelos"
      body: "Tomas ashwagandha? Para e vai ao médico se a pele ou os olhos ficarem amarelos, ou se tiveres comichão."
    tr:
      title: "Sarı gözler"
      body: "Ashwagandha kullanıyorsan ve cildin, gözlerin sararır ya da her yerin kaşınırsa bırak, doktora git."

  - key: na-41-dagen
    kind: fact
    en:
      title: "41 days"
      body: "That's when liver trouble typically began, in a case series from India. It ranged from 14 to 540 days."
    nl:
      title: "41 dagen"
      body: "Na zoveel dagen begonnen leverklachten meestal, in een reeks gevallen uit India. Het varieerde van 14 tot 540."
    de:
      title: "41 Tage"
      body: "Danach begannen Leberprobleme typischerweise, in einer Fallserie aus Indien. Die Spanne: 14 bis 540 Tage."
    es:
      title: "41 días"
      body: "Es cuando solían empezar los problemas de hígado, en una serie de casos de India. Iba de 14 a 540 días."
    fr:
      title: "41 jours"
      body: "C'est le délai typique avant les soucis de foie, dans une série de cas en Inde. De 14 à 540 jours selon les gens."
    pt:
      title: "41 dias"
      body: "Foi quando os problemas no fígado costumavam começar, numa série de casos da Índia. Variou de 14 a 540 dias."
    tr:
      title: "41 gün"
      body: "Hindistan'daki bir vaka serisinde karaciğer sorunları genelde bu sürede başladı. Aralık 14 ile 540 gündü."

  - key: medicijnen
    kind: fact
    en:
      title: "Medicine"
      body: "It can interact with medicine for blood sugar, blood pressure or your immune system. Talk to your doctor."
    nl:
      title: "Medicijnen"
      body: "Het kan botsen met medicijnen voor bloedsuiker, bloeddruk of je afweer. Overleg dan met je arts."
    de:
      title: "Medikamente"
      body: "Es kann mit Mitteln für Blutzucker, Blutdruck oder Immunsystem wechselwirken. Sprich mit deinem Arzt."
    es:
      title: "Medicamentos"
      body: "Puede interactuar con fármacos para el azúcar, la tensión o el sistema inmune. Habla con tu médico."
    fr:
      title: "Médicaments"
      body: "Elle peut interagir avec les traitements de la glycémie, de la tension ou de l'immunité. Parles-en à ton médecin."
    pt:
      title: "Medicamentos"
      body: "Pode interagir com medicação para o açúcar, a tensão ou o sistema imunitário. Fala com o teu médico."
    tr:
      title: "İlaçlar"
      body: "Kan şekeri, tansiyon ya da bağışıklık ilaçlarıyla etkileşebilir. Bunları kullanıyorsan doktoruna danış."

  - key: hormonen
    kind: fact
    en:
      title: "Hormones"
      body: "The BfR says it may affect cortisol, blood sugar, thyroid and sex hormones. Lower cortisol isn't a clear win."
    nl:
      title: "Hormonen"
      body: "Volgens het BfR kan het cortisol, bloedsuiker, schildklier- en geslachtshormonen raken. Lager cortisol is geen winst."
    de:
      title: "Hormone"
      body: "Laut BfR wirkt es womöglich auf Cortisol, Blutzucker, Schilddrüse und Sexualhormone. Weniger Cortisol ist kein Plus."
    es:
      title: "Hormonas"
      body: "Según el BfR puede afectar al cortisol, el azúcar, el tiroides y las hormonas sexuales. Bajar el cortisol no es ventaja."
    fr:
      title: "Hormones"
      body: "Selon le BfR, elle peut toucher cortisol, glycémie, thyroïde, hormones sexuelles. Moins de cortisol n'est pas un atout."
    pt:
      title: "Hormonas"
      body: "Segundo o BfR, pode afetar o cortisol, o açúcar, a tiroide e as hormonas sexuais. Menos cortisol não é vantagem."
    tr:
      title: "Hormonlar"
      body: "BfR'ye göre kortizolü, kan şekerini, tiroid ve cinsiyet hormonlarını etkileyebilir. Düşük kortizol net fayda değil."

  - key: stress
    kind: myth
    en:
      title: "Less stress"
      body: "Myth: ashwagandha takes your stress away. One analysis saw lower cortisol, but people didn't feel less stressed."
    nl:
      title: "Minder stress"
      body: "Mythe: ashwagandha neemt je stress weg. Eén analyse zag lager cortisol, maar mensen voelden niet minder stress."
    de:
      title: "Weniger Stress"
      body: "Mythos: Ashwagandha nimmt dir den Stress. Eine Analyse sah weniger Cortisol, aber gefühlt blieb der Stress gleich."
    es:
      title: "Menos estrés"
      body: "Mito: la ashwagandha te quita el estrés. Un análisis vio menos cortisol, pero la gente no se sentía menos estresada."
    fr:
      title: "Moins de stress"
      body: "Mythe : l'ashwagandha chasse le stress. Une analyse a vu moins de cortisol, mais le stress ressenti n'a pas baissé."
    pt:
      title: "Menos stress"
      body: "Mito: a ashwagandha tira-te o stress. Uma análise viu menos cortisol, mas as pessoas não se sentiam menos stressadas."
    tr:
      title: "Daha az stres"
      body: "Efsane: ashwagandha stresi alır. Bir analizde kortizol düştü ama insanlar kendini daha az stresli hissetmedi."

  - key: niet-voor-mij
    kind: myth
    en:
      title: "Not me"
      body: "Myth: you'd know if you were at risk. Nobody knows who is sensitive to it."
    nl:
      title: "Ik toch niet"
      body: "Mythe: je weet het wel als jij risico loopt. Niemand weet wie er gevoelig voor is."
    de:
      title: "Ich doch nicht"
      body: "Mythos: Du würdest merken, wenn du gefährdet bist. Niemand weiß, wer empfindlich darauf reagiert."
    es:
      title: "A mí no"
      body: "Mito: sabrías si estás en riesgo. Nadie sabe quién es sensible a ella."
    fr:
      title: "Pas moi"
      body: "Mythe : tu saurais si tu étais à risque. Personne ne sait qui y est sensible."
    pt:
      title: "Comigo não"
      body: "Mito: saberias se estivesses em risco. Ninguém sabe quem é sensível a ela."
    tr:
      title: "Bana bir şey olmaz"
      body: "Efsane: risk altındaysan bunu bilirsin. Kimin hassas olduğunu kimse bilmiyor."

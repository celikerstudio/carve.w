article: eaa
emoji: "🔬"
tips:
  - key: negen-aminozuren
    kind: fact
    en:
      title: "9 amino acids"
      body: "Your body can't make these, the EAAs. Even without a protein meal they can start muscle building."
    nl:
      title: "9 aminozuren"
      body: "Die kan je lichaam niet zelf maken, de EAA's. Ook zonder eiwitmaaltijd kunnen ze spieropbouw starten."
    de:
      title: "9 Aminosäuren"
      body: "Die kann dein Körper nicht selbst bilden, die EAAs. Auch ohne Proteinmahlzeit starten sie den Aufbau."
    es:
      title: "9 aminoácidos"
      body: "Tu cuerpo no puede fabricarlos: son los EAA. Incluso sin una comida proteica, activan la síntesis muscular."
    fr:
      title: "9 acides aminés"
      body: "Ton corps ne peut pas les fabriquer : ce sont les EAA. Même sans repas protéiné, ils lancent le muscle."
    pt:
      title: "9 aminoácidos"
      body: "O corpo não os consegue fazer: são os EAA. Mesmo sem uma refeição proteica, ligam a síntese muscular."
    tr:
      title: "9 amino asit"
      body: "Vücudun bunları kendisi yapamaz, bunlar EAA'lar. Proteinli öğün olmadan da kas yapımını başlatabilir."

  - key: dosis-als-nodplan
    kind: fact
    en:
      title: "10 to 15 g"
      body: "Of EAAs can fill in when you can't get protein for a few hours around training."
    nl:
      title: "10 tot 15 gram"
      body: "EAA's kunnen het gat vullen als je een paar uur rond de training geen eiwit binnenkrijgt."
    de:
      title: "10 bis 15 g"
      body: "EAAs können einspringen, wenn du ein paar Stunden rund ums Training kein Protein bekommst."
    es:
      title: "10 a 15 g"
      body: "De EAA pueden cubrir el hueco si no puedes comer proteína unas horas alrededor del entreno."
    fr:
      title: "10 à 15 g"
      body: "D'EAA peuvent dépanner si tu n'as pas de protéines quelques heures autour de la séance."
    pt:
      title: "10 a 15 g"
      body: "De EAA podem tapar o buraco se não tiveres proteína umas horas à volta do treino."
    tr:
      title: "10-15 g"
      body: "Antrenman çevresinde birkaç saat protein alamıyorsan EAA bu boşluğu doldurabilir."

  - key: beter-dan-eiwit
    kind: myth
    en:
      title: "Better than protein"
      body: "Myth: EAAs beat whole protein. Food or whey stays the first choice. EAAs are a backup."
    nl:
      title: "Beter dan eiwit"
      body: "Mythe: EAA's zijn beter dan gewoon eiwit. Eten of whey blijft eerste keus. EAA's zijn een noodplan."
    de:
      title: "Besser als Protein"
      body: "Mythos: EAAs schlagen echtes Protein. Essen oder Whey bleiben erste Wahl. EAAs sind ein Notplan."
    es:
      title: "Mejor que proteína"
      body: "Mito: los EAA superan a la proteína entera. La comida o el whey siguen primero. Los EAA son un plan B."
    fr:
      title: "Mieux que la protéine"
      body: "Mythe : les EAA battent les protéines entières. L'assiette ou la whey d'abord. Les EAA, c'est le plan B."
    pt:
      title: "Melhor que proteína"
      body: "Mito: os EAA batem a proteína inteira. A comida ou a whey vêm primeiro. Os EAA são um plano B."
    tr:
      title: "Proteinden iyi"
      body: "Efsane: EAA tam proteinden iyidir. İlk tercih yemek ya da whey. EAA sadece yedek plan."

  - key: al-genoeg-eiwit
    kind: fact
    en:
      title: "Paying twice"
      body: "Already eat enough protein? Then EAAs add little, and you're mostly paying twice."
    nl:
      title: "Dubbel betalen"
      body: "Eet je al genoeg eiwit? Dan voegen EAA's weinig toe en betaal je vooral dubbel."
    de:
      title: "Doppelt zahlen"
      body: "Isst du schon genug Protein? Dann bringen EAAs wenig, und du zahlst vor allem doppelt."
    es:
      title: "Pagar dos veces"
      body: "¿Ya comes suficiente proteína? Entonces los EAA suman poco y sobre todo pagas dos veces."
    fr:
      title: "Payer deux fois"
      body: "Tu manges déjà assez de protéines ? Les EAA ajoutent peu, tu paies surtout deux fois."
    pt:
      title: "Pagar a dobrar"
      body: "Já comes proteína suficiente? Então os EAA juntam pouco e estás sobretudo a pagar a dobrar."
    tr:
      title: "İki kez ödemek"
      body: "Zaten yeterli protein alıyorsan EAA pek bir şey katmaz, çoğunlukla iki kez ödersin."

  - key: verzadiging
    kind: fact
    en:
      title: "Not filling"
      body: "EAAs miss what a real protein meal gives you, like feeling full. One reason food stays the better base."
    nl:
      title: "Geen vol gevoel"
      body: "EAA's missen wat een echte eiwitmaaltijd je geeft, zoals verzadiging. Eén reden dat eten de betere basis blijft."
    de:
      title: "Macht nicht satt"
      body: "EAAs fehlt, was eine echte Proteinmahlzeit gibt, etwa Sättigung. Ein Grund, warum Essen die Basis bleibt."
    es:
      title: "No sacian"
      body: "A los EAA les falta lo que da una comida con proteína, como saciar. Por eso la comida sigue siendo la base."
    fr:
      title: "Pas rassasiant"
      body: "Les EAA n'ont pas ce qu'apporte un vrai repas protéiné, comme la satiété. L'assiette reste la base."
    pt:
      title: "Não saciam"
      body: "Aos EAA falta o que uma refeição proteica dá, como a saciedade. Por isso a comida continua a ser a base."
    tr:
      title: "Doyurmaz"
      body: "EAA'da gerçek proteinli öğünün verdiği tokluk yok. Temelin yemek olmasının bir sebebi de bu."

  - key: koolhydraten-eerst
    kind: fact
    en:
      title: "Carbs first"
      body: "For performance, carbs and electrolytes help more directly than EAAs. Don't skip them for a shake."
    nl:
      title: "Eerst koolhydraten"
      body: "Voor je prestatie helpen koolhydraten en elektrolyten directer dan EAA's. Sla ze niet over voor een shake."
    de:
      title: "Erst Kohlenhydrate"
      body: "Für die Leistung helfen Kohlenhydrate und Elektrolyte direkter als EAAs. Lass sie nicht für einen Shake weg."
    es:
      title: "Primero hidratos"
      body: "Para rendir, los hidratos y electrolitos ayudan más que los EAA. No te los saltes por un batido."
    fr:
      title: "D'abord les glucides"
      body: "Pour la perf, glucides et électrolytes aident plus que les EAA. Ne les zappe pas pour un shake."
    pt:
      title: "Primeiro hidratos"
      body: "Para render, hidratos e eletrólitos ajudam mais do que os EAA. Não os troques por um batido."
    tr:
      title: "Önce karbonhidrat"
      body: "Performans için karbonhidrat ve elektrolit, EAA'dan daha doğrudan yardım eder. Shake için atlama."

article: periodization
emoji: "🗺️"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Planning ahead"
      body: "Periodization plans how your training changes over weeks and months, instead of the same every session."
    nl:
      title: "Vooruit plannen"
      body: "Periodisering plant hoe je training verandert over weken en maanden, in plaats van elke keer hetzelfde."
    de:
      title: "Vorausplanen"
      body: "Periodisierung plant, wie sich dein Training über Wochen und Monate ändert, statt immer gleich."
    es:
      title: "Planificar"
      body: "La periodización planea cómo cambia tu entreno en semanas y meses, en vez de repetir lo mismo."
    fr:
      title: "Planifier"
      body: "La périodisation prévoit l'évolution de ton entraînement sur des semaines et des mois, au lieu de répéter."
    pt:
      title: "Planear"
      body: "A periodização planeia como o treino muda ao longo de semanas e meses, em vez de repetir o mesmo."
    tr:
      title: "İleriyi planlamak"
      body: "Periyotlama, antrenmanın haftalar ve aylar içinde nasıl değişeceğini planlar, her seferinde aynısı yerine."

  - key: lineair-golvend
    kind: fact
    en:
      title: "Linear or undulating"
      body: "Linear: heavier, fewer reps over weeks. Undulating: weight and reps change per session or week."
    nl:
      title: "Lineair of golvend"
      body: "Lineair: zwaarder en minder herhalingen over weken. Golvend: gewicht en herhalingen wisselen per training of week."
    de:
      title: "Linear oder Welle"
      body: "Linear: schwerer, weniger Wdh. über Wochen. Wellenförmig: wechselt pro Einheit oder Woche."
    es:
      title: "Lineal u ondulante"
      body: "Lineal: más peso y menos repeticiones en semanas. Ondulante: cambian por sesión o semana."
    fr:
      title: "Linéaire ou ondulé"
      body: "Linéaire : plus lourd, moins de reps sur des semaines. Ondulatoire : ça varie par séance ou semaine."
    pt:
      title: "Linear ou ondulatório"
      body: "Linear: mais peso e menos repetições ao longo de semanas. Ondulatório: muda por treino ou semana."
    tr:
      title: "Doğrusal ya da dalgalı"
      body: "Doğrusal: haftalar içinde ağırlık artar, tekrar azalır. Dalgalı: antrenmana ya da haftaya göre değişir."

  - key: geen-extra-spier
    kind: myth
    en:
      title: "More muscle"
      body: "Myth: periodization builds more muscle. The ACSM found growth wasn't affected by it, whatever the type."
    nl:
      title: "Meer spier"
      body: "Mythe: periodiseren bouwt meer spier. De ACSM vond geen effect op spiergroei, welk type ook."
    de:
      title: "Mehr Muskeln"
      body: "Mythos: Periodisierung baut mehr Muskeln. Das ACSM fand keinen Effekt aufs Wachstum, egal welche Art."
    es:
      title: "Más músculo"
      body: "Mito: periodizar da más músculo. El ACSM no vio efecto en el crecimiento, fuera del tipo que fuera."
    fr:
      title: "Plus de muscle"
      body: "Mythe : périodiser fait plus de muscle. L'ACSM n'a vu aucun effet sur la croissance, quel que soit le type."
    pt:
      title: "Mais músculo"
      body: "Mito: periodizar dá mais músculo. O ACSM não viu efeito no crescimento, fosse de que tipo fosse."
    tr:
      title: "Daha çok kas"
      body: "Efsane: periyotlama daha çok kas yaptırır. ACSM türü ne olursa olsun büyümeye etki bulmadı."

  - key: niet-nodig
    kind: myth
    en:
      title: "Must-have"
      body: "Myth: you need periodization to progress. With good overload, the ACSM found it no better than a plan without."
    nl:
      title: "Onmisbaar"
      body: "Mythe: zonder periodisering geen vooruitgang. Met goede overload vond de ACSM het niet beter dan zonder."
    de:
      title: "Unverzichtbar"
      body: "Mythos: Ohne Periodisierung kein Fortschritt. Mit guter Progression fand das ACSM es nicht besser."
    es:
      title: "Imprescindible"
      body: "Mito: sin periodizar no avanzas. Con buena sobrecarga, el ACSM no la vio mejor que sin ella."
    fr:
      title: "Indispensable"
      body: "Mythe : sans périodisation, pas de progrès. Avec une bonne surcharge, l'ACSM ne l'a pas trouvée meilleure."
    pt:
      title: "Indispensável"
      body: "Mito: sem periodizar não progrides. Com boa sobrecarga, o ACSM não a achou melhor do que sem."
    tr:
      title: "Olmazsa olmaz"
      body: "Efsane: periyotlama olmadan ilerlemezsin. İyi aşamalı yüklemeyle ACSM onu daha iyi bulmadı."

  - key: kracht-open
    kind: fact
    en:
      title: "Still open"
      body: "The effect on strength. The ACSM couldn't tell. A 2022 review saw a small edge with equal work."
    nl:
      title: "Nog open"
      body: "Het effect op kracht. De ACSM kon het niet zeggen. Een review uit 2022 zag een klein voordeel bij gelijk werk."
    de:
      title: "Noch offen"
      body: "Der Effekt auf Kraft. Das ACSM konnte ihn nicht bestimmen. Ein Review von 2022 sah einen kleinen Vorteil."
    es:
      title: "Aún abierto"
      body: "El efecto en la fuerza. El ACSM no pudo decirlo. Una revisión de 2022 vio una pequeña ventaja."
    fr:
      title: "Encore ouvert"
      body: "L'effet sur la force. L'ACSM n'a pas pu trancher. Une revue de 2022 a vu un léger avantage."
    pt:
      title: "Ainda em aberto"
      body: "O efeito na força. O ACSM não conseguiu dizer. Uma revisão de 2022 viu uma pequena vantagem."
    tr:
      title: "Henüz belirsiz"
      body: "Güce etkisi. ACSM belirleyemedi. 2022'deki bir derleme eşit işte küçük bir üstünlük gördü."

  - key: golvend-ervaren
    kind: fact
    en:
      title: "Experienced lifters"
      body: "Only they got stronger on undulating than linear, in a 2022 review. For growth, both did the same."
    nl:
      title: "Ervaren sporters"
      body: "Alleen zij werden sterker van golvend dan van lineair, in een review uit 2022. Voor groei: gelijk."
    de:
      title: "Erfahrene"
      body: "Nur sie wurden laut Review von 2022 mit wellenförmig stärker als mit linear. Fürs Wachstum gleich."
    es:
      title: "Experimentados"
      body: "Solo ellos ganaron más fuerza con ondulante que con lineal, en una revisión de 2022. Para crecer, igual."
    fr:
      title: "Pratiquants confirmés"
      body: "Eux seuls ont gagné plus de force en ondulatoire qu'en linéaire, selon une revue 2022. Croissance : égale."
    pt:
      title: "Experientes"
      body: "Só eles ganharam mais força com ondulatório do que linear, numa revisão de 2022. Para crescer, igual."
    tr:
      title: "Deneyimliler"
      body: "2022 derlemesinde sadece onlar dalgalıda doğrusala göre daha çok güçlendi. Büyümede ikisi aynı."

  - key: beginnen
    kind: fact
    en:
      title: "Starting out"
      body: "A steady routine where you slowly add weight, reps or sets is a fine start. Periodizing is optional."
    nl:
      title: "Beginnen"
      body: "Een vaste routine waarin je langzaam gewicht, herhalingen of sets toevoegt is een prima start. Periodiseren mag."
    de:
      title: "Einstieg"
      body: "Eine feste Routine, in der du langsam Gewicht, Wdh. oder Sätze erhöhst, ist ein guter Start. Periodisieren optional."
    es:
      title: "Para empezar"
      body: "Una rutina fija donde subes poco a poco peso, repeticiones o series es buen inicio. Periodizar es opcional."
    fr:
      title: "Pour débuter"
      body: "Une routine stable où tu ajoutes peu à peu poids, reps ou séries est un bon départ. Périodiser, en option."
    pt:
      title: "Para começar"
      body: "Uma rotina fixa onde vais juntando peso, repetições ou séries é um bom início. Periodizar é opcional."
    tr:
      title: "Başlangıç"
      body: "Ağırlığı, tekrarı ya da seti yavaşça artırdığın sabit bir rutin iyi bir başlangıç. Periyotlama isteğe bağlı."

  - key: alles-wisselen
    kind: myth
    en:
      title: "Change it all"
      body: "Myth: periodizing means changing everything weekly. Random changes make your progress hard to see."
    nl:
      title: "Alles wisselen"
      body: "Mythe: periodiseren is elke week alles veranderen. Willekeurig wisselen maakt vooruitgang onzichtbaar."
    de:
      title: "Alles wechseln"
      body: "Mythos: Periodisieren heißt jede Woche alles ändern. Zufällige Wechsel machen Fortschritt unsichtbar."
    es:
      title: "Cambiarlo todo"
      body: "Mito: periodizar es cambiarlo todo cada semana. Los cambios al azar esconden tu progreso."
    fr:
      title: "Tout changer"
      body: "Mythe : périodiser, c'est tout changer chaque semaine. Les changements au hasard masquent tes progrès."
    pt:
      title: "Mudar tudo"
      body: "Mito: periodizar é mudar tudo todas as semanas. Mudanças ao acaso escondem o progresso."
    tr:
      title: "Her şeyi değiştirmek"
      body: "Efsane: periyotlama her hafta her şeyi değiştirmektir. Rastgele değişiklik ilerlemeyi gizler."

  - key: zware-lichte-dag
    kind: fact
    en:
      title: "Heavy and light"
      body: "A heavier day of 4 sets of 5 to 6 and a lighter day of 3 sets of 10 to 12. Add weight on each separately."
    nl:
      title: "Zwaar en licht"
      body: "Een zware dag met 4 sets van 5 tot 6 en een lichte met 3 sets van 10 tot 12. Verhoog elk apart."
    de:
      title: "Schwer und leicht"
      body: "Ein schwerer Tag mit 4 Sätzen à 5 bis 6, ein leichter mit 3 à 10 bis 12. Steigere beide getrennt."
    es:
      title: "Pesado y ligero"
      body: "Un día pesado de 4 series de 5 a 6 y uno ligero de 3 de 10 a 12. Sube peso en cada uno por separado."
    fr:
      title: "Lourd et léger"
      body: "Un jour lourd de 4 séries de 5 à 6 et un léger de 3 séries de 10 à 12. Progresse sur chacun à part."
    pt:
      title: "Pesado e leve"
      body: "Um dia pesado de 4 séries de 5 a 6 e um leve de 3 séries de 10 a 12. Sobe o peso em cada um à parte."
    tr:
      title: "Ağır ve hafif"
      body: "5-6 tekrarlık 4 setle ağır gün, 10-12 tekrarlık 3 setle hafif gün. Her birinde ayrı ayrı ağırlık artır."

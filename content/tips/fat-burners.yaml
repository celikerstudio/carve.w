article: fat-burners
emoji: "💊"
tips:
  - key: ongeveer-een-kilo
    kind: fact
    en:
      title: "About 1 kg"
      body: "Extra weight loss from carnitine or CLA, in meta-analyses. Fat loss comes from a calorie deficit."
    nl:
      title: "Zo'n 1 kilo"
      body: "Extra gewichtsverlies met carnitine of CLA, in meta-analyses. Vetverlies komt van een caloriedeficit."
    de:
      title: "Etwa 1 kg"
      body: "Mehr Gewichtsverlust mit Carnitin oder CLA, laut Metaanalysen. Fettabbau kommt vom Kaloriendefizit."
    es:
      title: "Más o menos 1 kg"
      body: "De pérdida extra con carnitina o CLA, en metaanálisis. La grasa se pierde con déficit calórico."
    fr:
      title: "Environ 1 kg"
      body: "De perte en plus avec la carnitine ou le CLA, selon des méta-analyses. Le gras part avec un déficit."
    pt:
      title: "Cerca de 1 kg"
      body: "De perda extra com carnitina ou CLA, em meta-análises. A gordura perde-se com défice calórico."
    tr:
      title: "Yaklaşık 1 kg"
      body: "Meta-analizlerde karnitin ya da CLA ile ekstra kilo kaybı. Yağ kaybı kalori açığından gelir."

  - key: carnitine
    kind: myth
    en:
      title: "Carnitine"
      body: "Myth: carnitine burns your fat. Meta-analyses found 1.2 to 1.3 kg extra loss, and in one it shrank over time."
    nl:
      title: "Carnitine"
      body: "Mythe: carnitine verbrandt je vet. Meta-analyses vonden 1,2 tot 1,3 kilo extra, en in één werd dat minder met de tijd."
    de:
      title: "Carnitin"
      body: "Mythos: Carnitin verbrennt dein Fett. Metaanalysen fanden 1,2 bis 1,3 kg extra, in einer schrumpfte das mit der Zeit."
    es:
      title: "Carnitina"
      body: "Mito: la carnitina quema tu grasa. Dos metaanálisis vieron 1,2 a 1,3 kg extra, y en uno bajó con el tiempo."
    fr:
      title: "Carnitine"
      body: "Mythe : la carnitine brûle ton gras. Des méta-analyses ont vu 1,2 à 1,3 kg de plus, moins avec le temps."
    pt:
      title: "Carnitina"
      body: "Mito: a carnitina queima a tua gordura. Meta-análises viram 1,2 a 1,3 kg a mais, e num caso desceu com o tempo."
    tr:
      title: "Karnitin"
      body: "Efsane: karnitin yağını yakar. Meta-analizler 1,2-1,3 kg ekstra buldu, birinde etki zamanla azaldı."

  - key: cla
    kind: myth
    en:
      title: "1.08 kg"
      body: "Myth: CLA melts fat. People lost that much more than on placebo, under the 2.5 kg that counts as meaningful."
    nl:
      title: "1,08 kilo"
      body: "Mythe: CLA laat vet smelten. Zoveel meer verloren mensen dan met placebo, onder de 2,5 kilo die als zinvol geldt."
    de:
      title: "1,08 kg"
      body: "Mythos: CLA schmilzt Fett. So viel mehr als mit Placebo, unter den 2,5 kg, die als bedeutsam gelten."
    es:
      title: "1,08 kg"
      body: "Mito: el CLA derrite la grasa. Es lo que se perdió de más frente a placebo, por debajo de los 2,5 kg relevantes."
    fr:
      title: "1,08 kg"
      body: "Mythe : le CLA fait fondre le gras. C'est la perte en plus face au placebo, sous les 2,5 kg jugés utiles."
    pt:
      title: "1,08 kg"
      body: "Mito: o CLA derrete gordura. Foi o que se perdeu a mais face ao placebo, abaixo dos 2,5 kg relevantes."
    tr:
      title: "1,08 kg"
      body: "Efsane: CLA yağı eritir. Plaseboya göre bu kadar fazla kayıp oldu, anlamlı sayılan 2,5 kg'ın altında."

  - key: groene-thee
    kind: myth
    en:
      title: "Green tea extract"
      body: "Myth: green tea extract burns fat. A Cochrane review found a small loss that wasn't significant."
    nl:
      title: "Groenethee-extract"
      body: "Mythe: groenethee-extract verbrandt vet. Een Cochrane-review vond een klein verlies dat niet significant was."
    de:
      title: "Grüntee-Extrakt"
      body: "Mythos: Grüntee-Extrakt verbrennt Fett. Ein Cochrane-Review fand einen kleinen, nicht signifikanten Verlust."
    es:
      title: "Extracto de té verde"
      body: "Mito: el extracto de té verde quema grasa. Una revisión Cochrane vio una pérdida pequeña y no significativa."
    fr:
      title: "Extrait de thé vert"
      body: "Mythe : l'extrait de thé vert brûle le gras. Une revue Cochrane a vu une petite perte, non significative."
    pt:
      title: "Extrato de chá verde"
      body: "Mito: o extrato de chá verde queima gordura. Uma revisão Cochrane viu uma perda pequena e não significativa."
    tr:
      title: "Yeşil çay özü"
      body: "Efsane: yeşil çay özü yağ yakar. Bir Cochrane derlemesi küçük ve anlamsız bir kayıp buldu."

  - key: verstopte-cafeine
    kind: fact
    en:
      title: "Guarana"
      body: "Caffeine in a fat burner can hide as guarana, bissey nut or kola. Green tea extract can contain it too."
    nl:
      title: "Guarana"
      body: "Cafeïne in een vetverbrander kan verstopt zitten als guarana, bisseynoot of kola. Ook groenethee-extract."
    de:
      title: "Guarana"
      body: "Koffein im Fatburner versteckt sich oft als Guarana, Bisseynuss oder Kola. Auch Grüntee-Extrakt enthält es."
    es:
      title: "Guaraná"
      body: "La cafeína de un quemagrasas puede esconderse como guaraná, nuez de cola o kola. También en el té verde."
    fr:
      title: "Guarana"
      body: "La caféine d'un brûleur peut se cacher sous guarana, noix de kola ou kola. L'extrait de thé vert en contient aussi."
    pt:
      title: "Guaraná"
      body: "A cafeína de um queimador pode esconder-se como guaraná, noz de cola ou kola. O chá verde também tem."
    tr:
      title: "Guarana"
      body: "Yağ yakıcıdaki kafein guarana, bissey cevizi ya da kola adıyla gizlenebilir. Yeşil çay özünde de olabilir."

  - key: cafeine-optellen
    kind: fact
    en:
      title: "400 mg"
      body: "Caffeine a day max for healthy adults, 200 mg at once. Count your fat burner, coffee and pre-workout together."
    nl:
      title: "400 mg"
      body: "Cafeïne per dag is het maximum, 200 mg per keer. Tel je vetverbrander, koffie en pre-workout bij elkaar op."
    de:
      title: "400 mg"
      body: "Koffein am Tag sind das Maximum, 200 mg auf einmal. Zähl Fatburner, Kaffee und Pre-Workout zusammen."
    es:
      title: "400 mg"
      body: "De cafeína al día como máximo, 200 mg de una vez. Suma quemagrasas, café y pre-entreno."
    fr:
      title: "400 mg"
      body: "De caféine par jour maximum, 200 mg d'un coup. Additionne brûleur, café et pré-workout."
    pt:
      title: "400 mg"
      body: "De cafeína por dia no máximo, 200 mg de cada vez. Soma o queimador, o café e o pré-treino."
    tr:
      title: "400 mg"
      body: "Sağlıklı yetişkinde günlük üst sınır, tek seferde 200 mg. Yağ yakıcı, kahve ve pre-workout'u topla."

  - key: geen-veilige-dosis
    kind: fact
    en:
      title: "No safe dose"
      body: "EFSA found no dose of EGCG from green tea extract that it could call safe for your liver."
    nl:
      title: "Geen veilige dosis"
      body: "EFSA vond geen dosis EGCG uit groenethee-extract die het veilig kon noemen voor je lever."
    de:
      title: "Keine sichere Dosis"
      body: "Die EFSA fand keine Dosis EGCG aus Grüntee-Extrakt, die sie für die Leber als sicher einstuft."
    es:
      title: "Sin dosis segura"
      body: "La EFSA no encontró ninguna dosis de EGCG de extracto de té verde segura para el hígado."
    fr:
      title: "Pas de dose sûre"
      body: "L'EFSA n'a trouvé aucune dose d'EGCG d'extrait de thé vert sûre pour le foie."
    pt:
      title: "Sem dose segura"
      body: "A EFSA não encontrou nenhuma dose de EGCG de extrato de chá verde segura para o fígado."
    tr:
      title: "Güvenli doz yok"
      body: "EFSA, yeşil çay özündeki EGCG için karaciğere güvenli diyebileceği bir doz bulamadı."

  - key: achthonderd-mg
    kind: myth
    en:
      title: "800 mg"
      body: "Myth: under 800 mg EGCG a day is safe. Liver trouble was also reported with one product at 375 mg."
    nl:
      title: "800 mg"
      body: "Mythe: onder 800 mg EGCG per dag is veilig. Ook bij één product met 375 mg werd leverschade gemeld."
    de:
      title: "800 mg"
      body: "Mythos: Unter 800 mg EGCG am Tag ist sicher. Auch bei einem Produkt mit 375 mg gab es Leberschäden."
    es:
      title: "800 mg"
      body: "Mito: menos de 800 mg de EGCG al día es seguro. También hubo daño hepático con un producto de 375 mg."
    fr:
      title: "800 mg"
      body: "Mythe : moins de 800 mg d'EGCG par jour, c'est sûr. Un produit à 375 mg a aussi abîmé des foies."
    pt:
      title: "800 mg"
      body: "Mito: menos de 800 mg de EGCG por dia é seguro. Também houve lesão hepática com um produto de 375 mg."
    tr:
      title: "800 mg"
      body: "Efsane: günde 800 mg'ın altında EGCG güvenli. 375 mg'lık bir üründe de karaciğer hasarı bildirildi."

  - key: thee-of-extract
    kind: fact
    en:
      title: "Normal tea"
      body: "Brewed green tea is considered safe at usual amounts. Most liver injury cases were linked to supplements."
    nl:
      title: "Gewone thee"
      body: "Gezette groene thee geldt als veilig bij normale hoeveelheden. De meeste leverschade hoorde bij supplementen."
    de:
      title: "Normaler Tee"
      body: "Aufgebrühter Grüntee gilt in üblichen Mengen als sicher. Die meisten Leberschäden kamen von Supplements."
    es:
      title: "Té normal"
      body: "El té verde preparado se considera seguro en cantidades normales. Casi todo el daño hepático vino de suplementos."
    fr:
      title: "Thé normal"
      body: "Le thé vert infusé est jugé sûr aux doses habituelles. Les atteintes du foie venaient surtout de compléments."
    pt:
      title: "Chá normal"
      body: "O chá verde feito em casa é considerado seguro em quantidades normais. Quase toda a lesão veio de suplementos."
    tr:
      title: "Normal çay"
      body: "Demlenmiş yeşil çay normal miktarda güvenli kabul edilir. Karaciğer hasarı vakalarının çoğu takviyelerden."

  - key: lange-termijn
    kind: fact
    en:
      title: "On the shelf"
      body: "Doesn't mean proven safe. Many supplements never had safety studies at the doses and lengths people use."
    nl:
      title: "In de winkel"
      body: "Betekent niet bewezen veilig. Veel supplementen zijn nooit getest op de doses en duur die mensen gebruiken."
    de:
      title: "Im Regal"
      body: "Heißt nicht sicher. Viele Supplements wurden nie in den Dosen und über die Dauer getestet, die man nutzt."
    es:
      title: "En la tienda"
      body: "No significa que sea seguro. Muchos suplementos nunca se probaron a las dosis y plazos que usa la gente."
    fr:
      title: "En rayon"
      body: "Ne veut pas dire sûr. Beaucoup de compléments n'ont jamais été testés aux doses et durées réelles."
    pt:
      title: "À venda"
      body: "Não quer dizer seguro. Muitos suplementos nunca foram testados nas doses e durações que as pessoas usam."
    tr:
      title: "Rafta"
      body: "Güvenli olduğu kanıtlandı demek değil. Çoğu takviye kullanılan doz ve sürede hiç test edilmedi."

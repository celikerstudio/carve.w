article: body-types
emoji: "🧬"
tips:
  - key: wat-het-zijn
    kind: fact
    en:
      title: "Ecto, meso, endo"
      body: "Loose labels for how easily you stay lean or gain size. Most people are a mix."
    nl:
      title: "Ecto, meso, endo"
      body: "Losse labels voor hoe makkelijk je slank blijft of massa opbouwt. De meeste mensen zijn een mix."
    de:
      title: "Ekto, Meso, Endo"
      body: "Grobe Etiketten dafür, wie leicht du schlank bleibst oder Masse aufbaust. Die meisten sind ein Mix."
    es:
      title: "Ecto, meso, endo"
      body: "Etiquetas vagas de lo fácil que te mantienes delgado o ganas volumen. Casi todos somos una mezcla."
    fr:
      title: "Ecto, méso, endo"
      body: "Des étiquettes floues sur ta facilité à rester sec ou à prendre du volume. La plupart sont un mélange."
    pt:
      title: "Ecto, meso, endo"
      body: "Rótulos vagos sobre a facilidade de ficar magro ou ganhar volume. A maioria das pessoas é uma mistura."
    tr:
      title: "Ekto, mezo, endo"
      body: "Ne kadar kolay zayıf kaldığını ya da hacim kazandığını anlatan kaba etiketler. Çoğu insan karışımdır."

  - key: geen-grens
    kind: myth
    en:
      title: "Your limits"
      body: "Myth: your body type sets your limits. The labels are too simple. Don't let them decide how you train or eat."
    nl:
      title: "Je grenzen"
      body: "Mythe: je lichaamstype bepaalt je grenzen. De labels zijn te simpel. Laat ze niet bepalen hoe je traint of eet."
    de:
      title: "Deine Grenzen"
      body: "Mythos: Dein Körpertyp setzt dir Grenzen. Die Etiketten sind zu simpel. Lass sie nicht dein Training bestimmen."
    es:
      title: "Tus límites"
      body: "Mito: tu tipo de cuerpo marca tus límites. Las etiquetas son muy simples. No dejes que decidan cómo entrenas."
    fr:
      title: "Tes limites"
      body: "Mythe : ta morphologie fixe tes limites. Ces étiquettes sont trop simples. Ne les laisse pas dicter ton entraînement."
    pt:
      title: "Os teus limites"
      body: "Mito: o teu tipo de corpo define os teus limites. Os rótulos são simples demais. Não os deixes decidir como treinas."
    tr:
      title: "Sınırların"
      body: "Efsane: vücut tipin sınırlarını belirler. Bu etiketler fazla basit. Nasıl çalışıp yediğine onlar karar vermesin."

  - key: genen
    kind: fact
    en:
      title: "Genes"
      body: "They shape your limb lengths, your appetite and how easily you gain fat or muscle. That differs per person."
    nl:
      title: "Genen"
      body: "Die sturen mee hoe lang je armen en benen zijn, je eetlust en hoe makkelijk je vet of spier aankomt. Dat verschilt."
    de:
      title: "Gene"
      body: "Sie prägen die Länge deiner Gliedmaßen, deinen Appetit und wie leicht du Fett oder Muskeln aufbaust."
    es:
      title: "Genes"
      body: "Influyen en el largo de tus extremidades, tu apetito y lo fácil que ganas grasa o músculo. Varía en cada persona."
    fr:
      title: "Gènes"
      body: "Ils jouent sur la longueur de tes membres, ton appétit et ta facilité à prendre du gras ou du muscle."
    pt:
      title: "Genes"
      body: "Influenciam o comprimento dos membros, o apetite e a facilidade com que ganhas gordura ou músculo."
    tr:
      title: "Genler"
      body: "Kol ve bacak uzunluğunu, iştahını ve ne kadar kolay yağ ya da kas aldığını etkiler. Kişiden kişiye değişir."

  - key: slank-blijven
    kind: fact
    en:
      title: "Stay lean easily"
      body: "Then calorie-dense foods help you reach a surplus. Keep your volume at a level you can recover from."
    nl:
      title: "Makkelijk slank"
      body: "Dan helpt calorierijk eten om in een overschot te komen. Train niet meer dan je kunt herstellen."
    de:
      title: "Bleibst leicht schlank"
      body: "Dann helfen kalorienreiche Lebensmittel beim Überschuss. Trainier nur so viel, wie du verkraftest."
    es:
      title: "Te cuesta engordar"
      body: "Los alimentos densos en calorías te ayudan a llegar al superávit. Entrena el volumen que puedas recuperar."
    fr:
      title: "Tu restes sec"
      body: "Les aliments riches en calories t'aident à atteindre un surplus. Garde un volume dont tu récupères."
    pt:
      title: "Ficas magro fácil"
      body: "Alimentos densos em calorias ajudam-te a chegar ao excedente. Treina o volume que consegues recuperar."
    tr:
      title: "Kolay kilo almıyorsan"
      body: "Kalorisi yoğun yiyecekler fazlaya ulaşmana yardım eder. Toparlanabileceğin kadar hacimle çalış."

  - key: makkelijk-aankomen
    kind: fact
    en:
      title: "Gain fat easily"
      body: "Watch portions, lean on protein and fibre to stay full, and keep your daily steps high."
    nl:
      title: "Kom je makkelijk aan"
      body: "Let op porties, leun op eiwit en vezels om vol te zitten, en houd je stappen per dag hoog."
    de:
      title: "Nimmst leicht zu"
      body: "Achte auf Portionen, setz auf Protein und Ballaststoffe für die Sättigung und bleib viel auf den Beinen."
    es:
      title: "Engordas fácil"
      body: "Vigila las raciones, tira de proteína y fibra para saciarte y mantén muchos pasos al día."
    fr:
      title: "Tu prends vite"
      body: "Surveille les portions, mise sur protéines et fibres pour être rassasié, et garde beaucoup de pas par jour."
    pt:
      title: "Engordas fácil"
      body: "Atenção às porções, aposta em proteína e fibra para ficares saciado e mantém muitos passos por dia."
    tr:
      title: "Kolay kilo alıyorsan"
      body: "Porsiyonlara dikkat et, tok kalmak için protein ve lifle ilerle, günlük adımını yüksek tut."

  - key: dieet-per-type
    kind: myth
    en:
      title: "Body type diet"
      body: "Myth: eat the plan for your body type. Copying one without tracking results is a common mistake."
    nl:
      title: "Dieet per type"
      body: "Mythe: eet het plan van je lichaamstype. Zo'n plan kopiëren zonder je resultaat bij te houden is een veelgemaakte fout."
    de:
      title: "Diät nach Typ"
      body: "Mythos: Iss den Plan für deinen Körpertyp. So einen Plan ohne Kontrolle zu kopieren ist ein häufiger Fehler."
    es:
      title: "Dieta por tipo"
      body: "Mito: come el plan de tu tipo de cuerpo. Copiarlo sin medir tus resultados es un error común."
    fr:
      title: "Régime par type"
      body: "Mythe : suis le plan de ta morphologie. Le copier sans suivre tes résultats est une erreur courante."
    pt:
      title: "Dieta por tipo"
      body: "Mito: come o plano do teu tipo de corpo. Copiá-lo sem acompanhar os resultados é um erro comum."
    tr:
      title: "Tipe göre diyet"
      body: "Efsane: vücut tipine göre beslen. Sonuçlarını takip etmeden böyle bir planı kopyalamak sık bir hata."

  - key: helpt-iedereen
    kind: fact
    en:
      title: "Every type"
      body: "Whatever label you'd give yourself, lifting, enough protein and good sleep help."
    nl:
      title: "Elk type"
      body: "Welk label je jezelf ook geeft: krachttraining, genoeg eiwit en goed slapen helpen."
    de:
      title: "Jeder Typ"
      body: "Egal welches Etikett du dir gibst: Krafttraining, genug Protein und guter Schlaf helfen."
    es:
      title: "Todos los tipos"
      body: "Te pongas la etiqueta que te pongas, las pesas, la proteína y dormir bien ayudan."
    fr:
      title: "Tous les types"
      body: "Quelle que soit ton étiquette, la muscu, assez de protéines et un bon sommeil aident."
    pt:
      title: "Todos os tipos"
      body: "Seja qual for o teu rótulo, treino de força, proteína suficiente e bom sono ajudam."
    tr:
      title: "Her tip"
      body: "Kendine hangi etiketi koyarsan koy, ağırlık, yeterli protein ve iyi uyku işe yarar."

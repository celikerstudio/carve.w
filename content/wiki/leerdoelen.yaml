- id: spiergroei-belasting
  laag: spier-opbouwen
  doel: "Weet dat de ACSM gevorderden voor spiergroei vooral laat trainen met gewichten voor 6 tot 12 herhalingen, en minder met 1 tot 6."
  bron: acsm-resistance-training-2009
  passage: "such that the majority of training is devoted to 6–12 RM and less training devoted to 1–6 RM loading"

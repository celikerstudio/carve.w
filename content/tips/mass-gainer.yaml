article: mass-gainer
emoji: "🥤"
tips:
  - key: alleen-als-eten-tekortschiet
    kind: fact
    en:
      title: "150 to 300 kcal"
      body: "Can't reach that surplus with food alone? Then a gainer helps. If you can, skip the powder."
    nl:
      title: "150 tot 300 kcal"
      body: "Haal je dat overschot niet met eten alleen? Dan helpt een gainer. Lukt het wel, dan heb je het poeder niet nodig."
    de:
      title: "150 bis 300 kcal"
      body: "Schaffst du den Überschuss nicht mit Essen? Dann hilft ein Gainer. Sonst brauchst du das Pulver nicht."
    es:
      title: "150 a 300 kcal"
      body: "¿No llegas a ese superávit solo comiendo? Entonces un gainer ayuda. Si llegas, no necesitas el polvo."
    fr:
      title: "150 à 300 kcal"
      body: "Pas moyen d'atteindre ce surplus en mangeant ? Un gainer aide. Sinon, pas besoin de la poudre."
    pt:
      title: "150 a 300 kcal"
      body: "Não chegas a esse excedente só com comida? Então um gainer ajuda. Se chegas, dispensa o pó."
    tr:
      title: "150-300 kcal"
      body: "Bu fazlaya sadece yemekle ulaşamıyorsan gainer işe yarar. Ulaşıyorsan toza gerek yok."

  - key: geen-spierbouwer
    kind: myth
    en:
      title: "Muscle in a tub"
      body: "Myth: a mass gainer builds muscle. It's dense calories. It makes eating more easier, that's all."
    nl:
      title: "Spier in een pot"
      body: "Mythe: een mass gainer bouwt spier. Het zijn geconcentreerde calorieën. Meer eten wordt makkelijker, meer niet."
    de:
      title: "Muskeln in der Dose"
      body: "Mythos: Ein Weight Gainer baut Muskeln. Es sind dichte Kalorien. Mehr essen wird leichter, mehr nicht."
    es:
      title: "Músculo en bote"
      body: "Mito: un gainer da músculo. Son calorías concentradas. Facilita comer más, y nada más."
    fr:
      title: "Du muscle en pot"
      body: "Mythe : un gainer fait du muscle. Ce sont des calories denses. Il aide à manger plus, c'est tout."
    pt:
      title: "Músculo num pote"
      body: "Mito: um gainer dá músculo. São calorias densas. Facilita comer mais, e só isso."
    tr:
      title: "Kavanozda kas"
      body: "Efsane: gainer kas yaptırır. Yoğun kaloridir. Daha çok yemeyi kolaylaştırır, o kadar."

  - key: etiket
    kind: fact
    en:
      title: "20 to 40 g"
      body: "Protein per serving is what to look for, with clear macros. Skip the ones loaded with sugar."
    nl:
      title: "20 tot 40 gram"
      body: "Eiwit per portie is waar je op let, met duidelijke macro's. Laat de suikerbommen staan."
    de:
      title: "20 bis 40 g"
      body: "Protein pro Portion, mit klaren Makros, darauf achtest du. Lass die Zuckerbomben stehen."
    es:
      title: "20 a 40 g"
      body: "De proteína por ración es lo que buscas, con macros claros. Evita los cargados de azúcar."
    fr:
      title: "20 à 40 g"
      body: "De protéines par portion, avec des macros claires. Laisse tomber ceux bourrés de sucre."
    pt:
      title: "20 a 40 g"
      body: "De proteína por dose é o que procuras, com macros claros. Evita os carregados de açúcar."
    tr:
      title: "20-40 g"
      body: "Porsiyon başına protein ve net makrolar ara. Şekerle dolu olanları geç."

  - key: kleinere-shakes
    kind: fact
    en:
      title: "Smaller shakes"
      body: "Huge shakes can upset your stomach. Smaller servings over the day go down easier."
    nl:
      title: "Kleinere shakes"
      body: "Enorme shakes kunnen je maag van streek maken. Kleinere porties over de dag gaan makkelijker."
    de:
      title: "Kleinere Shakes"
      body: "Riesige Shakes können den Magen stören. Kleinere Portionen über den Tag gehen leichter."
    es:
      title: "Batidos pequeños"
      body: "Los batidos enormes pueden sentar mal. Raciones pequeñas a lo largo del día entran mejor."
    fr:
      title: "Shakes plus petits"
      body: "Les énormes shakes peuvent barbouiller. Des petites portions dans la journée passent mieux."
    pt:
      title: "Batidos pequenos"
      body: "Batidos enormes podem cair mal. Doses mais pequenas ao longo do dia descem melhor."
    tr:
      title: "Küçük shake"
      body: "Dev shake mideni bozabilir. Güne yayılan küçük porsiyonlar daha kolay iner."

  - key: echte-maaltijden
    kind: fact
    en:
      title: "Real food"
      body: "Swap meals for a gainer and you miss vitamins, minerals and fibre. Use it next to meals, not instead."
    nl:
      title: "Echt eten"
      body: "Vervang je maaltijden door een gainer, dan mis je vitamines, mineralen en vezels. Gebruik het ernaast."
    de:
      title: "Echtes Essen"
      body: "Ersetzt du Mahlzeiten durch Gainer, fehlen Vitamine, Mineralien und Ballaststoffe. Nimm ihn dazu."
    es:
      title: "Comida real"
      body: "Cambia comidas por un gainer y te faltarán vitaminas, minerales y fibra. Úsalo además, no en vez."
    fr:
      title: "Vrais repas"
      body: "Remplace des repas par un gainer et tu rates vitamines, minéraux et fibres. Prends-le en plus."
    pt:
      title: "Comida a sério"
      body: "Troca refeições por um gainer e perdes vitaminas, minerais e fibra. Usa-o além delas."
    tr:
      title: "Gerçek yemek"
      body: "Öğün yerine gainer içersen vitamin, mineral ve lif kaçırırsın. Öğünlere ek olarak kullan."

  - key: calorieen-tellen
    kind: fact
    en:
      title: "Overshooting"
      body: "A gainer makes it easy to overshoot your surplus, and the extra goes on as fat. Keep tracking calories."
    nl:
      title: "Doorschieten"
      body: "Met een gainer schiet je makkelijk over je overschot heen, en dat extra wordt vet. Blijf je calorieën bijhouden."
    de:
      title: "Übers Ziel"
      body: "Mit Gainer schießt du leicht über den Überschuss hinaus, und das Extra wird Fett. Zähl weiter Kalorien."
    es:
      title: "Pasarte"
      body: "Con un gainer es fácil pasarte del superávit, y lo extra va a grasa. Sigue contando calorías."
    fr:
      title: "Dépasser"
      body: "Avec un gainer, on dépasse vite son surplus, et l'excès part en gras. Continue de suivre tes calories."
    pt:
      title: "Passar do alvo"
      body: "Com um gainer é fácil passar o excedente, e o extra vai para gordura. Continua a contar calorias."
    tr:
      title: "Aşmak"
      body: "Gainer'la fazlayı aşmak kolay, fazlası yağ olur. Kalorini takip etmeye devam et."

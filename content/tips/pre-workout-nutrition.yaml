article: pre-workout-nutrition
emoji: "🍌"
tips:
  - key: wanneer-koolhydraten-helpen
    kind: fact
    en:
      title: "45 minutes"
      body: "Carbs before lifting seem to help most in sessions longer than that, or after 8 hours or more without food."
    nl:
      title: "45 minuten"
      body: "Koolhydraten voor het tillen lijken vooral te helpen bij trainingen langer dan dat, of na 8 uur of meer zonder eten."
    de:
      title: "45 Minuten"
      body: "Kohlenhydrate vorher helfen wohl vor allem bei längeren Einheiten oder nach 8 Stunden und mehr ohne Essen."
    es:
      title: "45 minutos"
      body: "Los hidratos antes de entrenar ayudan sobre todo en sesiones más largas, o tras 8 horas o más sin comer."
    fr:
      title: "45 minutes"
      body: "Les glucides avant la muscu aident surtout pour des séances plus longues, ou après 8 heures sans manger."
    pt:
      title: "45 minutos"
      body: "Os hidratos antes do treino ajudam sobretudo em sessões mais longas, ou após 8 horas ou mais sem comer."
    tr:
      title: "45 dakika"
      body: "Antrenman öncesi karbonhidrat en çok bundan uzun seanslarda ya da 8 saat ve üstü açken işe yarıyor."

  - key: na-de-lunch
    kind: fact
    en:
      title: "After lunch"
      body: "Training later? You're probably covered. Carbs beforehand likely won't help at up to 10 sets per muscle."
    nl:
      title: "Na de lunch"
      body: "Train je later? Dan zit je waarschijnlijk goed. Koolhydraten vooraf helpen dan weinig, tot 10 sets per spier."
    de:
      title: "Nach dem Mittag"
      body: "Training später? Dann bist du wohl versorgt. Kohlenhydrate vorher helfen bis 10 Sätze pro Muskel kaum."
    es:
      title: "Tras la comida"
      body: "¿Entrenas luego? Seguramente vas bien. Los hidratos antes apenas ayudan hasta 10 series por músculo."
    fr:
      title: "Après le déjeuner"
      body: "Tu t'entraînes plus tard ? Tu es sûrement couvert. Les glucides avant aident peu jusqu'à 10 séries par muscle."
    pt:
      title: "Depois do almoço"
      body: "Treinas mais tarde? Provavelmente estás coberto. Hidratos antes pouco ajudam até 10 séries por músculo."
    tr:
      title: "Öğle yemeğinden sonra"
      body: "Sonra mı çalışacaksın? Muhtemelen yeterli. Kas başına 10 sete kadar önceden karbonhidrat pek katkı sağlamaz."

  - key: geen-preworkout-product
    kind: myth
    en:
      title: "Pre-workout product"
      body: "Myth: you need one. For most lifters, a normal meal with protein and carbs a few hours before covers it."
    nl:
      title: "Pre-workoutproduct"
      body: "Mythe: je hebt er een nodig. Voor de meeste mensen volstaat een gewone maaltijd met eiwit en koolhydraten."
    de:
      title: "Pre-Workout-Produkt"
      body: "Mythos: Du brauchst eins. Für die meisten reicht eine normale Mahlzeit mit Protein und Kohlenhydraten."
    es:
      title: "Producto pre-entreno"
      body: "Mito: necesitas uno. Para casi todos basta una comida normal con proteína e hidratos unas horas antes."
    fr:
      title: "Produit pré-séance"
      body: "Mythe : il t'en faut un. Pour la plupart, un repas normal avec protéines et glucides quelques heures avant suffit."
    pt:
      title: "Produto pré-treino"
      body: "Mito: precisas de um. Para quase todos chega uma refeição normal com proteína e hidratos umas horas antes."
    tr:
      title: "Pre-workout ürünü"
      body: "Efsane: bir tane şart. Çoğu kişi için birkaç saat önce protein ve karbonhidratlı normal öğün yeter."

  - key: meer-koolhydraten
    kind: myth
    en:
      title: "More carbs"
      body: "Myth: more carbs before training means more power. A bigger dose didn't help more in a meta-analysis."
    nl:
      title: "Meer koolhydraten"
      body: "Mythe: meer koolhydraten vooraf geeft meer kracht. Een grotere dosis hielp niet meer, in een meta-analyse."
    de:
      title: "Mehr Kohlenhydrate"
      body: "Mythos: Mehr Kohlenhydrate vorher, mehr Kraft. Eine größere Dosis half laut Metaanalyse nicht mehr."
    es:
      title: "Más hidratos"
      body: "Mito: más hidratos antes, más fuerza. Una dosis mayor no ayudó más, según un metaanálisis."
    fr:
      title: "Plus de glucides"
      body: "Mythe : plus de glucides avant, plus de force. Une dose plus grosse n'a pas aidé plus, selon une méta-analyse."
    pt:
      title: "Mais hidratos"
      body: "Mito: mais hidratos antes, mais força. Uma dose maior não ajudou mais, numa meta-análise."
    tr:
      title: "Daha çok karbonhidrat"
      body: "Efsane: önceden daha çok karbonhidrat, daha çok güç. Bir meta-analizde büyük doz daha fazla yardım etmedi."

  - key: nuchter-cardio
    kind: myth
    en:
      title: "Fasted cardio"
      body: "Myth: fasted cardio burns more fat. In five small studies, the difference in body fat was trivial."
    nl:
      title: "Nuchter cardio"
      body: "Mythe: nuchter cardio verbrandt meer vet. In vijf kleine studies was het verschil in vetmassa verwaarloosbaar."
    de:
      title: "Nüchtern-Cardio"
      body: "Mythos: Nüchternes Cardio verbrennt mehr Fett. In fünf kleinen Studien war der Unterschied winzig."
    es:
      title: "Cardio en ayunas"
      body: "Mito: el cardio en ayunas quema más grasa. En cinco estudios pequeños la diferencia fue mínima."
    fr:
      title: "Cardio à jeun"
      body: "Mythe : le cardio à jeun brûle plus de gras. Dans cinq petites études, la différence était infime."
    pt:
      title: "Cardio em jejum"
      body: "Mito: o cardio em jejum queima mais gordura. Em cinco estudos pequenos a diferença foi mínima."
    tr:
      title: "Aç karnına kardiyo"
      body: "Efsane: aç karnına kardiyo daha çok yağ yakar. Beş küçük çalışmada fark önemsizdi."

  - key: nuchter-tillen
    kind: fact
    en:
      title: "Empty stomach"
      body: "Lifting fasted is probably fine if you eat enough over the day. Gains matched in four studies. Eat protein after."
    nl:
      title: "Nuchter tillen"
      body: "Nuchter trainen is waarschijnlijk prima als je over de dag genoeg eet. Vier studies: gelijke winst. Eet daarna eiwit."
    de:
      title: "Nüchtern heben"
      body: "Nüchtern trainieren ist wohl okay, wenn du über den Tag genug isst. Vier Studien: gleiche Zuwächse."
    es:
      title: "En ayunas"
      body: "Entrenar en ayunas va bien si comes suficiente en el día. Cuatro estudios: mismas ganancias. Luego, proteína."
    fr:
      title: "À jeun"
      body: "La muscu à jeun va sûrement si tu manges assez sur la journée. Quatre études : mêmes gains. Protéines après."
    pt:
      title: "Em jejum"
      body: "Treinar em jejum deve estar bem se comeres o suficiente no dia. Quatro estudos: ganhos iguais. Proteína depois."
    tr:
      title: "Aç karnına"
      body: "Gün içinde yeterince yersen aç çalışmak muhtemelen sorun değil. Dört çalışmada kazanç aynı. Sonra protein ye."

  - key: maaltijd-voor-en-eiwit-na
    kind: fact
    en:
      title: "2 to 3 hours"
      body: "After a proper meal, train and then just wait for your next normal meal for protein. No rush."
    nl:
      title: "2 tot 3 uur"
      body: "Na een echte maaltijd train je en wacht je gewoon op je volgende maaltijd voor eiwit. Geen haast."
    de:
      title: "2 bis 3 Stunden"
      body: "Nach einer richtigen Mahlzeit trainieren, dann reicht die nächste normale Mahlzeit fürs Protein. Keine Eile."
    es:
      title: "2 a 3 horas"
      body: "Tras una comida de verdad, entrena y espera a tu siguiente comida normal para la proteína. Sin prisa."
    fr:
      title: "2 à 3 heures"
      body: "Après un vrai repas, entraîne-toi puis attends le repas suivant pour les protéines. Pas d'urgence."
    pt:
      title: "2 a 3 horas"
      body: "Depois de uma refeição a sério, treina e espera pela próxima refeição para a proteína. Sem pressa."
    tr:
      title: "2-3 saat"
      body: "Düzgün bir öğünden sonra çalış, protein için bir sonraki normal öğünü bekle. Acele yok."

  - key: cafeine-dosis
    kind: fact
    en:
      title: "200 mg"
      body: "Is the max for one caffeine dose. Above about 67 kg, even a low performance dose is more than that."
    nl:
      title: "200 mg"
      body: "Is het maximum per keer cafeïne. Boven zo'n 67 kilo is zelfs een lage prestatiedosis al meer."
    de:
      title: "200 mg"
      body: "Sind das Maximum pro Koffeindosis. Ab etwa 67 kg ist selbst eine niedrige Leistungsdosis schon mehr."
    es:
      title: "200 mg"
      body: "Es el máximo por toma de cafeína. Por encima de 67 kg, hasta la dosis baja de rendimiento lo supera."
    fr:
      title: "200 mg"
      body: "C'est le maximum par prise de caféine. Au-delà de 67 kg, même la petite dose de perf dépasse ça."
    pt:
      title: "200 mg"
      body: "É o máximo por toma de cafeína. Acima de cerca de 67 kg, até a dose baixa de rendimento é mais."
    tr:
      title: "200 mg"
      body: "Tek seferlik kafein üst sınırı. Yaklaşık 67 kilonun üstünde düşük performans dozu bile bunu aşar."

  - key: lange-duur
    kind: fact
    en:
      title: "90 minutes"
      body: "Going hard for longer than that? Eat carb-rich meals or snacks in the hours before, and don't overeat just before."
    nl:
      title: "90 minuten"
      body: "Ga je langer dan dat hard? Eet in de uren ervoor koolhydraatrijk, en eet niet te veel vlak voor de start."
    de:
      title: "90 Minuten"
      body: "Länger hart unterwegs? Iss in den Stunden davor kohlenhydratreich, aber nicht zu viel kurz vor dem Start."
    es:
      title: "90 minutos"
      body: "¿Vas fuerte más tiempo? Come rico en hidratos en las horas previas y no te llenes justo antes."
    fr:
      title: "90 minutes"
      body: "Effort intense plus long ? Mange riche en glucides dans les heures avant, sans te gaver juste avant."
    pt:
      title: "90 minutos"
      body: "Esforço forte mais longo? Come rico em hidratos nas horas antes e não exageres mesmo antes."
    tr:
      title: "90 dakika"
      body: "Bundan uzun sert mi çalışacaksın? Önceki saatlerde karbonhidratlı ye, başlamadan hemen önce tıkınma."

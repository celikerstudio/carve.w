article: hydration
emoji: "💧"
tips:
  - key: liters-per-dag
    kind: fact
    en:
      title: "2 to 2.5 litres"
      body: "A day for most women and men, water from food included. More when it's hot or you train hard."
    nl:
      title: "2 tot 2,5 liter"
      body: "Per dag voor de meeste vrouwen en mannen, water uit eten inbegrepen. Meer bij hitte of zware training."
    de:
      title: "2 bis 2,5 Liter"
      body: "Am Tag für die meisten Frauen und Männer, Wasser aus Essen inklusive. Mehr bei Hitze oder hartem Training."
    es:
      title: "2 a 2,5 litros"
      body: "Al día para casi todas las mujeres y hombres, con el agua de la comida. Más con calor o entreno duro."
    fr:
      title: "2 à 2,5 litres"
      body: "Par jour pour la plupart des femmes et des hommes, eau des aliments comprise. Plus s'il fait chaud."
    pt:
      title: "2 a 2,5 litros"
      body: "Por dia para a maioria das mulheres e homens, com a água da comida. Mais com calor ou treino duro."
    tr:
      title: "2-2,5 litre"
      body: "Çoğu kadın ve erkek için günlük, yiyeceklerdeki su dahil. Sıcakta ya da sert antrenmanda daha fazla."

  - key: plaskleur
    kind: fact
    en:
      title: "Pale yellow"
      body: "Pee that colour most of the day is fine. Dark? Drink more. A rough check, not a precise measurement."
    nl:
      title: "Lichtgeel"
      body: "Plas die kleur het grootste deel van de dag is prima. Donker? Drink meer. Een grove check, geen meting."
    de:
      title: "Hellgelb"
      body: "Urin in dieser Farbe über den Tag ist okay. Dunkel? Trink mehr. Ein grober Check, keine Messung."
    es:
      title: "Amarillo claro"
      body: "Orina de ese color casi todo el día está bien. ¿Oscura? Bebe más. Una guía aproximada, no una medida."
    fr:
      title: "Jaune pâle"
      body: "Une urine de cette couleur presque toute la journée, c'est bon. Foncée ? Bois plus. Un repère, pas une mesure."
    pt:
      title: "Amarelo claro"
      body: "Urina dessa cor quase todo o dia está bem. Escura? Bebe mais. Uma verificação grosseira, não uma medição."
    tr:
      title: "Açık sarı"
      body: "Gün boyu idrarın bu renkteyse iyi. Koyu mu? Daha çok iç. Kabaca bir kontrol, kesin ölçüm değil."

  - key: twee-procent
    kind: fact
    en:
      title: "2%"
      body: "Of your bodyweight is the most to sweat off while training. At 80 kg that's 1.6 kg."
    nl:
      title: "2%"
      body: "Van je gewicht is het maximum om weg te zweten tijdens het trainen. Bij 80 kilo is dat 1,6 kilo."
    de:
      title: "2 %"
      body: "Deines Gewichts ist das Maximum, das du beim Training ausschwitzen solltest. Bei 80 kg sind das 1,6 kg."
    es:
      title: "2 %"
      body: "De tu peso es lo máximo que deberías sudar al entrenar. Con 80 kg son 1,6 kg."
    fr:
      title: "2 %"
      body: "De ton poids, c'est le maximum à perdre en sueur pendant l'effort. À 80 kg, ça fait 1,6 kg."
    pt:
      title: "2%"
      body: "Do teu peso é o máximo a perder em suor no treino. Com 80 kg são 1,6 kg."
    tr:
      title: "%2"
      body: "Antrenmanda terle kaybetmen gereken en fazla vücut ağırlığı. 80 kiloda 1,6 kg."

  - key: kracht-omlaag
    kind: fact
    en:
      title: "5.5%"
      body: "Less strength from dehydration, across 28 studies. Muscle endurance dropped 8.3%."
    nl:
      title: "5,5%"
      body: "Minder kracht door uitdroging, over 28 studies. Spieruithouding zakte 8,3%."
    de:
      title: "5,5 %"
      body: "Weniger Kraft durch Austrocknung, über 28 Studien. Die Kraftausdauer sank um 8,3 %."
    es:
      title: "5,5 %"
      body: "Menos fuerza por deshidratación, en 28 estudios. La resistencia muscular bajó un 8,3 %."
    fr:
      title: "5,5 %"
      body: "De force en moins avec la déshydratation, sur 28 études. L'endurance musculaire a baissé de 8,3 %."
    pt:
      title: "5,5%"
      body: "Menos força com desidratação, em 28 estudos. A resistência muscular desceu 8,3%."
    tr:
      title: "%5,5"
      body: "28 çalışmada susuzluk gücü bu kadar düşürdü. Kas dayanıklılığı %8,3 azaldı."

  - key: zweet-wegen
    kind: fact
    en:
      title: "1 kilo"
      body: "Lost in training is about a litre of sweat. Weigh before and after, and add what you drank."
    nl:
      title: "1 kilo"
      body: "Kwijt na het trainen is ongeveer een liter zweet. Weeg je ervoor en erna, en tel op wat je dronk."
    de:
      title: "1 Kilo"
      body: "Verlust im Training ist etwa ein Liter Schweiß. Wieg dich vorher und nachher und rechne Getrunkenes dazu."
    es:
      title: "1 kilo"
      body: "Perdido al entrenar es más o menos un litro de sudor. Pésate antes y después y suma lo que bebiste."
    fr:
      title: "1 kilo"
      body: "Perdu à l'entraînement, c'est environ un litre de sueur. Pèse-toi avant et après, et ajoute ce que tu as bu."
    pt:
      title: "1 quilo"
      body: "Perdido no treino é cerca de um litro de suor. Pesa-te antes e depois e soma o que bebeste."
    tr:
      title: "1 kilo"
      body: "Antrenmanda kaybedilen yaklaşık bir litre terdir. Önce ve sonra tartıl, içtiğini de ekle."

  - key: gelijk-terugdrinken
    kind: myth
    en:
      title: "Drink it back"
      body: "Myth: drink back exactly what you sweated. Men needed more to recover. With little salt, much came out as urine."
    nl:
      title: "Terugdrinken"
      body: "Mythe: drink precies terug wat je zweette. Mannen hadden meer nodig. Met weinig zout plasten ze veel weer uit."
    de:
      title: "Zurücktrinken"
      body: "Mythos: Trink genau zurück, was du ausgeschwitzt hast. Es brauchte mehr. Ohne Salz kam viel als Urin raus."
    es:
      title: "Reponer lo sudado"
      body: "Mito: bebe justo lo que sudaste. Hizo falta más. Con poca sal, mucho salió como orina."
    fr:
      title: "Boire ce qu'on sue"
      body: "Mythe : rebois pile ce que tu as sué. Il a fallu plus. Avec peu de sel, une bonne partie est ressortie."
    pt:
      title: "Repor o suor"
      body: "Mito: bebe exatamente o que suaste. Foi preciso mais. Com pouco sal, muito saiu em urina."
    tr:
      title: "Tere eşit içmek"
      body: "Efsane: terlediğin kadarını iç. Erkeklerin daha fazlası gerekti. Az tuzla çoğu idrarla çıktı."

  - key: zout-erbij
    kind: fact
    en:
      title: "Add salt"
      body: "After a sweaty session, drink a bit more than you lost, with some salt. A salted meal does the job."
    nl:
      title: "Zout erbij"
      body: "Na een zweterige training drink je iets meer dan je verloor, met wat zout. Een zoute maaltijd erbij volstaat."
    de:
      title: "Salz dazu"
      body: "Nach schweißtreibendem Training etwas mehr trinken als verloren, mit etwas Salz. Eine salzige Mahlzeit reicht."
    es:
      title: "Con sal"
      body: "Tras sudar mucho, bebe algo más de lo perdido, con algo de sal. Una comida salada sirve."
    fr:
      title: "Avec du sel"
      body: "Après une séance en sueur, bois un peu plus que perdu, avec du sel. Un repas salé fait l'affaire."
    pt:
      title: "Com sal"
      body: "Depois de suar muito, bebe um pouco mais do que perdeste, com algum sal. Uma refeição salgada chega."
    tr:
      title: "Tuz ekle"
      body: "Terli bir antrenmandan sonra kaybettiğinden biraz fazla iç, yanında biraz tuz al. Tuzlu bir öğün yeter."

  - key: melk-blijft
    kind: fact
    en:
      title: "Milk"
      body: "Stayed in better than water over four hours at rest. Coffee, tea, beer and sports drinks were like water."
    nl:
      title: "Melk"
      body: "Bleef in rust vier uur lang beter in je lijf dan water. Koffie, thee, bier en sportdrank deden niet onder voor water."
    de:
      title: "Milch"
      body: "Blieb in Ruhe über vier Stunden besser im Körper als Wasser. Kaffee, Tee, Bier und Sportgetränke wie Wasser."
    es:
      title: "Leche"
      body: "Se retuvo mejor que el agua durante cuatro horas en reposo. Café, té, cerveza y bebida deportiva, igual que agua."
    fr:
      title: "Lait"
      body: "Mieux retenu que l'eau sur quatre heures au repos. Café, thé, bière et boisson d'effort comme l'eau."
    pt:
      title: "Leite"
      body: "Ficou melhor no corpo do que a água durante quatro horas em repouso. Café, chá, cerveja e isotónicos como água."
    tr:
      title: "Süt"
      body: "Dinlenirken dört saat boyunca sudan daha iyi tutuldu. Kahve, çay, bira ve spor içeceği su gibiydi."

  - key: koffie-droogt-uit
    kind: myth
    en:
      title: "4 cups"
      body: "Myth: coffee dehydrates you. Four cups a day kept regular drinkers as hydrated as water. It counts."
    nl:
      title: "4 koppen"
      body: "Mythe: koffie droogt je uit. Vier koppen per dag hielden vaste drinkers net zo goed op peil als water. Het telt mee."
    de:
      title: "4 Tassen"
      body: "Mythos: Kaffee trocknet aus. Vier Tassen am Tag hielten Gewohnheitstrinker so gut versorgt wie Wasser."
    es:
      title: "4 tazas"
      body: "Mito: el café deshidrata. Cuatro tazas al día hidrataron a bebedores habituales igual que el agua. Cuenta."
    fr:
      title: "4 tasses"
      body: "Mythe : le café déshydrate. Quatre tasses par jour ont hydraté les habitués autant que l'eau. Ça compte."
    pt:
      title: "4 chávenas"
      body: "Mito: o café desidrata. Quatro chávenas por dia hidrataram os habituais tanto como água. Conta."
    tr:
      title: "4 fincan"
      body: "Efsane: kahve susuz bırakır. Günde dört fincan, düzenli içenleri su kadar iyi tuttu. Sayılır."

  - key: te-veel-water
    kind: myth
    en:
      title: "Too much water"
      body: "Myth: you can't drink too much. More than you sweat can dilute your blood sodium, mostly in events over 4 hours."
    nl:
      title: "Te veel water"
      body: "Mythe: te veel water bestaat niet. Meer dan je zweet kan je natrium verdunnen, vooral bij inspanning boven 4 uur."
    de:
      title: "Zu viel Wasser"
      body: "Mythos: Zu viel Wasser gibt es nicht. Mehr als du schwitzt kann Natrium verdünnen, vor allem über 4 Stunden."
    es:
      title: "Demasiada agua"
      body: "Mito: no se puede beber de más. Más de lo que sudas puede diluir el sodio, sobre todo en pruebas de 4 horas."
    fr:
      title: "Trop d'eau"
      body: "Mythe : on ne boit jamais trop. Plus que ta sueur peut diluer le sodium, surtout sur plus de 4 heures."
    pt:
      title: "Água a mais"
      body: "Mito: não se bebe água a mais. Mais do que suas pode diluir o sódio, sobretudo em provas de 4 horas."
    tr:
      title: "Fazla su"
      body: "Efsane: fazla su içilmez. Terlediğinden fazlası kandaki sodyumu seyreltebilir, çoğunlukla 4 saati aşan eforda."

article: fitness-40-plus
emoji: "🎂"
tips:
  - key: geen-grens-bij-40
    kind: myth
    en:
      title: "After 40"
      body: "Myth: after 40 the rules change. WHO and Dutch health advice draw no line at 40. Adult advice still applies."
    nl:
      title: "Na je 40e"
      body: "Mythe: na je 40e gelden andere regels. WHO en Gezondheidsraad trekken geen grens bij 40. Het volwassenenadvies geldt."
    de:
      title: "Ab 40"
      body: "Mythos: Ab 40 gelten andere Regeln. Die WHO zieht keine Grenze bei 40. Es gilt der Rat für Erwachsene."
    es:
      title: "A partir de los 40"
      body: "Mito: después de los 40 cambian las reglas. La OMS no pone ningún límite en los 40. Vale el consejo adulto."
    fr:
      title: "Après 40 ans"
      body: "Mythe : après 40 ans, les règles changent. L'OMS ne trace aucune limite à 40. Le conseil adulte s'applique."
    pt:
      title: "Depois dos 40"
      body: "Mito: depois dos 40 as regras mudam. A OMS não traça nenhum limite aos 40. Vale o conselho para adultos."
    tr:
      title: "40'tan sonra"
      body: "Efsane: 40'tan sonra kurallar değişir. DSÖ 40'ta bir sınır çizmiyor. Yetişkin önerisi geçerli."

  - key: twee-keer-kracht
    kind: fact
    en:
      title: "2 days a week"
      body: "Of strength training is what WHO asks of adults. The Dutch Health Council says the same."
    nl:
      title: "2 dagen per week"
      body: "Krachttraining vraagt de WHO van volwassenen. De Gezondheidsraad zegt ook minstens twee keer."
    de:
      title: "2 Tage pro Woche"
      body: "Krafttraining verlangt die WHO von Erwachsenen. Der niederländische Gesundheitsrat sagt dasselbe."
    es:
      title: "2 días por semana"
      body: "De fuerza pide la OMS a los adultos. El Consejo de Salud neerlandés dice lo mismo."
    fr:
      title: "2 jours par semaine"
      body: "De renforcement, c'est ce que l'OMS demande aux adultes. Le Conseil de santé néerlandais aussi."
    pt:
      title: "2 dias por semana"
      body: "De força é o que a OMS pede aos adultos. O Conselho de Saúde neerlandês diz o mesmo."
    tr:
      title: "Haftada 2 gün"
      body: "DSÖ yetişkinlerden haftada en az bu kadar kuvvet antrenmanı istiyor. Hollanda Sağlık Konseyi de öyle."

  - key: vanaf-65
    kind: fact
    en:
      title: "From 65"
      body: "WHO adds balance and strength work on 3 or more days a week. The aim: better functioning, fewer falls."
    nl:
      title: "Vanaf 65"
      body: "De WHO voegt balans- en krachtwerk toe op 3 of meer dagen per week. Doel: beter functioneren, minder vallen."
    de:
      title: "Ab 65"
      body: "Die WHO ergänzt Gleichgewicht und Kraft an 3 oder mehr Tagen pro Woche. Ziel: fitter bleiben, weniger Stürze."
    es:
      title: "Desde los 65"
      body: "La OMS añade equilibrio y fuerza 3 o más días por semana. El objetivo: funcionar mejor y caerse menos."
    fr:
      title: "Dès 65 ans"
      body: "L'OMS ajoute équilibre et force 3 jours ou plus par semaine. Le but : mieux fonctionner, moins tomber."
    pt:
      title: "A partir dos 65"
      body: "A OMS junta equilíbrio e força 3 ou mais dias por semana. Objetivo: funcionar melhor e cair menos."
    tr:
      title: "65'ten sonra"
      body: "DSÖ haftada 3 ya da daha çok gün denge ve kuvvet çalışması ekliyor. Amaç daha iyi işlev, daha az düşme."

  - key: traplopen-en-stoel
    kind: fact
    en:
      title: "Stairs count"
      body: "So does getting up from a chair again and again, says the Dutch Health Council. Older adults add balance."
    nl:
      title: "Traplopen telt"
      body: "Net als steeds opstaan uit een stoel, zegt de Gezondheidsraad. Ouderen doen er balansoefeningen bij."
    de:
      title: "Treppen zählen"
      body: "Genau wie wiederholtes Aufstehen vom Stuhl, sagt der Gesundheitsrat. Ältere ergänzen Gleichgewicht."
    es:
      title: "Las escaleras cuentan"
      body: "Igual que levantarse de una silla una y otra vez. Los mayores añaden equilibrio."
    fr:
      title: "Les escaliers comptent"
      body: "Tout comme se lever d'une chaise encore et encore. Les plus âgés ajoutent de l'équilibre."
    pt:
      title: "As escadas contam"
      body: "Tal como levantar-te de uma cadeira vezes sem conta. Os mais velhos juntam equilíbrio."
    tr:
      title: "Merdiven sayılır"
      body: "Sandalyeden tekrar tekrar kalkmak da öyle. Yaşlılar denge çalışması ekler."

  - key: spier-en-ouder-worden
    kind: fact
    en:
      title: "Getting older"
      body: "Even without disease it can cost muscle, strength and function. Strength training is a strong counter."
    nl:
      title: "Ouder worden"
      body: "Ook zonder ziekte kan dat spiermassa, kracht en functie kosten. Krachttraining is een sterk tegenwicht."
    de:
      title: "Älter werden"
      body: "Auch ohne Krankheit kann es Muskeln, Kraft und Funktion kosten. Krafttraining hält stark dagegen."
    es:
      title: "Envejecer"
      body: "Incluso sin enfermedad puede costar músculo, fuerza y función. Las pesas son un buen contrapeso."
    fr:
      title: "Vieillir"
      body: "Même sans maladie, ça peut coûter muscle, force et autonomie. La muscu est un vrai contrepoids."
    pt:
      title: "Envelhecer"
      body: "Mesmo sem doença pode custar músculo, força e função. O treino de força é um bom contrapeso."
    tr:
      title: "Yaşlanmak"
      body: "Hastalık olmadan da kas, güç ve işlev kaybettirebilir. Kuvvet antrenmanı buna güçlü bir karşılık."

  - key: niet-gevaarlijker
    kind: myth
    en:
      title: "38,000 people"
      body: "Myth: exercise gets risky with age. In that many people, 11,000 of them older, it didn't raise serious harm."
    nl:
      title: "38.000 mensen"
      body: "Mythe: sporten wordt gevaarlijk met de jaren. Bij zoveel mensen, 11.000 ouderen, gaf het geen extra ernstige schade."
    de:
      title: "38.000 Menschen"
      body: "Mythos: Sport wird mit dem Alter riskant. Bei so vielen, 11.000 davon älter, gab es nicht mehr ernste Schäden."
    es:
      title: "38.000 personas"
      body: "Mito: el ejercicio se vuelve peligroso con la edad. En tantas personas, 11.000 mayores, no subió el daño grave."
    fr:
      title: "38 000 personnes"
      body: "Mythe : le sport devient risqué avec l'âge. Sur autant de gens, dont 11 000 âgés, pas plus d'effets graves."
    pt:
      title: "38.000 pessoas"
      body: "Mito: o exercício fica perigoso com a idade. Em tantas pessoas, 11.000 mais velhas, não subiu o dano grave."
    tr:
      title: "38.000 kişi"
      body: "Efsane: yaş ilerledikçe egzersiz riskli olur. 11.000'i yaşlı bu kadar kişide ciddi zarar artmadı."

  - key: chronische-aandoening
    kind: fact
    en:
      title: "Chronic condition"
      body: "Ask a healthcare professional which kinds and amounts of activity suit you, the WHO suggests."
    nl:
      title: "Chronische aandoening"
      body: "Vraag een zorgverlener welke soorten en hoeveelheid beweging bij je passen, oppert de WHO."
    de:
      title: "Chronisch krank"
      body: "Frag eine Fachperson, welche Art und Menge Bewegung zu dir passt, rät die WHO."
    es:
      title: "Enfermedad crónica"
      body: "Pregunta a un profesional sanitario qué tipo y cantidad de actividad te van, sugiere la OMS."
    fr:
      title: "Maladie chronique"
      body: "Demande à un soignant quels types et quelle dose d'activité te conviennent, suggère l'OMS."
    pt:
      title: "Doença crónica"
      body: "Pergunta a um profissional de saúde que tipo e quantidade de atividade te servem, sugere a OMS."
    tr:
      title: "Kronik hastalık"
      body: "DSÖ, sana hangi tür ve miktarda hareketin uyduğunu bir sağlık uzmanına sormanı öneriyor."

  - key: nieuwe-klachten
    kind: fact
    en:
      title: "New symptoms"
      body: "Notice new symptoms while you build up? The WHO says to see a healthcare provider."
    nl:
      title: "Nieuwe klachten"
      body: "Merk je nieuwe klachten terwijl je opbouwt? De WHO zegt: ga naar een zorgverlener."
    de:
      title: "Neue Beschwerden"
      body: "Merkst du beim Steigern neue Beschwerden? Die WHO sagt: geh zu einer Fachperson."
    es:
      title: "Síntomas nuevos"
      body: "¿Notas síntomas nuevos mientras subes? La OMS dice que veas a un profesional sanitario."
    fr:
      title: "Nouveaux symptômes"
      body: "Tu remarques de nouveaux symptômes en progressant ? L'OMS dit de consulter."
    pt:
      title: "Sintomas novos"
      body: "Notas sintomas novos enquanto aumentas? A OMS diz para ires a um profissional de saúde."
    tr:
      title: "Yeni şikâyetler"
      body: "Yükü artırırken yeni şikâyetler mi fark ettin? DSÖ bir sağlık uzmanına gitmeni söylüyor."

  - key: licht-beginnen
    kind: fact
    en:
      title: "Start light"
      body: "New to lifting? Start with light loads and build up. Adding weight over time is what pays off."
    nl:
      title: "Begin licht"
      body: "Nieuw met krachttraining? Begin met lichte gewichten en bouw op. Het toevoegen levert de winst op."
    de:
      title: "Leicht starten"
      body: "Neu im Krafttraining? Fang leicht an und steigere dich. Das Steigern bringt den Nutzen."
    es:
      title: "Empieza ligero"
      body: "¿Nuevo con las pesas? Empieza con poco peso y sube. Es al ir sumando cuando ganas."
    fr:
      title: "Commence léger"
      body: "Nouveau en muscu ? Commence léger et augmente. C'est la progression qui paie."
    pt:
      title: "Começa leve"
      body: "Novo no treino de força? Começa com pouco peso e vai subindo. É a progressão que compensa."
    tr:
      title: "Hafif başla"
      body: "Ağırlığa yeni misin? Hafif yükle başla ve artır. Kazancı zamanla eklemek getirir."

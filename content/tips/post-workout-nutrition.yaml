article: post-workout-nutrition
emoji: "🍳"
tips:
  - key: anabool-venster
    kind: myth
    en:
      title: "24 hours"
      body: "Myth: eat protein within an hour of training. Muscles stay more responsive for up to 24 hours, fading over time."
    nl:
      title: "24 uur"
      body: "Mythe: binnen een uur na de training eiwit eten. Spieren blijven tot 24 uur gevoeliger, steeds iets minder."
    de:
      title: "24 Stunden"
      body: "Mythos: Protein muss binnen einer Stunde rein. Muskeln bleiben bis zu 24 Stunden empfänglicher, mit der Zeit weniger."
    es:
      title: "24 horas"
      body: "Mito: come proteína en la hora tras entrenar. El músculo sigue más receptivo hasta 24 horas, cada vez menos."
    fr:
      title: "24 heures"
      body: "Mythe : protéines dans l'heure après la séance. Le muscle reste plus réceptif jusqu'à 24 heures, de moins en moins."
    pt:
      title: "24 horas"
      body: "Mito: come proteína na hora a seguir ao treino. O músculo fica mais recetivo até 24 horas, cada vez menos."
    tr:
      title: "24 saat"
      body: "Efsane: antrenmandan sonraki bir saatte protein ye. Kaslar 24 saate kadar daha duyarlı kalır, giderek azalarak."

  - key: hoeveel-eiwit
    kind: fact
    en:
      title: "20 to 40 g"
      body: "Protein in the meal after training does the job. At 80 kg that's 20 to 32 g."
    nl:
      title: "20 tot 40 gram"
      body: "Eiwit in de maaltijd na de training is genoeg. Bij 80 kilo is dat 20 tot 32 gram."
    de:
      title: "20 bis 40 g"
      body: "Protein in der Mahlzeit nach dem Training reichen. Bei 80 kg sind es 20 bis 32 g."
    es:
      title: "20 a 40 g"
      body: "De proteína en la comida tras entrenar bastan. Con 80 kg son 20 a 32 g."
    fr:
      title: "20 à 40 g"
      body: "De protéines dans le repas d'après suffisent. À 80 kg, c'est 20 à 32 g."
    pt:
      title: "20 a 40 g"
      body: "De proteína na refeição depois do treino chegam. Com 80 kg são 20 a 32 g."
    tr:
      title: "20-40 g"
      body: "Antrenman sonrası öğünde bu kadar protein yeter. 80 kiloda 20-32 g."

  - key: full-body-40g
    kind: fact
    en:
      title: "40 g"
      body: "Of whey after a full-body session built more muscle protein than 20 g in young lifters. Aim high."
    nl:
      title: "40 gram"
      body: "Whey na een full-body training bouwde bij jonge sporters meer spiereiwit op dan 20 gram. Mik hoog."
    de:
      title: "40 g"
      body: "Whey nach einer Ganzkörpereinheit bauten bei jungen Sportlern mehr Muskelprotein auf als 20 g. Ziel hoch."
    es:
      title: "40 g"
      body: "De whey tras una sesión de cuerpo completo dieron más síntesis muscular que 20 g en jóvenes. Apunta alto."
    fr:
      title: "40 g"
      body: "De whey après une séance full body ont fait plus de protéines musculaires que 20 g. Vise haut."
    pt:
      title: "40 g"
      body: "De whey após um treino de corpo inteiro deram mais síntese que 20 g em jovens. Aponta alto."
    tr:
      title: "40 g"
      body: "Tüm vücut antrenmanı sonrası whey, genç sporcularda 20 g'dan daha çok kas proteini yaptı. Yükseği hedefle."

  - key: koolhydraten-niet-nodig
    kind: myth
    en:
      title: "50 g of carbs"
      body: "Myth: you need carbs after lifting to grow. Adding them to 25 g of whey didn't raise muscle building."
    nl:
      title: "50 gram koolhydraten"
      body: "Mythe: na het tillen heb je koolhydraten nodig om te groeien. Bij 25 gram whey gaf dat geen extra spieropbouw."
    de:
      title: "50 g Kohlenhydrate"
      body: "Mythos: Nach dem Training brauchst du Kohlenhydrate zum Wachsen. Zu 25 g Whey brachten sie nichts extra."
    es:
      title: "50 g de hidratos"
      body: "Mito: tras las pesas necesitas hidratos para crecer. Sumarlos a 25 g de whey no subió la síntesis muscular."
    fr:
      title: "50 g de glucides"
      body: "Mythe : il faut des glucides après la muscu pour grossir. Ajoutés à 25 g de whey, ils n'ont rien changé."
    pt:
      title: "50 g de hidratos"
      body: "Mito: depois do treino precisas de hidratos para crescer. Juntá-los a 25 g de whey não subiu a síntese."
    tr:
      title: "50 g karbonhidrat"
      body: "Efsane: büyümek için antrenman sonrası karbonhidrat şart. 25 g whey'e eklemek kas yapımını artırmadı."

  - key: wanneer-koolhydraten
    kind: fact
    en:
      title: "Within 4 hours"
      body: "Training again that soon, or low on carbs overall? Then post-workout carbs matter. Otherwise the daily total does."
    nl:
      title: "Binnen 4 uur"
      body: "Train je zo snel weer, of eet je weinig koolhydraten? Dan tellen ze na de training. Anders telt je dagtotaal."
    de:
      title: "Innerhalb 4 Std."
      body: "Trainierst du so bald wieder oder isst insgesamt wenig Kohlenhydrate? Dann zählen sie danach. Sonst die Tagessumme."
    es:
      title: "En 4 horas"
      body: "¿Vuelves a entrenar tan pronto o comes pocos hidratos? Entonces cuentan tras entrenar. Si no, el total diario."
    fr:
      title: "Sous 4 heures"
      body: "Tu t'entraînes à nouveau si vite, ou tu manges peu de glucides ? Alors ils comptent après. Sinon, le total."
    pt:
      title: "Em 4 horas"
      body: "Voltas a treinar tão cedo ou comes poucos hidratos? Então contam depois do treino. Senão, conta o total."
    tr:
      title: "4 saat içinde"
      body: "Bu kadar kısa sürede yine çalışıyorsan ya da genel olarak az karbonhidrat yiyorsan önemli. Yoksa günlük toplam."

  - key: voor-of-na
    kind: fact
    en:
      title: "Before or after"
      body: "25 g of protein right before or right after training gave similar strength and muscle over 10 weeks."
    nl:
      title: "Voor of na"
      body: "25 gram eiwit vlak voor of vlak na de training gaf over 10 weken evenveel kracht en spier."
    de:
      title: "Vorher oder nachher"
      body: "25 g Protein direkt vor oder nach dem Training brachten in 10 Wochen ähnlich viel Kraft und Muskeln."
    es:
      title: "Antes o después"
      body: "25 g de proteína justo antes o después de entrenar dieron fuerza y músculo parecidos en 10 semanas."
    fr:
      title: "Avant ou après"
      body: "25 g de protéines juste avant ou juste après la séance ont donné autant de force et de muscle sur 10 semaines."
    pt:
      title: "Antes ou depois"
      body: "25 g de proteína mesmo antes ou depois do treino deram força e músculo parecidos em 10 semanas."
    tr:
      title: "Önce ya da sonra"
      body: "Antrenmandan hemen önce ya da sonra 25 g protein, 10 haftada benzer güç ve kas verdi."

  - key: glycogeen-tillen
    kind: fact
    en:
      title: "39%"
      body: "Less glycogen in the muscle after six sets of leg extensions. Lifting rarely empties your stores, but it uses them."
    nl:
      title: "39%"
      body: "Minder glycogeen in de spier na zes sets leg extensions. Tillen maakt je voorraad zelden leeg, maar gebruikt hem wel."
    de:
      title: "39 %"
      body: "Weniger Glykogen im Muskel nach sechs Sätzen Beinstrecken. Krafttraining leert die Speicher selten, nutzt sie aber."
    es:
      title: "39 %"
      body: "Menos glucógeno en el músculo tras seis series de extensiones. Las pesas rara vez vacían tus reservas, pero las usan."
    fr:
      title: "39 %"
      body: "De glycogène en moins après six séries de leg extension. La muscu vide rarement les réserves, mais s'en sert."
    pt:
      title: "39%"
      body: "Menos glicogénio no músculo após seis séries de extensões. O treino de força raramente esvazia as reservas, mas usa-as."
    tr:
      title: "%39"
      body: "Altı set bacak uzatmadan sonra kastaki glikojen bu kadar azaldı. Ağırlık depoları nadiren boşaltır ama kullanır."

  - key: wachten-op-avondeten
    kind: fact
    en:
      title: "Dinner soon"
      body: "In an hour or two? Waiting for it is fine. Just make sure the meal has a good portion of protein."
    nl:
      title: "Straks eten"
      body: "Over een uur of twee? Dan kun je prima wachten. Zorg dat er een flinke portie eiwit in zit."
    de:
      title: "Gleich Abendessen"
      body: "In ein, zwei Stunden? Dann kannst du warten. Sorg für eine gute Portion Protein."
    es:
      title: "Cena pronto"
      body: "¿En una o dos horas? Puedes esperar. Solo asegúrate de que lleve buena proteína."
    fr:
      title: "Dîner bientôt"
      body: "Dans une heure ou deux ? Tu peux attendre. Assure-toi juste d'une bonne portion de protéines."
    pt:
      title: "Jantar daqui a pouco"
      body: "Daqui a uma ou duas horas? Podes esperar. Garante que tem uma boa dose de proteína."
    tr:
      title: "Akşam yemeği yakında"
      body: "Bir iki saat sonra mı? Beklemek sorun değil. Öğünde iyi bir porsiyon protein olsun."

article: stretching
emoji: "🙆"
tips:
  - key: bewegingsbereik
    kind: fact
    en:
      title: "Range of motion"
      body: "That's what stretching does well, right away and over weeks. Experts add that there are alternatives."
    nl:
      title: "Bewegingsruimte"
      body: "Dat is waar rekken goed in is, direct en over weken. Experts voegen eraan toe dat er alternatieven zijn."
    de:
      title: "Beweglichkeit"
      body: "Darin ist Dehnen gut, sofort und über Wochen. Fachleute ergänzen, dass es Alternativen gibt."
    es:
      title: "Rango de movimiento"
      body: "Es lo que mejor hace el estiramiento, al momento y en semanas. Los expertos añaden que hay alternativas."
    fr:
      title: "Amplitude"
      body: "C'est ce que les étirements font bien, tout de suite et sur des semaines. Il existe des alternatives."
    pt:
      title: "Amplitude"
      body: "É o que o alongamento faz bem, logo e ao longo de semanas. Os especialistas dizem que há alternativas."
    tr:
      title: "Hareket açıklığı"
      body: "Esnemenin iyi yaptığı şey bu, hemen ve haftalar içinde. Uzmanlar başka yollar da olduğunu ekliyor."

  - key: direct-meer-ruimte
    kind: fact
    en:
      title: "5 to 30 seconds"
      body: "At least 2 bouts that long give more range right away, an expert panel says."
    nl:
      title: "5 tot 30 seconden"
      body: "Minstens 2 keer zo lang geeft direct meer ruimte, zegt een expertpanel."
    de:
      title: "5 bis 30 Sekunden"
      body: "Mindestens 2-mal so lange bringt sofort mehr Umfang, sagt ein Expertengremium."
    es:
      title: "5 a 30 segundos"
      body: "Al menos 2 veces así dan más rango al momento, según un panel de expertos."
    fr:
      title: "5 à 30 secondes"
      body: "Au moins 2 fois donnent plus d'amplitude tout de suite, selon un panel d'experts."
    pt:
      title: "5 a 30 segundos"
      body: "Pelo menos 2 vezes assim dão mais amplitude logo, diz um painel de especialistas."
    tr:
      title: "5-30 saniye"
      body: "Uzman paneline göre en az 2 kez bu kadar esneme hemen daha çok açıklık verir."

  - key: op-lange-termijn
    kind: fact
    en:
      title: "30 to 120 seconds"
      body: "Per muscle, 2 to 3 sets a day, is the dose for the most flexibility gain over weeks."
    nl:
      title: "30 tot 120 seconden"
      body: "Per spier, 2 tot 3 sets per dag, is de dosis voor de meeste lenigheid over weken."
    de:
      title: "30 bis 120 Sekunden"
      body: "Pro Muskel, 2 bis 3 Sätze am Tag, ist die Dosis für den größten Gewinn über Wochen."
    es:
      title: "30 a 120 segundos"
      body: "Por músculo, 2 o 3 series al día, es la dosis para ganar más flexibilidad en semanas."
    fr:
      title: "30 à 120 secondes"
      body: "Par muscle, 2 à 3 séries par jour : la dose pour le plus de souplesse sur des semaines."
    pt:
      title: "30 a 120 segundos"
      body: "Por músculo, 2 a 3 séries por dia, é a dose para mais flexibilidade em semanas."
    tr:
      title: "30-120 saniye"
      body: "Kas başına, günde 2-3 set: haftalar içinde en çok esneklik için doz bu."

  - key: acsm-basis
    kind: fact
    en:
      title: "60 seconds"
      body: "Per exercise for each major muscle group, on at least 2 days a week. That's the ACSM baseline."
    nl:
      title: "60 seconden"
      body: "Per oefening voor elke grote spiergroep, minstens 2 dagen per week. Dat is de ACSM-basis."
    de:
      title: "60 Sekunden"
      body: "Pro Übung für jede große Muskelgruppe, an mindestens 2 Tagen pro Woche. Das ist die ACSM-Basis."
    es:
      title: "60 segundos"
      body: "Por ejercicio para cada grupo muscular grande, al menos 2 días por semana. Es la base del ACSM."
    fr:
      title: "60 secondes"
      body: "Par exercice pour chaque grand groupe musculaire, au moins 2 jours par semaine. La base de l'ACSM."
    pt:
      title: "60 segundos"
      body: "Por exercício para cada grande grupo muscular, pelo menos 2 dias por semana. É a base do ACSM."
    tr:
      title: "60 saniye"
      body: "Her büyük kas grubu için hareket başına, haftada en az 2 gün. ACSM'nin temel önerisi bu."

  - key: techniek-maakt-niet-uit
    kind: myth
    en:
      title: "Best method"
      body: "Myth: one stretching method beats the rest. For a quick gain all work alike. Over weeks, static or PNF is preferred."
    nl:
      title: "Beste methode"
      body: "Mythe: één rekmethode wint. Voor direct effect werken ze gelijk. Voor weken hebben statisch of PNF de voorkeur."
    de:
      title: "Beste Methode"
      body: "Mythos: Eine Dehnmethode ist die beste. Kurzfristig wirken alle gleich. Über Wochen bevorzugt man statisch oder PNF."
    es:
      title: "El mejor método"
      body: "Mito: un método de estiramiento gana. Al momento todos funcionan igual. En semanas, mejor estático o FNP."
    fr:
      title: "Meilleure méthode"
      body: "Mythe : une méthode d'étirement l'emporte. Sur le coup, toutes se valent. Sur des semaines, statique ou PNF."
    pt:
      title: "Melhor método"
      body: "Mito: um método de alongamento ganha. No imediato, todos iguais. Em semanas, preferem estático ou FNP."
    tr:
      title: "En iyi yöntem"
      body: "Efsane: bir esneme yöntemi en iyisidir. Hemen etkide hepsi aynı. Haftalar içinde statik ya da PNF tercih ediliyor."

  - key: geen-spiergroei
    kind: myth
    en:
      title: "15 minutes"
      body: "Myth: stretching builds muscle. Only over 15 minutes a day per muscle, for 6 weeks or more, gave small gains."
    nl:
      title: "15 minuten"
      body: "Mythe: rekken bouwt spier. Pas boven 15 minuten per dag per spier, 6 weken of langer, kwam er wat bij."
    de:
      title: "15 Minuten"
      body: "Mythos: Dehnen baut Muskeln. Erst ab 15 Minuten pro Tag und Muskel, 6 Wochen lang, gab es kleine Zuwächse."
    es:
      title: "15 minutos"
      body: "Mito: estirar da músculo. Solo con más de 15 minutos al día por músculo durante 6 semanas hubo algo."
    fr:
      title: "15 minutes"
      body: "Mythe : s'étirer fait du muscle. Seulement au-delà de 15 minutes par jour et par muscle, 6 semaines, un peu."
    pt:
      title: "15 minutos"
      body: "Mito: alongar dá músculo. Só com mais de 15 minutos por dia por músculo, 6 semanas, houve algum ganho."
    tr:
      title: "15 dakika"
      body: "Efsane: esneme kas yapar. Sadece kas başına günde 15 dakikayı aşan, 6 hafta süren esneme biraz kazandırdı."

  - key: niet-verplicht-in-warming-up
    kind: myth
    en:
      title: "Warm-up"
      body: "Myth: you have to stretch in your warm-up. Experts call it not essential. It's fine if you want more range."
    nl:
      title: "Warming-up"
      body: "Mythe: je moet rekken in je warming-up. Experts noemen het niet nodig. Prima als je meer ruimte wilt."
    de:
      title: "Aufwärmen"
      body: "Mythos: Dehnen gehört ins Aufwärmen. Fachleute nennen es nicht nötig. Gut, wenn du mehr Umfang willst."
    es:
      title: "Calentamiento"
      body: "Mito: hay que estirar al calentar. Los expertos dicen que no es esencial. Bien si quieres más rango."
    fr:
      title: "Échauffement"
      body: "Mythe : il faut s'étirer à l'échauffement. Pas essentiel, disent les experts. Ok si tu veux plus d'amplitude."
    pt:
      title: "Aquecimento"
      body: "Mito: tens de alongar no aquecimento. Os especialistas dizem que não é essencial. Bom se quiseres amplitude."
    tr:
      title: "Isınma"
      body: "Efsane: ısınmada esnemek şart. Uzmanlar gerekli değil diyor. Daha çok açıklık istiyorsan yapabilirsin."

  - key: ruimte-zonder-rekken
    kind: fact
    en:
      title: "Full range"
      body: "Lifting through it improved range at least as much as stretching, especially with an emphasised lowering phase."
    nl:
      title: "Volledige ruimte"
      body: "Daardoorheen tillen verbeterde je bewegingsruimte minstens zo goed, vooral met nadruk op het zakken."
    de:
      title: "Voller Umfang"
      body: "Darin zu trainieren verbesserte die Beweglichkeit mindestens so gut, vor allem mit betontem Absenken."
    es:
      title: "Recorrido completo"
      body: "Entrenar en todo el recorrido mejoró el rango al menos igual, sobre todo cuidando la bajada."
    fr:
      title: "Amplitude complète"
      body: "La muscu sur toute l'amplitude a amélioré la souplesse au moins autant, surtout en soignant la descente."
    pt:
      title: "Amplitude total"
      body: "Treinar em toda a amplitude melhorou a flexibilidade pelo menos tanto, sobretudo com descida controlada."
    tr:
      title: "Tam açıklık"
      body: "Tam açıklıkta ağırlık çalışmak esnekliği en az esneme kadar artırdı, özellikle inişe vurgu yapınca."

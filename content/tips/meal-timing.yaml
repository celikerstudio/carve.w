article: meal-timing
emoji: "⏰"
tips:
  - key: dagtotaal-eerst
    kind: fact
    en:
      title: "Daily total"
      body: "Where protein timing seemed to help, people ate more protein. With equal totals the gap mostly vanished."
    nl:
      title: "Dagtotaal"
      body: "Waar eiwittiming leek te helpen, aten mensen meer eiwit. Bij een gelijk totaal verdween het verschil grotendeels."
    de:
      title: "Tagessumme"
      body: "Wo Protein-Timing zu helfen schien, aßen die Leute mehr Protein. Bei gleicher Summe verschwand der Effekt meist."
    es:
      title: "Total diario"
      body: "Donde el timing de proteína parecía ayudar, se comía más proteína. Con el mismo total, la diferencia casi se fue."
    fr:
      title: "Total du jour"
      body: "Là où le timing semblait aider, on mangeait plus de protéines. À total égal, l'écart disparaissait presque."
    pt:
      title: "Total diário"
      body: "Onde o timing da proteína parecia ajudar, comia-se mais proteína. Com o mesmo total, a diferença quase sumiu."
    tr:
      title: "Günlük toplam"
      body: "Protein zamanlamasının işe yaradığı yerde daha çok protein yeniyordu. Toplam eşitken fark çoğunlukla kayboldu."

  - key: eiwit-verdelen
    kind: fact
    en:
      title: "Every 3 to 4 hours"
      body: "Have 20 to 40 g of protein, the ISSN suggests. Three or four decent meals get you there."
    nl:
      title: "Om de 3 à 4 uur"
      body: "20 tot 40 gram eiwit, oppert de ISSN. Drie of vier fatsoenlijke maaltijden brengen je er."
    de:
      title: "Alle 3 bis 4 Std."
      body: "20 bis 40 g Protein, schlägt die ISSN vor. Drei oder vier ordentliche Mahlzeiten reichen dafür."
    es:
      title: "Cada 3 o 4 horas"
      body: "Entre 20 y 40 g de proteína, sugiere la ISSN. Tres o cuatro comidas decentes te llevan ahí."
    fr:
      title: "Toutes les 3 à 4 h"
      body: "20 à 40 g de protéines, suggère l'ISSN. Trois ou quatre vrais repas y suffisent."
    pt:
      title: "A cada 3 a 4 horas"
      body: "20 a 40 g de proteína, sugere a ISSN. Três ou quatro refeições decentes chegam."
    tr:
      title: "3-4 saatte bir"
      body: "ISSN 20-40 g protein öneriyor. Üç dört düzgün öğünle oraya varırsın."

  - key: anabool-venster
    kind: myth
    en:
      title: "Anabolic window"
      body: "Myth: protein must come right after training. 25 g right before or right after gave the same results over 10 weeks."
    nl:
      title: "Anabool venster"
      body: "Mythe: eiwit moet direct na de training. 25 gram vlak voor of vlak na gaf over 10 weken hetzelfde resultaat."
    de:
      title: "Anaboles Fenster"
      body: "Mythos: Protein muss direkt nach dem Training. 25 g direkt vor oder nach brachten in 10 Wochen dasselbe."
    es:
      title: "Ventana anabólica"
      body: "Mito: la proteína va justo después de entrenar. 25 g justo antes o después dieron lo mismo en 10 semanas."
    fr:
      title: "Fenêtre anabolique"
      body: "Mythe : les protéines juste après la séance. 25 g juste avant ou après ont donné pareil sur 10 semaines."
    pt:
      title: "Janela anabólica"
      body: "Mito: a proteína tem de vir logo após o treino. 25 g mesmo antes ou depois deram o mesmo em 10 semanas."
    tr:
      title: "Anabolik pencere"
      body: "Efsane: protein antrenmandan hemen sonra alınmalı. Hemen önce ya da sonra 25 g, 10 haftada aynı sonucu verdi."

  - key: zes-maaltijden
    kind: myth
    en:
      title: "6 small meals"
      body: "Myth: six small meals boost your metabolism. Eating more often doesn't seem to raise what you burn."
    nl:
      title: "6 kleine maaltijden"
      body: "Mythe: zes kleine maaltijden jagen je stofwisseling aan. Vaker eten lijkt je verbranding niet te verhogen."
    de:
      title: "6 kleine Mahlzeiten"
      body: "Mythos: Sechs kleine Mahlzeiten kurbeln den Stoffwechsel an. Öfter essen erhöht den Verbrauch offenbar nicht."
    es:
      title: "6 comidas pequeñas"
      body: "Mito: seis comidas pequeñas aceleran el metabolismo. Comer más veces no parece subir lo que quemas."
    fr:
      title: "6 petits repas"
      body: "Mythe : six petits repas boostent le métabolisme. Manger plus souvent ne semble pas augmenter la dépense."
    pt:
      title: "6 refeições pequenas"
      body: "Mito: seis refeições pequenas aceleram o metabolismo. Comer mais vezes não parece subir o gasto."
    tr:
      title: "6 küçük öğün"
      body: "Efsane: altı küçük öğün metabolizmayı hızlandırır. Sık yemek yakılan enerjiyi artırmıyor gibi."

  - key: aantal-maaltijden
    kind: fact
    en:
      title: "3 or 4 meals"
      body: "Meal count matters more for hunger than weight. Starving on three? Eat four. Full on two? Fine too."
    nl:
      title: "3 of 4 maaltijden"
      body: "Het aantal telt meer voor honger dan voor gewicht. Honger bij drie? Eet er vier. Vol van twee? Prima."
    de:
      title: "3 oder 4 Mahlzeiten"
      body: "Die Zahl zählt mehr für Hunger als fürs Gewicht. Hunger bei drei? Iss vier. Satt von zwei? Auch gut."
    es:
      title: "3 o 4 comidas"
      body: "El número importa más para el hambre que para el peso. ¿Hambre con tres? Haz cuatro. ¿Lleno con dos? Vale."
    fr:
      title: "3 ou 4 repas"
      body: "Le nombre compte plus pour la faim que pour le poids. Faim avec trois ? Fais-en quatre. Calé avec deux ? Ok."
    pt:
      title: "3 ou 4 refeições"
      body: "O número conta mais para a fome do que para o peso. Fome com três? Come quatro. Cheio com duas? Também."
    tr:
      title: "3 ya da 4 öğün"
      body: "Öğün sayısı kilodan çok açlığı etkiler. Üçle aç mısın? Dört ye. İkiyle tok musun? O da olur."

  - key: ontbijt
    kind: myth
    en:
      title: "260 kcal"
      body: "Myth: you need breakfast to lose weight. People told to eat it ate that much more a day than skippers."
    nl:
      title: "260 kcal"
      body: "Mythe: zonder ontbijt val je niet af. Mensen die moesten ontbijten aten zoveel meer per dag dan oversladers."
    de:
      title: "260 kcal"
      body: "Mythos: Ohne Frühstück nimmst du nicht ab. Wer frühstücken sollte, aß so viel mehr am Tag als die anderen."
    es:
      title: "260 kcal"
      body: "Mito: sin desayuno no adelgazas. Quienes debían desayunar comieron eso más al día que quienes no."
    fr:
      title: "260 kcal"
      body: "Mythe : sans petit-déj, pas de perte de poids. Ceux qui devaient en prendre mangeaient ça de plus par jour."
    pt:
      title: "260 kcal"
      body: "Mito: sem pequeno-almoço não emagreces. Quem tinha de o tomar comeu isso a mais por dia."
    tr:
      title: "260 kcal"
      body: "Efsane: kahvaltısız kilo verilmez. Kahvaltı yapması istenenler atlayanlardan günde bu kadar fazla yedi."

  - key: groot-ontbijt
    kind: fact
    en:
      title: "Big breakfast"
      body: "Or big dinner: same weight loss on the same calories. People were less hungry with the big breakfast."
    nl:
      title: "Groot ontbijt"
      body: "Of groot diner: zelfde gewichtsverlies bij dezelfde calorieën. Met een groot ontbijt hadden mensen minder honger."
    de:
      title: "Großes Frühstück"
      body: "Oder großes Abendessen: gleicher Gewichtsverlust bei gleichen Kalorien. Mit großem Frühstück weniger Hunger."
    es:
      title: "Gran desayuno"
      body: "O gran cena: misma pérdida con las mismas calorías. Con el desayuno grande, menos hambre."
    fr:
      title: "Gros petit-déj"
      body: "Ou gros dîner : même perte à calories égales. Avec le gros petit-déj, moins de faim."
    pt:
      title: "Grande pequeno-almoço"
      body: "Ou grande jantar: mesma perda com as mesmas calorias. Com o pequeno-almoço grande, menos fome."
    tr:
      title: "Büyük kahvaltı"
      body: "Ya da büyük akşam yemeği: aynı kaloride aynı kayıp. Büyük kahvaltıyla daha az açlık."

  - key: laat-eten
    kind: fact
    en:
      title: "Eating late"
      body: "Whether it adds fat isn't settled. It raised hunger in a lab trial. Watch if late snacks push your total up."
    nl:
      title: "Laat eten"
      body: "Of het vet oplevert, is onzeker. In een labstudie gaf het meer honger. Let op of late snacks je totaal verhogen."
    de:
      title: "Spät essen"
      body: "Ob es Fett bringt, ist offen. In einer Laborstudie machte es hungriger. Achte, ob späte Snacks die Summe erhöhen."
    es:
      title: "Comer tarde"
      body: "No está claro que engorde. En un ensayo de laboratorio dio más hambre. Mira si picar tarde sube tu total."
    fr:
      title: "Manger tard"
      body: "Pas prouvé que ça fasse grossir. En labo, ça a augmenté la faim. Vois si les snacks tardifs gonflent ton total."
    pt:
      title: "Comer tarde"
      body: "Não está provado que engorde. Num ensaio de laboratório deu mais fome. Vê se os snacks tardios sobem o total."
    tr:
      title: "Geç yemek"
      body: "Yağ yaptırdığı belli değil. Bir laboratuvar çalışmasında açlığı artırdı. Gece atıştırmaları toplamını artırıyor mu bak."

  - key: cut-vaker-eten
    kind: fact
    en:
      title: "On a cut"
      body: "Dieting athletes with enough protein may keep more lean mass eating more often. Your daily total comes first."
    nl:
      title: "Tijdens een cut"
      body: "Sporters met genoeg eiwit houden misschien meer spier als ze vaker eten. Je dagtotaal gaat voor."
    de:
      title: "In der Diät"
      body: "Sportler mit genug Protein halten womöglich mehr Muskeln, wenn sie öfter essen. Die Tagessumme zählt zuerst."
    es:
      title: "Al definir"
      body: "Con proteína suficiente, comer más veces quizá conserve más masa magra. Tu total diario va primero."
    fr:
      title: "En sèche"
      body: "Avec assez de protéines, manger plus souvent garde peut-être plus de muscle. Le total du jour d'abord."
    pt:
      title: "Em cut"
      body: "Com proteína suficiente, comer mais vezes talvez mantenha mais massa magra. O total diário vem primeiro."
    tr:
      title: "Cut'ta"
      body: "Yeterli protein alan sporcular sık yiyerek daha çok kas koruyabilir. Önce günlük toplam gelir."

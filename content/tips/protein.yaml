article: protein
emoji: "🍗"
tips:
  - key: hoeveel
    kind: fact
    en:
      title: "1.6 to 2.2 g"
      body: "Protein per kg a day to build muscle. At 80 kg that's 128 to 176 g."
    nl:
      title: "1,6 tot 2,2 gram"
      body: "Eiwit per kilo per dag om spier op te bouwen. Bij 80 kilo is dat 128 tot 176 gram."
    de:
      title: "1,6 bis 2,2 g"
      body: "Protein pro kg am Tag für Muskelaufbau. Bei 80 kg sind das 128 bis 176 g."
    es:
      title: "1,6 a 2,2 g"
      body: "De proteína por kg al día para ganar músculo. Con 80 kg son 128 a 176 g."
    fr:
      title: "1,6 à 2,2 g"
      body: "De protéines par kg et par jour pour prendre du muscle. À 80 kg, c'est 128 à 176 g."
    pt:
      title: "1,6 a 2,2 g"
      body: "De proteína por kg por dia para ganhar músculo. Com 80 kg são 128 a 176 g."
    tr:
      title: "1,6-2,2 g"
      body: "Kas yapmak için günde kilo başına protein. 80 kiloda 128-176 g."

  - key: aanbevolen-te-laag
    kind: myth
    en:
      title: "64 g"
      body: "Myth: 0.8 g per kg is enough. At 80 kg that's half of what you need if you train."
    nl:
      title: "64 gram"
      body: "Mythe: 0,8 gram per kilo is genoeg. Bij 80 kilo is dat de helft van wat je nodig hebt als je traint."
    de:
      title: "64 g"
      body: "Mythos: 0,8 g pro kg reichen. Bei 80 kg ist das die Hälfte dessen, was du brauchst, wenn du trainierst."
    es:
      title: "64 g"
      body: "Mito: con 0,8 g por kg basta. Con 80 kg es la mitad de lo que necesitas si entrenas."
    fr:
      title: "64 g"
      body: "Mythe : 0,8 g par kg suffit. À 80 kg, c'est la moitié de ce qu'il te faut si tu t'entraînes."
    pt:
      title: "64 g"
      body: "Mito: 0,8 g por kg chega. Com 80 kg é metade do que precisas se treinas."
    tr:
      title: "64 g"
      body: "Efsane: kilo başına 0,8 g yeter. 80 kiloda bu, antrenman yapıyorsan ihtiyacının yarısı."

  - key: afvlakking
    kind: fact
    en:
      title: "1.6 g"
      body: "Per kg is where muscle gains stopped rising, across 49 trials. Going toward 2.2 makes sure you're covered."
    nl:
      title: "1,6 gram"
      body: "Per kilo is waar de spierwinst ophield met stijgen, in 49 studies. Richting 2,2 gaan maakt zeker dat je goed zit."
    de:
      title: "1,6 g"
      body: "Pro kg, ab da stieg der Muskelzuwachs in 49 Studien nicht mehr. Richtung 2,2 bist du sicher abgedeckt."
    es:
      title: "1,6 g"
      body: "Por kg es donde el músculo dejó de subir, en 49 ensayos. Ir hacia 2,2 asegura que vas cubierto."
    fr:
      title: "1,6 g"
      body: "Par kg, c'est là que les gains plafonnaient, sur 49 essais. Viser 2,2 te garantit d'être couvert."
    pt:
      title: "1,6 g"
      body: "Por kg é onde os ganhos deixaram de subir, em 49 ensaios. Ir para 2,2 garante que estás coberto."
    tr:
      title: "1,6 g"
      body: "49 çalışmada kas kazancı kilo başına bu noktada artmayı bıraktı. 2,2'ye doğru gitmek seni garantiye alır."

  - key: tijdens-een-cut
    kind: fact
    en:
      title: "2.3 to 3.1 g"
      body: "Per kg may be needed to keep muscle on a diet if you're trained, says the ISSN. At 80 kg: 184 to 248 g."
    nl:
      title: "2,3 tot 3,1 gram"
      body: "Per kilo is misschien nodig om spier te houden tijdens een dieet als je getraind bent, zegt de ISSN."
    de:
      title: "2,3 bis 3,1 g"
      body: "Pro kg braucht es laut ISSN vielleicht, um in der Diät Muskeln zu halten, wenn du trainiert bist."
    es:
      title: "2,3 a 3,1 g"
      body: "Por kg pueden hacer falta para conservar músculo a dieta si estás entrenado, dice la ISSN."
    fr:
      title: "2,3 à 3,1 g"
      body: "Par kg peuvent être nécessaires pour garder le muscle au régime si tu es entraîné, dit l'ISSN."
    pt:
      title: "2,3 a 3,1 g"
      body: "Por kg podem ser precisos para manter músculo em dieta se fores treinado, diz a ISSN."
    tr:
      title: "2,3-3,1 g"
      body: "ISSN'ye göre antrenmanlıysan diyette kası korumak için kilo başına bu kadar gerekebilir. 80 kiloda 184-248 g."

  - key: per-maaltijd
    kind: fact
    en:
      title: "32 g"
      body: "Protein per meal at 80 kg, over at least four meals. That's 0.4 g per kg each time."
    nl:
      title: "32 gram"
      body: "Eiwit per maaltijd bij 80 kilo, over minstens vier maaltijden. Dat is 0,4 gram per kilo per keer."
    de:
      title: "32 g"
      body: "Protein pro Mahlzeit bei 80 kg, über mindestens vier Mahlzeiten. Das sind 0,4 g pro kg."
    es:
      title: "32 g"
      body: "De proteína por comida con 80 kg, en al menos cuatro comidas. Son 0,4 g por kg cada vez."
    fr:
      title: "32 g"
      body: "De protéines par repas à 80 kg, sur au moins quatre repas. Soit 0,4 g par kg à chaque fois."
    pt:
      title: "32 g"
      body: "De proteína por refeição com 80 kg, em pelo menos quatro refeições. São 0,4 g por kg de cada vez."
    tr:
      title: "32 g"
      body: "80 kiloda öğün başına protein, en az dört öğünde. Her seferinde kilo başına 0,4 g."

  - key: grote-maaltijd
    kind: myth
    en:
      title: "Big meal"
      body: "Myth: a big protein meal is wasted. More of it is burned for energy, but some of the extra still builds tissue."
    nl:
      title: "Grote maaltijd"
      body: "Mythe: een grote eiwitmaaltijd is verspild. Meer wordt verbrand als energie, maar een deel bouwt nog weefsel op."
    de:
      title: "Große Mahlzeit"
      body: "Mythos: Eine große Proteinmahlzeit ist verschwendet. Mehr wird verbrannt, aber ein Teil baut trotzdem Gewebe auf."
    es:
      title: "Comida grande"
      body: "Mito: una gran comida de proteína se desperdicia. Más se usa como energía, pero parte sigue construyendo tejido."
    fr:
      title: "Gros repas"
      body: "Mythe : un gros repas protéiné est gâché. Plus part en énergie, mais une partie sert encore à construire."
    pt:
      title: "Refeição grande"
      body: "Mito: uma grande refeição de proteína é desperdiçada. Mais é queimado, mas parte ainda constrói tecido."
    tr:
      title: "Büyük öğün"
      body: "Efsane: büyük proteinli öğün boşa gider. Daha çoğu enerji olarak yakılır ama bir kısmı yine doku yapar."

  - key: niet-direct-na-training
    kind: myth
    en:
      title: "After training"
      body: "Myth: protein must come right after training. With the same daily total, it gave no extra muscle."
    nl:
      title: "Na de training"
      body: "Mythe: eiwit moet direct na de training. Bij een gelijk dagtotaal gaf het geen extra spier."
    de:
      title: "Nach dem Training"
      body: "Mythos: Protein muss direkt nach dem Training rein. Bei gleicher Tagesmenge gab es keine Extra-Muskeln."
    es:
      title: "Tras entrenar"
      body: "Mito: la proteína va justo después de entrenar. Con el mismo total diario, no dio más músculo."
    fr:
      title: "Après la séance"
      body: "Mythe : les protéines juste après la séance. À total égal sur la journée, pas de muscle en plus."
    pt:
      title: "Depois do treino"
      body: "Mito: a proteína tem de vir logo após o treino. Com o mesmo total diário, não deu mais músculo."
    tr:
      title: "Antrenman sonrası"
      body: "Efsane: protein antrenmandan hemen sonra alınmalı. Günlük toplam aynıyken fazladan kas vermedi."

  - key: spreiden
    kind: fact
    en:
      title: "Every 3 to 4 hours"
      body: "Spread your protein. At 80 kg that's four meals of 30 to 40 g, not one huge dinner."
    nl:
      title: "Om de 3 à 4 uur"
      body: "Spreid je eiwit. Bij 80 kilo zijn dat vier maaltijden van 30 tot 40 gram, niet één enorm diner."
    de:
      title: "Alle 3 bis 4 Std."
      body: "Verteil dein Protein. Bei 80 kg sind das vier Mahlzeiten à 30 bis 40 g, nicht ein riesiges Abendessen."
    es:
      title: "Cada 3 o 4 horas"
      body: "Reparte la proteína. Con 80 kg son cuatro comidas de 30 a 40 g, no una cena enorme."
    fr:
      title: "Toutes les 3 à 4 h"
      body: "Répartis tes protéines. À 80 kg, quatre repas de 30 à 40 g, pas un énorme dîner."
    pt:
      title: "A cada 3 a 4 horas"
      body: "Distribui a proteína. Com 80 kg são quatro refeições de 30 a 40 g, não um jantar enorme."
    tr:
      title: "3-4 saatte bir"
      body: "Proteinini yay. 80 kiloda dört öğünde 30-40 g, tek dev akşam yemeği değil."

  - key: nieren
    kind: myth
    en:
      title: "Kidneys"
      body: "Myth: a lot of protein harms your kidneys. Up to 3.3 g per kg for a year showed no harm in healthy people."
    nl:
      title: "Nieren"
      body: "Mythe: veel eiwit is slecht voor je nieren. Tot 3,3 gram per kilo, een jaar lang, gaf bij gezonde mensen geen schade."
    de:
      title: "Nieren"
      body: "Mythos: Viel Protein schadet den Nieren. Bis 3,3 g pro kg über ein Jahr zeigten bei Gesunden keinen Schaden."
    es:
      title: "Riñones"
      body: "Mito: mucha proteína daña los riñones. Hasta 3,3 g por kg durante un año no dañó a personas sanas."
    fr:
      title: "Reins"
      body: "Mythe : beaucoup de protéines abîme les reins. Jusqu'à 3,3 g par kg pendant un an : aucun dégât chez les gens sains."
    pt:
      title: "Rins"
      body: "Mito: muita proteína faz mal aos rins. Até 3,3 g por kg durante um ano não fez mal a pessoas saudáveis."
    tr:
      title: "Böbrekler"
      body: "Efsane: çok protein böbreğe zarar verir. Sağlıklı kişilerde bir yıl boyunca kilo başına 3,3 g'a kadar zarar görülmedi."

  - key: nierziekte
    kind: fact
    en:
      title: "Kidney disease"
      body: "Eating less protein is advice for people who already have it. Kidney problems? Talk to your doctor first."
    nl:
      title: "Nierziekte"
      body: "Minder eiwit eten is advies voor wie al een nierziekte heeft. Nierproblemen? Overleg eerst met je arts."
    de:
      title: "Nierenkrankheit"
      body: "Weniger Protein ist ein Rat für Menschen, die schon eine haben. Nierenprobleme? Sprich erst mit dem Arzt."
    es:
      title: "Enfermedad renal"
      body: "Comer menos proteína es para quien ya la tiene. ¿Problemas de riñón? Habla antes con tu médico."
    fr:
      title: "Maladie rénale"
      body: "Manger moins de protéines, c'est pour ceux qui en ont déjà une. Souci rénal ? Parle d'abord à ton médecin."
    pt:
      title: "Doença renal"
      body: "Comer menos proteína é para quem já a tem. Problemas nos rins? Fala primeiro com o médico."
    tr:
      title: "Böbrek hastalığı"
      body: "Az protein önerisi zaten böbrek hastalığı olanlar için. Böbrek sorunun varsa önce doktoruna danış."

article: isolation-exercises
emoji: "🦾"
tips:
  - key: minder-techniek
    kind: fact
    en:
      title: "Less skill"
      body: "Exercises like knee extensions and curls target one muscle and ask for less skill, the ACSM notes."
    nl:
      title: "Minder techniek"
      body: "Oefeningen als leg extensions en leg curls richten zich op één spier en vragen minder techniek, zegt de ACSM."
    de:
      title: "Weniger Technik"
      body: "Übungen wie Beinstrecken und Beinbeugen zielen auf einen Muskel und brauchen weniger Technik, so das ACSM."
    es:
      title: "Menos técnica"
      body: "Ejercicios como extensiones y curls de pierna trabajan un músculo y piden menos técnica, dice el ACSM."
    fr:
      title: "Moins de technique"
      body: "Des exercices comme leg extension et leg curl ciblent un muscle et demandent moins de technique, dit l'ACSM."
    pt:
      title: "Menos técnica"
      body: "Exercícios como extensão e flexão de pernas trabalham um músculo e pedem menos técnica, diz o ACSM."
    tr:
      title: "Daha az teknik"
      body: "ACSM'ye göre bacak uzatma ve bükme gibi hareketler tek kası hedefler, daha az teknik ister."

  - key: niet-verplicht
    kind: myth
    en:
      title: "Must-do"
      body: "Myth: you must do isolation exercises. You don't. They're handy for muscles your compound lifts barely reach."
    nl:
      title: "Verplicht"
      body: "Mythe: je moet isolatie-oefeningen doen. Hoeft niet. Ze zijn handig voor spieren die je basisoefeningen amper raken."
    de:
      title: "Pflicht"
      body: "Mythos: Isolationsübungen sind Pflicht. Nein. Sie helfen bei Muskeln, die Grundübungen kaum erreichen."
    es:
      title: "Obligatorio"
      body: "Mito: tienes que hacer aislamiento. No. Sirve para músculos que los compuestos apenas tocan."
    fr:
      title: "Obligatoire"
      body: "Mythe : l'isolation est obligatoire. Non. Elle sert pour les muscles que les polyarticulaires touchent peu."
    pt:
      title: "Obrigatório"
      body: "Mito: tens de fazer isolamento. Não. Serve para músculos que os compostos mal tocam."
    tr:
      title: "Zorunlu"
      body: "Efsane: izolasyon hareketleri şart. Değil. Bileşik hareketlerin pek ulaşmadığı kaslar için işe yarar."

  - key: meer-spier
    kind: myth
    en:
      title: "More muscle"
      body: "Myth: isolation builds more muscle. In the studies that compared them, neither side clearly built more."
    nl:
      title: "Meer spier"
      body: "Mythe: isolatie bouwt meer spier. In studies die het vergeleken, won geen van beide duidelijk."
    de:
      title: "Mehr Muskeln"
      body: "Mythos: Isolation baut mehr Muskeln. In Vergleichsstudien gewann keine Seite klar."
    es:
      title: "Más músculo"
      body: "Mito: el aislamiento da más músculo. En los estudios que los compararon, ninguno ganó claramente."
    fr:
      title: "Plus de muscle"
      body: "Mythe : l'isolation fait plus de muscle. Dans les études comparatives, aucun des deux n'a nettement gagné."
    pt:
      title: "Mais músculo"
      body: "Mito: o isolamento dá mais músculo. Nos estudos que compararam, nenhum ganhou claramente."
    tr:
      title: "Daha çok kas"
      body: "Efsane: izolasyon daha çok kas yapar. Karşılaştıran çalışmalarda ikisi de net üstün değildi."

  - key: rust-isolatie
    kind: fact
    en:
      title: "60 to 90 seconds"
      body: "Of rest can be enough for single-joint and some machine exercises, an expert stand for athletes says."
    nl:
      title: "60 tot 90 seconden"
      body: "Rust kan genoeg zijn bij oefeningen over één gewricht en sommige machines, zegt een expertstandpunt."
    de:
      title: "60 bis 90 Sekunden"
      body: "Pause können bei eingelenkigen und manchen Maschinenübungen reichen, sagt eine Expertenstellungnahme."
    es:
      title: "60 a 90 segundos"
      body: "De descanso pueden bastar en ejercicios de una articulación y algunas máquinas, dicen expertos."
    fr:
      title: "60 à 90 secondes"
      body: "De repos peuvent suffire pour les exercices mono-articulaires et certaines machines, selon des experts."
    pt:
      title: "60 a 90 segundos"
      body: "De descanso podem chegar em exercícios de uma articulação e algumas máquinas, dizem especialistas."
    tr:
      title: "60-90 saniye"
      body: "Uzmanlara göre tek eklemli ve bazı makine hareketlerinde bu kadar dinlenme yetebilir."

  - key: rust-acsm
    kind: fact
    en:
      title: "1 to 2 minutes"
      body: "Of rest between sets for growth, the ACSM advised beginners and intermediates back in 2009."
    nl:
      title: "1 tot 2 minuten"
      body: "Rust tussen sets voor groei, adviseerde de ACSM in 2009 aan beginners en gevorderden."
    de:
      title: "1 bis 2 Minuten"
      body: "Pause zwischen Sätzen für Wachstum empfahl das ACSM 2009 Anfängern und Fortgeschrittenen."
    es:
      title: "1 a 2 minutos"
      body: "De descanso entre series para crecer aconsejaba el ACSM en 2009 a novatos e intermedios."
    fr:
      title: "1 à 2 minutes"
      body: "De repos entre séries pour la croissance, conseillait l'ACSM en 2009 aux débutants et intermédiaires."
    pt:
      title: "1 a 2 minutos"
      body: "De descanso entre séries para crescer, aconselhava o ACSM em 2009 a iniciantes e intermédios."
    tr:
      title: "1-2 dakika"
      body: "ACSM 2009'da büyüme için yeni ve orta seviyeye setler arası bu kadar dinlenme önerdi."

  - key: hoeken
    kind: fact
    en:
      title: "Many angles"
      body: "Mix compound and isolation work from different angles to train the whole muscle, experts advise."
    nl:
      title: "Veel hoeken"
      body: "Mix samengestelde en isolatie-oefeningen vanuit verschillende hoeken om de hele spier te raken, adviseren experts."
    de:
      title: "Viele Winkel"
      body: "Mische Grund- und Isolationsübungen aus verschiedenen Winkeln, um den ganzen Muskel zu treffen, raten Fachleute."
    es:
      title: "Muchos ángulos"
      body: "Mezcla compuestos y aislamiento desde distintos ángulos para trabajar todo el músculo, aconsejan expertos."
    fr:
      title: "Plusieurs angles"
      body: "Mélange poly et isolation sous différents angles pour travailler tout le muscle, conseillent des experts."
    pt:
      title: "Vários ângulos"
      body: "Mistura compostos e isolamento de vários ângulos para treinar o músculo todo, aconselham especialistas."
    tr:
      title: "Farklı açılar"
      body: "Uzmanlar kasın tamamını çalıştırmak için bileşik ve izolasyonu farklı açılardan karıştırmayı öneriyor."

  - key: acsm-nu
    kind: fact
    en:
      title: "2026 update"
      body: "The ACSM found too few data to prefer isolation or compound lifts for growth. In 2009 it advised both."
    nl:
      title: "Update van 2026"
      body: "De ACSM vond te weinig data om isolatie of basisoefeningen te verkiezen voor groei. In 2009 adviseerde ze beide."
    de:
      title: "Update 2026"
      body: "Das ACSM fand zu wenig Daten, um Isolation oder Grundübungen fürs Wachstum vorzuziehen. 2009 riet es zu beiden."
    es:
      title: "Revisión de 2026"
      body: "El ACSM no vio datos para preferir aislamiento o compuestos para crecer. En 2009 aconsejaba ambos."
    fr:
      title: "Mise à jour 2026"
      body: "L'ACSM n'a pas trouvé assez de données pour préférer l'un ou l'autre. En 2009, il conseillait les deux."
    pt:
      title: "Atualização 2026"
      body: "O ACSM não viu dados para preferir isolamento ou compostos para crescer. Em 2009 aconselhava ambos."
    tr:
      title: "2026 güncellemesi"
      body: "ACSM büyüme için izolasyonu ya da bileşiği seçecek kadar veri bulamadı. 2009'da ikisini önermişti."

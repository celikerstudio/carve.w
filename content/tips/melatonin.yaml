article: melatonin
emoji: "🌙"
tips:
  - key: een-mg
    kind: fact
    en:
      title: "1 mg"
      body: "Of melatonin close to bedtime helps you fall asleep faster, EFSA found. That's the condition it set."
    nl:
      title: "1 mg"
      body: "Melatonine vlak voor bedtijd laat je sneller inslapen, vond EFSA. Dat is de voorwaarde die ze stelde."
    de:
      title: "1 mg"
      body: "Melatonin kurz vor dem Schlafen lässt dich laut EFSA schneller einschlafen. Das ist ihre Bedingung."
    es:
      title: "1 mg"
      body: "De melatonina cerca de la hora de dormir acorta el tiempo hasta dormirte, según la EFSA. Esa es su condición."
    fr:
      title: "1 mg"
      body: "De mélatonine près du coucher aide à s'endormir plus vite, selon l'EFSA. C'est la condition posée."
    pt:
      title: "1 mg"
      body: "De melatonina perto da hora de deitar ajuda a adormecer mais depressa, segundo a EFSA. É a condição dela."
    tr:
      title: "1 mg"
      body: "Yatmadan hemen önce melatonin daha hızlı uyumana yardım eder, EFSA'ya göre. Koşul bu."

  - key: zeven-minuten
    kind: myth
    en:
      title: "7 minutes"
      body: "Myth: melatonin knocks you out fast. People with sleep disorders fell asleep about that much faster than on placebo."
    nl:
      title: "7 minuten"
      body: "Mythe: melatonine slaat je knock-out. Mensen met slaapproblemen sliepen zoveel sneller in dan met placebo."
    de:
      title: "7 Minuten"
      body: "Mythos: Melatonin haut dich um. Menschen mit Schlafstörungen schliefen etwa so viel schneller ein als mit Placebo."
    es:
      title: "7 minutos"
      body: "Mito: la melatonina te deja KO al momento. Con trastornos del sueño, se durmieron eso antes que con placebo."
    fr:
      title: "7 minutes"
      body: "Mythe : la mélatonine t'assomme vite. Des gens avec troubles du sommeil s'endormaient ça plus vite qu'au placebo."
    pt:
      title: "7 minutos"
      body: "Mito: a melatonina deita-te abaixo. Pessoas com problemas de sono adormeceram isso mais cedo que com placebo."
    tr:
      title: "7 dakika"
      body: "Efsane: melatonin seni hemen bayıltır. Uyku bozukluğu olanlar plaseboya göre bu kadar hızlı uyudu."

  - key: meer-is-niet-beter
    kind: myth
    en:
      title: "Above 5 mg"
      body: "Myth: more melatonin works better. For jet lag, higher doses work no better. EFSA says 0.5 to 5 mg."
    nl:
      title: "Boven 5 mg"
      body: "Mythe: meer melatonine werkt beter. Bij jetlag werken hogere doses niet beter. EFSA zegt 0,5 tot 5 mg."
    de:
      title: "Über 5 mg"
      body: "Mythos: Mehr Melatonin wirkt besser. Bei Jetlag wirken höhere Dosen nicht besser. EFSA: 0,5 bis 5 mg."
    es:
      title: "Más de 5 mg"
      body: "Mito: más melatonina funciona mejor. Para el jet lag, dosis mayores no van mejor. La EFSA dice 0,5 a 5 mg."
    fr:
      title: "Plus de 5 mg"
      body: "Mythe : plus de mélatonine, plus d'effet. Contre le jet lag, pas mieux au-delà. L'EFSA dit 0,5 à 5 mg."
    pt:
      title: "Mais de 5 mg"
      body: "Mito: mais melatonina funciona melhor. Para o jet lag, doses maiores não são melhores. A EFSA diz 0,5 a 5 mg."
    tr:
      title: "5 mg'dan fazla"
      body: "Efsane: daha çok melatonin daha iyi. Jet lag'de yüksek doz daha iyi değil. EFSA 0,5-5 mg diyor."

  - key: jetlag
    kind: fact
    en:
      title: "Jet lag"
      body: "Melatonin at 0.5 to 5 mg near bedtime on travel day and the first days after reduces it, EFSA found."
    nl:
      title: "Jetlag"
      body: "Melatonine van 0,5 tot 5 mg rond bedtijd op je reisdag en de eerste dagen erna vermindert het, vond EFSA."
    de:
      title: "Jetlag"
      body: "Melatonin mit 0,5 bis 5 mg vor dem Schlafen am Reisetag und den ersten Tagen danach mildert ihn, so die EFSA."
    es:
      title: "Jet lag"
      body: "La melatonina de 0,5 a 5 mg al acostarte el día del viaje y los primeros días lo reduce, según la EFSA."
    fr:
      title: "Jet lag"
      body: "La mélatonine à 0,5 à 5 mg au coucher le jour du voyage et les premiers jours le réduit, selon l'EFSA."
    pt:
      title: "Jet lag"
      body: "Melatonina de 0,5 a 5 mg ao deitar no dia da viagem e nos primeiros dias reduz o jet lag, diz a EFSA."
    tr:
      title: "Jet lag"
      body: "EFSA'ya göre yolculuk günü ve sonraki ilk günlerde yatarken 0,5-5 mg melatonin jet lag'i azaltır."

  - key: vijf-tijdzones
    kind: fact
    en:
      title: "5 time zones"
      body: "Or more? Melatonin at bedtime at your destination reduced jet lag in 9 of 10 trials."
    nl:
      title: "5 tijdzones"
      body: "Of meer? Melatonine bij bedtijd op je bestemming verminderde jetlag in 9 van de 10 studies."
    de:
      title: "5 Zeitzonen"
      body: "Oder mehr? Melatonin zur Schlafenszeit am Zielort milderte den Jetlag in 9 von 10 Studien."
    es:
      title: "5 husos horarios"
      body: "¿O más? La melatonina al acostarte en el destino redujo el jet lag en 9 de 10 ensayos."
    fr:
      title: "5 fuseaux horaires"
      body: "Ou plus ? La mélatonine au coucher sur place a réduit le jet lag dans 9 essais sur 10."
    pt:
      title: "5 fusos horários"
      body: "Ou mais? Melatonina ao deitar no destino reduziu o jet lag em 9 de 10 ensaios."
    tr:
      title: "5 saat dilimi"
      body: "Ya da daha fazla mı? Varış yerinde yatarken melatonin 10 çalışmanın 9'unda jet lag'i azalttı."

  - key: verkeerd-moment
    kind: fact
    en:
      title: "Morning dose"
      body: "Taken early in the day, melatonin can make you sleepy and slow how fast you adjust to local time."
    nl:
      title: "'s Ochtends"
      body: "Vroeg op de dag genomen kan melatonine je slaperig maken en je aanpassing aan de lokale tijd vertragen."
    de:
      title: "Am Morgen"
      body: "Früh am Tag genommen kann Melatonin müde machen und die Anpassung an die Ortszeit bremsen."
    es:
      title: "Por la mañana"
      body: "Tomada temprano, la melatonina puede darte sueño y frenar tu ajuste a la hora local."
    fr:
      title: "Le matin"
      body: "Prise tôt dans la journée, la mélatonine peut endormir et ralentir ton adaptation à l'heure locale."
    pt:
      title: "De manhã"
      body: "Tomada cedo, a melatonina pode dar sono e atrasar a adaptação à hora local."
    tr:
      title: "Sabah dozu"
      body: "Günün erken saatinde alınan melatonin uyku yapabilir ve yerel saate uyumu yavaşlatabilir."

  - key: geen-oplossing-voor-routine
    kind: myth
    en:
      title: "Bad sleep"
      body: "Myth: melatonin fixes bad sleep. Not if your routine is the cause. Late caffeine and screens still cost you sleep."
    nl:
      title: "Slecht slapen"
      body: "Mythe: melatonine lost slecht slapen op. Niet als je routine de oorzaak is. Late koffie en schermen kosten je nog slaap."
    de:
      title: "Schlecht schlafen"
      body: "Mythos: Melatonin repariert schlechten Schlaf. Nicht, wenn die Routine schuld ist. Später Kaffee stört weiter."
    es:
      title: "Dormir mal"
      body: "Mito: la melatonina arregla el mal sueño. No si la causa es tu rutina. Cafeína tarde y pantallas te siguen quitando."
    fr:
      title: "Mal dormir"
      body: "Mythe : la mélatonine règle le mauvais sommeil. Pas si ta routine est en cause. Café tardif et écrans coûtent toujours."
    pt:
      title: "Dormir mal"
      body: "Mito: a melatonina resolve o mau sono. Não se a culpa é da rotina. Cafeína tardia e ecrãs continuam a tirar sono."
    tr:
      title: "Kötü uyku"
      body: "Efsane: melatonin kötü uykuyu çözer. Sebep rutininse çözmez. Geç kafein ve ekranlar yine uykunu çalar."

  - key: epilepsie-warfarine
    kind: fact
    en:
      title: "Warfarin"
      body: "On it, or epileptic? Case reports suggest melatonin may harm you. Ask a doctor first, also if pregnant."
    nl:
      title: "Warfarine"
      body: "Slik je dat, of heb je epilepsie? Casussen wijzen op mogelijke schade. Vraag eerst een arts, ook als je zwanger bent."
    de:
      title: "Warfarin"
      body: "Nimmst du es oder hast Epilepsie? Fallberichte deuten auf mögliche Schäden. Frag erst einen Arzt, auch schwanger."
    es:
      title: "Warfarina"
      body: "¿La tomas o tienes epilepsia? Hay casos que apuntan a posibles daños. Pregunta al médico, también si estás embarazada."
    fr:
      title: "Warfarine"
      body: "Tu en prends ou tu es épileptique ? Des cas suggèrent un risque. Demande d'abord un médecin, aussi enceinte."
    pt:
      title: "Varfarina"
      body: "Tomas ou tens epilepsia? Há casos que apontam para danos. Pergunta primeiro ao médico, também se grávida."
    tr:
      title: "Varfarin"
      body: "Kullanıyor musun ya da epilepsin mi var? Vakalar zarar olabileceğini gösteriyor. Hamileysen de önce doktora sor."

  - key: elke-nacht
    kind: fact
    en:
      title: "Every night"
      body: "Occasional short-term use seems safe. For weeks or months every night, ask a doctor."
    nl:
      title: "Elke nacht"
      body: "Af en toe kort gebruiken lijkt veilig. Voor weken of maanden elke nacht vraag je een arts."
    de:
      title: "Jede Nacht"
      body: "Gelegentlich und kurz scheint sicher. Für Wochen oder Monate jede Nacht frag einen Arzt."
    es:
      title: "Cada noche"
      body: "El uso ocasional y breve parece seguro. Para semanas o meses cada noche, consulta a un médico."
    fr:
      title: "Chaque nuit"
      body: "Un usage ponctuel et court semble sûr. Pour des semaines ou des mois chaque nuit, demande à un médecin."
    pt:
      title: "Todas as noites"
      body: "Uso ocasional e curto parece seguro. Para semanas ou meses todas as noites, pergunta a um médico."
    tr:
      title: "Her gece"
      body: "Arada sırada kısa süre kullanmak güvenli görünüyor. Haftalar ya da aylarca her gece için doktora sor."

  - key: autorijden
    kind: fact
    en:
      title: "Driving"
      body: "Don't drive or use machinery until you know how melatonin affects you."
    nl:
      title: "Autorijden"
      body: "Rijd niet en bedien geen machines tot je weet hoe melatonine bij jou uitpakt."
    de:
      title: "Autofahren"
      body: "Fahr nicht und bedien keine Maschinen, bis du weißt, wie Melatonin bei dir wirkt."
    es:
      title: "Conducir"
      body: "No conduzcas ni uses máquinas hasta saber cómo te afecta la melatonina."
    fr:
      title: "Conduire"
      body: "Ne conduis pas et n'utilise pas de machine avant de savoir comment la mélatonine t'affecte."
    pt:
      title: "Conduzir"
      body: "Não conduzas nem uses máquinas até saberes como a melatonina te afeta."
    tr:
      title: "Araç kullanmak"
      body: "Melatoninin seni nasıl etkilediğini bilene kadar araç ya da makine kullanma."

article: volume
emoji: "📚"
tips:
  - key: wat-telt
    kind: fact
    en:
      title: "Hard sets"
      body: "Count them per muscle per week. Ten sets of squats, leg press and lunges in a week is ten sets for your quads."
    nl:
      title: "Zware sets"
      body: "Tel ze per spier per week. Tien sets squats, leg press en lunges in een week is tien sets voor je quads."
    de:
      title: "Harte Sätze"
      body: "Zähl sie pro Muskel und Woche. Zehn Sätze Kniebeugen, Beinpresse und Ausfallschritte sind zehn für die Quads."
    es:
      title: "Series duras"
      body: "Cuéntalas por músculo y semana. Diez series de sentadilla, prensa y zancadas son diez para el cuádriceps."
    fr:
      title: "Séries dures"
      body: "Compte-les par muscle et par semaine. Dix séries de squat, presse et fentes, c'est dix pour les quadris."
    pt:
      title: "Séries duras"
      body: "Conta-as por músculo por semana. Dez séries de agachamento, prensa e lunges são dez para os quadríceps."
    tr:
      title: "Zor setler"
      body: "Kas başına haftalık say. Bir haftada squat, leg press ve lunge'dan on set, ön bacak için on set eder."

  - key: twee-sets-per-oefening
    kind: fact
    en:
      title: "2 sets"
      body: "Per exercise at least. In the ACSM's analysis, strength gains levelled off beyond about 2 to 3 sets."
    nl:
      title: "2 sets"
      body: "Per oefening minimaal. In de analyse van de ACSM vlakte krachtwinst af boven zo'n 2 tot 3 sets."
    de:
      title: "2 Sätze"
      body: "Pro Übung mindestens. In der ACSM-Analyse flachte der Kraftzuwachs über etwa 2 bis 3 Sätze ab."
    es:
      title: "2 series"
      body: "Por ejercicio como mínimo. En el análisis del ACSM, la fuerza se estancaba más allá de 2 o 3 series."
    fr:
      title: "2 séries"
      body: "Par exercice au minimum. Dans l'analyse de l'ACSM, les gains de force plafonnaient après 2 à 3 séries."
    pt:
      title: "2 séries"
      body: "Por exercício no mínimo. Na análise do ACSM, os ganhos de força estabilizavam acima de 2 a 3 séries."
    tr:
      title: "2 set"
      body: "Hareket başına en az. ACSM analizinde güç kazancı yaklaşık 2-3 setten sonra düzleşti."

  - key: tien-sets-per-week
    kind: fact
    en:
      title: "10 sets"
      body: "Or more per muscle group a week gave more growth, in the reviews the ACSM analysed."
    nl:
      title: "10 sets"
      body: "Of meer per spiergroep per week gaf meer groei, in de reviews die de ACSM bekeek."
    de:
      title: "10 Sätze"
      body: "Oder mehr pro Muskelgruppe und Woche brachten mehr Wachstum, in den vom ACSM geprüften Übersichten."
    es:
      title: "10 series"
      body: "O más por grupo muscular a la semana dieron más crecimiento, en las revisiones del ACSM."
    fr:
      title: "10 séries"
      body: "Ou plus par groupe musculaire et par semaine ont donné plus de croissance, selon les revues de l'ACSM."
    pt:
      title: "10 séries"
      body: "Ou mais por grupo muscular por semana deram mais crescimento, nas revisões que o ACSM analisou."
    tr:
      title: "10 set"
      body: "ACSM'nin incelediği derlemelerde kas grubu başına haftada bu kadar ya da fazlası daha çok büyüme verdi."

  - key: twintig-sets-geen-doel
    kind: myth
    en:
      title: "18 to 20 sets"
      body: "Myth: that's the weekly target. It's where each extra set started adding less in one analysis. Not a goal."
    nl:
      title: "18 tot 20 sets"
      body: "Mythe: dat is het weekdoel. Daar begon elke extra set in één analyse minder op te leveren. Geen doel."
    de:
      title: "18 bis 20 Sätze"
      body: "Mythos: Das ist das Wochenziel. Da brachte in einer Analyse jeder weitere Satz weniger. Kein Ziel."
    es:
      title: "18 a 20 series"
      body: "Mito: es la meta semanal. Ahí cada serie extra empezaba a aportar menos en un análisis. No es un objetivo."
    fr:
      title: "18 à 20 séries"
      body: "Mythe : c'est l'objectif de la semaine. C'est là que chaque série en plus rapportait moins. Pas un but."
    pt:
      title: "18 a 20 séries"
      body: "Mito: é o alvo semanal. Foi onde cada série extra começou a dar menos numa análise. Não é meta."
    tr:
      title: "18-20 set"
      body: "Efsane: haftalık hedef budur. Bir analizde her ek set burada daha az katkı sağlamaya başladı. Hedef değil."

  - key: halve-set
    kind: fact
    en:
      title: "Half a set"
      body: "An indirect set, like bench press for your triceps, counted as half a set in one large analysis."
    nl:
      title: "Halve set"
      body: "Een indirecte set, zoals bankdrukken voor je triceps, telde als halve set in één grote analyse."
    de:
      title: "Halber Satz"
      body: "Ein indirekter Satz wie Bankdrücken für den Trizeps zählte in einer großen Analyse halb."
    es:
      title: "Media serie"
      body: "Una serie indirecta, como el press banca para el tríceps, contó como media en un gran análisis."
    fr:
      title: "Demi-série"
      body: "Une série indirecte, comme le développé couché pour les triceps, comptait pour moitié dans une grande analyse."
    pt:
      title: "Meia série"
      body: "Uma série indireta, como o supino para o tríceps, contou como meia numa grande análise."
    tr:
      title: "Yarım set"
      body: "Büyük bir analizde arka kol için bench press gibi dolaylı bir set yarım sayıldı."

  - key: beginner-twee-sets
    kind: myth
    en:
      title: "One set"
      body: "Myth: beginners should start with one set. The 2026 ACSM advice of two sets per exercise applies to them too."
    nl:
      title: "Eén set"
      body: "Mythe: beginners starten met één set. Het ACSM-advies van 2026, minstens twee sets per oefening, geldt ook voor hen."
    de:
      title: "Ein Satz"
      body: "Mythos: Anfänger starten mit einem Satz. Der ACSM-Rat von 2026, zwei Sätze pro Übung, gilt auch für sie."
    es:
      title: "Una serie"
      body: "Mito: los novatos empiezan con una serie. El consejo del ACSM de 2026, dos por ejercicio, vale también para ellos."
    fr:
      title: "Une série"
      body: "Mythe : un débutant commence avec une série. Le conseil ACSM 2026, deux par exercice, vaut aussi pour lui."
    pt:
      title: "Uma série"
      body: "Mito: iniciantes começam com uma série. O conselho do ACSM de 2026, duas por exercício, vale também para eles."
    tr:
      title: "Tek set"
      body: "Efsane: yeni başlayan tek setle başlar. ACSM'nin 2026'daki hareket başına en az iki set önerisi onlar için de geçerli."

  - key: sets-opbouwen
    kind: fact
    en:
      title: "20%"
      body: "More sets per four weeks at most, an expert consensus for athletes suggests. From 10 sets, that's 2 more a month."
    nl:
      title: "20%"
      body: "Meer sets per vier weken als maximum, oppert een expertconsensus. Vanaf 10 sets zijn dat er 2 meer per maand."
    de:
      title: "20 %"
      body: "Mehr Sätze pro vier Wochen höchstens, schlägt ein Expertenkonsens vor. Von 10 Sätzen aus sind das 2 mehr im Monat."
    es:
      title: "20 %"
      body: "Más series cada cuatro semanas como mucho, sugiere un consenso de expertos. Desde 10, son 2 más al mes."
    fr:
      title: "20 %"
      body: "De séries en plus par quatre semaines au maximum, suggère un consensus d'experts. Depuis 10, ça fait 2 de plus."
    pt:
      title: "20%"
      body: "Mais séries a cada quatro semanas no máximo, sugere um consenso de especialistas. A partir de 10, são 2 mais."
    tr:
      title: "%20"
      body: "Uzman görüş birliğine göre dört haftada en fazla bu kadar set artışı. 10 setten başlayınca ayda 2 set."

  - key: kracht-vlakt-af
    kind: myth
    en:
      title: "Extra sets"
      body: "Myth: more sets keep adding strength. The gain per extra set flattened much faster for strength than size."
    nl:
      title: "Extra sets"
      body: "Mythe: meer sets blijven kracht opleveren. De winst per set vlakte voor kracht veel sneller af dan voor spier."
    de:
      title: "Extra Sätze"
      body: "Mythos: Mehr Sätze bringen immer mehr Kraft. Der Gewinn pro Satz flachte bei Kraft viel schneller ab."
    es:
      title: "Series extra"
      body: "Mito: más series siguen sumando fuerza. La ganancia por serie se aplanó mucho antes en fuerza que en tamaño."
    fr:
      title: "Séries en plus"
      body: "Mythe : plus de séries, toujours plus de force. Le gain par série plafonnait bien plus vite pour la force."
    pt:
      title: "Séries extra"
      body: "Mito: mais séries continuam a dar força. O ganho por série estabilizou muito mais cedo na força."
    tr:
      title: "Ek setler"
      body: "Efsane: set ekledikçe güç artmaya devam eder. Set başına kazanç güçte kas hacminden çok daha hızlı düzleşti."

  - key: geen-duidelijk-plafond
    kind: fact
    en:
      title: "25 sets"
      body: "Few studies went past that a week, so it's unclear whether muscle growth has a ceiling. One analysis found none."
    nl:
      title: "25 sets"
      body: "Weinig studies gingen verder dan dat per week. Of spiergroei een plafond heeft is dus onzeker. Eén analyse zag er geen."
    de:
      title: "25 Sätze"
      body: "Wenige Studien gingen pro Woche darüber, also ist ein Wachstumsplafond unklar. Eine Analyse fand keinen."
    es:
      title: "25 series"
      body: "Pocos estudios pasaron de ahí por semana, así que no está claro si hay techo. Un análisis no lo encontró."
    fr:
      title: "25 séries"
      body: "Peu d'études sont allées au-delà par semaine, donc un plafond reste incertain. Une analyse n'en a pas vu."
    pt:
      title: "25 séries"
      body: "Poucos estudos passaram disso por semana, por isso não se sabe se há teto. Uma análise não o viu."
    tr:
      title: "25 set"
      body: "Haftada bundan fazlasına bakan çalışma az, büyümenin tavanı belirsiz. Bir analiz tavan bulmadı."

  - key: groepsgemiddelden
    kind: fact
    en:
      title: "Group averages"
      body: "All these set numbers come from groups of people. Use them as a start and adjust to how you recover."
    nl:
      title: "Groepsgemiddelden"
      body: "Al deze aantallen sets komen van groepen mensen. Gebruik ze als start en pas aan op je herstel."
    de:
      title: "Gruppenmittel"
      body: "All diese Satzzahlen stammen aus Gruppen. Nimm sie als Start und pass sie an deine Erholung an."
    es:
      title: "Medias de grupo"
      body: "Todas estas cifras de series vienen de grupos. Úsalas para empezar y ajusta según cómo recuperes."
    fr:
      title: "Moyennes de groupe"
      body: "Tous ces nombres de séries viennent de groupes. Pars de là et ajuste selon ta récup."
    pt:
      title: "Médias de grupo"
      body: "Todos estes números de séries vêm de grupos. Usa-os para começar e ajusta à tua recuperação."
    tr:
      title: "Grup ortalamaları"
      body: "Bu set sayılarının hepsi gruplardan geliyor. Başlangıç olarak kullan, toparlanmana göre ayarla."

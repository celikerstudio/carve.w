- id: spiergroei-volume
  laag: spier-opbouwen
  doel: "Weet dat meer sets per oefening (hoger volume) aanbevolen worden om spiergroei te maximaliseren."
  bron: acsm-resistance-training-2009
  passage: "Higher volume, multiple-set programs are recommended for maximizing hypertrophy."
  artikel: volume


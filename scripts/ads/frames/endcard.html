<!doctype html><meta charset="utf-8">
<style>
  :root{ --ink:#fafafa; --ink-secondary:#a3a3a3; --surface:#141415; --accent:#3B82F6;
    --title-base:__TITLE_SIZE__px; --title-scale:1;
    --sub-base:__SUB_SIZE__px; --sub-scale:1;
    --cta-base:__CTA_SIZE__px; --cta-scale:1;
    --font:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif; }
  *{margin:0;box-sizing:border-box}
  html,body{width:__W__px;height:__H__px;background:var(--surface);font-family:var(--font);color:var(--ink)}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:__GAP__px;padding:0 __PADX__px;text-align:center}
  img{width:__LOGOW__px;height:auto;border-radius:__RADIUS__px}
  img[src=""]{display:none}
  h1{font-size:calc(var(--title-base) * var(--title-scale));font-weight:700;letter-spacing:-.04em;line-height:1}
  p{font-size:calc(var(--sub-base) * var(--sub-scale));color:var(--ink-secondary);font-weight:450;line-height:1.3}
  .cta{margin-top:__GAP__px;background:var(--accent);color:#fff;font-size:calc(var(--cta-base) * var(--cta-scale));
    font-weight:600;padding:__CTA_PADY__px __CTA_PADX__px;border-radius:999px}
  .cta:empty{display:none}
</style>
<style>__STYLE__</style>
<div class="wrap">
  <img src="__LOGO__">
  <h1>__TEXT__</h1>
  <p>__SUB__</p>
  <div class="cta">__CTA__</div>
</div>

article: work-and-fitness-balance
emoji: "💼"
tips:
  - key: vaste-tijden
    kind: fact
    en:
      title: "Like a meeting"
      body: "Book training like one: fixed days and times, like lunch or straight after work, with a reminder."
    nl:
      title: "Als een afspraak"
      body: "Plan training zoals een vergadering: vaste dagen en tijden, zoals lunch of direct na werk, met een herinnering."
    de:
      title: "Wie ein Termin"
      body: "Plan Training wie ein Meeting: feste Tage und Zeiten, etwa mittags oder nach der Arbeit, mit Erinnerung."
    es:
      title: "Como una reunión"
      body: "Agenda el entreno como una: días y horas fijos, a mediodía o al salir del trabajo, con aviso."
    fr:
      title: "Comme une réunion"
      body: "Cale l'entraînement comme une réunion : jours et heures fixes, midi ou après le travail, avec rappel."
    pt:
      title: "Como uma reunião"
      body: "Marca o treino como uma: dias e horas fixos, ao almoço ou logo após o trabalho, com lembrete."
    tr:
      title: "Toplantı gibi"
      body: "Antrenmanı toplantı gibi ayarla: sabit gün ve saat, öğle ya da işten hemen sonra, hatırlatıcıyla."

  - key: kort-is-genoeg
    kind: myth
    en:
      title: "Long sessions"
      body: "Myth: progress needs long sessions. When time is tight, short focused sessions keep your overload going."
    nl:
      title: "Lange trainingen"
      body: "Mythe: vooruitgang vraagt lange trainingen. Bij weinig tijd houden korte, gerichte sessies je progressie gaande."
    de:
      title: "Lange Einheiten"
      body: "Mythos: Fortschritt braucht lange Einheiten. Bei wenig Zeit halten kurze, gezielte Einheiten die Steigerung am Laufen."
    es:
      title: "Sesiones largas"
      body: "Mito: para progresar hacen falta sesiones largas. Con poco tiempo, sesiones cortas y centradas bastan."
    fr:
      title: "Longues séances"
      body: "Mythe : progresser exige de longues séances. Avec peu de temps, des séances courtes et ciblées suffisent."
    pt:
      title: "Treinos longos"
      body: "Mito: progredir exige treinos longos. Com pouco tempo, treinos curtos e focados mantêm a progressão."
    tr:
      title: "Uzun antrenman"
      body: "Efsane: ilerleme uzun antrenman ister. Zaman azken kısa ve odaklı seanslar ilerlemeyi sürdürür."

  - key: drukke-week
    kind: fact
    en:
      title: "Busy week"
      body: "Don't skip training entirely. Scale down to two compound lifts plus a few accessories."
    nl:
      title: "Drukke week"
      body: "Sla training niet helemaal over. Schaal af naar twee basisoefeningen en een paar accessoires."
    de:
      title: "Volle Woche"
      body: "Lass das Training nicht ganz ausfallen. Reduzier auf zwei Grundübungen und ein paar Zusatzübungen."
    es:
      title: "Semana llena"
      body: "No dejes el entreno del todo. Baja a dos ejercicios compuestos y algunos accesorios."
    fr:
      title: "Semaine chargée"
      body: "Ne saute pas tout. Réduis à deux exercices de base et quelques accessoires."
    pt:
      title: "Semana cheia"
      body: "Não saltes o treino todo. Reduz a dois exercícios compostos e alguns acessórios."
    tr:
      title: "Yoğun hafta"
      body: "Antrenmanı tamamen atlama. İki bileşik hareket ve birkaç yardımcıya indir."

  - key: vaste-maaltijden
    kind: fact
    en:
      title: "2 or 3 meals"
      body: "Prep two or three go-to meals that cover your protein and calories. Fussy meals push you to takeout."
    nl:
      title: "2 of 3 maaltijden"
      body: "Bereid twee of drie vaste maaltijden voor die je eiwit en calorieën dekken. Ingewikkeld koken leidt naar afhaal."
    de:
      title: "2 oder 3 Gerichte"
      body: "Bereite zwei oder drei Standardgerichte vor, die Protein und Kalorien decken. Komplizierte treiben zum Lieferdienst."
    es:
      title: "2 o 3 comidas"
      body: "Prepara dos o tres comidas de siempre que cubran proteína y calorías. Las complicadas acaban en comida rápida."
    fr:
      title: "2 ou 3 repas"
      body: "Prépare deux ou trois repas types qui couvrent protéines et calories. Les plats compliqués mènent au fast-food."
    pt:
      title: "2 ou 3 refeições"
      body: "Prepara duas ou três refeições fixas que cubram proteína e calorias. As complicadas levam ao take-away."
    tr:
      title: "2-3 öğün"
      body: "Protein ve kalorini karşılayan iki üç hazır öğün hazırla. Karmaşık yemekler seni paket servise iter."

  - key: tas-ingepakt
    kind: fact
    en:
      title: "Packed bag"
      body: "Keep your gym bag ready by the door. Less to sort out means less friction on a busy day."
    nl:
      title: "Tas ingepakt"
      body: "Houd je sporttas klaar bij de deur. Minder te regelen betekent minder gedoe op een drukke dag."
    de:
      title: "Gepackte Tasche"
      body: "Halt die Sporttasche an der Tür bereit. Weniger zu organisieren heißt weniger Hürden an vollen Tagen."
    es:
      title: "Bolsa lista"
      body: "Ten la bolsa del gym lista junto a la puerta. Menos que organizar, menos fricción en un día lleno."
    fr:
      title: "Sac prêt"
      body: "Garde ton sac de sport prêt près de la porte. Moins à organiser, moins de friction un jour chargé."
    pt:
      title: "Saco pronto"
      body: "Deixa o saco do ginásio pronto à porta. Menos para tratar é menos atrito num dia cheio."
    tr:
      title: "Hazır çanta"
      body: "Spor çantanı kapının yanında hazır tut. Daha az uğraş, yoğun günde daha az engel demek."

  - key: slaap-beschermen
    kind: fact
    en:
      title: "7 to 9 hours"
      body: "Of sleep with a steady wake time. Letting sleep slide drags down the quality of your training."
    nl:
      title: "7 tot 9 uur"
      body: "Slaap met een vaste wektijd. Slaap laten versloffen drukt de kwaliteit van je training."
    de:
      title: "7 bis 9 Stunden"
      body: "Schlaf mit fester Aufstehzeit. Wer beim Schlaf schludert, trainiert schlechter."
    es:
      title: "7 a 9 horas"
      body: "De sueño con hora fija de despertar. Descuidar el sueño baja la calidad de tu entreno."
    fr:
      title: "7 à 9 heures"
      body: "De sommeil avec un réveil fixe. Laisser filer le sommeil fait baisser la qualité de l'entraînement."
    pt:
      title: "7 a 9 horas"
      body: "De sono com hora fixa de acordar. Descuidar o sono baixa a qualidade do treino."
    tr:
      title: "7-9 saat"
      body: "Sabit uyanma saatiyle uyku. Uykuyu ihmal etmek antrenman kaliteni düşürür."

article: supersets
emoji: "🔗"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Back to back"
      body: "Two exercises with minimal rest, for opposing muscles or the same one. Supersets can save you time."
    nl:
      title: "Direct achter elkaar"
      body: "Twee oefeningen met amper rust, voor tegenoverliggende spieren of dezelfde. Supersets schelen tijd."
    de:
      title: "Direkt hintereinander"
      body: "Zwei Übungen mit kaum Pause, für Gegenspieler oder denselben Muskel. Supersätze sparen Zeit."
    es:
      title: "Seguidos"
      body: "Dos ejercicios sin apenas descanso, para músculos opuestos o el mismo. Las superseries ahorran tiempo."
    fr:
      title: "Enchaînés"
      body: "Deux exercices presque sans pause, muscles opposés ou même muscle. Les supersets font gagner du temps."
    pt:
      title: "Seguidos"
      body: "Dois exercícios quase sem descanso, para músculos opostos ou o mesmo. As superséries poupam tempo."
    tr:
      title: "Arka arkaya"
      body: "Karşıt kaslar ya da aynı kas için neredeyse dinlenmeden iki hareket. Süperset zaman kazandırır."

  - key: tegenoverliggend
    kind: fact
    en:
      title: "Row and press"
      body: "Pair opposing muscles like that, or curls with triceps. One recovers while the other works."
    nl:
      title: "Roeien en drukken"
      body: "Combineer tegenoverliggende spieren zo, of curls met triceps. De een herstelt terwijl de ander werkt."
    de:
      title: "Rudern und Drücken"
      body: "Kombinier Gegenspieler so, oder Curls mit Trizeps. Einer erholt sich, während der andere arbeitet."
    es:
      title: "Remo y press"
      body: "Junta músculos opuestos así, o curls con tríceps. Uno descansa mientras el otro trabaja."
    fr:
      title: "Rowing et développé"
      body: "Associe ainsi des muscles opposés, ou curls et triceps. L'un récupère pendant que l'autre bosse."
    pt:
      title: "Remada e press"
      body: "Junta músculos opostos assim, ou roscas com tríceps. Um recupera enquanto o outro trabalha."
    tr:
      title: "Row ve press"
      body: "Karşıt kasları böyle eşle ya da curl'ü arka kolla. Biri çalışırken diğeri toparlanır."

  - key: niet-op-zware-oefeningen
    kind: myth
    en:
      title: "Heavy lifts"
      body: "Myth: supersets work for every lift. On heavy compounds they hurt performance and technique. Keep them for accessories."
    nl:
      title: "Zware oefeningen"
      body: "Mythe: supersets werken bij elke oefening. Bij zware basisoefeningen kost het prestatie en techniek."
    de:
      title: "Schwere Übungen"
      body: "Mythos: Supersätze passen zu jeder Übung. Bei schweren Grundübungen leiden Leistung und Technik."
    es:
      title: "Ejercicios pesados"
      body: "Mito: las superseries valen para todo. En compuestos pesados empeoran rendimiento y técnica."
    fr:
      title: "Gros mouvements"
      body: "Mythe : les supersets marchent sur tout. Sur les gros polyarticulaires, perf et technique en pâtissent."
    pt:
      title: "Exercícios pesados"
      body: "Mito: superséries servem para tudo. Nos compostos pesados pioram rendimento e técnica."
    tr:
      title: "Ağır hareketler"
      body: "Efsane: süperset her harekete uyar. Ağır bileşik hareketlerde performans ve teknik bozulur."

  - key: rust-na-paar
    kind: fact
    en:
      title: "60 to 120 seconds"
      body: "Rest that long after each pair, then start the next round."
    nl:
      title: "60 tot 120 seconden"
      body: "Zo lang rust je na elk paar, dan begin je aan de volgende ronde."
    de:
      title: "60 bis 120 Sekunden"
      body: "So lange Pause nach jedem Paar, dann die nächste Runde."
    es:
      title: "60 a 120 segundos"
      body: "Descansa eso tras cada pareja y empieza la siguiente ronda."
    fr:
      title: "60 à 120 secondes"
      body: "De repos après chaque paire, puis attaque le tour suivant."
    pt:
      title: "60 a 120 segundos"
      body: "Descansa isso depois de cada par e começa a ronda seguinte."
    tr:
      title: "60-120 saniye"
      body: "Her çiftten sonra bu kadar dinlen, sonra sonraki tura başla."

  - key: zelfde-spier
    kind: fact
    en:
      title: "1 to 2 reps"
      body: "From failure is where to stay on same-muscle supersets. They tire the muscle more, so go a bit lighter."
    nl:
      title: "1 à 2 herhalingen"
      body: "Voor falen blijf je bij supersets op dezelfde spier. Die vermoeien meer, dus ga iets lichter."
    de:
      title: "1 bis 2 Wdh."
      body: "Vor dem Versagen bleibst du bei Supersätzen für denselben Muskel. Sie ermüden mehr, also etwas leichter."
    es:
      title: "1 o 2 repeticiones"
      body: "Del fallo, ahí quédate en superseries del mismo músculo. Cansan más, así que baja algo el peso."
    fr:
      title: "1 à 2 reps"
      body: "De l'échec, c'est là où rester en superset sur un même muscle. Ça fatigue plus, va un peu plus léger."
    pt:
      title: "1 a 2 repetições"
      body: "Da falha é onde ficar nas superséries do mesmo músculo. Cansam mais, por isso vai um pouco mais leve."
    tr:
      title: "1-2 tekrar"
      body: "Aynı kas süpersetlerinde tükenişten bu kadar uzak dur. Daha çok yorar, biraz hafif çalış."

  - key: inspanning-volgen
    kind: fact
    en:
      title: "Short rest"
      body: "Can push your sets closer to failure than you notice. Track how hard each exercise feels."
    nl:
      title: "Korte rust"
      body: "Kan je sets dichter bij falen brengen dan je merkt. Houd bij hoe zwaar elke oefening voelt."
    de:
      title: "Kurze Pause"
      body: "Kann deine Sätze näher ans Versagen bringen, als du merkst. Notier, wie hart sich jede Übung anfühlt."
    es:
      title: "Descanso corto"
      body: "Puede acercar tus series al fallo más de lo que notas. Apunta lo duro que se siente cada ejercicio."
    fr:
      title: "Repos court"
      body: "Peut rapprocher tes séries de l'échec sans que tu le sentes. Note la difficulté de chaque exercice."
    pt:
      title: "Descanso curto"
      body: "Pode levar as séries mais perto da falha do que notas. Regista o esforço de cada exercício."
    tr:
      title: "Kısa dinlenme"
      body: "Setlerini fark ettiğinden daha çok tükenişe yaklaştırabilir. Her hareketin ne kadar zor geldiğini not al."

  - key: stabilisatoren
    kind: fact
    en:
      title: "Stabilisers"
      body: "Don't pair moves that tire the same stabilising muscles. That's where your form breaks down."
    nl:
      title: "Stabilisatoren"
      body: "Combineer geen oefeningen die dezelfde stabiliserende spieren vermoeien. Daar zakt je techniek in."
    de:
      title: "Stabilisatoren"
      body: "Kombinier keine Übungen, die dieselben Stützmuskeln ermüden. Da bricht die Technik ein."
    es:
      title: "Estabilizadores"
      body: "No juntes ejercicios que cansen los mismos músculos estabilizadores. Ahí se rompe la técnica."
    fr:
      title: "Stabilisateurs"
      body: "N'associe pas des exercices qui fatiguent les mêmes muscles stabilisateurs. C'est là que la forme lâche."
    pt:
      title: "Estabilizadores"
      body: "Não juntes exercícios que cansem os mesmos estabilizadores. É aí que a técnica falha."
    tr:
      title: "Dengeleyiciler"
      body: "Aynı dengeleyici kasları yoran hareketleri eşleme. Form tam orada bozulur."

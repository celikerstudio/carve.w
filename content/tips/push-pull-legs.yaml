article: push-pull-legs
emoji: "🔄"
tips:
  - key: wat-is-het
    kind: fact
    en:
      title: "3 to 6 days"
      body: "Push is chest, shoulders, triceps. Pull is back and biceps. Then legs. Run it 3 to 6 days a week."
    nl:
      title: "3 tot 6 dagen"
      body: "Push is borst, schouders, triceps. Pull is rug en biceps. Dan benen. Draai het 3 tot 6 dagen per week."
    de:
      title: "3 bis 6 Tage"
      body: "Push ist Brust, Schultern, Trizeps. Pull ist Rücken und Bizeps. Dann Beine. Läuft an 3 bis 6 Tagen."
    es:
      title: "3 a 6 días"
      body: "Empuje es pecho, hombros y tríceps. Tirón es espalda y bíceps. Luego pierna. De 3 a 6 días por semana."
    fr:
      title: "3 à 6 jours"
      body: "Push : pecs, épaules, triceps. Pull : dos et biceps. Puis jambes. Sur 3 à 6 jours par semaine."
    pt:
      title: "3 a 6 dias"
      body: "Push é peito, ombros e tríceps. Pull é costas e bíceps. Depois pernas. De 3 a 6 dias por semana."
    tr:
      title: "3-6 gün"
      body: "Push göğüs, omuz, arka kol. Pull sırt ve pazı. Sonra bacak. Haftada 3-6 gün yapılır."

  - key: twee-rondes
    kind: fact
    en:
      title: "Twice through"
      body: "Run push, pull, legs twice in 8 to 10 days, or over 6 days, and each muscle gets trained about twice."
    nl:
      title: "Twee rondes"
      body: "Doe push, pull, legs twee keer in 8 tot 10 dagen, of in 6 dagen, en elke spier wordt zo'n twee keer getraind."
    de:
      title: "Zwei Runden"
      body: "Push, Pull, Beine zweimal in 8 bis 10 Tagen oder in 6 Tagen, und jeder Muskel wird etwa zweimal trainiert."
    es:
      title: "Dos vueltas"
      body: "Haz empuje, tirón y pierna dos veces en 8 a 10 días, o en 6, y cada músculo se entrena unas dos veces."
    fr:
      title: "Deux tours"
      body: "Fais push, pull, legs deux fois en 8 à 10 jours, ou en 6 jours, et chaque muscle bosse environ deux fois."
    pt:
      title: "Duas voltas"
      body: "Faz push, pull, pernas duas vezes em 8 a 10 dias, ou em 6, e cada músculo é treinado cerca de duas vezes."
    tr:
      title: "İki tur"
      body: "Push, pull, legs'i 8-10 günde ya da 6 günde iki kez yap, her kas yaklaşık iki kez çalışır."

  - key: lichtere-dag
    kind: fact
    en:
      title: "5 or 6 days"
      body: "A week? Run push, pull, legs twice over and make one of those days lighter."
    nl:
      title: "5 of 6 dagen"
      body: "Per week? Draai push, pull, legs twee keer achter elkaar en maak één van die dagen lichter."
    de:
      title: "5 oder 6 Tage"
      body: "Pro Woche? Push, Pull, Beine zweimal hintereinander, und mach einen der Tage leichter."
    es:
      title: "5 o 6 días"
      body: "¿Por semana? Haz empuje, tirón y pierna dos veces seguidas y aligera uno de esos días."
    fr:
      title: "5 ou 6 jours"
      body: "Par semaine ? Enchaîne push, pull, legs deux fois et allège l'un des jours."
    pt:
      title: "5 ou 6 dias"
      body: "Por semana? Faz push, pull, pernas duas vezes seguidas e torna um desses dias mais leve."
    tr:
      title: "5 ya da 6 gün"
      body: "Haftada mı? Push, pull, legs'i iki kez arka arkaya yap ve günlerden birini hafif tut."

  - key: niet-elke-sessie-falen
    kind: myth
    en:
      title: "To failure"
      body: "Myth: every PPL session goes to failure. That wrecks your recovery by midweek. Leave 1 to 3 reps on most sets."
    nl:
      title: "Tot falen"
      body: "Mythe: elke PPL-training ga je tot falen. Dan is je herstel halverwege de week op. Houd 1 tot 3 herhalingen over."
    de:
      title: "Bis zum Versagen"
      body: "Mythos: Jede PPL-Einheit geht bis zum Versagen. Das ruiniert die Erholung bis Wochenmitte. Lass 1 bis 3 Wdh. übrig."
    es:
      title: "Hasta el fallo"
      body: "Mito: cada sesión PPL va al fallo. A mitad de semana tu recuperación no da más. Deja 1 a 3 repeticiones."
    fr:
      title: "Jusqu'à l'échec"
      body: "Mythe : chaque séance PPL va à l'échec. Ta récup lâche en milieu de semaine. Garde 1 à 3 reps en réserve."
    pt:
      title: "Até à falha"
      body: "Mito: cada treino PPL vai até à falha. A meio da semana a recuperação já foi. Deixa 1 a 3 repetições."
    tr:
      title: "Tükenişe kadar"
      body: "Efsane: her PPL antrenmanı tükenişe gider. Hafta ortasında toparlanman biter. Çoğu sette 1-3 tekrar bırak."

  - key: push-moeheid
    kind: fact
    en:
      title: "Push, then pull"
      body: "Hard pressing can drag down your pulling the next day, and vice versa. Set effort so one day doesn't spoil the next."
    nl:
      title: "Duwen, dan trekken"
      body: "Zwaar drukken kan je trekwerk de dag erna drukken, en andersom. Doseer zodat de ene dag de volgende niet verpest."
    de:
      title: "Drücken, dann Ziehen"
      body: "Hartes Drücken kann am nächsten Tag das Ziehen bremsen und umgekehrt. Dosier so, dass kein Tag den nächsten verdirbt."
    es:
      title: "Empuje, luego tirón"
      body: "Empujar fuerte puede lastrar el tirón del día siguiente, y al revés. Dosifica para no estropear el día siguiente."
    fr:
      title: "Pousser puis tirer"
      body: "Pousser fort peut plomber le tirage du lendemain, et inversement. Dose pour qu'un jour n'abîme pas l'autre."
    pt:
      title: "Empurrar, depois puxar"
      body: "Empurrar forte pode prejudicar o puxar no dia seguinte, e vice-versa. Doseia para um dia não estragar o outro."
    tr:
      title: "Önce itiş, sonra çekiş"
      body: "Ağır itiş ertesi günkü çekişi bozabilir, tersi de olur. Bir gün diğerini bozmasın diye eforu ayarla."

  - key: schouders-triceps
    kind: fact
    en:
      title: "Shoulders"
      body: "On PPL, count sets per muscle. Shoulders and triceps are the ones that easily get overloaded."
    nl:
      title: "Schouders"
      body: "Tel op PPL je sets per spier. Schouders en triceps raken het makkelijkst overbelast."
    de:
      title: "Schultern"
      body: "Zähl bei PPL die Sätze pro Muskel. Schultern und Trizeps werden am leichtesten überlastet."
    es:
      title: "Hombros"
      body: "En PPL, cuenta series por músculo. Hombros y tríceps son los que se sobrecargan con facilidad."
    fr:
      title: "Épaules"
      body: "En PPL, compte tes séries par muscle. Épaules et triceps sont les plus vite surchargés."
    pt:
      title: "Ombros"
      body: "No PPL, conta as séries por músculo. Ombros e tríceps são os que mais facilmente ficam sobrecarregados."
    tr:
      title: "Omuzlar"
      body: "PPL'de kas başına seti say. En kolay aşırı yüklenenler omuz ve arka kol."

  - key: techniek-niet-na-zware-dag
    kind: fact
    en:
      title: "Technical lifts"
      body: "Keep them away from the day after a very hard session, and avoid back-to-back max efforts on the same joints."
    nl:
      title: "Technische oefeningen"
      body: "Niet op de dag na een heel zware training, en geen twee dagen op rij maximaal op dezelfde gewrichten."
    de:
      title: "Technische Übungen"
      body: "Nicht am Tag nach einer sehr harten Einheit, und keine Maximalbelastung zwei Tage hintereinander aufs gleiche Gelenk."
    es:
      title: "Ejercicios técnicos"
      body: "Aléjalos del día después de una sesión muy dura, y evita esfuerzos máximos seguidos en las mismas articulaciones."
    fr:
      title: "Exos techniques"
      body: "Évite-les le lendemain d'une séance très dure, et pas d'efforts max deux jours de suite sur les mêmes articulations."
    pt:
      title: "Exercícios técnicos"
      body: "Afasta-os do dia a seguir a um treino muito duro, e evita esforços máximos seguidos nas mesmas articulações."
    tr:
      title: "Teknik hareketler"
      body: "Çok sert antrenmanın ertesi gününe koyma, aynı eklemlere art arda maksimum efor yükleme."

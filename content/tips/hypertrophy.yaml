article: hypertrophy
emoji: "📈"
tips:
  - key: falen-geen-voordeel
    kind: myth
    en:
      title: "To failure"
      body: "Myth: training to failure builds more muscle. 15 studies found no edge over stopping just short of it."
    nl:
      title: "Tot falen"
      body: "Mythe: tot falen trainen bouwt meer spier. 15 studies vonden geen voordeel boven net ervoor stoppen."
    de:
      title: "Bis zum Versagen"
      body: "Mythos: Bis zum Versagen baut mehr Muskeln. 15 Studien fanden keinen Vorteil gegenüber knapp davor."
    es:
      title: "Hasta el fallo"
      body: "Mito: llegar al fallo da más músculo. 15 estudios no vieron ventaja frente a parar justo antes."
    fr:
      title: "Jusqu'à l'échec"
      body: "Mythe : aller à l'échec fait plus de muscle. 15 études n'ont vu aucun avantage sur s'arrêter juste avant."
    pt:
      title: "Até à falha"
      body: "Mito: ir até à falha dá mais músculo. 15 estudos não viram vantagem face a parar mesmo antes."
    tr:
      title: "Tükenişe kadar"
      body: "Efsane: tükenişe kadar çalışmak daha çok kas yapar. 15 çalışma hemen önce durmaya göre fayda bulmadı."

  - key: dichter-bij-falen
    kind: fact
    en:
      title: "Close to failure"
      body: "Muscles grew more when sets ended closer to it, in one exploratory analysis. Skip the easy sets."
    nl:
      title: "Dicht bij falen"
      body: "Spieren groeiden meer als sets dichter bij falen eindigden, in een verkennende analyse. Sla makkelijke sets over."
    de:
      title: "Nah am Versagen"
      body: "Muskeln wuchsen mehr, wenn Sätze näher daran endeten, so eine explorative Analyse. Lass lockere Sätze weg."
    es:
      title: "Cerca del fallo"
      body: "El músculo creció más con series que acababan más cerca del fallo, en un análisis exploratorio."
    fr:
      title: "Près de l'échec"
      body: "Le muscle a plus grossi quand les séries finissaient plus près de l'échec, selon une analyse exploratoire."
    pt:
      title: "Perto da falha"
      body: "O músculo cresceu mais com séries a acabar mais perto da falha, numa análise exploratória."
    tr:
      title: "Tükenişe yakın"
      body: "Keşif amaçlı bir analizde setler tükenişe yakın bitince kaslar daha çok büyüdü. Kolay setleri atla."

  - key: excentrisch
    kind: fact
    en:
      title: "The lowering"
      body: "The ACSM found more growth with eccentric overload: extra weight or time while you lower the weight."
    nl:
      title: "Het zakken"
      body: "De ACSM zag meer groei met excentrische overload: extra gewicht of tijd terwijl je het gewicht laat zakken."
    de:
      title: "Das Absenken"
      body: "Das ACSM fand mehr Wachstum mit exzentrischer Überlast: mehr Gewicht oder Zeit beim Absenken."
    es:
      title: "La bajada"
      body: "El ACSM vio más crecimiento con sobrecarga excéntrica: más peso o tiempo al bajar."
    fr:
      title: "La descente"
      body: "L'ACSM a vu plus de croissance avec surcharge excentrique : plus de poids ou de temps en descente."
    pt:
      title: "A descida"
      body: "O ACSM viu mais crescimento com sobrecarga excêntrica: mais peso ou tempo na descida."
    tr:
      title: "İniş"
      body: "ACSM eksantrik aşırı yükle daha çok büyüme buldu: indirirken ekstra ağırlık ya da süre."

  - key: rust-60-90
    kind: fact
    en:
      title: "60 to 90 seconds"
      body: "Resting over 60 seconds helped growth a little in nine studies. Past 90, no difference showed up."
    nl:
      title: "60 tot 90 seconden"
      body: "Langer dan 60 seconden rusten hielp groei een beetje, in negen studies. Boven 90 zag je geen verschil."
    de:
      title: "60 bis 90 Sekunden"
      body: "Über 60 Sekunden Pause half dem Wachstum in neun Studien etwas. Über 90 kein Unterschied mehr."
    es:
      title: "60 a 90 segundos"
      body: "Descansar más de 60 segundos ayudó algo a crecer en nueve estudios. Más de 90, sin diferencia."
    fr:
      title: "60 à 90 secondes"
      body: "Plus de 60 secondes de repos aidaient un peu la croissance sur neuf études. Au-delà de 90, rien."
    pt:
      title: "60 a 90 segundos"
      body: "Descansar mais de 60 segundos ajudou um pouco o crescimento em nove estudos. Além de 90, nada."
    tr:
      title: "60-90 saniye"
      body: "Dokuz çalışmada 60 saniyeden uzun dinlenmek büyümeye biraz yardım etti. 90'dan sonra fark yok."

  - key: rust-acsm-2026
    kind: fact
    en:
      title: "No fixed rest"
      body: "The 2026 ACSM stand gives no rest time. Too little data to say whether rest affects growth."
    nl:
      title: "Geen vaste rust"
      body: "Het ACSM-standpunt van 2026 noemt geen rusttijd. Te weinig data om te zeggen of rust groei beïnvloedt."
    de:
      title: "Keine feste Pause"
      body: "Die ACSM-Stellungnahme 2026 nennt keine Pausenzeit. Zu wenig Daten, ob Pausen das Wachstum beeinflussen."
    es:
      title: "Sin descanso fijo"
      body: "La postura del ACSM de 2026 no da tiempo de descanso. Faltan datos para saber si influye."
    fr:
      title: "Pas de repos fixe"
      body: "La prise de position ACSM 2026 ne donne aucun temps de repos. Trop peu de données."
    pt:
      title: "Sem descanso fixo"
      body: "A posição do ACSM de 2026 não dá tempo de descanso. Faltam dados para saber se influencia."
    tr:
      title: "Sabit dinlenme yok"
      body: "ACSM'nin 2026 bildirgesi dinlenme süresi vermiyor. Büyümeye etkisini söylemek için veri az."

  - key: kort-rusten
    kind: fact
    en:
      title: "Short on time"
      body: "Shorter rests work, but expect fewer reps later on. Ideally, rest until you can do the next set well."
    nl:
      title: "Weinig tijd"
      body: "Korter rusten kan, maar verwacht minder herhalingen in latere sets. Liefst rust je tot de volgende set goed gaat."
    de:
      title: "Wenig Zeit"
      body: "Kürzere Pausen gehen, aber später schaffst du weniger Wiederholungen. Am besten Pause, bis der Satz gut geht."
    es:
      title: "Poco tiempo"
      body: "Descansar menos vale, pero harás menos repeticiones después. Lo ideal: descansa hasta poder hacerla bien."
    fr:
      title: "Peu de temps"
      body: "Moins de repos, c'est possible, mais moins de reps ensuite. Idéalement, repose-toi jusqu'à être prêt."
    pt:
      title: "Pouco tempo"
      body: "Descansar menos dá, mas faz menos repetições depois. O ideal é descansar até fazeres bem a seguinte."
    tr:
      title: "Zaman azsa"
      body: "Kısa dinlenme olur ama sonraki setlerde daha az tekrar beklenir. İdeali, sonraki seti iyi yapana kadar dinlen."

  - key: progressie-niet-meteen
    kind: myth
    en:
      title: "More weight"
      body: "Myth: no results without adding weight. The first gains come without it. You need more later to keep going."
    nl:
      title: "Meer gewicht"
      body: "Mythe: geen resultaat zonder meer gewicht. De eerste winst komt zonder. Later heb je meer nodig om door te groeien."
    de:
      title: "Mehr Gewicht"
      body: "Mythos: Ohne mehr Gewicht keine Ergebnisse. Die ersten Erfolge kommen auch so. Später brauchst du mehr."
    es:
      title: "Más peso"
      body: "Mito: sin subir peso no hay resultados. Las primeras mejoras llegan igual. Más tarde hará falta más."
    fr:
      title: "Plus lourd"
      body: "Mythe : pas de résultats sans charger plus. Les premiers gains viennent sans ça. Plus tard, il en faudra plus."
    pt:
      title: "Mais peso"
      body: "Mito: sem mais peso não há resultados. Os primeiros ganhos vêm na mesma. Mais tarde vais precisar de mais."
    tr:
      title: "Daha ağır"
      body: "Efsane: ağırlık eklemeden sonuç olmaz. İlk kazançlar onsuz da gelir. Sonra ilerlemek için daha fazlası gerekir."

  - key: zelfde-sets
    kind: fact
    en:
      title: "One extra set"
      body: "Doing the same few sets for months? Add one set per muscle as a simple next step."
    nl:
      title: "Eén set erbij"
      body: "Al maanden dezelfde paar sets? Eén set per spier erbij is een simpele volgende stap."
    de:
      title: "Ein Satz mehr"
      body: "Seit Monaten dieselben paar Sätze? Ein Satz mehr pro Muskel ist ein einfacher nächster Schritt."
    es:
      title: "Una serie más"
      body: "¿Meses con las mismas pocas series? Sumar una por músculo es un siguiente paso sencillo."
    fr:
      title: "Une série de plus"
      body: "Les mêmes séries depuis des mois ? En ajouter une par muscle est une étape simple."
    pt:
      title: "Mais uma série"
      body: "Meses com as mesmas poucas séries? Juntar uma por músculo é um passo simples."
    tr:
      title: "Bir set fazla"
      body: "Aylardır aynı birkaç set mi? Kas başına bir set eklemek basit bir sonraki adım."

  - key: hoe-snel
    kind: fact
    en:
      title: "Months"
      body: "That's the scale to judge growth on, with photos, measurements and your lifts. There's no set rate."
    nl:
      title: "Maanden"
      body: "Op die schaal beoordeel je groei, met foto's, maten en je gewichten. Een vast tempo bestaat niet."
    de:
      title: "Monate"
      body: "Auf dieser Skala beurteilst du Wachstum, mit Fotos, Maßen und Gewichten. Ein festes Tempo gibt es nicht."
    es:
      title: "Meses"
      body: "Es la escala para juzgar tu crecimiento, con fotos, medidas y tus pesos. No hay un ritmo fijo."
    fr:
      title: "Des mois"
      body: "C'est l'échelle pour juger ta progression, avec photos, mensurations et charges. Pas de rythme fixe."
    pt:
      title: "Meses"
      body: "É a escala para avaliar o crescimento, com fotos, medidas e os teus pesos. Não há ritmo fixo."
    tr:
      title: "Aylar"
      body: "Gelişimi fotoğraf, ölçü ve ağırlıklarla bu ölçekte değerlendir. Sabit bir hız yok."

article: progress-tracking
emoji: "📓"
tips:
  - key: eten-bewegen-gewicht
    kind: fact
    en:
      title: "Three things"
      body: "Weight loss programmes usually have you track your food, your activity and your weight."
    nl:
      title: "Drie dingen"
      body: "Afvalprogramma's laten je meestal je eten, je beweging en je gewicht bijhouden."
    de:
      title: "Drei Dinge"
      body: "Abnehmprogramme lassen dich meist Essen, Bewegung und Gewicht festhalten."
    es:
      title: "Tres cosas"
      body: "Los programas para adelgazar suelen pedirte que registres comida, actividad y peso."
    fr:
      title: "Trois choses"
      body: "Les programmes de perte de poids te font suivre ton alimentation, ton activité et ton poids."
    pt:
      title: "Três coisas"
      body: "Os programas para perder peso costumam pedir que registes comida, atividade e peso."
    tr:
      title: "Üç şey"
      body: "Kilo verme programları genelde yemeğini, hareketini ve kilonu takip ettirir."

  - key: wekelijks-wegen
    kind: fact
    en:
      title: "Weekly"
      body: "Weighing yourself weekly or more often helps keep lost weight off, a US guideline adds."
    nl:
      title: "Wekelijks"
      body: "Je wekelijks of vaker wegen helpt verloren gewicht eraf te houden, voegt een Amerikaanse richtlijn toe."
    de:
      title: "Wöchentlich"
      body: "Sich wöchentlich oder öfter zu wiegen hilft, verlorenes Gewicht wegzuhalten, so eine US-Leitlinie."
    es:
      title: "Cada semana"
      body: "Pesarte cada semana o más ayuda a no recuperar el peso perdido, añade una guía de EE. UU."
    fr:
      title: "Chaque semaine"
      body: "Se peser chaque semaine ou plus aide à garder les kilos perdus à distance, ajoute un guide américain."
    pt:
      title: "Todas as semanas"
      body: "Pesar-te todas as semanas ou mais ajuda a manter o peso perdido, acrescenta uma diretriz dos EUA."
    tr:
      title: "Her hafta"
      body: "Bir ABD rehberine göre haftada bir ya da daha sık tartılmak verilen kiloyu uzak tutmaya yardım eder."

  - key: verband-geen-oorzaak
    kind: myth
    en:
      title: "Weighing often"
      body: "Myth: weighing often keeps weight off. It's a link, not proof. Frequent weighers may be more committed overall."
    nl:
      title: "Vaak wegen"
      body: "Mythe: vaak wegen houdt je gewicht laag. Een verband, geen bewijs. Wie vaak weegt, is misschien sowieso fanatieker."
    de:
      title: "Oft wiegen"
      body: "Mythos: Oft wiegen hält das Gewicht unten. Ein Zusammenhang, kein Beweis. Vielwieger sind wohl insgesamt engagierter."
    es:
      title: "Pesarse a menudo"
      body: "Mito: pesarte mucho evita recuperar peso. Es una relación, no prueba. Quizá quien se pesa más se implica más."
    fr:
      title: "Se peser souvent"
      body: "Mythe : se peser souvent garde le poids bas. C'est un lien, pas une preuve. Ces gens sont peut-être plus motivés."
    pt:
      title: "Pesar-te muito"
      body: "Mito: pesar-te muito evita voltar a ganhar. É uma ligação, não prova. Quem se pesa mais talvez se empenhe mais."
    tr:
      title: "Sık tartılmak"
      body: "Efsane: sık tartılmak kiloyu uzak tutar. Bu bir bağ, kanıt değil. Sık tartılanlar genel olarak daha kararlı olabilir."

  - key: weekschommeling
    kind: myth
    en:
      title: "Early week"
      body: "Myth: a high weigh-in means you gained. Weight runs higher early in the week and falls during it. That's normal."
    nl:
      title: "Begin van de week"
      body: "Mythe: een hoge weging is aankomen. Gewicht ligt begin van de week hoger en zakt daarna. Dat is normaal."
    de:
      title: "Wochenanfang"
      body: "Mythos: Ein hoher Wert heißt zugenommen. Am Wochenanfang ist das Gewicht höher und sinkt dann. Normal."
    es:
      title: "Inicio de semana"
      body: "Mito: un pesaje alto es haber engordado. El peso es mayor al inicio de semana y luego baja. Es normal."
    fr:
      title: "Début de semaine"
      body: "Mythe : une pesée haute, c'est avoir grossi. Le poids est plus haut en début de semaine puis baisse. Normal."
    pt:
      title: "Início da semana"
      body: "Mito: uma pesagem alta é ter engordado. O peso é mais alto no início da semana e depois desce. É normal."
    tr:
      title: "Hafta başı"
      body: "Efsane: yüksek tartı kilo aldın demek. Kilo hafta başında yüksek, sonra düşer. Bu normal."

  - key: zelfde-moment
    kind: fact
    en:
      title: "Same time"
      body: "Weigh at the same time of day. Daily? Compare one week's average with the week before."
    nl:
      title: "Zelfde moment"
      body: "Weeg je op hetzelfde moment van de dag. Dagelijks? Vergelijk het weekgemiddelde met de week ervoor."
    de:
      title: "Gleiche Zeit"
      body: "Wieg dich zur gleichen Tageszeit. Täglich? Vergleich den Wochenschnitt mit der Vorwoche."
    es:
      title: "Misma hora"
      body: "Pésate a la misma hora del día. ¿A diario? Compara la media de la semana con la anterior."
    fr:
      title: "Même moment"
      body: "Pèse-toi au même moment de la journée. Chaque jour ? Compare la moyenne de la semaine à la précédente."
    pt:
      title: "Mesma hora"
      body: "Pesa-te à mesma hora do dia. Diariamente? Compara a média da semana com a anterior."
    tr:
      title: "Aynı saat"
      body: "Günün aynı saatinde tartıl. Her gün mü? Haftalık ortalamayı bir önceki haftayla kıyasla."

  - key: vinkje-per-training
    kind: fact
    en:
      title: "A tick"
      body: "One for each workout shows how consistent you were, even in a week when the scale did nothing."
    nl:
      title: "Een vinkje"
      body: "Eén per training laat zien hoe trouw je was, ook in een week waarin de weegschaal niets deed."
    de:
      title: "Ein Haken"
      body: "Einer pro Training zeigt, wie konsequent du warst, auch wenn die Waage nichts tat."
    es:
      title: "Una marca"
      body: "Una por entreno muestra tu constancia, incluso en una semana en que la báscula no se movió."
    fr:
      title: "Une coche"
      body: "Une par séance montre ta régularité, même une semaine où la balance n'a pas bougé."
    pt:
      title: "Um visto"
      body: "Um por treino mostra a tua constância, mesmo numa semana em que a balança não mexeu."
    tr:
      title: "Bir tik"
      body: "Her antrenmana bir tik, tartının kıpırdamadığı haftada bile ne kadar istikrarlı olduğunu gösterir."

  - key: klein-houden
    kind: fact
    en:
      title: "Keep it small"
      body: "Track only what you'll still track in a month. A log you keep up beats a detailed one you drop."
    nl:
      title: "Houd het klein"
      body: "Houd alleen bij wat je over een maand nog bijhoudt. Een simpel logboek dat je volhoudt wint."
    de:
      title: "Klein halten"
      body: "Notier nur, was du in einem Monat noch notierst. Ein Log, das bleibt, schlägt ein detailliertes, das du aufgibst."
    es:
      title: "Que sea poco"
      body: "Registra solo lo que seguirás registrando en un mes. Un registro que mantienes gana a uno detallado que dejas."
    fr:
      title: "Reste simple"
      body: "Note seulement ce que tu noteras encore dans un mois. Un suivi tenu vaut mieux qu'un suivi détaillé lâché."
    pt:
      title: "Mantém pouco"
      body: "Regista só o que ainda vais registar daqui a um mês. Um registo mantido vale mais do que um detalhado largado."
    tr:
      title: "Basit tut"
      body: "Sadece bir ay sonra da takip edeceğin şeyi kaydet. Sürdürdüğün basit kayıt, bıraktığın ayrıntılıdan iyidir."

  - key: als-het-je-onrustig-maakt
    kind: fact
    en:
      title: "Anxious"
      body: "Does weighing or logging food make you anxious, or have you had an eating disorder? Talk to your doctor first."
    nl:
      title: "Onrustig"
      body: "Word je onrustig van wegen of eten bijhouden, of had je een eetstoornis? Praat eerst met je arts of diëtist."
    de:
      title: "Unruhig"
      body: "Macht dich Wiegen oder Essen notieren unruhig, oder hattest du eine Essstörung? Sprich erst mit deinem Arzt."
    es:
      title: "Ansiedad"
      body: "¿Pesarte o registrar comida te angustia, o has tenido un trastorno alimentario? Habla antes con tu médico."
    fr:
      title: "Anxieux"
      body: "Te peser ou noter tes repas t'angoisse, ou tu as eu un trouble alimentaire ? Parle d'abord à ton médecin."
    pt:
      title: "Ansiedade"
      body: "Pesar-te ou registar comida deixa-te ansioso, ou já tiveste uma perturbação alimentar? Fala primeiro com o médico."
    tr:
      title: "Kaygı"
      body: "Tartılmak ya da yemek kaydetmek seni kaygılandırıyorsa ya da yeme bozukluğu geçirdiysen önce doktorunla konuş."

article: vitamin-d
emoji: "☀️"
tips:
  - key: hoeveel-per-dag
    kind: fact
    en:
      title: "10 microgram"
      body: "Vitamin D a day, or 400 IU, is the Dutch advice. From age 70 it's 20 microgram (800 IU)."
    nl:
      title: "10 microgram"
      body: "Vitamine D per dag, of 400 IE, is het advies in Nederland. Vanaf 70 jaar is het 20 microgram (800 IE)."
    de:
      title: "10 Mikrogramm"
      body: "Vitamin D am Tag, also 400 IE, raten die Niederlande. Ab 70 sind es 20 Mikrogramm (800 IE)."
    es:
      title: "10 microgramos"
      body: "De vitamina D al día, o 400 UI, es el consejo en Países Bajos. Desde los 70, 20 microgramos (800 UI)."
    fr:
      title: "10 microgrammes"
      body: "De vitamine D par jour, soit 400 UI, conseillent les Pays-Bas. Dès 70 ans, 20 microgrammes (800 UI)."
    pt:
      title: "10 microgramas"
      body: "De vitamina D por dia, ou 400 UI, é o conselho nos Países Baixos. A partir dos 70, 20 microgramas."
    tr:
      title: "10 mikrogram"
      body: "Hollanda'da günlük D vitamini önerisi, yani 400 IU. 70 yaştan sonra 20 mikrogram (800 IU)."

  - key: microgram-en-ie
    kind: fact
    en:
      title: "40 IU"
      body: "Is one microgram of vitamin D. So 10 microgram on a label is 400 IU."
    nl:
      title: "40 IE"
      body: "Is één microgram vitamine D. Dus 10 microgram op het etiket is 400 IE."
    de:
      title: "40 IE"
      body: "Entsprechen einem Mikrogramm Vitamin D. 10 Mikrogramm auf dem Etikett sind also 400 IE."
    es:
      title: "40 UI"
      body: "Es un microgramo de vitamina D. Así que 10 microgramos en la etiqueta son 400 UI."
    fr:
      title: "40 UI"
      body: "C'est un microgramme de vitamine D. Donc 10 microgrammes sur l'étiquette font 400 UI."
    pt:
      title: "40 UI"
      body: "É um micrograma de vitamina D. Por isso 10 microgramas no rótulo são 400 UI."
    tr:
      title: "40 IU"
      body: "Bir mikrogram D vitaminine eşittir. Yani etikette 10 mikrogram 400 IU demek."

  - key: meer-is-niet-beter
    kind: myth
    en:
      title: "More"
      body: "Myth: more vitamin D is better. Beyond the recommended amount, there's no extra health benefit."
    nl:
      title: "Meer"
      body: "Mythe: meer vitamine D is beter. Boven de aanbevolen hoeveelheid levert het geen extra gezondheidswinst op."
    de:
      title: "Mehr"
      body: "Mythos: Mehr Vitamin D ist besser. Über die empfohlene Menge hinaus bringt es keinen Zusatznutzen."
    es:
      title: "Más"
      body: "Mito: más vitamina D es mejor. Por encima de lo recomendado no hay beneficio extra para la salud."
    fr:
      title: "Plus"
      body: "Mythe : plus de vitamine D, c'est mieux. Au-delà de la dose conseillée, aucun bénéfice en plus."
    pt:
      title: "Mais"
      body: "Mito: mais vitamina D é melhor. Acima do recomendado não há benefício extra para a saúde."
    tr:
      title: "Daha fazla"
      body: "Efsane: daha çok D vitamini daha iyi. Önerilen miktarın üstü ek sağlık faydası vermez."

  - key: winterzon
    kind: fact
    en:
      title: "Winter sun"
      body: "In a Dutch winter it's too low for your skin to make vitamin D, however long you're outside."
    nl:
      title: "Wintersoon"
      body: "In een Nederlandse winter staat de zon te laag om vitamine D aan te maken, hoe lang je ook buiten bent."
    de:
      title: "Wintersonne"
      body: "Im niederländischen Winter steht die Sonne zu tief für Vitamin D, egal wie lange du draußen bist."
    es:
      title: "Sol de invierno"
      body: "En un invierno neerlandés el sol está demasiado bajo para fabricar vitamina D, por mucho que salgas."
    fr:
      title: "Soleil d'hiver"
      body: "En hiver aux Pays-Bas, le soleil est trop bas pour fabriquer de la vitamine D, même dehors longtemps."
    pt:
      title: "Sol de inverno"
      body: "Num inverno neerlandês o sol está baixo demais para fazer vitamina D, por mais que estejas fora."
    tr:
      title: "Kış güneşi"
      body: "Hollanda kışında güneş D vitamini üretmek için çok alçakta, ne kadar dışarıda kalırsan kal."

  - key: zomerzon
    kind: fact
    en:
      title: "15 to 30 minutes"
      body: "Outside a day between 11:00 and 15:00, face and hands bare, from March to October. That's the Dutch advice."
    nl:
      title: "15 tot 30 minuten"
      body: "Per dag buiten tussen 11 en 15 uur, met gezicht en handen bloot, van maart tot oktober. Dat is het advies."
    de:
      title: "15 bis 30 Minuten"
      body: "Täglich draußen zwischen 11 und 15 Uhr, Gesicht und Hände frei, von März bis Oktober."
    es:
      title: "15 a 30 minutos"
      body: "Al aire libre entre las 11:00 y las 15:00, cara y manos al sol, de marzo a octubre. Consejo neerlandés."
    fr:
      title: "15 à 30 minutes"
      body: "Dehors entre 11 h et 15 h, visage et mains découverts, de mars à octobre. Le conseil néerlandais."
    pt:
      title: "15 a 30 minutos"
      body: "Ao ar livre entre as 11h e as 15h, cara e mãos descobertas, de março a outubro. Conselho neerlandês."
    tr:
      title: "15-30 dakika"
      body: "Mart-ekim arası 11:00-15:00'te yüz ve eller açık, günde bu kadar dışarıda kal. Hollanda önerisi."

  - key: bovengrens-geen-dosis
    kind: myth
    en:
      title: "100 microgram"
      body: "Myth: the upper limit is a dose to aim for. It's a ceiling for all sources, ten times the Dutch advice."
    nl:
      title: "100 microgram"
      body: "Mythe: de bovengrens is een dosis om naar te streven. Het is een plafond voor alles samen, tien keer het advies."
    de:
      title: "100 Mikrogramm"
      body: "Mythos: Die Obergrenze ist eine Zieldosis. Sie ist eine Decke für alle Quellen, zehnmal der niederländische Rat."
    es:
      title: "100 microgramos"
      body: "Mito: el límite máximo es una dosis a buscar. Es un techo para todo, diez veces el consejo neerlandés."
    fr:
      title: "100 microgrammes"
      body: "Mythe : la limite haute est une dose à viser. C'est un plafond toutes sources, dix fois le conseil néerlandais."
    pt:
      title: "100 microgramas"
      body: "Mito: o limite máximo é uma dose a atingir. É um teto para tudo, dez vezes o conselho neerlandês."
    tr:
      title: "100 mikrogram"
      body: "Efsane: üst sınır hedeflenecek bir doz. Tüm kaynaklar için tavan, Hollanda önerisinin on katı."

  - key: testosteron
    kind: myth
    en:
      title: "Testosterone"
      body: "Myth: vitamin D raises testosterone. A review including 10 vitamin D studies didn't rate it as doing so."
    nl:
      title: "Testosteron"
      body: "Mythe: vitamine D verhoogt testosteron. Een review met 10 vitamine D-studies beoordeelde het niet zo."
    de:
      title: "Testosteron"
      body: "Mythos: Vitamin D erhöht Testosteron. Eine Übersicht mit 10 Vitamin-D-Studien sah das nicht."
    es:
      title: "Testosterona"
      body: "Mito: la vitamina D sube la testosterona. Una revisión con 10 estudios de vitamina D no lo vio así."
    fr:
      title: "Testostérone"
      body: "Mythe : la vitamine D monte la testo. Une revue avec 10 études sur la vitamine D ne l'a pas retenu."
    pt:
      title: "Testosterona"
      body: "Mito: a vitamina D sobe a testosterona. Uma revisão com 10 estudos de vitamina D não o confirmou."
    tr:
      title: "Testosteron"
      body: "Efsane: D vitamini testosteronu artırır. 10 D vitamini çalışması içeren bir derleme bunu doğrulamadı."

  - key: efsa-15-nederland-10
    kind: fact
    en:
      title: "10 or 15"
      body: "Microgram? EFSA says 15, the Netherlands 10. Both are for little sun, from separate calculations."
    nl:
      title: "10 of 15"
      body: "Microgram? EFSA zegt 15, Nederland 10. Allebei voor weinig zon, uit aparte berekeningen."
    de:
      title: "10 oder 15"
      body: "Mikrogramm? Die EFSA sagt 15, die Niederlande 10. Beides gilt bei wenig Sonne, aus getrennten Rechnungen."
    es:
      title: "10 o 15"
      body: "¿Microgramos? La EFSA dice 15, Países Bajos 10. Ambos son para poco sol y salen de cálculos distintos."
    fr:
      title: "10 ou 15"
      body: "Microgrammes ? L'EFSA dit 15, les Pays-Bas 10. Les deux supposent peu de soleil, avec des calculs différents."
    pt:
      title: "10 ou 15"
      body: "Microgramas? A EFSA diz 15, os Países Baixos 10. Ambos são para pouco sol, de cálculos separados."
    tr:
      title: "10 mu 15 mi"
      body: "Mikrogram mı? EFSA 15, Hollanda 10 diyor. İkisi de az güneş için, ayrı hesaplardan geliyor."

  - key: zon-en-eten
    kind: fact
    en:
      title: "Two thirds"
      body: "Of your vitamin D comes from sunlight over a year, if you're light-skinned and often outside. A third from food."
    nl:
      title: "Twee derde"
      body: "Van je vitamine D komt over een jaar uit zonlicht, als je een lichte huid hebt en vaak buiten bent. Eén derde uit eten."
    de:
      title: "Zwei Drittel"
      body: "Deines Vitamin D kommen übers Jahr aus Sonne, bei heller Haut und viel draußen. Ein Drittel aus Essen."
    es:
      title: "Dos tercios"
      body: "De tu vitamina D vienen del sol en un año, si tienes piel clara y sales a menudo. Un tercio de la comida."
    fr:
      title: "Deux tiers"
      body: "De ta vitamine D viennent du soleil sur l'année, peau claire et souvent dehors. Un tiers de l'alimentation."
    pt:
      title: "Dois terços"
      body: "Da tua vitamina D vêm do sol ao longo do ano, se tens pele clara e estás muito fora. Um terço da comida."
    tr:
      title: "Üçte iki"
      body: "Açık tenliysen ve sık dışarıdaysan yıllık D vitamininin bu kadarı güneşten gelir. Üçte biri yemekten."

  - key: wie-een-supplement
    kind: fact
    en:
      title: "Darker skin"
      body: "Or rarely outside by day, or face covered? Dutch advice: 10 microgram a day from age 4 to 69."
    nl:
      title: "Donkere huid"
      body: "Of overdag zelden buiten, of gezicht bedekt? Advies: 10 microgram per dag van 4 tot 69 jaar."
    de:
      title: "Dunklere Haut"
      body: "Oder tagsüber selten draußen, Gesicht bedeckt? Niederländischer Rat: 10 Mikrogramm täglich von 4 bis 69."
    es:
      title: "Piel más oscura"
      body: "¿O casi nunca fuera de día, o cara cubierta? Consejo neerlandés: 10 microgramos al día de 4 a 69 años."
    fr:
      title: "Peau plus foncée"
      body: "Ou rarement dehors le jour, visage couvert ? Conseil néerlandais : 10 microgrammes par jour de 4 à 69 ans."
    pt:
      title: "Pele mais escura"
      body: "Ou raramente fora de dia, cara tapada? Conselho neerlandês: 10 microgramas por dia dos 4 aos 69."
    tr:
      title: "Koyu ten"
      body: "Ya da gündüz nadiren dışarıda ya da yüzün kapalıysa? Hollanda önerisi: 4-69 yaş günde 10 mikrogram."

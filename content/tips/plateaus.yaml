article: plateaus
emoji: "⛰️"
tips:
  - key: twee-soorten
    kind: fact
    en:
      title: "Two plateaus"
      body: "Lifts stop going up, or the scale stops going down. Same name, different causes, so different fixes."
    nl:
      title: "Twee plateaus"
      body: "Je gewichten stijgen niet meer, of de weegschaal zakt niet meer. Zelfde naam, andere oorzaken, andere oplossing."
    de:
      title: "Zwei Plateaus"
      body: "Die Gewichte steigen nicht mehr oder die Waage sinkt nicht. Gleicher Name, andere Ursachen, andere Lösungen."
    es:
      title: "Dos estancamientos"
      body: "Los pesos no suben o la báscula no baja. Mismo nombre, causas distintas, soluciones distintas."
    fr:
      title: "Deux plateaux"
      body: "Tes charges ne montent plus, ou la balance ne baisse plus. Même nom, causes différentes, solutions aussi."
    pt:
      title: "Dois planaltos"
      body: "Os pesos não sobem ou a balança não desce. Mesmo nome, causas diferentes, soluções diferentes."
    tr:
      title: "İki tür plato"
      body: "Ağırlıkların artmıyor ya da tartı düşmüyor. Aynı isim, farklı sebep, farklı çözüm."

  - key: een-klein-beetje
    kind: fact
    en:
      title: "Slightly more"
      body: "To keep progressing, the stimulus likely has to rise over time: a bit more weight, a rep or a set."
    nl:
      title: "Een klein beetje meer"
      body: "Om vooruit te blijven gaan moet de prikkel waarschijnlijk stijgen: iets meer gewicht, een herhaling of een set."
    de:
      title: "Ein bisschen mehr"
      body: "Für weiteren Fortschritt muss der Reiz wohl steigen: etwas mehr Gewicht, eine Wiederholung oder ein Satz."
    es:
      title: "Un poco más"
      body: "Para seguir avanzando, el estímulo seguramente debe subir: algo más de peso, una repetición o una serie."
    fr:
      title: "Un peu plus"
      body: "Pour progresser encore, le stimulus doit sans doute monter : un peu plus de poids, une rep ou une série."
    pt:
      title: "Um pouco mais"
      body: "Para continuar a progredir, o estímulo deve subir: um pouco mais de peso, uma repetição ou uma série."
    tr:
      title: "Biraz daha"
      body: "İlerlemek için uyaranın zamanla artması gerekir: biraz daha ağırlık, bir tekrar ya da bir set."

  - key: maand-vergelijken
    kind: fact
    en:
      title: "Last month"
      body: "Lift stuck? Compare weight, reps and sets with the month before. If none went up, start there."
    nl:
      title: "Vorige maand"
      body: "Zit een oefening vast? Vergelijk gewicht, herhalingen en sets met de maand ervoor. Steeg niets, begin daar."
    de:
      title: "Letzter Monat"
      body: "Hängt eine Übung? Vergleich Gewicht, Wdh. und Sätze mit dem Vormonat. Stieg nichts, fang da an."
    es:
      title: "El mes pasado"
      body: "¿Ejercicio estancado? Compara peso, repeticiones y series con el mes anterior. Si nada subió, empieza ahí."
    fr:
      title: "Le mois dernier"
      body: "Exercice bloqué ? Compare charge, reps et séries au mois d'avant. Si rien n'a monté, commence là."
    pt:
      title: "O mês passado"
      body: "Exercício parado? Compara peso, repetições e séries com o mês anterior. Se nada subiu, começa aí."
    tr:
      title: "Geçen ay"
      body: "Bir hareket mi takıldı? Ağırlık, tekrar ve seti önceki ayla kıyasla. Hiçbiri artmadıysa oradan başla."

  - key: een-ding-tegelijk
    kind: fact
    en:
      title: "One change"
      body: "Change your programme, food and sleep in the same week and you won't know what worked."
    nl:
      title: "Eén verandering"
      body: "Pas je schema, eten en slaap in dezelfde week aan en je weet niet wat werkte."
    de:
      title: "Eine Änderung"
      body: "Änderst du Plan, Essen und Schlaf in derselben Woche, weißt du nicht, was gewirkt hat."
    es:
      title: "Un cambio"
      body: "Cambia programa, comida y sueño la misma semana y no sabrás qué funcionó."
    fr:
      title: "Un changement"
      body: "Change programme, repas et sommeil la même semaine et tu ne sauras pas ce qui a marché."
    pt:
      title: "Uma mudança"
      body: "Muda o plano, a comida e o sono na mesma semana e não vais saber o que resultou."
    tr:
      title: "Tek değişiklik"
      body: "Programı, beslenmeyi ve uykuyu aynı hafta değiştirirsen neyin işe yaradığını bilemezsin."

  - key: variatie-is-gepland
    kind: myth
    en:
      title: "Programme hopping"
      body: "Myth: hopping programmes is variation. Variation is a planned change over time. Swapping often is something else."
    nl:
      title: "Schema-hoppen"
      body: "Mythe: steeds van schema wisselen is variatie. Variatie is een geplande verandering. Vaak wisselen is iets anders."
    de:
      title: "Plan-Hopping"
      body: "Mythos: Ständig den Plan wechseln ist Variation. Variation ist geplant. Häufiges Wechseln ist etwas anderes."
    es:
      title: "Saltar de rutina"
      body: "Mito: cambiar de rutina a menudo es variación. La variación es un cambio planeado. Saltar es otra cosa."
    fr:
      title: "Changer sans cesse"
      body: "Mythe : changer souvent de programme, c'est varier. La variation est planifiée. Zapper, c'est autre chose."
    pt:
      title: "Saltar de plano"
      body: "Mito: mudar de plano a toda a hora é variação. Variação é uma mudança planeada. Saltar é outra coisa."
    tr:
      title: "Program atlamak"
      body: "Efsane: sık program değiştirmek çeşitliliktir. Çeşitlilik planlı değişimdir. Sürekli değiştirmek başka şey."

  - key: zes-maanden
    kind: fact
    en:
      title: "6 months"
      body: "That's when most weight is lost in lifestyle programmes. After that, a plateau and slow regain are common."
    nl:
      title: "6 maanden"
      body: "Rond dat punt is in leefstijlprogramma's het meeste gewicht eraf. Daarna volgen vaak een plateau en langzaam aankomen."
    de:
      title: "6 Monate"
      body: "Bis dahin geht in Lebensstilprogrammen das meiste Gewicht runter. Danach kommen oft Plateau und langsame Zunahme."
    es:
      title: "6 meses"
      body: "Es cuando más peso se pierde en programas de estilo de vida. Luego son comunes el estancamiento y recuperar peso."
    fr:
      title: "6 mois"
      body: "C'est là que l'essentiel du poids part dans les programmes d'hygiène de vie. Ensuite, plateau et reprise lente."
    pt:
      title: "6 meses"
      body: "É quando se perde mais peso em programas de estilo de vida. Depois são comuns o planalto e voltar a ganhar."
    tr:
      title: "6 ay"
      body: "Yaşam tarzı programlarında kiloların çoğu bu sürede verilir. Sonra plato ve yavaş geri alım yaygındır."

  - key: inname-sluipt-omhoog
    kind: fact
    en:
      title: "6 to 8 months"
      body: "A plateau that early more likely means intake crept up, researchers think. Weight levels off only after years."
    nl:
      title: "6 tot 8 maanden"
      body: "Een plateau zo vroeg betekent eerder dat je weer meer bent gaan eten, denken onderzoekers."
    de:
      title: "6 bis 8 Monate"
      body: "Ein Plateau so früh heißt eher, dass wieder mehr gegessen wird, glauben Forscher. Das Gewicht pendelt erst nach Jahren."
    es:
      title: "6 a 8 meses"
      body: "Un estancamiento tan pronto indica más bien que comes más, creen los investigadores."
    fr:
      title: "6 à 8 mois"
      body: "Un plateau si tôt signifie plutôt que tu manges de nouveau plus, pensent des chercheurs."
    pt:
      title: "6 a 8 meses"
      body: "Um planalto tão cedo quer dizer mais provavelmente que voltaste a comer mais, pensam investigadores."
    tr:
      title: "6-8 ay"
      body: "Araştırmacılara göre bu kadar erken plato büyük olasılıkla yine daha çok yemekten. Kilo yıllar sonra sabitlenir."

  - key: kapot-metabolisme
    kind: myth
    en:
      title: "Broken metabolism"
      body: "Myth: a plateau means a broken metabolism. Not proven. The research can't say what's behind yours."
    nl:
      title: "Kapotte stofwisseling"
      body: "Mythe: een plateau betekent een kapotte stofwisseling. Niet bewezen. Wat er bij jou speelt, zegt het onderzoek niet."
    de:
      title: "Kaputter Stoffwechsel"
      body: "Mythos: Ein Plateau heißt kaputter Stoffwechsel. Nicht belegt. Was bei dir dahintersteckt, sagt die Forschung nicht."
    es:
      title: "Metabolismo roto"
      body: "Mito: estancarse es tener el metabolismo roto. No está probado. La investigación no sabe qué pasa en tu caso."
    fr:
      title: "Métabolisme cassé"
      body: "Mythe : un plateau veut dire métabolisme cassé. Pas prouvé. La recherche ne sait pas ce qui joue chez toi."
    pt:
      title: "Metabolismo estragado"
      body: "Mito: um planalto é metabolismo estragado. Não está provado. A investigação não sabe o que se passa contigo."
    tr:
      title: "Bozuk metabolizma"
      body: "Efsane: plato bozuk metabolizma demek. Kanıtlanmadı. Senin durumunda ne olduğunu araştırma söyleyemez."

  - key: plateau-als-rustpunt
    kind: fact
    en:
      title: "A rest stop"
      body: "A plateau at a lower weight can be a good place to stay for a while. Pushing on means a bigger gap again."
    nl:
      title: "Een rustpunt"
      body: "Een plateau op een lager gewicht kan een prima plek zijn om even te blijven. Doorduwen betekent weer een groter tekort."
    de:
      title: "Ein Rastplatz"
      body: "Ein Plateau bei niedrigerem Gewicht kann ein guter Ort zum Bleiben sein. Weitermachen heißt wieder mehr Defizit."
    es:
      title: "Un descanso"
      body: "Estancarse en un peso menor puede ser buen sitio para quedarse un tiempo. Seguir implica más déficit."
    fr:
      title: "Une pause"
      body: "Un plateau à un poids plus bas peut être un bon endroit où rester un moment. Continuer demande plus de déficit."
    pt:
      title: "Uma paragem"
      body: "Um planalto num peso mais baixo pode ser um bom sítio para ficar. Continuar exige mais défice."
    tr:
      title: "Bir mola"
      body: "Daha düşük kiloda plato bir süre kalmak için iyi bir yer olabilir. Devam etmek yine daha büyük açık demek."

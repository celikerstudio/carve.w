article: metabolism
emoji: "⚙️"
tips:
  - key: kosten-van-verteren
    kind: fact
    en:
      title: "20 to 30%"
      body: "Of protein's calories go into digesting it. For carbs it's 5 to 10%, for fat only 0 to 3%."
    nl:
      title: "20 tot 30%"
      body: "Van de calorieën uit eiwit gaat op aan het verteren. Bij koolhydraten 5 tot 10%, bij vet maar 0 tot 3%."
    de:
      title: "20 bis 30 %"
      body: "Der Kalorien aus Protein gehen für die Verdauung drauf. Bei Kohlenhydraten 5 bis 10 %, bei Fett 0 bis 3 %."
    es:
      title: "20 a 30 %"
      body: "De las calorías de la proteína se van en digerirla. En hidratos es un 5 a 10 %, en grasa solo 0 a 3 %."
    fr:
      title: "20 à 30 %"
      body: "Des calories des protéines partent dans la digestion. Pour les glucides 5 à 10 %, pour le gras 0 à 3 %."
    pt:
      title: "20 a 30%"
      body: "Das calorias da proteína vão para a digestão. Nos hidratos 5 a 10%, na gordura só 0 a 3%."
    tr:
      title: "%20-30"
      body: "Proteinin kalorisi sindirimine gider. Karbonhidratta %5-10, yağda sadece %0-3."

  - key: vaker-eten
    kind: myth
    en:
      title: "1 to 7 meals"
      body: "Myth: eating often speeds up your metabolism. The same calories over 1 to 7 meals gave no higher burn."
    nl:
      title: "1 tot 7 maaltijden"
      body: "Mythe: vaak eten versnelt je stofwisseling. Dezelfde calorieën over 1 tot 7 maaltijden gaven geen hogere verbranding."
    de:
      title: "1 bis 7 Mahlzeiten"
      body: "Mythos: Oft essen beschleunigt den Stoffwechsel. Gleiche Kalorien auf 1 bis 7 Mahlzeiten: kein höherer Verbrauch."
    es:
      title: "1 a 7 comidas"
      body: "Mito: comer a menudo acelera el metabolismo. Las mismas calorías en 1 a 7 comidas no subieron el gasto."
    fr:
      title: "1 à 7 repas"
      body: "Mythe : manger souvent accélère le métabolisme. Mêmes calories sur 1 à 7 repas : pas plus de dépense."
    pt:
      title: "1 a 7 refeições"
      body: "Mito: comer muitas vezes acelera o metabolismo. As mesmas calorias em 1 a 7 refeições não subiram o gasto."
    tr:
      title: "1-7 öğün"
      body: "Efsane: sık yemek metabolizmayı hızlandırır. Aynı kalori 1-7 öğüne bölününce yakım artmadı."

  - key: leeftijd
    kind: myth
    en:
      title: "20 to 60"
      body: "Myth: your metabolism slows in your 30s. Adjusted for lean mass, your daily burn is stable from 20 to 60."
    nl:
      title: "20 tot 60"
      body: "Mythe: je stofwisseling vertraagt in je dertiger jaren. Gecorrigeerd voor spiermassa blijft die stabiel van 20 tot 60."
    de:
      title: "20 bis 60"
      body: "Mythos: Mit 30 wird der Stoffwechsel langsamer. Bereinigt um Muskelmasse bleibt er von 20 bis 60 stabil."
    es:
      title: "20 a 60"
      body: "Mito: el metabolismo baja a los 30. Ajustado por masa magra, tu gasto diario es estable de 20 a 60 años."
    fr:
      title: "20 à 60 ans"
      body: "Mythe : le métabolisme ralentit dès 30 ans. Corrigé pour la masse maigre, il reste stable de 20 à 60 ans."
    pt:
      title: "20 a 60"
      body: "Mito: o metabolismo abranda aos 30. Ajustado à massa magra, o gasto diário é estável dos 20 aos 60."
    tr:
      title: "20-60"
      body: "Efsane: metabolizma 30'larda yavaşlar. Yağsız kütleye göre düzeltilince 20-60 yaş arası sabit kalır."

  - key: kapotte-stofwisseling
    kind: myth
    en:
      title: "Broken"
      body: "Myth: dieting breaks your metabolism. You burn less after, but the extra slowdown was small or gone at a stable weight."
    nl:
      title: "Kapot"
      body: "Mythe: lijnen sloopt je stofwisseling. Daarna verbrand je minder, maar de extra daling was klein of verdween weer."
    de:
      title: "Kaputt"
      body: "Mythos: Diäten machen den Stoffwechsel kaputt. Danach verbrennst du weniger, das Extra-Minus war klein oder weg."
    es:
      title: "Roto"
      body: "Mito: la dieta te rompe el metabolismo. Luego quemas menos, pero el frenazo extra fue pequeño o desapareció."
    fr:
      title: "Cassé"
      body: "Mythe : les régimes cassent le métabolisme. Tu brûles moins après, mais la baisse en plus était faible ou disparue."
    pt:
      title: "Estragado"
      body: "Mito: a dieta estraga o metabolismo. Depois gastas menos, mas a travagem extra foi pequena ou desapareceu."
    tr:
      title: "Bozuk"
      body: "Efsane: diyet metabolizmayı bozar. Sonra daha az yakarsın ama ek yavaşlama küçüktü ya da kilo sabitlenince kayboldu."

  - key: kleiner-lichaam
    kind: fact
    en:
      title: "Lighter body"
      body: "It costs less energy to run, the main reason you burn less after a diet. Recalculate your needs."
    nl:
      title: "Lichter lijf"
      body: "Kost minder energie, de hoofdreden dat je na een dieet minder verbrandt. Reken je behoefte opnieuw uit."
    de:
      title: "Leichterer Körper"
      body: "Braucht weniger Energie, der Hauptgrund für weniger Verbrauch nach der Diät. Rechne deinen Bedarf neu."
    es:
      title: "Cuerpo más ligero"
      body: "Gasta menos energía: es la razón principal de quemar menos tras una dieta. Recalcula lo que necesitas."
    fr:
      title: "Corps plus léger"
      body: "Il coûte moins d'énergie, la raison principale de la baisse après un régime. Recalcule tes besoins."
    pt:
      title: "Corpo mais leve"
      body: "Gasta menos energia, a principal razão de gastares menos após uma dieta. Recalcula as necessidades."
    tr:
      title: "Daha hafif beden"
      body: "Daha az enerji harcar, diyetten sonra daha az yakmanın asıl sebebi bu. İhtiyacını yeniden hesapla."

  - key: eerst-tellen
    kind: fact
    en:
      title: "1,200 kcal"
      body: "Dieters who said they ate under that had a normal metabolism. They underreported their food by 47%."
    nl:
      title: "1.200 kcal"
      body: "Lijners die zeiden dat ze minder aten, hadden een normale stofwisseling. Ze gaven 47% te weinig op."
    de:
      title: "1.200 kcal"
      body: "Wer angab, weniger zu essen, hatte einen normalen Stoffwechsel. Angegeben wurden 47 % zu wenig."
    es:
      title: "1.200 kcal"
      body: "Quienes decían comer menos tenían un metabolismo normal. Declaraban un 47 % menos de lo que comían."
    fr:
      title: "1 200 kcal"
      body: "Ceux qui disaient manger moins avaient un métabolisme normal. Ils sous-estimaient leur assiette de 47 %."
    pt:
      title: "1.200 kcal"
      body: "Quem dizia comer menos tinha um metabolismo normal. Declarava 47% menos do que comia."
    tr:
      title: "1.200 kcal"
      body: "Bundan az yediğini söyleyenlerin metabolizması normaldi. Yediklerini %47 eksik bildiriyorlardı."

  - key: neat
    kind: fact
    en:
      title: "Fidgeting"
      body: "Everyday movement differs a lot between people. In an overfeeding study, it was closely linked to fat gain."
    nl:
      title: "Friemelen"
      body: "Dagelijkse beweging verschilt enorm per persoon. In een overvoedingsstudie hing die sterk samen met vetwinst."
    de:
      title: "Zappeln"
      body: "Alltagsbewegung ist sehr verschieden. In einer Überfütterungsstudie hing sie eng mit Fettzunahme zusammen."
    es:
      title: "Moverse inquieto"
      body: "El movimiento diario varía mucho entre personas. En un estudio de sobrealimentación iba muy ligado a la grasa ganada."
    fr:
      title: "Gigoter"
      body: "Le mouvement quotidien varie énormément. Dans une étude de suralimentation, il était lié de près au gras pris."
    pt:
      title: "Mexer-se"
      body: "O movimento diário varia muito entre pessoas. Num estudo de excesso alimentar, ligou-se muito à gordura ganha."
    tr:
      title: "Kıpırdanmak"
      body: "Günlük hareket kişiden kişiye çok değişir. Bir aşırı beslenme çalışmasında yağ artışıyla yakından ilişkiliydi."

  - key: biggest-loser
    kind: fact
    en:
      title: "500 kcal"
      body: "Less a day at rest than predicted, for 14 Biggest Loser contestants six years on. Extreme loss, not typical."
    nl:
      title: "500 kcal"
      body: "Minder in rust dan voorspeld, bij 14 deelnemers van The Biggest Loser zes jaar later. Extreem verlies, niet typisch."
    de:
      title: "500 kcal"
      body: "Weniger in Ruhe als vorhergesagt, bei 14 Biggest-Loser-Teilnehmern sechs Jahre später. Extrem, nicht typisch."
    es:
      title: "500 kcal"
      body: "Menos al día en reposo de lo previsto, en 14 concursantes de The Biggest Loser seis años después. No es típico."
    fr:
      title: "500 kcal"
      body: "De moins au repos que prévu chez 14 candidats de The Biggest Loser, six ans après. Perte extrême, pas typique."
    pt:
      title: "500 kcal"
      body: "A menos por dia em repouso do que o previsto, em 14 concorrentes do Biggest Loser seis anos depois. Não é típico."
    tr:
      title: "500 kcal"
      body: "Biggest Loser'ın 14 yarışmacısı altı yıl sonra dinlenirken beklenenden bu kadar az yaktı. Aşırı kayıp, tipik değil."

  - key: tillen-tijdens-dieet
    kind: fact
    en:
      title: "Lift on a cut"
      body: "Dieting women who lifted kept their fat-free mass and resting burn. Cardio or no exercise lost both."
    nl:
      title: "Til tijdens een cut"
      body: "Lijnende vrouwen die krachttraining deden hielden vetvrije massa en rustverbranding. Met cardio of niets daalde beide."
    de:
      title: "Heben in der Diät"
      body: "Frauen mit Krafttraining in der Diät hielten fettfreie Masse und Ruheumsatz. Mit Cardio oder nichts sank beides."
    es:
      title: "Pesas al definir"
      body: "Mujeres a dieta que hacían pesas mantuvieron masa magra y gasto en reposo. Con cardio o nada, perdieron ambos."
    fr:
      title: "Muscu en sèche"
      body: "Des femmes au régime faisant de la muscu ont gardé masse maigre et dépense au repos. Cardio ou rien : les deux baissent."
    pt:
      title: "Força no cut"
      body: "Mulheres em dieta que treinavam força mantiveram massa magra e gasto em repouso. Com cardio ou nada, perderam ambos."
    tr:
      title: "Cut'ta ağırlık"
      body: "Diyette ağırlık çalışan kadınlar yağsız kütle ve dinlenme yakımını korudu. Kardiyo yapan ya da hiç çalışmayan kaybetti."

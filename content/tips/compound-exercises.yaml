article: compound-exercises
emoji: "🦵"
tips:
  - key: wat-eerst
    kind: fact
    en:
      title: "First lift"
      body: "Strength rose most in what came first in a session. Start with the lift you most want to get stronger at."
    nl:
      title: "Eerste oefening"
      body: "Kracht steeg het meest in wat vooraan in de training stond. Begin met de oefening waarin je het sterkst wilt worden."
    de:
      title: "Erste Übung"
      body: "Kraft stieg am meisten bei dem, was zuerst kam. Fang mit der Übung an, in der du am stärksten werden willst."
    es:
      title: "Primer ejercicio"
      body: "La fuerza subió más en lo que iba primero. Empieza por el ejercicio en el que más quieras mejorar."
    fr:
      title: "Premier exercice"
      body: "La force a le plus monté sur ce qui venait en premier. Commence par l'exercice où tu veux le plus progresser."
    pt:
      title: "Primeiro exercício"
      body: "A força subiu mais no que vinha primeiro. Começa pelo exercício em que mais queres ficar forte."
    tr:
      title: "İlk hareket"
      body: "Güç en çok antrenmanın başındaki harekette arttı. En çok güçlenmek istediğin hareketle başla."

  - key: volgorde-spiergroei
    kind: myth
    en:
      title: "Order"
      body: "Myth: compound lifts must come first for growth. For muscle size, order made no difference. For strength it did."
    nl:
      title: "Volgorde"
      body: "Mythe: samengestelde oefeningen moeten eerst voor groei. Voor spiermassa maakte volgorde niets uit, voor kracht wel."
    de:
      title: "Reihenfolge"
      body: "Mythos: Grundübungen müssen für Wachstum zuerst kommen. Für Muskelmasse egal, für Kraft nicht."
    es:
      title: "El orden"
      body: "Mito: los compuestos van primero para crecer. Para el músculo el orden no cambió nada. Para la fuerza sí."
    fr:
      title: "L'ordre"
      body: "Mythe : les polyarticulaires d'abord pour grossir. Pour le muscle, l'ordre n'a rien changé. Pour la force, si."
    pt:
      title: "A ordem"
      body: "Mito: os compostos têm de vir primeiro para crescer. Para o músculo a ordem não importou. Para a força sim."
    tr:
      title: "Sıra"
      body: "Efsane: büyümek için bileşik hareketler önce gelmeli. Kas için sıra fark etmedi. Güç için etti."

  - key: isolatie-ook-eerst
    kind: fact
    en:
      title: "11 studies"
      body: "Even isolation exercises gained more strength when done first. What you do early improves most."
    nl:
      title: "11 studies"
      body: "Ook isolatie-oefeningen werden sterker als ze eerst kwamen. Wat je vroeg doet, gaat het hardst vooruit."
    de:
      title: "11 Studien"
      body: "Auch Isolationsübungen legten mehr Kraft zu, wenn sie zuerst kamen. Was früh kommt, wird am besten."
    es:
      title: "11 estudios"
      body: "Hasta los ejercicios de aislamiento ganaron más fuerza al ir primero. Lo que haces antes mejora más."
    fr:
      title: "11 études"
      body: "Même les exercices d'isolation ont gagné plus de force en premier. Ce que tu fais tôt progresse le plus."
    pt:
      title: "11 estudos"
      body: "Até os exercícios de isolamento ganharam mais força quando vinham primeiro. O que fazes cedo melhora mais."
    tr:
      title: "11 çalışma"
      body: "İzolasyon hareketleri bile önce yapılınca daha çok güçlendi. Erken yaptığın şey en çok gelişir."

  - key: isolatie-nutteloos
    kind: myth
    en:
      title: "Useless"
      body: "Myth: isolation exercises are useless. In a small meta-analysis they grew arms and legs as much as compound lifts."
    nl:
      title: "Nutteloos"
      body: "Mythe: isolatie is nutteloos. In een kleine meta-analyse groeiden armen en benen er even hard van als van compound."
    de:
      title: "Nutzlos"
      body: "Mythos: Isolationsübungen sind nutzlos. In einer kleinen Metaanalyse wuchsen Arme und Beine wie mit Grundübungen."
    es:
      title: "Inútiles"
      body: "Mito: los ejercicios de aislamiento no sirven. En un metaanálisis pequeño, brazos y piernas crecieron igual."
    fr:
      title: "Inutiles"
      body: "Mythe : l'isolation ne sert à rien. Dans une petite méta-analyse, bras et jambes ont grossi autant qu'en poly."
    pt:
      title: "Inúteis"
      body: "Mito: os exercícios de isolamento não servem. Numa meta-análise pequena, braços e pernas cresceram igual."
    tr:
      title: "İşe yaramaz"
      body: "Efsane: izolasyon hareketleri boşunadır. Küçük bir meta-analizde kol ve bacaklar bileşik kadar büyüdü."

  - key: pulldown-biceps
    kind: fact
    en:
      title: "10 weeks"
      body: "Of lat pulldowns grew the biceps about as much as curls did, in untrained young men."
    nl:
      title: "10 weken"
      body: "Lat pulldowns lieten de biceps ongeveer even hard groeien als curls, bij ongetrainde jonge mannen."
    de:
      title: "10 Wochen"
      body: "Latziehen ließen den Bizeps etwa so wachsen wie Curls, bei untrainierten jungen Männern."
    es:
      title: "10 semanas"
      body: "De jalón al pecho hicieron crecer el bíceps casi como los curls, en jóvenes sin experiencia."
    fr:
      title: "10 semaines"
      body: "De tirage vertical ont fait grossir les biceps presque autant que des curls, chez des jeunes débutants."
    pt:
      title: "10 semanas"
      body: "De puxada fizeram crescer o bíceps quase tanto como roscas, em jovens sem treino."
    tr:
      title: "10 hafta"
      body: "Lat pulldown, antrenmansız genç erkeklerde pazıyı curl kadar büyüttü."

  - key: tijdwinst
    kind: fact
    en:
      title: "One squat"
      body: "Trains thighs and glutes in one go. Isolation exercises need several moves for the same muscles."
    nl:
      title: "Eén squat"
      body: "Traint dijen en billen in één beweging. Met isolatie-oefeningen heb je er meerdere nodig."
    de:
      title: "Eine Kniebeuge"
      body: "Trainiert Oberschenkel und Po in einem Zug. Mit Isolation brauchst du dafür mehrere Übungen."
    es:
      title: "Una sentadilla"
      body: "Trabaja muslos y glúteos de una vez. Con aislamiento necesitas varios ejercicios para lo mismo."
    fr:
      title: "Un squat"
      body: "Travaille cuisses et fessiers d'un coup. En isolation, il faut plusieurs exercices pour ça."
    pt:
      title: "Um agachamento"
      body: "Treina coxas e glúteos de uma vez. Com isolamento precisas de vários exercícios para o mesmo."
    tr:
      title: "Bir squat"
      body: "Uyluk ve kalçayı tek harekette çalıştırır. İzolasyonla aynı kaslar için birkaç hareket gerekir."

  - key: voetbalproef
    kind: fact
    en:
      title: "8 weeks"
      body: "Compound-only training raised strength and aerobic fitness more than isolation-only, in young soccer players."
    nl:
      title: "8 weken"
      body: "Alleen samengestelde oefeningen gaven jonge voetballers meer kracht en conditie dan alleen isolatie."
    de:
      title: "8 Wochen"
      body: "Nur Grundübungen brachten jungen Fußballern mehr Kraft und Ausdauer als nur Isolation."
    es:
      title: "8 semanas"
      body: "Solo ejercicios compuestos dieron a jóvenes futbolistas más fuerza y fondo que solo aislamiento."
    fr:
      title: "8 semaines"
      body: "Que du polyarticulaire a donné à de jeunes footballeurs plus de force et de cardio que l'isolation seule."
    pt:
      title: "8 semanas"
      body: "Só exercícios compostos deram a jovens futebolistas mais força e fôlego do que só isolamento."
    tr:
      title: "8 hafta"
      body: "Genç futbolcularda sadece bileşik hareketler, sadece izolasyondan daha çok güç ve kondisyon kazandırdı."

  - key: waar-isolatie-helpt
    kind: fact
    en:
      title: "Lower back"
      body: "Isolation work may help your lower back muscles and fix imbalances between muscles, a review found."
    nl:
      title: "Onderrug"
      body: "Isolatiewerk helpt mogelijk je onderrugspieren en het rechttrekken van verschillen tussen spieren."
    de:
      title: "Unterer Rücken"
      body: "Isolationsarbeit hilft womöglich dem unteren Rücken und beim Ausgleich von Dysbalancen."
    es:
      title: "Zona lumbar"
      body: "El aislamiento puede ayudar a tus lumbares y a corregir desequilibrios entre músculos."
    fr:
      title: "Bas du dos"
      body: "L'isolation peut aider tes lombaires et corriger les déséquilibres entre muscles."
    pt:
      title: "Lombar"
      body: "O isolamento pode ajudar a lombar e corrigir desequilíbrios entre músculos."
    tr:
      title: "Bel"
      body: "Bir derlemeye göre izolasyon bel kaslarına ve kaslar arası dengesizliği gidermeye yardım edebilir."

  - key: curls-erbovenop
    kind: myth
    en:
      title: "Extra curls"
      body: "Myth: you need curls on top of pulldowns. A review found no extra arm growth from adding isolation work."
    nl:
      title: "Extra curls"
      body: "Mythe: je hebt curls nodig naast pulldowns. Een review vond geen extra armgroei door isolatiewerk toe te voegen."
    de:
      title: "Extra Curls"
      body: "Mythos: Du brauchst Curls zusätzlich zum Latziehen. Eine Übersicht fand dadurch kein extra Armwachstum."
    es:
      title: "Curls extra"
      body: "Mito: necesitas curls además del jalón. Una revisión no vio más crecimiento del brazo al añadirlos."
    fr:
      title: "Curls en plus"
      body: "Mythe : il faut des curls en plus du tirage. Une revue n'a vu aucun gain de bras en plus avec l'isolation."
    pt:
      title: "Roscas a mais"
      body: "Mito: precisas de roscas além da puxada. Uma revisão não viu crescimento extra do braço ao juntá-las."
    tr:
      title: "Ekstra curl"
      body: "Efsane: pulldown'a ek curl şart. Bir derleme izolasyon eklemenin kolu daha çok büyütmediğini buldu."

  - key: licht-leren
    kind: fact
    en:
      title: "Start light"
      body: "Compound lifts carry the most weight. Learn the movement light first, and don't rush it with poor form."
    nl:
      title: "Begin licht"
      body: "Bij samengestelde oefeningen gaat het meeste gewicht op de stang. Leer de beweging eerst licht."
    de:
      title: "Leicht anfangen"
      body: "Bei Grundübungen liegt das meiste Gewicht auf der Stange. Lern die Bewegung erst leicht, ohne Hast."
    es:
      title: "Empieza ligero"
      body: "Los compuestos llevan más peso. Aprende el movimiento con poco y no corras con mala técnica."
    fr:
      title: "Commence léger"
      body: "Les polyarticulaires chargent le plus la barre. Apprends le geste léger, sans te presser."
    pt:
      title: "Começa leve"
      body: "Os compostos levam mais peso. Aprende o movimento com pouco e não te apresses com má técnica."
    tr:
      title: "Hafif başla"
      body: "Bileşik hareketler barı en çok yükler. Hareketi önce hafifle öğren, kötü formla acele etme."

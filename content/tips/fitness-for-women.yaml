article: fitness-for-women
emoji: "🏋️"
tips:
  - key: kracht-en-spier
    kind: fact
    en:
      title: "24 studies"
      body: "In women, lifting gave large strength gains and a medium gain in muscle size, in a meta-analysis."
    nl:
      title: "24 studies"
      body: "Bij vrouwen gaf krachttraining veel meer kracht en een middelgrote groei in spiermassa, in een meta-analyse."
    de:
      title: "24 Studien"
      body: "Bei Frauen brachte Krafttraining laut Metaanalyse große Kraftzuwächse und mittleres Muskelwachstum."
    es:
      title: "24 estudios"
      body: "En mujeres, las pesas dieron grandes mejoras de fuerza y un aumento medio de músculo, en un metaanálisis."
    fr:
      title: "24 études"
      body: "Chez les femmes, la muscu a donné de gros gains de force et un gain moyen de muscle, selon une méta-analyse."
    pt:
      title: "24 estudos"
      body: "Em mulheres, o treino de força deu grandes ganhos de força e um ganho médio de músculo, numa meta-análise."
    tr:
      title: "24 çalışma"
      body: "Bir meta-analizde kadınlarda ağırlık antrenmanı büyük güç ve orta düzeyde kas artışı sağladı."

  - key: frequentie-en-volume
    kind: fact
    en:
      title: "How often"
      body: "And how much women trained seemed to matter for strength. Nothing tested clearly mattered for size."
    nl:
      title: "Hoe vaak"
      body: "En hoeveel vrouwen trainden leek te tellen voor kracht. Voor spiergroei maakte niets getests duidelijk uit."
    de:
      title: "Wie oft"
      body: "Und wie viel Frauen trainierten, schien für Kraft zu zählen. Für Muskelwachstum zählte nichts klar."
    es:
      title: "Cuántas veces"
      body: "Y cuánto entrenaban las mujeres parecía contar para la fuerza. Para el músculo, nada claro."
    fr:
      title: "Combien de fois"
      body: "Et combien les femmes s'entraînaient semblait compter pour la force. Pour le muscle, rien de net."
    pt:
      title: "Quantas vezes"
      body: "E quanto as mulheres treinavam parecia contar para a força. Para o músculo, nada claro."
    tr:
      title: "Ne sıklıkla"
      body: "Kadınların ne sıklıkta ve ne kadar çalıştığı güç için önemli göründü. Kas için net bir şey çıkmadı."

  - key: trainen-op-cyclus
    kind: myth
    en:
      title: "Cycle phase"
      body: "Myth: train by your cycle phase. Results vary a lot and methods are poor. Too early to say it changes gains."
    nl:
      title: "Cyclusfase"
      body: "Mythe: train op je cyclusfase. Resultaten wisselen sterk en de methodes zijn zwak. Te vroeg voor conclusies."
    de:
      title: "Zyklusphase"
      body: "Mythos: Trainier nach deiner Zyklusphase. Die Ergebnisse schwanken stark, die Methoden sind schwach."
    es:
      title: "Fase del ciclo"
      body: "Mito: entrena según tu ciclo. Los resultados varían mucho y los métodos son flojos. Es pronto para decirlo."
    fr:
      title: "Phase du cycle"
      body: "Mythe : entraîne-toi selon ton cycle. Résultats très variables, méthodes faibles. Trop tôt pour conclure."
    pt:
      title: "Fase do ciclo"
      body: "Mito: treina segundo o teu ciclo. Os resultados variam muito e os métodos são fracos. É cedo para dizer."
    tr:
      title: "Döngü evresi"
      body: "Efsane: döngü evrene göre çalış. Sonuçlar çok değişken, yöntemler zayıf. Sonuç için henüz erken."

  - key: cyclus-bijhouden
    kind: fact
    en:
      title: "Track your cycle"
      body: "It helps you spot irregular periods and handle symptoms. Periods stopped or irregular? See your GP."
    nl:
      title: "Cyclus bijhouden"
      body: "Zo zie je onregelmatigheid en vang je klachten op. Stopt je menstruatie of wordt die onregelmatig? Naar de huisarts."
    de:
      title: "Zyklus notieren"
      body: "So erkennst du Unregelmäßigkeiten und Beschwerden. Bleibt die Periode aus oder ist unregelmäßig? Zum Arzt."
    es:
      title: "Apunta tu ciclo"
      body: "Te ayuda a ver reglas irregulares y llevar los síntomas. ¿Se te retira o es irregular? Ve al médico."
    fr:
      title: "Suis ton cycle"
      body: "Ça aide à repérer des règles irrégulières et gérer les symptômes. Règles absentes ou irrégulières ? Consulte."
    pt:
      title: "Regista o ciclo"
      body: "Ajuda a ver períodos irregulares e lidar com sintomas. O período parou ou é irregular? Vai ao médico."
    tr:
      title: "Döngünü izle"
      body: "Düzensizliği fark etmeni ve belirtilerle başa çıkmanı sağlar. Adet durduysa ya da düzensizse doktora git."

  - key: zwanger-kracht
    kind: myth
    en:
      title: "Pregnant"
      body: "Myth: stop lifting when pregnant. Without complications, WHO backs regular strength training. Ask your midwife."
    nl:
      title: "Zwanger"
      body: "Mythe: stop met krachttraining als je zwanger bent. Zonder complicaties steunt de WHO het. Overleg met je verloskundige."
    de:
      title: "Schwanger"
      body: "Mythos: In der Schwangerschaft kein Krafttraining. Ohne Komplikationen stützt die WHO es. Sprich mit deiner Hebamme."
    es:
      title: "Embarazada"
      body: "Mito: deja las pesas si estás embarazada. Sin complicaciones, la OMS apoya la fuerza regular. Consulta a tu matrona."
    fr:
      title: "Enceinte"
      body: "Mythe : arrête la muscu enceinte. Sans complication, l'OMS soutient un renforcement régulier. Vois ta sage-femme."
    pt:
      title: "Grávida"
      body: "Mito: deixa o treino de força na gravidez. Sem complicações, a OMS apoia-o. Fala com a tua parteira ou médico."
    tr:
      title: "Hamile"
      body: "Efsane: hamileyken ağırlığı bırak. Komplikasyon yoksa DSÖ düzenli kuvvet antrenmanını destekliyor. Ebene danış."

  - key: actief-voor-zwangerschap
    kind: fact
    en:
      title: "Already active"
      body: "Before pregnancy, even with hard cardio? You can keep going during and after, if nothing rules it out."
    nl:
      title: "Al actief"
      body: "Voor je zwangerschap, ook met zware cardio? Dan mag je tijdens en na doorgaan, als niets het verbiedt."
    de:
      title: "Schon aktiv"
      body: "Vor der Schwangerschaft, auch mit harter Ausdauer? Dann darfst du währenddessen und danach weitermachen."
    es:
      title: "Ya activa"
      body: "¿Antes del embarazo, incluso con cardio intenso? Puedes seguir durante y después, si nada lo impide."
    fr:
      title: "Déjà active"
      body: "Avant la grossesse, même avec du cardio intense ? Tu peux continuer pendant et après, sauf contre-indication."
    pt:
      title: "Já ativa"
      body: "Antes da gravidez, mesmo com cardio intenso? Podes continuar durante e depois, se nada o impedir."
    tr:
      title: "Zaten aktifsen"
      body: "Hamilelikten önce yoğun kardiyo dahil aktifsen, bir engel yoksa hamilelikte ve sonrasında devam edebilirsin."

  - key: niet-op-je-rug
    kind: fact
    en:
      title: "Off your back"
      body: "After the first trimester, WHO advises skipping exercises on your back, and high heat. Stay hydrated."
    nl:
      title: "Niet op je rug"
      body: "Na het eerste trimester raadt de WHO oefeningen op je rug af, net als hitte. Drink genoeg."
    de:
      title: "Nicht auf dem Rücken"
      body: "Nach dem ersten Trimester rät die WHO von Übungen in Rückenlage und großer Hitze ab. Trink genug."
    es:
      title: "Boca arriba no"
      body: "Tras el primer trimestre, la OMS desaconseja ejercicios boca arriba y el calor fuerte. Bebe agua."
    fr:
      title: "Pas sur le dos"
      body: "Après le premier trimestre, l'OMS déconseille les exercices sur le dos et la forte chaleur. Bois bien."
    pt:
      title: "De costas não"
      body: "Depois do primeiro trimestre, a OMS desaconselha exercícios de costas e calor forte. Bebe água."
    tr:
      title: "Sırtüstü değil"
      body: "DSÖ ilk üç aydan sonra sırtüstü egzersizleri ve aşırı sıcağı önermiyor. Bol su iç."

  - key: na-de-bevalling
    kind: fact
    en:
      title: "After the birth"
      body: "Build back up gradually. After a caesarean, do that with a healthcare provider, the WHO says."
    nl:
      title: "Na de bevalling"
      body: "Bouw geleidelijk weer op. Na een keizersnede doe je dat in overleg met een zorgverlener, zegt de WHO."
    de:
      title: "Nach der Geburt"
      body: "Steigere dich langsam wieder. Nach einem Kaiserschnitt in Absprache mit Fachleuten, sagt die WHO."
    es:
      title: "Tras el parto"
      body: "Vuelve poco a poco. Tras una cesárea, hazlo con un profesional sanitario, dice la OMS."
    fr:
      title: "Après l'accouchement"
      body: "Reprends progressivement. Après une césarienne, fais-le avec un soignant, dit l'OMS."
    pt:
      title: "Depois do parto"
      body: "Volta aos poucos. Depois de uma cesariana, fá-lo com um profissional de saúde, diz a OMS."
    tr:
      title: "Doğumdan sonra"
      body: "Yavaş yavaş geri dön. DSÖ'ye göre sezaryenden sonra bunu bir sağlık uzmanıyla yap."

  - key: bekkenbodem
    kind: fact
    en:
      title: "Pelvic floor"
      body: "Training it daily during and after pregnancy lowers the risk of urinary incontinence."
    nl:
      title: "Bekkenbodem"
      body: "Die dagelijks trainen tijdens en na je zwangerschap verlaagt de kans op urineverlies."
    de:
      title: "Beckenboden"
      body: "Ihn in und nach der Schwangerschaft täglich zu trainieren senkt das Risiko für Inkontinenz."
    es:
      title: "Suelo pélvico"
      body: "Entrenarlo a diario en el embarazo y después baja el riesgo de pérdidas de orina."
    fr:
      title: "Périnée"
      body: "Le muscler chaque jour pendant et après la grossesse réduit le risque de fuites urinaires."
    pt:
      title: "Pavimento pélvico"
      body: "Treiná-lo todos os dias na gravidez e depois baixa o risco de perdas de urina."
    tr:
      title: "Pelvik taban"
      body: "Hamilelikte ve sonrasında her gün çalıştırmak idrar kaçırma riskini azaltır."

  - key: te-weinig-eten
    kind: fact
    en:
      title: "Too little food"
      body: "For how much you train, it can hurt health and performance, in women and men. The IOC wrote this for athletes."
    nl:
      title: "Te weinig eten"
      body: "Voor je trainingsvolume kan het gezondheid en prestatie schaden, bij vrouwen en mannen. Zo schrijft het IOC."
    de:
      title: "Zu wenig essen"
      body: "Für dein Trainingspensum kann das Gesundheit und Leistung schaden, bei Frauen und Männern, so das IOC."
    es:
      title: "Comer poco"
      body: "Para lo que entrenas, puede dañar salud y rendimiento, en mujeres y hombres. Lo dice el COI para atletas."
    fr:
      title: "Trop peu manger"
      body: "Pour ton volume d'entraînement, ça peut nuire à santé et perf, chez la femme comme l'homme, dit le CIO."
    pt:
      title: "Comer pouco"
      body: "Para o que treinas, pode prejudicar saúde e rendimento, em mulheres e homens. Diz o COI para atletas."
    tr:
      title: "Az yemek"
      body: "Antrenman miktarına göre az yemek kadın ve erkekte sağlığa ve performansa zarar verebilir. IOC sporcular için yazdı."

article: rest-days
emoji: "🏖️"
tips:
  - key: deel-van-het-schema
    kind: fact
    en:
      title: "Part of the plan"
      body: "A rest day is a planned day without hard training. It's there for recovery, adaptation and staying injury-free."
    nl:
      title: "Deel van het plan"
      body: "Een rustdag is een geplande dag zonder zware training. Voor herstel, aanpassing en blessurevrij blijven."
    de:
      title: "Teil des Plans"
      body: "Ein Ruhetag ist ein geplanter Tag ohne hartes Training. Für Erholung, Anpassung und weniger Verletzungen."
    es:
      title: "Parte del plan"
      body: "Un día de descanso es un día planeado sin entreno duro. Sirve para recuperar, adaptarte y evitar lesiones."
    fr:
      title: "Partie du plan"
      body: "Un jour de repos, c'est un jour prévu sans entraînement dur. Pour récupérer, s'adapter et éviter les blessures."
    pt:
      title: "Parte do plano"
      body: "Um dia de descanso é um dia planeado sem treino duro. Serve para recuperar, adaptar e evitar lesões."
    tr:
      title: "Planın parçası"
      body: "Dinlenme günü sert antrenman olmayan planlı bir gündür. Toparlanma, uyum ve sakatlanmamak için."

  - key: een-tot-drie-per-week
    kind: fact
    en:
      title: "1 to 3 a week"
      body: "Rest days, depending on how much you train and how well you recover."
    nl:
      title: "1 tot 3 per week"
      body: "Rustdagen, afhankelijk van hoeveel je traint en hoe goed je herstelt."
    de:
      title: "1 bis 3 pro Woche"
      body: "Ruhetage, je nachdem, wie viel du trainierst und wie gut du dich erholst."
    es:
      title: "1 a 3 por semana"
      body: "Días de descanso, según cuánto entrenes y lo bien que te recuperes."
    fr:
      title: "1 à 3 par semaine"
      body: "Jours de repos, selon ton volume d'entraînement et ta récupération."
    pt:
      title: "1 a 3 por semana"
      body: "Dias de descanso, conforme o quanto treinas e o quão bem recuperas."
    tr:
      title: "Haftada 1-3"
      body: "Dinlenme günü, ne kadar çalıştığına ve ne kadar iyi toparlandığına göre."

  - key: na-zware-dagen
    kind: fact
    en:
      title: "After heavy days"
      body: "Plan your rest days after your heavy or high-volume sessions."
    nl:
      title: "Na zware dagen"
      body: "Plan je rustdagen na je zware dagen of dagen met veel volume."
    de:
      title: "Nach harten Tagen"
      body: "Leg Ruhetage hinter schwere Tage oder Tage mit viel Volumen."
    es:
      title: "Tras días duros"
      body: "Pon tus días de descanso después de las sesiones pesadas o de mucho volumen."
    fr:
      title: "Après les gros jours"
      body: "Place tes jours de repos après les séances lourdes ou à gros volume."
    pt:
      title: "Depois dos dias duros"
      body: "Põe os dias de descanso depois dos treinos pesados ou de muito volume."
    tr:
      title: "Ağır günlerden sonra"
      body: "Dinlenme günlerini ağır ya da yüksek hacimli antrenmanlardan sonraya koy."

  - key: niet-minder-eten
    kind: myth
    en:
      title: "Eat less"
      body: "Myth: eat less on a rest day. Under-eating slows recovery. Eat to your goal and keep your protein up."
    nl:
      title: "Minder eten"
      body: "Mythe: op een rustdag eet je minder. Te weinig eten remt herstel. Eet naar je doel en houd je eiwit hoog."
    de:
      title: "Weniger essen"
      body: "Mythos: Am Ruhetag weniger essen. Zu wenig bremst die Erholung. Iss nach Ziel und halt das Protein hoch."
    es:
      title: "Comer menos"
      body: "Mito: el día de descanso se come menos. Comer poco frena la recuperación. Come según tu meta y con proteína."
    fr:
      title: "Manger moins"
      body: "Mythe : on mange moins un jour de repos. Sous-manger ralentit la récup. Mange selon ton but, protéines en tête."
    pt:
      title: "Comer menos"
      body: "Mito: no dia de descanso come-se menos. Comer pouco trava a recuperação. Come para o objetivo, com proteína."
    tr:
      title: "Daha az yemek"
      body: "Efsane: dinlenme günü daha az yenir. Az yemek toparlanmayı yavaşlatır. Hedefine göre ye, proteini yüksek tut."

  - key: sport-voor-de-lol
    kind: myth
    en:
      title: "Sport for fun"
      body: "Myth: hard sport for fun counts as rest. It adds fatigue. Keep rest days to walks and light mobility."
    nl:
      title: "Sporten voor de lol"
      body: "Mythe: fanatiek sporten voor de lol telt als rust. Het geeft extra vermoeidheid. Houd het bij wandelen."
    de:
      title: "Sport aus Spaß"
      body: "Mythos: Harter Freizeitsport zählt als Ruhe. Er macht zusätzlich müde. Bleib bei Spaziergängen und Mobility."
    es:
      title: "Deporte por gusto"
      body: "Mito: el deporte intenso por diversión cuenta como descanso. Suma fatiga. Mejor pasear y algo de movilidad."
    fr:
      title: "Sport pour le fun"
      body: "Mythe : un sport intense pour le plaisir compte comme repos. Ça fatigue. Reste sur marche et mobilité."
    pt:
      title: "Desporto por gosto"
      body: "Mito: desporto intenso por diversão conta como descanso. Soma fadiga. Fica por caminhadas e mobilidade."
    tr:
      title: "Keyif için spor"
      body: "Efsane: keyif için yapılan sert spor dinlenme sayılır. Yorgunluk ekler. Yürüyüş ve hafif mobiliteyle sınırla."

  - key: dag-goed-gebruiken
    kind: fact
    en:
      title: "Use the day"
      body: "A rest day is a good moment to prep meals, sleep a bit more and look back at your technique."
    nl:
      title: "Benut de dag"
      body: "Een rustdag is een goed moment om eten voor te bereiden, wat langer te slapen en je techniek terug te kijken."
    de:
      title: "Nutz den Tag"
      body: "Ein Ruhetag ist gut, um Essen vorzubereiten, etwas länger zu schlafen und die Technik zu checken."
    es:
      title: "Aprovecha el día"
      body: "Un día de descanso es buen momento para preparar comidas, dormir algo más y revisar tu técnica."
    fr:
      title: "Profite de la journée"
      body: "Un jour de repos, c'est le moment de préparer tes repas, dormir un peu plus et revoir ta technique."
    pt:
      title: "Aproveita o dia"
      body: "Um dia de descanso é bom para preparar refeições, dormir um pouco mais e rever a técnica."
    tr:
      title: "Günü değerlendir"
      body: "Dinlenme günü yemek hazırlamak, biraz fazla uyumak ve tekniğine bakmak için iyi bir an."

  - key: rust-overslaan
    kind: fact
    en:
      title: "Skipping rest"
      body: "Ignoring the signals and skipping rest days can lead to overuse problems."
    nl:
      title: "Rust overslaan"
      body: "Signalen negeren en rustdagen overslaan kan leiden tot overbelasting."
    de:
      title: "Ruhe auslassen"
      body: "Signale ignorieren und Ruhetage streichen kann zu Überlastung führen."
    es:
      title: "Saltarte el descanso"
      body: "Ignorar las señales y saltarte el descanso puede acabar en lesiones por sobrecarga."
    fr:
      title: "Sauter le repos"
      body: "Ignorer les signaux et sauter les jours de repos peut mener à des blessures de surmenage."
    pt:
      title: "Saltar o descanso"
      body: "Ignorar os sinais e saltar dias de descanso pode levar a lesões por sobrecarga."
    tr:
      title: "Dinlenmeyi atlamak"
      body: "Sinyalleri görmezden gelip dinlenme günlerini atlamak aşırı kullanım sorunlarına yol açabilir."

  - key: heel-moe
    kind: fact
    en:
      title: "Worn out"
      body: "Extremely fatigued? Consider an extra rest day or a deload."
    nl:
      title: "Doodop"
      body: "Ben je extreem moe? Overweeg een extra rustdag of een deload."
    de:
      title: "Völlig platt"
      body: "Extrem erschöpft? Denk an einen zusätzlichen Ruhetag oder einen Deload."
    es:
      title: "Agotado"
      body: "¿Muy cansado? Plantéate un día extra de descanso o una semana de descarga."
    fr:
      title: "Épuisé"
      body: "Très fatigué ? Envisage un jour de repos en plus ou une semaine de décharge."
    pt:
      title: "Exausto"
      body: "Muito cansado? Pensa num dia extra de descanso ou num deload."
    tr:
      title: "Bitkin"
      body: "Aşırı yorgun musun? Ekstra bir dinlenme günü ya da deload düşün."

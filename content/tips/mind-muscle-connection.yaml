article: mind-muscle-connection
emoji: "🧠"
tips:
  - key: emg
    kind: fact
    en:
      title: "Focus"
      body: "Focusing on the muscle can raise its activation in EMG studies, mostly in isolation lifts at moderate loads."
    nl:
      title: "Focus"
      body: "Focussen op de spier kan de activatie verhogen in EMG-studies, vooral bij isolatie-oefeningen met matig gewicht."
    de:
      title: "Fokus"
      body: "Auf den Muskel zu achten kann laut EMG-Studien die Aktivierung erhöhen, vor allem bei Isolation mit mittleren Lasten."
    es:
      title: "Foco"
      body: "Concentrarte en el músculo puede subir su activación en estudios EMG, sobre todo en aislamiento con cargas medias."
    fr:
      title: "Concentration"
      body: "Penser au muscle peut augmenter son activation en EMG, surtout en isolation avec des charges modérées."
    pt:
      title: "Foco"
      body: "Focar no músculo pode aumentar a ativação em estudos EMG, sobretudo em isolamento com cargas moderadas."
    tr:
      title: "Odak"
      body: "EMG çalışmalarında kasa odaklanmak aktivasyonu artırabilir, çoğunlukla orta yükte izolasyon hareketlerinde."

  - key: geen-vervanging
    kind: myth
    en:
      title: "Feel over weight"
      body: "Myth: feeling the muscle beats adding weight. It goes alongside more load or reps. It doesn't replace them."
    nl:
      title: "Voelen boven gewicht"
      body: "Mythe: de spier voelen wint van gewicht toevoegen. Het hoort bij meer gewicht of herhalingen, vervangt ze niet."
    de:
      title: "Gefühl statt Gewicht"
      body: "Mythos: Den Muskel spüren schlägt mehr Gewicht. Es gehört zu mehr Last oder Wiederholungen, ersetzt sie nicht."
    es:
      title: "Sentir antes que peso"
      body: "Mito: sentir el músculo gana a subir peso. Va junto a más carga o repeticiones, no las sustituye."
    fr:
      title: "Sentir avant charger"
      body: "Mythe : sentir le muscle vaut mieux que charger. Ça accompagne la progression, sans la remplacer."
    pt:
      title: "Sentir antes do peso"
      body: "Mito: sentir o músculo vale mais do que subir peso. Vai junto com mais carga ou repetições, não as substitui."
    tr:
      title: "His mi ağırlık mı"
      body: "Efsane: kası hissetmek ağırlık eklemekten iyidir. Daha fazla yük ya da tekrarla birlikte gider, yerini tutmaz."

  - key: gevoel-kwijt
    kind: fact
    en:
      title: "Lost the feel"
      body: "Slow the lowering for a rep or two to find your technique again, then go back to your normal tempo."
    nl:
      title: "Gevoel kwijt"
      body: "Laat een herhaling of twee langzamer zakken om je techniek terug te vinden, en ga dan terug naar je tempo."
    de:
      title: "Gefühl weg"
      body: "Senk ein, zwei Wiederholungen langsamer ab, um die Technik wiederzufinden, dann zurück zu deinem Tempo."
    es:
      title: "Pierdes la sensación"
      body: "Baja más lento una o dos repeticiones para recuperar la técnica y vuelve a tu ritmo."
    fr:
      title: "Plus de sensation"
      body: "Ralentis la descente une ou deux reps pour retrouver ta technique, puis reprends ton tempo."
    pt:
      title: "Perdeste a sensação"
      body: "Desce mais devagar uma ou duas repetições para recuperar a técnica e volta ao teu ritmo."
    tr:
      title: "His kayboldu"
      body: "Tekniği bulmak için bir iki tekrarda inişi yavaşlat, sonra normal temponuza dön."

  - key: aanwijzingen
    kind: fact
    en:
      title: "Elbows to hips"
      body: "A cue for rows that steers tension where you want it. On squats, try 'press through mid-foot'."
    nl:
      title: "Ellebogen naar je heup"
      body: "Een aanwijzing bij roeien die spanning stuurt. Bij squats: 'duw door je middenvoet'."
    de:
      title: "Ellbogen zur Hüfte"
      body: "Ein Hinweis beim Rudern, der die Spannung lenkt. Bei Kniebeugen: 'durch den Mittelfuß drücken'."
    es:
      title: "Codos a la cadera"
      body: "Una pista en el remo que dirige la tensión. En sentadilla, prueba 'empuja con el medio del pie'."
    fr:
      title: "Coudes aux hanches"
      body: "Un repère au rowing qui guide la tension. Au squat, essaie 'pousse avec le milieu du pied'."
    pt:
      title: "Cotovelos à anca"
      body: "Uma dica na remada que orienta a tensão. No agachamento, tenta 'empurra com o meio do pé'."
    tr:
      title: "Dirsekler kalçaya"
      body: "Row'da gerilimi yönlendiren bir ipucu. Squat'ta 'orta ayakla it' dene."

  - key: filmen
    kind: fact
    en:
      title: "Film it"
      body: "Film your key sets to check where the tension stays, and whether joint angles and bar path look right."
    nl:
      title: "Film het"
      body: "Film je belangrijkste sets en kijk waar de spanning zit, en of je hoeken en baan van de stang kloppen."
    de:
      title: "Film es"
      body: "Film deine wichtigsten Sätze und prüf, wo die Spannung bleibt und ob Winkel und Stangenweg stimmen."
    es:
      title: "Grábalo"
      body: "Graba tus series clave para ver dónde queda la tensión y si los ángulos y la trayectoria de la barra van bien."
    fr:
      title: "Filme-toi"
      body: "Filme tes séries clés pour voir où reste la tension, et si tes angles et la trajectoire de la barre sont bons."
    pt:
      title: "Filma"
      body: "Filma as séries principais para ver onde fica a tensão e se os ângulos e o percurso da barra estão bem."
    tr:
      title: "Kaydet"
      body: "Önemli setlerini çek; gerilimin nerede kaldığına, açılara ve bar yoluna bak."

  - key: heel-licht
    kind: myth
    en:
      title: "Very light"
      body: "Myth: go very light to feel the muscle. Never nearing failure is a common mistake. Aim for 1 to 3 reps in reserve."
    nl:
      title: "Heel licht"
      body: "Mythe: ga heel licht om de spier te voelen. Nooit in de buurt van falen komen is een fout. Mik op 1 tot 3 in reserve."
    de:
      title: "Ganz leicht"
      body: "Mythos: Ganz leicht, um den Muskel zu spüren. Nie nah ans Versagen zu kommen ist ein Fehler. Ziel: 1 bis 3 in Reserve."
    es:
      title: "Muy ligero"
      body: "Mito: ve muy ligero para sentir el músculo. No acercarte nunca al fallo es un error. Apunta a 1 a 3 en reserva."
    fr:
      title: "Très léger"
      body: "Mythe : va très léger pour sentir le muscle. Ne jamais approcher l'échec est une erreur. Vise 1 à 3 reps en réserve."
    pt:
      title: "Muito leve"
      body: "Mito: vai muito leve para sentir o músculo. Nunca chegar perto da falha é um erro. Aponta a 1 a 3 em reserva."
    tr:
      title: "Çok hafif"
      body: "Efsane: kası hissetmek için çok hafif çalış. Tükenişe hiç yaklaşmamak hatadır. 1-3 tekrar yedek hedefle."

  - key: stabiel
    kind: fact
    en:
      title: "Lock in"
      body: "Set up pads, bench and bracing before each set. Less wobble, less tension leaking from the target muscle."
    nl:
      title: "Zet je vast"
      body: "Stel pads, bank en romp in voor elke set. Minder wiebelen, minder spanning die weglekt uit de doelspier."
    de:
      title: "Fest einstellen"
      body: "Stell Polster, Bank und Rumpfspannung vor jedem Satz ein. Weniger Wackeln, weniger verlorene Spannung."
    es:
      title: "Fíjate bien"
      body: "Ajusta apoyos, banco y core antes de cada serie. Menos bamboleo, menos tensión que se escapa del músculo."
    fr:
      title: "Verrouille-toi"
      body: "Règle appuis, banc et gainage avant chaque série. Moins de jeu, moins de tension qui fuit du muscle visé."
    pt:
      title: "Fixa-te"
      body: "Ajusta apoios, banco e core antes de cada série. Menos oscilação, menos tensão a fugir do músculo alvo."
    tr:
      title: "Sabitlen"
      body: "Her setten önce pedleri, sehpayı ve gövde sıkılığını ayarla. Daha az sallanma, hedef kastan daha az gerilim kaçar."

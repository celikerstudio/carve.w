article: active-recovery
emoji: "🚶"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Active recovery"
      body: "Easy movement that gets blood flowing and eases stiffness, without adding much fatigue."
    nl:
      title: "Actief herstel"
      body: "Rustig bewegen dat je bloed laat stromen en stijfheid verlicht, zonder veel extra vermoeidheid."
    de:
      title: "Aktive Erholung"
      body: "Lockere Bewegung, die die Durchblutung anregt und Steifheit löst, ohne viel zusätzliche Ermüdung."
    es:
      title: "Recuperación activa"
      body: "Movimiento suave que activa la circulación y alivia la rigidez sin añadir mucha fatiga."
    fr:
      title: "Récupération active"
      body: "Bouger doucement pour faire circuler le sang et dénouer les raideurs, sans fatigue en plus."
    pt:
      title: "Recuperação ativa"
      body: "Movimento leve que põe o sangue a circular e alivia a rigidez, sem somar muita fadiga."
    tr:
      title: "Aktif toparlanma"
      body: "Kan akışını artıran ve tutukluğu azaltan hafif hareket. Üstüne fazla yorgunluk eklemez."

  - key: tien-tot-dertig-minuten
    kind: fact
    en:
      title: "10 to 30 minutes"
      body: "Of easy movement is enough, on a rest day or after training."
    nl:
      title: "10 tot 30 minuten"
      body: "Rustig bewegen is genoeg, op een rustdag of na de training."
    de:
      title: "10 bis 30 Minuten"
      body: "So viel lockere Bewegung reicht, am Ruhetag oder nach dem Training."
    es:
      title: "10 a 30 minutos"
      body: "De movimiento suave bastan, en un día de descanso o después de entrenar."
    fr:
      title: "10 à 30 minutes"
      body: "De mouvement léger suffisent, un jour de repos ou après l'entraînement."
    pt:
      title: "10 a 30 minutos"
      body: "De movimento leve chegam, num dia de descanso ou depois do treino."
    tr:
      title: "10-30 dakika"
      body: "Hafif hareket yeterli. Dinlenme gününde ya da antrenmandan sonra."

  - key: neusademhaling
    kind: fact
    en:
      title: "Nose breathing"
      body: "That's how easy active recovery should feel: you breathe through your nose and can still talk."
    nl:
      title: "Door je neus"
      body: "Zo rustig hoort actief herstel: je ademt door je neus en kunt nog gewoon praten."
    de:
      title: "Nasenatmung"
      body: "So locker sollte aktive Erholung sein: Du atmest durch die Nase und kannst noch reden."
    es:
      title: "Por la nariz"
      body: "Así de suave debe ser: respiras por la nariz y todavía puedes hablar."
    fr:
      title: "Par le nez"
      body: "C'est le bon rythme pour récupérer : tu respires par le nez et tu peux encore parler."
    pt:
      title: "Pelo nariz"
      body: "É este o ritmo certo: respiras pelo nariz e ainda consegues falar."
    tr:
      title: "Burundan nefes"
      body: "Aktif toparlanma bu kadar hafif olmalı: burundan nefes alıyor ve konuşabiliyorsun."

  - key: wat-telt
    kind: fact
    en:
      title: "A walk"
      body: "Counts as active recovery. So do light cycling and an easy swim. Pair it with good sleep."
    nl:
      title: "Een wandeling"
      body: "Telt als actief herstel, net als rustig fietsen of zwemmen. Combineer het met goed slapen."
    de:
      title: "Ein Spaziergang"
      body: "Zählt als aktive Erholung, genau wie lockeres Radfahren oder Schwimmen. Dazu guter Schlaf."
    es:
      title: "Un paseo"
      body: "Cuenta como recuperación activa, igual que pedalear o nadar suave. Combínalo con buen sueño."
    fr:
      title: "Une balade"
      body: "Compte comme récupération active, tout comme du vélo ou de la nage tranquille. Avec un bon sommeil."
    pt:
      title: "Uma caminhada"
      body: "Conta como recuperação ativa, tal como pedalar ou nadar devagar. Junta-lhe um bom sono."
    tr:
      title: "Bir yürüyüş"
      body: "Aktif toparlanma sayılır, hafif bisiklet ya da yüzme de öyle. Yanına iyi bir uyku ekle."

  - key: minder-pijn-voelen
    kind: fact
    en:
      title: "Less sore"
      body: "Light activity can make you feel less sore, and keeps you moving well for your next session."
    nl:
      title: "Minder spierpijn"
      body: "Licht bewegen kan spierpijn minder laten voelen en houdt je soepel voor de volgende training."
    de:
      title: "Weniger Muskelkater"
      body: "Leichte Bewegung kann Muskelkater lindern und hält dich beweglich für die nächste Einheit."
    es:
      title: "Menos agujetas"
      body: "La actividad ligera puede aliviar las agujetas y te mantiene ágil para la próxima sesión."
    fr:
      title: "Moins de courbatures"
      body: "Bouger un peu peut atténuer les courbatures et te garde souple pour la séance suivante."
    pt:
      title: "Menos dores"
      body: "Atividade leve pode aliviar as dores musculares e mantém-te solto para o próximo treino."
    tr:
      title: "Daha az ağrı"
      body: "Hafif aktivite kas ağrısını hafifletebilir ve seni sonraki antrenmana hazır tutar."

  - key: rustdag-stilzitten
    kind: myth
    en:
      title: "Sitting still"
      body: "Myth: rest days mean not moving at all. That tends to leave you stiff and sluggish. Some easy movement helps."
    nl:
      title: "Stilzitten"
      body: "Mythe: op een rustdag beweeg je niet. Dan word je juist stijf en sloom. Een beetje rustig bewegen helpt."
    de:
      title: "Stillsitzen"
      body: "Mythos: Am Ruhetag bewegt man sich nicht. Das macht eher steif und träge. Etwas lockere Bewegung hilft."
    es:
      title: "Quedarte quieto"
      body: "Mito: en el día de descanso no te mueves. Eso suele dejarte rígido y pesado. Moverte un poco ayuda."
    fr:
      title: "Rester immobile"
      body: "Mythe : un jour de repos, on ne bouge pas. Ça laisse plutôt raide et lourd. Bouger un peu aide."
    pt:
      title: "Ficar parado"
      body: "Mito: no dia de descanso não te mexes. Isso costuma deixar-te rígido e pesado. Mexer um pouco ajuda."
    tr:
      title: "Hiç kıpırdamamak"
      body: "Efsane: dinlenme günü hiç hareket edilmez. Bu seni tutuk ve halsiz bırakır. Biraz hafif hareket iyi gelir."

  - key: geen-extra-training
    kind: myth
    en:
      title: "Extra sets"
      body: "Myth: recovery days are for extra volume. Going hard adds hidden fatigue. Keep it easy so it stays recovery."
    nl:
      title: "Extra sets"
      body: "Mythe: een hersteldag is voor extra volume. Hard gaan geeft verborgen vermoeidheid. Houd het rustig."
    de:
      title: "Extra Sätze"
      body: "Mythos: Erholungstage sind für extra Volumen. Hartes Training bringt versteckte Ermüdung. Bleib locker."
    es:
      title: "Series extra"
      body: "Mito: los días de recuperación son para más volumen. Ir fuerte suma fatiga oculta. Mantenlo suave."
    fr:
      title: "Séries en plus"
      body: "Mythe : les jours de récup servent à faire plus de volume. Forcer ajoute une fatigue cachée. Reste cool."
    pt:
      title: "Séries extra"
      body: "Mito: os dias de recuperação são para mais volume. Puxar forte soma fadiga escondida. Mantém leve."
    tr:
      title: "Ekstra set"
      body: "Efsane: toparlanma günleri ekstra hacim içindir. Zorlamak gizli yorgunluk ekler. Hafif tut."

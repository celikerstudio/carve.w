article: supplement-timing
emoji: "🕒"
tips:
  - key: cafeine-voor-training
    kind: fact
    en:
      title: "30 to 60 minutes"
      body: "Before you lift is when to take caffeine. Its effect depends on timing."
    nl:
      title: "30 tot 60 minuten"
      body: "Voor de training neem je je cafeïne. Het effect hangt af van de timing."
    de:
      title: "30 bis 60 Minuten"
      body: "Vor dem Training nimmst du Koffein. Die Wirkung hängt vom Timing ab."
    es:
      title: "30 a 60 minutos"
      body: "Antes de entrenar es cuando tomar la cafeína. Su efecto depende del momento."
    fr:
      title: "30 à 60 minutes"
      body: "Avant la séance, c'est le moment de la caféine. Son effet dépend du timing."
    pt:
      title: "30 a 60 minutos"
      body: "Antes do treino é quando tomar cafeína. O efeito depende do momento."
    tr:
      title: "30-60 dakika"
      body: "Antrenmandan önce kafeini bu aralıkta al. Etkisi zamanlamaya bağlı."

  - key: geen-late-stimulanten
    kind: fact
    en:
      title: "Morning or midday"
      body: "Keep caffeine and pre-workout then. Taken late, they cost you sleep."
    nl:
      title: "Ochtend of middag"
      body: "Houd cafeïne en pre-workout op die momenten. Laat genomen kosten ze je slaap."
    de:
      title: "Morgens oder mittags"
      body: "Dann Koffein und Pre-Workout. Spät genommen kosten sie Schlaf."
    es:
      title: "Mañana o mediodía"
      body: "Deja la cafeína y el pre-entreno para entonces. Tarde, te quitan sueño."
    fr:
      title: "Matin ou midi"
      body: "Garde caféine et pré-workout pour ces moments. Pris tard, ils coûtent du sommeil."
    pt:
      title: "Manhã ou meio-dia"
      body: "Deixa a cafeína e o pré-treino para essa altura. Tarde, tiram-te sono."
    tr:
      title: "Sabah ya da öğle"
      body: "Kafein ve pre-workout'u o saatlerde al. Geç alınca uykuna mal olur."

  - key: creatine-elke-dag
    kind: fact
    en:
      title: "Any time"
      body: "Creatine fills up your stores, so the hour doesn't matter. Taking it every day does."
    nl:
      title: "Elk moment"
      body: "Creatine vult je voorraad, dus het uur maakt niet uit. Elke dag nemen wel."
    de:
      title: "Jederzeit"
      body: "Kreatin füllt die Speicher, also ist die Uhrzeit egal. Tägliche Einnahme nicht."
    es:
      title: "A cualquier hora"
      body: "La creatina llena tus reservas, así que la hora da igual. Tomarla cada día no."
    fr:
      title: "N'importe quand"
      body: "La créatine remplit tes réserves, l'heure importe peu. La prendre chaque jour, si."
    pt:
      title: "A qualquer hora"
      body: "A creatina enche as reservas, por isso a hora não importa. Tomá-la todos os dias importa."
    tr:
      title: "Her saat"
      body: "Kreatin depoları doldurur, saat önemli değil. Her gün almak önemli."

  - key: precisie
    kind: myth
    en:
      title: "Exact timing"
      body: "Myth: supplement timing must be exact. For most staples, taking them consistently matters more."
    nl:
      title: "Precieze timing"
      body: "Mythe: supplementen moeten op de minuut. Bij de meeste basics telt trouw innemen meer."
    de:
      title: "Exaktes Timing"
      body: "Mythos: Supplements brauchen exaktes Timing. Bei den meisten zählt regelmäßige Einnahme mehr."
    es:
      title: "Hora exacta"
      body: "Mito: los suplementos van a la hora exacta. En la mayoría importa más tomarlos con constancia."
    fr:
      title: "Timing précis"
      body: "Mythe : les compléments exigent un timing précis. Pour la plupart, la régularité compte plus."
    pt:
      title: "Hora exata"
      body: "Mito: os suplementos têm de ser à hora certa. Na maioria conta mais tomá-los com constância."
    tr:
      title: "Tam zamanlama"
      body: "Efsane: takviyelerin zamanı tam olmalı. Çoğunda düzenli almak daha önemli."

  - key: vitamine-d-met-vet
    kind: fact
    en:
      title: "With a meal"
      body: "Take vitamin D with a meal that has some fat in it. That's an easy anchor to remember it."
    nl:
      title: "Bij een maaltijd"
      body: "Neem vitamine D bij een maaltijd met wat vet. Een makkelijk ankerpunt om het niet te vergeten."
    de:
      title: "Zum Essen"
      body: "Nimm Vitamin D zu einer Mahlzeit mit etwas Fett. Ein leichter Anker, um es nicht zu vergessen."
    es:
      title: "Con una comida"
      body: "Toma la vitamina D con una comida que tenga algo de grasa. Un buen ancla para recordarla."
    fr:
      title: "Au repas"
      body: "Prends la vitamine D avec un repas un peu gras. Un repère facile pour ne pas l'oublier."
    pt:
      title: "Com uma refeição"
      body: "Toma a vitamina D com uma refeição com alguma gordura. Uma âncora fácil para não esqueceres."
    tr:
      title: "Yemekle"
      body: "D vitaminini biraz yağ içeren bir öğünle al. Unutmamak için kolay bir hatırlatıcı."

  - key: melatonine-voor-bed
    kind: fact
    en:
      title: "Before bed"
      body: "Using melatonin? Take it about 30 to 60 minutes before you go to bed."
    nl:
      title: "Voor het slapen"
      body: "Gebruik je melatonine? Neem het zo'n 30 tot 60 minuten voor je naar bed gaat."
    de:
      title: "Vor dem Schlafen"
      body: "Nimmst du Melatonin? Etwa 30 bis 60 Minuten vor dem Zubettgehen."
    es:
      title: "Antes de dormir"
      body: "¿Usas melatonina? Tómala unos 30 a 60 minutos antes de acostarte."
    fr:
      title: "Avant le coucher"
      body: "Tu prends de la mélatonine ? Environ 30 à 60 minutes avant d'aller au lit."
    pt:
      title: "Antes de dormir"
      body: "Usas melatonina? Toma-a cerca de 30 a 60 minutos antes de te deitares."
    tr:
      title: "Yatmadan önce"
      body: "Melatonin mi kullanıyorsun? Yatmadan yaklaşık 30-60 dakika önce al."

  - key: beta-alanine-verdelen
    kind: fact
    en:
      title: "Split it"
      body: "Take beta-alanine in several doses, every day. Skipping days stops your muscles from filling up."
    nl:
      title: "Verdeel het"
      body: "Neem bèta-alanine in meerdere porties, elke dag. Dagen overslaan houdt je spieren leger."
    de:
      title: "Aufteilen"
      body: "Nimm Beta-Alanin in mehreren Portionen, jeden Tag. Ausgelassene Tage bremsen das Auffüllen."
    es:
      title: "Repártela"
      body: "Toma la beta-alanina en varias dosis, cada día. Saltarte días frena que se llene el músculo."
    fr:
      title: "Fractionne"
      body: "Prends la bêta-alanine en plusieurs doses, chaque jour. Sauter des jours freine le remplissage."
    pt:
      title: "Divide"
      body: "Toma a beta-alanina em várias doses, todos os dias. Saltar dias trava o enchimento do músculo."
    tr:
      title: "Böl"
      body: "Beta-alanini her gün birkaç doza bölerek al. Gün atlamak kasların dolmasını engeller."

  - key: elektrolyten
    kind: fact
    en:
      title: "Long sessions"
      body: "Electrolytes belong with long sessions or training in the heat. That's when they're worth it."
    nl:
      title: "Lange trainingen"
      body: "Elektrolyten horen bij lange sessies of training in de hitte. Dan zijn ze de moeite waard."
    de:
      title: "Lange Einheiten"
      body: "Elektrolyte gehören zu langen Einheiten oder Training in der Hitze. Dann lohnen sie sich."
    es:
      title: "Sesiones largas"
      body: "Los electrolitos son para sesiones largas o con calor. Ahí sí merecen la pena."
    fr:
      title: "Longues séances"
      body: "Les électrolytes servent pour les longues séances ou la chaleur. Là, ils valent le coup."
    pt:
      title: "Treinos longos"
      body: "Os eletrólitos são para treinos longos ou com calor. Aí valem a pena."
    tr:
      title: "Uzun antrenmanlar"
      body: "Elektrolitler uzun seanslar ya da sıcakta antrenman içindir. O zaman değer."

article: micronutrients
emoji: "🍊"
tips:
  - key: multivitamine-prestatie
    kind: myth
    en:
      title: "Multivitamin"
      body: "Myth: a multivitamin helps you perform. Vitamin pills only help performance when they fix a deficiency."
    nl:
      title: "Multivitamine"
      body: "Mythe: een multivitamine verbetert je prestaties. Vitaminepillen helpen alleen als ze een tekort aanvullen."
    de:
      title: "Multivitamin"
      body: "Mythos: Ein Multivitamin steigert die Leistung. Vitaminpillen helfen nur, wenn sie einen Mangel beheben."
    es:
      title: "Multivitamínico"
      body: "Mito: un multivitamínico mejora el rendimiento. Solo ayuda si corrige una carencia."
    fr:
      title: "Multivitamine"
      body: "Mythe : une multivitamine booste la perf. Les vitamines n'aident que si elles comblent une carence."
    pt:
      title: "Multivitamínico"
      body: "Mito: um multivitamínico melhora o rendimento. Só ajuda se corrigir uma carência."
    tr:
      title: "Multivitamin"
      body: "Efsane: multivitamin performansı artırır. Vitamin hapları sadece bir eksikliği giderirse işe yarar."

  - key: meer-is-beter
    kind: myth
    en:
      title: "More vitamins"
      body: "Myth: more vitamins is better. Beyond your needs there's no extra benefit. The upper limit is a ceiling, not a target."
    nl:
      title: "Meer vitamines"
      body: "Mythe: meer vitamines is beter. Boven je behoefte win je niets. De bovengrens is een plafond, geen doel."
    de:
      title: "Mehr Vitamine"
      body: "Mythos: Mehr Vitamine sind besser. Über den Bedarf hinaus bringt es nichts. Die Obergrenze ist kein Ziel."
    es:
      title: "Más vitaminas"
      body: "Mito: más vitaminas es mejor. Por encima de lo necesario no ganas nada. El límite es un techo, no una meta."
    fr:
      title: "Plus de vitamines"
      body: "Mythe : plus de vitamines, c'est mieux. Au-delà du besoin, aucun bénéfice. La limite est un plafond."
    pt:
      title: "Mais vitaminas"
      body: "Mito: mais vitaminas é melhor. Acima do necessário não ganhas nada. O limite é um teto, não um alvo."
    tr:
      title: "Daha çok vitamin"
      body: "Efsane: ne kadar çok vitamin o kadar iyi. İhtiyacın üstü ek fayda vermez. Üst sınır hedef değil, tavan."

  - key: wegplassen
    kind: myth
    en:
      title: "12 mg of B6"
      body: "Myth: extra B vitamins just leave in your pee. Too much B6 can damage nerves. 12 mg a day is the adult limit."
    nl:
      title: "12 mg B6"
      body: "Mythe: extra B-vitamines plas je gewoon uit. Te veel B6 kan zenuwen beschadigen. 12 mg per dag is de grens."
    de:
      title: "12 mg B6"
      body: "Mythos: Zu viel B-Vitamine pinkelst du aus. Zu viel B6 kann Nerven schädigen. 12 mg am Tag sind die Grenze."
    es:
      title: "12 mg de B6"
      body: "Mito: el exceso de vitaminas B se va en la orina. Demasiada B6 puede dañar los nervios. El límite son 12 mg al día."
    fr:
      title: "12 mg de B6"
      body: "Mythe : l'excès de vitamines B part dans les urines. Trop de B6 peut abîmer les nerfs. Limite : 12 mg par jour."
    pt:
      title: "12 mg de B6"
      body: "Mito: o excesso de vitaminas B sai na urina. B6 a mais pode danificar os nervos. O limite é 12 mg por dia."
    tr:
      title: "12 mg B6"
      body: "Efsane: fazla B vitamini idrarla çıkar. Fazla B6 sinirlere zarar verebilir. Yetişkinde sınır günde 12 mg."

  - key: optellen
    kind: fact
    en:
      title: "It adds up"
      body: "Upper limits count everything. A multivitamin, a vitamin D tablet and fortified food add to one total."
    nl:
      title: "Het telt op"
      body: "Bovengrenzen tellen alles mee. Een multivitamine, een vitamine D-tablet en verrijkt eten vormen samen één totaal."
    de:
      title: "Es summiert sich"
      body: "Obergrenzen zählen alles. Multivitamin, Vitamin-D-Tablette und angereichertes Essen ergeben eine Summe."
    es:
      title: "Todo suma"
      body: "Los límites cuentan todo. Un multivitamínico, una pastilla de vitamina D y alimentos enriquecidos suman un total."
    fr:
      title: "Tout s'additionne"
      body: "Les limites comptent tout. Multivitamine, comprimé de vitamine D et aliments enrichis font un seul total."
    pt:
      title: "Tudo soma"
      body: "Os limites contam tudo. Um multivitamínico, um comprimido de vitamina D e alimentos enriquecidos somam um total."
    tr:
      title: "Hepsi toplanır"
      body: "Üst sınır her şeyi sayar. Multivitamin, D vitamini tableti ve zenginleştirilmiş gıda tek toplama girer."

  - key: vetoplosbaar
    kind: fact
    en:
      title: "A, D, E and K"
      body: "These vitamins are stored in your body. Too much for a long time can build up to toxic levels."
    nl:
      title: "A, D, E en K"
      body: "Deze vitamines slaat je lichaam op. Lang te veel kan oplopen tot giftige niveaus."
    de:
      title: "A, D, E und K"
      body: "Diese Vitamine speichert dein Körper. Lange zu viel kann sich bis zu giftigen Mengen aufbauen."
    es:
      title: "A, D, E y K"
      body: "Tu cuerpo almacena estas vitaminas. Demasiado durante mucho tiempo puede llegar a niveles tóxicos."
    fr:
      title: "A, D, E et K"
      body: "Ton corps stocke ces vitamines. Trop pendant longtemps peut atteindre des niveaux toxiques."
    pt:
      title: "A, D, E e K"
      body: "O corpo armazena estas vitaminas. Demasiado durante muito tempo pode chegar a níveis tóxicos."
    tr:
      title: "A, D, E ve K"
      body: "Bu vitaminler vücutta depolanır. Uzun süre fazlası zehirli seviyelere çıkabilir."

  - key: antioxidanten-training
    kind: fact
    en:
      title: "Antioxidants"
      body: "High-dose pills for faster recovery aren't supported. They might even blunt how you adapt to training."
    nl:
      title: "Antioxidanten"
      body: "Hoge doses voor sneller herstel worden niet ondersteund. Ze remmen misschien zelfs je aanpassing aan training."
    de:
      title: "Antioxidantien"
      body: "Hochdosiert für schnellere Erholung ist nicht belegt. Sie bremsen vielleicht sogar die Trainingsanpassung."
    es:
      title: "Antioxidantes"
      body: "Las dosis altas para recuperar antes no tienen apoyo. Quizá incluso frenen tu adaptación al entreno."
    fr:
      title: "Antioxydants"
      body: "Les fortes doses pour récupérer plus vite ne sont pas soutenues. Elles freinent peut-être même l'adaptation."
    pt:
      title: "Antioxidantes"
      body: "Doses altas para recuperar mais depressa não têm apoio. Talvez até travem a adaptação ao treino."
    tr:
      title: "Antioksidanlar"
      body: "Hızlı toparlanma için yüksek doz desteklenmiyor. Antrenmana uyumu bile yavaşlatabilir."

  - key: betacaroteen
    kind: fact
    en:
      title: "15 mg"
      body: "Beta-carotene a day or more was linked to lung cancer. If you smoke, avoid supplements that contain it."
    nl:
      title: "15 mg"
      body: "Bètacaroteen per dag of meer werd gelinkt aan longkanker. Rook je, vermijd dan supplementen waar het in zit."
    de:
      title: "15 mg"
      body: "Betacarotin am Tag oder mehr wurde mit Lungenkrebs verknüpft. Rauchst du, meide Supplements damit."
    es:
      title: "15 mg"
      body: "De betacaroteno al día o más se ligó al cáncer de pulmón. Si fumas, evita suplementos que lo lleven."
    fr:
      title: "15 mg"
      body: "De bêta-carotène par jour ou plus ont été liés au cancer du poumon. Si tu fumes, évite ces compléments."
    pt:
      title: "15 mg"
      body: "De betacaroteno por dia ou mais foram ligados a cancro do pulmão. Se fumas, evita suplementos com ele."
    tr:
      title: "15 mg"
      body: "Günde bu kadar ya da daha fazla beta karoten akciğer kanseriyle ilişkilendirildi. Sigara içiyorsan alma."

  - key: lang-tekort
    kind: fact
    en:
      title: "Strict diets"
      body: "Long strict diets or cutting food groups can leave gaps. Get your levels checked instead of guessing."
    nl:
      title: "Strenge diëten"
      body: "Lang streng lijnen of productgroepen schrappen kan tekorten geven. Laat je waardes meten in plaats van te gokken."
    de:
      title: "Strenge Diäten"
      body: "Lange strenge Diäten oder gestrichene Lebensmittelgruppen können Lücken lassen. Lass messen statt zu raten."
    es:
      title: "Dietas estrictas"
      body: "Dietas largas y estrictas o quitar grupos de alimentos dejan huecos. Hazte un análisis en vez de adivinar."
    fr:
      title: "Régimes stricts"
      body: "Les longs régimes stricts ou les groupes d'aliments supprimés créent des manques. Fais doser au lieu de deviner."
    pt:
      title: "Dietas rígidas"
      body: "Dietas longas e rígidas ou cortar grupos de alimentos deixam falhas. Faz análises em vez de adivinhar."
    tr:
      title: "Sıkı diyetler"
      body: "Uzun sıkı diyetler ya da besin gruplarını kesmek eksik bırakabilir. Tahmin etme, değerlerini ölçtür."

  - key: vegan-b12
    kind: fact
    en:
      title: "B12"
      body: "Vegan? In the Netherlands you're advised to take vitamin B12, at least enough to reach the daily recommendation."
    nl:
      title: "B12"
      body: "Vegan? Dan is het advies in Nederland om vitamine B12 te slikken, minstens tot de aanbevolen dagelijkse hoeveelheid."
    de:
      title: "B12"
      body: "Vegan? In den Niederlanden rät man zu Vitamin B12, mindestens bis zur empfohlenen Tagesmenge."
    es:
      title: "B12"
      body: "¿Vegano? En Países Bajos se aconseja tomar vitamina B12, al menos hasta la cantidad diaria recomendada."
    fr:
      title: "B12"
      body: "Végan ? Aux Pays-Bas, on conseille de prendre de la vitamine B12, au moins jusqu'à l'apport recommandé."
    pt:
      title: "B12"
      body: "Vegano? Nos Países Baixos aconselha-se tomar vitamina B12, pelo menos até à dose diária recomendada."
    tr:
      title: "B12"
      body: "Vegan mısın? Hollanda'da en az önerilen günlük miktara ulaşacak kadar B12 vitamini alman öneriliyor."

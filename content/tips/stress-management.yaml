article: stress-management
emoji: "🧘"
tips:
  - key: stress-en-vooruitgang
    kind: fact
    en:
      title: "Cortisol"
      body: "Chronic stress raises it and keeps you on alert. That can get in the way of recovery, muscle gain and fat loss."
    nl:
      title: "Cortisol"
      body: "Chronische stress verhoogt het en houdt je alert. Dat kan herstel, spiergroei en vetverlies in de weg zitten."
    de:
      title: "Cortisol"
      body: "Chronischer Stress erhöht es und hält dich in Alarm. Das kann Erholung, Muskelaufbau und Fettabbau bremsen."
    es:
      title: "Cortisol"
      body: "El estrés crónico lo sube y te mantiene en alerta. Puede frenar la recuperación, el músculo y la pérdida de grasa."
    fr:
      title: "Cortisol"
      body: "Le stress chronique le fait monter et te garde en alerte. Ça peut freiner récup, muscle et perte de gras."
    pt:
      title: "Cortisol"
      body: "O stress crónico sobe-o e mantém-te em alerta. Pode travar a recuperação, o músculo e a perda de gordura."
    tr:
      title: "Kortizol"
      body: "Kronik stres onu yükseltir ve seni alarmda tutar. Toparlanmayı, kas kazancını ve yağ kaybını engelleyebilir."

  - key: zwaarder-voelen
    kind: fact
    en:
      title: "Feels heavier"
      body: "Stress can make the same effort feel harder and sap your motivation."
    nl:
      title: "Voelt zwaarder"
      body: "Stress kan dezelfde inspanning zwaarder laten voelen en je motivatie opslokken."
    de:
      title: "Fühlt sich schwerer an"
      body: "Stress kann dieselbe Anstrengung härter wirken lassen und die Motivation rauben."
    es:
      title: "Se siente más duro"
      body: "El estrés puede hacer que el mismo esfuerzo cueste más y quitarte las ganas."
    fr:
      title: "Plus dur"
      body: "Le stress peut rendre le même effort plus pénible et miner ta motivation."
    pt:
      title: "Parece mais pesado"
      body: "O stress pode fazer o mesmo esforço custar mais e tirar-te a motivação."
    tr:
      title: "Daha ağır gelir"
      body: "Stres aynı eforu daha zor hissettirebilir ve motivasyonunu çalabilir."

  - key: niet-harder-trainen
    kind: myth
    en:
      title: "Train it off"
      body: "Myth: stressed? Train harder. More training on top of life stress piles on fatigue. Deload if stress spikes."
    nl:
      title: "Eruit trainen"
      body: "Mythe: gestrest? Train harder. Meer training bovenop stress stapelt vermoeidheid op. Doe een deload als het piekt."
    de:
      title: "Wegtrainieren"
      body: "Mythos: Gestresst? Härter trainieren. Mehr Training auf Stress häuft Ermüdung an. Bei Stressspitzen Deload."
    es:
      title: "Quemarlo entrenando"
      body: "Mito: ¿estresado? Entrena más duro. Más entreno sobre el estrés acumula fatiga. Descarga si sube."
    fr:
      title: "L'évacuer à la salle"
      body: "Mythe : stressé ? Entraîne-toi plus dur. Ça empile la fatigue. Fais une décharge si le stress grimpe."
    pt:
      title: "Treinar para aliviar"
      body: "Mito: com stress? Treina mais forte. Mais treino por cima do stress soma fadiga. Faz deload se disparar."
    tr:
      title: "Antrenmanla atmak"
      body: "Efsane: stresli misin? Daha sert çalış. Stresin üstüne antrenman yorgunluk biriktirir. Stres artarsa deload yap."

  - key: korte-pauzes
    kind: fact
    en:
      title: "5 minutes"
      body: "Of breathing or a short walk. Fit one between your work blocks."
    nl:
      title: "5 minuten"
      body: "Ademhalen of een kort rondje lopen. Plan er een tussen je werkblokken."
    de:
      title: "5 Minuten"
      body: "Atmen oder ein kurzer Gang. Bau so eine Pause zwischen deine Arbeitsblöcke."
    es:
      title: "5 minutos"
      body: "De respiración o un paseo corto. Mete uno entre tus bloques de trabajo."
    fr:
      title: "5 minutes"
      body: "De respiration ou une courte marche. Glisse-en une entre tes blocs de travail."
    pt:
      title: "5 minutos"
      body: "De respiração ou uma caminhada curta. Põe uma entre os blocos de trabalho."
    tr:
      title: "5 dakika"
      body: "Nefes egzersizi ya da kısa bir yürüyüş. İş blokların arasına bir tane koy."

  - key: geen-extra-cafeine
    kind: myth
    en:
      title: "More caffeine"
      body: "Myth: more caffeine gets you through. Fix sleep and workload instead. Keep caffeine earlier in the day."
    nl:
      title: "Meer cafeïne"
      body: "Mythe: met meer cafeïne kom je er wel door. Pak liever slaap en werkdruk aan. Houd cafeïne vroeg op de dag."
    de:
      title: "Mehr Koffein"
      body: "Mythos: Mit mehr Koffein kommst du durch. Kümmer dich lieber um Schlaf und Pensum. Koffein eher früh am Tag."
    es:
      title: "Más cafeína"
      body: "Mito: con más cafeína aguantas. Mejor arregla el sueño y la carga de trabajo. Cafeína temprano."
    fr:
      title: "Plus de caféine"
      body: "Mythe : plus de caféine pour tenir. Règle plutôt sommeil et charge de travail. Caféine tôt dans la journée."
    pt:
      title: "Mais cafeína"
      body: "Mito: mais cafeína ajuda a aguentar. Trata antes do sono e da carga de trabalho. Cafeína cedo no dia."
    tr:
      title: "Daha çok kafein"
      body: "Efsane: daha çok kafeinle idare edersin. Bunun yerine uykuyu ve iş yükünü düzelt. Kafeini erken al."

  - key: drukke-dag-toch-eten
    kind: fact
    en:
      title: "Busy day"
      body: "Skipping meals makes your stress response worse. Regular meals with protein and carbs keep your energy steady."
    nl:
      title: "Drukke dag"
      body: "Maaltijden overslaan maakt je stressreactie erger. Vaste maaltijden met eiwit en koolhydraten houden je energie stabiel."
    de:
      title: "Voller Tag"
      body: "Mahlzeiten auslassen verschlimmert die Stressreaktion. Regelmäßige Mahlzeiten mit Protein und Kohlenhydraten helfen."
    es:
      title: "Día ajetreado"
      body: "Saltarte comidas empeora tu respuesta al estrés. Comer regular con proteína e hidratos mantiene tu energía."
    fr:
      title: "Journée chargée"
      body: "Sauter des repas aggrave ta réponse au stress. Des repas réguliers avec protéines et glucides stabilisent l'énergie."
    pt:
      title: "Dia cheio"
      body: "Saltar refeições piora a resposta ao stress. Refeições regulares com proteína e hidratos mantêm a energia estável."
    tr:
      title: "Yoğun gün"
      body: "Öğün atlamak stres tepkini kötüleştirir. Protein ve karbonhidratlı düzenli öğünler enerjini dengede tutar."

  - key: afschakelen-voor-bed
    kind: fact
    en:
      title: "Wind down"
      body: "A routine before bed protects your sleep. Simple mindfulness or journaling can help you shift down."
    nl:
      title: "Afschakelen"
      body: "Een vaste routine voor het slapen beschermt je slaap. Simpele mindfulness of een dagboek helpt je terugschakelen."
    de:
      title: "Runterfahren"
      body: "Eine Routine vor dem Schlafen schützt deinen Schlaf. Einfache Achtsamkeit oder Tagebuch hilft runterzukommen."
    es:
      title: "Desconectar"
      body: "Una rutina antes de dormir protege tu sueño. Algo de mindfulness o escribir un diario ayuda a bajar el ritmo."
    fr:
      title: "Décompresser"
      body: "Une routine avant le coucher protège ton sommeil. Un peu de pleine conscience ou un journal aident à ralentir."
    pt:
      title: "Desligar"
      body: "Uma rotina antes de dormir protege o sono. Um pouco de mindfulness ou um diário ajudam a abrandar."
    tr:
      title: "Yavaşlamak"
      body: "Yatmadan önceki bir rutin uykunu korur. Basit farkındalık ya da günlük yazmak gevşemene yardım eder."

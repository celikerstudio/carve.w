article: warm-up
emoji: "🌡️"
tips:
  - key: blessures
    kind: myth
    en:
      title: "Injuries"
      body: "Myth: a warm-up prevents injuries. Experts found no short-term support. It may lower risk, but proof is lacking."
    nl:
      title: "Blessures"
      body: "Mythe: een warming-up voorkomt blessures. Op korte termijn vonden experts geen steun. Minder risico? Onbewezen."
    de:
      title: "Verletzungen"
      body: "Mythos: Aufwärmen verhindert Verletzungen. Kurzfristig fanden Fachleute keine Belege. Weniger Risiko? Unbewiesen."
    es:
      title: "Lesiones"
      body: "Mito: calentar previene lesiones. Los expertos no hallaron apoyo a corto plazo. Quizá baje el riesgo, sin pruebas."
    fr:
      title: "Blessures"
      body: "Mythe : l'échauffement évite les blessures. Aucun appui à court terme. Il réduit peut-être le risque, sans preuve."
    pt:
      title: "Lesões"
      body: "Mito: aquecer previne lesões. Os especialistas não acharam apoio a curto prazo. Talvez baixe o risco, sem provas."
    tr:
      title: "Sakatlık"
      body: "Efsane: ısınma sakatlığı önler. Uzmanlar kısa vadede destek bulmadı. Riski azaltabilir ama kanıt yok."

  - key: rekken-als-opwarming
    kind: myth
    en:
      title: "Stretching"
      body: "Myth: stretching is the best warm-up. For lifting, a dynamic warm-up works better for most people, says the ACSM."
    nl:
      title: "Rekken"
      body: "Mythe: rekken is de beste warming-up. Voor krachttraining werkt dynamisch opwarmen bij de meesten beter, zegt de ACSM."
    de:
      title: "Dehnen"
      body: "Mythos: Dehnen ist das beste Aufwärmen. Fürs Krafttraining wirkt dynamisches Aufwärmen bei den meisten besser."
    es:
      title: "Estirar"
      body: "Mito: estirar es el mejor calentamiento. Para las pesas, uno dinámico funciona mejor en casi todos, dice el ACSM."
    fr:
      title: "S'étirer"
      body: "Mythe : s'étirer est le meilleur échauffement. En muscu, un échauffement dynamique marche mieux pour la plupart."
    pt:
      title: "Alongar"
      body: "Mito: alongar é o melhor aquecimento. Para o treino de força, um dinâmico resulta melhor na maioria, diz o ACSM."
    tr:
      title: "Esneme"
      body: "Efsane: en iyi ısınma esnemedir. ACSM'ye göre ağırlık için çoğu kişide dinamik ısınma daha iyi."

  - key: lang-rekken
    kind: fact
    en:
      title: "60 seconds"
      body: "Is the most to hold a stretch per muscle right before a max or explosive effort, stretching experts advise."
    nl:
      title: "60 seconden"
      body: "Langer houd je een rekoefening per spier niet vast vlak voor een maximale of explosieve inspanning, raden experts."
    de:
      title: "60 Sekunden"
      body: "Länger solltest du eine Dehnung pro Muskel nicht halten direkt vor maximaler oder explosiver Belastung."
    es:
      title: "60 segundos"
      body: "Es lo máximo para mantener un estiramiento por músculo justo antes de un esfuerzo máximo o explosivo."
    fr:
      title: "60 secondes"
      body: "C'est le maximum pour tenir un étirement par muscle juste avant un effort max ou explosif, disent des experts."
    pt:
      title: "60 segundos"
      body: "É o máximo para manter um alongamento por músculo mesmo antes de um esforço máximo ou explosivo."
    tr:
      title: "60 saniye"
      body: "Maksimum ya da patlayıcı bir efordan hemen önce kas başına esnemeyi bundan uzun tutma, diyor uzmanlar."

  - key: kort-rekken
    kind: fact
    en:
      title: "Short stretches"
      body: "Inside a dynamic warm-up, they don't have the drawback of long holds, stretching experts say."
    nl:
      title: "Kort rekken"
      body: "Binnen een dynamische warming-up heeft dat niet het nadeel van lang vasthouden, zeggen experts."
    de:
      title: "Kurzes Dehnen"
      body: "In einem dynamischen Aufwärmen hat es nicht den Nachteil langer Dehnungen, sagen Fachleute."
    es:
      title: "Estiramientos cortos"
      body: "Dentro de un calentamiento dinámico no tienen la pega de mantenerlos mucho, dicen expertos."
    fr:
      title: "Étirements courts"
      body: "Dans un échauffement dynamique, ils n'ont pas l'inconvénient des longs maintiens, disent des experts."
    pt:
      title: "Alongamentos curtos"
      body: "Dentro de um aquecimento dinâmico não têm o problema dos alongamentos longos, dizem especialistas."
    tr:
      title: "Kısa esneme"
      body: "Uzmanlara göre dinamik ısınma içinde uzun tutmanın dezavantajı yok."

  - key: opbouwen
    kind: fact
    en:
      title: "Build up"
      body: "A few minutes of easy movement, then lighter sets of your first lift. So your first heavy set isn't your first set."
    nl:
      title: "Opbouwen"
      body: "Een paar minuten rustig bewegen, dan lichtere sets van je eerste oefening. Zo is je eerste zware set niet je eerste set."
    de:
      title: "Aufbauen"
      body: "Ein paar Minuten locker bewegen, dann leichtere Sätze der ersten Übung. So ist der erste schwere nicht dein erster Satz."
    es:
      title: "Sube poco a poco"
      body: "Unos minutos de movimiento suave y series ligeras del primer ejercicio. Tu primera serie pesada no será la primera."
    fr:
      title: "Monte progressivement"
      body: "Quelques minutes de mouvement facile, puis des séries légères du premier exo. Ta 1re série lourde n'est pas la 1re."
    pt:
      title: "Sobe aos poucos"
      body: "Uns minutos de movimento leve, depois séries leves do primeiro exercício. A primeira pesada não é a primeira."
    tr:
      title: "Yavaş yavaş"
      body: "Birkaç dakika hafif hareket, sonra ilk hareketin hafif setleri. Böylece ilk ağır setin ilk setin olmaz."

  - key: opwarmsets-als-meetlat
    kind: fact
    en:
      title: "Feels heavy"
      body: "Lighter warm-up sets feeling unusually heavy? That tells you something about the day."
    nl:
      title: "Voelt zwaar"
      body: "Voelen je lichtere opwarmsets ongewoon zwaar? Dat zegt iets over je dag."
    de:
      title: "Fühlt sich schwer an"
      body: "Wirken die leichten Aufwärmsätze ungewöhnlich schwer? Das sagt etwas über deinen Tag."
    es:
      title: "Se siente pesado"
      body: "¿Las series de calentamiento pesan más de lo normal? Eso te dice algo del día."
    fr:
      title: "Ça paraît lourd"
      body: "Tes séries d'échauffement semblent anormalement lourdes ? Ça en dit long sur ta journée."
    pt:
      title: "Parece pesado"
      body: "As séries de aquecimento estão invulgarmente pesadas? Isso diz-te algo sobre o dia."
    tr:
      title: "Ağır geliyor"
      body: "Hafif ısınma setlerin alışılmadık ağır mı geliyor? Bu sana gün hakkında bir şey söyler."

  - key: licht-houden
    kind: fact
    en:
      title: "Keep it light"
      body: "Don't turn your warm-up into a workout. Save your effort for the work sets."
    nl:
      title: "Houd het licht"
      body: "Maak van je warming-up geen training. Bewaar je inzet voor de echte sets."
    de:
      title: "Leicht halten"
      body: "Mach aus dem Aufwärmen kein Training. Spar deine Kraft für die Arbeitssätze."
    es:
      title: "Que sea ligero"
      body: "No conviertas el calentamiento en un entreno. Guarda el esfuerzo para las series de trabajo."
    fr:
      title: "Reste léger"
      body: "Ne transforme pas l'échauffement en séance. Garde ton effort pour les séries de travail."
    pt:
      title: "Mantém leve"
      body: "Não faças do aquecimento um treino. Guarda o esforço para as séries de trabalho."
    tr:
      title: "Hafif tut"
      body: "Isınmayı antrenmana çevirme. Eforunu asıl setlere sakla."

  - key: compleet
    kind: fact
    en:
      title: "Complete"
      body: "A complete warm-up works best, a 2026 panel of sport experts agreed. They had athletes in mind, not the gym."
    nl:
      title: "Compleet"
      body: "Een complete warming-up werkt het best, vond een expertpanel in 2026. Ze dachten aan sporters, niet aan de gym."
    de:
      title: "Vollständig"
      body: "Ein vollständiges Aufwärmen wirkt am besten, so ein Expertengremium 2026. Gedacht für Athleten, nicht fürs Gym."
    es:
      title: "Completo"
      body: "Un calentamiento completo funciona mejor, acordó un panel de expertos en 2026. Pensaban en atletas, no en el gym."
    fr:
      title: "Complet"
      body: "Un échauffement complet marche le mieux, selon un panel d'experts en 2026. Pensé pour les athlètes, pas la salle."
    pt:
      title: "Completo"
      body: "Um aquecimento completo resulta melhor, concordou um painel em 2026. Pensaram em atletas, não no ginásio."
    tr:
      title: "Eksiksiz"
      body: "2026'da bir uzman paneline göre eksiksiz ısınma en iyisi. Sporcuları düşünüyorlardı, salonu değil."

  - key: een-routine
    kind: myth
    en:
      title: "One routine"
      body: "Myth: there's one right warm-up. Experts say it depends on context and sport. There's none to copy."
    nl:
      title: "Eén routine"
      body: "Mythe: er is één juiste warming-up. Volgens experts hangt het af van context en sport. Er is niets om te kopiëren."
    de:
      title: "Eine Routine"
      body: "Mythos: Es gibt das eine richtige Aufwärmen. Laut Fachleuten hängt es von Kontext und Sport ab."
    es:
      title: "Una rutina"
      body: "Mito: hay un calentamiento correcto. Los expertos dicen que depende del contexto y el deporte."
    fr:
      title: "Une routine"
      body: "Mythe : il existe un bon échauffement. Les experts disent que ça dépend du contexte et du sport."
    pt:
      title: "Uma rotina"
      body: "Mito: há um aquecimento certo. Os especialistas dizem que depende do contexto e do desporto."
    tr:
      title: "Tek rutin"
      body: "Efsane: tek bir doğru ısınma var. Uzmanlara göre bağlama ve spora bağlı. Kopyalanacak bir rutin yok."

  - key: richtlijnen-zwijgen
    kind: fact
    en:
      title: "Not mentioned"
      body: "The ACSM's stands on strength training, from 2009 and 2026, don't mention warming up at all."
    nl:
      title: "Niet genoemd"
      body: "De ACSM-standpunten over krachttraining, uit 2009 en 2026, noemen opwarmen helemaal niet."
    de:
      title: "Nicht erwähnt"
      body: "Die ACSM-Stellungnahmen zum Krafttraining von 2009 und 2026 erwähnen Aufwärmen gar nicht."
    es:
      title: "Ni se menciona"
      body: "Las posturas del ACSM sobre fuerza, de 2009 y 2026, no mencionan el calentamiento."
    fr:
      title: "Pas mentionné"
      body: "Les prises de position ACSM sur la muscu, de 2009 et 2026, ne parlent pas d'échauffement."
    pt:
      title: "Nem mencionado"
      body: "As posições do ACSM sobre treino de força, de 2009 e 2026, não falam de aquecimento."
    tr:
      title: "Hiç yok"
      body: "ACSM'nin 2009 ve 2026 kuvvet antrenmanı bildirgelerinde ısınmadan hiç bahsedilmiyor."

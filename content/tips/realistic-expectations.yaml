article: realistic-expectations
emoji: "🧭"
tips:
  - key: eerste-half-jaar
    kind: fact
    en:
      title: "5 to 9%"
      body: "Of their weight lost in six months, on average, by people who finished weight loss trials. Then it levelled off."
    nl:
      title: "5 tot 9%"
      body: "Van hun gewicht verloren mensen die afvalstudies afmaakten gemiddeld in zes maanden. Daarna vlakte het af."
    de:
      title: "5 bis 9 %"
      body: "Ihres Gewichts verloren Teilnehmer, die durchhielten, im Schnitt in sechs Monaten. Danach flachte es ab."
    es:
      title: "5 a 9 %"
      body: "De su peso perdieron de media en seis meses quienes acabaron los ensayos. Luego se estabilizó."
    fr:
      title: "5 à 9 %"
      body: "De leur poids perdus en six mois, en moyenne, par ceux qui allaient au bout des essais. Puis ça plafonnait."
    pt:
      title: "5 a 9%"
      body: "Do peso perdido em seis meses, em média, por quem acabou os ensaios. Depois estabilizou."
    tr:
      title: "%5-9"
      body: "Kilo verme çalışmalarını bitirenler altı ayda ortalama kilolarının bu kadarını verdi. Sonra sabitlendi."

  - key: jaren-later
    kind: fact
    en:
      title: "3 to 4 kg"
      body: "Still off after two to four years for trial finishers. But 29% dropped out in year one, mostly not counted."
    nl:
      title: "3 tot 4 kilo"
      body: "Was na twee tot vier jaar nog steeds weg bij wie de studie afmaakte. Maar 29% haakte in jaar één af."
    de:
      title: "3 bis 4 kg"
      body: "Waren nach zwei bis vier Jahren noch weg, bei denen, die durchhielten. Aber 29 % stiegen im ersten Jahr aus."
    es:
      title: "3 a 4 kg"
      body: "Seguían fuera tras dos a cuatro años en quienes acabaron. Pero un 29 % lo dejó el primer año."
    fr:
      title: "3 à 4 kg"
      body: "Toujours en moins deux à quatre ans après, pour ceux qui ont fini. Mais 29 % avaient abandonné la 1re année."
    pt:
      title: "3 a 4 kg"
      body: "Ainda fora após dois a quatro anos em quem acabou. Mas 29% desistiu no primeiro ano."
    tr:
      title: "3-4 kg"
      body: "Çalışmayı bitirenlerde iki-dört yıl sonra hâlâ yoktu. Ama %29 ilk yıl bırakmıştı, çoğu sayılmadı."

  - key: alleen-sporten
    kind: myth
    en:
      title: "Exercise alone"
      body: "Myth: exercise alone melts the weight off. In 80 trials it gave little loss. Programs with a diet did better."
    nl:
      title: "Alleen sporten"
      body: "Mythe: van alleen sporten val je af. In 80 studies gaf het weinig gewichtsverlies. Met een dieet erbij werkte het beter."
    de:
      title: "Nur Sport"
      body: "Mythos: Sport allein lässt die Kilos schmelzen. In 80 Studien brachte es wenig. Mit Diät klappte es besser."
    es:
      title: "Solo ejercicio"
      body: "Mito: el ejercicio solo te hace adelgazar. En 80 ensayos dio poca pérdida. Con dieta funcionó mejor."
    fr:
      title: "Que du sport"
      body: "Mythe : le sport seul fait fondre les kilos. Sur 80 essais, peu de perte. Avec un régime, c'était mieux."
    pt:
      title: "Só exercício"
      body: "Mito: só exercício faz emagrecer. Em 80 ensaios deu pouca perda. Com dieta resultou melhor."
    tr:
      title: "Sadece spor"
      body: "Efsane: tek başına spor kilo eritir. 80 çalışmada az kayıp sağladı. Diyetli programlar daha iyiydi."

  - key: spieropbouw-tempo
    kind: fact
    en:
      title: "1.54 kg"
      body: "Fat-free mass gained by beginner men in about ten weeks of lifting. Trained men: 0.98 kg. No women studied."
    nl:
      title: "1,54 kilo"
      body: "Vetvrije massa erbij voor beginnende mannen in zo'n tien weken. Getrainde mannen: 0,98 kilo. Geen vrouwen bekeken."
    de:
      title: "1,54 kg"
      body: "Fettfreie Masse bauten Anfänger in etwa zehn Wochen auf. Trainierte: 0,98 kg. Frauen wurden nicht untersucht."
    es:
      title: "1,54 kg"
      body: "De masa magra ganaron hombres novatos en unas diez semanas. Entrenados: 0,98 kg. No se estudiaron mujeres."
    fr:
      title: "1,54 kg"
      body: "De masse maigre pour des débutants en dix semaines environ. Hommes entraînés : 0,98 kg. Pas de femmes étudiées."
    pt:
      title: "1,54 kg"
      body: "De massa magra para homens iniciantes em cerca de dez semanas. Treinados: 0,98 kg. Sem mulheres estudadas."
    tr:
      title: "1,54 kg"
      body: "Yeni başlayan erkekler yaklaşık on haftada bu kadar yağsız kütle kazandı. Deneyimliler: 0,98 kg. Kadınlar yok."

  - key: niemand-houdt-het-vol
    kind: myth
    en:
      title: "17.3%"
      body: "Myth: nobody keeps weight off. That many US adults who were ever overweight kept 10% off for a year or more."
    nl:
      title: "17,3%"
      body: "Mythe: niemand houdt het gewicht eraf. Zoveel Amerikanen met ooit overgewicht hielden 10% een jaar of langer kwijt."
    de:
      title: "17,3 %"
      body: "Mythos: Niemand hält das Gewicht. So viele US-Erwachsene mit früherem Übergewicht hielten 10 % ein Jahr oder länger."
    es:
      title: "17,3 %"
      body: "Mito: nadie mantiene el peso perdido. Tantos adultos de EE. UU. mantuvieron un 10 % menos un año o más."
    fr:
      title: "17,3 %"
      body: "Mythe : personne ne garde ses kilos perdus. Autant d'Américains ont gardé 10 % en moins un an ou plus."
    pt:
      title: "17,3%"
      body: "Mito: ninguém mantém o peso perdido. Tantos adultos dos EUA mantiveram 10% a menos durante um ano ou mais."
    tr:
      title: "%17,3"
      body: "Efsane: verilen kiloyu kimse koruyamaz. Bir zamanlar kilolu olan ABD'li yetişkinlerin bu kadarı %10'u bir yıl korudu."

  - key: register-lange-termijn
    kind: fact
    en:
      title: "87%"
      body: "Of people in a US registry, who lost 13.6 kg and kept it off a year, were estimated to keep 10% off at 5 and 10 years."
    nl:
      title: "87%"
      body: "Van een Amerikaans register (13,6 kilo kwijt, een jaar volgehouden) hield naar schatting 10% eraf na 5 en 10 jaar."
    de:
      title: "87 %"
      body: "Der Menschen in einem US-Register, die 13,6 kg verloren und ein Jahr hielten, hielten wohl 10 % nach 5 und 10 Jahren."
    es:
      title: "87 %"
      body: "De un registro de EE. UU., que perdieron 13,6 kg y lo mantuvieron un año, conservaban un 10 % a los 5 y 10 años."
    fr:
      title: "87 %"
      body: "Des gens d'un registre américain, avec 13,6 kg perdus tenus un an, gardaient 10 % en moins à 5 et 10 ans."
    pt:
      title: "87%"
      body: "De um registo dos EUA, que perderam 13,6 kg e mantiveram um ano, conservavam 10% a menos aos 5 e 10 anos."
    tr:
      title: "%87"
      body: "13,6 kg verip bir yıl koruyan ABD kayıt grubunun bu kadarının 5 ve 10 yılda %10'u koruduğu tahmin edildi."

  - key: register-kanttekening
    kind: fact
    en:
      title: "Success stories"
      body: "That registry is people who succeeded and report their own weight. So 87% isn't your odds at the start."
    nl:
      title: "Succesverhalen"
      body: "Dat register bestaat uit mensen die slaagden en zelf hun gewicht doorgeven. Die 87% is dus niet jouw kans."
    de:
      title: "Erfolgsgeschichten"
      body: "Das Register sind Menschen mit Erfolg, die ihr Gewicht selbst melden. 87 % sind also nicht deine Chance."
    es:
      title: "Casos de éxito"
      body: "Ese registro es gente que lo logró y da su propio peso. Así que el 87 % no es tu probabilidad al empezar."
    fr:
      title: "Histoires de réussite"
      body: "Ce registre, ce sont des gens qui ont réussi et déclarent leur poids. 87 %, ce n'est pas ta chance au départ."
    pt:
      title: "Casos de sucesso"
      body: "Esse registo são pessoas que conseguiram e dão o próprio peso. Por isso 87% não é a tua hipótese."
    tr:
      title: "Başarı hikâyeleri"
      body: "O kayıt, başaran ve kilosunu kendi bildiren kişilerden oluşuyor. %87 başlangıçtaki şansın değil."

  - key: wat-terugkomen-voorspelt
    kind: fact
    en:
      title: "Regain"
      body: "More regain went with less exercise, less restraint around food and weighing less often, in that registry."
    nl:
      title: "Terugkomen"
      body: "Meer aankomen ging in dat register samen met minder bewegen, minder rem op eten en minder vaak wegen."
    de:
      title: "Wieder zunehmen"
      body: "Mehr Zunahme ging dort mit weniger Bewegung, weniger Zurückhaltung beim Essen und seltenerem Wiegen einher."
    es:
      title: "Recuperar peso"
      body: "En ese registro, recuperar más iba con menos ejercicio, menos control al comer y pesarse menos."
    fr:
      title: "Reprendre"
      body: "Dans ce registre, plus de reprise allait avec moins de sport, moins de retenue à table et moins de pesées."
    pt:
      title: "Voltar a ganhar"
      body: "Nesse registo, ganhar mais andava com menos exercício, menos contenção a comer e pesar-se menos."
    tr:
      title: "Geri almak"
      body: "O kayıtta daha çok geri alım, daha az egzersiz, yemekte daha az frenleme ve daha seyrek tartılmayla birlikteydi."

  - key: doelen-die-je-stuurt
    kind: fact
    en:
      title: "Goals you control"
      body: "You decide if you train three times this week, not what the scale says Monday. Pick goals of the first kind."
    nl:
      title: "Doelen die jij stuurt"
      body: "Jij bepaalt of je deze week drie keer traint, niet wat de weegschaal maandag zegt. Kies het eerste soort doel."
    de:
      title: "Ziele in deiner Hand"
      body: "Du entscheidest, ob du dreimal trainierst, nicht, was die Waage am Montag sagt. Wähl Ziele der ersten Art."
    es:
      title: "Metas que controlas"
      body: "Tú decides si entrenas tres veces esta semana, no lo que diga la báscula el lunes. Elige metas del primer tipo."
    fr:
      title: "Objectifs à ta main"
      body: "Tu décides de t'entraîner trois fois cette semaine, pas de ce que dira la balance lundi. Choisis le premier type."
    pt:
      title: "Metas que controlas"
      body: "Tu decides se treinas três vezes esta semana, não o que a balança diz na segunda. Escolhe metas do primeiro tipo."
    tr:
      title: "Kontrolündeki hedefler"
      body: "Bu hafta üç kez çalışmaya sen karar verirsin, pazartesi tartının ne diyeceğine değil. İlk türü seç."

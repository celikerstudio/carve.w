article: massage
emoji: "💆"
tips:
  - key: wat-het-doet
    kind: fact
    en:
      title: "Relax"
      body: "Massage can ease tension and help you relax. It adds to sleep, food and smart training, it doesn't replace them."
    nl:
      title: "Ontspannen"
      body: "Massage kan spanning verlichten en je laten ontspannen. Het vult slaap, eten en training aan, het vervangt ze niet."
    de:
      title: "Entspannen"
      body: "Massage kann Spannung lösen und entspannen. Sie ergänzt Schlaf, Essen und Training, ersetzt sie aber nicht."
    es:
      title: "Relajarte"
      body: "El masaje puede aliviar tensión y relajarte. Suma al sueño, la comida y el entreno, no los sustituye."
    fr:
      title: "Se détendre"
      body: "Le massage peut dénouer les tensions et détendre. Il complète sommeil, repas et entraînement, sans les remplacer."
    pt:
      title: "Relaxar"
      body: "A massagem pode aliviar tensão e relaxar-te. Soma ao sono, à comida e ao treino, não os substitui."
    tr:
      title: "Rahatlamak"
      body: "Masaj gerginliği azaltıp rahatlatabilir. Uyku, beslenme ve antrenmanı tamamlar, yerlerini tutmaz."

  - key: geen-melkzuur
    kind: myth
    en:
      title: "Lactic acid"
      body: "Myth: massage flushes out lactic acid. It doesn't, but it may ease discomfort."
    nl:
      title: "Melkzuur"
      body: "Mythe: massage spoelt melkzuur weg. Dat doet het niet, al kan het ongemak verlichten."
    de:
      title: "Milchsäure"
      body: "Mythos: Massage spült Milchsäure aus. Tut sie nicht, aber sie kann Beschwerden lindern."
    es:
      title: "Ácido láctico"
      body: "Mito: el masaje elimina el ácido láctico. No lo hace, pero puede aliviar molestias."
    fr:
      title: "Acide lactique"
      body: "Mythe : le massage évacue l'acide lactique. Non, mais il peut soulager l'inconfort."
    pt:
      title: "Ácido lático"
      body: "Mito: a massagem elimina o ácido lático. Não elimina, mas pode aliviar o desconforto."
    tr:
      title: "Laktik asit"
      body: "Efsane: masaj laktik asidi atar. Atmaz ama rahatsızlığı hafifletebilir."

  - key: pijn-is-niet-beter
    kind: myth
    en:
      title: "Painful pressure"
      body: "Myth: a massage should hurt to work. Painful pressure can make soreness worse. Say how much you want."
    nl:
      title: "Pijnlijke druk"
      body: "Mythe: een massage moet pijn doen om te werken. Pijnlijke druk kan spierpijn erger maken. Zeg hoeveel je wilt."
    de:
      title: "Schmerzhafter Druck"
      body: "Mythos: Massage muss wehtun. Schmerzhafter Druck kann Muskelkater verschlimmern. Sag, wie viel du willst."
    es:
      title: "Presión dolorosa"
      body: "Mito: un masaje tiene que doler. La presión dolorosa puede empeorar las agujetas. Di cuánta quieres."
    fr:
      title: "Pression douloureuse"
      body: "Mythe : un massage doit faire mal. Une pression douloureuse peut aggraver les courbatures. Dis ce que tu veux."
    pt:
      title: "Pressão dolorosa"
      body: "Mito: uma massagem tem de doer. Pressão dolorosa pode piorar as dores. Diz quanta queres."
    tr:
      title: "Acıtan baskı"
      body: "Efsane: masaj acıtmalı ki işe yarasın. Acıtan baskı ağrıyı artırabilir. Ne kadar istediğini söyle."

  - key: wanneer-plannen
    kind: fact
    en:
      title: "When to book"
      body: "After a hard training block, or when tension builds up and starts to limit how you move."
    nl:
      title: "Wanneer boeken"
      body: "Na een zwaar trainingsblok, of als spanning zich opstapelt en je beweging begint te beperken."
    de:
      title: "Wann buchen"
      body: "Nach einem harten Trainingsblock oder wenn sich Spannung aufbaut und dich einschränkt."
    es:
      title: "Cuándo reservar"
      body: "Tras un bloque duro de entreno, o cuando la tensión se acumula y limita cómo te mueves."
    fr:
      title: "Quand réserver"
      body: "Après un bloc d'entraînement dur, ou quand les tensions s'accumulent et te limitent."
    pt:
      title: "Quando marcar"
      body: "Depois de um bloco de treino duro, ou quando a tensão se acumula e limita os movimentos."
    tr:
      title: "Ne zaman"
      body: "Zorlu bir antrenman bloğundan sonra ya da gerginlik birikip hareketini kısıtlamaya başlayınca."

  - key: blijvende-pijnplek
    kind: fact
    en:
      title: "Recurring sore spot"
      body: "Keeps coming back? Adjust your training load and technique instead of relying on massage alone."
    nl:
      title: "Plek die terugkomt"
      body: "Komt een pijnlijke plek steeds terug? Pas je belasting en techniek aan, in plaats van alleen op massage te leunen."
    de:
      title: "Wiederkehrende Stelle"
      body: "Kommt sie immer zurück? Pass Belastung und Technik an, statt dich nur auf Massage zu verlassen."
    es:
      title: "Zona que vuelve"
      body: "¿Vuelve siempre? Ajusta tu carga y tu técnica en vez de confiar solo en el masaje."
    fr:
      title: "Point qui revient"
      body: "Il revient sans cesse ? Ajuste ta charge et ta technique au lieu de compter sur le massage seul."
    pt:
      title: "Zona que volta"
      body: "Volta sempre? Ajusta a carga e a técnica em vez de confiar só na massagem."
    tr:
      title: "Geri dönen ağrı"
      body: "Sürekli geri mi geliyor? Sadece masaja güvenme, yükünü ve tekniğini ayarla."

  - key: vooral-gevoel
    kind: fact
    en:
      title: "Mostly a feeling"
      body: "Massage benefits are often subjective. Still, it can help you relax and feel ready to train."
    nl:
      title: "Vooral gevoel"
      body: "De voordelen van massage zijn vaak subjectief. Toch kan het je ontspannen en klaar laten voelen voor training."
    de:
      title: "Vor allem Gefühl"
      body: "Die Vorteile von Massage sind oft subjektiv. Trotzdem kann sie entspannen und dich bereit machen."
    es:
      title: "Sobre todo sensación"
      body: "Los beneficios del masaje suelen ser subjetivos. Aun así, puede relajarte y dejarte listo para entrenar."
    fr:
      title: "Surtout un ressenti"
      body: "Les bienfaits du massage sont souvent subjectifs. Il peut quand même te détendre et te préparer."
    pt:
      title: "Sobretudo sensação"
      body: "Os benefícios da massagem são muitas vezes subjetivos. Mesmo assim, pode relaxar-te e preparar-te."
    tr:
      title: "Çoğunlukla his"
      body: "Masajın faydaları çoğu zaman öznel. Yine de rahatlatıp antrenmana hazır hissettirebilir."

  - key: zelfmassage
    kind: fact
    en:
      title: "Between sessions"
      body: "Use self-massage tools. Drink enough before and after, and keep moving afterwards."
    nl:
      title: "Tussendoor"
      body: "Gebruik zelfmassage-tools. Drink genoeg ervoor en erna, en blijf daarna bewegen."
    de:
      title: "Zwischendurch"
      body: "Nutz Tools zur Selbstmassage. Trink vorher und nachher genug und bleib danach in Bewegung."
    es:
      title: "Entre sesiones"
      body: "Usa herramientas de automasaje. Bebe suficiente antes y después, y sigue moviéndote."
    fr:
      title: "Entre deux séances"
      body: "Utilise des outils d'automassage. Bois assez avant et après, et continue de bouger."
    pt:
      title: "Entre sessões"
      body: "Usa ferramentas de automassagem. Bebe o suficiente antes e depois e continua a mexer-te."
    tr:
      title: "Seanslar arasında"
      body: "Kendi kendine masaj aletleri kullan. Önce ve sonra yeterince iç, sonra hareket etmeye devam et."

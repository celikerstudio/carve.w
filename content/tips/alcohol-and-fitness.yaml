article: alcohol-and-fitness
emoji: "🍺"
tips:
  - key: per-week
    kind: fact
    en:
      title: "2 drinks a week"
      body: "Or fewer counts as low risk in Canadian guidance. From 7 a week, the risk keeps rising."
    nl:
      title: "2 glazen per week"
      body: "Of minder is laag risico volgens de Canadese richtlijn. Vanaf 7 per week blijft het risico stijgen."
    de:
      title: "2 Gläser pro Woche"
      body: "Oder weniger gelten in Kanadas Richtlinie als geringes Risiko. Ab 7 pro Woche steigt es weiter."
    es:
      title: "2 copas a la semana"
      body: "O menos es bajo riesgo según la guía canadiense. A partir de 7 por semana, el riesgo sigue subiendo."
    fr:
      title: "2 verres par semaine"
      body: "Ou moins, c'est un risque faible selon le repère canadien. Dès 7 par semaine, le risque grimpe encore."
    pt:
      title: "2 bebidas por semana"
      body: "Ou menos é risco baixo segundo a orientação canadiana. A partir de 7 por semana, o risco continua a subir."
    tr:
      title: "Haftada 2 içki"
      body: "Ya da daha azı, Kanada rehberine göre düşük risk. Haftada 7'den sonra risk artmaya devam eder."

  - key: per-avond
    kind: fact
    en:
      title: "More than 2"
      body: "Standard drinks in one sitting raise your risk of harm, like injuries, says the Canadian guidance."
    nl:
      title: "Meer dan 2"
      body: "Standaardglazen op één avond verhogen je kans op schade, zoals blessures, volgens de Canadese richtlijn."
    de:
      title: "Mehr als 2"
      body: "Standardgläser an einem Abend erhöhen laut Kanadas Richtlinie das Risiko für Schäden wie Verletzungen."
    es:
      title: "Más de 2"
      body: "Copas estándar en una sola ocasión suben el riesgo de daños, como lesiones, según la guía canadiense."
    fr:
      title: "Plus de 2"
      body: "Verres standard en une soirée augmentent le risque de dommages, comme les blessures, selon le repère canadien."
    pt:
      title: "Mais de 2"
      body: "Bebidas padrão de uma vez aumentam o risco de danos, como lesões, segundo a orientação canadiana."
    tr:
      title: "2'den fazla"
      body: "Tek seferde 2'den fazla standart içki, yaralanma gibi zarar riskini artırır. Kanada rehberi böyle diyor."

  - key: eiwit-redt-niet
    kind: myth
    en:
      title: "24% less"
      body: "Myth: protein cancels out a binge. In a small study, heavy drinking after training still cut muscle building 24%."
    nl:
      title: "24% minder"
      body: "Mythe: eiwit maakt een zuipavond goed. In een kleine studie remde veel drank na de training spieropbouw toch 24%."
    de:
      title: "24 % weniger"
      body: "Mythos: Protein macht ein Gelage wett. In einer kleinen Studie bremste viel Alkohol den Muskelaufbau trotzdem um 24 %."
    es:
      title: "24 % menos"
      body: "Mito: la proteína compensa una borrachera. En un estudio pequeño, beber mucho tras entrenar frenó el músculo un 24 %."
    fr:
      title: "24 % de moins"
      body: "Mythe : les protéines rattrapent une cuite. Dans une petite étude, boire beaucoup a quand même freiné le muscle de 24 %."
    pt:
      title: "24% menos"
      body: "Mito: a proteína compensa uma bebedeira. Num estudo pequeno, beber muito após treinar travou o músculo em 24%."
    tr:
      title: "%24 daha az"
      body: "Efsane: protein aşırı içmeyi telafi eder. Küçük bir çalışmada çok alkol, kas yapımını yine %24 düşürdü."

  - key: een-of-twee
    kind: fact
    en:
      title: "One or two drinks"
      body: "Studies on alcohol and muscle used heavy doses. None of them tested one or two drinks."
    nl:
      title: "Eén of twee glazen"
      body: "Studies naar alcohol en spieren gebruikten flinke hoeveelheden. Eén of twee glazen testte niemand."
    de:
      title: "Ein, zwei Gläser"
      body: "Studien zu Alkohol und Muskeln nutzten hohe Mengen. Ein oder zwei Gläser hat keine getestet."
    es:
      title: "Una o dos copas"
      body: "Los estudios sobre alcohol y músculo usaron dosis altas. Ninguno probó una o dos copas."
    fr:
      title: "Un ou deux verres"
      body: "Les études sur l'alcool et le muscle ont utilisé de fortes doses. Aucune n'a testé un ou deux verres."
    pt:
      title: "Uma ou duas bebidas"
      body: "Os estudos sobre álcool e músculo usaram doses altas. Nenhum testou uma ou duas bebidas."
    tr:
      title: "Bir iki kadeh"
      body: "Alkol ve kas çalışmalarında yüksek dozlar kullanıldı. Hiçbiri bir iki kadehi test etmedi."

  - key: kracht-en-spierpijn
    kind: myth
    en:
      title: "Strength"
      body: "Myth: drinking after training saps your strength. In most small studies it didn't, even at heavy doses. Two did."
    nl:
      title: "Kracht"
      body: "Mythe: drinken na de training kost je kracht. In de meeste kleine studies niet, zelfs bij veel drank. In twee wel."
    de:
      title: "Kraft"
      body: "Mythos: Trinken nach dem Training kostet Kraft. Meist nicht, selbst bei viel Alkohol. Nur zwei kleine Studien sahen das."
    es:
      title: "Fuerza"
      body: "Mito: beber tras entrenar te quita fuerza. En la mayoría de estudios pequeños no, ni con dosis altas. En dos sí."
    fr:
      title: "Force"
      body: "Mythe : boire après l'entraînement fait perdre de la force. Pas dans la plupart des petites études. Dans deux, si."
    pt:
      title: "Força"
      body: "Mito: beber depois do treino tira-te força. Na maioria dos estudos pequenos não, mesmo com doses altas. Em dois sim."
    tr:
      title: "Güç"
      body: "Efsane: antrenman sonrası içmek gücünü düşürür. Çoğu küçük çalışmada düşürmedi, yüksek dozda bile. İkisinde düşürdü."

  - key: standaardglas-canada
    kind: fact
    en:
      title: "13.45 g"
      body: "Pure alcohol in a Canadian standard drink. That's a 341 ml beer at 5% or a 142 ml glass of wine at 12%."
    nl:
      title: "13,45 gram"
      body: "Pure alcohol in een Canadees standaardglas. Dat is een biertje van 341 ml (5%) of 142 ml wijn (12%)."
    de:
      title: "13,45 g"
      body: "Reiner Alkohol in einem kanadischen Standardglas. Das sind 341 ml Bier (5 %) oder 142 ml Wein (12 %)."
    es:
      title: "13,45 g"
      body: "De alcohol puro en una copa estándar canadiense. Es una cerveza de 341 ml (5 %) o 142 ml de vino (12 %)."
    fr:
      title: "13,45 g"
      body: "D'alcool pur dans un verre standard canadien. Soit une bière de 341 ml (5 %) ou 142 ml de vin (12 %)."
    pt:
      title: "13,45 g"
      body: "De álcool puro numa bebida padrão canadiana. É uma cerveja de 341 ml (5%) ou 142 ml de vinho (12%)."
    tr:
      title: "13,45 g"
      body: "Kanada'da bir standart içkideki saf alkol. 341 ml bira (%5) ya da 142 ml şarap (%12) kadar."

  - key: gram-per-land
    kind: fact
    en:
      title: "8 to 20 g"
      body: "Pure alcohol in one standard drink, depending on the country. Check the grams before comparing with any limit."
    nl:
      title: "8 tot 20 gram"
      body: "Pure alcohol in één standaardglas, afhankelijk van het land. Kijk naar de grammen voor je een grens vergelijkt."
    de:
      title: "8 bis 20 g"
      body: "Reiner Alkohol in einem Standardglas, je nach Land. Schau auf die Gramm, bevor du mit einem Limit vergleichst."
    es:
      title: "8 a 20 g"
      body: "De alcohol puro en una copa estándar, según el país. Mira los gramos antes de comparar con un límite."
    fr:
      title: "8 à 20 g"
      body: "D'alcool pur dans un verre standard, selon le pays. Regarde les grammes avant de comparer à une limite."
    pt:
      title: "8 a 20 g"
      body: "De álcool puro numa bebida padrão, conforme o país. Vê os gramas antes de comparar com um limite."
    tr:
      title: "8-20 g"
      body: "Ülkeye göre bir standart içkideki saf alkol. Bir sınırla karşılaştırmadan önce gramı kontrol et."

  - key: glas-is-geen-glas
    kind: myth
    en:
      title: "A big pour"
      body: "Myth: a glass of wine is one drink. A bigger pour or a stronger wine counts as more than one."
    nl:
      title: "Een vol glas"
      body: "Mythe: een glas wijn is één standaardglas. Een ruim glas of sterkere wijn telt als meer dan één."
    de:
      title: "Ein volles Glas"
      body: "Mythos: Ein Glas Wein ist ein Standardglas. Ein größeres Glas oder stärkerer Wein zählt als mehr."
    es:
      title: "Una copa llena"
      body: "Mito: una copa de vino es una copa estándar. Una copa más llena o un vino más fuerte cuenta como más."
    fr:
      title: "Un verre bien servi"
      body: "Mythe : un verre de vin, c'est un verre standard. Plus rempli ou plus fort, il compte pour plus d'un."
    pt:
      title: "Um copo cheio"
      body: "Mito: um copo de vinho é uma bebida padrão. Um copo mais cheio ou vinho mais forte conta como mais."
    tr:
      title: "Dolu bir kadeh"
      body: "Efsane: bir kadeh şarap bir standart içkidir. Daha dolu kadeh ya da daha sert şarap birden fazla sayılır."

  - key: nul-is-veiligst
    kind: fact
    en:
      title: "Zero"
      body: "No alcohol is safest when you drive, use machinery or take medicine that interacts with it."
    nl:
      title: "Nul"
      body: "Geen alcohol is het veiligst als je rijdt, met machines werkt of medicijnen slikt die ermee botsen."
    de:
      title: "Null"
      body: "Kein Alkohol ist am sichersten, wenn du fährst, Maschinen bedienst oder Medikamente nimmst, die sich nicht vertragen."
    es:
      title: "Cero"
      body: "Sin alcohol es lo más seguro si conduces, usas maquinaria o tomas medicación que interactúa con él."
    fr:
      title: "Zéro"
      body: "Pas d'alcool, c'est le plus sûr si tu conduis, utilises une machine ou prends un médicament qui interagit."
    pt:
      title: "Zero"
      body: "Sem álcool é o mais seguro se conduzes, usas máquinas ou tomas medicação que interage com ele."
    tr:
      title: "Sıfır"
      body: "Araç kullanırken, makine çalıştırırken ya da etkileşen ilaç alırken en güvenlisi hiç alkol almamak."

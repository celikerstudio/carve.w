  bron: issn-diets-2017
  passage: "Larger caloric surpluses are more appropriate for untrained subjects who are primed for more dramatic progress in LM gain [136] and for those with a high level of NEAT [133]. On the other hand, smaller caloric surpluses are appropriate for more advanced trainees"

article: creatine
emoji: "🥄"
tips:
  - key: vol-na-weken
    kind: fact
    en:
      title: "3 to 5 g"
      body: "Creatine a day is enough. Your muscles are full in 3 to 4 weeks, or 5 to 7 days with a loading week."
    nl:
      title: "3 tot 5 gram"
      body: "Creatine per dag is genoeg. Na 3 à 4 weken zitten je spieren vol, met een laadweek na 5 tot 7 dagen."
    de:
      title: "3 bis 5 g"
      body: "Kreatin am Tag reichen. Nach 3 bis 4 Wochen sind die Muskeln voll, mit Ladewoche nach 5 bis 7 Tagen."
    es:
      title: "3 a 5 g"
      body: "De creatina al día bastan. Tus músculos se llenan en 3 o 4 semanas, o en 5 a 7 días con carga."
    fr:
      title: "3 à 5 g"
      body: "De créatine par jour suffisent. Muscles pleins en 3 à 4 semaines, ou 5 à 7 jours avec une phase de charge."
    pt:
      title: "3 a 5 g"
      body: "De creatina por dia chegam. Os músculos enchem em 3 a 4 semanas, ou 5 a 7 dias com carga."
    tr:
      title: "3-5 g"
      body: "Günde bu kadar kreatin yeter. Kasların 3-4 haftada dolar, yükleme haftasıyla 5-7 günde."

  - key: nieren
    kind: myth
    en:
      title: "Kidneys"
      body: "Myth: creatine harms healthy kidneys. In 20 trials kidney function didn't change. Blood creatinine does rise a bit."
    nl:
      title: "Nieren"
      body: "Mythe: creatine is slecht voor gezonde nieren. In 20 studies veranderde de nierfunctie niet. Creatinine stijgt wel wat."
    de:
      title: "Nieren"
      body: "Mythos: Kreatin schadet gesunden Nieren. In 20 Studien blieb die Nierenfunktion gleich. Kreatinin steigt etwas."
    es:
      title: "Riñones"
      body: "Mito: la creatina daña riñones sanos. En 20 ensayos la función renal no cambió. La creatinina sí sube un poco."
    fr:
      title: "Reins"
      body: "Mythe : la créatine abîme des reins sains. Sur 20 essais, la fonction rénale n'a pas bougé. La créatinine monte un peu."
    pt:
      title: "Rins"
      body: "Mito: a creatina faz mal a rins saudáveis. Em 20 ensaios a função renal não mudou. A creatinina sobe um pouco."
    tr:
      title: "Böbrekler"
      body: "Efsane: kreatin sağlıklı böbreklere zarar verir. 20 çalışmada böbrek fonksiyonu değişmedi. Kreatinin biraz artar."

  - key: haaruitval
    kind: myth
    en:
      title: "Hair loss"
      body: "Myth: creatine makes your hair fall out. In a 12-week trial, creatine didn't change hair growth."
    nl:
      title: "Haaruitval"
      body: "Mythe: creatine geeft haaruitval. In een studie van 12 weken veranderde de haargroei niet."
    de:
      title: "Haarausfall"
      body: "Mythos: Kreatin macht Haarausfall. In einer 12-Wochen-Studie blieb das Haarwachstum gleich."
    es:
      title: "Caída del pelo"
      body: "Mito: la creatina hace que se te caiga el pelo. En un ensayo de 12 semanas, el crecimiento del pelo no cambió."
    fr:
      title: "Chute de cheveux"
      body: "Mythe : la créatine fait tomber les cheveux. Dans un essai de 12 semaines, la pousse n'a pas changé."
    pt:
      title: "Queda de cabelo"
      body: "Mito: a creatina faz cair o cabelo. Num ensaio de 12 semanas, o crescimento do cabelo não mudou."
    tr:
      title: "Saç dökülmesi"
      body: "Efsane: kreatin saç döker. 12 haftalık bir çalışmada saç büyümesi değişmedi."

  - key: monohydraat
    kind: fact
    en:
      title: "Monohydrate"
      body: "Pricier forms don't get more creatine into your muscle. Your gut already absorbs almost all of a normal dose."
    nl:
      title: "Monohydraat"
      body: "Duurdere vormen krijgen niet meer creatine in je spieren. Je darmen nemen een normale dosis al bijna helemaal op."
    de:
      title: "Monohydrat"
      body: "Teurere Formen bringen nicht mehr Kreatin in den Muskel. Der Darm nimmt eine normale Dosis fast ganz auf."
    es:
      title: "Monohidrato"
      body: "Las formas más caras no meten más creatina en el músculo. Tu intestino ya absorbe casi toda una dosis normal."
    fr:
      title: "Monohydrate"
      body: "Les formes plus chères n'en mettent pas plus dans le muscle. L'intestin absorbe déjà presque toute une dose normale."
    pt:
      title: "Mono-hidrato"
      body: "As formas mais caras não metem mais creatina no músculo. O intestino já absorve quase toda uma dose normal."
    tr:
      title: "Monohidrat"
      body: "Daha pahalı formlar kasa daha çok kreatin taşımaz. Bağırsağın normal bir dozun neredeyse tamamını emer."

  - key: weegschaal
    kind: fact
    en:
      title: "0.5 to 1 kg"
      body: "The scale can rise that much in your first week. That's mostly water in your muscles, not fat."
    nl:
      title: "0,5 tot 1 kilo"
      body: "Zoveel kan de weegschaal in je eerste week stijgen. Dat is vooral water in je spieren, geen vet."
    de:
      title: "0,5 bis 1 kg"
      body: "So viel kann die Waage in der ersten Woche steigen. Das ist vor allem Wasser im Muskel, kein Fett."
    es:
      title: "0,5 a 1 kg"
      body: "Es lo que puede subir la báscula la primera semana. Sobre todo es agua en el músculo, no grasa."
    fr:
      title: "0,5 à 1 kg"
      body: "La balance peut monter d'autant la première semaine. C'est surtout de l'eau dans le muscle, pas du gras."
    pt:
      title: "0,5 a 1 kg"
      body: "É o que a balança pode subir na primeira semana. É sobretudo água nos músculos, não gordura."
    tr:
      title: "0,5-1 kg"
      body: "İlk haftada tartı bu kadar artabilir. Bu çoğunlukla kaslarındaki su, yağ değil."

  - key: bloedprikken
    kind: fact
    en:
      title: "Blood test"
      body: "Say you take creatine. Your creatinine will be a bit higher, and that can look like a kidney problem."
    nl:
      title: "Bloedprikken"
      body: "Zeg dat je creatine neemt. Je creatinine is dan wat hoger, en dat kan lijken op een nierprobleem."
    de:
      title: "Blutabnahme"
      body: "Sag, dass du Kreatin nimmst. Dein Kreatinin ist dann etwas höher, und das kann nach Nierenproblem aussehen."
    es:
      title: "Análisis de sangre"
      body: "Di que tomas creatina. Tu creatinina saldrá algo alta, y puede parecer un problema renal."
    fr:
      title: "Prise de sang"
      body: "Dis que tu prends de la créatine. Ta créatinine sera un peu haute, ce qui peut évoquer un souci rénal."
    pt:
      title: "Análises ao sangue"
      body: "Diz que tomas creatina. A creatinina vai estar mais alta, e isso pode parecer um problema renal."
    tr:
      title: "Kan tahlili"
      body: "Kreatin kullandığını söyle. Kreatinin biraz yüksek çıkar ve bu böbrek sorunu gibi görünebilir."

  - key: stoppen
    kind: fact
    en:
      title: "4 to 6 weeks"
      body: "After stopping, your stores drop back to normal in that time. Not lower: your own production keeps working."
    nl:
      title: "4 tot 6 weken"
      body: "Na het stoppen zakt je voorraad in die tijd terug naar normaal. Niet lager: je eigen aanmaak werkt gewoon door."
    de:
      title: "4 bis 6 Wochen"
      body: "Nach dem Absetzen sinken die Speicher in der Zeit auf normal. Nicht tiefer: die eigene Bildung läuft weiter."
    es:
      title: "4 a 6 semanas"
      body: "Tras dejarla, tus reservas vuelven a lo normal en ese tiempo. No más bajo: tu producción sigue igual."
    fr:
      title: "4 à 6 semaines"
      body: "Après l'arrêt, tes réserves reviennent à la normale. Pas plus bas : ta propre production continue."
    pt:
      title: "4 a 6 semanas"
      body: "Depois de parar, as reservas voltam ao normal nesse tempo. Não mais baixo: a tua produção continua."
    tr:
      title: "4-6 hafta"
      body: "Bıraktıktan sonra depoların bu sürede normale döner. Daha aşağı değil, kendi üretimin devam eder."

  - key: alleen-met-training
    kind: fact
    en:
      title: "With training"
      body: "Without it, creatine does little. It helps you train a bit harder, and that shows up after weeks."
    nl:
      title: "Met training"
      body: "Zonder training doet creatine weinig. Het helpt je net wat harder te trainen, en dat zie je na weken."
    de:
      title: "Mit Training"
      body: "Ohne Training bringt Kreatin wenig. Es hilft dir, etwas härter zu trainieren, und das zeigt sich nach Wochen."
    es:
      title: "Con entreno"
      body: "Sin entrenar, la creatina hace poco. Te ayuda a entrenar algo más duro, y eso se nota en semanas."
    fr:
      title: "Avec l'entraînement"
      body: "Sans entraînement, la créatine fait peu. Elle t'aide à pousser un peu plus, et ça se voit en quelques semaines."
    pt:
      title: "Com treino"
      body: "Sem treino, a creatina faz pouco. Ajuda-te a treinar um pouco mais forte, e isso nota-se ao fim de semanas."
    tr:
      title: "Antrenmanla"
      body: "Antrenman olmadan kreatin pek işe yaramaz. Biraz daha sıkı çalışmanı sağlar, sonucu haftalar sonra görürsün."

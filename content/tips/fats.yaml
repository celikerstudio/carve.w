article: fats
emoji: "🥑"
tips:
  - key: negen-kcal-per-gram
    kind: fact
    en:
      title: "9 kcal"
      body: "Per gram of fat, against 4 for carbs and protein. That's why fat is so dense."
    nl:
      title: "9 kcal"
      body: "Per gram vet, tegen 4 voor koolhydraten en eiwit. Daarom is vet zo compact."
    de:
      title: "9 kcal"
      body: "Pro Gramm Fett, gegenüber 4 bei Kohlenhydraten und Protein. Darum ist Fett so dicht."
    es:
      title: "9 kcal"
      body: "Por gramo de grasa, frente a 4 de hidratos y proteína. Por eso la grasa es tan densa."
    fr:
      title: "9 kcal"
      body: "Par gramme de gras, contre 4 pour glucides et protéines. D'où sa densité."
    pt:
      title: "9 kcal"
      body: "Por grama de gordura, contra 4 dos hidratos e da proteína. É por isso que a gordura é tão densa."
    tr:
      title: "9 kcal"
      body: "Yağın gramı başına, karbonhidrat ve proteinde 4. Yağın bu kadar yoğun olmasının sebebi."

  - key: niet-onder-twintig
    kind: fact
    en:
      title: "Under 20%"
      body: "Of calories from fat for long risks too few essential fatty acids and too little vitamin A, D and E."
    nl:
      title: "Onder 20%"
      body: "Calorieën uit vet, en dat lang? Dan riskeer je te weinig essentiële vetzuren en vitamine A, D en E."
    de:
      title: "Unter 20 %"
      body: "Kalorien aus Fett über lange Zeit riskieren zu wenig essenzielle Fettsäuren und Vitamin A, D und E."
    es:
      title: "Menos del 20 %"
      body: "De calorías de grasa durante mucho tiempo arriesga poca grasa esencial y vitaminas A, D y E."
    fr:
      title: "Sous 20 %"
      body: "De calories en gras longtemps, tu risques un manque d'acides gras essentiels et de vitamines A, D, E."
    pt:
      title: "Menos de 20%"
      body: "De calorias de gordura por muito tempo arrisca pouca gordura essencial e vitaminas A, D e E."
    tr:
      title: "%20'nin altı"
      body: "Kaloride uzun süre bu kadar az yağ, temel yağ asidi ve A, D, E vitamini eksikliği riski taşır."

  - key: vet-in-grammen
    kind: fact
    en:
      title: "56 g"
      body: "Of fat is 20% of 2,500 kcal. At 40% it's about 111 g."
    nl:
      title: "56 gram"
      body: "Vet is 20% van 2.500 kcal. Bij 40% is het zo'n 111 gram."
    de:
      title: "56 g"
      body: "Fett sind 20 % von 2.500 kcal. Bei 40 % sind es etwa 111 g."
    es:
      title: "56 g"
      body: "De grasa son el 20 % de 2.500 kcal. Al 40 % son unos 111 g."
    fr:
      title: "56 g"
      body: "De gras, c'est 20 % de 2 500 kcal. À 40 %, environ 111 g."
    pt:
      title: "56 g"
      body: "De gordura são 20% de 2.500 kcal. A 40% são cerca de 111 g."
    tr:
      title: "56 g"
      body: "Yağ, 2.500 kcal'nin %20'si. %40'ta yaklaşık 111 g."

  - key: check-het-percentage
    kind: fact
    en:
      title: "35 g"
      body: "That's 0.5 g of fat per kg at 70 kg, just 14% of 2,200 kcal. Check the percentage, not only the grams."
    nl:
      title: "35 gram"
      body: "Dat is 0,5 gram vet per kilo bij 70 kilo, maar 14% van 2.200 kcal. Kijk naar het percentage, niet alleen grammen."
    de:
      title: "35 g"
      body: "Das sind 0,5 g Fett pro kg bei 70 kg, nur 14 % von 2.200 kcal. Prüf den Anteil, nicht nur die Gramm."
    es:
      title: "35 g"
      body: "Son 0,5 g de grasa por kg con 70 kg, solo el 14 % de 2.200 kcal. Mira el porcentaje, no solo los gramos."
    fr:
      title: "35 g"
      body: "C'est 0,5 g de gras par kg à 70 kg, à peine 14 % de 2 200 kcal. Regarde le pourcentage, pas que les grammes."
    pt:
      title: "35 g"
      body: "São 0,5 g de gordura por kg com 70 kg, só 14% de 2.200 kcal. Vê a percentagem, não só os gramas."
    tr:
      title: "35 g"
      body: "70 kiloda kilo başına 0,5 g yağ, 2.200 kcal'nin sadece %14'ü. Sadece grama değil yüzdeye de bak."

  - key: vet-maakt-dik
    kind: myth
    en:
      title: "Fattening"
      body: "Myth: eating fat makes you fat. Energy in versus out decides that. Lots of fat just makes overeating easy."
    nl:
      title: "Dik van vet"
      body: "Mythe: vet eten maakt dik. Dat beslist energie erin tegen eruit. Veel vet maakt te veel eten alleen makkelijk."
    de:
      title: "Fett macht fett"
      body: "Mythos: Fett essen macht dick. Das entscheidet Energie rein gegen raus. Viel Fett macht Überessen nur leicht."
    es:
      title: "Engorda"
      body: "Mito: comer grasa engorda. Lo decide la energía que entra frente a la que sale. Mucha grasa facilita comer de más."
    fr:
      title: "Ça fait grossir"
      body: "Mythe : manger gras fait grossir. C'est l'énergie entrée contre dépensée qui décide. Le gras aide juste à trop manger."
    pt:
      title: "Engorda"
      body: "Mito: comer gordura engorda. Quem decide é a energia que entra contra a que sai. Muita gordura facilita comer demais."
    tr:
      title: "Kilo aldırır"
      body: "Efsane: yağ yemek kilo aldırır. Bunu alınan ve harcanan enerji belirler. Çok yağ sadece fazla yemeyi kolaylaştırır."

  - key: vet-en-testosteron
    kind: myth
    en:
      title: "Testosterone"
      body: "Myth: more fat means more muscle. Low fat lowers testosterone a little in men, but it's unclear that affects muscle."
    nl:
      title: "Testosteron"
      body: "Mythe: meer vet geeft meer spier. Weinig vet verlaagt testosteron bij mannen iets, maar of dat spier kost is onbekend."
    de:
      title: "Testosteron"
      body: "Mythos: Mehr Fett, mehr Muskeln. Wenig Fett senkt Testosteron bei Männern etwas, ob das Muskeln kostet, ist offen."
    es:
      title: "Testosterona"
      body: "Mito: más grasa es más músculo. Poca grasa baja algo la testosterona en hombres, pero no se sabe si afecta al músculo."
    fr:
      title: "Testostérone"
      body: "Mythe : plus de gras, plus de muscle. Peu de gras baisse un peu la testo chez l'homme. L'effet sur le muscle est flou."
    pt:
      title: "Testosterona"
      body: "Mito: mais gordura dá mais músculo. Pouca gordura baixa algo a testosterona nos homens. O efeito no músculo é incerto."
    tr:
      title: "Testosteron"
      body: "Efsane: daha çok yağ daha çok kas. Az yağ erkeklerde testosteronu biraz düşürür ama kasa etkisi belirsiz."

  - key: vetrijk-en-prestatie
    kind: myth
    en:
      title: "High-fat"
      body: "Myth: a high-fat diet boosts performance. Most evidence shows no benefit. Keto data is limited and mixed."
    nl:
      title: "Vetrijk"
      body: "Mythe: vetrijk eten verbetert je prestaties. Meestal zie je geen voordeel. Over keto zijn de data beperkt en wisselend."
    de:
      title: "Fettreich"
      body: "Mythos: Fettreiche Kost steigert die Leistung. Meist zeigt sich kein Vorteil. Zu Keto gibt es wenig und gemischte Daten."
    es:
      title: "Rica en grasa"
      body: "Mito: comer mucha grasa mejora el rendimiento. Casi todo indica que no. Sobre keto hay pocos datos y mixtos."
    fr:
      title: "Riche en gras"
      body: "Mythe : manger gras booste la perf. La plupart des données ne montrent aucun gain. Sur le keto, c'est maigre et mitigé."
    pt:
      title: "Rica em gordura"
      body: "Mito: comer muita gordura melhora o rendimento. A maioria das provas diz que não. Sobre keto há pouco e misto."
    tr:
      title: "Yağlı diyet"
      body: "Efsane: yağlı beslenme performansı artırır. Kanıtların çoğu fayda göstermiyor. Keto verisi az ve karışık."

  - key: verzadigd-vet
    kind: fact
    en:
      title: "10%"
      body: "Of your calories at most from saturated fat, says WHO. Swap butter and fatty meat for oil and nuts."
    nl:
      title: "10%"
      body: "Van je calorieën uit verzadigd vet is het maximum, zegt de WHO. Ruil boter en vet vlees voor olie en noten."
    de:
      title: "10 %"
      body: "Deiner Kalorien höchstens aus gesättigtem Fett, sagt die WHO. Tausch Butter und fettes Fleisch gegen Öl und Nüsse."
    es:
      title: "10 %"
      body: "De tus calorías como mucho de grasa saturada, dice la OMS. Cambia mantequilla y carne grasa por aceite y frutos secos."
    fr:
      title: "10 %"
      body: "De tes calories en gras saturés au maximum, dit l'OMS. Remplace beurre et viande grasse par huile et noix."
    pt:
      title: "10%"
      body: "Das tuas calorias no máximo de gordura saturada, diz a OMS. Troca manteiga e carne gorda por azeite e frutos secos."
    tr:
      title: "%10"
      body: "DSÖ'ye göre kalorinin en fazla bu kadarı doymuş yağdan gelmeli. Tereyağı ve yağlı eti yağ ve kuruyemişle değiştir."

  - key: transvet
    kind: fact
    en:
      title: "1%"
      body: "Of your calories is WHO's ceiling for trans fat. It raises LDL cholesterol about as much as saturated fat."
    nl:
      title: "1%"
      body: "Van je calorieën is de WHO-grens voor transvet. Het verhoogt LDL-cholesterol ongeveer net zo hard als verzadigd vet."
    de:
      title: "1 %"
      body: "Deiner Kalorien ist die WHO-Grenze für Transfett. Es erhöht LDL etwa so stark wie gesättigtes Fett."
    es:
      title: "1 %"
      body: "De tus calorías es el techo de la OMS para las grasas trans. Suben el LDL casi como la grasa saturada."
    fr:
      title: "1 %"
      body: "De tes calories, c'est le plafond de l'OMS pour les gras trans. Ils montent le LDL presque autant que les saturés."
    pt:
      title: "1%"
      body: "Das tuas calorias é o teto da OMS para gordura trans. Sobe o LDL quase tanto como a gordura saturada."
    tr:
      title: "%1"
      body: "DSÖ'nün trans yağ için kalori sınırı. LDL kolesterolü doymuş yağ kadar yükseltir."

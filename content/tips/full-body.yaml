article: full-body
emoji: "🧍"
tips:
  - key: drie-keer-per-week
    kind: fact
    en:
      title: "3 times a week"
      body: "Full body hits most major muscles every session. So each muscle gets three touches a week."
    nl:
      title: "3 keer per week"
      body: "Full body raakt elke training de meeste grote spieren. Zo krijgt elke spier drie prikkels per week."
    de:
      title: "3-mal pro Woche"
      body: "Ganzkörper trifft jede Einheit die meisten großen Muskeln. Jeder Muskel bekommt drei Reize pro Woche."
    es:
      title: "3 veces por semana"
      body: "El cuerpo completo trabaja casi todos los músculos grandes cada sesión. Cada uno, tres veces."
    fr:
      title: "3 fois par semaine"
      body: "Le full body touche la plupart des gros muscles à chaque séance. Chaque muscle bosse trois fois."
    pt:
      title: "3 vezes por semana"
      body: "O corpo inteiro treina quase todos os músculos grandes em cada treino. Cada um, três vezes."
    tr:
      title: "Haftada 3"
      body: "Tüm vücut her antrenmanda büyük kasların çoğunu çalıştırır. Her kas haftada üç kez uyarılır."

  - key: sessie-opbouw
    kind: fact
    en:
      title: "3 to 4 lifts"
      body: "Compound ones form the base: a squat or hinge, a push and a pull. Then add 2 to 4 accessories."
    nl:
      title: "3 tot 4 oefeningen"
      body: "Samengestelde vormen de basis: een squat of hinge, een duw en een trek. Daarna 2 tot 4 accessoires."
    de:
      title: "3 bis 4 Übungen"
      body: "Grundübungen sind die Basis: Kniebeuge oder Hüftbeuge, Drücken, Ziehen. Dann 2 bis 4 Zusatzübungen."
    es:
      title: "3 a 4 ejercicios"
      body: "Compuestos como base: sentadilla o bisagra, un empuje y un tirón. Luego 2 a 4 accesorios."
    fr:
      title: "3 à 4 exercices"
      body: "Des polyarticulaires en base : squat ou hinge, une poussée, un tirage. Puis 2 à 4 accessoires."
    pt:
      title: "3 a 4 exercícios"
      body: "Compostos na base: agachamento ou hinge, um empurrar e um puxar. Depois 2 a 4 acessórios."
    tr:
      title: "3-4 hareket"
      body: "Temel bileşik hareketler: squat ya da hinge, bir itiş ve bir çekiş. Sonra 2-4 yardımcı hareket."

  - key: zware-lift-rouleren
    kind: fact
    en:
      title: "Day 1 squat"
      body: "Day 2 press, day 3 hinge. A different heavy lift each day keeps fatigue in check."
    nl:
      title: "Dag 1 squat"
      body: "Dag 2 drukken, dag 3 hinge. Elke dag een andere zware oefening houdt vermoeidheid in toom."
    de:
      title: "Tag 1 Kniebeuge"
      body: "Tag 2 Drücken, Tag 3 Hüftbeuge. Jeden Tag eine andere schwere Übung hält die Ermüdung im Griff."
    es:
      title: "Día 1 sentadilla"
      body: "Día 2 press, día 3 bisagra. Un ejercicio pesado distinto cada día controla la fatiga."
    fr:
      title: "Jour 1 squat"
      body: "Jour 2 développé, jour 3 hinge. Un gros mouvement différent chaque jour garde la fatigue sous contrôle."
    pt:
      title: "Dia 1 agachamento"
      body: "Dia 2 press, dia 3 hinge. Um exercício pesado diferente por dia controla a fadiga."
    tr:
      title: "1. gün squat"
      body: "2. gün press, 3. gün hinge. Her gün farklı bir ağır hareket yorgunluğu kontrol altında tutar."

  - key: niet-alles-zwaar
    kind: myth
    en:
      title: "Week 2 or 3"
      body: "Myth: go heavy on every lift, every session. That's a common way to burn out by week 2 or 3."
    nl:
      title: "Week 2 of 3"
      body: "Mythe: elke oefening, elke training zwaar. Zo brand je vaak al op in week 2 of 3."
    de:
      title: "Woche 2 oder 3"
      body: "Mythos: Jede Übung, jede Einheit schwer. So brennt man oft schon in Woche 2 oder 3 aus."
    es:
      title: "Semana 2 o 3"
      body: "Mito: todo pesado en cada sesión. Así muchos se queman en la semana 2 o 3."
    fr:
      title: "Semaine 2 ou 3"
      body: "Mythe : tout lourd à chaque séance. C'est souvent comme ça qu'on craque dès la semaine 2 ou 3."
    pt:
      title: "Semana 2 ou 3"
      body: "Mito: tudo pesado em cada treino. É assim que muitos se esgotam na semana 2 ou 3."
    tr:
      title: "2. ya da 3. hafta"
      body: "Efsane: her antrenmanda her hareket ağır. Çoğu kişi böyle 2. ya da 3. haftada tükenir."

  - key: herhalingen
    kind: fact
    en:
      title: "6 to 12 reps"
      body: "On your compound lifts. Accessories can go higher, from 8 to 20."
    nl:
      title: "6 tot 12 herhalingen"
      body: "Op je samengestelde oefeningen. Accessoires mogen hoger, van 8 tot 20."
    de:
      title: "6 bis 12 Wdh."
      body: "Bei den Grundübungen. Zusatzübungen dürfen höher gehen, 8 bis 20."
    es:
      title: "6 a 12 repeticiones"
      body: "En los compuestos. Los accesorios pueden ir más alto, de 8 a 20."
    fr:
      title: "6 à 12 reps"
      body: "Sur les polyarticulaires. Les accessoires peuvent monter de 8 à 20."
    pt:
      title: "6 a 12 repetições"
      body: "Nos compostos. Os acessórios podem ir mais alto, de 8 a 20."
    tr:
      title: "6-12 tekrar"
      body: "Bileşik hareketlerde. Yardımcı hareketler 8 ile 20 arası olabilir."

  - key: niet-te-veel-accessoires
    kind: myth
    en:
      title: "2 to 4"
      body: "Myth: more accessories make a better workout. Too many lead to rushed form. Keep it to 2 to 4 per session."
    nl:
      title: "2 tot 4"
      body: "Mythe: meer accessoires is een betere training. Te veel geeft gehaaste techniek. Houd het bij 2 tot 4."
    de:
      title: "2 bis 4"
      body: "Mythos: Mehr Zusatzübungen, besseres Training. Zu viele machen die Technik hastig. Bleib bei 2 bis 4."
    es:
      title: "2 a 4"
      body: "Mito: más accesorios es mejor entreno. Demasiados dan técnica con prisa. Quédate en 2 a 4."
    fr:
      title: "2 à 4"
      body: "Mythe : plus d'accessoires, meilleure séance. Trop, et la technique se bâcle. Reste à 2 à 4."
    pt:
      title: "2 a 4"
      body: "Mito: mais acessórios é melhor treino. Demasiados dão técnica apressada. Fica nos 2 a 4."
    tr:
      title: "2-4"
      body: "Efsane: daha çok yardımcı hareket daha iyi antrenman. Fazlası formu aceleye getirir. 2-4'te kal."

  - key: slaap-en-eten
    kind: fact
    en:
      title: "Sleep and food"
      body: "Training every muscle three times a week leans on both. They make that frequency sustainable."
    nl:
      title: "Slaap en eten"
      body: "Elke spier drie keer per week trainen leunt op allebei. Zij maken die frequentie vol te houden."
    de:
      title: "Schlaf und Essen"
      body: "Jeden Muskel dreimal pro Woche zu trainieren hängt an beidem. Sie machen das durchhaltbar."
    es:
      title: "Sueño y comida"
      body: "Entrenar cada músculo tres veces por semana depende de ambos. Hacen sostenible esa frecuencia."
    fr:
      title: "Sommeil et repas"
      body: "Travailler chaque muscle trois fois par semaine repose sur les deux. Ils rendent ça tenable."
    pt:
      title: "Sono e comida"
      body: "Treinar cada músculo três vezes por semana depende de ambos. Tornam essa frequência sustentável."
    tr:
      title: "Uyku ve yemek"
      body: "Her kası haftada üç kez çalıştırmak ikisine dayanır. Bu sıklığı sürdürülebilir kılan onlar."

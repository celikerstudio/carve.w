article: cutting
emoji: "🥗"
tips:
  - key: tekort-grootte
    kind: fact
    en:
      title: "300 to 600 kcal"
      body: "Below maintenance is enough for a cut. You'll lose about 0.5 to 1% of your bodyweight a week."
    nl:
      title: "300 tot 600 kcal"
      body: "Onder onderhoud is genoeg om te cutten. Zo verlies je zo'n 0,5 tot 1% van je gewicht per week."
    de:
      title: "300 bis 600 kcal"
      body: "Unter dem Erhaltungsbedarf reichen für eine Diät. So verlierst du etwa 0,5 bis 1 % pro Woche."
    es:
      title: "300 a 600 kcal"
      body: "Por debajo del mantenimiento bastan para definir. Perderás un 0,5 a 1 % de tu peso por semana."
    fr:
      title: "300 à 600 kcal"
      body: "Sous la maintenance suffisent pour une sèche. Tu perdras environ 0,5 à 1 % de ton poids par semaine."
    pt:
      title: "300 a 600 kcal"
      body: "Abaixo da manutenção chegam para um cut. Vais perder cerca de 0,5 a 1% do teu peso por semana."
    tr:
      title: "300-600 kcal"
      body: "Koruma kalorisinin bu kadar altı cut için yeter. Haftada vücut ağırlığının %0,5-1'ini verirsin."

  - key: spier-houden
    kind: fact
    en:
      title: "1.6 to 2.2 g"
      body: "Protein per kg, plus lifting 2 to 4 times a week. That protects your muscle while you lose fat."
    nl:
      title: "1,6 tot 2,2 gram"
      body: "Eiwit per kilo, plus 2 tot 4 keer per week krachttraining. Zo bescherm je je spieren terwijl je vet verliest."
    de:
      title: "1,6 bis 2,2 g"
      body: "Protein pro kg, dazu 2- bis 4-mal pro Woche Krafttraining. So schützt du deine Muskeln beim Fettabbau."
    es:
      title: "1,6 a 2,2 g"
      body: "De proteína por kg, más pesas 2 a 4 veces por semana. Así proteges el músculo mientras pierdes grasa."
    fr:
      title: "1,6 à 2,2 g"
      body: "De protéines par kg, plus 2 à 4 séances de muscu par semaine. Ça protège ton muscle pendant la sèche."
    pt:
      title: "1,6 a 2,2 g"
      body: "De proteína por kg, mais treino de força 2 a 4 vezes por semana. Assim proteges o músculo enquanto perdes gordura."
    tr:
      title: "1,6-2,2 g"
      body: "Kilo başına protein, artı haftada 2-4 ağırlık antrenmanı. Yağ kaybederken kasını böyle korursun."

  - key: harder-is-niet-beter
    kind: myth
    en:
      title: "Harder"
      body: "Myth: the harder the cut, the better. A moderate deficit keeps your sleep, training and willpower in better shape."
    nl:
      title: "Harder"
      body: "Mythe: hoe harder de cut, hoe beter. Een gematigd tekort houdt je slaap, training en wilskracht beter op peil."
    de:
      title: "Härter"
      body: "Mythos: Je härter die Diät, desto besser. Ein moderates Defizit schont Schlaf, Training und Willenskraft."
    es:
      title: "Más duro"
      body: "Mito: cuanto más dura la definición, mejor. Un déficit moderado cuida mejor tu sueño, tu entreno y tu voluntad."
    fr:
      title: "Plus dur"
      body: "Mythe : plus la sèche est dure, mieux c'est. Un déficit modéré préserve mieux sommeil, entraînement et volonté."
    pt:
      title: "Mais duro"
      body: "Mito: quanto mais duro o cut, melhor. Um défice moderado protege melhor o sono, o treino e a força de vontade."
    tr:
      title: "Daha sert"
      body: "Efsane: cut ne kadar sertse o kadar iyi. Ilımlı bir açık uykunu, antrenmanını ve iradeni daha iyi korur."

  - key: koolhydraten-niet-schrappen
    kind: myth
    en:
      title: "No carbs"
      body: "Myth: cutting means dropping carbs. Too few and your training suffers. After protein and fat, the rest goes to carbs."
    nl:
      title: "Geen koolhydraten"
      body: "Mythe: cutten is koolhydraten schrappen. Te weinig en je training lijdt. Na eiwit en vet gaat de rest naar koolhydraten."
    de:
      title: "Keine Kohlenhydrate"
      body: "Mythos: Diät heißt Kohlenhydrate streichen. Zu wenig, und das Training leidet. Nach Protein und Fett kommt der Rest."
    es:
      title: "Sin hidratos"
      body: "Mito: definir es quitar hidratos. Con muy pocos tu entreno sufre. Tras proteína y grasa, el resto va a hidratos."
    fr:
      title: "Zéro glucides"
      body: "Mythe : sécher, c'est couper les glucides. Trop peu et l'entraînement trinque. Après protéines et gras, le reste y va."
    pt:
      title: "Sem hidratos"
      body: "Mito: fazer cut é cortar hidratos. Com poucos o treino sofre. Depois da proteína e gordura, o resto vai para hidratos."
    tr:
      title: "Karbonhidratsız"
      body: "Efsane: cut karbonhidratı kesmektir. Çok az olursa antrenman bozulur. Protein ve yağdan sonra kalan karbonhidrata gider."

  - key: weekgemiddelde
    kind: fact
    en:
      title: "Weekly average"
      body: "One weigh-in tells you little. Go by your weekly average so daily noise doesn't make you overreact."
    nl:
      title: "Weekgemiddelde"
      body: "Eén weging zegt weinig. Kijk naar je weekgemiddelde, zodat dagelijkse schommelingen je niet laten schrikken."
    de:
      title: "Wochenschnitt"
      body: "Eine Messung sagt wenig. Schau auf den Wochenschnitt, damit dich tägliche Schwankungen nicht verunsichern."
    es:
      title: "Media semanal"
      body: "Un pesaje dice poco. Guíate por tu media semanal para no reaccionar de más al ruido diario."
    fr:
      title: "Moyenne hebdo"
      body: "Une pesée dit peu de choses. Suis ta moyenne de la semaine pour ne pas surréagir aux variations du jour."
    pt:
      title: "Média semanal"
      body: "Uma pesagem diz pouco. Guia-te pela média semanal para não reagires demais às oscilações diárias."
    tr:
      title: "Haftalık ortalama"
      body: "Tek tartı pek bir şey söylemez. Günlük oynamalara aşırı tepki vermemek için haftalık ortalamaya bak."

  - key: vastgelopen
    kind: fact
    en:
      title: "2 weeks flat"
      body: "Weekly average stuck that long? Adjust by 100 to 200 kcal. No need for a big jump."
    nl:
      title: "2 weken stil"
      body: "Staat je weekgemiddelde zo lang stil? Pas 100 tot 200 kcal aan. Een grote sprong is niet nodig."
    de:
      title: "2 Wochen Stillstand"
      body: "Steht der Wochenschnitt so lange? Pass 100 bis 200 kcal an. Ein großer Sprung ist nicht nötig."
    es:
      title: "2 semanas parado"
      body: "¿Tu media semanal no se mueve en ese tiempo? Ajusta 100 a 200 kcal. No hace falta un gran salto."
    fr:
      title: "2 semaines à plat"
      body: "Ta moyenne ne bouge plus depuis ? Ajuste de 100 à 200 kcal. Pas besoin d'un gros saut."
    pt:
      title: "2 semanas parado"
      body: "A média semanal não mexe há esse tempo? Ajusta 100 a 200 kcal. Não precisas de um grande salto."
    tr:
      title: "2 hafta sabit"
      body: "Haftalık ortalaman bu kadar süredir duruyorsa 100-200 kcal ayarla. Büyük bir sıçrama gerekmez."

  - key: vezels-tegen-honger
    kind: fact
    en:
      title: "10 to 15 g"
      body: "Fibre per 1,000 kcal on a cut. With enough water, it helps keep hunger in check."
    nl:
      title: "10 tot 15 gram"
      body: "Vezels per 1.000 kcal tijdens het cutten. Met genoeg water houdt dat je honger in toom."
    de:
      title: "10 bis 15 g"
      body: "Ballaststoffe pro 1.000 kcal in der Diät. Mit genug Wasser hält das den Hunger in Schach."
    es:
      title: "10 a 15 g"
      body: "De fibra por cada 1.000 kcal al definir. Con suficiente agua, ayuda a controlar el hambre."
    fr:
      title: "10 à 15 g"
      body: "De fibres pour 1 000 kcal en sèche. Avec assez d'eau, ça aide à tenir la faim."
    pt:
      title: "10 a 15 g"
      body: "De fibra por cada 1.000 kcal no cut. Com água suficiente, ajuda a controlar a fome."
    tr:
      title: "10-15 g"
      body: "Cut sırasında 1.000 kcal başına lif. Yeterli suyla açlığı kontrol altında tutar."

  - key: stappen-gelijk
    kind: fact
    en:
      title: "Steps"
      body: "Keep your daily steps steady while dieting. Otherwise activity quietly drops and hides part of your deficit."
    nl:
      title: "Stappen"
      body: "Houd je stappen per dag gelijk tijdens het lijnen. Anders zakt je activiteit ongemerkt en eet die je tekort op."
    de:
      title: "Schritte"
      body: "Halt deine Schritte in der Diät konstant. Sonst sinkt die Aktivität unbemerkt und frisst einen Teil des Defizits."
    es:
      title: "Pasos"
      body: "Mantén tus pasos diarios en la dieta. Si no, tu actividad baja sin notarlo y se come parte del déficit."
    fr:
      title: "Les pas"
      body: "Garde tes pas quotidiens stables en sèche. Sinon ton activité baisse en douce et mange une partie du déficit."
    pt:
      title: "Passos"
      body: "Mantém os passos diários durante a dieta. Senão a atividade cai sem dares por isso e come parte do défice."
    tr:
      title: "Adımlar"
      body: "Diyetteyken günlük adımını sabit tut. Yoksa aktivite fark etmeden düşer ve açığının bir kısmını yer."

article: testosterone-boosters
emoji: "🧴"
tips:
  - key: meeste-boosters-werken-niet
    kind: myth
    en:
      title: "52 studies"
      body: "Myth: a booster raises your testosterone. Most failed to raise it compared with placebo, in a review."
    nl:
      title: "52 studies"
      body: "Mythe: een booster verhoogt je testosteron. De meeste deden dat niet beter dan placebo, in een review."
    de:
      title: "52 Studien"
      body: "Mythos: Ein Booster erhöht dein Testosteron. Die meisten schafften das nicht besser als Placebo."
    es:
      title: "52 estudios"
      body: "Mito: un potenciador sube tu testosterona. La mayoría no lo hizo mejor que el placebo, en una revisión."
    fr:
      title: "52 études"
      body: "Mythe : un booster fait monter la testostérone. La plupart n'ont pas fait mieux qu'un placebo."
    pt:
      title: "52 estudos"
      body: "Mito: um booster sobe a testosterona. A maioria não fez melhor do que o placebo, numa revisão."
    tr:
      title: "52 çalışma"
      body: "Efsane: booster testosteronu artırır. Bir derlemede çoğu plasebodan daha iyi değildi."

  - key: tribulus
    kind: myth
    en:
      title: "Tribulus"
      body: "Myth: tribulus makes you stronger. Human studies found no effect on strength or body composition."
    nl:
      title: "Tribulus"
      body: "Mythe: tribulus maakt je sterker. Studies bij mensen vonden geen effect op kracht of lichaamssamenstelling."
    de:
      title: "Tribulus"
      body: "Mythos: Tribulus macht stärker. Studien am Menschen fanden keinen Effekt auf Kraft oder Körperbau."
    es:
      title: "Tribulus"
      body: "Mito: el tribulus te hace más fuerte. Los estudios en personas no vieron efecto en fuerza ni composición."
    fr:
      title: "Tribulus"
      body: "Mythe : le tribulus rend plus fort. Les études chez l'humain n'ont vu aucun effet sur force ou physique."
    pt:
      title: "Tribulus"
      body: "Mito: o tribulus torna-te mais forte. Estudos em pessoas não viram efeito na força nem na composição."
    tr:
      title: "Tribulus"
      body: "Efsane: tribulus güçlendirir. İnsan çalışmaları güce ya da vücut kompozisyonuna etki bulmadı."

  - key: d-asparaginezuur
    kind: myth
    en:
      title: "6 g"
      body: "Myth: D-aspartic acid boosts testosterone. In men who lift, 6 g a day for 14 days even lowered it."
    nl:
      title: "6 gram"
      body: "Mythe: D-asparaginezuur verhoogt testosteron. Bij mannen die trainen verlaagde 6 gram per dag het zelfs."
    de:
      title: "6 g"
      body: "Mythos: D-Asparaginsäure erhöht Testosteron. Bei trainierenden Männern senkten 6 g am Tag es sogar."
    es:
      title: "6 g"
      body: "Mito: el ácido D-aspártico sube la testosterona. En hombres que entrenan, 6 g al día incluso la bajaron."
    fr:
      title: "6 g"
      body: "Mythe : l'acide D-aspartique booste la testo. Chez des hommes entraînés, 6 g par jour l'ont même baissée."
    pt:
      title: "6 g"
      body: "Mito: o ácido D-aspártico sobe a testosterona. Em homens que treinam, 6 g por dia até a baixaram."
    tr:
      title: "6 g"
      body: "Efsane: D-aspartik asit testosteronu artırır. Ağırlık çalışan erkeklerde günde 6 g onu düşürdü bile."

  - key: nooit-getest
    kind: fact
    en:
      title: "67 of 109"
      body: "Ingredients in 50 booster products had no testosterone studies at all."
    nl:
      title: "67 van 109"
      body: "Ingrediënten in 50 boosters waren nooit onderzocht op testosteron."
    de:
      title: "67 von 109"
      body: "Zutaten in 50 Boostern wurden nie auf Testosteron untersucht."
    es:
      title: "67 de 109"
      body: "Ingredientes de 50 potenciadores no tenían ningún estudio sobre testosterona."
    fr:
      title: "67 sur 109"
      body: "Ingrédients de 50 boosters n'avaient aucune étude sur la testostérone."
    pt:
      title: "67 de 109"
      body: "Ingredientes de 50 boosters não tinham nenhum estudo sobre testosterona."
    tr:
      title: "109'da 67"
      body: "50 booster ürünündeki içeriklerin bu kadarı testosteron açısından hiç incelenmemişti."

  - key: prohormonen-doping
    kind: fact
    en:
      title: "Drug test"
      body: "Prohormones lead to a positive test for anabolic steroids. They also seem to have no training value."
    nl:
      title: "Dopingtest"
      body: "Prohormonen leiden tot een positieve test op anabole steroïden. Ze lijken ook niets te doen voor je training."
    de:
      title: "Dopingtest"
      body: "Prohormone führen zu einem positiven Test auf Anabolika. Fürs Training bringen sie offenbar nichts."
    es:
      title: "Control antidopaje"
      body: "Las prohormonas dan positivo en esteroides anabolizantes. Y parecen no aportar nada al entreno."
    fr:
      title: "Contrôle antidopage"
      body: "Les prohormones rendent positif aux stéroïdes anabolisants. Et semblent inutiles pour l'entraînement."
    pt:
      title: "Controlo antidoping"
      body: "As pró-hormonas dão positivo em esteroides anabolizantes. E parecem não ajudar o treino."
    tr:
      title: "Doping testi"
      body: "Prohormonlar anabolik steroid testinde pozitif çıkarır. Antrenmana da bir faydası yok gibi."

  - key: prohormonen-hdl
    kind: fact
    en:
      title: "HDL"
      body: "Some prohormones may raise estrogen and lower your HDL cholesterol. Most show no effect on testosterone."
    nl:
      title: "HDL"
      body: "Sommige prohormonen verhogen mogelijk oestrogeen en verlagen je HDL-cholesterol. De meeste doen niets met testosteron."
    de:
      title: "HDL"
      body: "Manche Prohormone erhöhen womöglich Östrogen und senken HDL. Die meisten ändern am Testosteron nichts."
    es:
      title: "HDL"
      body: "Algunas prohormonas pueden subir los estrógenos y bajar tu HDL. La mayoría no cambia la testosterona."
    fr:
      title: "HDL"
      body: "Certaines prohormones peuvent monter les œstrogènes et baisser ton HDL. La plupart ne touchent pas la testo."
    pt:
      title: "HDL"
      body: "Algumas pró-hormonas podem subir o estrogénio e baixar o HDL. A maioria não mexe na testosterona."
    tr:
      title: "HDL"
      body: "Bazı prohormonlar östrojeni artırıp HDL kolesterolü düşürebilir. Çoğu testosteronu etkilemiyor."

  - key: laat-je-bloed-testen
    kind: fact
    en:
      title: "Blood test"
      body: "Think your testosterone is low? See your doctor. A blood test can tell you, a supplement can't."
    nl:
      title: "Bloedtest"
      body: "Denk je dat je testosteron laag is? Ga naar je arts. Een bloedtest kan dat laten zien, een supplement niet."
    de:
      title: "Bluttest"
      body: "Glaubst du, dein Testosteron ist niedrig? Geh zum Arzt. Ein Bluttest zeigt es, ein Supplement nicht."
    es:
      title: "Análisis de sangre"
      body: "¿Crees que tienes la testosterona baja? Ve al médico. Un análisis lo dice, un suplemento no."
    fr:
      title: "Prise de sang"
      body: "Tu penses avoir la testo basse ? Vois ton médecin. Une prise de sang le dira, un complément non."
    pt:
      title: "Análise ao sangue"
      body: "Achas que tens a testosterona baixa? Vai ao médico. Uma análise diz-te, um suplemento não."
    tr:
      title: "Kan testi"
      body: "Testosteronunun düşük olduğunu mu düşünüyorsun? Doktora git. Bunu kan testi söyler, takviye söylemez."

  - key: zink-in-boosters
    kind: fact
    en:
      title: "272%"
      body: "Of the daily zinc allowance was the median in 50 boosters. 13 went over an upper intake limit."
    nl:
      title: "272%"
      body: "Van de dagelijkse zinkhoeveelheid was de mediaan in 50 boosters. 13 gingen over een bovengrens."
    de:
      title: "272 %"
      body: "Der Tagesmenge an Zink steckten im Median in 50 Boostern. 13 lagen über einer Obergrenze."
    es:
      title: "272 %"
      body: "De la dosis diaria de zinc fue la mediana en 50 potenciadores. 13 superaban un límite máximo."
    fr:
      title: "272 %"
      body: "De l'apport quotidien en zinc, c'est la médiane de 50 boosters. 13 dépassaient une limite haute."
    pt:
      title: "272%"
      body: "Da dose diária de zinco foi a mediana em 50 boosters. 13 passavam um limite máximo."
    tr:
      title: "%272"
      body: "50 booster ürününde günlük çinko miktarının medyanı. 13'ü bir üst sınırı aştı."

  - key: fenegriek
    kind: fact
    en:
      title: "Fenugreek"
      body: "Two small studies in lifting men found better results. The ISSN says it's too early to tell."
    nl:
      title: "Fenegriek"
      body: "Twee kleine studies bij trainende mannen zagen betere resultaten. Volgens de ISSN is het te vroeg om te oordelen."
    de:
      title: "Bockshornklee"
      body: "Zwei kleine Studien bei trainierenden Männern sahen bessere Ergebnisse. Laut ISSN ist es zu früh."
    es:
      title: "Fenogreco"
      body: "Dos estudios pequeños en hombres que entrenaban vieron mejores resultados. La ISSN dice que es pronto."
    fr:
      title: "Fenugrec"
      body: "Deux petites études chez des hommes entraînés ont vu de meilleurs résultats. Trop tôt, dit l'ISSN."
    pt:
      title: "Feno-grego"
      body: "Dois estudos pequenos em homens que treinavam viram melhores resultados. A ISSN diz que é cedo."
    tr:
      title: "Çemen otu"
      body: "Ağırlık çalışan erkeklerde iki küçük çalışma daha iyi sonuç buldu. ISSN'ye göre karar vermek için erken."

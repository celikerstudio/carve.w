article: muscle-group-recovery-time
emoji: "🌱"
tips:
  - key: een-tot-drie-dagen
    kind: fact
    en:
      title: "24 to 72 hours"
      body: "Most muscles recover in that time between hard sessions. Volume, intensity and you decide where."
    nl:
      title: "24 tot 72 uur"
      body: "Zoveel hebben de meeste spieren nodig tussen zware trainingen. Volume, intensiteit en jijzelf bepalen waar."
    de:
      title: "24 bis 72 Stunden"
      body: "So lange brauchen die meisten Muskeln zwischen harten Einheiten. Volumen, Intensität und du entscheiden."
    es:
      title: "24 a 72 horas"
      body: "Es lo que tardan casi todos los músculos entre sesiones duras. Volumen, intensidad y tú decidís dónde."
    fr:
      title: "24 à 72 heures"
      body: "C'est ce qu'il faut à la plupart des muscles entre deux séances dures. Volume, intensité et toi décident."
    pt:
      title: "24 a 72 horas"
      body: "É o que a maioria dos músculos precisa entre treinos duros. Volume, intensidade e tu decidem onde."
    tr:
      title: "24-72 saat"
      body: "Çoğu kas sert antrenmanlar arasında bu sürede toparlanır. Hacim, yoğunluk ve sen belirlersin."

  - key: twee-tot-drie-keer
    kind: fact
    en:
      title: "2 to 3 times"
      body: "A week per muscle, 10 to 20 sets in total. Adjust if soreness or performance lags."
    nl:
      title: "2 tot 3 keer"
      body: "Per week per spier, met 10 tot 20 sets in totaal. Pas aan als spierpijn of prestatie achterblijft."
    de:
      title: "2- bis 3-mal"
      body: "Pro Woche und Muskel, insgesamt 10 bis 20 Sätze. Pass an, wenn Muskelkater oder Leistung hängt."
    es:
      title: "2 a 3 veces"
      body: "Por semana y músculo, 10 a 20 series en total. Ajusta si las agujetas o el rendimiento flojean."
    fr:
      title: "2 à 3 fois"
      body: "Par semaine et par muscle, 10 à 20 séries au total. Ajuste si courbatures ou perf traînent."
    pt:
      title: "2 a 3 vezes"
      body: "Por semana e músculo, 10 a 20 séries no total. Ajusta se as dores ou o rendimento falharem."
    tr:
      title: "2-3 kez"
      body: "Kas başına haftada, toplam 10-20 set. Ağrı ya da performans geride kalırsa ayarla."

  - key: wat-herstel-vertraagt
    kind: fact
    en:
      title: "Slower recovery"
      body: "More volume, heavy lowering work and exercises you're not used to all make a muscle need longer."
    nl:
      title: "Trager herstel"
      body: "Meer volume, zwaar excentrisch werk en oefeningen die je niet gewend bent laten een spier langer herstellen."
    de:
      title: "Langsamer erholt"
      body: "Mehr Volumen, schweres Absenken und ungewohnte Übungen lassen einen Muskel länger brauchen."
    es:
      title: "Recuperación lenta"
      body: "Más volumen, bajadas pesadas y ejercicios nuevos hacen que un músculo tarde más."
    fr:
      title: "Récup plus lente"
      body: "Plus de volume, des descentes lourdes et des exercices inhabituels rallongent la récup d'un muscle."
    pt:
      title: "Recuperação lenta"
      body: "Mais volume, descidas pesadas e exercícios novos fazem um músculo demorar mais."
    tr:
      title: "Yavaş toparlanma"
      body: "Daha çok hacim, ağır inişler ve alışık olmadığın hareketler kasın daha uzun toparlanmasına yol açar."

  - key: wat-herstel-versnelt
    kind: fact
    en:
      title: "7 to 9 hours"
      body: "Of sleep, enough protein and better conditioning all shorten how long a muscle needs."
    nl:
      title: "7 tot 9 uur"
      body: "Slaap, genoeg eiwit en een betere conditie maken de hersteltijd van een spier korter."
    de:
      title: "7 bis 9 Stunden"
      body: "Schlaf, genug Protein und bessere Fitness verkürzen, wie lange ein Muskel braucht."
    es:
      title: "7 a 9 horas"
      body: "De sueño, proteína suficiente y mejor forma acortan lo que necesita un músculo."
    fr:
      title: "7 à 9 heures"
      body: "De sommeil, assez de protéines et une meilleure forme raccourcissent la récup d'un muscle."
    pt:
      title: "7 a 9 horas"
      body: "De sono, proteína suficiente e melhor condição encurtam o que um músculo precisa."
    tr:
      title: "7-9 saat"
      body: "Uyku, yeterli protein ve daha iyi kondisyon kasın toparlanma süresini kısaltır."

  - key: een-keer-per-week-alles
    kind: myth
    en:
      title: "Once a week"
      body: "Myth: one huge session per muscle is best. It leaves you fatigued for long. Spread it over 2 to 3 sessions."
    nl:
      title: "Eén keer per week"
      body: "Mythe: één enorme sessie per spier is het best. Dan blijf je lang moe. Verdeel het over 2 tot 3 trainingen."
    de:
      title: "Einmal pro Woche"
      body: "Mythos: Eine riesige Einheit pro Muskel ist am besten. Das macht lange müde. Verteil es auf 2 bis 3."
    es:
      title: "Una vez por semana"
      body: "Mito: una sesión enorme por músculo es lo mejor. Te deja cansado mucho tiempo. Repártelo en 2 o 3."
    fr:
      title: "Une fois par semaine"
      body: "Mythe : une énorme séance par muscle, c'est mieux. Ça fatigue longtemps. Répartis sur 2 à 3 séances."
    pt:
      title: "Uma vez por semana"
      body: "Mito: um treino enorme por músculo é o melhor. Deixa-te cansado muito tempo. Divide por 2 ou 3."
    tr:
      title: "Haftada bir"
      body: "Efsane: kas başına tek dev antrenman en iyisi. Uzun süre yorgun bırakır. 2-3 antrenmana yay."

  - key: nog-moe-of-al-fris
    kind: fact
    en:
      title: "Still sore"
      body: "And weaker lifts lingering? Cut sets per session or add rest. Fresh too soon? Do a bit more per session."
    nl:
      title: "Nog moe"
      body: "En blijven je gewichten achter? Minder sets per training of meer rust. Te snel fris? Doe iets meer per training."
    de:
      title: "Noch müde"
      body: "Und bleiben die Gewichte hängen? Weniger Sätze pro Einheit oder mehr Pause. Zu früh frisch? Etwas mehr machen."
    es:
      title: "Aún cansado"
      body: "¿Y los pesos siguen flojos? Menos series por sesión o más descanso. ¿Fresco muy pronto? Haz algo más."
    fr:
      title: "Encore fatigué"
      body: "Et les charges traînent ? Moins de séries par séance ou plus de repos. Frais trop tôt ? Fais-en un peu plus."
    pt:
      title: "Ainda cansado"
      body: "E os pesos continuam fracos? Menos séries por treino ou mais descanso. Fresco cedo demais? Faz mais um pouco."
    tr:
      title: "Hâlâ yorgun"
      body: "Ağırlıklar da geride mi? Antrenman başına seti azalt ya da dinlen. Erken mi toparlandın? Biraz fazla yap."

  - key: signalen
    kind: fact
    en:
      title: "Bar speed"
      body: "Soreness, bar speed and how hard a set feels tell you whether to space a muscle's sessions further apart."
    nl:
      title: "Stangsnelheid"
      body: "Spierpijn, stangsnelheid en hoe zwaar een set voelt vertellen of je trainingen voor die spier verder uit elkaar moeten."
    de:
      title: "Hantelgeschwindigkeit"
      body: "Muskelkater, Tempo der Stange und gefühlte Härte zeigen, ob du mehr Abstand brauchst."
    es:
      title: "Velocidad de la barra"
      body: "Agujetas, velocidad de la barra y lo duro que se siente una serie dicen si separar más las sesiones."
    fr:
      title: "Vitesse de la barre"
      body: "Courbatures, vitesse de la barre et dureté ressentie disent s'il faut espacer les séances de ce muscle."
    pt:
      title: "Velocidade da barra"
      body: "Dores, velocidade da barra e o esforço sentido dizem se deves espaçar mais os treinos desse músculo."
    tr:
      title: "Bar hızı"
      body: "Ağrı, bar hızı ve setin ne kadar zor geldiği, o kasın antrenmanlarını açman gerekip gerekmediğini söyler."

  - key: niet-meer-sets
    kind: myth
    en:
      title: "More sets"
      body: "Myth: lagging behind? Just add sets. Not if recovery is the problem. Fix sleep and food first."
    nl:
      title: "Meer sets"
      body: "Mythe: loop je achter? Gewoon meer sets. Niet als herstel het probleem is. Regel eerst slaap en eten."
    de:
      title: "Mehr Sätze"
      body: "Mythos: Hängst du hinterher? Einfach mehr Sätze. Nicht, wenn Erholung das Problem ist. Erst Schlaf und Essen."
    es:
      title: "Más series"
      body: "Mito: ¿te estancas? Añade series. No si el problema es recuperar. Arregla antes sueño y comida."
    fr:
      title: "Plus de séries"
      body: "Mythe : tu stagnes ? Ajoute des séries. Pas si c'est la récup. Règle d'abord sommeil et repas."
    pt:
      title: "Mais séries"
      body: "Mito: estás parado? Junta séries. Não se o problema for recuperar. Trata primeiro do sono e da comida."
    tr:
      title: "Daha çok set"
      body: "Efsane: geride misin? Set ekle. Sorun toparlanmaysa olmaz. Önce uyku ve beslenmeyi düzelt."

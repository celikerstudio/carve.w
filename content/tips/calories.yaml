article: calories
emoji: "🧮"
tips:
  - key: per-gram
    kind: fact
    en:
      title: "9 kcal"
      body: "Per gram of fat. Protein and carbs give 4, alcohol 7."
    nl:
      title: "9 kcal"
      body: "Per gram vet. Eiwit en koolhydraten geven 4, alcohol 7."
    de:
      title: "9 kcal"
      body: "Pro Gramm Fett. Protein und Kohlenhydrate liefern 4, Alkohol 7."
    es:
      title: "9 kcal"
      body: "Por gramo de grasa. La proteína y los hidratos dan 4, el alcohol 7."
    fr:
      title: "9 kcal"
      body: "Par gramme de gras. Protéines et glucides en donnent 4, l'alcool 7."
    pt:
      title: "9 kcal"
      body: "Por grama de gordura. Proteína e hidratos dão 4, o álcool 7."
    tr:
      title: "9 kcal"
      body: "Yağın gramı başına. Protein ve karbonhidrat 4, alkol 7 verir."

  - key: eetlepel-olie
    kind: fact
    en:
      title: "120 kcal"
      body: "In one tablespoon of cooking oil. That's why fat adds up so fast."
    nl:
      title: "120 kcal"
      body: "In één eetlepel bakolie. Daarom tikt vet zo snel aan."
    de:
      title: "120 kcal"
      body: "Stecken in einem Esslöffel Speiseöl. Darum summiert sich Fett so schnell."
    es:
      title: "120 kcal"
      body: "En una cucharada de aceite. Por eso la grasa suma tan rápido."
    fr:
      title: "120 kcal"
      body: "Dans une cuillère à soupe d'huile. Voilà pourquoi le gras grimpe si vite."
    pt:
      title: "120 kcal"
      body: "Numa colher de sopa de óleo. É por isso que a gordura soma tão depressa."
    tr:
      title: "120 kcal"
      body: "Bir yemek kaşığı yemeklik yağda. Yağın bu kadar hızlı birikmesinin sebebi bu."

  - key: tempo-afvallen
    kind: fact
    en:
      title: "0.4 to 0.8 kg"
      body: "A week is a good pace at 80 kg to keep your muscle. That's 0.5 to 1% of your bodyweight."
    nl:
      title: "0,4 tot 0,8 kilo"
      body: "Per week is een goed tempo bij 80 kilo om je spier te houden. Dat is 0,5 tot 1% van je gewicht."
    de:
      title: "0,4 bis 0,8 kg"
      body: "Pro Woche sind bei 80 kg ein gutes Tempo, um Muskeln zu halten. Das sind 0,5 bis 1 % deines Gewichts."
    es:
      title: "0,4 a 0,8 kg"
      body: "Por semana es buen ritmo con 80 kg para conservar músculo. Es un 0,5 a 1 % de tu peso."
    fr:
      title: "0,4 à 0,8 kg"
      body: "Par semaine, c'est un bon rythme à 80 kg pour garder ton muscle. Soit 0,5 à 1 % de ton poids."
    pt:
      title: "0,4 a 0,8 kg"
      body: "Por semana é bom ritmo com 80 kg para manter músculo. É 0,5 a 1% do teu peso."
    tr:
      title: "0,4-0,8 kg"
      body: "80 kiloda kası korumak için iyi haftalık tempo. Vücut ağırlığının %0,5-1'i."

  - key: sneller-is-niet-beter
    kind: myth
    en:
      title: "Faster"
      body: "Myth: faster fat loss is better. Lifters losing about 0.7% a week gained lean mass. The faster group didn't."
    nl:
      title: "Sneller"
      body: "Mythe: sneller afvallen is beter. Sporters die 0,7% per week verloren wonnen vetvrije massa. De snelle groep niet."
    de:
      title: "Schneller"
      body: "Mythos: Schneller abnehmen ist besser. Wer 0,7 % pro Woche verlor, baute fettfreie Masse auf. Die Schnellen nicht."
    es:
      title: "Más rápido"
      body: "Mito: perder grasa más rápido es mejor. Quienes bajaban un 0,7 % semanal ganaron masa magra. Los rápidos no."
    fr:
      title: "Plus vite"
      body: "Mythe : maigrir vite, c'est mieux. Ceux qui perdaient 0,7 % par semaine ont pris de la masse maigre. Les rapides non."
    pt:
      title: "Mais rápido"
      body: "Mito: perder gordura mais rápido é melhor. Quem perdia 0,7% por semana ganhou massa magra. Os rápidos não."
    tr:
      title: "Daha hızlı"
      body: "Efsane: hızlı yağ kaybı daha iyidir. Haftada %0,7 verenler yağsız kütle kazandı. Hızlı grup kazanamadı."

  - key: welk-dieet
    kind: myth
    en:
      title: "Low-carb"
      body: "Myth: low-carb is the way to lose fat. A deficit you keep up does it. Low-carb or low-fat matters much less."
    nl:
      title: "Koolhydraatarm"
      body: "Mythe: koolhydraatarm is dé manier om af te vallen. Een tekort dat je volhoudt doet het werk. De rest telt veel minder."
    de:
      title: "Low Carb"
      body: "Mythos: Low Carb ist der Weg zum Fettverlust. Ein Defizit, das du durchhältst, macht's. Der Rest zählt viel weniger."
    es:
      title: "Low carb"
      body: "Mito: el low carb es la forma de perder grasa. Lo hace un déficit que mantengas. El resto importa mucho menos."
    fr:
      title: "Low carb"
      body: "Mythe : le low carb est la clé pour perdre du gras. C'est un déficit tenu qui fait le travail. Le reste compte peu."
    pt:
      title: "Low carb"
      body: "Mito: o low carb é o caminho para perder gordura. Um défice que mantenhas é que faz isso. O resto conta muito menos."
    tr:
      title: "Düşük karbonhidrat"
      body: "Efsane: yağ kaybının yolu düşük karbonhidrattır. İşi sürdürdüğün açık yapar. Gerisi çok daha az önemli."

  - key: afvallen-vertraagt
    kind: fact
    en:
      title: "Every few kilos"
      body: "Recalculate your number. As you get lighter you burn less, so the same intake gives a smaller gap."
    nl:
      title: "Elke paar kilo"
      body: "Reken je getal opnieuw uit. Lichter worden betekent minder verbranden, dus hetzelfde eten geeft een kleiner tekort."
    de:
      title: "Alle paar Kilo"
      body: "Rechne neu. Leichter heißt weniger Verbrauch, also wird das Defizit bei gleichem Essen kleiner."
    es:
      title: "Cada pocos kilos"
      body: "Recalcula tu número. Al pesar menos quemas menos, así que comiendo igual el déficit se achica."
    fr:
      title: "Après quelques kilos"
      body: "Refais ton calcul. Plus léger, tu brûles moins, donc à apport égal le déficit rétrécit."
    pt:
      title: "A cada poucos quilos"
      body: "Recalcula o teu número. Mais leve, gastas menos, por isso a comer igual o défice encolhe."
    tr:
      title: "Birkaç kiloda bir"
      body: "Hesabını yenile. Hafifledikçe daha az yakarsın, aynı yemekle açık küçülür."

  - key: onderrapporteren
    kind: myth
    en:
      title: "47%"
      body: "Myth: my metabolism won't let me lose. In a study, people who said so had a normal one. They underreported food by 47%."
    nl:
      title: "47%"
      body: "Mythe: mijn stofwisseling werkt niet mee. In een studie was die bij zulke mensen normaal. Ze gaven 47% te weinig op."
    de:
      title: "47 %"
      body: "Mythos: Mein Stoffwechsel blockiert das Abnehmen. In einer Studie war er normal. 47 % des Essens wurden nicht notiert."
    es:
      title: "47 %"
      body: "Mito: mi metabolismo no me deja adelgazar. En un estudio era normal, y declaraban un 47 % menos de lo que comían."
    fr:
      title: "47 %"
      body: "Mythe : mon métabolisme m'empêche de maigrir. Dans une étude, il était normal. Ils sous-déclaraient leurs repas de 47 %."
    pt:
      title: "47%"
      body: "Mito: o meu metabolismo não me deixa emagrecer. Num estudo era normal, e declaravam 47% menos do que comiam."
    tr:
      title: "%47"
      body: "Efsane: metabolizmam kilo vermeme izin vermiyor. Bir çalışmada metabolizma normaldi, yenen %47 eksik bildiriliyordu."

  - key: kleine-dingen
    kind: fact
    en:
      title: "Cooking oil"
      body: "Drinks and bites while cooking are easy to miss too. Logging every meal beats a perfect target."
    nl:
      title: "Bakolie"
      body: "Drankjes en hapjes tijdens het koken vergeet je ook snel. Elke maaltijd loggen wint van een perfect doel."
    de:
      title: "Bratöl"
      body: "Auch Getränke und Happen beim Kochen übersieht man leicht. Jede Mahlzeit loggen schlägt ein perfektes Ziel."
    es:
      title: "Aceite de cocinar"
      body: "Las bebidas y lo que picas al cocinar también se olvidan. Registrar cada comida vale más que una meta perfecta."
    fr:
      title: "Huile de cuisson"
      body: "Les boissons et ce que tu grignotes en cuisinant s'oublient aussi. Tout noter vaut mieux qu'une cible parfaite."
    pt:
      title: "Óleo de cozinha"
      body: "As bebidas e o que petiscas a cozinhar também escapam. Registar cada refeição vale mais do que um alvo perfeito."
    tr:
      title: "Yemeklik yağ"
      body: "İçecekler ve pişirirken atıştırdıkların da kolay unutulur. Her öğünü kaydetmek kusursuz hedeften iyidir."

  - key: ultrabewerkt
    kind: fact
    en:
      title: "500 kcal"
      body: "More a day, eaten on ultra-processed meals when people could eat freely. They gained 0.9 kg in two weeks."
    nl:
      title: "500 kcal"
      body: "Meer per dag aten mensen met ultrabewerkte maaltijden, als ze vrij mochten eten. Ze kwamen 0,9 kilo aan in twee weken."
    de:
      title: "500 kcal"
      body: "Mehr am Tag aßen Menschen mit stark verarbeiteter Kost, wenn sie frei essen durften. Plus 0,9 kg in zwei Wochen."
    es:
      title: "500 kcal"
      body: "Más al día comió la gente con platos ultraprocesados, pudiendo comer libremente. Ganaron 0,9 kg en dos semanas."
    fr:
      title: "500 kcal"
      body: "De plus par jour avec des plats ultra-transformés, quand on pouvait manger à volonté. +0,9 kg en deux semaines."
    pt:
      title: "500 kcal"
      body: "A mais por dia comeram as pessoas com refeições ultraprocessadas, à vontade. Ganharam 0,9 kg em duas semanas."
    tr:
      title: "500 kcal"
      body: "İstedikleri kadar yiyebilen kişiler ultra işlenmiş öğünlerle günde bu kadar fazla yedi. İki haftada 0,9 kg aldılar."

  - key: welke-formule
    kind: fact
    en:
      title: "5% too high"
      body: "That's how far the old Harris-Benedict formula was off. Use Mifflin-St Jeor to estimate your resting burn."
    nl:
      title: "5% te hoog"
      body: "Zo ver zat de oude Harris-Benedict-formule ernaast. Gebruik Mifflin-St Jeor om je rustverbranding te schatten."
    de:
      title: "5 % zu hoch"
      body: "So weit lag die alte Harris-Benedict-Formel daneben. Nimm Mifflin-St Jeor, um deinen Ruheumsatz zu schätzen."
    es:
      title: "5 % de más"
      body: "Es lo que fallaba la vieja fórmula de Harris-Benedict. Usa Mifflin-St Jeor para estimar tu gasto en reposo."
    fr:
      title: "5 % de trop"
      body: "C'est l'erreur de l'ancienne formule de Harris-Benedict. Utilise Mifflin-St Jeor pour estimer ta dépense au repos."
    pt:
      title: "5% a mais"
      body: "Era o erro da velha fórmula de Harris-Benedict. Usa Mifflin-St Jeor para estimar o gasto em repouso."
    tr:
      title: "%5 fazla"
      body: "Eski Harris-Benedict formülü bu kadar şaşıyordu. Dinlenme yakımını tahmin etmek için Mifflin-St Jeor kullan."

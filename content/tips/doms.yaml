article: doms
emoji: "😣"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Delayed soreness"
      body: "Shows up after training, not during it. Most common after a break or when you try something new."
    nl:
      title: "Spierpijn achteraf"
      body: "Komt na de training, niet tijdens. Het vaakst na een pauze of als je iets nieuws doet."
    de:
      title: "Muskelkater"
      body: "Kommt nach dem Training, nicht währenddessen. Am häufigsten nach einer Pause oder bei Neuem."
    es:
      title: "Agujetas"
      body: "Aparecen después de entrenar, no durante. Sobre todo tras un parón o al probar algo nuevo."
    fr:
      title: "Courbatures"
      body: "Elles arrivent après l'effort, pas pendant. Surtout après une pause ou un exercice nouveau."
    pt:
      title: "Dores tardias"
      body: "Aparecem depois do treino, não durante. Sobretudo depois de uma pausa ou de algo novo."
    tr:
      title: "Gecikmiş ağrı"
      body: "Antrenmandan sonra gelir, sırasında değil. En çok bir aradan sonra ya da yeni bir şey denediğinde."

  - key: rekken-helpt-niet
    kind: myth
    en:
      title: "Stretching"
      body: "Myth: stretching gets rid of soreness. Experts say there's no evidence for it. If it feels good, that's fine."
    nl:
      title: "Rekken"
      body: "Mythe: rekken haalt spierpijn weg. Experts zeggen dat er geen bewijs voor is. Voelt het fijn, dan mag het."
    de:
      title: "Dehnen"
      body: "Mythos: Dehnen vertreibt Muskelkater. Fachleute sehen keine Belege dafür. Tut es gut, ist es trotzdem okay."
    es:
      title: "Estirar"
      body: "Mito: estirar quita las agujetas. Los expertos dicen que no hay pruebas. Si te sienta bien, adelante."
    fr:
      title: "S'étirer"
      body: "Mythe : s'étirer fait passer les courbatures. Les experts n'y voient aucune preuve. Si ça fait du bien, ok."
    pt:
      title: "Alongar"
      body: "Mito: alongar tira as dores. Os especialistas dizem que não há provas. Se te sabe bem, tudo bem."
    tr:
      title: "Esneme"
      body: "Efsane: esneme kas ağrısını giderir. Uzmanlar buna kanıt olmadığını söylüyor. İyi geliyorsa sorun yok."

  - key: pijn-is-geen-maatstaf
    kind: myth
    en:
      title: "Sore = good?"
      body: "Myth: sore means it was a good workout. Soreness marks training you're not used to. Nobody showed it means growth."
    nl:
      title: "Pijn = goed?"
      body: "Mythe: spierpijn betekent een goede training. Het wijst op training die je niet gewend bent, niet op groei."
    de:
      title: "Kater = gut?"
      body: "Mythos: Muskelkater heißt gutes Training. Er zeigt ungewohnte Belastung. Dass er Wachstum anzeigt, ist unbelegt."
    es:
      title: "¿Dolor = bueno?"
      body: "Mito: agujetas es buen entreno. Indican un esfuerzo al que no estás hecho. Nadie probó que signifiquen músculo."
    fr:
      title: "Mal = efficace ?"
      body: "Mythe : courbatures = bonne séance. Elles signalent un effort inhabituel. Rien ne prouve qu'elles signifient du muscle."
    pt:
      title: "Dor = bom?"
      body: "Mito: dores são sinal de bom treino. Mostram esforço a que não estás habituado. Ninguém provou que dão músculo."
    tr:
      title: "Ağrı = iyi mi?"
      body: "Efsane: ağrı iyi antrenman demek. Alışık olmadığın yükü gösterir. Kas yaptığını kimse kanıtlamadı."

  - key: het-zakken
    kind: fact
    en:
      title: "The lowering"
      body: "Eccentric work, like lowering a squat or curl, causes more micro-damage than other contractions."
    nl:
      title: "Het zakken"
      body: "Excentrisch werk, zoals zakken bij een squat of curl, geeft meer microschade dan andere contracties."
    de:
      title: "Das Absenken"
      body: "Exzentrische Arbeit wie das Absenken bei Kniebeuge oder Curl verursacht mehr Mikroschäden."
    es:
      title: "La bajada"
      body: "El trabajo excéntrico, como bajar en la sentadilla o el curl, causa más microdaño que otras contracciones."
    fr:
      title: "La descente"
      body: "Le travail excentrique, comme descendre un squat ou un curl, cause plus de microlésions."
    pt:
      title: "A descida"
      body: "O trabalho excêntrico, como descer no agachamento ou na rosca, causa mais microlesões."
    tr:
      title: "İniş"
      body: "Squat ya da curl'de indirmek gibi eksantrik iş, diğer kasılmalardan daha çok mikro hasar yapar."

  - key: rustig-opbouwen
    kind: fact
    en:
      title: "1 to 2 weeks"
      body: "To ease into a new or eccentric exercise, review authors suggest. Their advice, not a tested rule."
    nl:
      title: "1 tot 2 weken"
      body: "Neem die om in een nieuwe of excentrische oefening te groeien, opperen reviewers. Advies, geen geteste regel."
    de:
      title: "1 bis 2 Wochen"
      body: "Für den Einstieg in neue oder exzentrische Übungen, raten Fachautoren. Ein Rat, keine getestete Regel."
    es:
      title: "1 a 2 semanas"
      body: "Para entrar en un ejercicio nuevo o excéntrico, sugieren unos autores. Es un consejo, no una regla probada."
    fr:
      title: "1 à 2 semaines"
      body: "Pour t'habituer à un exercice nouveau ou excentrique, suggèrent des auteurs. Un conseil, pas une règle testée."
    pt:
      title: "1 a 2 semanas"
      body: "Para entrar num exercício novo ou excêntrico, sugerem autores. É um conselho, não uma regra testada."
    tr:
      title: "1-2 hafta"
      body: "Yeni ya da eksantrik bir harekete alışmak için önerilen süre. Bir tavsiye, test edilmiş kural değil."

  - key: massage-placebo
    kind: fact
    en:
      title: "99 studies"
      body: "Massage eased soreness most in a meta-analysis. People knew what they got, so placebo can't be ruled out."
    nl:
      title: "99 studies"
      body: "Massage verlichtte spierpijn het meest in een meta-analyse. Mensen wisten wat ze kregen, dus placebo kan meespelen."
    de:
      title: "99 Studien"
      body: "Massage linderte den Kater in einer Metaanalyse am meisten. Alle wussten, was sie bekamen: Placebo möglich."
    es:
      title: "99 estudios"
      body: "El masaje alivió más las agujetas en un metaanálisis. Sabían qué recibían, así que puede ser placebo."
    fr:
      title: "99 études"
      body: "Le massage a le plus soulagé dans une méta-analyse. Les gens savaient ce qu'ils recevaient : placebo possible."
    pt:
      title: "99 estudos"
      body: "A massagem aliviou mais as dores numa meta-análise. Sabiam o que recebiam, por isso pode ser placebo."
    tr:
      title: "99 çalışma"
      body: "Bir meta-analizde ağrıyı en çok masaj azalttı. Kişiler ne aldığını biliyordu, plasebo dışlanamaz."

  - key: schade-geen-groei
    kind: myth
    en:
      title: "Muscle damage"
      body: "Myth: you need muscle damage to grow. Programs causing little damage gave similar muscle and strength gains."
    nl:
      title: "Spierschade"
      body: "Mythe: je hebt spierschade nodig om te groeien. Schema's met weinig schade gaven vergelijkbare winst."
    de:
      title: "Muskelschaden"
      body: "Mythos: Ohne Muskelschaden kein Wachstum. Programme mit wenig Schaden brachten ähnliche Zuwächse."
    es:
      title: "Daño muscular"
      body: "Mito: sin daño muscular no creces. Programas con poco daño dieron ganancias parecidas de músculo y fuerza."
    fr:
      title: "Lésions musculaires"
      body: "Mythe : sans lésions, pas de croissance. Des programmes peu traumatisants ont donné des gains similaires."
    pt:
      title: "Dano muscular"
      body: "Mito: sem dano muscular não cresces. Programas com pouco dano deram ganhos parecidos de músculo e força."
    tr:
      title: "Kas hasarı"
      body: "Efsane: büyümek için kas hasarı gerekir. Az hasar yapan programlar benzer kas ve güç kazancı sağladı."

  - key: bewegen-tijdelijk
    kind: fact
    en:
      title: "Moving it off"
      body: "Exercise eases soreness, but only for a while, says one review. A newer one calls the evidence weak."
    nl:
      title: "Eruit bewegen"
      body: "Bewegen verlicht spierpijn, maar maar even, zegt een review. Een nieuwere noemt het bewijs zwak."
    de:
      title: "Rausbewegen"
      body: "Bewegung lindert den Kater, aber nur kurz, sagt eine Übersicht. Eine neuere nennt die Belege schwach."
    es:
      title: "Moverse"
      body: "El ejercicio alivia las agujetas, pero solo un rato, dice una revisión. Otra más reciente ve pruebas débiles."
    fr:
      title: "Bouger"
      body: "Bouger soulage les courbatures, mais pas longtemps, dit une revue. Une plus récente juge les preuves faibles."
    pt:
      title: "Mexer-te"
      body: "O exercício alivia as dores, mas só por um tempo, diz uma revisão. Outra mais recente vê provas fracas."
    tr:
      title: "Hareketle atmak"
      body: "Bir derlemeye göre hareket ağrıyı geçici olarak azaltır. Daha yeni bir derleme kanıtı zayıf buluyor."

  - key: andere-spieren
    kind: fact
    en:
      title: "1 to 2 days"
      body: "Ease off after an intense session, or train other muscles meanwhile, a review suggests."
    nl:
      title: "1 tot 2 dagen"
      body: "Doe het rustiger aan na een zware training, of train intussen andere spieren, oppert een review."
    de:
      title: "1 bis 2 Tage"
      body: "Nach einer harten Einheit kürzertreten oder andere Muskeln trainieren, rät eine Übersicht."
    es:
      title: "1 a 2 días"
      body: "Baja el ritmo tras una sesión intensa, o entrena otros músculos mientras, sugiere una revisión."
    fr:
      title: "1 à 2 jours"
      body: "Lève le pied après une séance intense, ou travaille d'autres muscles, suggère une revue."
    pt:
      title: "1 a 2 dias"
      body: "Abranda depois de um treino intenso, ou treina outros músculos entretanto, sugere uma revisão."
    tr:
      title: "1-2 gün"
      body: "Bir derlemeye göre yoğun antrenmandan sonra yavaşla ya da bu arada başka kasları çalıştır."

  - key: naar-de-dokter
    kind: fact
    en:
      title: "Dark urine"
      body: "Extreme pain, a swollen muscle or dark urine after hard training isn't normal soreness. See a doctor."
    nl:
      title: "Donkere urine"
      body: "Extreme pijn, een gezwollen spier of donkere urine na zware training is geen gewone spierpijn. Ga naar een arts."
    de:
      title: "Dunkler Urin"
      body: "Extreme Schmerzen, ein geschwollener Muskel oder dunkler Urin nach hartem Training: ab zum Arzt."
    es:
      title: "Orina oscura"
      body: "Dolor extremo, un músculo hinchado u orina oscura tras entrenar duro no son agujetas. Ve al médico."
    fr:
      title: "Urine foncée"
      body: "Douleur extrême, muscle gonflé ou urine foncée après un gros effort : ce ne sont pas des courbatures. Consulte."
    pt:
      title: "Urina escura"
      body: "Dor extrema, músculo inchado ou urina escura após treino duro não são dores normais. Vai ao médico."
    tr:
      title: "Koyu idrar"
      body: "Sert antrenman sonrası aşırı ağrı, şişmiş kas ya da koyu idrar normal ağrı değil. Doktora git."

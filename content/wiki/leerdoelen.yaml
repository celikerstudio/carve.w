# De leerdoelen van de Carve Wiki (TDR-0018): wat de wiki moet uitleggen.
#
# Elk leerdoel komt uit een richtlijn in bronnen/richtlijnen/, en `passage` staat daar letterlijk
# in. `pnpm wiki:dekking` controleert dat, en laat zien welke leerdoelen nog geen artikel hebben.
# Eerste versie 2026-10-16: voorgesteld door vijf agents uit elf richtlijnen, daarna ontdubbeld en
# ingekort tot wat een gewone sporter of iemand die wil afvallen moet weten.
#
# laag: fundament | vet-verliezen | spier-opbouwen | naslag
# artikel: de slug die het uitlegt, of null

# ── fundament (25) ──


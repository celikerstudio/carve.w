- id: focus-spierbehoud-cut
  laag: vet-verliezen
  doel: "Weet dat voldoende eiwit, krachttraining en een gematigd afvaltempo de drie dingen zijn die spieren beschermen tijdens vetverlies."
  bron: issn-diets-2017
  passage: "Adequate protein, resistance training, and an appropriate rate of weight loss should be the primary focus for achieving the objective of LM retention (or gain) during FM loss."
  artikel: calorie-deficit

- id: metabolisme-trager-voorkomen
  laag: vet-verliezen
  doel: "Weet dat krachttraining de extra vertraging van je verbruik bij lang diëten kan helpen beperken, en dat het onderzoek met genoeg eiwit erbij dun is."

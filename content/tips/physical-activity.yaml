article: physical-activity
emoji: "🏃"
tips:
  - key: minuten-per-week
    kind: fact
    en:
      title: "150 to 300 minutes"
      body: "Of moderate activity a week, or 75 to 150 minutes of vigorous. You can mix the two."
    nl:
      title: "150 tot 300 minuten"
      body: "Matige beweging per week, of 75 tot 150 minuten intensief. Je mag ze mixen."
    de:
      title: "150 bis 300 Minuten"
      body: "Moderate Bewegung pro Woche, oder 75 bis 150 Minuten intensiv. Du kannst beides mischen."
    es:
      title: "150 a 300 minutos"
      body: "De actividad moderada a la semana, o 75 a 150 intensa. Puedes mezclar ambas."
    fr:
      title: "150 à 300 minutes"
      body: "D'activité modérée par semaine, ou 75 à 150 minutes intenses. Tu peux mélanger."
    pt:
      title: "150 a 300 minutos"
      body: "De atividade moderada por semana, ou 75 a 150 intensa. Podes misturar."
    tr:
      title: "150-300 dakika"
      body: "Haftada orta düzey hareket ya da 75-150 dakika yoğun hareket. İkisini karıştırabilirsin."

  - key: wandelen
    kind: fact
    en:
      title: "5 or 6 out of 10"
      body: "If your walk feels that hard, it's moderate. 30 minutes on five days gives you 150 minutes."
    nl:
      title: "5 of 6 uit 10"
      body: "Voelt je wandeling zo zwaar, dan is het matig. 30 minuten op vijf dagen geeft je 150 minuten."
    de:
      title: "5 oder 6 von 10"
      body: "Fühlt sich dein Spaziergang so an, ist er moderat. 30 Minuten an fünf Tagen ergeben 150 Minuten."
    es:
      title: "5 o 6 sobre 10"
      body: "Si tu paseo se siente así de duro, es moderado. 30 minutos cinco días suman 150."
    fr:
      title: "5 ou 6 sur 10"
      body: "Si ta marche te semble aussi dure, c'est modéré. 30 minutes sur cinq jours font 150 minutes."
    pt:
      title: "5 ou 6 em 10"
      body: "Se a caminhada parece assim tão dura, é moderada. 30 minutos em cinco dias dão 150."
    tr:
      title: "10 üzerinden 5-6"
      body: "Yürüyüşün bu kadar zor geliyorsa orta düzeydir. Beş gün 30 dakika 150 dakika eder."

  - key: kracht-erbij
    kind: fact
    en:
      title: "2 days a week"
      body: "Of strength work for all major muscle groups, on top of your minutes, the WHO asks."
    nl:
      title: "2 dagen per week"
      body: "Krachttraining voor alle grote spiergroepen, bovenop je minuten, vraagt de WHO."
    de:
      title: "2 Tage pro Woche"
      body: "Krafttraining für alle großen Muskelgruppen, zusätzlich zu den Minuten, verlangt die WHO."
    es:
      title: "2 días por semana"
      body: "De fuerza para todos los grandes grupos musculares, además de tus minutos, pide la OMS."
    fr:
      title: "2 jours par semaine"
      body: "De renforcement de tous les grands muscles, en plus de tes minutes, demande l'OMS."
    pt:
      title: "2 dias por semana"
      body: "De força para todos os grandes grupos musculares, além dos minutos, pede a OMS."
    tr:
      title: "Haftada 2 gün"
      body: "DSÖ dakikalarına ek olarak tüm büyük kas gruplarını çalıştıran kuvvet antrenmanı istiyor."

  - key: kracht-30-60-minuten
    kind: fact
    en:
      title: "30 to 60 minutes"
      body: "Of strength work a week went with the biggest drop in risk of death, 10 to 20%, in observational studies."
    nl:
      title: "30 tot 60 minuten"
      body: "Krachttraining per week ging samen met de grootste daling in sterfterisico, 10 tot 20%, in observationele studies."
    de:
      title: "30 bis 60 Minuten"
      body: "Krafttraining pro Woche ging in Beobachtungsstudien mit dem größten Rückgang des Sterberisikos einher, 10 bis 20 %."
    es:
      title: "30 a 60 minutos"
      body: "De fuerza a la semana fueron con la mayor bajada del riesgo de muerte, 10 a 20 %, en estudios observacionales."
    fr:
      title: "30 à 60 minutes"
      body: "De renfo par semaine allaient avec la plus forte baisse du risque de décès, 10 à 20 %, en études d'observation."
    pt:
      title: "30 a 60 minutos"
      body: "De força por semana andaram com a maior descida do risco de morte, 10 a 20%, em estudos observacionais."
    tr:
      title: "30-60 dakika"
      body: "Gözlem çalışmalarında haftada bu kadar kuvvet antrenmanı ölüm riskinde en büyük düşüşle (%10-20) ilişkiliydi."

  - key: tienduizend-stappen
    kind: myth
    en:
      title: "10,000 steps"
      body: "Myth: you need 10,000 a day. Risk kept falling up to 6,000 to 8,000 at 60 and over, 8,000 to 10,000 if younger."
    nl:
      title: "10.000 stappen"
      body: "Mythe: je moet er 10.000 per dag zetten. Het risico daalde tot 6.000 à 8.000 vanaf 60, 8.000 à 10.000 als jonger."
    de:
      title: "10.000 Schritte"
      body: "Mythos: Du brauchst 10.000 am Tag. Das Risiko sank bis 6.000 bis 8.000 ab 60, bei Jüngeren bis 8.000 bis 10.000."
    es:
      title: "10.000 pasos"
      body: "Mito: necesitas 10.000 al día. El riesgo bajó hasta 6.000-8.000 desde los 60, y 8.000-10.000 en más jóvenes."
    fr:
      title: "10 000 pas"
      body: "Mythe : il faut 10 000 pas par jour. Le risque baissait jusqu'à 6 000-8 000 après 60 ans, 8 000-10 000 avant."
    pt:
      title: "10.000 passos"
      body: "Mito: precisas de 10.000 por dia. O risco desceu até 6.000-8.000 a partir dos 60, e 8.000-10.000 nos mais novos."
    tr:
      title: "10.000 adım"
      body: "Efsane: günde 10.000 adım şart. Risk 60 yaş üstünde 6.000-8.000'e, gençlerde 8.000-10.000'e kadar düştü."

  - key: korte-stukjes
    kind: myth
    en:
      title: "Under 10 minutes"
      body: "Myth: short bouts don't count. Since 2020 the WHO counts any length. Three 5-minute walks equal one of 15."
    nl:
      title: "Korter dan 10 minuten"
      body: "Mythe: korte stukjes tellen niet. Sinds 2020 telt de WHO elke duur. Drie keer 5 minuten is één keer 15."
    de:
      title: "Unter 10 Minuten"
      body: "Mythos: Kurze Einheiten zählen nicht. Seit 2020 zählt die WHO jede Dauer. Dreimal 5 Minuten wie einmal 15."
    es:
      title: "Menos de 10 minutos"
      body: "Mito: los ratos cortos no cuentan. Desde 2020 la OMS cuenta cualquier duración. Tres de 5 valen uno de 15."
    fr:
      title: "Moins de 10 minutes"
      body: "Mythe : les petites sessions ne comptent pas. Depuis 2020, l'OMS compte tout. Trois fois 5 minutes = une de 15."
    pt:
      title: "Menos de 10 minutos"
      body: "Mito: períodos curtos não contam. Desde 2020 a OMS conta qualquer duração. Três de 5 valem uma de 15."
    tr:
      title: "10 dakikadan kısa"
      body: "Efsane: kısa hareketler sayılmaz. DSÖ 2020'den beri her süreyi sayıyor. Üç kez 5 dakika, bir kez 15 gibi."

  - key: minder-zitten
    kind: fact
    en:
      title: "Sit less"
      body: "Swapping sitting for any movement, light included, has health benefits. Take that call on foot."
    nl:
      title: "Minder zitten"
      body: "Zitten vervangen door bewegen, ook licht, heeft gezondheidsvoordelen. Bel eens lopend."
    de:
      title: "Weniger sitzen"
      body: "Sitzen gegen Bewegung tauschen, auch leichte, ist gut für die Gesundheit. Telefonier mal im Gehen."
    es:
      title: "Siéntate menos"
      body: "Cambiar estar sentado por moverte, aunque sea suave, tiene beneficios. Haz esa llamada andando."
    fr:
      title: "Moins assis"
      body: "Remplacer l'assis par du mouvement, même léger, est bon pour la santé. Passe cet appel en marchant."
    pt:
      title: "Senta-te menos"
      body: "Trocar estar sentado por movimento, mesmo leve, faz bem. Faz essa chamada a andar."
    tr:
      title: "Daha az otur"
      body: "Oturmayı hafif de olsa harekete çevirmek sağlığa iyi gelir. O telefonu yürürken konuş."

  - key: veel-zitten
    kind: fact
    en:
      title: "Lots of sitting"
      body: "The WHO couldn't name a safe number of hours. Going past 150 to 300 active minutes helps offset it."
    nl:
      title: "Veel zitten"
      body: "De WHO kon geen veilig aantal uren noemen. Boven de 150 tot 300 actieve minuten gaan helpt het compenseren."
    de:
      title: "Viel sitzen"
      body: "Die WHO konnte keine sichere Stundenzahl nennen. Über 150 bis 300 aktive Minuten hinaus hilft es auszugleichen."
    es:
      title: "Mucho tiempo sentado"
      body: "La OMS no pudo dar un número seguro de horas. Pasar de 150-300 minutos activos ayuda a compensar."
    fr:
      title: "Beaucoup assis"
      body: "L'OMS n'a pas pu donner de seuil sûr. Dépasser 150 à 300 minutes actives aide à compenser."
    pt:
      title: "Muito tempo sentado"
      body: "A OMS não conseguiu dar um número seguro de horas. Passar dos 150-300 minutos ativos ajuda a compensar."
    tr:
      title: "Çok oturmak"
      body: "DSÖ güvenli bir saat sayısı veremedi. 150-300 aktif dakikayı aşmak bunu dengelemeye yardım eder."

  - key: beetje-telt
    kind: fact
    en:
      title: "A little"
      body: "Some activity beats none. Benefits start below the targets, and the extra gain shrinks at higher amounts."
    nl:
      title: "Een beetje"
      body: "Iets bewegen is beter dan niets. Winst begint al onder de normen, en het extra voordeel wordt kleiner als je meer doet."
    de:
      title: "Ein bisschen"
      body: "Etwas ist besser als nichts. Der Nutzen beginnt unter den Zielen, und das Extra wird bei mehr kleiner."
    es:
      title: "Un poco"
      body: "Algo es mejor que nada. Los beneficios empiezan antes de la meta, y lo extra se reduce al hacer más."
    fr:
      title: "Un peu"
      body: "Un peu vaut mieux que rien. Les bienfaits commencent sous les objectifs, et le bonus diminue ensuite."
    pt:
      title: "Um pouco"
      body: "Algum é melhor do que nada. Os benefícios começam abaixo das metas, e o extra encolhe com mais."
    tr:
      title: "Biraz"
      body: "Biraz hareket hiç yoktan iyidir. Fayda hedeflerin altında başlar, fazlasında ek kazanç azalır."

  - key: keuring-vooraf
    kind: myth
    en:
      title: "Medical check"
      body: "Myth: get a check-up before you start. Not for most healthy adults. Heart condition or chest pain? Ask first."
    nl:
      title: "Keuring vooraf"
      body: "Mythe: laat je eerst keuren. Niet voor de meeste gezonde volwassenen. Hartklachten of pijn op de borst? Vraag eerst."
    de:
      title: "Ärztlicher Check"
      body: "Mythos: Vor dem Start zum Check. Nicht für die meisten Gesunden. Herzprobleme oder Brustschmerz? Erst fragen."
    es:
      title: "Revisión médica"
      body: "Mito: hazte una revisión antes de empezar. No en adultos sanos. ¿Problemas de corazón o dolor de pecho? Consulta."
    fr:
      title: "Visite médicale"
      body: "Mythe : fais un bilan avant de commencer. Pas pour la plupart des adultes sains. Souci cardiaque ? Demande avant."
    pt:
      title: "Check-up"
      body: "Mito: faz um check-up antes de começar. Não para a maioria dos adultos saudáveis. Problemas de coração? Pergunta."
    tr:
      title: "Sağlık kontrolü"
      body: "Efsane: başlamadan önce kontrole git. Çoğu sağlıklı yetişkin için gerekmez. Kalp sorunun varsa önce sor."

article: calorie-deficit
emoji: "📉"
tips:
  - key: tempo
    kind: fact
    en:
      title: "0.5 to 1%"
      body: "Of your bodyweight a week is a common target to keep muscle. With a lot of fat to lose, you can start faster."
    nl:
      title: "0,5 tot 1%"
      body: "Van je gewicht per week is een gangbaar doel om spier te houden. Met veel vet te verliezen mag je sneller beginnen."
    de:
      title: "0,5 bis 1 %"
      body: "Des Körpergewichts pro Woche ist ein übliches Ziel, um Muskeln zu halten. Mit viel Fett darfst du schneller starten."
    es:
      title: "0,5 a 1 %"
      body: "De tu peso por semana es una meta habitual para conservar músculo. Con mucha grasa que perder, puedes ir más rápido."
    fr:
      title: "0,5 à 1 %"
      body: "Du poids par semaine, c'est l'objectif courant pour garder le muscle. Avec beaucoup de gras, tu peux aller plus vite."
    pt:
      title: "0,5 a 1%"
      body: "Do teu peso por semana é um alvo comum para manter músculo. Com muita gordura a perder, podes começar mais rápido."
    tr:
      title: "%0,5-1"
      body: "Kası korumak için haftada vücut ağırlığının bu kadarı yaygın hedef. Çok yağın varsa daha hızlı başlayabilirsin."

  - key: langzaam-wint
    kind: fact
    en:
      title: "0.7% a week"
      body: "Lifters losing that slowly gained lean mass. Those aiming for 1.4% a week only held on to it."
    nl:
      title: "0,7% per week"
      body: "Krachtsporters die zo langzaam afvielen, wonnen vetvrije massa. Wie 1,4% per week deed, hield het alleen vast."
    de:
      title: "0,7 % pro Woche"
      body: "Kraftsportler, die so langsam abnahmen, bauten fettfreie Masse auf. Mit 1,4 % pro Woche hielten sie sie nur."
    es:
      title: "0,7 % por semana"
      body: "Deportistas de fuerza que bajaban así de lento ganaron masa magra. Con 1,4 % semanal solo la mantuvieron."
    fr:
      title: "0,7 % par semaine"
      body: "Des sportifs qui perdaient aussi lentement ont gagné de la masse maigre. À 1,4 %, ils l'ont juste gardée."
    pt:
      title: "0,7% por semana"
      body: "Atletas de força que perdiam assim devagar ganharam massa magra. Com 1,4% por semana só a mantiveram."
    tr:
      title: "Haftada %0,7"
      body: "Bu kadar yavaş veren sporcular yağsız kütle kazandı. Haftada %1,4 hedefleyenler sadece korudu."

  - key: eiwit-als-je-slank-bent
    kind: fact
    en:
      title: "2.3 to 3.1 g"
      body: "Protein per kg of fat-free mass may be needed to keep muscle in a deficit, if you're lean and lift."
    nl:
      title: "2,3 tot 3,1 gram"
      body: "Eiwit per kilo vetvrije massa is misschien nodig om spier te houden in een tekort, als je slank bent en traint."
    de:
      title: "2,3 bis 3,1 g"
      body: "Protein pro kg fettfreier Masse brauchst du im Defizit vielleicht, wenn du schlank bist und Kraft trainierst."
    es:
      title: "2,3 a 3,1 g"
      body: "De proteína por kg de masa magra pueden hacer falta en déficit si estás delgado y entrenas fuerza."
    fr:
      title: "2,3 à 3,1 g"
      body: "De protéines par kg de masse maigre peuvent être utiles en déficit si tu es sec et fais de la muscu."
    pt:
      title: "2,3 a 3,1 g"
      body: "De proteína por kg de massa magra podem ser precisos em défice, se fores magro e treinares força."
    tr:
      title: "2,3-3,1 g"
      body: "Zayıfsan ve ağırlık çalışıyorsan, açıkta kası korumak için yağsız kütle kilosu başına bu kadar protein gerekebilir."

  - key: maandag-zwaarder
    kind: myth
    en:
      title: "Monday"
      body: "Myth: heavier on Monday means you gained. In a study, weight peaked Sunday and Monday and fell during the week."
    nl:
      title: "Maandag"
      body: "Mythe: zwaarder op maandag betekent aankomen. In een studie piekte gewicht zondag en maandag en zakte het daarna."
    de:
      title: "Montag"
      body: "Mythos: Montags schwerer heißt zugenommen. In einer Studie war das Gewicht So und Mo am höchsten und sank dann."
    es:
      title: "Lunes"
      body: "Mito: pesar más el lunes es haber engordado. En un estudio, el peso subía domingo y lunes y bajaba en la semana."
    fr:
      title: "Lundi"
      body: "Mythe : plus lourd le lundi, c'est avoir grossi. Dans une étude, le poids culminait dimanche et lundi puis baissait."
    pt:
      title: "Segunda-feira"
      body: "Mito: mais pesado à segunda é ter engordado. Num estudo, o peso subia domingo e segunda e descia na semana."
    tr:
      title: "Pazartesi"
      body: "Efsane: pazartesi daha ağır olmak kilo aldın demek. Bir çalışmada kilo pazar ve pazartesi zirve yapıp hafta içi düştü."

  - key: stofwisseling-kapot
    kind: myth
    en:
      title: "92 kcal"
      body: "Myth: diets wreck metabolism. In obesity, after 8 weeks on 1,000 kcal, resting burn ended just 92 kcal below forecast."
    nl:
      title: "92 kcal"
      body: "Mythe: lijnen sloopt je stofwisseling. Bij obesitas en 8 weken 1.000 kcal zakte de rustverbranding maar 92 kcal extra."
    de:
      title: "92 kcal"
      body: "Mythos: Diäten ruinieren den Stoffwechsel. Bei Adipositas und 8 Wochen 1.000 kcal sank der Ruheumsatz nur 92 kcal extra."
    es:
      title: "92 kcal"
      body: "Mito: la dieta rompe el metabolismo. Con obesidad y 8 semanas a 1.000 kcal, el gasto en reposo bajó solo 92 kcal de más."
    fr:
      title: "92 kcal"
      body: "Mythe : le régime casse le métabolisme. Obèses, 8 semaines à 1 000 kcal : 92 kcal de moins au repos que prévu."
    pt:
      title: "92 kcal"
      body: "Mito: a dieta estraga o metabolismo. Com obesidade e 8 semanas a 1.000 kcal, o gasto em repouso caiu só 92 kcal a mais."
    tr:
      title: "92 kcal"
      body: "Efsane: diyet metabolizmanı mahveder. Obezlerde 8 hafta 1.000 kcal sonrası dinlenme yakımı yalnızca 92 kcal fazla düştü."

  - key: dieetpauze
    kind: fact
    en:
      title: "3 weeks on, 1 off"
      body: "Lifters who dieted like that lost about as much fat as nonstop dieters, and felt less hungry."
    nl:
      title: "3 weken aan, 1 uit"
      body: "Krachtsporters die zo lijnden verloren ongeveer evenveel vet als wie doorging, met minder honger."
    de:
      title: "3 Wochen an, 1 aus"
      body: "Kraftsportler mit diesem Rhythmus verloren etwa so viel Fett wie Dauerdiäter und hatten weniger Hunger."
    es:
      title: "3 semanas sí, 1 no"
      body: "Quienes hacían dieta así perdieron casi la misma grasa que los que no paraban, y con menos hambre."
    fr:
      title: "3 semaines on, 1 off"
      body: "Les pratiquants qui faisaient ça ont perdu presque autant de gras qu'en continu, avec moins de faim."
    pt:
      title: "3 semanas sim, 1 não"
      body: "Quem fez dieta assim perdeu quase tanta gordura como quem não parou, e com menos fome."
    tr:
      title: "3 hafta diyet, 1 ara"
      body: "Böyle diyet yapanlar aralıksız yapanlar kadar yağ kaybetti ve daha az acıktı."

  - key: vasten
    kind: myth
    en:
      title: "28 trials"
      body: "Myth: fasting burns more fat than a diet. In 28 trials it lost about the same weight and fat as eating less every day."
    nl:
      title: "28 studies"
      body: "Mythe: vasten verbrandt meer vet dan lijnen. In 28 studies viel je er evenveel mee af als met elke dag minder eten."
    de:
      title: "28 Studien"
      body: "Mythos: Fasten verbrennt mehr Fett als eine Diät. In 28 Studien brachte es etwa so viel wie täglich weniger essen."
    es:
      title: "28 ensayos"
      body: "Mito: el ayuno quema más grasa que una dieta. En 28 ensayos dio casi el mismo resultado que comer menos cada día."
    fr:
      title: "28 essais"
      body: "Mythe : le jeûne brûle plus de gras qu'un régime. Sur 28 essais, il a fait autant que manger moins chaque jour."
    pt:
      title: "28 ensaios"
      body: "Mito: o jejum queima mais gordura do que uma dieta. Em 28 ensaios deu quase o mesmo que comer menos todos os dias."
    tr:
      title: "28 çalışma"
      body: "Efsane: oruç diyetten çok yağ yakar. 28 çalışmada her gün az yemekle aşağı yukarı aynı kilo ve yağ kaybettirdi."

  - key: eiwit-per-maaltijd
    kind: fact
    en:
      title: "Number of meals"
      body: "In a deficit, protein per meal may matter more than how many meals you eat. Pick a rhythm you can keep."
    nl:
      title: "Aantal maaltijden"
      body: "In een tekort telt eiwit per maaltijd misschien meer dan hoeveel maaltijden je eet. Kies een ritme dat je volhoudt."
    de:
      title: "Zahl der Mahlzeiten"
      body: "Im Defizit zählt Protein pro Mahlzeit wohl mehr als die Zahl der Mahlzeiten. Wähl einen Rhythmus, der bleibt."
    es:
      title: "Número de comidas"
      body: "En déficit, la proteína por comida quizá importe más que cuántas comidas haces. Elige un ritmo sostenible."
    fr:
      title: "Nombre de repas"
      body: "En déficit, les protéines par repas comptent sans doute plus que le nombre de repas. Choisis un rythme tenable."
    pt:
      title: "Número de refeições"
      body: "Em défice, a proteína por refeição talvez conte mais do que o número de refeições. Escolhe um ritmo que aguentes."
    tr:
      title: "Öğün sayısı"
      body: "Açıkta öğün başına protein, öğün sayısından daha önemli olabilir. Sürdürebileceğin bir düzen seç."

  - key: stilstand
    kind: fact
    en:
      title: "100 to 200 kcal"
      body: "Cut that much, or add steps, when your weight is flat for 2 to 3 weeks. Then wait before changing more."
    nl:
      title: "100 tot 200 kcal"
      body: "Haal er zoveel af, of loop meer, als je gewicht 2 tot 3 weken stilstaat. Wacht dan voor je meer verandert."
    de:
      title: "100 bis 200 kcal"
      body: "Streich so viel oder geh mehr, wenn dein Gewicht 2 bis 3 Wochen steht. Dann abwarten, bevor du mehr änderst."
    es:
      title: "100 a 200 kcal"
      body: "Quita eso, o camina más, si tu peso lleva 2 a 3 semanas parado. Luego espera antes de cambiar nada más."
    fr:
      title: "100 à 200 kcal"
      body: "Enlève ça, ou marche plus, si ton poids stagne 2 à 3 semaines. Puis attends avant de changer autre chose."
    pt:
      title: "100 a 200 kcal"
      body: "Corta isso, ou anda mais, se o peso estiver parado 2 a 3 semanas. Depois espera antes de mudar mais."
    tr:
      title: "100-200 kcal"
      body: "Kilon 2-3 haftadır duruyorsa bu kadar azalt ya da daha çok yürü. Başka bir şeyi değiştirmeden önce bekle."

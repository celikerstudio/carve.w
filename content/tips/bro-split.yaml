article: bro-split
emoji: "💪"
tips:
  - key: wat-is-het
    kind: fact
    en:
      title: "1 muscle a day"
      body: "That's a bro split: chest day, back day and so on, usually 5 days a week."
    nl:
      title: "1 spiergroep per dag"
      body: "Dat is een bro split: borstdag, rugdag enzovoort, meestal 5 dagen per week."
    de:
      title: "1 Muskel pro Tag"
      body: "Das ist ein Bro-Split: Brusttag, Rückentag und so weiter, meist 5 Tage pro Woche."
    es:
      title: "1 músculo al día"
      body: "Eso es una bro split: día de pecho, día de espalda, etc. Suele ser 5 días por semana."
    fr:
      title: "1 muscle par jour"
      body: "C'est le bro split : jour pecs, jour dos, etc. En général 5 jours par semaine."
    pt:
      title: "1 músculo por dia"
      body: "É o bro split: dia de peito, dia de costas e por aí fora, normalmente 5 dias por semana."
    tr:
      title: "Günde 1 kas"
      body: "Bro split budur: göğüs günü, sırt günü ve diğerleri. Genelde haftada 5 gün."

  - key: werkt-wel
    kind: myth
    en:
      title: "Doesn't work"
      body: "Myth: bro splits don't build muscle. They can, if your sets get close to failure and your weekly sets are enough."
    nl:
      title: "Werkt niet"
      body: "Mythe: een bro split bouwt geen spier. Dat kan wel, als je sets dicht bij falen zitten en je weekvolume klopt."
    de:
      title: "Bringt nichts"
      body: "Mythos: Bro-Splits bauen keine Muskeln. Doch, wenn deine Sätze nah am Versagen sind und das Wochenvolumen passt."
    es:
      title: "No funciona"
      body: "Mito: la bro split no da músculo. Sí puede, si tus series rozan el fallo y llegas a las series semanales."
    fr:
      title: "Ça ne marche pas"
      body: "Mythe : le bro split ne fait pas de muscle. Si, si tes séries frôlent l'échec et que le volume hebdo suffit."
    pt:
      title: "Não funciona"
      body: "Mito: o bro split não dá músculo. Pode dar, se as séries ficarem perto da falha e o volume semanal chegar."
    tr:
      title: "İşe yaramaz"
      body: "Efsane: bro split kas yaptırmaz. Setlerin tükenmeye yakınsa ve haftalık set sayın yeterliyse yaptırır."

  - key: lichte-tweede-keer
    kind: myth
    en:
      title: "Once a week"
      body: "Myth: once a week is too little. With the same weekly sets, training frequency made no difference to growth."
    nl:
      title: "Eén keer per week"
      body: "Mythe: één keer per week is te weinig. Met evenveel sets per week maakte de frequentie niets uit voor groei."
    de:
      title: "Einmal pro Woche"
      body: "Mythos: Einmal pro Woche ist zu wenig. Bei gleichen Wochensätzen machte die Frequenz beim Wachstum nichts aus."
    es:
      title: "Una vez por semana"
      body: "Mito: una vez por semana es poco. Con las mismas series semanales, la frecuencia no cambió el crecimiento."
    fr:
      title: "Une fois par semaine"
      body: "Mythe : une fois par semaine, c'est trop peu. À volume hebdo égal, la fréquence n'a rien changé."
    pt:
      title: "Uma vez por semana"
      body: "Mito: uma vez por semana é pouco. Com as mesmas séries semanais, a frequência não mudou o crescimento."
    tr:
      title: "Haftada bir"
      body: "Efsane: haftada bir kez çok az. Haftalık set sayısı aynıysa sıklık büyümede fark yaratmadı."

  - key: een-dag-opbouw
    kind: fact
    en:
      title: "4 to 6 exercises"
      body: "For the muscle of the day, 3 to 4 sets each. Compound lifts first, isolation after."
    nl:
      title: "4 tot 6 oefeningen"
      body: "Voor de spier van de dag, 3 tot 4 sets per oefening. Eerst samengestelde oefeningen, daarna isolatie."
    de:
      title: "4 bis 6 Übungen"
      body: "Für den Muskel des Tages, je 3 bis 4 Sätze. Erst Grundübungen, dann Isolation."
    es:
      title: "4 a 6 ejercicios"
      body: "Para el músculo del día, 3 a 4 series cada uno. Primero los compuestos, luego el aislamiento."
    fr:
      title: "4 à 6 exercices"
      body: "Pour le muscle du jour, 3 à 4 séries chacun. Les polyarticulaires d'abord, l'isolation ensuite."
    pt:
      title: "4 a 6 exercícios"
      body: "Para o músculo do dia, 3 a 4 séries cada. Primeiro os compostos, depois o isolamento."
    tr:
      title: "4-6 hareket"
      body: "Günün kası için her biri 3-4 set. Önce bileşik hareketler, sonra izolasyon."

  - key: niet-kapot-trainen
    kind: myth
    en:
      title: "Wrecked"
      body: "Myth: chest day should leave you wrecked. Hammering one muscle to exhaustion makes your later sets poor."
    nl:
      title: "Kapot"
      body: "Mythe: na borstdag moet je kapot zijn. Eén spier helemaal uitputten maakt je latere sets slechter."
    de:
      title: "Platt"
      body: "Mythos: Nach dem Brusttag musst du platt sein. Einen Muskel völlig auszupowern macht spätere Sätze schlechter."
    es:
      title: "Destrozado"
      body: "Mito: el día de pecho debe dejarte destrozado. Agotar un músculo del todo empeora tus series siguientes."
    fr:
      title: "Lessivé"
      body: "Mythe : le jour pecs doit te lessiver. Épuiser un muscle à fond rend tes séries suivantes moins bonnes."
    pt:
      title: "Destruído"
      body: "Mito: o dia de peito tem de te deixar destruído. Esgotar um músculo piora as séries seguintes."
    tr:
      title: "Bitkin"
      body: "Efsane: göğüs günü seni bitirmeli. Bir kası tamamen tüketmek sonraki setlerini kötüleştirir."

  - key: weekvolume
    kind: fact
    en:
      title: "10 to 20 sets"
      body: "Per muscle a week is still the target, even if it all happens on one or two days."
    nl:
      title: "10 tot 20 sets"
      body: "Per spier per week blijft het doel, ook als alles op één of twee dagen gebeurt."
    de:
      title: "10 bis 20 Sätze"
      body: "Pro Muskel und Woche bleiben das Ziel, auch wenn alles an ein oder zwei Tagen passiert."
    es:
      title: "10 a 20 series"
      body: "Por músculo y semana siguen siendo la meta, aunque todo caiga en uno o dos días."
    fr:
      title: "10 à 20 séries"
      body: "Par muscle et par semaine restent l'objectif, même si tout tient en un ou deux jours."
    pt:
      title: "10 a 20 séries"
      body: "Por músculo por semana continua a ser o alvo, mesmo que tudo caia em um ou dois dias."
    tr:
      title: "10-20 set"
      body: "Her şey bir iki güne sığsa bile hedef, kas başına haftada bu kadar set."

  - key: wanneer-terugschakelen
    kind: fact
    en:
      title: "Lighter week"
      body: "Soreness that lingers plus lifts that stall is your cue. A fixed deload every few weeks is habit, not evidence."
    nl:
      title: "Lichtere week"
      body: "Spierpijn die blijft plus gewichten die stilstaan is je signaal. Een vaste deload is gewoonte, geen bewijs."
    de:
      title: "Leichtere Woche"
      body: "Anhaltender Muskelkater plus stagnierende Gewichte sind dein Signal. Ein fester Deload ist Gewohnheit."
    es:
      title: "Semana suave"
      body: "Agujetas que no se van y pesos estancados son tu señal. Una descarga fija cada pocas semanas es costumbre."
    fr:
      title: "Semaine légère"
      body: "Des courbatures qui durent et des charges qui stagnent : c'est le signal. Une décharge fixe, c'est une habitude."
    pt:
      title: "Semana leve"
      body: "Dores que não passam e pesos parados são o teu sinal. Um deload fixo a cada poucas semanas é hábito."
    tr:
      title: "Hafif hafta"
      body: "Geçmeyen ağrı ve duran ağırlıklar senin işaretin. Birkaç haftada bir sabit deload sadece alışkanlık."

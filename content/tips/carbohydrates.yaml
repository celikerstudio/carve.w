article: carbohydrates
emoji: "🍞"
tips:
  - key: koolhydraten-maken-dik
    kind: myth
    en:
      title: "Fattening carbs"
      body: "Myth: carbs make you fat. In 32 studies, swapping carbs for fat at equal calories didn't burn more fat."
    nl:
      title: "Dikmakers"
      body: "Mythe: koolhydraten maken dik. In 32 studies gaf ruilen voor vet, bij gelijke calorieën, niet meer vetverlies."
    de:
      title: "Dickmacher"
      body: "Mythos: Kohlenhydrate machen dick. Bei gleichen Kalorien brachte Fett statt Kohlenhydrate in 32 Studien keinen Vorteil."
    es:
      title: "Engordan"
      body: "Mito: los hidratos engordan. En 32 estudios, cambiarlos por grasa con las mismas calorías no quemó más grasa."
    fr:
      title: "Ça fait grossir"
      body: "Mythe : les glucides font grossir. Sur 32 études, les remplacer par du gras à calories égales n'a pas fait fondre plus."
    pt:
      title: "Engordam"
      body: "Mito: os hidratos engordam. Em 32 estudos, trocá-los por gordura com as mesmas calorias não queimou mais gordura."
    tr:
      title: "Kilo aldırır"
      body: "Efsane: karbonhidrat kilo aldırır. 32 çalışmada aynı kaloride karbonhidrat yerine yağ yemek daha çok yağ yakmadı."

  - key: keto-verbrandt-meer
    kind: myth
    en:
      title: "Keto"
      body: "Myth: keto burns more fat. Not with equal calories and protein. Keto can curb appetite, so people eat less."
    nl:
      title: "Keto"
      body: "Mythe: keto verbrandt meer vet. Niet bij gelijke calorieën en eiwit. Keto kan je eetlust remmen, dus je eet minder."
    de:
      title: "Keto"
      body: "Mythos: Keto verbrennt mehr Fett. Nicht bei gleichen Kalorien und gleichem Protein. Es dämpft oft den Appetit."
    es:
      title: "Keto"
      body: "Mito: la keto quema más grasa. No con las mismas calorías y proteína. Puede quitar el apetito y por eso comes menos."
    fr:
      title: "Keto"
      body: "Mythe : le keto brûle plus de gras. Pas à calories et protéines égales. Il peut couper l'appétit, donc on mange moins."
    pt:
      title: "Keto"
      body: "Mito: a keto queima mais gordura. Não com as mesmas calorias e proteína. Pode tirar o apetite, e comes menos."
    tr:
      title: "Keto"
      body: "Efsane: keto daha çok yağ yakar. Kalori ve protein aynıyken yakmaz. İştahı kesebilir, bu yüzden daha az yenir."

  - key: glycogeenvoorraad
    kind: fact
    en:
      title: "300 to 400 g"
      body: "Of carbs stored in your muscles, plus 80 to 100 g in your liver. That glycogen is a main fuel for lifting."
    nl:
      title: "300 tot 400 gram"
      body: "Koolhydraten liggen opgeslagen in je spieren, plus 80 tot 100 gram in je lever. Brandstof voor krachttraining."
    de:
      title: "300 bis 400 g"
      body: "Kohlenhydrate speichern deine Muskeln, dazu 80 bis 100 g die Leber. Dieses Glykogen treibt dein Krafttraining an."
    es:
      title: "300 a 400 g"
      body: "De hidratos guardan tus músculos, más 80 a 100 g en el hígado. Ese glucógeno es el combustible de tus pesas."
    fr:
      title: "300 à 400 g"
      body: "De glucides stockés dans tes muscles, plus 80 à 100 g dans le foie. Ce glycogène nourrit ta muscu."
    pt:
      title: "300 a 400 g"
      body: "De hidratos guardados nos músculos, mais 80 a 100 g no fígado. Esse glicogénio alimenta o treino de força."
    tr:
      title: "300-400 g"
      body: "Karbonhidrat kaslarında, 80-100 g da karaciğerinde depolanır. Bu glikojen ağırlık antrenmanının ana yakıtı."

  - key: low-fat-of-low-carb
    kind: fact
    en:
      title: "5.3 vs 6.0 kg"
      body: "Lost in a year on a healthy low-fat or low-carb diet, in 609 adults. Not a real difference."
    nl:
      title: "5,3 tegen 6,0 kilo"
      body: "Zoveel verloren 609 volwassenen in een jaar op gezond vetarm of koolhydraatarm. Geen echt verschil."
    de:
      title: "5,3 zu 6,0 kg"
      body: "Verloren 609 Erwachsene in einem Jahr mit gesunder Low-Fat- oder Low-Carb-Kost. Kein echter Unterschied."
    es:
      title: "5,3 frente a 6,0 kg"
      body: "Perdieron 609 adultos en un año con dieta sana baja en grasa o en hidratos. Sin diferencia real."
    fr:
      title: "5,3 contre 6,0 kg"
      body: "Perdus en un an par 609 adultes, en low fat ou low carb sain. Pas de vraie différence."
    pt:
      title: "5,3 contra 6,0 kg"
      body: "Perdidos num ano por 609 adultos, em low fat ou low carb saudável. Sem diferença real."
    tr:
      title: "5,3'e karşı 6,0 kg"
      body: "609 yetişkin sağlıklı az yağlı ya da az karbonhidratlı diyetle bir yılda bunu verdi. Gerçek fark yok."

  - key: lifters-weinig-nodig
    kind: myth
    en:
      title: "15 of 17 studies"
      body: "Myth: lifters need 3 to 7 g of carbs per kg. In 15 of 17 lifting studies, carbs made no difference to strength."
    nl:
      title: "15 van 17 studies"
      body: "Mythe: krachtsporters hebben 3 tot 7 gram koolhydraten per kilo nodig. In 15 van 17 studies maakte het niets uit."
    de:
      title: "15 von 17 Studien"
      body: "Mythos: Kraftsportler brauchen 3 bis 7 g Kohlenhydrate pro kg. In 15 von 17 Studien änderte das nichts an der Kraft."
    es:
      title: "15 de 17 estudios"
      body: "Mito: con pesas necesitas 3 a 7 g de hidratos por kg. En 15 de 17 estudios no cambiaron la fuerza."
    fr:
      title: "15 études sur 17"
      body: "Mythe : en muscu, il faut 3 à 7 g de glucides par kg. Dans 15 études sur 17, ça n'a rien changé à la force."
    pt:
      title: "15 de 17 estudos"
      body: "Mito: no treino de força precisas de 3 a 7 g de hidratos por kg. Em 15 de 17 estudos não mudou a força."
    tr:
      title: "17 çalışmanın 15'i"
      body: "Efsane: ağırlık çalışan kilo başına 3-7 g karbonhidrat ister. 17 çalışmanın 15'inde güce etkisi olmadı."

  - key: keto-en-vetvrije-massa
    kind: fact
    en:
      title: "1.3 kg"
      body: "More fat-free mass lost on keto by lifters. Part of that is water and stored carbs, which drop on keto."
    nl:
      title: "1,3 kilo"
      body: "Meer vetvrije massa verloren krachtsporters op keto. Deels is dat water en opgeslagen koolhydraten."
    de:
      title: "1,3 kg"
      body: "Mehr fettfreie Masse verloren Kraftsportler mit Keto. Ein Teil ist Wasser und gespeicherte Kohlenhydrate."
    es:
      title: "1,3 kg"
      body: "Más masa magra perdieron con keto quienes entrenaban fuerza. Parte es agua e hidratos almacenados."
    fr:
      title: "1,3 kg"
      body: "De masse maigre en plus perdus en keto par des pratiquants. Une partie, c'est de l'eau et du glycogène."
    pt:
      title: "1,3 kg"
      body: "Mais massa magra perdida em keto por quem treina força. Parte é água e hidratos armazenados."
    tr:
      title: "1,3 kg"
      body: "Ağırlık çalışanlar ketoda bu kadar fazla yağsız kütle kaybetti. Bir kısmı su ve depolanmış karbonhidrat."

  - key: vezelrijke-koolhydraten
    kind: fact
    en:
      title: "25 to 29 g"
      body: "Fibre a day gave the biggest gain in observational studies. Top fibre eaters had a 15 to 30% lower risk of death."
    nl:
      title: "25 tot 29 gram"
      body: "Vezels per dag gaf de grootste winst in observationele studies. Wie het meest at, had 15 tot 30% minder sterfterisico."
    de:
      title: "25 bis 29 g"
      body: "Ballaststoffe am Tag brachten in Beobachtungsstudien am meisten. Viel Faser hieß 15 bis 30 % weniger Sterberisiko."
    es:
      title: "25 a 29 g"
      body: "De fibra al día dieron la mayor ganancia en estudios observacionales. Los que más comían, 15-30 % menos riesgo de morir."
    fr:
      title: "25 à 29 g"
      body: "De fibres par jour, le meilleur gain en études d'observation. Risque de décès 15 à 30 % plus bas chez les gros mangeurs."
    pt:
      title: "25 a 29 g"
      body: "De fibra por dia deram o maior ganho em estudos observacionais. Quem mais comia tinha 15 a 30% menos risco de morte."
    tr:
      title: "25-29 g"
      body: "Günlük lif, gözlem çalışmalarında en büyük faydayı sağladı. En çok lif yiyenlerde ölüm riski %15-30 düşüktü."

  - key: glykemische-index
    kind: fact
    en:
      title: "Glycaemic index"
      body: "It matters little for health, according to a big series of reviews."
    nl:
      title: "Glykemische index"
      body: "Die maakt weinig uit voor je gezondheid, volgens een grote reeks reviews."
    de:
      title: "Glykämischer Index"
      body: "Er spielt für die Gesundheit kaum eine Rolle, so eine große Reihe von Übersichtsarbeiten."
    es:
      title: "Índice glucémico"
      body: "Importa poco para la salud, según una gran serie de revisiones."
    fr:
      title: "Index glycémique"
      body: "Il compte peu pour la santé, d'après une grande série de revues."
    pt:
      title: "Índice glicémico"
      body: "Importa pouco para a saúde, segundo uma grande série de revisões."
    tr:
      title: "Glisemik indeks"
      body: "Büyük bir derleme serisine göre sağlık için pek önemli değil."

  - key: timing-koolhydraten
    kind: fact
    en:
      title: "Carb timing"
      body: "Mostly it doesn't matter. It counts when you train twice a day and need glycogen back fast."
    nl:
      title: "Timing"
      body: "Meestal maakt het niet uit. Het telt als je twee keer per dag traint en snel glycogeen terug moet."
    de:
      title: "Timing"
      body: "Meist egal. Es zählt, wenn du zweimal am Tag trainierst und Glykogen schnell zurück muss."
    es:
      title: "Cuándo comerlos"
      body: "Casi siempre da igual. Cuenta si entrenas dos veces al día y necesitas reponer glucógeno rápido."
    fr:
      title: "Le timing"
      body: "La plupart du temps, peu importe. Ça compte si tu t'entraînes deux fois par jour et dois recharger vite."
    pt:
      title: "O timing"
      body: "Quase sempre não importa. Conta se treinas duas vezes por dia e precisas de repor glicogénio depressa."
    tr:
      title: "Zamanlama"
      body: "Çoğu zaman fark etmez. Günde iki kez antrenman yapıp glikojeni hızla doldurman gerekiyorsa önemli."

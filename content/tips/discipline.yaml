article: discipline
emoji: "🧱"
tips:
  - key: motivatie-of-discipline
    kind: fact
    en:
      title: "Motivation"
      body: "Comes and goes. Discipline is the habits and commitments that keep you going when it dips."
    nl:
      title: "Motivatie"
      body: "Komt en gaat. Discipline zijn de gewoontes en afspraken die je laten doorgaan als die motivatie zakt."
    de:
      title: "Motivation"
      body: "Kommt und geht. Disziplin sind die Gewohnheiten und Zusagen, die dich tragen, wenn sie nachlässt."
    es:
      title: "Motivación"
      body: "Va y viene. La disciplina son los hábitos y compromisos que te sostienen cuando baja."
    fr:
      title: "Motivation"
      body: "Elle va et vient. La discipline, ce sont les habitudes et engagements qui te portent quand elle baisse."
    pt:
      title: "Motivação"
      body: "Vai e vem. A disciplina são os hábitos e compromissos que te seguram quando ela desce."
    tr:
      title: "Motivasyon"
      body: "Gelir gider. Disiplin, motivasyon düşünce seni yürüten alışkanlıklar ve sözlerdir."

  - key: zin-niet-nodig
    kind: myth
    en:
      title: "Feeling like it"
      body: "Myth: you need to feel motivated. Routines that keep you going matter more than being in the mood."
    nl:
      title: "Zin hebben"
      body: "Mythe: je moet zin hebben. Routines die je laten doorgaan tellen meer dan of je er zin in hebt."
    de:
      title: "Lust haben"
      body: "Mythos: Du musst motiviert sein. Routinen, die dich tragen, zählen mehr als Lust."
    es:
      title: "Tener ganas"
      body: "Mito: necesitas tener ganas. Las rutinas que te mantienen cuentan más que el ánimo del día."
    fr:
      title: "Avoir envie"
      body: "Mythe : il faut avoir envie. Les routines qui te font tenir comptent plus que l'envie du jour."
    pt:
      title: "Ter vontade"
      body: "Mito: precisas de ter vontade. As rotinas que te mantêm contam mais do que a disposição."
    tr:
      title: "Canın istemesi"
      body: "Efsane: motive hissetmen gerekir. Seni yürüten rutinler, canının istemesinden daha önemli."

  - key: als-dan
    kind: fact
    en:
      title: "If-then"
      body: "If it's Tuesday 7 pm, I go to the gym. Linking a trigger to an action makes training more automatic."
    nl:
      title: "Als-dan"
      body: "Als het dinsdag 19 uur is, ga ik naar de gym. Een trigger koppelen aan een actie maakt trainen automatischer."
    de:
      title: "Wenn-dann"
      body: "Wenn es Dienstag 19 Uhr ist, gehe ich ins Gym. Auslöser plus Handlung macht Training automatischer."
    es:
      title: "Si-entonces"
      body: "Si es martes a las 19:00, voy al gimnasio. Unir un disparador a una acción hace el entreno más automático."
    fr:
      title: "Si-alors"
      body: "Si c'est mardi 19 h, je vais à la salle. Lier un déclencheur à une action rend l'entraînement automatique."
    pt:
      title: "Se-então"
      body: "Se é terça às 19h, vou ao ginásio. Ligar um gatilho a uma ação torna o treino mais automático."
    tr:
      title: "Eğer-o zaman"
      body: "Salı saat 19 ise salona giderim. Bir tetikleyiciyi bir eyleme bağlamak antrenmanı otomatikleştirir."

  - key: vijf-minuten
    kind: fact
    en:
      title: "5 minutes"
      body: "Can't get going? Start with a 5-minute warm-up. A small first step gets you past the inertia."
    nl:
      title: "5 minuten"
      body: "Kom je niet op gang? Begin met 5 minuten opwarmen. Een kleine eerste stap helpt je over de drempel."
    de:
      title: "5 Minuten"
      body: "Kommst du nicht in Gang? Fang mit 5 Minuten Aufwärmen an. Ein kleiner Schritt bringt dich über die Schwelle."
    es:
      title: "5 minutos"
      body: "¿No arrancas? Empieza con 5 minutos de calentamiento. Un primer paso pequeño vence la inercia."
    fr:
      title: "5 minutes"
      body: "Pas moyen de démarrer ? Commence par 5 minutes d'échauffement. Un petit premier pas casse l'inertie."
    pt:
      title: "5 minutos"
      body: "Não arrancas? Começa com 5 minutos de aquecimento. Um primeiro passo pequeno vence a inércia."
    tr:
      title: "5 dakika"
      body: "Başlayamıyor musun? 5 dakikalık ısınmayla başla. Küçük bir ilk adım ataleti kırar."

  - key: minimale-training
    kind: fact
    en:
      title: "2 lifts, 2 sets"
      body: "That's a minimum session for low days. You keep the habit going and still get data."
    nl:
      title: "2 oefeningen, 2 sets"
      body: "Een minimale training voor dagen zonder puf. De gewoonte blijft staan en je hebt toch data."
    de:
      title: "2 Übungen, 2 Sätze"
      body: "Eine Minimaleinheit für schwache Tage. Die Gewohnheit bleibt, und du hast trotzdem Daten."
    es:
      title: "2 ejercicios, 2 series"
      body: "Una sesión mínima para días flojos. Mantienes el hábito y aun así tienes datos."
    fr:
      title: "2 exos, 2 séries"
      body: "Une séance minimum pour les jours sans. L'habitude tient et tu as quand même des données."
    pt:
      title: "2 exercícios, 2 séries"
      body: "Um treino mínimo para dias fracos. Manténs o hábito e ainda ficas com dados."
    tr:
      title: "2 hareket, 2 set"
      body: "Keyifsiz günler için asgari antrenman. Alışkanlık sürer, yine de veri toplarsın."

  - key: drukke-dag
    kind: myth
    en:
      title: "Busy day"
      body: "Myth: a busy day means no workout. A short backup session keeps you on track."
    nl:
      title: "Drukke dag"
      body: "Mythe: op een drukke dag train je niet. Een korte noodtraining houdt je op koers."
    de:
      title: "Voller Tag"
      body: "Mythos: An vollen Tagen fällt Training aus. Eine kurze Ersatzeinheit hält dich auf Kurs."
    es:
      title: "Día ocupado"
      body: "Mito: un día ocupado es un día sin entreno. Una sesión corta de reserva te mantiene en marcha."
    fr:
      title: "Journée chargée"
      body: "Mythe : journée chargée, pas de séance. Une courte séance de secours te garde sur les rails."
    pt:
      title: "Dia ocupado"
      body: "Mito: dia ocupado é dia sem treino. Um treino curto de reserva mantém-te no caminho."
    tr:
      title: "Yoğun gün"
      body: "Efsane: yoğun günde antrenman olmaz. Kısa bir yedek antrenman seni yolda tutar."

  - key: minder-keuzes
    kind: fact
    en:
      title: "Fewer choices"
      body: "A fixed gym time, default meals and a standard shopping list spare your willpower, even when stressed."
    nl:
      title: "Minder keuzes"
      body: "Een vaste gymtijd, standaardmaaltijden en een vaste boodschappenlijst sparen je wilskracht, ook bij stress."
    de:
      title: "Weniger Entscheidungen"
      body: "Feste Trainingszeit, Standardessen und feste Einkaufsliste schonen die Willenskraft, auch unter Stress."
    es:
      title: "Menos decisiones"
      body: "Hora fija de gym, comidas por defecto y lista de la compra fija ahorran voluntad, incluso con estrés."
    fr:
      title: "Moins de choix"
      body: "Heure de salle fixe, repas par défaut et liste de courses type ménagent ta volonté, même stressé."
    pt:
      title: "Menos escolhas"
      body: "Hora fixa de treino, refeições padrão e lista de compras fixa poupam força de vontade, mesmo com stress."
    tr:
      title: "Daha az seçim"
      body: "Sabit spor saati, hazır öğünler ve standart alışveriş listesi stresliyken bile iradeni korur."

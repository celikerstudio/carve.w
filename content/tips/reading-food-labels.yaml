article: reading-food-labels
emoji: "🏷️"
tips:
  - key: portiegrootte
    kind: fact
    en:
      title: "Serving size"
      body: "Label numbers are per serving. Check how many servings you actually eat. That's where calories hide."
    nl:
      title: "Portiegrootte"
      body: "De getallen op het etiket zijn per portie. Kijk hoeveel porties je echt eet. Daar verstoppen calorieën zich."
    de:
      title: "Portionsgröße"
      body: "Die Werte gelten pro Portion. Prüf, wie viele Portionen du wirklich isst. Da verstecken sich Kalorien."
    es:
      title: "Ración"
      body: "Los datos de la etiqueta son por ración. Mira cuántas comes de verdad. Ahí se esconden las calorías."
    fr:
      title: "Portion"
      body: "Les chiffres de l'étiquette sont par portion. Regarde combien tu en manges vraiment. Les calories se cachent là."
    pt:
      title: "Porção"
      body: "Os números do rótulo são por porção. Vê quantas porções comes mesmo. É aí que as calorias se escondem."
    tr:
      title: "Porsiyon"
      body: "Etiketteki değerler porsiyon başına. Gerçekte kaç porsiyon yediğine bak. Kaloriler orada saklanır."

  - key: olie-en-sauzen
    kind: fact
    en:
      title: "Oils and sauces"
      body: "Pack a lot of calories into a small portion, like snacks do. Measure them instead of guessing."
    nl:
      title: "Olie en sauzen"
      body: "Stoppen veel calorieën in een kleine portie, net als snacks. Meet ze af in plaats van te gokken."
    de:
      title: "Öle und Soßen"
      body: "Packen viele Kalorien in eine kleine Portion, wie Snacks. Abmessen statt schätzen."
    es:
      title: "Aceites y salsas"
      body: "Meten muchas calorías en poca cantidad, como los snacks. Mídelos en vez de calcular a ojo."
    fr:
      title: "Huiles et sauces"
      body: "Concentrent beaucoup de calories dans une petite portion, comme les snacks. Mesure au lieu de deviner."
    pt:
      title: "Óleos e molhos"
      body: "Metem muitas calorias numa porção pequena, como os snacks. Mede em vez de adivinhar."
    tr:
      title: "Yağ ve soslar"
      body: "Atıştırmalıklar gibi küçük porsiyonda çok kalori taşır. Tahmin etme, ölç."

  - key: eiwit-per-calorie
    kind: fact
    en:
      title: "Protein per calorie"
      body: "Choosing between two similar products? Compare how much protein you get per calorie."
    nl:
      title: "Eiwit per calorie"
      body: "Twijfel je tussen twee vergelijkbare producten? Kijk hoeveel eiwit je per calorie krijgt."
    de:
      title: "Protein pro Kalorie"
      body: "Zwei ähnliche Produkte? Vergleich, wie viel Protein du pro Kalorie bekommst."
    es:
      title: "Proteína por caloría"
      body: "¿Dudas entre dos productos parecidos? Compara cuánta proteína te da cada caloría."
    fr:
      title: "Protéines par calorie"
      body: "Deux produits proches ? Compare la quantité de protéines par calorie."
    pt:
      title: "Proteína por caloria"
      body: "Indeciso entre dois produtos parecidos? Compara quanta proteína tens por caloria."
    tr:
      title: "Kalori başına protein"
      body: "İki benzer ürün arasında mı kaldın? Kalori başına ne kadar protein aldığını karşılaştır."

  - key: volgorde-ingredienten
    kind: fact
    en:
      title: "First ingredient"
      body: "Ingredients are listed by amount. Whatever comes first, there's the most of."
    nl:
      title: "Eerste ingrediënt"
      body: "Ingrediënten staan op volgorde van hoeveelheid. Wat vooraan staat, zit er het meest in."
    de:
      title: "Erste Zutat"
      body: "Zutaten stehen nach Menge geordnet. Was zuerst kommt, steckt am meisten drin."
    es:
      title: "Primer ingrediente"
      body: "Los ingredientes van por cantidad. Lo que va primero es lo que más hay."
    fr:
      title: "Premier ingrédient"
      body: "Les ingrédients sont classés par quantité. Le premier est celui qu'il y a le plus."
    pt:
      title: "Primeiro ingrediente"
      body: "Os ingredientes estão por ordem de quantidade. O primeiro é o que há mais."
    tr:
      title: "İlk içerik"
      body: "İçerikler miktara göre sıralanır. İlk sıradaki en çok olandır."

  - key: lange-lijst
    kind: fact
    en:
      title: "Long lists"
      body: "Lots of ultra-processed ingredients may mean the food keeps you less full per calorie."
    nl:
      title: "Lange lijst"
      body: "Veel ultrabewerkte ingrediënten kan betekenen dat het eten je per calorie minder vult."
    de:
      title: "Lange Listen"
      body: "Viele hochverarbeitete Zutaten können heißen, dass das Essen pro Kalorie weniger satt macht."
    es:
      title: "Listas largas"
      body: "Muchos ingredientes ultraprocesados pueden significar que sacia menos por caloría."
    fr:
      title: "Longues listes"
      body: "Beaucoup d'ingrédients ultra-transformés peut vouloir dire moins de satiété par calorie."
    pt:
      title: "Listas longas"
      body: "Muitos ingredientes ultraprocessados podem querer dizer que sacia menos por caloria."
    tr:
      title: "Uzun listeler"
      body: "Çok sayıda ultra işlenmiş içerik, yiyeceğin kalori başına daha az doyurduğu anlamına gelebilir."

  - key: eiwit-en-vezels
    kind: fact
    en:
      title: "Protein and fibre"
      body: "Check both on the label, not just calories. Both affect how full a food keeps you."
    nl:
      title: "Eiwit en vezels"
      body: "Kijk naar allebei op het etiket, niet alleen naar calorieën. Ze bepalen hoe vol je blijft."
    de:
      title: "Protein und Fasern"
      body: "Schau auf beides, nicht nur auf Kalorien. Beides bestimmt, wie satt du bleibst."
    es:
      title: "Proteína y fibra"
      body: "Mira las dos en la etiqueta, no solo calorías. Ambas influyen en lo que te sacia."
    fr:
      title: "Protéines et fibres"
      body: "Regarde les deux, pas que les calories. Elles jouent sur la satiété."
    pt:
      title: "Proteína e fibra"
      body: "Vê as duas no rótulo, não só calorias. Ambas influenciam a saciedade."
    tr:
      title: "Protein ve lif"
      body: "Etikette sadece kaloriye değil ikisine de bak. İkisi de tokluğu etkiler."

  - key: gezond-op-de-verpakking
    kind: myth
    en:
      title: "Healthy on the pack"
      body: "Myth: a health claim on the pack means it's healthy. Branding tells you little. Check the numbers."
    nl:
      title: "Gezond op het pak"
      body: "Mythe: staat er gezond op, dan is het gezond. Marketing zegt weinig. Kijk naar de getallen."
    de:
      title: "Gesund auf der Packung"
      body: "Mythos: Steht gesund drauf, ist es gesund. Marketing sagt wenig. Schau auf die Zahlen."
    es:
      title: "Sano en el envase"
      body: "Mito: si pone sano, es sano. El marketing dice poco. Mira los números de la etiqueta."
    fr:
      title: "Sain sur l'emballage"
      body: "Mythe : si c'est écrit sain, c'est sain. Le marketing dit peu. Regarde les chiffres."
    pt:
      title: "Saudável na embalagem"
      body: "Mito: se diz saudável, é saudável. O marketing diz pouco. Vê os números."
    tr:
      title: "Paketteki sağlıklı"
      body: "Efsane: pakette sağlıklı yazıyorsa sağlıklıdır. Pazarlama pek bir şey söylemez. Rakamlara bak."

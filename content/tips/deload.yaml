article: deload
emoji: "🪫"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Deload"
      body: "A stretch where you train less on purpose, to lower fatigue and get ready for your next block."
    nl:
      title: "Deload"
      body: "Een periode waarin je bewust minder traint, om vermoeidheid te laten zakken en klaar te zijn voor je volgende blok."
    de:
      title: "Deload"
      body: "Eine Phase, in der du bewusst weniger trainierst, um Ermüdung abzubauen und bereit für den nächsten Block zu sein."
    es:
      title: "Descarga"
      body: "Un periodo en el que entrenas menos a propósito, para bajar la fatiga y llegar listo al siguiente bloque."
    fr:
      title: "Décharge"
      body: "Une période où tu t'entraînes moins exprès, pour faire baisser la fatigue et attaquer le bloc suivant."
    pt:
      title: "Deload"
      body: "Um período em que treinas menos de propósito, para baixar a fadiga e chegar pronto ao próximo bloco."
    tr:
      title: "Deload"
      body: "Yorgunluğu azaltmak ve sonraki bloğa hazır olmak için bilerek daha az çalıştığın dönem."

  - key: elke-4-tot-8-weken
    kind: myth
    en:
      title: "Every 4 to 8 weeks"
      body: "Myth: you should deload every 4 to 8 weeks. That's a coaching habit built on an assumption, not evidence."
    nl:
      title: "Elke 4 tot 8 weken"
      body: "Mythe: je moet elke 4 tot 8 weken een deload doen. Dat is een coachgewoonte op een aanname, niet op bewijs."
    de:
      title: "Alle 4 bis 8 Wochen"
      body: "Mythos: Alle 4 bis 8 Wochen ein Deload. Das ist eine Trainergewohnheit auf einer Annahme, nicht auf Belegen."
    es:
      title: "Cada 4 a 8 semanas"
      body: "Mito: hay que descargar cada 4 a 8 semanas. Es una costumbre de entrenadores basada en una suposición."
    fr:
      title: "Toutes les 4 à 8 sem."
      body: "Mythe : il faut décharger toutes les 4 à 8 semaines. Une habitude de coachs basée sur une supposition."
    pt:
      title: "A cada 4 a 8 semanas"
      body: "Mito: deves fazer deload a cada 4 a 8 semanas. É um hábito de treinadores, assente numa suposição."
    tr:
      title: "Her 4-8 haftada"
      body: "Efsane: her 4-8 haftada deload yapmalısın. Bu kanıta değil, bir varsayıma dayanan antrenör alışkanlığı."

  - key: minder-volume
    kind: fact
    en:
      title: "Fewer sets"
      body: "That's the core of a deload: fewer sets, reps or sessions. You can keep your usual exercises."
    nl:
      title: "Minder sets"
      body: "Dat is de kern van een deload: minder sets, herhalingen of trainingen. Je oefeningen mag je houden."
    de:
      title: "Weniger Sätze"
      body: "Das ist der Kern eines Deloads: weniger Sätze, Wiederholungen oder Einheiten. Die Übungen bleiben."
    es:
      title: "Menos series"
      body: "Es la base de una descarga: menos series, repeticiones o sesiones. Puedes mantener tus ejercicios."
    fr:
      title: "Moins de séries"
      body: "C'est le cœur d'une décharge : moins de séries, de reps ou de séances. Tu peux garder tes exercices."
    pt:
      title: "Menos séries"
      body: "É o essencial de um deload: menos séries, repetições ou treinos. Podes manter os exercícios."
    tr:
      title: "Daha az set"
      body: "Deload'un özü budur: daha az set, tekrar ya da antrenman. Hareketlerini koruyabilirsin."

  - key: zelfde-gewicht
    kind: myth
    en:
      title: "Lighter weights"
      body: "Myth: a deload means lighter weights. The same weight is fine, as long as you do clearly less work."
    nl:
      title: "Lichter gewicht"
      body: "Mythe: een deload betekent lichter gewicht. Hetzelfde gewicht mag, als je maar duidelijk minder doet."
    de:
      title: "Weniger Gewicht"
      body: "Mythos: Deload heißt weniger Gewicht. Gleiches Gewicht ist okay, solange du deutlich weniger machst."
    es:
      title: "Menos peso"
      body: "Mito: descargar es bajar el peso. Puedes mantenerlo si haces claramente menos trabajo."
    fr:
      title: "Moins lourd"
      body: "Mythe : une décharge, c'est plus léger. Garder la charge va très bien si tu en fais nettement moins."
    pt:
      title: "Menos peso"
      body: "Mito: deload é baixar o peso. Podes mantê-lo, desde que faças claramente menos trabalho."
    tr:
      title: "Daha hafif"
      body: "Efsane: deload daha hafif ağırlık demektir. Belirgin şekilde daha az iş yaptıkça aynı ağırlık da olur."

  - key: geen-taper
    kind: fact
    en:
      title: "Taper"
      body: "A taper peaks you for a competition. A deload can come anywhere in your plan and is there for recovery."
    nl:
      title: "Taper"
      body: "Een taper brengt je in topvorm voor een wedstrijd. Een deload kan overal in je plan en is er voor herstel."
    de:
      title: "Tapering"
      body: "Tapering bringt dich zum Wettkampf in Topform. Ein Deload kann überall im Plan liegen und dient der Erholung."
    es:
      title: "Tapering"
      body: "El tapering te pone a tope para una competición. La descarga va en cualquier punto y sirve para recuperar."
    fr:
      title: "Affûtage"
      body: "L'affûtage te met au top pour une compétition. La décharge peut venir n'importe quand et sert à récupérer."
    pt:
      title: "Taper"
      body: "O taper põe-te no pico para uma prova. O deload pode vir em qualquer altura e serve para recuperar."
    tr:
      title: "Taper"
      body: "Taper seni yarışmaya zirvede sokar. Deload planın herhangi bir yerinde olabilir ve toparlanma içindir."

  - key: week-vrij
    kind: fact
    en:
      title: "A week off"
      body: "Halfway through 9 weeks, it kept leg size similar in trained people. Strength rose less than training through."
    nl:
      title: "Een week vrij"
      body: "Halverwege 9 weken hield het beenomvang bij getrainde mensen gelijk. Kracht steeg minder dan bij doortrainen."
    de:
      title: "Eine Woche frei"
      body: "Mitten in 9 Wochen blieb die Beinmasse bei Trainierten gleich. Die Kraft stieg weniger als beim Durchtrainieren."
    es:
      title: "Una semana libre"
      body: "A mitad de 9 semanas, el tamaño de pierna se mantuvo en entrenados. La fuerza subió menos que sin parar."
    fr:
      title: "Une semaine off"
      body: "Au milieu de 9 semaines, la taille des jambes est restée stable. La force a moins monté qu'en continu."
    pt:
      title: "Uma semana de folga"
      body: "A meio de 9 semanas, o tamanho das pernas manteve-se em treinados. A força subiu menos do que sem parar."
    tr:
      title: "Bir hafta ara"
      body: "9 haftanın ortasında deneyimlilerde bacak hacmi korundu. Güç, ara vermeyenlere göre daha az arttı."

  - key: wat-wedstrijdsporters-doen
    kind: fact
    en:
      title: "Every 5.6 weeks"
      body: "Competitive lifters deloaded about that often, for around 6 days. That shows a habit, not what works."
    nl:
      title: "Elke 5,6 weken"
      body: "Zo vaak deden wedstrijdlifters gemiddeld een deload, van zo'n 6 dagen. Dat toont een gewoonte, niet wat werkt."
    de:
      title: "Alle 5,6 Wochen"
      body: "So oft machten Wettkampfathleten im Schnitt einen Deload, etwa 6 Tage. Das zeigt Gewohnheit, nicht Wirkung."
    es:
      title: "Cada 5,6 semanas"
      body: "Así de a menudo descargaban levantadores de competición, unos 6 días. Es costumbre, no prueba de que funcione."
    fr:
      title: "Toutes les 5,6 sem."
      body: "C'est le rythme de décharge des compétiteurs, environ 6 jours. Ça montre une habitude, pas ce qui marche."
    pt:
      title: "A cada 5,6 semanas"
      body: "É a frequência de deload de atletas de competição, uns 6 dias. Mostra um hábito, não o que funciona."
    tr:
      title: "Her 5,6 haftada"
      body: "Yarışmacılar ortalama bu sıklıkla, 6 gün kadar deload yaptı. Bu bir alışkanlık, işe yaradığı değil."

  - key: zonder-deload
    kind: fact
    en:
      title: "65%"
      body: "Of competitors who do deload still thought they could keep progressing without one."
    nl:
      title: "65%"
      body: "Van de wedstrijdsporters die wel deloaden, dacht dat ze ook zonder deload vooruit konden blijven gaan."
    de:
      title: "65 %"
      body: "Der Wettkämpfer, die Deloads machen, glaubten, auch ohne weiter Fortschritte machen zu können."
    es:
      title: "65 %"
      body: "De los competidores que descargan creían que podrían seguir progresando sin hacerlo."
    fr:
      title: "65 %"
      body: "Des compétiteurs qui déchargent pensaient pouvoir progresser sans décharge."
    pt:
      title: "65%"
      body: "Dos atletas que fazem deload achavam que podiam continuar a progredir sem ele."
    tr:
      title: "%65"
      body: "Deload yapan yarışmacıların bu kadarı, deload olmadan da ilerleyebileceğini düşündü."

  - key: lange-dip
    kind: myth
    en:
      title: "Long slump"
      body: "Myth: a deload fixes any slump. An easier week is for normal fatigue. Flat for weeks? The problem may be bigger."
    nl:
      title: "Lange dip"
      body: "Mythe: een deload lost elke dip op. Een rustiger week is voor gewone vermoeidheid. Weken stil? Dan is er misschien meer."
    de:
      title: "Langes Tief"
      body: "Mythos: Ein Deload behebt jedes Tief. Eine leichte Woche ist für normale Ermüdung. Wochenlang nichts? Mehr dahinter."
    es:
      title: "Bache largo"
      body: "Mito: una descarga arregla cualquier bache. Una semana suave es para fatiga normal. ¿Semanas sin avanzar? Hay algo más."
    fr:
      title: "Longue baisse"
      body: "Mythe : une décharge règle tout. Une semaine facile, c'est pour la fatigue normale. Bloqué des semaines ? Autre chose."
    pt:
      title: "Quebra longa"
      body: "Mito: um deload resolve qualquer quebra. Uma semana leve é para fadiga normal. Semanas parado? Pode ser mais."
    tr:
      title: "Uzun düşüş"
      body: "Efsane: deload her düşüşü düzeltir. Hafif hafta normal yorgunluk içindir. Haftalardır duruyorsan sorun büyük olabilir."

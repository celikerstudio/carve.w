article: bmr
emoji: "🛋️"
tips:
  - key: grootste-deel
    kind: fact
    en:
      title: "Biggest part"
      body: "BMR is what you burn at rest just to keep running. For most people it's the biggest part of daily calories."
    nl:
      title: "Grootste deel"
      body: "Je BMR is wat je in rust verbrandt om te blijven draaien. Bij de meeste mensen is dat het grootste deel per dag."
    de:
      title: "Größter Teil"
      body: "Der Grundumsatz ist, was du in Ruhe verbrennst. Bei den meisten ist er der größte Teil des Tagesbedarfs."
    es:
      title: "La mayor parte"
      body: "Tu metabolismo basal es lo que quemas en reposo. Para casi todos es la mayor parte de las calorías del día."
    fr:
      title: "La plus grosse part"
      body: "Le métabolisme de base, c'est ce que tu brûles au repos. Pour la plupart, c'est l'essentiel des calories du jour."
    pt:
      title: "A maior parte"
      body: "O metabolismo basal é o que gastas em repouso. Para quase todos, é a maior parte das calorias do dia."
    tr:
      title: "En büyük pay"
      body: "Bazal metabolizma, dinlenirken yaktığın enerjidir. Çoğu insanda günlük kalorinin en büyük kısmı."

  - key: niet-kapot
    kind: myth
    en:
      title: "Broken metabolism"
      body: "Myth: dieting breaks your metabolism. You burn less because you weigh less and move less."
    nl:
      title: "Kapotte stofwisseling"
      body: "Mythe: diëten maakt je stofwisseling kapot. Je verbrandt minder omdat je minder weegt en minder beweegt."
    de:
      title: "Kaputter Stoffwechsel"
      body: "Mythos: Diäten machen den Stoffwechsel kaputt. Du verbrennst weniger, weil du weniger wiegst und dich weniger bewegst."
    es:
      title: "Metabolismo roto"
      body: "Mito: hacer dieta rompe el metabolismo. Quemas menos porque pesas menos y te mueves menos."
    fr:
      title: "Métabolisme cassé"
      body: "Mythe : les régimes cassent le métabolisme. Tu brûles moins parce que tu pèses moins et bouges moins."
    pt:
      title: "Metabolismo estragado"
      body: "Mito: fazer dieta estraga o metabolismo. Gastas menos porque pesas menos e te mexes menos."
    tr:
      title: "Bozuk metabolizma"
      body: "Efsane: diyet metabolizmayı bozar. Daha az yakarsın çünkü daha hafifsin ve daha az hareket ediyorsun."

  - key: calculator-is-begin
    kind: fact
    en:
      title: "2 to 3 weeks"
      body: "Track what you eat and weigh for that long to see what you really burn. A calculator is only a start."
    nl:
      title: "2 tot 3 weken"
      body: "Houd zo lang bij wat je eet en weegt, dan zie je wat je echt verbrandt. Een calculator is maar een begin."
    de:
      title: "2 bis 3 Wochen"
      body: "So lange Essen und Gewicht notieren, dann siehst du, was du wirklich verbrennst. Ein Rechner ist nur ein Start."
    es:
      title: "2 a 3 semanas"
      body: "Apunta lo que comes y pesas ese tiempo y verás lo que quemas de verdad. Una calculadora solo es el inicio."
    fr:
      title: "2 à 3 semaines"
      body: "Note ce que tu manges et pèses pendant ce temps pour voir ce que tu brûles. Un calculateur n'est qu'un début."
    pt:
      title: "2 a 3 semanas"
      body: "Regista o que comes e pesas durante esse tempo e vês o que gastas mesmo. Uma calculadora é só o início."
    tr:
      title: "2-3 hafta"
      body: "Bu süre boyunca ne yediğini ve kilonu kaydet, gerçekte ne yaktığını gör. Hesaplayıcı sadece başlangıç."

  - key: spiermassa-beschermen
    kind: fact
    en:
      title: "1.6 to 2.2 g"
      body: "Protein per kg while dieting, and keep lifting. Holding on to lean mass supports your BMR."
    nl:
      title: "1,6 tot 2,2 gram"
      body: "Eiwit per kilo tijdens het lijnen, en blijf trainen. Je spiermassa vasthouden steunt je BMR."
    de:
      title: "1,6 bis 2,2 g"
      body: "Protein pro kg in der Diät, und weiter Krafttraining. Wer Muskeln hält, stützt seinen Grundumsatz."
    es:
      title: "1,6 a 2,2 g"
      body: "De proteína por kg durante la dieta, y sigue con las pesas. Conservar músculo sostiene tu metabolismo basal."
    fr:
      title: "1,6 à 2,2 g"
      body: "De protéines par kg pendant le régime, et continue la muscu. Garder ton muscle soutient ton métabolisme."
    pt:
      title: "1,6 a 2,2 g"
      body: "De proteína por kg durante a dieta, e continua a treinar força. Manter músculo sustenta o metabolismo basal."
    tr:
      title: "1,6-2,2 g"
      body: "Diyette kilo başına protein, bir de ağırlık çalışmaya devam. Kası korumak bazal metabolizmayı destekler."

  - key: extreem-tekort
    kind: fact
    en:
      title: "Crash diets"
      body: "A very aggressive deficit drains your energy, so you move and train less. You end up burning less in total."
    nl:
      title: "Crashdiëten"
      body: "Een heel groot tekort slurpt je energie op, dus je beweegt en traint minder. Zo verbrand je in totaal minder."
    de:
      title: "Crashdiäten"
      body: "Ein sehr großes Defizit raubt Energie, also bewegst und trainierst du weniger. Am Ende verbrennst du weniger."
    es:
      title: "Dietas extremas"
      body: "Un déficit muy agresivo te deja sin energía, así que te mueves y entrenas menos. Al final quemas menos."
    fr:
      title: "Régimes extrêmes"
      body: "Un déficit très agressif vide ton énergie, donc tu bouges et t'entraînes moins. Au final, tu brûles moins."
    pt:
      title: "Dietas radicais"
      body: "Um défice muito agressivo tira-te energia, por isso mexes-te e treinas menos. No fim, gastas menos."
    tr:
      title: "Şok diyetler"
      body: "Çok sert bir açık enerjini çeker, daha az hareket edip daha az çalışırsın. Sonuçta toplamda daha az yakarsın."

  - key: opnieuw-rekenen
    kind: fact
    en:
      title: "Recalculate"
      body: "Your BMR changes with your weight. After a big weight change, work out your needs again."
    nl:
      title: "Opnieuw rekenen"
      body: "Je BMR verandert mee met je gewicht. Na een flinke verandering reken je je behoefte opnieuw uit."
    de:
      title: "Neu rechnen"
      body: "Dein Grundumsatz ändert sich mit deinem Gewicht. Nach einer großen Änderung rechnest du neu."
    es:
      title: "Vuelve a calcular"
      body: "Tu metabolismo basal cambia con tu peso. Tras un cambio grande, recalcula lo que necesitas."
    fr:
      title: "Recalcule"
      body: "Ton métabolisme de base suit ton poids. Après un gros changement, refais le calcul de tes besoins."
    pt:
      title: "Volta a calcular"
      body: "O metabolismo basal muda com o teu peso. Depois de uma grande mudança, recalcula as tuas necessidades."
    tr:
      title: "Yeniden hesapla"
      body: "Bazal metabolizman kilonla birlikte değişir. Büyük bir değişimden sonra ihtiyacını yeniden hesapla."

article: upper-lower
emoji: "↕️"
tips:
  - key: wat-is-het
    kind: fact
    en:
      title: "4 days a week"
      body: "Upper body and lower body, alternating. That trains each muscle in 2 sessions a week."
    nl:
      title: "4 dagen per week"
      body: "Bovenlichaam en onderlichaam om en om. Zo train je elke spier in 2 sessies per week."
    de:
      title: "4 Tage pro Woche"
      body: "Oberkörper und Unterkörper im Wechsel. So trainierst du jeden Muskel in 2 Einheiten pro Woche."
    es:
      title: "4 días por semana"
      body: "Tren superior e inferior alternos. Así cada músculo se trabaja en 2 sesiones por semana."
    fr:
      title: "4 jours par semaine"
      body: "Haut et bas du corps en alternance. Chaque muscle travaille ainsi en 2 séances par semaine."
    pt:
      title: "4 dias por semana"
      body: "Parte superior e inferior alternadas. Assim cada músculo é treinado em 2 sessões por semana."
    tr:
      title: "Haftada 4 gün"
      body: "Üst ve alt vücut dönüşümlü. Böylece her kas haftada 2 seansta çalışır."

  - key: weekindeling
    kind: fact
    en:
      title: "Upper, lower, rest"
      body: "Then upper, lower. Day one on horizontal press and row, the second upper day on vertical press and pull."
    nl:
      title: "Boven, onder, rust"
      body: "Dan boven, onder. Dag één horizontaal drukken en roeien, de tweede bovendag verticaal drukken en trekken."
    de:
      title: "Oben, unten, Pause"
      body: "Dann oben, unten. Tag eins horizontal drücken und rudern, der zweite Oberkörpertag vertikal."
    es:
      title: "Arriba, abajo, pausa"
      body: "Luego arriba, abajo. El primer día press y remo horizontal, el segundo press y tirón vertical."
    fr:
      title: "Haut, bas, repos"
      body: "Puis haut, bas. Le premier jour haut : poussée et tirage horizontaux, le second : verticaux."
    pt:
      title: "Cima, baixo, descanso"
      body: "Depois cima, baixo. No primeiro dia press e remada horizontal, no segundo press e puxada vertical."
    tr:
      title: "Üst, alt, dinlenme"
      body: "Sonra üst, alt. İlk üst gün yatay itiş ve row, ikinci üst gün dikey itiş ve çekiş."

  - key: tussen-de-andere-in
    kind: fact
    en:
      title: "In between"
      body: "Upper/lower gives more focus per session than full body, with less overlap than a bro split."
    nl:
      title: "Ertussenin"
      body: "Boven/onder geeft meer focus per training dan full body, met minder overlap dan een bro split."
    de:
      title: "Dazwischen"
      body: "Oben/unten bringt mehr Fokus pro Einheit als Ganzkörper und weniger Überschneidung als ein Bro-Split."
    es:
      title: "En medio"
      body: "Arriba/abajo da más foco por sesión que el cuerpo completo, con menos solape que una bro split."
    fr:
      title: "Entre les deux"
      body: "Haut/bas donne plus de focus par séance que le full body, avec moins de chevauchement qu'un bro split."
    pt:
      title: "No meio"
      body: "Cima/baixo dá mais foco por treino do que corpo inteiro, com menos sobreposição do que um bro split."
    tr:
      title: "Arada bir yerde"
      body: "Üst/alt, tüm vücuttan daha çok odak, bro split'ten daha az çakışma verir."

  - key: niet-te-veel-basisoefeningen
    kind: myth
    en:
      title: "More compounds"
      body: "Myth: more compounds make a better session. Too many rush your form. Use 2 to 4 per day plus accessories."
    nl:
      title: "Meer basisoefeningen"
      body: "Mythe: meer basisoefeningen is een betere training. Te veel geeft gehaaste techniek. Neem er 2 tot 4."
    de:
      title: "Mehr Grundübungen"
      body: "Mythos: Mehr Grundübungen, bessere Einheit. Zu viele machen die Technik hastig. Nimm 2 bis 4 pro Tag."
    es:
      title: "Más compuestos"
      body: "Mito: más compuestos es mejor sesión. Demasiados apresuran la técnica. Usa 2 a 4 al día y accesorios."
    fr:
      title: "Plus d'exos de base"
      body: "Mythe : plus de polyarticulaires, meilleure séance. Trop bâcle la technique. Prends-en 2 à 4."
    pt:
      title: "Mais compostos"
      body: "Mito: mais compostos dão melhor treino. Demasiados apressam a técnica. Usa 2 a 4 por dia e acessórios."
    tr:
      title: "Daha çok bileşik"
      body: "Efsane: daha çok bileşik hareket daha iyi antrenman. Fazlası formu aceleye getirir. Günde 2-4 yap."

  - key: zware-beendagen-spreiden
    kind: fact
    en:
      title: "Heavy leg days"
      body: "Don't put heavy squat or hinge days back to back. Space at least one rest day between them."
    nl:
      title: "Zware beendagen"
      body: "Zet zware squat- of hingedagen niet achter elkaar. Plan minstens één rustdag ertussen."
    de:
      title: "Schwere Beintage"
      body: "Leg schwere Kniebeuge- oder Hüftbeugetage nicht direkt hintereinander. Mindestens ein Ruhetag dazwischen."
    es:
      title: "Días de pierna pesados"
      body: "No pongas días pesados de sentadilla o bisagra seguidos. Deja al menos un descanso entre ellos."
    fr:
      title: "Jours jambes lourds"
      body: "Ne colle pas deux jours lourds de squat ou de hinge. Mets au moins un jour de repos entre eux."
    pt:
      title: "Dias de pernas pesados"
      body: "Não ponhas dias pesados de agachamento ou hinge seguidos. Deixa pelo menos um descanso entre eles."
    tr:
      title: "Ağır bacak günleri"
      body: "Ağır squat ya da hinge günlerini arka arkaya koyma. Aralarına en az bir dinlenme günü koy."

  - key: krap-herstel
    kind: fact
    en:
      title: "75 to 90 minutes"
      body: "Is where to cap sessions when recovery is tight. Limit how much you train to failure too."
    nl:
      title: "75 tot 90 minuten"
      body: "Daar leg je de grens als je herstel krap is. Ga dan ook minder vaak tot falen."
    de:
      title: "75 bis 90 Minuten"
      body: "Da ist Schluss, wenn die Erholung knapp ist. Geh dann auch seltener bis zum Versagen."
    es:
      title: "75 a 90 minutos"
      body: "Es el tope por sesión si vas justo de recuperación. Limita también cuánto vas al fallo."
    fr:
      title: "75 à 90 minutes"
      body: "C'est le plafond par séance si ta récup est juste. Limite aussi les séries à l'échec."
    pt:
      title: "75 a 90 minutos"
      body: "É o teto por treino se a recuperação está apertada. Limita também quanto vais à falha."
    tr:
      title: "75-90 dakika"
      body: "Toparlanman kısıtlıysa seansları burada sınırla. Tükenişe gitmeyi de azalt."

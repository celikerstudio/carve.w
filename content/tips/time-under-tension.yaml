article: time-under-tension
emoji: "⏱️"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Time under tension"
      body: "How long a muscle is loaded in a set. Change your tempo and you change it, without changing reps."
    nl:
      title: "Tijd onder spanning"
      body: "Hoe lang een spier belast wordt in een set. Verander je tempo en je verandert dit, zonder andere herhalingen."
    de:
      title: "Zeit unter Spannung"
      body: "Wie lange ein Muskel im Satz belastet ist. Änderst du das Tempo, änderst du sie, ohne andere Wdh."
    es:
      title: "Tiempo bajo tensión"
      body: "Cuánto tiempo carga un músculo en una serie. Cambia el ritmo y lo cambias, sin tocar las repeticiones."
    fr:
      title: "Temps sous tension"
      body: "La durée de charge d'un muscle dans une série. Change le tempo et tu la changes, sans changer les reps."
    pt:
      title: "Tempo sob tensão"
      body: "Quanto tempo um músculo está sob carga numa série. Muda o ritmo e mudas isso, sem mudar repetições."
    tr:
      title: "Gerilim altında süre"
      body: "Kasın bir sette ne kadar yük altında kaldığı. Tempoyu değiştirirsen tekrarı değiştirmeden bunu değiştirirsin."

  - key: tempo
    kind: fact
    en:
      title: "2 to 3 seconds"
      body: "Down, then a controlled way up. That's a brisk but controlled tempo for your key lifts."
    nl:
      title: "2 tot 3 seconden"
      body: "Omlaag, dan gecontroleerd omhoog. Dat is een vlot maar beheerst tempo voor je hoofdoefeningen."
    de:
      title: "2 bis 3 Sekunden"
      body: "Runter, dann kontrolliert hoch. Ein zügiges, aber kontrolliertes Tempo für die Hauptübungen."
    es:
      title: "2 a 3 segundos"
      body: "Al bajar y una subida controlada. Es un ritmo ágil pero controlado para tus ejercicios clave."
    fr:
      title: "2 à 3 secondes"
      body: "En descente, puis une montée contrôlée. Un tempo vif mais maîtrisé pour tes exercices clés."
    pt:
      title: "2 a 3 segundos"
      body: "A descer e uma subida controlada. Um ritmo vivo mas controlado para os exercícios principais."
    tr:
      title: "2-3 saniye"
      body: "İnişte bu kadar, sonra kontrollü çıkış. Ana hareketler için canlı ama kontrollü tempo."

  - key: niet-te-traag
    kind: myth
    en:
      title: "Slower"
      body: "Myth: the slower the rep, the better. Very slow reps cut your weight and total work. Controlled is enough."
    nl:
      title: "Trager"
      body: "Mythe: hoe trager de herhaling, hoe beter. Heel traag kost gewicht en totaal werk. Gecontroleerd is genoeg."
    de:
      title: "Langsamer"
      body: "Mythos: Je langsamer, desto besser. Sehr langsame Wdh. kosten Gewicht und Gesamtarbeit. Kontrolliert reicht."
    es:
      title: "Más lento"
      body: "Mito: cuanto más lenta, mejor. Muy lento te quita peso y trabajo total. Controlado basta."
    fr:
      title: "Plus lent"
      body: "Mythe : plus c'est lent, mieux c'est. Très lent réduit la charge et le travail total. Contrôlé suffit."
    pt:
      title: "Mais lento"
      body: "Mito: quanto mais lento, melhor. Muito lento tira peso e trabalho total. Controlado chega."
    tr:
      title: "Daha yavaş"
      body: "Efsane: tekrar ne kadar yavaşsa o kadar iyi. Çok yavaş, ağırlığı ve toplam işi düşürür. Kontrollü yeter."

  - key: waar-langzaam
    kind: fact
    en:
      title: "Accessories"
      body: "Save slow lowering for those. On your heaviest compounds, keep it efficient so you keep the load."
    nl:
      title: "Accessoires"
      body: "Bewaar langzaam zakken daarvoor. Bij zware basisoefeningen hou je het efficiënt, zodat je het gewicht houdt."
    de:
      title: "Zusatzübungen"
      body: "Langsames Absenken gehört dahin. Bei schweren Grundübungen effizient bleiben, damit das Gewicht bleibt."
    es:
      title: "Accesorios"
      body: "Guarda la bajada lenta para ellos. En los compuestos pesados, sé eficiente para mantener la carga."
    fr:
      title: "Accessoires"
      body: "Garde la descente lente pour eux. Sur les gros polyarticulaires, reste efficace pour garder la charge."
    pt:
      title: "Acessórios"
      body: "Guarda a descida lenta para eles. Nos compostos pesados, sê eficiente para manter a carga."
    tr:
      title: "Yardımcı hareketler"
      body: "Yavaş inişi onlara sakla. Ağır bileşiklerde yükü koruman için verimli kal."

  - key: pauzes
    kind: fact
    en:
      title: "Pauses"
      body: "A short pause kills momentum and keeps you stable at the weak point of a lift."
    nl:
      title: "Pauzes"
      body: "Een korte pauze haalt de vaart eruit en houdt je stabiel op het zwakke punt van een oefening."
    de:
      title: "Pausen"
      body: "Eine kurze Pause nimmt den Schwung raus und hält dich am Schwachpunkt stabil."
    es:
      title: "Pausas"
      body: "Una pausa corta quita la inercia y te mantiene estable en el punto débil del ejercicio."
    fr:
      title: "Pauses"
      body: "Une courte pause casse l'élan et te garde stable au point faible du mouvement."
    pt:
      title: "Pausas"
      body: "Uma pausa curta tira o embalo e mantém-te estável no ponto fraco do exercício."
    tr:
      title: "Duraklama"
      body: "Kısa bir duraklama momentumu keser ve hareketin zayıf noktasında dengede tutar."

  - key: niet-op-zichzelf
    kind: myth
    en:
      title: "Slow reps"
      body: "Myth: slow reps work on their own. Tempo works best with steady volume and sets 1 to 3 reps from failure."
    nl:
      title: "Trage herhalingen"
      body: "Mythe: traag werkt op zichzelf. Tempo werkt het best met vast volume en sets 1 tot 3 herhalingen voor falen."
    de:
      title: "Langsame Wdh."
      body: "Mythos: Langsam wirkt von allein. Tempo wirkt am besten mit stabilem Volumen und 1 bis 3 Wdh. vor dem Versagen."
    es:
      title: "Repeticiones lentas"
      body: "Mito: lo lento funciona solo. El ritmo va mejor con volumen estable y series a 1-3 del fallo."
    fr:
      title: "Reps lentes"
      body: "Mythe : le lent marche tout seul. Le tempo marche mieux avec un volume stable et 1 à 3 reps avant l'échec."
    pt:
      title: "Repetições lentas"
      body: "Mito: lento funciona sozinho. O ritmo resulta melhor com volume estável e séries a 1-3 da falha."
    tr:
      title: "Yavaş tekrar"
      body: "Efsane: yavaş tekrar tek başına işe yarar. Tempo, sabit hacim ve tükenişe 1-3 tekrar kala setlerle en iyisi."

  - key: spierpijn
    kind: myth
    en:
      title: "Soreness"
      body: "Myth: slow tempo is for getting sore. Chasing soreness is a common mistake. Use tempo for tension near failure."
    nl:
      title: "Spierpijn"
      body: "Mythe: traag tempo is voor spierpijn. Spierpijn najagen is een fout. Gebruik tempo voor spanning dicht bij falen."
    de:
      title: "Muskelkater"
      body: "Mythos: Langsames Tempo ist für Muskelkater. Kater jagen ist ein Fehler. Nutz Tempo für Spannung nah am Versagen."
    es:
      title: "Agujetas"
      body: "Mito: el ritmo lento es para tener agujetas. Perseguirlas es un error. Úsalo para tensión cerca del fallo."
    fr:
      title: "Courbatures"
      body: "Mythe : le tempo lent sert à avoir des courbatures. Les chasser est une erreur. Vise la tension près de l'échec."
    pt:
      title: "Dores"
      body: "Mito: o ritmo lento é para ficar dorido. Perseguir dores é um erro. Usa-o para tensão perto da falha."
    tr:
      title: "Ağrı"
      body: "Efsane: yavaş tempo ağrı içindir. Ağrı peşinde koşmak hata. Tempoyu tükenişe yakın gerilim için kullan."

  - key: techniek-terug
    kind: fact
    en:
      title: "Form slipping"
      body: "At heavier weights? Slow the lowering or add pauses for a while, then speed up once control returns."
    nl:
      title: "Techniek zakt in"
      body: "Bij zwaarder gewicht? Laat langzamer zakken of pauzeer een tijdje, en versnel weer als je controle terug is."
    de:
      title: "Technik bröckelt"
      body: "Bei mehr Gewicht? Senk eine Weile langsamer ab oder pausier, dann wieder schneller, wenn die Kontrolle da ist."
    es:
      title: "Técnica que falla"
      body: "¿Con más peso? Baja más lento o añade pausas un tiempo, y acelera cuando vuelva el control."
    fr:
      title: "Technique qui lâche"
      body: "Plus lourd ? Ralentis la descente ou ajoute des pauses un temps, puis réaccélère une fois le contrôle revenu."
    pt:
      title: "Técnica a falhar"
      body: "Com mais peso? Desce mais devagar ou faz pausas um tempo, e acelera quando o controlo voltar."
    tr:
      title: "Form bozuluyor"
      body: "Ağırlık artınca mı? Bir süre inişi yavaşlat ya da duraklat, kontrol dönünce tekrar hızlan."

  - key: tempo-noteren
    kind: fact
    en:
      title: "Write it down"
      body: "Note your tempo. If it drifts, extra reps may not mean real progress."
    nl:
      title: "Schrijf het op"
      body: "Noteer je tempo. Verschuift het, dan betekenen extra herhalingen misschien geen echte vooruitgang."
    de:
      title: "Schreib es auf"
      body: "Notier dein Tempo. Verschiebt es sich, sind mehr Wdh. vielleicht kein echter Fortschritt."
    es:
      title: "Apúntalo"
      body: "Anota tu ritmo. Si cambia, más repeticiones quizá no sean progreso real."
    fr:
      title: "Note-le"
      body: "Note ton tempo. S'il dérive, des reps en plus ne veulent peut-être rien dire."
    pt:
      title: "Aponta"
      body: "Regista o teu ritmo. Se mudar, mais repetições podem não ser progresso real."
    tr:
      title: "Not al"
      body: "Temponu yaz. Kayarsa fazladan tekrarlar gerçek ilerleme olmayabilir."

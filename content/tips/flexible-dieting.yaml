article: flexible-dieting
emoji: "🍕"
tips:
  - key: een-beste-dieet
    kind: myth
    en:
      title: "One best diet"
      body: "Myth: there's one best diet. Low-fat, low-carb, keto and everything between work about equally. Pick one you can keep."
    nl:
      title: "Eén beste dieet"
      body: "Mythe: er is één beste dieet. Vetarm, koolhydraatarm, keto: ze werken ongeveer even goed. Kies wat je volhoudt."
    de:
      title: "Die beste Diät"
      body: "Mythos: Es gibt die eine beste Diät. Low Fat, Low Carb, Keto wirken etwa gleich. Nimm die, die du durchhältst."
    es:
      title: "La mejor dieta"
      body: "Mito: hay una dieta mejor. Baja en grasa, low carb o keto funcionan casi igual. Elige la que puedas mantener."
    fr:
      title: "Le meilleur régime"
      body: "Mythe : il existe un meilleur régime. Low fat, low carb, keto marchent à peu près pareil. Prends celui que tu tiens."
    pt:
      title: "A melhor dieta"
      body: "Mito: há uma dieta melhor. Pouca gordura, low carb ou keto funcionam quase igual. Escolhe a que aguentas."
    tr:
      title: "En iyi diyet"
      body: "Efsane: tek bir en iyi diyet var. Az yağlı, düşük karbonhidratlı, keto aşağı yukarı aynı. Sürdürebildiğini seç."

  - key: flexibel-niet-beter
    kind: myth
    en:
      title: "2.3 vs 3.2 kg"
      body: "Myth: flexible dieting beats a meal plan. Lifters lost 2.3 kg fat flexibly and 3.2 kg on a plan. No real difference."
    nl:
      title: "2,3 tegen 3,2 kilo"
      body: "Mythe: flexibel eten wint van een schema. Sporters verloren flexibel 2,3 en met schema 3,2 kilo vet. Geen echt verschil."
    de:
      title: "2,3 zu 3,2 kg"
      body: "Mythos: Flexibel schlägt Plan. Kraftsportler verloren flexibel 2,3 und mit Plan 3,2 kg Fett. Kein echter Unterschied."
    es:
      title: "2,3 frente a 3,2 kg"
      body: "Mito: la dieta flexible gana a un plan. Perdieron 2,3 kg de grasa en flexible y 3,2 con plan. Sin diferencia real."
    fr:
      title: "2,3 contre 3,2 kg"
      body: "Mythe : le flexible bat le plan fixe. Gras perdu : 2,3 kg en flexible, 3,2 avec plan. Pas de vraie différence."
    pt:
      title: "2,3 contra 3,2 kg"
      body: "Mito: a dieta flexível bate um plano. Perderam 2,3 kg de gordura flexível e 3,2 com plano. Sem diferença real."
    tr:
      title: "2,3'e karşı 3,2 kg"
      body: "Efsane: esnek diyet plandan iyidir. Esnekte 2,3, planla 3,2 kg yağ verildi. Gerçek fark yok."

  - key: alles-past
    kind: myth
    en:
      title: "Anything goes"
      body: "Myth: if it fits, anything goes. Calories decide fat loss, and what you eat changes how much you end up eating."
    nl:
      title: "Alles past"
      body: "Mythe: als het past, mag alles. Calorieën bepalen vetverlies, en wat je eet bepaalt hoeveel je uiteindelijk eet."
    de:
      title: "Alles passt"
      body: "Mythos: Wenn es passt, geht alles. Kalorien entscheiden den Fettabbau, und was du isst, beeinflusst wie viel."
    es:
      title: "Todo vale"
      body: "Mito: si encaja, todo vale. Las calorías deciden la pérdida de grasa, y lo que comes cambia cuánto acabas comiendo."
    fr:
      title: "Tout passe"
      body: "Mythe : si ça rentre, tout passe. Les calories décident, et ce que tu manges change combien tu finis par manger."
    pt:
      title: "Tudo vale"
      body: "Mito: se encaixa, tudo vale. As calorias decidem a perda de gordura, e o que comes muda quanto acabas por comer."
    tr:
      title: "Her şey olur"
      body: "Efsane: makroya uyuyorsa her şey serbest. Yağ kaybını kalori belirler, ne yediğin de ne kadar yediğini değiştirir."

  - key: ultrabewerkt-500-kcal
    kind: fact
    en:
      title: "500 kcal"
      body: "More a day on ultra-processed food, without feeling hungrier. People gained 0.9 kg in two weeks."
    nl:
      title: "500 kcal"
      body: "Meer per dag aten mensen op ultrabewerkt eten, zonder meer honger. Ze kwamen 0,9 kilo aan in twee weken."
    de:
      title: "500 kcal"
      body: "Mehr am Tag aßen Menschen mit stark verarbeiteter Kost, ohne mehr Hunger. Plus 0,9 kg in zwei Wochen."
    es:
      title: "500 kcal"
      body: "Más al día comía la gente con ultraprocesados, sin más hambre. Ganaron 0,9 kg en dos semanas."
    fr:
      title: "500 kcal"
      body: "De plus par jour avec de l'ultra-transformé, sans avoir plus faim. +0,9 kg en deux semaines."
    pt:
      title: "500 kcal"
      body: "A mais por dia com ultraprocessados, sem mais fome. As pessoas ganharam 0,9 kg em duas semanas."
    tr:
      title: "500 kcal"
      body: "Ultra işlenmiş yiyeceklerle daha fazla acıkmadan günde bu kadar fazla yendi. İki haftada 0,9 kg alındı."

  - key: schema-en-uitval
    kind: fact
    en:
      title: "A fixed plan"
      body: "May be easier because it takes the planning away. In one trial, slightly more people quit flexible dieting."
    nl:
      title: "Een vast schema"
      body: "Kan makkelijker zijn omdat het plannen wegvalt. In één studie haakten bij flexibel eten iets meer mensen af."
    de:
      title: "Ein fester Plan"
      body: "Kann leichter sein, weil das Planen wegfällt. In einer Studie brachen beim flexiblen Essen etwas mehr ab."
    es:
      title: "Un plan fijo"
      body: "Puede ser más fácil porque te quita la planificación. En un ensayo dejaron algo más la dieta flexible."
    fr:
      title: "Un plan fixe"
      body: "Peut être plus simple car il évite de planifier. Dans un essai, un peu plus de gens ont lâché le flexible."
    pt:
      title: "Um plano fixo"
      body: "Pode ser mais fácil porque tira o planeamento. Num ensaio, um pouco mais de pessoas desistiu da flexível."
    tr:
      title: "Sabit plan"
      body: "Planlama yükünü aldığı için daha kolay olabilir. Bir çalışmada esnek diyeti bırakan biraz daha fazlaydı."

  - key: strenge-regels
    kind: fact
    en:
      title: "Strict rules"
      body: "Rigid food rules went with more binge eating and a higher BMI. A link, not proof that the rules cause it."
    nl:
      title: "Strenge regels"
      body: "Rigide eetregels gingen samen met meer eetbuien en een hogere BMI. Een verband, geen bewijs dat ze het veroorzaken."
    de:
      title: "Strenge Regeln"
      body: "Starre Essregeln gingen mit mehr Essanfällen und höherem BMI einher. Ein Zusammenhang, kein Beweis."
    es:
      title: "Reglas estrictas"
      body: "Las reglas rígidas iban con más atracones y más IMC. Es una relación, no prueba de que lo causen."
    fr:
      title: "Règles strictes"
      body: "Les règles rigides allaient avec plus de crises de boulimie et un IMC plus haut. Un lien, pas une preuve."
    pt:
      title: "Regras rígidas"
      body: "Regras alimentares rígidas andavam com mais compulsões e IMC mais alto. Uma ligação, não uma prova."
    tr:
      title: "Katı kurallar"
      body: "Katı yeme kuralları daha çok tıkınırcasına yeme ve yüksek BKİ ile birlikteydi. Bir bağ, kanıt değil."

  - key: macro-obsessie
    kind: fact
    en:
      title: "Macros on the dot"
      body: "Chasing exact macro targets can itself turn into an unhealthy relationship with food, researchers warn."
    nl:
      title: "Macro's op de gram"
      body: "Exacte macrodoelen najagen kan zelf een ongezonde relatie met eten worden, waarschuwen onderzoekers."
    de:
      title: "Makros aufs Gramm"
      body: "Exakte Makroziele zu jagen kann selbst zu einem ungesunden Verhältnis zum Essen werden, warnen Forscher."
    es:
      title: "Macros al gramo"
      body: "Perseguir macros exactos puede volverse una relación poco sana con la comida, avisan los investigadores."
    fr:
      title: "Macros au gramme"
      body: "Viser des macros au gramme près peut créer un rapport malsain à la nourriture, préviennent des chercheurs."
    pt:
      title: "Macros ao grama"
      body: "Perseguir macros exatos pode virar uma relação pouco saudável com a comida, avisam investigadores."
    tr:
      title: "Gramı gramına makro"
      body: "Tam makro hedefleri kovalamak da yemekle sağlıksız bir ilişkiye dönüşebilir, diyor araştırmacılar."

  - key: bijhouden-helpt
    kind: fact
    en:
      title: "22 studies"
      body: "People who logged food, exercise or weight lost more. Weak evidence, but the link kept showing up."
    nl:
      title: "22 studies"
      body: "Wie eten, beweging of gewicht bijhield, viel meer af. Zwak bewijs, maar het verband kwam steeds terug."
    de:
      title: "22 Studien"
      body: "Wer Essen, Bewegung oder Gewicht notierte, nahm mehr ab. Schwache Belege, aber der Zusammenhang tauchte immer auf."
    es:
      title: "22 estudios"
      body: "Quienes registraban comida, ejercicio o peso perdían más. Pruebas débiles, pero la relación se repetía."
    fr:
      title: "22 études"
      body: "Ceux qui notaient repas, sport ou poids perdaient plus. Preuves faibles, mais le lien revenait toujours."
    pt:
      title: "22 estudos"
      body: "Quem registava comida, exercício ou peso perdia mais. Provas fracas, mas a ligação repetia-se."
    tr:
      title: "22 çalışma"
      body: "Yemeğini, egzersizini ya da kilosunu kaydedenler daha çok verdi. Kanıt zayıf ama bağ sürekli çıktı."

  - key: tellen-zonder-gedoe
    kind: fact
    en:
      title: "Tired of counting"
      body: "Track only protein and calories, or track for a few weeks until you can estimate portions."
    nl:
      title: "Tellen zat"
      body: "Houd alleen eiwit en calorieën bij, of tel een paar weken tot je porties kunt inschatten."
    de:
      title: "Zählen satt"
      body: "Notier nur Protein und Kalorien, oder zähl ein paar Wochen, bis du Portionen schätzen kannst."
    es:
      title: "Harto de contar"
      body: "Apunta solo proteína y calorías, o cuenta unas semanas hasta que sepas calcular raciones."
    fr:
      title: "Marre de compter"
      body: "Note juste protéines et calories, ou compte quelques semaines jusqu'à savoir estimer tes portions."
    pt:
      title: "Farto de contar"
      body: "Regista só proteína e calorias, ou conta umas semanas até saberes estimar porções."
    tr:
      title: "Saymaktan bıktın mı"
      body: "Sadece protein ve kaloriyi takip et ya da porsiyonları tahmin edene kadar birkaç hafta say."

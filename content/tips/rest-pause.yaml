article: rest-pause
emoji: "⏸️"
tips:
  - key: hoe-het-werkt
    kind: fact
    en:
      title: "10 to 30 seconds"
      body: "Rest that long after stopping 1 to 2 reps short of failure, then add 2 to 5 reps. Repeat once if form holds."
    nl:
      title: "10 tot 30 seconden"
      body: "Zo lang rust je na een set die 1 à 2 herhalingen voor falen stopt. Dan 2 tot 5 herhalingen erbij."
    de:
      title: "10 bis 30 Sekunden"
      body: "So lange Pause, wenn du 1 bis 2 Wdh. vor dem Versagen stoppst. Dann 2 bis 5 Wdh. dranhängen."
    es:
      title: "10 a 30 segundos"
      body: "Descansa eso tras parar a 1 o 2 del fallo, y luego suma 2 a 5 repeticiones. Repite si la técnica aguanta."
    fr:
      title: "10 à 30 secondes"
      body: "De pause après une série arrêtée à 1 ou 2 reps de l'échec, puis 2 à 5 reps de plus. Encore une fois si ça tient."
    pt:
      title: "10 a 30 segundos"
      body: "Descansa isso depois de parar a 1 ou 2 da falha, e junta 2 a 5 repetições. Repete se a técnica aguentar."
    tr:
      title: "10-30 saniye"
      body: "Tükenişe 1-2 tekrar kala durduktan sonra bu kadar dinlen, sonra 2-5 tekrar ekle. Form bozulmazsa bir kez daha."

  - key: waarom-korte-rust
    kind: fact
    en:
      title: "Phosphocreatine"
      body: "A short rest partly refills this fast fuel in your muscle. That's how you squeeze out extra reps."
    nl:
      title: "Fosfocreatine"
      body: "Een korte rust vult deze snelle brandstof in je spier deels aan. Zo pers je er extra herhalingen uit."
    de:
      title: "Phosphokreatin"
      body: "Eine kurze Pause füllt diesen schnellen Treibstoff im Muskel teilweise auf. So holst du mehr Wdh. raus."
    es:
      title: "Fosfocreatina"
      body: "Un descanso corto rellena en parte este combustible rápido. Así sacas repeticiones extra."
    fr:
      title: "Phosphocréatine"
      body: "Une courte pause recharge en partie ce carburant rapide du muscle. D'où les reps en plus."
    pt:
      title: "Fosfocreatina"
      body: "Um descanso curto repõe em parte este combustível rápido. É assim que tiras repetições extra."
    tr:
      title: "Fosfokreatin"
      body: "Kısa dinlenme kastaki bu hızlı yakıtı kısmen doldurur. Fazladan tekrarı böyle çıkarırsın."

  - key: welke-oefeningen
    kind: fact
    en:
      title: "Machines"
      body: "Use rest-pause on machines or lifts with safeties. Skip it on technical free-weight lifts."
    nl:
      title: "Machines"
      body: "Gebruik rest-pause op machines of oefeningen met veiligheden. Niet op technische vrije gewichten."
    de:
      title: "Maschinen"
      body: "Nutz Rest-Pause an Maschinen oder mit Sicherungen. Nicht bei technischen Freihantelübungen."
    es:
      title: "Máquinas"
      body: "Usa el rest-pause en máquinas o con seguros. Evítalo en ejercicios técnicos con peso libre."
    fr:
      title: "Machines"
      body: "Fais du rest-pause sur machines ou avec sécurités. Pas sur les mouvements techniques en charge libre."
    pt:
      title: "Máquinas"
      body: "Usa rest-pause em máquinas ou com seguranças. Evita em exercícios técnicos com peso livre."
    tr:
      title: "Makineler"
      body: "Rest-pause'u makinelerde ya da güvenlikli hareketlerde yap. Teknik serbest ağırlıkta yapma."

  - key: hoe-vaak
    kind: fact
    en:
      title: "1 or 2 exercises"
      body: "Per session is enough rest-pause. Performance drops the next day? Use it less often."
    nl:
      title: "1 of 2 oefeningen"
      body: "Per training is genoeg rest-pause. Zakt je prestatie de dag erna? Gebruik het minder vaak."
    de:
      title: "1 oder 2 Übungen"
      body: "Pro Einheit reichen für Rest-Pause. Sinkt die Leistung am Tag danach? Seltener nutzen."
    es:
      title: "1 o 2 ejercicios"
      body: "Por sesión es suficiente rest-pause. ¿Rindes peor al día siguiente? Úsalo menos."
    fr:
      title: "1 ou 2 exercices"
      body: "Par séance suffisent en rest-pause. Perf en baisse le lendemain ? Utilise-le moins."
    pt:
      title: "1 ou 2 exercícios"
      body: "Por treino chegam de rest-pause. O rendimento cai no dia seguinte? Usa menos vezes."
    tr:
      title: "1-2 hareket"
      body: "Antrenman başına bu kadar rest-pause yeter. Ertesi gün performans düşüyorsa daha seyrek kullan."

  - key: stop-bij-slechte-vorm
    kind: fact
    en:
      title: "Junk reps"
      body: "Stop when your form goes. Reps you grind out with poor form under fatigue are junk."
    nl:
      title: "Rommelherhalingen"
      body: "Stop als je techniek wegzakt. Herhalingen die je met slechte vorm eruit perst, zijn waardeloos."
    de:
      title: "Müll-Wiederholungen"
      body: "Hör auf, wenn die Technik nachlässt. Ermüdet mit schlechter Form gepresste Wdh. bringen nichts."
    es:
      title: "Repeticiones basura"
      body: "Para cuando se rompa la técnica. Las repeticiones sacadas con mala forma no valen."
    fr:
      title: "Reps poubelle"
      body: "Arrête quand ta technique lâche. Les reps arrachées avec une mauvaise forme ne servent à rien."
    pt:
      title: "Repetições lixo"
      body: "Para quando a técnica falhar. Repetições arrancadas com má forma não valem nada."
    tr:
      title: "Çöp tekrarlar"
      body: "Formun bozulunca dur. Yorgunken kötü formla zorla çıkan tekrarlar boşa gider."

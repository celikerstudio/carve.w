article: sauna
emoji: "🧖"
tips:
  - key: hoeveel
    kind: fact
    en:
      title: "5 to 20 minutes"
      body: "Per session, 1 to 4 times a week, depending on how well you handle the heat."
    nl:
      title: "5 tot 20 minuten"
      body: "Per keer, 1 tot 4 keer per week, afhankelijk van hoe goed je tegen de warmte kunt."
    de:
      title: "5 bis 20 Minuten"
      body: "Pro Gang, 1- bis 4-mal pro Woche, je nachdem, wie gut du Hitze verträgst."
    es:
      title: "5 a 20 minutos"
      body: "Por sesión, 1 a 4 veces por semana, según lo bien que lleves el calor."
    fr:
      title: "5 à 20 minutes"
      body: "Par séance, 1 à 4 fois par semaine, selon ta tolérance à la chaleur."
    pt:
      title: "5 a 20 minutos"
      body: "Por sessão, 1 a 4 vezes por semana, conforme aguentas o calor."
    tr:
      title: "5-20 dakika"
      body: "Seans başına, haftada 1-4 kez, sıcağa ne kadar dayandığına göre."

  - key: rustig-opbouwen
    kind: fact
    en:
      title: "5 to 10 minutes"
      body: "Is where to start if you're new. Build up to 15 to 20 as you get used to it."
    nl:
      title: "5 tot 10 minuten"
      body: "Is je start als je nieuw bent. Bouw op naar 15 tot 20 als je eraan went."
    de:
      title: "5 bis 10 Minuten"
      body: "Sind der Start, wenn du neu bist. Steigere auf 15 bis 20, wenn du dich gewöhnst."
    es:
      title: "5 a 10 minutos"
      body: "Para empezar si eres nuevo. Sube a 15 o 20 cuando te acostumbres."
    fr:
      title: "5 à 10 minutes"
      body: "Pour commencer si tu débutes. Monte à 15 ou 20 en t'habituant."
    pt:
      title: "5 a 10 minutos"
      body: "Para começar se és novo. Sobe para 15 a 20 quando te habituares."
    tr:
      title: "5-10 dakika"
      body: "Yeniysen başlangıç bu. Alıştıkça 15-20'ye çık."

  - key: niet-voor-het-tillen
    kind: myth
    en:
      title: "Before lifting"
      body: "Myth: a sauna before lifting gets you ready. It hurts your performance. Go after training or on a rest day."
    nl:
      title: "Voor het tillen"
      body: "Mythe: sauna voor het tillen maakt je klaar. Het kost prestatie. Ga na de training of op een rustdag."
    de:
      title: "Vor dem Training"
      body: "Mythos: Sauna vorher macht dich bereit. Sie kostet Leistung. Geh danach oder am Ruhetag."
    es:
      title: "Antes de entrenar"
      body: "Mito: la sauna antes de las pesas te prepara. Empeora el rendimiento. Ve después o en día de descanso."
    fr:
      title: "Avant la muscu"
      body: "Mythe : un sauna avant la muscu te prépare. Ça plombe la perf. Vas-y après ou un jour de repos."
    pt:
      title: "Antes do treino"
      body: "Mito: a sauna antes do treino prepara-te. Piora o rendimento. Vai depois ou num dia de descanso."
    tr:
      title: "Antrenmandan önce"
      body: "Efsane: antrenmandan önce sauna seni hazırlar. Performansı düşürür. Sonra ya da dinlenme günü git."

  - key: drinken
    kind: fact
    en:
      title: "Drink up"
      body: "Replace what you sweat out, with electrolytes if you sweat a lot. Skip the alcohol."
    nl:
      title: "Drink genoeg"
      body: "Vul aan wat je wegzweet, met elektrolyten als je veel zweet. Laat de alcohol staan."
    de:
      title: "Trink genug"
      body: "Ersetz, was du ausschwitzt, mit Elektrolyten bei viel Schweiß. Lass den Alkohol weg."
    es:
      title: "Bebe"
      body: "Repón lo que sudas, con electrolitos si sudas mucho. Nada de alcohol."
    fr:
      title: "Bois"
      body: "Remplace ce que tu transpires, avec des électrolytes si tu sues beaucoup. Pas d'alcool."
    pt:
      title: "Bebe"
      body: "Repõe o que suas, com eletrólitos se suares muito. Nada de álcool."
    tr:
      title: "Bol iç"
      body: "Terle kaybettiğini yerine koy, çok terliyorsan elektrolitle. Alkol yok."

  - key: wat-warmte-doet
    kind: fact
    en:
      title: "Heart rate"
      body: "Heat raises it and your circulation. A light load for heart and lungs, plus a relaxation response."
    nl:
      title: "Hartslag"
      body: "Warmte verhoogt die en je doorbloeding. Een lichte belasting voor hart en longen, plus ontspanning."
    de:
      title: "Herzfrequenz"
      body: "Hitze erhöht sie und die Durchblutung. Eine leichte Last für Herz und Lunge, dazu Entspannung."
    es:
      title: "Pulso"
      body: "El calor lo sube junto con la circulación. Una carga ligera para corazón y pulmones, y relajación."
    fr:
      title: "Rythme cardiaque"
      body: "La chaleur l'augmente, ainsi que la circulation. Un léger effort cardio, plus de la détente."
    pt:
      title: "Ritmo cardíaco"
      body: "O calor sobe-o e à circulação. Uma carga leve para coração e pulmões, e relaxamento."
    tr:
      title: "Kalp atışı"
      body: "Sıcak nabzı ve dolaşımı artırır. Kalp ve akciğer için hafif bir yük, artı rahatlama."

  - key: te-laat-op-de-avond
    kind: fact
    en:
      title: "Before bed"
      body: "Too much heat without enough fluid can hurt performance, and sleep if you go too close to bedtime."
    nl:
      title: "Voor het slapen"
      body: "Te veel warmte zonder genoeg vocht kan je prestatie schaden, en je slaap als je te laat gaat."
    de:
      title: "Vor dem Schlafen"
      body: "Zu viel Hitze ohne genug Flüssigkeit kann Leistung kosten, und Schlaf, wenn es zu spät ist."
    es:
      title: "Antes de dormir"
      body: "Mucho calor sin beber lo suficiente puede afectar al rendimiento, y al sueño si vas muy tarde."
    fr:
      title: "Avant le coucher"
      body: "Trop de chaleur sans assez boire peut nuire à la perf, et au sommeil si tu y vas trop tard."
    pt:
      title: "Antes de dormir"
      body: "Calor a mais sem beber o suficiente pode prejudicar o rendimento, e o sono se fores tarde."
    tr:
      title: "Yatmadan önce"
      body: "Yeterli sıvı olmadan fazla sıcak performansa, yatmaya çok yakınsa uykuya zarar verebilir."

  - key: langer-is-niet-beter
    kind: myth
    en:
      title: "Longer"
      body: "Myth: the longer you sit, the better. Too long can leave you dehydrated. Cool down gradually afterwards."
    nl:
      title: "Langer"
      body: "Mythe: hoe langer je zit, hoe beter. Te lang kan je uitdrogen. Koel daarna rustig af."
    de:
      title: "Länger"
      body: "Mythos: Je länger, desto besser. Zu lange kann austrocknen. Kühl dich danach langsam ab."
    es:
      title: "Más tiempo"
      body: "Mito: cuanto más rato, mejor. Demasiado puede deshidratarte. Enfríate poco a poco después."
    fr:
      title: "Plus long"
      body: "Mythe : plus tu restes, mieux c'est. Trop longtemps peut te déshydrater. Refroidis-toi doucement."
    pt:
      title: "Mais tempo"
      body: "Mito: quanto mais tempo, melhor. Tempo a mais pode desidratar-te. Arrefece aos poucos."
    tr:
      title: "Daha uzun"
      body: "Efsane: ne kadar uzun oturursan o kadar iyi. Fazlası susuz bırakabilir. Sonra yavaşça serinle."

  - key: voorzichtig
    kind: fact
    en:
      title: "Dizzy"
      body: "Get out. With a heart condition, or medication that affects heat tolerance, ask a doctor first."
    nl:
      title: "Duizelig"
      body: "Ga eruit. Met een hart- of vaataandoening, of medicijnen die warmtetolerantie raken, vraag eerst een arts."
    de:
      title: "Schwindlig"
      body: "Raus. Bei Herzproblemen oder Medikamenten, die die Hitzetoleranz beeinflussen, erst den Arzt fragen."
    es:
      title: "Mareo"
      body: "Sal. Con problemas de corazón o medicación que afecte a la tolerancia al calor, pregunta antes al médico."
    fr:
      title: "Vertiges"
      body: "Sors. Avec un souci cardiaque ou un médicament qui touche la tolérance à la chaleur, demande un médecin."
    pt:
      title: "Tonturas"
      body: "Sai. Com problemas de coração ou medicação que afete a tolerância ao calor, pergunta primeiro ao médico."
    tr:
      title: "Baş dönmesi"
      body: "Çık. Kalp sorunun ya da sıcağa dayanıklılığı etkileyen ilacın varsa önce doktora sor."

article: sleep
emoji: "😴"
tips:
  - key: zeven-uur-of-meer
    kind: fact
    en:
      title: "7 hours"
      body: "Or more, every night. That's the advice for adults aged 18 to 60."
    nl:
      title: "7 uur"
      body: "Of meer, elke nacht. Dat is het advies voor volwassenen van 18 tot 60."
    de:
      title: "7 Stunden"
      body: "Oder mehr, jede Nacht. So lautet der Rat für Erwachsene von 18 bis 60."
    es:
      title: "7 horas"
      body: "O más, cada noche. Es el consejo para adultos de 18 a 60 años."
    fr:
      title: "7 heures"
      body: "Ou plus, chaque nuit. C'est le conseil pour les adultes de 18 à 60 ans."
    pt:
      title: "7 horas"
      body: "Ou mais, todas as noites. É o conselho para adultos dos 18 aos 60."
    tr:
      title: "7 saat"
      body: "Ya da daha fazla, her gece. 18-60 yaş arası yetişkinler için öneri bu."

  - key: niet-precies-zeven
    kind: myth
    en:
      title: "Exactly 7 hours"
      body: "Myth: 7 hours is the magic number. The advice is 7 or more, and one number doesn't fit everyone."
    nl:
      title: "Precies 7 uur"
      body: "Mythe: 7 uur is het magische getal. Het advies is 7 of meer, en één getal past niet bij iedereen."
    de:
      title: "Genau 7 Stunden"
      body: "Mythos: 7 Stunden sind die magische Zahl. Der Rat lautet 7 oder mehr, und eine Zahl passt nicht für alle."
    es:
      title: "7 horas exactas"
      body: "Mito: 7 horas es la cifra mágica. El consejo es 7 o más, y un número no sirve para todos."
    fr:
      title: "Pile 7 heures"
      body: "Mythe : 7 heures, c'est le chiffre magique. Le conseil, c'est 7 ou plus, et un chiffre ne va pas à tous."
    pt:
      title: "Exatamente 7 horas"
      body: "Mito: 7 horas é o número mágico. O conselho é 7 ou mais, e um número não serve a todos."
    tr:
      title: "Tam 7 saat"
      body: "Efsane: 7 saat sihirli sayıdır. Öneri 7 ya da fazlası, tek bir sayı herkese uymaz."

  - key: slaap-en-vetverlies
    kind: fact
    en:
      title: "0.6 vs 1.4 kg"
      body: "Fat lost on the same diet with 5.5 or 8.5 hours in bed, in a small study. Sleep counts on a cut."
    nl:
      title: "0,6 tegen 1,4 kilo"
      body: "Zoveel vet verloren lijners op hetzelfde dieet, met 5,5 of 8,5 uur in bed. Een kleine studie, maar slaap telt."
    de:
      title: "0,6 zu 1,4 kg"
      body: "Fett verloren Diätende mit gleicher Diät bei 5,5 oder 8,5 Stunden im Bett. Kleine Studie, aber Schlaf zählt."
    es:
      title: "0,6 frente a 1,4 kg"
      body: "Grasa perdida con la misma dieta y 5,5 u 8,5 horas en cama, en un estudio pequeño. El sueño cuenta."
    fr:
      title: "0,6 contre 1,4 kg"
      body: "De gras perdu au même régime avec 5,5 ou 8,5 heures au lit, dans une petite étude. Le sommeil compte."
    pt:
      title: "0,6 contra 1,4 kg"
      body: "Gordura perdida com a mesma dieta e 5,5 ou 8,5 horas na cama, num estudo pequeno. O sono conta."
    tr:
      title: "0,6'ya karşı 1,4 kg"
      body: "Küçük bir çalışmada aynı diyette 5,5 ya da 8,5 saat yatakta kalanların yağ kaybı. Uyku önemli."

  - key: vetvrije-massa
    kind: fact
    en:
      title: "2.4 vs 1.5 kg"
      body: "Fat-free mass lost by short versus long sleepers in that study. It includes water and glycogen, not just muscle."
    nl:
      title: "2,4 tegen 1,5 kilo"
      body: "Vetvrije massa verloren korte tegen lange slapers in die studie. Daar zit water en glycogeen in, niet alleen spier."
    de:
      title: "2,4 zu 1,5 kg"
      body: "Fettfreie Masse verloren Kurz- gegenüber Langschläfern dort. Darin stecken Wasser und Glykogen, nicht nur Muskel."
    es:
      title: "2,4 frente a 1,5 kg"
      body: "De masa magra perdieron quienes dormían poco frente a mucho. Incluye agua y glucógeno, no solo músculo."
    fr:
      title: "2,4 contre 1,5 kg"
      body: "De masse maigre perdue en dormant peu contre beaucoup. Ça inclut eau et glycogène, pas que du muscle."
    pt:
      title: "2,4 contra 1,5 kg"
      body: "De massa magra perdida por quem dormia pouco contra muito. Inclui água e glicogénio, não só músculo."
    tr:
      title: "2,4'e karşı 1,5 kg"
      body: "O çalışmada az uyuyanlar çok uyuyanlara göre bu kadar yağsız kütle kaybetti. İçinde su ve glikojen var."

  - key: langer-slapen-minder-eten
    kind: fact
    en:
      title: "270 kcal"
      body: "Less a day eaten by short sleepers who slept 1.2 hours more after sleep counselling, over two weeks."
    nl:
      title: "270 kcal"
      body: "Minder per dag aten korte slapers die na slaapcoaching 1,2 uur langer sliepen, over twee weken."
    de:
      title: "270 kcal"
      body: "Weniger am Tag aßen Kurzschläfer, die nach Schlafberatung 1,2 Stunden länger schliefen, über zwei Wochen."
    es:
      title: "270 kcal"
      body: "Menos al día comieron quienes dormían poco y, tras consejo, durmieron 1,2 horas más, en dos semanas."
    fr:
      title: "270 kcal"
      body: "De moins par jour chez des petits dormeurs qui ont dormi 1,2 h de plus après un coaching, sur deux semaines."
    pt:
      title: "270 kcal"
      body: "A menos por dia em quem dormia pouco e, após aconselhamento, dormiu mais 1,2 horas, em duas semanas."
    tr:
      title: "270 kcal"
      body: "Az uyuyanlar uyku danışmanlığıyla 1,2 saat fazla uyuyunca iki haftada günde bu kadar az yedi."

  - key: een-nacht-zonder-slaap
    kind: fact
    en:
      title: "18%"
      body: "Less muscle building after a meal, after one sleepless night. Seen in the men, not the women, in a small study."
    nl:
      title: "18%"
      body: "Minder spieropbouw na een maaltijd, na één nacht zonder slaap. Bij de mannen, niet bij de vrouwen. Kleine studie."
    de:
      title: "18 %"
      body: "Weniger Muskelaufbau nach einer Mahlzeit nach einer schlaflosen Nacht. Bei Männern, nicht bei Frauen. Kleine Studie."
    es:
      title: "18 %"
      body: "Menos síntesis muscular tras comer después de una noche sin dormir. En hombres, no en mujeres. Estudio pequeño."
    fr:
      title: "18 %"
      body: "De construction musculaire en moins après un repas, après une nuit blanche. Chez les hommes, pas les femmes."
    pt:
      title: "18%"
      body: "Menos síntese muscular depois de comer, após uma noite sem dormir. Nos homens, não nas mulheres. Estudo pequeno."
    tr:
      title: "%18"
      body: "Uykusuz bir geceden sonra yemeğin ardından kas yapımı bu kadar düştü. Erkeklerde, kadınlarda değil. Küçük çalışma."

  - key: training-lijdt
    kind: myth
    en:
      title: "Short sleep"
      body: "Myth: sleep doesn't affect training. Short sleep cut endurance, power and speed, and made effort feel harder."
    nl:
      title: "Kort slapen"
      body: "Mythe: slaap doet niets met je training. Kort slapen kostte uithouding, kracht en snelheid. Alles voelde zwaarder."
    de:
      title: "Kurzer Schlaf"
      body: "Mythos: Schlaf beeinflusst das Training nicht. Kurzer Schlaf kostete Ausdauer, Kraft und Tempo. Alles fiel schwerer."
    es:
      title: "Dormir poco"
      body: "Mito: el sueño no afecta al entreno. Dormir poco bajó resistencia, potencia y velocidad, y todo costó más."
    fr:
      title: "Peu dormir"
      body: "Mythe : le sommeil n'influence pas l'entraînement. Peu dormir a réduit endurance, puissance et vitesse."
    pt:
      title: "Dormir pouco"
      body: "Mito: o sono não afeta o treino. Dormir pouco baixou resistência, potência e velocidade, e tudo custou mais."
    tr:
      title: "Az uyku"
      body: "Efsane: uyku antrenmanı etkilemez. Az uyku dayanıklılığı, gücü ve hızı düşürdü, eforu zorlaştırdı."

  - key: max-kracht-houdt-stand
    kind: myth
    en:
      title: "Your max"
      body: "Myth: a sleepless night kills your max. Max force dropped least of all, and not significantly after no sleep at all."
    nl:
      title: "Je max"
      body: "Mythe: een slapeloze nacht sloopt je max. Maximale kracht zakte het minst, zonder slaap zelfs niet significant."
    de:
      title: "Dein Maximum"
      body: "Mythos: Eine schlaflose Nacht killt dein Maximum. Maximalkraft sank am wenigsten, ohne Schlaf nicht signifikant."
    es:
      title: "Tu máximo"
      body: "Mito: una noche sin dormir mata tu máximo. La fuerza máxima fue lo que menos bajó, y no de forma significativa."
    fr:
      title: "Ton max"
      body: "Mythe : une nuit blanche tue ton max. La force max a le moins baissé, et pas de façon significative."
    pt:
      title: "O teu máximo"
      body: "Mito: uma noite sem dormir mata o teu máximo. A força máxima foi a que menos caiu, e não de forma significativa."
    tr:
      title: "Maksimumun"
      body: "Efsane: uykusuz gece maksimumunu bitirir. Maksimum güç en az düştü, hiç uyumamada anlamlı düşmedi."

  - key: je-merkt-het-niet
    kind: fact
    en:
      title: "6 hours before bed"
      body: "Even then, 400 mg of caffeine cost over an hour of sleep. People didn't notice it."
    nl:
      title: "6 uur voor bedtijd"
      body: "Zelfs dan kostte 400 mg cafeïne ruim een uur slaap. De mensen merkten het zelf niet."
    de:
      title: "6 Std. vor dem Bett"
      body: "Selbst dann kosteten 400 mg Koffein über eine Stunde Schlaf. Die Leute merkten es nicht."
    es:
      title: "6 horas antes"
      body: "Incluso así, 400 mg de cafeína quitaron más de una hora de sueño. La gente no lo notó."
    fr:
      title: "6 h avant le coucher"
      body: "Même là, 400 mg de caféine ont coûté plus d'une heure de sommeil. Sans que les gens s'en rendent compte."
    pt:
      title: "6 horas antes"
      body: "Mesmo assim, 400 mg de cafeína tiraram mais de uma hora de sono. As pessoas não deram por isso."
    tr:
      title: "Yatmadan 6 saat önce"
      body: "O zaman bile 400 mg kafein bir saatten fazla uykuya mal oldu. İnsanlar fark etmedi."

  - key: tijd-in-bed
    kind: fact
    en:
      title: "8.5 hours"
      body: "In bed gave about 7 hours 25 minutes of real sleep, in one study. Plan 8 hours or more in bed."
    nl:
      title: "8,5 uur"
      body: "In bed gaf in één studie zo'n 7 uur en 25 minuten echte slaap. Plan 8 uur of meer in bed."
    de:
      title: "8,5 Stunden"
      body: "Im Bett ergaben in einer Studie etwa 7 Stunden 25 Minuten echten Schlaf. Plan 8 Stunden oder mehr."
    es:
      title: "8,5 horas"
      body: "En la cama dieron unas 7 horas y 25 minutos de sueño real, en un estudio. Planea 8 horas o más."
    fr:
      title: "8,5 heures"
      body: "Au lit ont donné environ 7 h 25 de vrai sommeil, dans une étude. Prévois 8 heures ou plus au lit."
    pt:
      title: "8,5 horas"
      body: "Na cama deram cerca de 7 horas e 25 minutos de sono real, num estudo. Planeia 8 horas ou mais."
    tr:
      title: "8,5 saat"
      body: "Bir çalışmada yatakta geçen bu süre yaklaşık 7 saat 25 dakika gerçek uyku verdi. 8 saat ya da fazlasını planla."

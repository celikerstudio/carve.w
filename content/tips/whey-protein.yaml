article: whey-protein
emoji: "🫗"
tips:
  - key: niet-nodig
    kind: myth
    en:
      title: "Need whey"
      body: "Myth: you need whey to build muscle. You need enough protein, and food can cover it. Whey just makes it easy."
    nl:
      title: "Whey nodig"
      body: "Mythe: zonder whey geen spier. Je hebt genoeg eiwit nodig, en eten kan dat helemaal leveren. Whey maakt het makkelijk."
    de:
      title: "Whey nötig"
      body: "Mythos: Ohne Whey keine Muskeln. Du brauchst genug Protein, und Essen kann alles liefern. Whey macht es bequem."
    es:
      title: "Hace falta whey"
      body: "Mito: sin whey no hay músculo. Necesitas proteína suficiente y la comida puede darla. El whey lo facilita."
    fr:
      title: "Besoin de whey"
      body: "Mythe : sans whey, pas de muscle. Il faut assez de protéines, et l'assiette peut tout couvrir. La whey simplifie."
    pt:
      title: "Precisas de whey"
      body: "Mito: sem whey não há músculo. Precisas de proteína suficiente, e a comida chega. A whey só facilita."
    tr:
      title: "Whey şart"
      body: "Efsane: kas için whey şart. Yeterli protein gerekir ve yemek bunu karşılayabilir. Whey sadece kolaylaştırır."

  - key: plafond-1-6-gram
    kind: fact
    en:
      title: "1.6 g"
      body: "Of protein per kg a day in total: above that, extra protein added no more fat-free mass in trials."
    nl:
      title: "1,6 gram"
      body: "Eiwit per kilo per dag in totaal: daarboven leverde extra eiwit in studies geen extra vetvrije massa op."
    de:
      title: "1,6 g"
      body: "Protein pro kg am Tag insgesamt: darüber brachte mehr Protein in Studien keine zusätzliche fettfreie Masse."
    es:
      title: "1,6 g"
      body: "De proteína por kg al día en total: por encima, más proteína no sumó masa magra en los ensayos."
    fr:
      title: "1,6 g"
      body: "De protéines par kg et par jour au total : au-delà, plus de protéines n'a pas ajouté de masse maigre."
    pt:
      title: "1,6 g"
      body: "De proteína por kg por dia no total: acima disso, mais proteína não juntou massa magra nos ensaios."
    tr:
      title: "1,6 g"
      body: "Günde kilo başına toplam protein: bunun üstünde ek protein çalışmalarda yağsız kütle eklemedi."

  - key: wat-het-oplevert
    kind: fact
    en:
      title: "0.3 kg"
      body: "Of fat-free mass is what protein supplements added on average to training, in trials of 6 weeks or more."
    nl:
      title: "0,3 kilo"
      body: "Vetvrije massa voegden eiwitsupplementen gemiddeld toe aan training, in studies van 6 weken of langer."
    de:
      title: "0,3 kg"
      body: "Fettfreie Masse brachten Proteinsupplements im Schnitt zusätzlich zum Training, in Studien ab 6 Wochen."
    es:
      title: "0,3 kg"
      body: "De masa magra sumaron de media los suplementos de proteína al entreno, en ensayos de 6 semanas o más."
    fr:
      title: "0,3 kg"
      body: "De masse maigre en plus, en moyenne, avec des compléments de protéines, sur des essais de 6 semaines ou plus."
    pt:
      title: "0,3 kg"
      body: "De massa magra juntaram em média os suplementos de proteína ao treino, em ensaios de 6 semanas ou mais."
    tr:
      title: "0,3 kg"
      body: "6 hafta ve üstü çalışmalarda protein takviyesi antrenmana ortalama bu kadar yağsız kütle ekledi."

  - key: een-portie
    kind: fact
    en:
      title: "20 to 40 g"
      body: "Protein in a normal scoop, or about 0.25 g per kg of bodyweight. At 80 kg that's 20 g."
    nl:
      title: "20 tot 40 gram"
      body: "Eiwit in een normale schep, of zo'n 0,25 gram per kilo lichaamsgewicht. Bij 80 kilo is dat 20 gram."
    de:
      title: "20 bis 40 g"
      body: "Protein in einer normalen Portion, oder etwa 0,25 g pro kg Körpergewicht. Bei 80 kg sind das 20 g."
    es:
      title: "20 a 40 g"
      body: "De proteína en un cacito normal, o unos 0,25 g por kg de peso. Con 80 kg son 20 g."
    fr:
      title: "20 à 40 g"
      body: "De protéines dans une dose normale, soit environ 0,25 g par kg. À 80 kg, ça fait 20 g."
    pt:
      title: "20 a 40 g"
      body: "De proteína numa dose normal, ou cerca de 0,25 g por kg de peso. Com 80 kg são 20 g."
    tr:
      title: "20-40 g"
      body: "Normal bir ölçekteki protein, ya da kilo başına yaklaşık 0,25 g. 80 kiloda 20 g."

  - key: leucine
    kind: fact
    en:
      title: "2.75 g"
      body: "Of leucine in 25 g of whey. Whey is about 11% leucine, more than any other common protein."
    nl:
      title: "2,75 gram"
      body: "Leucine in 25 gram whey. Whey is zo'n 11% leucine, meer dan elk ander gangbaar eiwit."
    de:
      title: "2,75 g"
      body: "Leucin in 25 g Whey. Whey besteht zu etwa 11 % aus Leucin, mehr als jedes andere gängige Protein."
    es:
      title: "2,75 g"
      body: "De leucina en 25 g de whey. El whey tiene un 11 % de leucina, más que cualquier otra proteína común."
    fr:
      title: "2,75 g"
      body: "De leucine dans 25 g de whey. La whey contient environ 11 % de leucine, plus que toute autre protéine courante."
    pt:
      title: "2,75 g"
      body: "De leucina em 25 g de whey. A whey tem cerca de 11% de leucina, mais do que qualquer outra proteína comum."
    tr:
      title: "2,75 g"
      body: "25 g whey'deki lösin. Whey yaklaşık %11 lösindir, yaygın proteinlerin hepsinden fazla."

  - key: concentraat-of-isolaat
    kind: fact
    en:
      title: "70 to 80%"
      body: "Protein in concentrate, over 90% in isolate. Isolate gives more per scoop, concentrate costs less."
    nl:
      title: "70 tot 80%"
      body: "Eiwit in concentraat, meer dan 90% in isolaat. Isolaat geeft meer per schep, concentraat is goedkoper."
    de:
      title: "70 bis 80 %"
      body: "Protein im Konzentrat, über 90 % im Isolat. Isolat liefert mehr pro Portion, Konzentrat ist günstiger."
    es:
      title: "70 a 80 %"
      body: "De proteína en el concentrado, más del 90 % en el aislado. El aislado da más, el concentrado cuesta menos."
    fr:
      title: "70 à 80 %"
      body: "De protéines dans le concentré, plus de 90 % dans l'isolat. L'isolat en donne plus, le concentré coûte moins."
    pt:
      title: "70 a 80%"
      body: "De proteína no concentrado, mais de 90% no isolado. O isolado dá mais por dose, o concentrado custa menos."
    tr:
      title: "%70-80"
      body: "Konsantrede protein oranı, izolatta %90'ın üstü. İzolat ölçek başına daha fazla verir, konsantre daha ucuz."

  - key: na-de-training
    kind: myth
    en:
      title: "Right after"
      body: "Myth: the shake must come right after training. Your total protein for the day matters more."
    nl:
      title: "Direct erna"
      body: "Mythe: de shake moet direct na de training. Je totale eiwit over de dag telt meer."
    de:
      title: "Direkt danach"
      body: "Mythos: Der Shake muss direkt nach dem Training rein. Dein Tagesprotein zählt mehr."
    es:
      title: "Justo después"
      body: "Mito: el batido va justo después de entrenar. Importa más tu proteína total del día."
    fr:
      title: "Juste après"
      body: "Mythe : le shake juste après la séance. Ton total de protéines de la journée compte plus."
    pt:
      title: "Logo a seguir"
      body: "Mito: o batido tem de vir logo após o treino. Conta mais a proteína total do dia."
    tr:
      title: "Hemen sonra"
      body: "Efsane: shake antrenmandan hemen sonra içilmeli. Günlük toplam protein daha önemli."

  - key: nieren
    kind: myth
    en:
      title: "Kidneys"
      body: "Myth: whey is bad for your kidneys. Not in healthy people. With kidney disease, talk to your doctor first."
    nl:
      title: "Nieren"
      body: "Mythe: whey is slecht voor je nieren. Niet bij gezonde mensen. Heb je een nierziekte, overleg dan eerst met je arts."
    de:
      title: "Nieren"
      body: "Mythos: Whey schadet den Nieren. Nicht bei Gesunden. Bei einer Nierenerkrankung erst mit dem Arzt sprechen."
    es:
      title: "Riñones"
      body: "Mito: el whey daña los riñones. No en personas sanas. Con enfermedad renal, habla antes con tu médico."
    fr:
      title: "Reins"
      body: "Mythe : la whey abîme les reins. Pas chez les gens sains. En cas de maladie rénale, parles-en d'abord au médecin."
    pt:
      title: "Rins"
      body: "Mito: a whey faz mal aos rins. Não em pessoas saudáveis. Com doença renal, fala primeiro com o médico."
    tr:
      title: "Böbrekler"
      body: "Efsane: whey böbreklere zarar verir. Sağlıklı kişilerde vermez. Böbrek hastalığın varsa önce doktoruna danış."

  - key: verdeel-over-de-dag
    kind: fact
    en:
      title: "Every 3 to 4 hours"
      body: "Spread protein evenly over the day, the ISSN advises. A shake can fill one of those moments."
    nl:
      title: "Om de 3 à 4 uur"
      body: "Spreid eiwit gelijk over de dag, adviseert de ISSN. Een shake kan een van die momenten vullen."
    de:
      title: "Alle 3 bis 4 Std."
      body: "Verteil Protein gleichmäßig über den Tag, rät die ISSN. Ein Shake kann einen dieser Momente füllen."
    es:
      title: "Cada 3 o 4 horas"
      body: "Reparte la proteína a lo largo del día, aconseja la ISSN. Un batido puede cubrir uno de esos momentos."
    fr:
      title: "Toutes les 3 à 4 h"
      body: "Répartis tes protéines sur la journée, conseille l'ISSN. Un shake peut remplir un de ces moments."
    pt:
      title: "A cada 3 a 4 horas"
      body: "Distribui a proteína ao longo do dia, aconselha a ISSN. Um batido pode preencher um desses momentos."
    tr:
      title: "3-4 saatte bir"
      body: "ISSN proteini güne eşit yaymayı öneriyor. Bir shake bu anlardan birini doldurabilir."

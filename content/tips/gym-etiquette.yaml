article: gym-etiquette
emoji: "🤝"
tips:
  - key: terugleggen
    kind: fact
    en:
      title: "Re-rack"
      body: "Put plates and dumbbells back when you're done. Leaving them out is one of the most common gym mistakes."
    nl:
      title: "Terugleggen"
      body: "Leg schijven en dumbbells terug als je klaar bent. Laten liggen is een van de bekendste fouten in de gym."
    de:
      title: "Zurücklegen"
      body: "Räum Scheiben und Hanteln weg, wenn du fertig bist. Liegenlassen ist einer der häufigsten Fehler im Gym."
    es:
      title: "Recoge"
      body: "Devuelve discos y mancuernas al terminar. Dejarlos tirados es uno de los fallos más comunes del gym."
    fr:
      title: "Range"
      body: "Remets disques et haltères en place après. Les laisser traîner est l'une des fautes les plus courantes."
    pt:
      title: "Arruma"
      body: "Põe os discos e halteres no sítio quando acabas. Deixá-los espalhados é um dos erros mais comuns."
    tr:
      title: "Yerine koy"
      body: "İşin bitince plakaları ve dambılları yerine koy. Bırakıp gitmek salonda en sık yapılan hatalardan."

  - key: afnemen
    kind: fact
    en:
      title: "Wipe it down"
      body: "Wipe the bench after your set and train on a towel. Nobody wants to lie in someone else's sweat."
    nl:
      title: "Afnemen"
      body: "Neem de bank af na je set en train op een handdoek. Niemand wil in andermans zweet liggen."
    de:
      title: "Abwischen"
      body: "Wisch die Bank nach dem Satz ab und trainier auf einem Handtuch. Niemand liegt gern im Schweiß anderer."
    es:
      title: "Limpia"
      body: "Limpia el banco tras tu serie y entrena con toalla. Nadie quiere tumbarse en el sudor de otro."
    fr:
      title: "Essuie"
      body: "Essuie le banc après ta série et utilise une serviette. Personne n'aime s'allonger dans la sueur d'un autre."
    pt:
      title: "Limpa"
      body: "Limpa o banco depois da série e treina com toalha. Ninguém quer deitar-se no suor dos outros."
    tr:
      title: "Sil"
      body: "Setten sonra sehpayı sil ve havluyla çalış. Kimse başkasının terine uzanmak istemez."

  - key: delen
    kind: fact
    en:
      title: "Busy gym"
      body: "Don't hog a station. Ask to work in, share on busy days, and move on once you're done."
    nl:
      title: "Druk"
      body: "Bezet een toestel niet te lang. Vraag of je mag meedraaien, deel op drukke dagen en ga door als je klaar bent."
    de:
      title: "Volles Gym"
      body: "Blockier kein Gerät. Frag, ob du mitmachen darfst, teil an vollen Tagen und geh weiter, wenn du fertig bist."
    es:
      title: "Gym lleno"
      body: "No acapares una máquina. Pregunta para turnaros, comparte en días llenos y sigue al acabar."
    fr:
      title: "Salle pleine"
      body: "Ne monopolise pas un poste. Demande pour alterner, partage les jours chargés et libère vite la place."
    pt:
      title: "Ginásio cheio"
      body: "Não açambarques uma máquina. Pede para alternar, partilha em dias cheios e sai quando acabas."
    tr:
      title: "Kalabalık salon"
      body: "Bir aleti tekeline alma. Sırayla kullanmayı sor, kalabalıkta paylaş, bitince yer aç."

  - key: niet-filmen
    kind: fact
    en:
      title: "Filming"
      body: "Don't film other people without their consent. It's one of the more common gym mistakes."
    nl:
      title: "Filmen"
      body: "Film geen andere mensen zonder dat ze dat goedvinden. Dat gaat in de gym vaak mis."
    de:
      title: "Filmen"
      body: "Film keine anderen ohne ihr Einverständnis. Das passiert im Gym leider oft."
    es:
      title: "Grabar"
      body: "No grabes a otros sin su permiso. Es uno de los fallos frecuentes en el gimnasio."
    fr:
      title: "Filmer"
      body: "Ne filme pas les autres sans leur accord. C'est une faute fréquente en salle."
    pt:
      title: "Filmar"
      body: "Não filmes outras pessoas sem consentimento. É um erro frequente no ginásio."
    tr:
      title: "Video çekmek"
      body: "Başkalarını izinsiz çekme. Salonda sık yapılan bir hata."

  - key: spotten
    kind: fact
    en:
      title: "Offering a spot"
      body: "Only if someone asks and you know how. Otherwise, give them room."
    nl:
      title: "Spotten"
      body: "Alleen als iemand erom vraagt en je weet hoe het moet. Geef anders ruimte."
    de:
      title: "Sichern"
      body: "Nur wenn jemand fragt und du weißt, wie es geht. Sonst lass Platz."
    es:
      title: "Ayudar en una serie"
      body: "Solo si te lo piden y sabes hacerlo. Si no, deja espacio."
    fr:
      title: "Parer"
      body: "Seulement si on te le demande et que tu sais faire. Sinon, laisse de l'espace."
    pt:
      title: "Ajudar numa série"
      body: "Só se te pedirem e souberes como. Senão, dá espaço."
    tr:
      title: "Yardım etmek"
      body: "Sadece biri isterse ve nasıl yapılacağını biliyorsan. Yoksa alan bırak."

  - key: ruimte-geven
    kind: fact
    en:
      title: "Give room"
      body: "Don't crowd someone mid-set or block mirrors and walkways. Clear space prevents accidents."
    nl:
      title: "Ruimte geven"
      body: "Ga niet op iemand staan tijdens een set en blokkeer geen spiegels of looppaden. Vrije ruimte voorkomt ongelukken."
    de:
      title: "Platz lassen"
      body: "Rück niemandem im Satz auf die Pelle und blockier keine Spiegel oder Wege. Freier Raum verhindert Unfälle."
    es:
      title: "Deja espacio"
      body: "No te pegues a nadie en plena serie ni tapes espejos o pasillos. El espacio libre evita accidentes."
    fr:
      title: "Laisse de la place"
      body: "Ne colle pas quelqu'un en pleine série, ne bloque ni miroirs ni passages. L'espace évite les accidents."
    pt:
      title: "Dá espaço"
      body: "Não te encostes a ninguém a meio da série nem tapes espelhos ou passagens. Espaço livre evita acidentes."
    tr:
      title: "Alan bırak"
      body: "Set yapanın dibine girme, ayna ve yolları kapatma. Boş alan kazaları önler."

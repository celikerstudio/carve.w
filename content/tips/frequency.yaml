article: frequency
emoji: "🔁"
tips:
  - key: minimaal-twee-keer
    kind: fact
    en:
      title: "2 times a week"
      body: "Train every major muscle group hard at least that often, the ACSM advises. Beginners and experienced alike."
    nl:
      title: "2 keer per week"
      body: "Train elke grote spiergroep minstens zo vaak met flinke inzet, adviseert de ACSM. Voor beginner en gevorderde."
    de:
      title: "2-mal pro Woche"
      body: "Trainier jede große Muskelgruppe mindestens so oft hart, rät das ACSM. Für Anfänger wie Erfahrene."
    es:
      title: "2 veces por semana"
      body: "Entrena fuerte cada grupo muscular grande al menos así, aconseja el ACSM. Para novatos y expertos."
    fr:
      title: "2 fois par semaine"
      body: "Travaille dur chaque grand groupe musculaire au moins aussi souvent, dit l'ACSM. Débutant ou confirmé."
    pt:
      title: "2 vezes por semana"
      body: "Treina forte cada grupo muscular grande pelo menos assim, aconselha o ACSM. Para iniciantes e experientes."
    tr:
      title: "Haftada 2"
      body: "ACSM her büyük kas grubunu en az bu sıklıkta sıkı çalıştırmayı öneriyor. Yeni ve deneyimli için."

  - key: zes-dagen
    kind: myth
    en:
      title: "6 days"
      body: "Myth: you need to train six days a week. With equal weekly sets, 1 day or 5+ days made no difference to growth."
    nl:
      title: "6 dagen"
      body: "Mythe: je moet zes dagen per week trainen. Met evenveel sets per week maakte 1 of 5+ dagen niets uit voor groei."
    de:
      title: "6 Tage"
      body: "Mythos: Du musst sechs Tage trainieren. Bei gleichen Wochensätzen war 1 oder 5+ Tage fürs Wachstum egal."
    es:
      title: "6 días"
      body: "Mito: tienes que entrenar seis días. Con las mismas series semanales, 1 día o más de 5 no cambió el crecimiento."
    fr:
      title: "6 jours"
      body: "Mythe : il faut s'entraîner six jours. À séries égales par semaine, 1 jour ou 5+ n'a rien changé au muscle."
    pt:
      title: "6 dias"
      body: "Mito: tens de treinar seis dias. Com as mesmas séries semanais, 1 dia ou mais de 5 não mudou o crescimento."
    tr:
      title: "6 gün"
      body: "Efsane: haftada altı gün çalışmalısın. Haftalık set aynıyken 1 ya da 5'ten fazla gün büyümede fark etmedi."

  - key: twee-betekenissen
    kind: fact
    en:
      title: "3 sessions"
      body: "Of full body train your legs three times a week. Three days of push, pull and legs train them once."
    nl:
      title: "3 trainingen"
      body: "Full body trainen je benen drie keer per week. Drie dagen push, pull en legs trainen ze één keer."
    de:
      title: "3 Einheiten"
      body: "Ganzkörper trainieren die Beine dreimal pro Woche. Drei Tage Push, Pull, Beine trainieren sie einmal."
    es:
      title: "3 sesiones"
      body: "De cuerpo completo trabajan las piernas tres veces. Tres días de empuje, tirón y pierna, solo una."
    fr:
      title: "3 séances"
      body: "Full body font travailler tes jambes trois fois par semaine. Trois jours push, pull, legs : une seule."
    pt:
      title: "3 treinos"
      body: "De corpo inteiro treinam as pernas três vezes. Três dias de push, pull e pernas, só uma."
    tr:
      title: "3 antrenman"
      body: "Tüm vücut bacağını haftada üç kez çalıştırır. Üç günlük push, pull, legs ise bir kez."

  - key: geen-niveaus-meer
    kind: fact
    en:
      title: "2 to 3 days"
      body: "For beginners, 4 to 5 for advanced: the ACSM split from 2009. The 2026 position stand drops it."
    nl:
      title: "2 tot 3 dagen"
      body: "Voor beginners, 4 tot 5 voor gevorderden: de ACSM-indeling van 2009. Het standpunt van 2026 laat die los."
    de:
      title: "2 bis 3 Tage"
      body: "Für Anfänger, 4 bis 5 für Fortgeschrittene: die ACSM-Regel von 2009. Die Stellungnahme 2026 kippt sie."
    es:
      title: "2 a 3 días"
      body: "Para novatos, 4 a 5 para avanzados: la regla del ACSM de 2009. La postura de 2026 la abandona."
    fr:
      title: "2 à 3 jours"
      body: "Pour débutants, 4 à 5 pour avancés : la règle ACSM de 2009. La prise de position 2026 l'abandonne."
    pt:
      title: "2 a 3 dias"
      body: "Para iniciantes, 4 a 5 para avançados: a regra do ACSM de 2009. A posição de 2026 deixa-a cair."
    tr:
      title: "2-3 gün"
      body: "Yeniler için, ileri seviye için 4-5: ACSM'nin 2009 ayrımı. 2026 tutum bildirgesi bunu bıraktı."

  - key: twee-keer-per-spier
    kind: myth
    en:
      title: "Twice per muscle"
      body: "Myth: hit each muscle twice a week. It works, but at equal volume it doesn't beat once. Pick what fits."
    nl:
      title: "Twee keer per spier"
      body: "Mythe: train elke spier twee keer per week. Dat werkt, maar bij gelijk volume niet beter dan één keer."
    de:
      title: "Zweimal pro Muskel"
      body: "Mythos: Jeder Muskel zweimal pro Woche. Klappt, aber bei gleichem Volumen nicht besser als einmal."
    es:
      title: "Dos veces por músculo"
      body: "Mito: cada músculo dos veces por semana. Funciona, pero con igual volumen no supera a una vez."
    fr:
      title: "Deux fois par muscle"
      body: "Mythe : chaque muscle deux fois par semaine. Ça marche, mais à volume égal pas mieux qu'une fois."
    pt:
      title: "Duas vezes por músculo"
      body: "Mito: cada músculo duas vezes por semana. Funciona, mas com o mesmo volume não bate uma vez."
    tr:
      title: "Kas başına iki kez"
      body: "Efsane: her kası haftada iki kez çalıştır. İşe yarar ama hacim aynıysa bir kezden iyi değil."

  - key: kracht-en-volume
    kind: fact
    en:
      title: "More days"
      body: "Strength rose with frequency in a 2018 meta-analysis, but not significantly at equal volume. Mostly untrained people."
    nl:
      title: "Meer dagen"
      body: "Kracht steeg met frequentie in een meta-analyse uit 2018, maar niet significant bij gelijk volume. Vooral beginners."
    de:
      title: "Mehr Tage"
      body: "Kraft stieg 2018 laut Metaanalyse mit der Frequenz, bei gleichem Volumen aber nicht signifikant. Meist Untrainierte."
    es:
      title: "Más días"
      body: "La fuerza subió con la frecuencia en un metaanálisis de 2018, pero no con igual volumen. Casi todos novatos."
    fr:
      title: "Plus de jours"
      body: "La force montait avec la fréquence en 2018, mais pas à volume égal. Surtout des non-entraînés."
    pt:
      title: "Mais dias"
      body: "A força subiu com a frequência numa meta-análise de 2018, mas não com volume igual. Sobretudo destreinados."
    tr:
      title: "Daha çok gün"
      body: "2018 meta-analizinde güç sıklıkla arttı ama hacim eşitken anlamlı değildi. Çoğu antrenmansızdı."

  - key: kracht-op-een-lift
    kind: fact
    en:
      title: "Newer analysis"
      body: "Found strength still rose with frequency at equal volume, less per extra day. That goes against earlier findings."
    nl:
      title: "Nieuwere analyse"
      body: "Vond dat kracht bij gelijk volume toch steeg met frequentie, minder per extra dag. Dat botst met eerdere studies."
    de:
      title: "Neuere Analyse"
      body: "Kraft stieg bei gleichem Volumen doch mit der Frequenz, weniger pro Extratag. Das widerspricht früheren Daten."
    es:
      title: "Análisis más nuevo"
      body: "Vio que la fuerza sí subía con la frecuencia a igual volumen, menos por día extra. Choca con lo anterior."
    fr:
      title: "Analyse récente"
      body: "La force montait encore avec la fréquence à volume égal, moins par jour en plus. Ça contredit l'ancien."
    pt:
      title: "Análise mais recente"
      body: "Viu a força subir com a frequência a volume igual, menos por dia extra. Contraria o que havia antes."
    tr:
      title: "Yeni analiz"
      body: "Hacim eşitken de güç sıklıkla arttı, her ek günde daha az. Bu önceki bulgularla çelişiyor."

  - key: split-wisselen
    kind: myth
    en:
      title: "New split"
      body: "Myth: a new split fixes a plateau. At equal volume, frequency barely mattered. Check sets, effort and recovery."
    nl:
      title: "Nieuw schema"
      body: "Mythe: een nieuw schema doorbreekt een plateau. Bij gelijk volume maakte frequentie weinig uit. Check sets en herstel."
    de:
      title: "Neuer Split"
      body: "Mythos: Ein neuer Split löst das Plateau. Bei gleichem Volumen zählte Frequenz kaum. Prüf Sätze und Erholung."
    es:
      title: "Nueva rutina"
      body: "Mito: cambiar de rutina rompe el estancamiento. A igual volumen la frecuencia apenas contó. Revisa series y descanso."
    fr:
      title: "Nouveau split"
      body: "Mythe : changer de split casse un plateau. À volume égal, la fréquence comptait peu. Vérifie séries et récup."
    pt:
      title: "Novo split"
      body: "Mito: um novo split resolve o planalto. Com volume igual a frequência pouco contou. Vê séries, esforço e descanso."
    tr:
      title: "Yeni program"
      body: "Efsane: yeni program platoyu kırar. Hacim aynıyken sıklık pek fark etmedi. Önce set, efor ve toparlanmaya bak."

  - key: dagen-die-je-volhoudt
    kind: fact
    en:
      title: "Fewer days"
      body: "That you actually train beat a plan you can't keep. Start from what you can do for months."
    nl:
      title: "Minder dagen"
      body: "Die je echt traint winnen van een plan dat je niet volhoudt. Begin bij wat je maanden kunt doen."
    de:
      title: "Weniger Tage"
      body: "Die du wirklich trainierst, schlagen einen Plan, den du nicht hältst. Starte mit dem, was monatelang geht."
    es:
      title: "Menos días"
      body: "Que entrenas de verdad ganan a un plan que no cumples. Parte de lo que puedes hacer durante meses."
    fr:
      title: "Moins de jours"
      body: "Que tu fais vraiment valent mieux qu'un plan intenable. Pars de ce que tu peux tenir des mois."
    pt:
      title: "Menos dias"
      body: "Que treinas mesmo valem mais do que um plano que não cumpres. Parte do que aguentas durante meses."
    tr:
      title: "Daha az gün"
      body: "Gerçekten çalıştığın günler, sürdüremediğin plandan iyidir. Aylarca yapabileceğinden başla."

  - key: te-lange-training
    kind: fact
    en:
      title: "Long sessions"
      body: "Last exercises suffering because the session runs so long? Spread your sets over more days."
    nl:
      title: "Lange trainingen"
      body: "Lijden je laatste oefeningen omdat de training zo lang duurt? Verdeel je sets over meer dagen."
    de:
      title: "Lange Einheiten"
      body: "Leiden die letzten Übungen, weil die Einheit so lang ist? Verteil die Sätze auf mehr Tage."
    es:
      title: "Sesiones largas"
      body: "¿Tus últimos ejercicios flojean porque la sesión es muy larga? Reparte las series en más días."
    fr:
      title: "Séances longues"
      body: "Tes derniers exercices souffrent car la séance s'éternise ? Répartis tes séries sur plus de jours."
    pt:
      title: "Treinos longos"
      body: "Os últimos exercícios sofrem porque o treino é longo demais? Espalha as séries por mais dias."
    tr:
      title: "Uzun antrenman"
      body: "Antrenman çok uzun diye son hareketlerin mi bozuluyor? Setlerini daha çok güne yay."

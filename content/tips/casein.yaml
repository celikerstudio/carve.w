article: casein
emoji: "🥛"
tips:
  - key: trage-eiwit
    kind: fact
    en:
      title: "Slow protein"
      body: "Casein, the main protein in milk, clumps in your stomach and digests more slowly than whey."
    nl:
      title: "Traag eiwit"
      body: "Caseïne, het hoofdeiwit in melk, klontert in je maag en wordt trager verteerd dan whey."
    de:
      title: "Langsames Protein"
      body: "Kasein, das Hauptprotein der Milch, verklumpt im Magen und wird langsamer verdaut als Whey."
    es:
      title: "Proteína lenta"
      body: "La caseína, la proteína principal de la leche, se cuaja en el estómago y se digiere más lento que el whey."
    fr:
      title: "Protéine lente"
      body: "La caséine, principale protéine du lait, coagule dans l'estomac et se digère plus lentement que la whey."
    pt:
      title: "Proteína lenta"
      body: "A caseína, a principal proteína do leite, coalha no estômago e digere-se mais devagar do que a whey."
    tr:
      title: "Yavaş protein"
      body: "Sütün ana proteini kazein midede pıhtılaşır ve whey'den daha yavaş sindirilir."

  - key: whey-sneller
    kind: fact
    en:
      title: "Twice as much"
      body: "Muscle building came from whey as from casein in the hours after a drink, in young men."
    nl:
      title: "Twee keer zoveel"
      body: "Spieropbouw gaf whey vergeleken met caseïne in de uren na een shake, bij jonge mannen."
    de:
      title: "Doppelt so viel"
      body: "Muskelaufbau löste Whey in den Stunden nach einem Shake aus wie Kasein, bei jungen Männern."
    es:
      title: "El doble"
      body: "De síntesis muscular dio el whey que la caseína en las horas tras el batido, en hombres jóvenes."
    fr:
      title: "Deux fois plus"
      body: "De construction musculaire avec la whey qu'avec la caséine dans les heures suivantes, chez des jeunes hommes."
    pt:
      title: "O dobro"
      body: "De síntese muscular deu a whey face à caseína nas horas após o batido, em homens jovens."
    tr:
      title: "İki kat"
      body: "Genç erkeklerde içtikten sonraki saatlerde whey, kazeinin iki katı kas yapımı sağladı."

  - key: houdt-lang-aan
    kind: fact
    en:
      title: "5 hours"
      body: "Amino acids from casein were still raised after that long, when whey was back to baseline. Handy before a long gap."
    nl:
      title: "5 uur"
      body: "Daarna waren aminozuren uit caseïne nog verhoogd, terwijl whey al terug was op nul. Handig voor een lang gat."
    de:
      title: "5 Stunden"
      body: "Danach waren Aminosäuren aus Kasein noch erhöht, Whey schon wieder auf Normalwert. Gut vor einer langen Pause."
    es:
      title: "5 horas"
      body: "Después, los aminoácidos de la caseína seguían altos y los del whey ya no. Útil antes de muchas horas sin comer."
    fr:
      title: "5 heures"
      body: "Après ça, les acides aminés de la caséine restaient élevés, ceux de la whey non. Utile avant un long jeûne."
    pt:
      title: "5 horas"
      body: "Depois disso, os aminoácidos da caseína ainda estavam altos e os da whey não. Útil antes de muito tempo sem comer."
    tr:
      title: "5 saat"
      body: "Bu sürenin sonunda kazeinden gelen amino asitler hâlâ yüksekti, whey'inkiler normale dönmüştü."

  - key: voor-het-slapen
    kind: fact
    en:
      title: "30 to 40 g"
      body: "Casein before bed raises muscle building that night. A short-term measure, not proof of more muscle."
    nl:
      title: "30 tot 40 gram"
      body: "Caseïne voor het slapen verhoogt die nacht de spieropbouw. Een kortetermijnmeting, geen bewijs voor meer spier."
    de:
      title: "30 bis 40 g"
      body: "Kasein vor dem Schlafen steigert nachts den Muskelaufbau. Eine Kurzzeitmessung, kein Beweis für mehr Muskeln."
    es:
      title: "30 a 40 g"
      body: "De caseína antes de dormir suben la síntesis muscular esa noche. Una medida a corto plazo, no prueba de más músculo."
    fr:
      title: "30 à 40 g"
      body: "De caséine au coucher relancent le muscle cette nuit-là. Une mesure à court terme, pas une preuve de muscle en plus."
    pt:
      title: "30 a 40 g"
      body: "De caseína antes de dormir aumentam a síntese muscular nessa noite. Medida de curto prazo, não prova de mais músculo."
    tr:
      title: "30-40 g"
      body: "Yatmadan kazein o gece kas yapımını artırır. Kısa vadeli bir ölçüm, daha fazla kas kanıtı değil."

  - key: timing-telt
    kind: myth
    en:
      title: "At night"
      body: "Myth: casein at night builds more muscle. In a small trial with equal daily protein, day or night made no difference."
    nl:
      title: "'s Avonds"
      body: "Mythe: caseïne voor het slapen bouwt meer spier. In een kleine studie met gelijk dageiwit maakte het moment niets uit."
    de:
      title: "Am Abend"
      body: "Mythos: Kasein am Abend baut mehr Muskeln. In einer kleinen Studie mit gleichem Tagesprotein war die Zeit egal."
    es:
      title: "De noche"
      body: "Mito: la caseína de noche da más músculo. En un estudio pequeño con igual proteína diaria, la hora no importó."
    fr:
      title: "Le soir"
      body: "Mythe : la caséine du soir fait plus de muscle. Dans une petite étude à protéines égales, l'heure n'a rien changé."
    pt:
      title: "À noite"
      body: "Mito: a caseína à noite dá mais músculo. Num estudo pequeno com a mesma proteína diária, a hora não importou."
    tr:
      title: "Gece"
      body: "Efsane: gece kazein daha çok kas yaptırır. Günlük protein aynıyken küçük bir çalışmada saatin farkı olmadı."

  - key: meer-eiwit-in-totaal
    kind: fact
    en:
      title: "1.9 vs 1.3 g"
      body: "Protein per kg in the famous night-casein trial. The group that grew more also ate more, which may explain it."
    nl:
      title: "1,9 tegen 1,3 gram"
      body: "Eiwit per kilo in de bekende nachtcaseïne-studie. De groep die meer groeide at ook meer, en dat kan het verklaren."
    de:
      title: "1,9 zu 1,3 g"
      body: "Protein pro kg in der bekannten Nacht-Kasein-Studie. Die Gruppe mit mehr Muskeln aß auch mehr Protein."
    es:
      title: "1,9 frente a 1,3 g"
      body: "De proteína por kg en el famoso estudio de caseína nocturna. El grupo que más creció también comió más."
    fr:
      title: "1,9 contre 1,3 g"
      body: "De protéines par kg dans la célèbre étude caséine du soir. Le groupe qui a plus grossi mangeait aussi plus."
    pt:
      title: "1,9 contra 1,3 g"
      body: "De proteína por kg no famoso estudo da caseína à noite. O grupo que mais cresceu também comeu mais."
    tr:
      title: "1,9'a karşı 1,3 g"
      body: "Ünlü gece kazeini çalışmasında kilo başına protein. Daha çok kas yapan grup daha çok da yedi."

  - key: dik-worden
    kind: myth
    en:
      title: "Fat gain"
      body: "Myth: casein before bed makes you fat. It didn't reduce how much fat your body broke down overnight."
    nl:
      title: "Dik worden"
      body: "Mythe: caseïne voor het slapen maakt dik. Je lichaam brak er 's nachts niet minder vet door af."
    de:
      title: "Dick werden"
      body: "Mythos: Kasein vor dem Schlafen macht dick. Der Fettabbau über Nacht wurde dadurch nicht kleiner."
    es:
      title: "Engordar"
      body: "Mito: la caseína antes de dormir engorda. No redujo la grasa que tu cuerpo quema por la noche."
    fr:
      title: "Grossir"
      body: "Mythe : la caséine au coucher fait grossir. Elle n'a pas réduit le gras brûlé pendant la nuit."
    pt:
      title: "Engordar"
      body: "Mito: a caseína antes de dormir engorda. Não reduziu a gordura que o corpo queima durante a noite."
    tr:
      title: "Kilo almak"
      body: "Efsane: yatmadan kazein kilo aldırır. Gece boyunca yakılan yağı azaltmadı."

  - key: geen-vetverbrander
    kind: myth
    en:
      title: "11 studies"
      body: "Myth: casein at night burns fat. A review found little to no effect on energy use, fat breakdown or appetite."
    nl:
      title: "11 studies"
      body: "Mythe: caseïne 's avonds verbrandt vet. Een review vond weinig tot geen effect op verbranding, vetafbraak of eetlust."
    de:
      title: "11 Studien"
      body: "Mythos: Kasein am Abend verbrennt Fett. Eine Übersicht fand kaum Effekte auf Verbrauch, Fettabbau oder Appetit."
    es:
      title: "11 estudios"
      body: "Mito: la caseína de noche quema grasa. Una revisión vio poco o ningún efecto en gasto, grasa o apetito."
    fr:
      title: "11 études"
      body: "Mythe : la caséine du soir brûle le gras. Une revue a vu peu ou pas d'effet sur dépense, gras ou appétit."
    pt:
      title: "11 estudos"
      body: "Mito: a caseína à noite queima gordura. Uma revisão viu pouco ou nenhum efeito no gasto, gordura ou apetite."
    tr:
      title: "11 çalışma"
      body: "Efsane: gece kazein yağ yakar. Bir derleme enerji kullanımı, yağ yıkımı ya da iştahta pek etki bulmadı."

  - key: telt-mee
    kind: fact
    en:
      title: "120 to 160 kcal"
      body: "That's 30 to 40 g of casein. It counts toward your day like any other food."
    nl:
      title: "120 tot 160 kcal"
      body: "Zoveel zit er in 30 tot 40 gram caseïne. Het telt mee in je dag zoals elk ander eten."
    de:
      title: "120 bis 160 kcal"
      body: "Stecken in 30 bis 40 g Kasein. Das zählt zu deinem Tag wie jedes andere Essen."
    es:
      title: "120 a 160 kcal"
      body: "Hay en 30 a 40 g de caseína. Cuenta en tu día como cualquier otra comida."
    fr:
      title: "120 à 160 kcal"
      body: "Dans 30 à 40 g de caséine. Ça compte dans ta journée comme n'importe quel aliment."
    pt:
      title: "120 a 160 kcal"
      body: "Há em 30 a 40 g de caseína. Conta no teu dia como qualquer outra comida."
    tr:
      title: "120-160 kcal"
      body: "30-40 g kazeinde bu kadar var. Diğer yiyecekler gibi günlük toplamına sayılır."

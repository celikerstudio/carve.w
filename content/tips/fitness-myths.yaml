article: fitness-myths
emoji: "🧐"
tips:
  - key: plaatselijk-vet
    kind: myth
    en:
      title: "1,158 people"
      body: "Myth: train a spot to burn its fat. In that many people, a trained limb lost no more fat than the untrained one."
    nl:
      title: "1.158 mensen"
      body: "Mythe: train een plek en je verbrandt daar vet. Bij zoveel mensen verloor een getraind been of arm niet meer vet."
    de:
      title: "1.158 Menschen"
      body: "Mythos: Wer eine Stelle trainiert, verbrennt dort Fett. Bei so vielen verlor der trainierte Arm nicht mehr Fett."
    es:
      title: "1.158 personas"
      body: "Mito: entrenar una zona quema su grasa. En tantas personas, la extremidad entrenada no perdió más grasa."
    fr:
      title: "1 158 personnes"
      body: "Mythe : muscler une zone y brûle le gras. Sur autant de gens, le membre entraîné n'a pas perdu plus de gras."
    pt:
      title: "1.158 pessoas"
      body: "Mito: treinar uma zona queima a gordura dela. Em tantas pessoas, o membro treinado não perdeu mais gordura."
    tr:
      title: "1.158 kişi"
      body: "Efsane: bir bölgeyi çalıştırmak oradaki yağı yakar. Bu kadar kişide çalışan uzuv daha fazla yağ kaybetmedi."

  - key: buikspieroefeningen
    kind: myth
    en:
      title: "6 weeks"
      body: "Myth: ab exercises flatten your belly. Six weeks of ab work didn't shrink belly fat or waist. Ab endurance improved."
    nl:
      title: "6 weken"
      body: "Mythe: buikspieroefeningen maken je buik plat. Zes weken buikwerk gaf geen minder buikvet. Wel meer uithouding."
    de:
      title: "6 Wochen"
      body: "Mythos: Bauchübungen machen den Bauch flach. Sechs Wochen Bauchtraining änderten Bauchfett und Taille nicht."
    es:
      title: "6 semanas"
      body: "Mito: los abdominales te aplanan la tripa. Seis semanas no redujeron la grasa ni la cintura. Sí la resistencia."
    fr:
      title: "6 semaines"
      body: "Mythe : les abdos aplatissent le ventre. Six semaines d'abdos n'ont réduit ni le gras ni le tour de taille."
    pt:
      title: "6 semanas"
      body: "Mito: os abdominais tiram a barriga. Seis semanas não reduziram a gordura nem a cintura. A resistência sim."
    tr:
      title: "6 hafta"
      body: "Efsane: mekik göbeği eritir. Altı haftalık karın çalışması göbek yağını ve beli küçültmedi. Dayanıklılık arttı."

  - key: buikvet-kwijt
    kind: fact
    en:
      title: "Belly fat"
      body: "Lose fat overall with a calorie deficit. Train your abs for strength, not to burn the fat on top."
    nl:
      title: "Buikvet"
      body: "Verlies vet over je hele lijf met een tekort. Train je buik voor kracht, niet om het vet erop te verbranden."
    de:
      title: "Bauchfett"
      body: "Verlier insgesamt Fett mit einem Defizit. Trainier den Bauch für Kraft, nicht um das Fett darüber zu verbrennen."
    es:
      title: "Grasa abdominal"
      body: "Pierde grasa en general con déficit. Entrena el abdomen para fuerza, no para quemar la grasa de encima."
    fr:
      title: "Gras du ventre"
      body: "Perds du gras partout avec un déficit. Muscle tes abdos pour la force, pas pour brûler le gras dessus."
    pt:
      title: "Gordura da barriga"
      body: "Perde gordura em geral com défice. Treina os abdominais para a força, não para queimar a gordura de cima."
    tr:
      title: "Göbek yağı"
      body: "Kalori açığıyla genel olarak yağ kaybet. Karnını güç için çalıştır, üstündeki yağı yakmak için değil."

  - key: low-carb-en-honger
    kind: fact
    en:
      title: "Low-carb"
      body: "Keto can curb your appetite, the ISSN notes. So it can help, but it works through eating less."
    nl:
      title: "Koolhydraatarm"
      body: "Keto kan je eetlust remmen, zegt de ISSN. Het kan dus helpen, maar het werkt doordat je minder eet."
    de:
      title: "Low Carb"
      body: "Keto kann den Appetit dämpfen, so die ISSN. Es kann also helfen, aber über weniger Essen."
    es:
      title: "Low carb"
      body: "La keto puede quitar el apetito, señala la ISSN. Así que ayuda, pero porque comes menos."
    fr:
      title: "Low carb"
      body: "Le keto peut couper l'appétit, note l'ISSN. Il peut aider, mais parce qu'on mange moins."
    pt:
      title: "Low carb"
      body: "A keto pode tirar o apetite, nota a ISSN. Por isso ajuda, mas porque comes menos."
    tr:
      title: "Düşük karbonhidrat"
      body: "ISSN'ye göre keto iştahı azaltabilir. Yani yardımcı olur ama daha az yedirdiği için."

  - key: challenge-van-21-dagen
    kind: fact
    en:
      title: "21-day challenge"
      body: "Can be a good start. Just don't expect the habit to run on its own once it ends."
    nl:
      title: "21-dagenchallenge"
      body: "Kan een goed begin zijn. Verwacht alleen niet dat de gewoonte daarna vanzelf loopt."
    de:
      title: "21-Tage-Challenge"
      body: "Kann ein guter Start sein. Erwarte nur nicht, dass die Gewohnheit danach von selbst läuft."
    es:
      title: "Reto de 21 días"
      body: "Puede ser un buen comienzo. Pero no esperes que el hábito siga solo cuando acabe."
    fr:
      title: "Défi de 21 jours"
      body: "Ça peut être un bon début. N'attends juste pas que l'habitude tienne seule ensuite."
    pt:
      title: "Desafio de 21 dias"
      body: "Pode ser um bom começo. Só não esperes que o hábito continue sozinho quando acabar."
    tr:
      title: "21 günlük meydan okuma"
      body: "İyi bir başlangıç olabilir. Ama bitince alışkanlığın kendiliğinden süreceğini bekleme."

  - key: eiwit-en-nierziekte
    kind: fact
    en:
      title: "Kidney disease"
      body: "Have it? Ask your doctor before you raise your protein. People with kidney failure benefit from less."
    nl:
      title: "Nierziekte"
      body: "Heb je dat? Vraag je arts voor je meer eiwit gaat eten. Bij nierfalen helpt juist minder eiwit."
    de:
      title: "Nierenkrankheit"
      body: "Hast du eine? Frag deinen Arzt, bevor du mehr Protein isst. Bei Nierenversagen hilft weniger."
    es:
      title: "Enfermedad renal"
      body: "¿La tienes? Pregunta a tu médico antes de subir la proteína. Con insuficiencia renal, menos ayuda."
    fr:
      title: "Maladie rénale"
      body: "Tu en as une ? Demande à ton médecin avant d'augmenter les protéines. En insuffisance rénale, moins aide."
    pt:
      title: "Doença renal"
      body: "Tens? Pergunta ao médico antes de subir a proteína. Com insuficiência renal, menos ajuda."
    tr:
      title: "Böbrek hastalığı"
      body: "Varsa proteini artırmadan önce doktoruna sor. Böbrek yetmezliğinde daha az protein faydalı."

  - key: volgende-mythe
    kind: fact
    en:
      title: "Next myth"
      body: "Ask how big the promised effect is, and whether it was tested on people like you or on mice."
    nl:
      title: "Volgende mythe"
      body: "Vraag hoe groot het beloofde effect is, en of het getest is bij mensen zoals jij of bij muizen."
    de:
      title: "Nächster Mythos"
      body: "Frag, wie groß der versprochene Effekt ist und ob er an Leuten wie dir oder an Mäusen getestet wurde."
    es:
      title: "El próximo mito"
      body: "Pregunta cuánto efecto promete y si se probó en gente como tú o en ratones."
    fr:
      title: "Le prochain mythe"
      body: "Demande quelle est la taille de l'effet promis, et si on l'a testé sur des gens comme toi ou sur des souris."
    pt:
      title: "O próximo mito"
      body: "Pergunta quão grande é o efeito prometido e se foi testado em pessoas como tu ou em ratos."
    tr:
      title: "Sıradaki efsane"
      body: "Vaat edilen etki ne kadar büyük ve senin gibi insanlarda mı yoksa farelerde mi test edildi, sor."

  - key: kortere-weg
    kind: fact
    en:
      title: "Shortcuts"
      body: "Be wary of claims that skip the basics: a deficit for fat loss, enough protein, training that gets harder."
    nl:
      title: "Kortere weg"
      body: "Wantrouw claims die de basis overslaan: een tekort voor vetverlies, genoeg eiwit, training die zwaarder wordt."
    de:
      title: "Abkürzungen"
      body: "Misstrau Versprechen, die die Basis überspringen: Defizit, genug Protein, Training, das härter wird."
    es:
      title: "Atajos"
      body: "Desconfía de lo que se salta lo básico: déficit para perder grasa, proteína suficiente y entreno que progresa."
    fr:
      title: "Raccourcis"
      body: "Méfie-toi de ce qui saute les bases : un déficit, assez de protéines, un entraînement qui progresse."
    pt:
      title: "Atalhos"
      body: "Desconfia do que salta o básico: défice para perder gordura, proteína suficiente e treino que progride."
    tr:
      title: "Kestirmeler"
      body: "Temelleri atlayan iddialara dikkat: yağ kaybı için açık, yeterli protein, giderek zorlaşan antrenman."

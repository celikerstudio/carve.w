article: mobility
emoji: "🤸"
tips:
  - key: wat-het-is
    kind: fact
    en:
      title: "Usable range"
      body: "Mobility is range of motion you can actually use and control. It supports your technique and joints."
    nl:
      title: "Bruikbare ruimte"
      body: "Mobiliteit is bewegingsruimte die je echt kunt gebruiken en controleren. Goed voor je techniek en gewrichten."
    de:
      title: "Nutzbarer Umfang"
      body: "Mobilität ist Bewegungsumfang, den du nutzen und kontrollieren kannst. Gut für Technik und Gelenke."
    es:
      title: "Rango útil"
      body: "La movilidad es el rango que puedes usar y controlar de verdad. Ayuda a tu técnica y tus articulaciones."
    fr:
      title: "Amplitude utile"
      body: "La mobilité, c'est l'amplitude que tu peux vraiment utiliser et contrôler. Bon pour technique et articulations."
    pt:
      title: "Amplitude útil"
      body: "Mobilidade é a amplitude que consegues mesmo usar e controlar. Ajuda a técnica e as articulações."
    tr:
      title: "Kullanılabilir açıklık"
      body: "Mobilite, gerçekten kullanabildiğin ve kontrol ettiğin hareket açıklığıdır. Tekniğe ve eklemlere iyi gelir."

  - key: alleen-rekken
    kind: myth
    en:
      title: "Only stretching"
      body: "Myth: stretching alone makes you mobile. It helps keep range, but you also need to load the new range."
    nl:
      title: "Alleen rekken"
      body: "Mythe: alleen rekken maakt je mobiel. Het helpt ruimte houden, maar je moet de nieuwe ruimte ook belasten."
    de:
      title: "Nur Dehnen"
      body: "Mythos: Dehnen allein macht beweglich. Es hilft, aber du musst den neuen Umfang auch belasten."
    es:
      title: "Solo estirar"
      body: "Mito: estirar basta para tener movilidad. Ayuda a mantener rango, pero también hay que cargarlo."
    fr:
      title: "Que des étirements"
      body: "Mythe : s'étirer suffit pour être mobile. Ça aide, mais il faut aussi charger la nouvelle amplitude."
    pt:
      title: "Só alongar"
      body: "Mito: alongar chega para teres mobilidade. Ajuda a manter amplitude, mas também tens de a carregar."
    tr:
      title: "Sadece esneme"
      body: "Efsane: tek başına esneme mobilite kazandırır. Açıklığı korumaya yardım eder ama yeni açıklığı yüklemen de gerek."

  - key: kracht-in-het-bereik
    kind: fact
    en:
      title: "2 to 3 drills"
      body: "Pair that many mobility drills with strength work in the same range. Split squats work hips and ankles."
    nl:
      title: "2 tot 3 oefeningen"
      body: "Combineer zoveel mobiliteitsoefeningen met kracht in dezelfde ruimte. Split squats doen heupen en enkels."
    de:
      title: "2 bis 3 Übungen"
      body: "So viele Mobilitätsübungen plus Kraft im gleichen Umfang. Split Squats wirken auf Hüfte und Sprunggelenk."
    es:
      title: "2 a 3 ejercicios"
      body: "De movilidad, junto con fuerza en ese mismo rango. Las sentadillas búlgaras trabajan cadera y tobillo."
    fr:
      title: "2 à 3 exercices"
      body: "De mobilité, avec de la force dans la même amplitude. Les fentes bulgares travaillent hanches et chevilles."
    pt:
      title: "2 a 3 exercícios"
      body: "De mobilidade, com força nessa mesma amplitude. O split squat trabalha ancas e tornozelos."
    tr:
      title: "2-3 hareket"
      body: "Bu kadar mobilite hareketini aynı açıklıkta kuvvet çalışmasıyla eşle. Split squat kalça ve ayak bileğini çalıştırır."

  - key: elke-dag-een-beetje
    kind: fact
    en:
      title: "A bit daily"
      body: "Small daily doses of mobility work beat long marathon sessions."
    nl:
      title: "Elke dag een beetje"
      body: "Kleine dagelijkse porties mobiliteit werken beter dan lange marathonsessies."
    de:
      title: "Täglich ein bisschen"
      body: "Kleine tägliche Portionen Mobilität schlagen lange Marathon-Einheiten."
    es:
      title: "Un poco cada día"
      body: "Pequeñas dosis diarias de movilidad ganan a sesiones maratonianas."
    fr:
      title: "Un peu chaque jour"
      body: "De petites doses de mobilité chaque jour valent mieux que de longues séances marathon."
    pt:
      title: "Um pouco por dia"
      body: "Pequenas doses diárias de mobilidade valem mais do que sessões maratona."
    tr:
      title: "Her gün biraz"
      body: "Günlük küçük mobilite dozları uzun maraton seanslardan iyidir."

  - key: pauzes-en-langzaam-zakken
    kind: fact
    en:
      title: "Pause and lower"
      body: "Pauses and a slow lowering phase in your main lifts build stability in a new range."
    nl:
      title: "Pauzeren en zakken"
      body: "Pauzes en langzaam zakken in je hoofdoefeningen bouwen stabiliteit op in een nieuwe ruimte."
    de:
      title: "Pause und Absenken"
      body: "Pausen und langsames Absenken in den Hauptübungen bauen Stabilität im neuen Umfang auf."
    es:
      title: "Pausa y bajada"
      body: "Pausas y una bajada lenta en tus ejercicios principales dan estabilidad en un rango nuevo."
    fr:
      title: "Pause et descente"
      body: "Des pauses et une descente lente dans tes exercices principaux stabilisent une nouvelle amplitude."
    pt:
      title: "Pausa e descida"
      body: "Pausas e uma descida lenta nos exercícios principais dão estabilidade numa nova amplitude."
    tr:
      title: "Duraklama ve iniş"
      body: "Ana hareketlerde duraklama ve yavaş iniş yeni açıklıkta denge kazandırır."

  - key: waar-te-kijken
    kind: fact
    en:
      title: "Ankles and hips"
      body: "And the upper back are common limits. Find yours, then tie your drills to the lifts that need the range."
    nl:
      title: "Enkels en heupen"
      body: "En je bovenrug zijn vaak de beperking. Zoek de jouwe en koppel je oefeningen aan wat die ruimte nodig heeft."
    de:
      title: "Sprunggelenk, Hüfte"
      body: "Und oberer Rücken sind häufige Engpässe. Finde deine und verknüpf die Übungen mit den passenden Lifts."
    es:
      title: "Tobillos y caderas"
      body: "Y la espalda alta suelen limitar. Encuentra los tuyos y une los ejercicios a los movimientos que lo piden."
    fr:
      title: "Chevilles et hanches"
      body: "Et le haut du dos limitent souvent. Trouve les tiens et relie tes exercices aux mouvements concernés."
    pt:
      title: "Tornozelos e ancas"
      body: "E a parte alta das costas costumam limitar. Encontra os teus e liga os exercícios aos movimentos certos."
    tr:
      title: "Ayak bileği, kalça"
      body: "Ve üst sırt sık görülen kısıtlar. Seninkini bul, hareketlerini o açıklığa ihtiyaç duyan egzersizlere bağla."

  - key: niet-door-pijn
    kind: myth
    en:
      title: "Through pain"
      body: "Myth: push through pain to gain range. That's a common mistake. If pain persists, lower the load and fix technique."
    nl:
      title: "Door pijn heen"
      body: "Mythe: ga door de pijn heen voor meer ruimte. Een veelgemaakte fout. Blijft het pijn doen, verlaag dan de belasting."
    de:
      title: "Durch den Schmerz"
      body: "Mythos: Für mehr Umfang durch den Schmerz. Ein häufiger Fehler. Bleibt er, reduzier die Last und arbeite an der Technik."
    es:
      title: "Con dolor"
      body: "Mito: aguanta el dolor para ganar rango. Es un error común. Si el dolor sigue, baja la carga y mejora la técnica."
    fr:
      title: "Dans la douleur"
      body: "Mythe : force dans la douleur pour gagner en amplitude. Erreur courante. Si ça persiste, baisse la charge."
    pt:
      title: "Com dor"
      body: "Mito: força com dor para ganhar amplitude. É um erro comum. Se a dor continuar, baixa a carga e melhora a técnica."
    tr:
      title: "Ağrıya rağmen"
      body: "Efsane: açıklık için ağrıya rağmen zorla. Sık bir hata. Ağrı sürerse yükü azalt ve tekniğine çalış."

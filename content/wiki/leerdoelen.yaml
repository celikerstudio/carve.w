  passage: "Aan de andere kant kunnen supplementen met hoge doseringen EPA en DHA het risico op hartritmestoornissen vergroten. Dit risico is het grootste bij een dosering van 4 gram per dag."
  artikel: omega-3

- id: magnesium-ai
  laag: naslag
  doel: "Weet dat EFSA als adequate inname voor volwassenen 350 mg magnesium per dag voor mannen en 300 mg voor vrouwen aanhoudt."
  bron: efsa-magnesium-drv-2015
  passage: "For adults, an AI for magnesium is set at 350 mg/day for men and 300 mg/day for women."
  artikel: magnesium

- id: magnesium-bovengrens-supplement
  laag: naslag
  doel: "Weet dat de bovengrens van 250 mg magnesium per dag alleen geldt voor supplementen, water en toevoegingen, niet voor magnesium dat van nature in voeding zit."
  bron: efsa-scf-ul-report-2006
  passage: "This UL does not include Mg normally present in foods and beverages."
  artikel: magnesium

- id: magnesium-diarree
  laag: naslag
  doel: "Weet dat lichte diarree de eerste bijwerking is van te veel magnesium uit makkelijk oplosbare zouten."
  bron: efsa-scf-ul-report-2006
  passage: "As discussed, mild diarrhoea is the most sensitive non-desirable effect of orally administered easily dissociable magnesium salts."
  artikel: magnesium

- id: zink-behoefte
  laag: naslag
  doel: "Weet dat EFSA de aanbevolen zinkinname voor vrouwen op 7,5 tot 12,7 mg per dag zet en voor mannen op 9,4 tot 16,3 mg, afhankelijk van hoeveel fytaat je eet."
  bron: efsa-zinc-drv-2014
  passage: "PRIs were derived from the zinc requirement of individuals with a body weight at the 97.5th percentile for reference weights for men and women and range from 7.5 to 12.7 mg/day for women and from 9.4 to 16.3 mg/day for men."
  artikel: zinc

- id: zink-bovengrens
  laag: naslag
  doel: "Weet dat de Europese bovengrens voor zink 25 mg per dag is, ook voor zwangere vrouwen en vrouwen die borstvoeding geven."
  bron: efsa-scf-ul-report-2006
  passage: "Therefore the UL of 25 mg zinc per day applies also to pregnant and lactating women."
  artikel: zinc

- id: zink-kopertekort
  laag: naslag
  doel: "Weet dat langdurig te veel zink samengaat met verschijnselen van kopertekort."
  bron: efsa-scf-ul-report-2006
  passage: "Chronic zinc toxicity, undoubtedly, is associated with symptoms of copper deficiency."
  artikel: zinc

- id: collageen-gewrichten-geen-bewijs
  laag: naslag
  doel: "Weet dat EFSA geen oorzakelijk verband kon vaststellen tussen collageenhydrolysaat en het behoud van gezonde gewrichten."
  bron: efsa-collagen-joints-2011
  passage: "The Panel concludes that a cause and effect relationship has not been established between the consumption of collagen hydrolysate and maintenance of joints."
  artikel: collagen

- id: collageen-huid-geen-bewijs
  laag: naslag
  doel: "Weet dat EFSA voor een collageenproduct geen oorzakelijk verband kon vaststellen met een verandering in de elasticiteit van de huid die de huidfunctie verbetert."
  bron: efsa-collagen-skin-2013
  passage: "The Panel concludes that a cause and effect relationship has not been established between the consumption of VeriSol®P and a change in skin elasticity leading to an improvement in skin function."
  artikel: collagen

# ── naslag: cluster G (voeding), voorgesteld 2026-10-21, wacht op Furkans akkoord (TDR-0018 §3) ──
# Vet en vezels volgen de nieuwe normen van de Gezondheidsraad (juli 2026) en het Voedingscentrum,
# plus WHO 2023. Sporters: de ACSM/AND/DC-position stand 2016 (MSSE-versie, passages uit een kopie
# van een derde). calorie-surplus is samenvoegkandidaat voor bulking en krijgt geen leerdoel.

- id: vet-kwaliteit-boven-hoeveelheid
  laag: naslag
  doel: "Weet dat volgens de Gezondheidsraad de kwaliteit van je voedingspatroon belangrijker is voor je gezondheid dan hoeveel vet je eet."
  bron: gezondheidsraad-voedingsnormen-vetten-2026
  passage: "De kwaliteit van het voedingspatroon is belangrijker voor de gezondheid dan de totale vetinname."
  artikel: fats

- id: vet-minimaal-20-procent
  laag: naslag
  doel: "Weet dat je minstens ongeveer 20% van je energie uit vet nodig hebt om genoeg essentiële vetzuren binnen te krijgen."
  bron: voedingscentrum-vetten
  passage: "De minimale behoefte aan vet voor mensen vanaf 4 jaar wordt dus geschat op 20 energieprocent. Deze hoeveelheid is nodig om voldoende essentiële vetzuren binnen te krijgen, zoals linolzuur en alfalinoleenzuur."
  artikel: fats

- id: vet-sporters-niet-te-laag
  laag: naslag
  doel: "Weet dat sporters wordt afgeraden langdurig minder dan 20% van hun energie uit vet te halen, omdat de minder gevarieerde voeding die daarbij hoort de inname van vetoplosbare vitaminen en essentiële vetzuren waarschijnlijk verlaagt."
  bron: acsm-and-dc-nutrition-2016-msse
  passage: "Athletes should be discouraged from chronic implementation of fat intakes below 20% of energy intake since the reduction in dietary variety often associated with such restrictions is likely to reduce the intake of a variety of nutrients such as fat-soluble vitamins and essential fatty acids"
  artikel: fats

- id: vet-niet-automatisch-dik
  laag: naslag
  doel: "Weet dat vet eten niet automatisch tot overgewicht leidt, en dat het gaat om de totale energie die je eet tegenover wat je verbruikt."
  bron: voedingscentrum-vetten
  passage: "Vet eten leidt niet automatisch tot overgewicht. Het gaat er bij overgewicht om hoeveel energie de dagelijkse voeding levert en of die energie-inname en het energiegebruik in evenwicht zijn."
  artikel: fats

- id: verzadigd-vet-hooguit-10-procent
  laag: naslag
  doel: "Weet dat de WHO adviseert vooral onverzadigd vet te eten en hooguit 10% van je energie uit verzadigd vet te halen."
  bron: who-news-fats-carbohydrates-2023
  passage: "Fat consumed by everyone 2 years of age and older should be primarily unsaturated fatty acids, with no more than 10% of total energy intake coming from saturated fatty acids"
  artikel: fats

- id: transvet-hooguit-1-procent
  laag: naslag
  doel: "Weet dat de WHO adviseert transvet terug te brengen tot 1% van je energie."
  bron: who-sfa-tfa-2023
  passage: "reduce trans-fatty acid intake to 1% of total energy intake (strong recommendation)."
  artikel: fats

- id: vezels-hoeveel
  laag: naslag
  doel: "Weet dat het Voedingscentrum volwassenen van 18 tot en met 49 jaar minstens 24 gram (vrouwen) of 30 gram (mannen) vezels per dag aanraadt."
  bron: voedingscentrum-vezels
  passage: "Voor vrouwen van 18 t/m 49 jaar is het advies om in iedere geval 24 gram vezels per dag binnen te krijgen en voor mannen van 18 t/m 49 jaar in ieder geval 30 gram per dag."
  artikel: fiber

- id: vezels-per-energie
  laag: naslag
  doel: "Weet dat de Gezondheidsraad 3,0 tot 3,5 gram vezels per megajoule aanraadt (ongeveer 13 tot 15 gram per 1000 kcal), uit volkoren, groente, fruit, peulvruchten en noten."
  bron: gezondheidsraad-voedingsnormen-vetten-2026
  passage: "Aanbeveling om een vezelinname te realiseren van 3,0 tot 3,5 gram voedingsvezel per megajoule (12,6-14,6 gram per 1000 kilocalorieën) via de consumptie van volkorenproducten, groenten, fruit, peulvruchten en noten."
  artikel: fiber

- id: vezels-who
  laag: naslag
  doel: "Weet dat de WHO volwassenen minstens 400 gram groente en fruit en 25 gram vezels uit gewone voeding per dag aanraadt."
  bron: who-news-fats-carbohydrates-2023
  passage: "WHO recommends that adults consume at least 400 grams of vegetables and fruits and 25 grams of naturally occurring dietary fibre per day."
  artikel: fiber

- id: vezels-rustig-opbouwen
  laag: naslag
  doel: "Weet dat je beter niet in één keer veel meer vezels kunt gaan eten."
  bron: voedingscentrum-vezels
  passage: "Het is wel slim om niet in een keer heel veel meer vezels te gaan eten."
  artikel: fiber

- id: supplementen-meestal-niet-nodig
  laag: naslag
  doel: "Weet dat de meeste mensen geen voedingssupplementen nodig hebben als ze gevarieerd eten."
  bron: voedingscentrum-voedingssupplementen
  passage: "De meeste mensen hebben geen voedingssupplementen nodig, want ze krijgen al voldoende voedingsstoffen binnen door gevarieerd te eten."
  artikel: micronutrients

- id: sporters-multivitamine-meestal-onnodig
  laag: naslag
  doel: "Weet dat vitamine- en mineralensupplementen meestal onnodig zijn voor sporters die genoeg en gevarieerd eten."
  bron: acsm-and-dc-nutrition-2016-msse
  passage: "In general, vitamin and mineral supplements are unnecessary for the athlete who consumes a diet providing highenergy availability from a variety of nutrient-dense foods."
  artikel: micronutrients

- id: supplementen-alleen-bij-tekort
  laag: naslag
  doel: "Weet dat vitamine- en mineralensupplementen je prestatie niet verbeteren, tenzij ze een bestaand tekort opheffen."
  bron: acsm-and-dc-nutrition-2016-msse
  passage: "athletes should be educated that the intake of vitamin and mineral supplements does not improve performance unless reversing a pre-existing deficiency"
  artikel: micronutrients

- id: streng-dieet-micronutrienten
  laag: naslag
  doel: "Weet dat sporters die vaak streng op calorieën letten, extreem afvallen of voedselgroepen schrappen te weinig vitaminen en mineralen kunnen binnenkrijgen."
  bron: acsm-and-dc-nutrition-2016-msse
  passage: "Athletes who frequently restrict energy intake, rely on extreme weight-loss practices, eliminate one or more food groups from their diet, or consume poorly chosen diets, may consume sub-optimal amounts of micronutrients and benefit from micronutrient supplementation."
  artikel: micronutrients

- id: recomp-gemeld
  laag: naslag
  doel: "Weet dat winst in vetvrije massa tijdens een calorietekort in onderzoek is gemeld."
  bron: issn-diets-2017
  passage: "Although LM gains have been reported in the literature during hypocaloric conditions"
  artikel: body-recomposition

- id: recomp-eiwit-voorbeeld
  laag: naslag
  doel: "Weet dat in één studie met een calorietekort, intervalsprints en krachttraining 2,4 gram eiwit per kg leidde tot 1,2 kg meer vetvrije massa en 4,8 kg vetverlies, tegenover behoud van vetvrije massa en 3,5 kg vetverlies bij 1,2 gram per kg."
  bron: issn-diets-2017
  passage: "protein intake at 2.4 g/kg caused LM gains (1.2 kg) and fat loss (4.8 kg), while 1.2 g/kg resulted in preservation of lean mass (0.1 kg), and less fat loss (3.5 kg)."
  artikel: body-recomposition

# ── cluster H (training), voorgesteld 2026-10-21, wacht op Furkans akkoord (TDR-0018 §3) ──
# Basis is de ACSM-position stand van 2026 (vervangt die van 2009; de 2009-leerdoelen hierboven
# moeten nog worden nagelopen). Voor hypertrofie bij atleten de IUSCA-consensus 2021; voor deloaden
# en warming-up bestaat geen officiële richtlijn, alleen een Delphi-consensus (coaches van
# kracht- en physiquesporters, en experts uit de topsport).

- id: volume-minstens-twee-sets
  laag: spier-opbouwen
  doel: "Weet dat de ACSM gezonde volwassenen minstens twee sets per oefening aanraadt, en dat de extra winst afneemt boven ongeveer 2 tot 3 sets per oefening voor kracht en 18 tot 20 sets per week voor spiergroei."
  bron: acsm-resistance-training-2026
  passage: "a dose-response that plateaued and showed diminishing returns beyond ~2–3 sets/exercise for strength and ~18–20 weekly sets for hypertrophy with varying loads; thus, healthy adults are advised to complete at least two sets per exercise."
  artikel: volume

- id: volume-tien-sets-hypertrofie
  laag: naslag
  doel: "Weet dat spiergroei in de reviews groter was bij 10 of meer sets per spiergroep per week."
  bron: acsm-resistance-training-2026
  passage: "Between RTx, hypertrophy was enhanced by RT performed with eccentric-only contractions (versus concentric-only) and higher volume (≥10 sets/muscle group/wk)."
  artikel: volume

- id: volume-geleidelijk-opvoeren
  laag: naslag
  doel: "Weet dat een expertconsensus over spiergroei bij atleten aanraadt het aantal sets per spiergroep per cyclus van ongeveer 4 weken met hooguit zo'n 20% te verhogen."
  bron: iusca-hypertrophy-2021
  passage: "It may be prudent to limit incremental increases in the number of sets for a given muscle group to 20% of an athlete’s previous volume during a given training cycle (~4 weeks) and then readjust accordingly."
  artikel: volume

- id: falen-niet-nodig
  laag: spier-opbouwen
  doel: "Weet dat sets tot spierfalen trainen volgens de ACSM niet meer kracht, spiergroei of explosiviteit oplevert en dus niet nodig is."
  bron: acsm-resistance-training-2026
  passage: "Completing sets to fatigue (momentary muscular failure) does not enhance gains in strength, hypertrophy, and power, and so is not necessary for benefits to occur."
  artikel: intensity

- id: rir-geen-exact-doel
  laag: naslag
  doel: "Weet dat er onvoldoende bewijs is voor een exact aantal herhalingen in reserve (RIR) of een exacte inspanningsscore (RPE) als doel."
  bron: acsm-resistance-training-2026
  passage: "While training to failure is not obligatory for optimizing results, there is insufficient evidence to quantify exact RIR and perceived exertion targets"
  artikel: intensity

- id: spiergroei-breed-gewichtsbereik
  laag: naslag
  doel: "Weet dat je met een breed bereik aan gewichten vergelijkbare spiergroei kunt halen."
  bron: iusca-hypertrophy-2021
  passage: "Individuals can achieve comparable muscle hypertrophy across a wide spectrum of loading zones."
  artikel: intensity

- id: beginners-niet-tot-falen
  laag: naslag
  doel: "Weet dat beginners flink spiermassa kunnen winnen zonder dicht tegen falen aan te trainen."
  bron: iusca-hypertrophy-2021
  passage: "Novice lifters can achieve robust gains in muscle mass without training at a close proximity to failure."
  artikel: intensity

- id: warmup-geen-acute-bescherming
  laag: naslag
  doel: "Weet dat een expertconsensus over warming-up in de sport geen steun vond voor directe bescherming tegen blessures, al kunnen sommige oefeningen het blessurerisico op lange termijn verlagen."
  bron: delphi-warmup-athletes-2026
  passage: "While inclusion of some type of exercises in the warm-up may reduce long-term injury risk, as in other periods of the training session, there is no support for acute injury protection."
  artikel: warm-up

- id: warmup-volledigheid
  laag: naslag
  doel: "Weet dat volgens die consensus hoe volledig een warming-up is een belangrijke factor is voor hoe goed hij werkt."
  bron: delphi-warmup-athletes-2026
  passage: "The comprehensiveness of a warm-up protocol is a key factor associated with its effectiveness."
  artikel: warm-up

- id: deload-definitie
  laag: naslag
  doel: "Weet dat een deload een periode met minder trainingsbelasting is, bedoeld om vermoeidheid te verminderen, herstel te bevorderen en je klaar te maken voor de volgende training."
  bron: delphi-deloading-2023
  passage: "Deloading is a period of reduced training stress designed to mitigate physiological and psychological fatigue, promote recovery, and enhance preparedness for subsequent training."
  artikel: deload

- id: deload-intensiteit
  laag: naslag
  doel: "Weet dat het gewicht tijdens een deload gelijk kan blijven, maar alleen als het volume omlaag gaat."
  bron: delphi-deloading-2023
  passage: "Training intensity could also remain the same during the deload, but only when training volume is reduced."
  artikel: deload

- id: deload-nut-onzeker
  laag: naslag
  doel: "Weet dat onduidelijk is of deloaden nodig is om langdurige overbelasting te voorkomen."
  bron: delphi-deloading-2023
  passage: "It is currently unclear whether deloading is a necessary part of the training programme to avoid the deleterious effects of NFOR/OTS."
  artikel: deload

- id: isolatie-en-meergewricht
  laag: naslag
  doel: "Weet dat de ACSM voor spiergroei aanraadde zowel enkel- als meergewrichtsoefeningen te doen, met vrije gewichten en machines, op elk niveau."
  bron: acsm-resistance-training-2009
  passage: "It is recommended that single- and multiple-joint free-weight and machine exercises be included in an RT program in novice, intermediate, and advanced individuals"
  artikel: isolation-exercises

- id: isolatie-gericht-weinig-techniek
  laag: naslag
  doel: "Weet dat enkelgewrichtsoefeningen een spiergroep gericht trainen en minder vaardigheid en techniek vragen."
  bron: acsm-resistance-training-2009
  passage: "Single-joint exercises, such as knee extensions and knee curls, have been used to target-specific muscle groups and pose a reduced level of skill and technical involvement."
  artikel: isolation-exercises

- id: isolatie-geen-bewezen-voorkeur
  laag: naslag
  doel: "Weet dat de ACSM in 2026 te weinig gegevens vond om te zeggen of enkel- of meergewrichtsoefeningen meer spiergroei geven."
  bron: acsm-resistance-training-2026
  passage: "There were insufficient data to determine if muscle hypertrophy was influenced by eccentric flywheel versus standard RT (85), machine versus free-weight RT (100), single-joint versus multijoint RT (128,142)"
  artikel: isolation-exercises

# ── cluster I (herstel), voorgesteld 2026-10-22, wacht op Furkans akkoord (TDR-0018 §3) ──
# Over spierpijn (DOMS) bestaat geen eigen richtlijn; de stretching-Delphi (2025) noemt hem wel.
# Blessurepreventie: alleen IOC-consensus over belasting bij topsporters (samenvatting) en de ACSM
# 2011; niets specifiek voor krachttraining.

- id: rekken-niet-voor-herstel
  laag: naslag
  doel: "Weet dat een expertconsensus rekken niet aanraadt als herstelroutine na het sporten, al is het vertrouwen in het bewijs laag."
  bron: stretching-delphi-2025
  passage: "Based on the current evidence, the panel does not recommend stretching as a post-exercise recovery routine although overall confidence in the available evidence is low."
  artikel: doms

- id: rekken-geen-bewijs-spierpijn
  laag: naslag
  doel: "Weet dat rekken tegen spierpijn (DOMS) bewijs en een theoretische basis mist, al kan het voor sommigen psychologisch prettig zijn."
  bron: stretching-delphi-2025
  passage: "While stretching may be of psychological value for some individuals, its application for alleviation of DOMS not only lacks evidence but also theoretical foundation."
  artikel: doms

- id: lang-statisch-rekken-voor-maximale-kracht
  laag: naslag
  doel: "Weet dat lang statisch rekken (meer dan 60 seconden per spier) vlak voor maximale of explosieve inspanning wordt afgeraden, maar dat kort statisch rekken binnen een dynamische warming-up en dynamisch rekken dat nadeel niet hebben."
  bron: stretching-delphi-2025
  passage: "The panel does not recommend prolonged (>60 s per muscle) static stretching prior to maximal or explosive contractions in isolated muscle groups (meaning static calf stretching should be avoided prior to maximal strength efforts). However, short-duration static stretching incorporated into a dynamic warm-up and dynamic stretching do not cause such impairments."
  artikel: stretching

- id: rekken-voor-bewegingsbereik
  laag: naslag
  doel: "Weet dat wie rekt om direct meer bewegingsbereik te krijgen minstens 2 keer 5 tot 30 seconden rekt."
  bron: stretching-delphi-2025
  passage: "If stretching is used to improve ROM acutely, the panel recommends a minimum of 2 bouts of 5 s to 30 s of soft tissue stretching."
  artikel: stretching

- id: rekken-acsm-twee-keer-per-week
  laag: naslag
  doel: "Weet dat de ACSM aanraadt minstens twee dagen per week lenigheidsoefeningen te doen voor alle grote spier-peesgroepen, in totaal 60 seconden per oefening."
  bron: acsm-quantity-quality-2011
  passage: "Crucial to maintaining joint range of movement, completing a series of flexibility exercises for each the major muscle-tendon groups (a total of 60 s per exercise) on ≥2 d·wk is recommended."
  artikel: stretching

- id: rekken-geen-algemene-blessurepreventie
  laag: naslag
  doel: "Weet dat rekken niet wordt aangeraden als algemene blessurepreventie, al wijzen eerste aanwijzingen erop dat statisch rekken spierblessures kan verminderen."
  bron: stretching-delphi-2025
  passage: "The panel does not recommend stretching for injury prevention in general. The panel acknowledges that initial evidence suggests static stretching may reduce the incidence of muscle injuries."
  artikel: injury-prevention

- id: belasting-slecht-gemanaged-blessure
  laag: naslag
  doel: "Weet dat slecht beheer van trainingsbelasting volgens het IOC een belangrijke risicofactor voor blessures is bij topsporters."
  bron: ioc-load-injury-2016
  passage: "Emerging evidence indicates that poor load management is a major risk factor for injury."
  artikel: injury-prevention

- id: geleidelijk-opbouwen-risico
  laag: naslag
  doel: "Weet dat de ACSM zegt dat geleidelijk opbouwen van intensiteit en volume de risico's van sporten kan verkleinen."
  bron: acsm-quantity-quality-2011
  passage: "Educating adults about and screening for signs and symptoms of CHD and gradual progression of exercise intensity and volume may reduce the risks of exercise."
  artikel: injury-prevention

# ── cluster J (mindset), voorgesteld 2026-10-22, wacht op Furkans akkoord (TDR-0018 §3) ──
# Geen richtlijn noemt 40 als grens (WHO heeft een apart advies vanaf 65, de Gezondheidsraad één voor volwassenen en ouderen), geen richtlijn adviseert
# trainen per cyclusfase, en over stilstand in training zegt ACSM 2026 alleen iets over progressie.
# Zelfmonitoring: de AHA/ACC/TOS-richtlijn (2013) voor volwassenen met overgewicht.

- id: ouderen-kracht-en-balans
  laag: naslag
  doel: "Weet dat de WHO ouderen (65+) aanraadt minstens 3 dagen per week gevarieerd te bewegen met nadruk op balans en kracht, om functioneren te verbeteren en vallen te voorkomen."
  bron: who-physical-activity-2020
  passage: "older adults should do varied multicomponent physical activity that emphasises functional balance and strength training at moderate or greater intensity on 3 or more days a week, to enhance functional capacity and to prevent falls."
  artikel: fitness-40-plus

- id: kracht-advies-alle-leeftijden
  laag: naslag
  doel: "Weet dat de ACSM-aanbevelingen voor krachttraining voor gezonde volwassenen van alle leeftijden gelden."
  bron: acsm-resistance-training-2026
  passage: "Thus, our recommendations are evidence-based across all ages."
  artikel: fitness-40-plus

- id: krachttraining-veilig-ouderen
  laag: naslag
  doel: "Weet dat sporten in een analyse van meer dan 38.000 deelnemers, onder wie meer dan 11.000 ouderen, het risico op ernstige bijwerkingen niet verhoogde."
  bron: acsm-resistance-training-2026
  passage: "In an analysis of >38,000 participants (>6700 RT participants), of which >11,000 were older adults, exercise did not increase the risk of serious adverse events."
  artikel: fitness-40-plus

- id: gezondheidsraad-spier-bot-balans
  laag: naslag
  doel: "Weet dat de Gezondheidsraad iedereen aanraadt minstens twee keer per week spier- en botversterkende oefeningen te doen, en ouderen daarnaast balansoefeningen."
  bron: gezondheidsraad-beweegrichtlijnen-2017
  passage: "Doe op zijn minst tweemaal per week spier- en botversterkende oefeningen, zoals traplopen, herhaald opstaan uit zit en krachttraining, voor ouderen gecombineerd met balansoefeningen"
  artikel: fitness-40-plus

- id: zwanger-krachttraining
  laag: naslag
  doel: "Weet dat de WHO regelmatige krachttraining aanraadt voor zwangere vrouwen en vrouwen na de bevalling."
  bron: who-physical-activity-2020
  passage: "Available evidence from intervention trials combining both aerobic and muscle-strengthening physical activity support the recommendation for regular strength training to be included for pregnant and postpartum women."
  artikel: fitness-for-women

- id: zwanger-doorgaan-als-je-al-sportte
  laag: naslag
  doel: "Weet dat vrouwen die voor de zwangerschap al stevig sportten daarmee, als er geen medische reden is om het niet te doen, door kunnen gaan tijdens de zwangerschap en na de bevalling."
  bron: who-physical-activity-2020
  passage: "Women who, before pregnancy, habitually engaged in vigorous-intensity aerobic activity or who were physically active can continue these activities during pregnancy and the postpartum period."
  artikel: fitness-for-women

- id: zwanger-niet-op-rug
  laag: naslag
  doel: "Weet dat de WHO zwangere vrouwen aanraadt na het eerste trimester geen oefeningen op de rug te doen."

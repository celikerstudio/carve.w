article: tdee
emoji: "📐"
tips:
  - key: wat-is-tdee
    kind: fact
    en:
      title: "TDEE"
      body: "Everything you burn in a day: your BMR, plus exercise, everyday movement and digesting food."
    nl:
      title: "TDEE"
      body: "Alles wat je op een dag verbrandt: je BMR, plus sporten, dagelijks bewegen en het verteren van eten."
    de:
      title: "TDEE"
      body: "Alles, was du am Tag verbrennst: Grundumsatz plus Sport, Alltagsbewegung und Verdauung."
    es:
      title: "TDEE"
      body: "Todo lo que quemas en un día: tu metabolismo basal más ejercicio, movimiento diario y digestión."
    fr:
      title: "TDEE"
      body: "Tout ce que tu brûles dans la journée : métabolisme de base, sport, mouvements du quotidien et digestion."
    pt:
      title: "TDEE"
      body: "Tudo o que gastas num dia: metabolismo basal, mais exercício, movimento diário e digestão."
    tr:
      title: "TDEE"
      body: "Bir günde yaktığın her şey: bazal metabolizma, egzersiz, günlük hareket ve sindirim."

  - key: neat
    kind: fact
    en:
      title: "Hundreds of kcal"
      body: "Steps and fidgeting can swing what you burn that much a day. Keep your steps steady so the numbers stay readable."
    nl:
      title: "Honderden kcal"
      body: "Zoveel kunnen stappen en friemelen per dag schelen. Houd je stappen gelijk, dan blijven je cijfers leesbaar."
    de:
      title: "Hunderte kcal"
      body: "So viel können Schritte und Zappeln am Tag ausmachen. Halt die Schritte stabil, dann bleiben die Zahlen klar."
    es:
      title: "Cientos de kcal"
      body: "Es lo que pueden variar pasos y movimientos pequeños al día. Mantén tus pasos para leer bien los números."
    fr:
      title: "Des centaines de kcal"
      body: "C'est l'écart que pas et gigotements peuvent faire par jour. Garde tes pas stables pour des chiffres lisibles."
    pt:
      title: "Centenas de kcal"
      body: "É quanto passos e pequenos movimentos podem mudar por dia. Mantém os passos para leres bem os números."
    tr:
      title: "Yüzlerce kcal"
      body: "Adımlar ve kıpırdanma günde bu kadar fark yaratabilir. Rakamlar okunur kalsın diye adımlarını sabit tut."

  - key: onderhoud-vinden
    kind: fact
    en:
      title: "2 to 3 weeks"
      body: "Log food, weight and steps that long. If your weight holds, you've found your maintenance calories."
    nl:
      title: "2 tot 3 weken"
      body: "Houd zo lang eten, gewicht en stappen bij. Blijft je gewicht gelijk, dan heb je je onderhoud gevonden."
    de:
      title: "2 bis 3 Wochen"
      body: "So lange Essen, Gewicht und Schritte notieren. Bleibt das Gewicht stabil, hast du deinen Erhaltungsbedarf."
    es:
      title: "2 a 3 semanas"
      body: "Apunta comida, peso y pasos ese tiempo. Si tu peso se mantiene, has dado con tu mantenimiento."
    fr:
      title: "2 à 3 semaines"
      body: "Note repas, poids et pas sur cette durée. Si ton poids tient, tu as trouvé ta maintenance."
    pt:
      title: "2 a 3 semanas"
      body: "Regista comida, peso e passos durante esse tempo. Se o peso se mantém, encontraste a manutenção."
    tr:
      title: "2-3 hafta"
      body: "Bu süre yemek, kilo ve adım kaydet. Kilon sabit kalıyorsa koruma kalorini buldun."

  - key: calculator-weet-het-niet
    kind: myth
    en:
      title: "Calculator"
      body: "Myth: a calculator knows your TDEE. Activity multipliers are a guess. Check them against your weight trend."
    nl:
      title: "Calculator"
      body: "Mythe: een calculator weet je TDEE. Activiteitsfactoren zijn een gok. Toets ze aan wat je gewicht doet."
    de:
      title: "Rechner"
      body: "Mythos: Ein Rechner kennt deinen TDEE. Aktivitätsfaktoren sind geraten. Prüf sie an deinem Gewichtsverlauf."
    es:
      title: "Calculadora"
      body: "Mito: una calculadora sabe tu TDEE. Los factores de actividad son una apuesta. Compáralos con tu peso."
    fr:
      title: "Calculateur"
      body: "Mythe : un calculateur connaît ton TDEE. Les coefficients d'activité sont une estimation. Vérifie-les sur ton poids."
    pt:
      title: "Calculadora"
      body: "Mito: uma calculadora sabe o teu TDEE. Os fatores de atividade são um palpite. Confirma com o teu peso."
    tr:
      title: "Hesaplayıcı"
      body: "Efsane: hesaplayıcı TDEE'ni bilir. Aktivite katsayıları tahmindir. Kilo eğiliminle karşılaştır."

  - key: kleine-stappen
    kind: fact
    en:
      title: "100 to 200 kcal"
      body: "At a time is how to adjust, based on your 2 to 3 week trend. Big jumps make you overshoot."
    nl:
      title: "100 tot 200 kcal"
      body: "Per keer pas je aan, op basis van je trend over 2 tot 3 weken. Grote sprongen schieten door."
    de:
      title: "100 bis 200 kcal"
      body: "Pro Schritt anpassen, nach deinem Trend über 2 bis 3 Wochen. Große Sprünge schießen übers Ziel."
    es:
      title: "100 a 200 kcal"
      body: "Cada vez es lo que debes ajustar, según tu tendencia de 2 a 3 semanas. Los saltos grandes se pasan."
    fr:
      title: "100 à 200 kcal"
      body: "À la fois, c'est comme ça qu'on ajuste, selon ta tendance sur 2 à 3 semaines. Les gros sauts dépassent."
    pt:
      title: "100 a 200 kcal"
      body: "De cada vez é como ajustar, conforme a tendência de 2 a 3 semanas. Saltos grandes passam do alvo."
    tr:
      title: "100-200 kcal"
      body: "2-3 haftalık eğilime göre her seferinde bu kadar ayarla. Büyük sıçramalar hedefi aşar."

  - key: afvallen-of-aankomen
    kind: fact
    en:
      title: "300 to 600 kcal"
      body: "Below maintenance to cut. To gain, eat 150 to 300 kcal above it."
    nl:
      title: "300 tot 600 kcal"
      body: "Onder onderhoud om af te vallen. Om aan te komen eet je 150 tot 300 kcal erboven."
    de:
      title: "300 bis 600 kcal"
      body: "Unter dem Erhaltungsbedarf zum Abnehmen. Zum Aufbauen 150 bis 300 kcal darüber."
    es:
      title: "300 a 600 kcal"
      body: "Por debajo del mantenimiento para definir. Para ganar, 150 a 300 kcal por encima."
    fr:
      title: "300 à 600 kcal"
      body: "Sous la maintenance pour sécher. Pour prendre, 150 à 300 kcal au-dessus."
    pt:
      title: "300 a 600 kcal"
      body: "Abaixo da manutenção para perder. Para ganhar, 150 a 300 kcal acima."
    tr:
      title: "300-600 kcal"
      body: "Yağ kaybı için korumanın bu kadar altı. Kilo almak için 150-300 kcal üstü."

  - key: na-vijf-procent
    kind: fact
    en:
      title: "5%"
      body: "Weight change is when to work out your maintenance again. It moves with your weight."
    nl:
      title: "5%"
      body: "Gewichtsverandering is het moment om je onderhoud opnieuw uit te rekenen. Het beweegt mee met je gewicht."
    de:
      title: "5 %"
      body: "Gewichtsänderung ist der Moment, den Erhaltungsbedarf neu zu rechnen. Er wandert mit deinem Gewicht."
    es:
      title: "5 %"
      body: "De cambio de peso es cuándo recalcular tu mantenimiento. Se mueve con tu peso."
    fr:
      title: "5 %"
      body: "De variation de poids : c'est le moment de recalculer ta maintenance. Elle suit ton poids."
    pt:
      title: "5%"
      body: "De mudança de peso é quando recalcular a manutenção. Ela acompanha o teu peso."
    tr:
      title: "%5"
      body: "Kilo değişiminde koruma kalorini yeniden hesapla. Kilonla birlikte değişir."

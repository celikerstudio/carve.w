<!doctype html><meta charset="utf-8">
<!-- De bewegende outro. Deze pagina is een zuivere functie van de tijd: roep
     setTime(t) aan en je krijgt exact het kader op seconde t. Geen CSS-animaties
     en geen timers, want de renderer springt per frame naar een tijdstip en die
     moet elke keer hetzelfde plaatje opleveren.
     @ai-sync scripts/ads/render-frames.js roept setTime aan; scripts/ads/build-outro.sh vult deze template. -->
<style>
  :root{ --u:__U__px; --surface:#141415; --ink:#fafafa;
         --font:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif; }
  *{margin:0;box-sizing:border-box}
  html,body{width:__W__px;height:__H__px;background:var(--surface);
            font-family:var(--font);color:var(--ink);overflow:hidden}

  .stage{position:relative;height:100%;display:flex;flex-direction:column;
         padding:calc(7*var(--u)) calc(7*var(--u)) calc(11*var(--u))}

  .top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;
       gap:calc(4*var(--u))}
  .sym{position:relative;width:calc(9.5*var(--u));flex:none;margin-top:calc(.6*var(--u))}

  .head{position:relative;height:calc(17*var(--u));flex:1}
  .hb{position:absolute;left:0;top:0;height:100%;display:flex;flex-direction:column;
      justify-content:center;opacity:0}
  .hb b{display:block;font-size:calc(7.8*var(--u));font-weight:700;letter-spacing:-.04em;
        line-height:1.08;white-space:nowrap}
  .hb.one b{font-size:calc(7*var(--u));letter-spacing:-.038em}
  /* @ai-context Het wordmerk zoals docs/brand/identity.md §7 het beschrijft:
     zwaar wit, wijde letterafstand. Alleen in het laatste kader, en dan gaat
     het icoon rechtsboven weg: twee keer hetzelfde merk is ruis. */
  .hb.mark b{font-size:calc(11*var(--u));font-weight:800;letter-spacing:.2em;
             text-indent:.2em}

  .glow{position:absolute;left:50%;top:22%;width:calc(86*var(--u));height:calc(86*var(--u));
        transform:translateX(-50%);
        background:radial-gradient(circle,rgba(250,250,250,.10),transparent 62%)}

  .phone{position:absolute;left:50%;top:16%;width:calc(54*var(--u));aspect-ratio:1260/2736;
         border-radius:calc(6*var(--u));overflow:hidden;
         border:calc(.5*var(--u)) solid rgba(255,255,255,.14);
         box-shadow:0 calc(6*var(--u)) calc(14*var(--u)) rgba(0,0,0,.55)}
  .phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0}

  /* @ai-gotcha Geen drop-shadow op de tekening: een filter onder een mask tekent
     in Chrome de rand van het laagvlak mee, zichtbaar als lichte rechthoek. */
  .fig{position:absolute;left:50%;top:22%;height:calc(105*var(--u));aspect-ratio:360/1100;
       -webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 97%);
       mask-image:linear-gradient(180deg,#000 74%,transparent 97%)}
  .fig img{width:100%;height:100%;object-fit:contain}
  .fig .tint{position:absolute;inset:0;mix-blend-mode:multiply;
    -webkit-mask-image:url("__FIGURE__");mask-image:url("__FIGURE__");
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center}
  .fig svg{position:absolute;inset:0;width:100%;height:100%}
  .fig ellipse{fill:#e2704e;opacity:0}

  .btn{position:relative;margin-top:auto;background:var(--ink);color:var(--surface);
       font-size:calc(4.5*var(--u));font-weight:700;text-align:center;
       padding:calc(3.8*var(--u)) 0 calc(3.4*var(--u));border-radius:calc(4*var(--u));line-height:1.1}
  .btn span{display:block;font-size:calc(2.9*var(--u));font-weight:600;color:#6b6b6b;
            margin-top:calc(.9*var(--u))}
</style>

<div class="stage">
  <div class="glow" id="glow"></div>
  <div class="phone" id="phone">
    <img id="s1" src="__SCREEN1__" alt="">
    <img id="s2" src="__SCREEN2__" alt="">
  </div>
  <div class="top">
    <div class="head" id="head"></div>
    <img class="sym" id="sym" src="__LOGO__" alt="">
  </div>
  <div class="fig" id="fig">
    <img src="__FIGURE__" alt="">
    <div class="tint" id="tint"></div>
  </div>
  <div class="btn" id="btn"></div>
</div>

<script>
(function(){
  "use strict";
  var TEXTS = __TEXTS__;
  var U = __U__;                 /* 1/100 van de breedte in px */
  var cq = function(v){ return v * U; };

  /* ---- de tijdlijn, één bron van waarheid ---------------------------------
     @ai-why Deze getallen staan hier en niet in het bouwscript, zodat de
     mockup en de export dezelfde beweging hebben. */
  var VARIANT = "__VARIANT__";

  /* De lange versie: twee trainingsdagen, daarna de landing en twee schermen. */
  var LANG_T = {
    duration: 8.1,
    sym:   {at:0.10, dur:1.00},
    head:  {at:0.20, dur:1.00},
    glow:  {in:0.45, inDur:1.60, out:4.60, outDur:0.80},
    fig:   {in:0.50, inDur:1.50, land:4.60, landDur:1.50, out:5.75, outDur:0.45},
    phone: {at:4.70, dur:1.10},
    s1:    {at:4.80, dur:0.70},
    s2:    {at:6.90, dur:0.60},
    btn:   {at:1.20, dur:1.10},
    /* wanneer welke kop in beeld komt; de tint volgt dezelfde tijden */
    heads: [0, 1.8, 3.1, 4.7, 6.7],
    headFade: 0.55,
    tintFade: 0.85
  };

  /* De korte versie: twee boodschappen, en het laatste kader staat stil.
     @ai-why Alles is klaar op 4,15s, zodat er bijna een hele seconde overblijft
     waarin niets meer beweegt. Dat is de seconde waarin iemand de knop leest. */
  var KORT_T = {
    duration: 5.0,
    sym:   {at:0.10, dur:0.90, out:3.60, outDur:0.35},
    head:  {at:0.20, dur:0.90},
    glow:  {in:0.30, inDur:1.20, out:1.50, outDur:0.70},
    fig:   {in:0.30, inDur:1.20, land:1.50, landDur:1.20, out:2.60, outDur:0.40},
    phone: {at:1.50, dur:0.90},
    s1:    {at:1.60, dur:0.60},
    s2:    {at:2.75, dur:0.50},
    btn:   {at:0.90, dur:1.00},
    heads: [0, 1.45, 2.75, 3.60],
    headFade: 0.45,
    tintFade: 0.70
  };

  var T = VARIANT === "kort" ? KORT_T : LANG_T;
  /* Gemeten op public/screenshots/health.png: het figuur staat daar op 24,5%
     van links, 48,6% van boven en 19,4% van de schermhoogte. */
  var LAND = { x:-13.8, y:-6.2, s:0.217 };
  var RISE = 2.4;                /* hoeveel een element omhoog schuift, in cqw */

  /* ---- easing --------------------------------------------------------------
     Cubic-bezier zoals CSS hem rekent, met Newton-Raphson op x. */
  function bezier(x1,y1,x2,y2){
    function A(a,b){ return 1-3*b+3*a; }
    function B(a,b){ return 3*b-6*a; }
    function C(a){ return 3*a; }
    function calc(t,a,b){ return ((A(a,b)*t + B(a,b))*t + C(a))*t; }
    function slope(t,a,b){ return 3*A(a,b)*t*t + 2*B(a,b)*t + C(a); }
    return function(x){
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x;
      for (var i=0;i<8;i++){
        var s = slope(t,x1,x2);
        if (s === 0) break;
        t -= (calc(t,x1,x2) - x)/s;
      }
      return calc(t,y1,y2);
    };
  }
  var EXPO   = bezier(.16,1,.3,1);      /* zacht uitlopend, voor het opkomen */
  var LANDE  = bezier(.5,0,.15,1);      /* de landing */
  var SWAP   = bezier(.4,0,.2,1);       /* tekst en spiertint */
  var OUT    = bezier(0,0,.58,1);       /* ease-out voor fades */

  function p(t, at, dur, ease){
    if (dur <= 0) return t >= at ? 1 : 0;
    return (ease||OUT)(Math.min(1, Math.max(0, (t - at)/dur)));
  }

  /* ---- opbouw van de kop en de spiertint ---------------------------------- */
  var head = document.getElementById("head");
  TEXTS.heads.forEach(function(h,i){
    var d = document.createElement("div");
    d.className = "hb" + (h.mark ? " mark" : (h.b ? "" : " one"));
    d.innerHTML = "<b>" + h.a + "</b>" + (h.b ? "<b>" + h.b + "</b>" : "");
    head.appendChild(d);
  });

  var REGIONS = [
    ["shoulders",68,232,40,44],["shoulders",292,232,40,44],
    ["chest",132,278,52,44],["chest",228,278,52,44],
    ["biceps",50,345,30,62],["biceps",310,345,30,62],
    ["forearms",34,478,26,72],["forearms",326,478,26,72],
    ["abs",180,400,48,84],
    ["legs",128,785,44,95],["legs",232,785,44,95],
    ["calves",116,955,30,75],["calves",244,955,30,75]
  ];
  var tint = document.getElementById("tint");
  tint.innerHTML = '<svg viewBox="0 0 360 1100" preserveAspectRatio="xMidYMid meet">' +
    '<defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%">' +
    '<feGaussianBlur stdDeviation="11"/></filter></defs><g filter="url(#soft)">' +
    REGIONS.map(function(r){
      return '<ellipse data-m="' + r[0] + '" cx="' + r[1] + '" cy="' + r[2] +
             '" rx="' + r[3] + '" ry="' + r[4] + '"/>';
    }).join("") + '</g></svg>';

  var el = {
    sym: document.getElementById("sym"),
    glow: document.getElementById("glow"),
    fig: document.getElementById("fig"),
    phone: document.getElementById("phone"),
    s1: document.getElementById("s1"),
    s2: document.getElementById("s2"),
    btn: document.getElementById("btn"),
    blocks: head.querySelectorAll(".hb"),
    ellipses: tint.querySelectorAll("ellipse")
  };
  el.btn.innerHTML = TEXTS.button + "<span>" + TEXTS.store + "</span>";

  function riseStyle(node, prog){
    node.style.opacity = prog;
    node.style.transform = "translateY(" + cq(RISE*(1-prog)) + "px)";
  }

  window.setTime = function(t){
    /* logo en kop */
    var symOut = T.sym.out ? p(t, T.sym.out, T.sym.outDur) : 0;
    riseStyle(el.sym, p(t, T.sym.at, T.sym.dur, EXPO) * (1 - symOut));
    riseStyle(head,   p(t, T.head.at, T.head.dur, EXPO));
    riseStyle(el.btn, p(t, T.btn.at, T.btn.dur, EXPO));

    /* gloed: op en later weer weg */
    el.glow.style.opacity = p(t, T.glow.in, T.glow.inDur) *
                            (1 - p(t, T.glow.out, T.glow.outDur));

    /* welke kop staat er, en hoe ver is de overgang */
    var idx = 0;
    for (var i=0;i<T.heads.length;i++){ if (t >= T.heads[i]) idx = i; }
    var prev = Math.max(0, idx-1);
    var swap = idx === 0 ? 1 : SWAP(Math.min(1, (t - T.heads[idx]) / T.headFade));
    el.blocks.forEach(function(b,i){
      b.style.opacity = i === idx ? swap : (i === prev ? 1 - swap : 0);
    });

    /* spiertint volgt dezelfde wissel, maar trager */
    var tSwap = idx === 0 ? 1 : SWAP(Math.min(1, (t - T.heads[idx]) / T.tintFade));
    var now = TEXTS.heads[idx].m || [], was = TEXTS.heads[prev].m || [];
    el.ellipses.forEach(function(e){
      var m = e.dataset.m;
      var a = was.indexOf(m) !== -1 ? .85 : 0;
      var b = now.indexOf(m) !== -1 ? .85 : 0;
      e.style.opacity = a + (b - a) * tSwap;
    });

    /* het figuur: opkomen, landen, verdwijnen */
    var appear = p(t, T.fig.in, T.fig.inDur, EXPO);
    var land   = p(t, T.fig.land, T.fig.landDur, LANDE);
    var gone   = p(t, T.fig.out, T.fig.outDur);
    var scale  = (1 + .05*(1-appear)) * (1 + (LAND.s - 1)*land);
    el.fig.style.opacity = appear * (1 - gone);
    el.fig.style.transform = "translateX(-50%) translate(" +
      cq(LAND.x*land) + "px," + cq(LAND.y*land) + "px) scale(" + scale + ")";

    /* de telefoon en de twee schermen */
    var ph = p(t, T.phone.at, T.phone.dur, EXPO);
    el.phone.style.opacity = ph;
    el.phone.style.transform = "translateX(-50%) translateY(" + cq(3*(1-ph)) + "px)";
    el.s1.style.opacity = p(t, T.s1.at, T.s1.dur);
    el.s2.style.opacity = p(t, T.s2.at, T.s2.dur);
  };
  window.outroDuration = T.duration;
  window.setTime(0);
  document.title = "klaar";
})();
</script>

article: rep-ranges
emoji: "🔢"
tips:
  - key: niet-alleen-8-12
    kind: myth
    en:
      title: "8 to 12 reps"
      body: "Myth: only 8 to 12 reps builds muscle. Growth was similar from 30% to 100% of your one-rep max."
    nl:
      title: "8 tot 12 herhalingen"
      body: "Mythe: alleen 8 tot 12 herhalingen bouwt spier. Groei was vergelijkbaar van 30% tot 100% van je max."
    de:
      title: "8 bis 12 Wdh."
      body: "Mythos: Nur 8 bis 12 Wiederholungen bauen Muskeln. Das Wachstum war von 30 bis 100 % des Maximums ähnlich."
    es:
      title: "8 a 12 repeticiones"
      body: "Mito: solo 8 a 12 repeticiones dan músculo. El crecimiento fue parecido del 30 % al 100 % de tu máximo."
    fr:
      title: "8 à 12 reps"
      body: "Mythe : seules 8 à 12 reps font du muscle. La croissance était proche de 30 % à 100 % de ton max."
    pt:
      title: "8 a 12 repetições"
      body: "Mito: só 8 a 12 repetições dão músculo. O crescimento foi parecido de 30% a 100% do teu máximo."
    tr:
      title: "8-12 tekrar"
      body: "Efsane: sadece 8-12 tekrar kas yapar. Büyüme maksimumun %30'undan %100'üne kadar benzerdi."

  - key: kracht-zwaar
    kind: fact
    en:
      title: "80% or more"
      body: "Of your max is what the ACSM names for strength. Heavier loads gave a bigger one-rep max."
    nl:
      title: "80% of meer"
      body: "Van je max noemt de ACSM voor kracht. Zwaardere gewichten gaven een hogere max."
    de:
      title: "80 % oder mehr"
      body: "Deines Maximums nennt das ACSM für Kraft. Schwerere Lasten brachten ein höheres Maximum."
    es:
      title: "80 % o más"
      body: "De tu máximo es lo que propone el ACSM para fuerza. Las cargas pesadas dieron un máximo mayor."
    fr:
      title: "80 % ou plus"
      body: "De ton max, c'est ce que l'ACSM retient pour la force. Les charges lourdes ont donné un max plus haut."
    pt:
      title: "80% ou mais"
      body: "Do teu máximo é o que o ACSM indica para força. Cargas mais pesadas deram um máximo maior."
    tr:
      title: "%80 ya da fazla"
      body: "ACSM güç için maksimumun bu kadarını öneriyor. Daha ağır yükler daha yüksek maksimum verdi."

  - key: licht-werkt-ook
    kind: myth
    en:
      title: "Light weights"
      body: "Myth: light weights don't build muscle. Taken to failure, loads under 60% grew muscle like heavier ones."
    nl:
      title: "Lichte gewichten"
      body: "Mythe: met lichte gewichten bouw je geen spier. Tot falen gaven ladingen onder 60% evenveel groei als zwaardere."
    de:
      title: "Leichte Gewichte"
      body: "Mythos: Leichte Gewichte bauen keine Muskeln. Bis zum Versagen wuchsen Muskeln unter 60 % wie mit schwereren."
    es:
      title: "Pesos ligeros"
      body: "Mito: los pesos ligeros no dan músculo. Hasta el fallo, cargas bajo el 60 % dieron el mismo crecimiento."
    fr:
      title: "Charges légères"
      body: "Mythe : léger, ça ne fait pas de muscle. Jusqu'à l'échec, sous 60 % la croissance était la même."
    pt:
      title: "Pesos leves"
      body: "Mito: pesos leves não dão músculo. Até à falha, cargas abaixo de 60% deram o mesmo crescimento."
    tr:
      title: "Hafif ağırlık"
      body: "Efsane: hafif ağırlık kas yapmaz. Tükenişe kadar %60'ın altındaki yükler ağırlar kadar büyüttü."

  - key: licht-maar-zwaar
    kind: fact
    en:
      title: "12 of 30"
      body: "Stopping at 12 with a weight you could lift 30 times leaves 18 in the tank. Light works if the last reps are hard."
    nl:
      title: "12 van de 30"
      body: "Stop je bij 12 met een gewicht dat je 30 keer kunt tillen, dan hou je er 18 over. Licht werkt als de laatste zwaar zijn."
    de:
      title: "12 von 30"
      body: "Stoppst du bei 12 mit einem Gewicht für 30, bleiben 18 übrig. Leicht klappt, wenn die letzten hart sind."
    es:
      title: "12 de 30"
      body: "Parar en 12 con un peso que moverías 30 veces deja 18 en reserva. Lo ligero sirve si las últimas cuestan."
    fr:
      title: "12 sur 30"
      body: "T'arrêter à 12 avec une charge pour 30 en laisse 18 en réserve. Le léger marche si les dernières sont dures."
    pt:
      title: "12 de 30"
      body: "Parar nas 12 com um peso para 30 deixa 18 de reserva. O leve resulta se as últimas custarem."
    tr:
      title: "30'da 12"
      body: "30 kez kaldırabileceğin ağırlıkla 12'de durursan 18 tekrar kalır. Son tekrarlar zorsa hafif de işe yarar."

  - key: reps-over-12-schatten
    kind: fact
    en:
      title: "Past 12 reps"
      body: "People got worse at guessing how many reps they had left. On long sets, count honestly."
    nl:
      title: "Boven 12 herhalingen"
      body: "Mensen schatten slechter in hoeveel ze er nog over hebben. Tel bij lange sets eerlijk."
    de:
      title: "Über 12 Wdh."
      body: "Menschen schätzten schlechter, wie viele noch gehen. Bei langen Sätzen ehrlich zählen."
    es:
      title: "Más de 12"
      body: "La gente calcula peor cuántas repeticiones le quedan. En series largas, cuenta con sinceridad."
    fr:
      title: "Au-delà de 12 reps"
      body: "On estime moins bien ce qu'il reste en réserve. Sur les séries longues, compte honnêtement."
    pt:
      title: "Mais de 12"
      body: "As pessoas estimam pior quantas repetições faltam. Em séries longas, conta com honestidade."
    tr:
      title: "12 tekrarın üstü"
      body: "İnsanlar kaç tekrar kaldığını daha kötü tahmin etti. Uzun setlerde dürüstçe say."

  - key: hoge-reps-gewrichten
    kind: fact
    en:
      title: "High reps"
      body: "Heavy weights hurt your joints on some lifts? High reps are a fine option there. Just make the set hard."
    nl:
      title: "Veel herhalingen"
      body: "Doen zware gewichten bij sommige oefeningen pijn aan je gewrichten? Dan zijn veel herhalingen prima. Wel zwaar maken."
    de:
      title: "Viele Wdh."
      body: "Schwere Gewichte tun bei manchen Übungen den Gelenken weh? Dann sind viele Wdh. eine gute Wahl. Satz trotzdem hart."
    es:
      title: "Muchas repeticiones"
      body: "¿El peso alto molesta a tus articulaciones en algún ejercicio? Ahí van bien muchas repeticiones, pero duras."
    fr:
      title: "Beaucoup de reps"
      body: "Le lourd fait mal aux articulations sur certains exos ? Les longues séries vont bien là. Garde-les dures."
    pt:
      title: "Muitas repetições"
      body: "Peso alto dói nas articulações nalguns exercícios? Aí muitas repetições servem. Mas que custem."
    tr:
      title: "Çok tekrar"
      body: "Bazı hareketlerde ağır yük eklemlerini ağrıtıyorsa orada çok tekrar iyi seçenek. Seti yine zor yap."

  - key: beginnen-8-12
    kind: fact
    en:
      title: "Where to start"
      body: "A weight you can lift 8 to 12 times is one place to start. That was the 2009 ACSM advice. Other plans work too."
    nl:
      title: "Waar beginnen"
      body: "Een gewicht dat je 8 tot 12 keer kunt tillen is één startpunt, het ACSM-advies van 2009. Andere schema's werken ook."
    de:
      title: "Wo anfangen"
      body: "Ein Gewicht für 8 bis 12 Wiederholungen ist ein Startpunkt, so der ACSM-Rat von 2009. Andere Pläne gehen auch."
    es:
      title: "Dónde empezar"
      body: "Un peso que mueves 8 a 12 veces es un punto de partida, el consejo del ACSM de 2009. Otros planes también sirven."
    fr:
      title: "Par où commencer"
      body: "Une charge pour 8 à 12 reps est un point de départ, le conseil ACSM de 2009. D'autres plans marchent aussi."
    pt:
      title: "Por onde começar"
      body: "Um peso que levantas 8 a 12 vezes é um ponto de partida, o conselho do ACSM de 2009. Outros planos servem."
    tr:
      title: "Nereden başla"
      body: "8-12 kez kaldırabildiğin bir ağırlık bir başlangıç. 2009 ACSM önerisi buydu. Başka planlar da işe yarar."

  - key: regel-2009
    kind: fact
    en:
      title: "2 to 10%"
      body: "Add that after beating your target by 1 or 2 reps, two sessions running. The 2009 ACSM rule, not repeated in 2026."
    nl:
      title: "2 tot 10%"
      body: "Zoveel erbij na twee trainingen op rij 1 of 2 herhalingen boven je doel. De ACSM-regel van 2009, in 2026 niet herhaald."
    de:
      title: "2 bis 10 %"
      body: "So viel mehr nach zwei Einheiten mit 1 bis 2 Wdh. über Ziel. ACSM-Regel von 2009, 2026 nicht wiederholt."
    es:
      title: "2 a 10 %"
      body: "Suma eso tras superar tu meta en 1 o 2 repeticiones dos sesiones seguidas. Regla del ACSM de 2009, no de 2026."
    fr:
      title: "2 à 10 %"
      body: "Ajoute ça après 1 ou 2 reps au-dessus de ta cible deux séances de suite. Règle ACSM 2009, absente en 2026."
    pt:
      title: "2 a 10%"
      body: "Junta isso depois de passares a meta em 1 ou 2 repetições dois treinos seguidos. Regra do ACSM de 2009, não de 2026."
    tr:
      title: "%2-10"
      body: "İki antrenman üst üste hedefi 1-2 tekrar aşınca bu kadar ekle. 2009 ACSM kuralı, 2026'da tekrarlanmadı."

  - key: uithouding-onduidelijk
    kind: myth
    en:
      title: "Endurance"
      body: "Myth: light, high reps build endurance best. Training helps endurance, but the data can't show light sets do it better."
    nl:
      title: "Uithouding"
      body: "Mythe: licht met veel herhalingen bouwt het best uithouding. Training helpt, maar de data tonen niet dat licht beter is."
    de:
      title: "Ausdauer"
      body: "Mythos: Leicht mit vielen Wdh. baut am besten Ausdauer. Training hilft, dass leicht besser ist, ist nicht belegt."
    es:
      title: "Resistencia"
      body: "Mito: ligero y muchas repeticiones es lo mejor para resistencia. Entrenar ayuda, pero no hay datos de que sea mejor."
    fr:
      title: "Endurance"
      body: "Mythe : léger avec beaucoup de reps, le top pour l'endurance. L'entraînement aide, mais léger n'est pas prouvé meilleur."
    pt:
      title: "Resistência"
      body: "Mito: leve e muitas repetições é o melhor para resistência. Treinar ajuda, mas não está provado que leve seja melhor."
    tr:
      title: "Dayanıklılık"
      body: "Efsane: hafif ve çok tekrar dayanıklılığı en iyi geliştirir. Antrenman yardım eder ama hafifin üstünlüğü gösterilmedi."

  - key: specificiteit
    kind: fact
    en:
      title: "Your goal"
      body: "Your body adapts to what you train. Pick weight and reps that fit what you want to get better at."
    nl:
      title: "Je doel"
      body: "Je lichaam past zich aan op wat je traint. Kies gewicht en herhalingen die passen bij waar je beter in wilt worden."
    de:
      title: "Dein Ziel"
      body: "Dein Körper passt sich an das an, was du trainierst. Wähl Gewicht und Wdh. passend zu dem, was besser werden soll."
    es:
      title: "Tu meta"
      body: "Tu cuerpo se adapta a lo que entrenas. Elige peso y repeticiones según lo que quieras mejorar."
    fr:
      title: "Ton objectif"
      body: "Ton corps s'adapte à ce que tu entraînes. Choisis charge et reps selon ce que tu veux améliorer."
    pt:
      title: "O teu objetivo"
      body: "O corpo adapta-se ao que treinas. Escolhe peso e repetições de acordo com o que queres melhorar."
    tr:
      title: "Hedefin"
      body: "Vücudun çalıştığın şeye uyum sağlar. Gelişmek istediğin şeye uyan ağırlık ve tekrarı seç."

article: caffeine
emoji: "☕"
tips:
  - key: dosis-per-kilo
    kind: fact
    en:
      title: "3 to 6 mg"
      body: "Caffeine per kg of bodyweight, about an hour before training. 2 mg per kg may already work."
    nl:
      title: "3 tot 6 mg"
      body: "Cafeïne per kilo lichaamsgewicht, zo'n uur voor de training. 2 mg per kilo werkt misschien al."
    de:
      title: "3 bis 6 mg"
      body: "Koffein pro kg Körpergewicht, etwa eine Stunde vor dem Training. 2 mg pro kg wirken womöglich schon."
    es:
      title: "3 a 6 mg"
      body: "De cafeína por kg de peso, una hora antes de entrenar. Con 2 mg por kg quizá ya funcione."
    fr:
      title: "3 à 6 mg"
      body: "De caféine par kg, environ une heure avant la séance. 2 mg par kg suffisent peut-être déjà."
    pt:
      title: "3 a 6 mg"
      body: "De cafeína por kg de peso, cerca de uma hora antes do treino. 2 mg por kg talvez já funcionem."
    tr:
      title: "3-6 mg"
      body: "Kilo başına kafein, antrenmandan yaklaşık bir saat önce. Kilo başına 2 mg bile işe yarayabilir."

  - key: grens-per-keer
    kind: fact
    en:
      title: "200 mg"
      body: "Is the most to take at once, whatever you weigh. Up to 400 mg a day is fine for healthy adults."
    nl:
      title: "200 mg"
      body: "Is het maximum per keer, wat je ook weegt. Tot 400 mg per dag is prima voor gezonde volwassenen."
    de:
      title: "200 mg"
      body: "Sind das Maximum pro Dosis, egal was du wiegst. Bis 400 mg am Tag sind für gesunde Erwachsene okay."
    es:
      title: "200 mg"
      body: "Es lo máximo de una vez, pesas lo que pesas. Hasta 400 mg al día no preocupa en adultos sanos."
    fr:
      title: "200 mg"
      body: "C'est le maximum par prise, quel que soit ton poids. Jusqu'à 400 mg par jour, ça va pour un adulte sain."
    pt:
      title: "200 mg"
      body: "É o máximo de uma vez, seja qual for o teu peso. Até 400 mg por dia não preocupa em adultos saudáveis."
    tr:
      title: "200 mg"
      body: "Kilon ne olursa olsun tek seferde en fazla bu kadar. Sağlıklı yetişkinde günde 400 mg'a kadar sorun yok."

  - key: slaap
    kind: fact
    en:
      title: "45 minutes"
      body: "Of sleep lost to caffeine, across 24 studies. Have your pre-workout at least 13.2 hours before bed."
    nl:
      title: "45 minuten"
      body: "Zoveel slaap kostte cafeïne, over 24 studies. Neem je pre-workout minstens 13,2 uur voor bedtijd."
    de:
      title: "45 Minuten"
      body: "Schlaf kostete Koffein in 24 Studien. Nimm deinen Pre-Workout mindestens 13,2 Stunden vor dem Schlafen."
    es:
      title: "45 minutos"
      body: "De sueño quitó la cafeína en 24 estudios. Toma tu pre-entreno al menos 13,2 horas antes de dormir."
    fr:
      title: "45 minutes"
      body: "De sommeil perdues à cause de la caféine, sur 24 études. Prends ton pré-workout 13,2 h avant le coucher."
    pt:
      title: "45 minutos"
      body: "De sono perdidos com cafeína, em 24 estudos. Toma o pré-treino pelo menos 13,2 horas antes de dormir."
    tr:
      title: "45 dakika"
      body: "24 çalışmada kafein bu kadar uykuya mal oldu. Pre-workout'u yatmadan en az 13,2 saat önce al."

  - key: halfwaardetijd
    kind: fact
    en:
      title: "4 to 6 hours"
      body: "Half the caffeine is gone by then. 200 mg at 6 pm still leaves about 100 mg at 11 pm."
    nl:
      title: "4 tot 6 uur"
      body: "Dan is de helft van de cafeïne weg. 200 mg om 18 uur is om 23 uur nog zo'n 100 mg."
    de:
      title: "4 bis 6 Stunden"
      body: "Dann ist die Hälfte des Koffeins weg. 200 mg um 18 Uhr sind um 23 Uhr noch etwa 100 mg."
    es:
      title: "4 a 6 horas"
      body: "Es lo que tarda en irse la mitad de la cafeína. 200 mg a las 18:00 son unos 100 mg a las 23:00."
    fr:
      title: "4 à 6 heures"
      body: "C'est le temps pour éliminer la moitié de la caféine. 200 mg à 18 h, il en reste 100 mg à 23 h."
    pt:
      title: "4 a 6 horas"
      body: "É o tempo para sair metade da cafeína. 200 mg às 18h ainda são cerca de 100 mg às 23h."
    tr:
      title: "4-6 saat"
      body: "Kafeinin yarısı bu sürede gider. 18:00'de 200 mg, 23:00'te hâlâ yaklaşık 100 mg demek."

  - key: uitdrogen
    kind: myth
    en:
      title: "Dehydration"
      body: "Myth: caffeine dries you out. At training doses it doesn't meaningfully change how hydrated you are."
    nl:
      title: "Uitdroging"
      body: "Mythe: cafeïne droogt je uit. Bij doses voor training verandert het je vochtbalans nauwelijks."
    de:
      title: "Austrocknung"
      body: "Mythos: Koffein trocknet dich aus. In Trainingsdosen ändert es deinen Flüssigkeitshaushalt kaum."
    es:
      title: "Deshidratación"
      body: "Mito: la cafeína te deshidrata. A dosis de entreno apenas cambia tu nivel de hidratación."
    fr:
      title: "Déshydratation"
      body: "Mythe : la caféine déshydrate. Aux doses utilisées pour le sport, elle change à peine ton hydratation."
    pt:
      title: "Desidratação"
      body: "Mito: a cafeína desidrata. Nas doses usadas no treino, mal muda a tua hidratação."
    tr:
      title: "Susuzluk"
      body: "Efsane: kafein susuz bırakır. Antrenman dozlarında sıvı dengeni pek değiştirmez."

  - key: meer-is-beter
    kind: myth
    en:
      title: "9 mg per kg"
      body: "Myth: more caffeine works better. Doses this high bring lots of side effects and aren't needed."
    nl:
      title: "9 mg per kilo"
      body: "Mythe: meer cafeïne werkt beter. Zulke hoge doses geven veel bijwerkingen en zijn niet nodig."
    de:
      title: "9 mg pro kg"
      body: "Mythos: Mehr Koffein wirkt besser. So hohe Dosen bringen viele Nebenwirkungen und sind unnötig."
    es:
      title: "9 mg por kg"
      body: "Mito: más cafeína funciona mejor. Dosis tan altas dan muchos efectos secundarios y no hacen falta."
    fr:
      title: "9 mg par kg"
      body: "Mythe : plus de caféine, plus d'effet. Des doses si hautes donnent plein d'effets secondaires, pour rien."
    pt:
      title: "9 mg por kg"
      body: "Mito: mais cafeína funciona melhor. Doses tão altas trazem muitos efeitos secundários e não são precisas."
    tr:
      title: "Kilo başına 9 mg"
      body: "Efsane: daha çok kafein daha iyi çalışır. Bu kadar yüksek doz çok yan etki yapar ve gereksizdir."

  - key: vetverbranding
    kind: myth
    en:
      title: "Fat burning"
      body: "Myth: caffeine works by burning more fat. Low doses help without changing fat burning. It works on your brain."
    nl:
      title: "Vetverbranding"
      body: "Mythe: cafeïne werkt doordat je meer vet verbrandt. Lage doses helpen zonder dat. Het werkt op je brein."
    de:
      title: "Fettverbrennung"
      body: "Mythos: Koffein wirkt über mehr Fettverbrennung. Niedrige Dosen helfen auch ohne. Es wirkt aufs Gehirn."
    es:
      title: "Quemar grasa"
      body: "Mito: la cafeína funciona quemando más grasa. Dosis bajas ayudan sin cambiar eso. Actúa en tu cerebro."
    fr:
      title: "Brûler du gras"
      body: "Mythe : la caféine agit en brûlant plus de gras. Les petites doses aident sans ça. Elle agit sur le cerveau."
    pt:
      title: "Queimar gordura"
      body: "Mito: a cafeína funciona por queimar mais gordura. Doses baixas ajudam sem isso. Atua no cérebro."
    tr:
      title: "Yağ yakımı"
      body: "Efsane: kafein daha çok yağ yaktırarak çalışır. Düşük doz yağ yakımını değiştirmeden işe yarar. Beyne etki eder."

  - key: vrouwen
    kind: fact
    en:
      title: "8 studies"
      body: "In women, caffeine improved strength and muscular endurance about as much as in the men studied."
    nl:
      title: "8 studies"
      body: "Bij vrouwen verbeterde cafeïne kracht en spieruithouding ongeveer even veel als bij mannen."
    de:
      title: "8 Studien"
      body: "Bei Frauen steigerte Koffein Kraft und Kraftausdauer etwa so stark wie bei Männern."
    es:
      title: "8 estudios"
      body: "En mujeres, la cafeína mejoró la fuerza y la resistencia muscular más o menos igual que en hombres."
    fr:
      title: "8 études"
      body: "Chez les femmes, la caféine a amélioré force et endurance musculaire à peu près autant que chez les hommes."
    pt:
      title: "8 estudos"
      body: "Em mulheres, a cafeína melhorou a força e a resistência muscular quase tanto como em homens."
    tr:
      title: "8 çalışma"
      body: "Kadınlarda kafein gücü ve kas dayanıklılığını erkeklerdeki kadar artırdı."

  - key: koffie-verschilt
    kind: fact
    en:
      title: "8 to 9 times"
      body: "More caffeine was measured in some cups than in others from similar shops. Count your morning coffee too."
    nl:
      title: "8 tot 9 keer"
      body: "Meer cafeïne zat er in sommige bekers dan in andere van vergelijkbare zaken. Tel je ochtendkoffie ook mee."
    de:
      title: "8- bis 9-mal"
      body: "Mehr Koffein steckte in manchen Bechern als in anderen aus ähnlichen Läden. Zähl deinen Morgenkaffee mit."
    es:
      title: "8 a 9 veces"
      body: "Más cafeína tenían algunos vasos que otros de cafeterías parecidas. Cuenta también tu café de la mañana."
    fr:
      title: "8 à 9 fois"
      body: "Plus de caféine dans certaines tasses que dans d'autres, venant de cafés similaires. Compte ton café du matin."
    pt:
      title: "8 a 9 vezes"
      body: "Mais cafeína tinham alguns copos do que outros de cafés parecidos. Conta também o café da manhã."
    tr:
      title: "8-9 kat"
      body: "Benzer kafelerden bazı bardaklarda diğerlerinden bu kadar fazla kafein ölçüldü. Sabah kahveni de say."

  - key: zwanger
    kind: fact
    en:
      title: "Pregnant"
      body: "Or breastfeeding? EFSA says up to 200 mg a day from all sources, coffee and pre-workout together."
    nl:
      title: "Zwanger"
      body: "Of geef je borstvoeding? EFSA zegt tot 200 mg per dag uit alles samen, koffie en pre-workout bij elkaar."
    de:
      title: "Schwanger"
      body: "Oder stillst du? Die EFSA sagt bis 200 mg am Tag aus allen Quellen, Kaffee und Pre-Workout zusammen."
    es:
      title: "Embarazada"
      body: "¿O das el pecho? La EFSA dice hasta 200 mg al día de todo, café y pre-entreno juntos."
    fr:
      title: "Enceinte"
      body: "Ou tu allaites ? L'EFSA dit jusqu'à 200 mg par jour toutes sources comprises, café et pré-workout ensemble."
    pt:
      title: "Grávida"
      body: "Ou a amamentar? A EFSA diz até 200 mg por dia de todas as fontes, café e pré-treino juntos."
    tr:
      title: "Hamile"
      body: "Ya da emziriyor musun? EFSA tüm kaynaklardan günde 200 mg'a kadar diyor, kahve ve pre-workout dahil."

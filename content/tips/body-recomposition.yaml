article: body-recomposition
emoji: "⚖️"
tips:
  - key: vier-weken
    kind: fact
    en:
      title: "4 weeks"
      body: "Overweight young men ate 40% under their needs and trained 6 days a week. They gained 1.2 kg lean, lost 4.8 kg fat."
    nl:
      title: "4 weken"
      body: "Jonge mannen met overgewicht, 40% tekort, 6 dagen training: 1,2 kilo vetvrije massa erbij, 4,8 kilo vet eraf."
    de:
      title: "4 Wochen"
      body: "Junge Männer mit Übergewicht, 40 % Defizit, 6 Trainingstage: 1,2 kg fettfreie Masse mehr, 4,8 kg Fett weniger."
    es:
      title: "4 semanas"
      body: "Jóvenes con sobrepeso, 40 % de déficit, 6 días de entreno: 1,2 kg de masa magra más y 4,8 kg de grasa menos."
    fr:
      title: "4 semaines"
      body: "Jeunes hommes en surpoids, 40 % de déficit, 6 séances par semaine : +1,2 kg de masse maigre, -4,8 kg de gras."
    pt:
      title: "4 semanas"
      body: "Jovens com excesso de peso, 40% de défice, 6 treinos semanais: mais 1,2 kg de massa magra, menos 4,8 kg de gordura."
    tr:
      title: "4 hafta"
      body: "Kilolu genç erkekler, %40 açık, haftada 6 antrenman: 1,2 kg yağsız kütle kazandı, 4,8 kg yağ kaybetti."

  - key: eiwit-verschil
    kind: fact
    en:
      title: "2.4 g"
      body: "Protein per kg in a deficit gained men 1.2 kg lean mass. On 1.2 g they only kept what they had."
    nl:
      title: "2,4 gram"
      body: "Eiwit per kilo in een tekort leverde mannen 1,2 kilo vetvrije massa op. Met 1,2 gram hielden ze alleen wat ze hadden."
    de:
      title: "2,4 g"
      body: "Protein pro kg im Defizit brachte Männern 1,2 kg fettfreie Masse. Mit 1,2 g hielten sie nur, was sie hatten."
    es:
      title: "2,4 g"
      body: "De proteína por kg en déficit dieron 1,2 kg de masa magra. Con 1,2 g solo mantuvieron lo que tenían."
    fr:
      title: "2,4 g"
      body: "De protéines par kg en déficit : 1,2 kg de masse maigre gagnée. Avec 1,2 g, ils ont juste gardé l'acquis."
    pt:
      title: "2,4 g"
      body: "De proteína por kg em défice deram 1,2 kg de massa magra. Com 1,2 g só mantiveram o que tinham."
    tr:
      title: "2,4 g"
      body: "Açıkta kilo başına bu kadar protein erkeklere 1,2 kg yağsız kütle kazandırdı. 1,2 g ile sadece korudular."

  - key: vetvrij-is-geen-spier
    kind: fact
    en:
      title: "Lean mass"
      body: "Is everything that isn't fat. Over a few weeks, a gain can be glycogen and water rather than new muscle."
    nl:
      title: "Vetvrije massa"
      body: "Is alles wat geen vet is. Over een paar weken kan winst ook glycogeen en water zijn, geen nieuwe spier."
    de:
      title: "Fettfreie Masse"
      body: "Ist alles, was kein Fett ist. Über ein paar Wochen kann ein Plus auch Glykogen und Wasser sein statt Muskel."
    es:
      title: "Masa magra"
      body: "Es todo lo que no es grasa. En pocas semanas, una subida puede ser glucógeno y agua, no músculo nuevo."
    fr:
      title: "Masse maigre"
      body: "C'est tout ce qui n'est pas du gras. Sur quelques semaines, un gain peut être du glycogène et de l'eau."
    pt:
      title: "Massa magra"
      body: "É tudo o que não é gordura. Em poucas semanas, um ganho pode ser glicogénio e água e não músculo novo."
    tr:
      title: "Yağsız kütle"
      body: "Yağ olmayan her şeydir. Birkaç haftalık artış yeni kas değil, glikojen ve su olabilir."

  - key: grens-500
    kind: fact
    en:
      title: "500 kcal"
      body: "A deficit of about that much a day stopped lean mass gains in lifters. Stay under it to keep yours."
    nl:
      title: "500 kcal"
      body: "Bij een tekort van ongeveer zoveel per dag stopte de spierwinst bij krachtsporters. Blijf eronder."
    de:
      title: "500 kcal"
      body: "Ab etwa so viel Defizit am Tag stoppte bei Kraftsportlern der Zuwachs an fettfreier Masse. Bleib darunter."
    es:
      title: "500 kcal"
      body: "Con un déficit de unas tantas al día, los que entrenaban fuerza dejaron de ganar masa magra. Quédate por debajo."
    fr:
      title: "500 kcal"
      body: "Avec environ ce déficit par jour, les pratiquants de muscu ne gagnaient plus de masse maigre. Reste en dessous."
    pt:
      title: "500 kcal"
      body: "Com um défice de cerca disto por dia, quem treinava força deixou de ganhar massa magra. Fica abaixo."
    tr:
      title: "500 kcal"
      body: "Günde yaklaşık bu kadar açıkta ağırlık çalışanlarda yağsız kütle artışı durdu. Bunun altında kal."

  - key: kracht-in-tekort
    kind: myth
    en:
      title: "Stronger in a deficit"
      body: "Myth: you can't get stronger in a deficit. In trials, strength rose about as much as without one."
    nl:
      title: "Sterker in een tekort"
      body: "Mythe: in een tekort word je niet sterker. In studies steeg de kracht ongeveer even hard als zonder tekort."
    de:
      title: "Stärker im Defizit"
      body: "Mythos: Im Defizit wirst du nicht stärker. In Studien stieg die Kraft etwa so stark wie ohne Defizit."
    es:
      title: "Fuerza en déficit"
      body: "Mito: en déficit no ganas fuerza. En los estudios, la fuerza subió casi igual que sin déficit."
    fr:
      title: "Plus fort en déficit"
      body: "Mythe : en déficit, on ne progresse pas en force. Dans les études, la force a monté presque autant."
    pt:
      title: "Força em défice"
      body: "Mito: em défice não ganhas força. Nos estudos, a força subiu quase tanto como sem défice."
    tr:
      title: "Açıkta güçlenmek"
      body: "Efsane: kalori açığında güçlenemezsin. Çalışmalarda güç, açık olmadan neredeyse aynı arttı."

  - key: wie-het-lukt
    kind: fact
    en:
      title: "New to lifting"
      body: "Or carrying a lot of extra weight? Then building muscle in a deficit may be more likely for you."
    nl:
      title: "Nieuw met trainen"
      body: "Of veel extra gewicht? Dan is spier opbouwen in een tekort voor jou waarschijnlijk makkelijker."
    de:
      title: "Neu im Training"
      body: "Oder viel Übergewicht? Dann ist Muskelaufbau im Defizit für dich eher drin."
    es:
      title: "Nuevo en el gym"
      body: "¿O con bastante peso de más? Entonces ganar músculo en déficit es más probable para ti."
    fr:
      title: "Débutant"
      body: "Ou beaucoup de poids en trop ? Alors prendre du muscle en déficit est plus probable pour toi."
    pt:
      title: "Novo no treino"
      body: "Ou com bastante peso a mais? Então ganhar músculo em défice é mais provável para ti."
    tr:
      title: "Yeni başlayan"
      body: "Ya da fazla kilon çoksa? O zaman açıktayken kas yapma ihtimalin daha yüksek."

  - key: na-een-pauze
    kind: fact
    en:
      title: "After a break"
      body: "Top athletes back from an off-season or injury have lost fat and gained fat-free mass at once."
    nl:
      title: "Na een pauze"
      body: "Topsporters die terugkwamen na een rustperiode of blessure verloren vet en wonnen tegelijk vetvrije massa."
    de:
      title: "Nach einer Pause"
      body: "Spitzensportler nach Saisonpause oder Verletzung verloren Fett und bauten zugleich fettfreie Masse auf."
    es:
      title: "Tras una pausa"
      body: "Atletas de élite que volvían de un parón o lesión perdieron grasa y ganaron masa magra a la vez."
    fr:
      title: "Après une pause"
      body: "Des athlètes de haut niveau de retour de pause ou de blessure ont perdu du gras et pris de la masse maigre."
    pt:
      title: "Depois de uma pausa"
      body: "Atletas de topo a voltar de uma pausa ou lesão perderam gordura e ganharam massa magra ao mesmo tempo."
    tr:
      title: "Aradan sonra"
      body: "Sezon arası ya da sakatlık sonrası dönen elit sporcular aynı anda yağ kaybedip yağsız kütle kazandı."

  - key: alleen-beginners
    kind: myth
    en:
      title: "Only beginners"
      body: "Myth: recomp only works for beginners. Research shows it in trained lifters too. It gets harder the leaner you are."
    nl:
      title: "Alleen beginners"
      body: "Mythe: recomp werkt alleen bij beginners. Ook bij getrainde sporters, al wordt het lastiger hoe slanker je bent."
    de:
      title: "Nur Anfänger"
      body: "Mythos: Recomp klappt nur bei Anfängern. Auch bei Trainierten, nur wird es schwerer, je schlanker du bist."
    es:
      title: "Solo principiantes"
      body: "Mito: la recomposición solo funciona en novatos. También en entrenados, aunque cuesta más cuanto más magro estás."
    fr:
      title: "Que les débutants"
      body: "Mythe : la recompo ne marche que chez les débutants. Aussi chez les entraînés, mais c'est dur quand on est sec."
    pt:
      title: "Só iniciantes"
      body: "Mito: a recomposição só funciona em iniciantes. Também em treinados, mas fica difícil quanto mais magro estás."
    tr:
      title: "Sadece yeniler"
      body: "Efsane: rekompozisyon sadece yenilerde işe yarar. Deneyimlilerde de olur, ama zayıfladıkça zorlaşır."

  - key: beste-route
    kind: myth
    en:
      title: "Best route"
      body: "Myth: recomp is the best way to build muscle. If muscle is your main goal, a surplus is probably better."
    nl:
      title: "Beste route"
      body: "Mythe: recomp is de beste manier om spier te bouwen. Is spier je doel, dan werkt een overschot waarschijnlijk beter."
    de:
      title: "Bester Weg"
      body: "Mythos: Recomp ist der beste Weg zu Muskeln. Ist Muskel dein Hauptziel, ist ein Überschuss wohl besser."
    es:
      title: "Mejor camino"
      body: "Mito: la recomposición es la mejor forma de ganar músculo. Si es tu meta principal, un superávit es mejor."
    fr:
      title: "Meilleure voie"
      body: "Mythe : la recompo est le meilleur moyen de prendre du muscle. Si c'est ton but, un surplus vaut sans doute mieux."
    pt:
      title: "Melhor caminho"
      body: "Mito: a recomposição é a melhor forma de ganhar músculo. Se é o teu objetivo, um excedente é provavelmente melhor."
    tr:
      title: "En iyi yol"
      body: "Efsane: kas yapmanın en iyi yolu rekompozisyondur. Asıl hedefin kassa, kalori fazlası muhtemelen daha iyi."

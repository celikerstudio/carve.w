article: citrulline
emoji: "🍉"
tips:
  - key: wat-het-doet
    kind: fact
    en:
      title: "Nitric oxide"
      body: "Your body turns citrulline into arginine, which makes nitric oxide. That's why it's sold for blood flow."
    nl:
      title: "Stikstofmonoxide"
      body: "Je lichaam maakt van citrulline arginine, en daarvan stikstofmonoxide. Daarom wordt het verkocht voor doorbloeding."
    de:
      title: "Stickstoffmonoxid"
      body: "Dein Körper macht aus Citrullin Arginin und daraus Stickstoffmonoxid. Daher wird es für die Durchblutung verkauft."
    es:
      title: "Óxido nítrico"
      body: "Tu cuerpo convierte la citrulina en arginina, que produce óxido nítrico. Por eso se vende para el flujo sanguíneo."
    fr:
      title: "Monoxyde d'azote"
      body: "Ton corps change la citrulline en arginine, qui produit du monoxyde d'azote. D'où sa vente pour la circulation."
    pt:
      title: "Óxido nítrico"
      body: "O corpo transforma a citrulina em arginina, que produz óxido nítrico. Por isso é vendida para a circulação."
    tr:
      title: "Nitrik oksit"
      body: "Vücudun sitrülini arjinine, onu da nitrik okside çevirir. Bu yüzden kan akışı için satılır."

  - key: pomp
    kind: myth
    en:
      title: "Bigger pump"
      body: "Myth: citrulline gives you a bigger pump. No lifting study measured pumps, and muscle swelling didn't change."
    nl:
      title: "Grotere pump"
      body: "Mythe: citrulline geeft een grotere pump. Geen enkele studie mat de pump, en spierzwelling veranderde niet."
    de:
      title: "Größerer Pump"
      body: "Mythos: Citrullin gibt mehr Pump. Keine Studie hat den Pump gemessen, und die Muskelschwellung blieb gleich."
    es:
      title: "Más bombeo"
      body: "Mito: la citrulina da más bombeo. Ningún estudio lo midió, y la hinchazón muscular no cambió."
    fr:
      title: "Plus de congestion"
      body: "Mythe : la citrulline donne plus de pump. Aucune étude ne l'a mesuré, et le gonflement musculaire n'a pas bougé."
    pt:
      title: "Mais pump"
      body: "Mito: a citrulina dá mais pump. Nenhum estudo o mediu, e o inchaço muscular não mudou."
    tr:
      title: "Daha çok pump"
      body: "Efsane: sitrülin daha çok pump verir. Hiçbir çalışma pump ölçmedi, kas şişmesi de değişmedi."

  - key: drie-herhalingen
    kind: fact
    en:
      title: "3 more reps"
      body: "From 6 to 8 g of citrulline malate before lifting, in a meta-analysis. That's about 6%, a small effect."
    nl:
      title: "3 herhalingen extra"
      body: "Met 6 tot 8 gram citrulline-malaat voor het trainen, in een meta-analyse. Zo'n 6%, een klein effect."
    de:
      title: "3 Wiederholungen mehr"
      body: "Mit 6 bis 8 g Citrullinmalat vor dem Training, laut einer Metaanalyse. Etwa 6 %, ein kleiner Effekt."
    es:
      title: "3 repeticiones más"
      body: "Con 6 a 8 g de citrulina malato antes de entrenar, en un metaanálisis. Un 6 %, un efecto pequeño."
    fr:
      title: "3 reps de plus"
      body: "Avec 6 à 8 g de citrulline malate avant la séance, selon une méta-analyse. Environ 6 %, un petit effet."
    pt:
      title: "3 repetições a mais"
      body: "Com 6 a 8 g de citrulina malato antes do treino, numa meta-análise. Cerca de 6%, um efeito pequeno."
    tr:
      title: "3 tekrar daha"
      body: "Bir meta-analizde antrenman öncesi 6-8 g sitrülin malat ile. Yaklaşık %6, küçük bir etki."

  - key: wisselende-studies
    kind: fact
    en:
      title: "Hit or miss"
      body: "In three studies, 8 g of citrulline malate gave more reps. Others with the same dose found nothing."
    nl:
      title: "Wisselend"
      body: "In drie studies gaf 8 gram citrulline-malaat meer herhalingen. Andere met dezelfde dosis vonden niets."
    de:
      title: "Mal so, mal so"
      body: "In drei Studien brachten 8 g Citrullinmalat mehr Wiederholungen. Andere mit gleicher Dosis fanden nichts."
    es:
      title: "A veces sí"
      body: "En tres estudios, 8 g de citrulina malato dieron más repeticiones. Otros con la misma dosis no vieron nada."
    fr:
      title: "Pas toujours"
      body: "Dans trois études, 8 g de citrulline malate ont donné plus de reps. D'autres, même dose, n'ont rien vu."
    pt:
      title: "Às vezes"
      body: "Em três estudos, 8 g de citrulina malato deram mais repetições. Outros com a mesma dose não viram nada."
    tr:
      title: "Bazen işe yarar"
      body: "Üç çalışmada 8 g sitrülin malat daha çok tekrar sağladı. Aynı dozla diğerleri fark bulmadı."

  - key: malaat-verhouding
    kind: fact
    en:
      title: "8 g"
      body: "Of citrulline malate isn't 8 g of citrulline. Products also differed from what makers claimed."
    nl:
      title: "8 gram"
      body: "Citrulline-malaat is geen 8 gram citrulline. En producten weken af van wat de maker beloofde."
    de:
      title: "8 g"
      body: "Citrullinmalat sind keine 8 g Citrullin. Produkte wichen zudem von den Herstellerangaben ab."
    es:
      title: "8 g"
      body: "De citrulina malato no son 8 g de citrulina. Y los productos no coincidían con lo que decía el fabricante."
    fr:
      title: "8 g"
      body: "De citrulline malate, ce n'est pas 8 g de citrulline. Et les produits différaient de l'étiquette."
    pt:
      title: "8 g"
      body: "De citrulina malato não são 8 g de citrulina. E os produtos não batiam com o que o fabricante dizia."
    tr:
      title: "8 g"
      body: "Sitrülin malat, 8 g sitrülin demek değil. Ürünler de üreticinin söylediğinden farklı çıktı."

  - key: boven-en-onderlichaam
    kind: fact
    en:
      title: "Upper body"
      body: "In the meta-analysis, citrulline did nothing significant for upper-body reps. Lower body was borderline."
    nl:
      title: "Bovenlichaam"
      body: "In de meta-analyse deed citrulline niets significants voor herhalingen bovenlichaam. Onderlichaam: twijfelgeval."
    de:
      title: "Oberkörper"
      body: "In der Metaanalyse brachte Citrullin für den Oberkörper nichts Signifikantes. Unterkörper: grenzwertig."
    es:
      title: "Tren superior"
      body: "En el metaanálisis, la citrulina no hizo nada significativo arriba. Abajo, el efecto fue dudoso."
    fr:
      title: "Haut du corps"
      body: "Dans la méta-analyse, rien de significatif pour le haut du corps. Pour le bas, c'était limite."
    pt:
      title: "Parte superior"
      body: "Na meta-análise, a citrulina não fez nada significativo na parte de cima. Em baixo, ficou no limite."
    tr:
      title: "Üst vücut"
      body: "Meta-analizde sitrülin üst vücut tekrarlarında anlamlı fark yaratmadı. Alt vücutta sınırdaydı."

  - key: citrulline-of-malaat
    kind: fact
    en:
      title: "The malate"
      body: "It's unclear whether the benefit comes from citrulline itself. What the malate does is largely unknown."
    nl:
      title: "Het malaat"
      body: "Het is onduidelijk of het effect van citrulline zelf komt. Wat het malaat doet is grotendeels onbekend."
    de:
      title: "Das Malat"
      body: "Ob der Effekt vom Citrullin selbst kommt, ist unklar. Was das Malat tut, ist kaum bekannt."
    es:
      title: "El malato"
      body: "No está claro si el efecto viene de la citrulina. Lo que hace el malato es casi desconocido."
    fr:
      title: "Le malate"
      body: "On ne sait pas si l'effet vient de la citrulline elle-même. Le rôle du malate reste flou."
    pt:
      title: "O malato"
      body: "Não se sabe se o efeito vem da citrulina. O que o malato faz é quase desconhecido."
    tr:
      title: "Malat"
      body: "Faydanın sitrülinin kendisinden gelip gelmediği belirsiz. Malatın ne yaptığı büyük ölçüde bilinmiyor."

  - key: geen-maanden
    kind: fact
    en:
      title: "Months"
      body: "Citrulline studies measured reps on the day. Whether you build more muscle over months wasn't tested."
    nl:
      title: "Maanden"
      body: "Studies naar citrulline maten herhalingen op de dag zelf. Of je over maanden meer spier opbouwt, is niet getest."
    de:
      title: "Monate"
      body: "Die Studien maßen Wiederholungen am selben Tag. Ob du über Monate mehr Muskeln aufbaust, wurde nicht getestet."
    es:
      title: "Meses"
      body: "Los estudios midieron repeticiones ese mismo día. Si ganas más músculo en meses no se probó."
    fr:
      title: "Des mois"
      body: "Les études ont mesuré les reps du jour. Si tu prends plus de muscle sur des mois, ça n'a pas été testé."
    pt:
      title: "Meses"
      body: "Os estudos mediram repetições no próprio dia. Se ganhas mais músculo ao longo de meses não foi testado."
    tr:
      title: "Aylar"
      body: "Çalışmalar aynı gündeki tekrarları ölçtü. Aylar içinde daha çok kas yapıp yapmadığın test edilmedi."

  - key: spierpijn
    kind: myth
    en:
      title: "72 hours"
      body: "Myth: citrulline means less soreness. In the study that checked, soreness after 10 sets of 10 was higher with it."
    nl:
      title: "72 uur"
      body: "Mythe: citrulline geeft minder spierpijn. In de studie die het testte was de spierpijn na 10 sets van 10 juist hoger."
    de:
      title: "72 Stunden"
      body: "Mythos: Citrullin heißt weniger Muskelkater. In der Studie dazu war er nach 10 Sätzen à 10 sogar stärker."
    es:
      title: "72 horas"
      body: "Mito: la citrulina reduce las agujetas. En el estudio que lo miró, tras 10 series de 10 hubo más."
    fr:
      title: "72 heures"
      body: "Mythe : la citrulline réduit les courbatures. Dans l'étude qui l'a testé, après 10 séries de 10, il y en avait plus."
    pt:
      title: "72 horas"
      body: "Mito: a citrulina reduz as dores. No estudo que o testou, após 10 séries de 10, houve mais dores."
    tr:
      title: "72 saat"
      body: "Efsane: sitrülin kas ağrısını azaltır. Bunu test eden çalışmada 10x10 sonrası ağrı daha fazlaydı."

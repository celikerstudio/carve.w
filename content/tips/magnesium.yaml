article: magnesium
emoji: "🥬"
tips:
  - key: inname-per-dag
    kind: fact
    en:
      title: "350 mg"
      body: "Magnesium a day for men, 300 mg for women: the EU's adequate intake. That's your total, food included."
    nl:
      title: "350 mg"
      body: "Magnesium per dag voor mannen, 300 mg voor vrouwen: de adequate inname in de EU. Dat is je totaal, eten inbegrepen."
    de:
      title: "350 mg"
      body: "Magnesium am Tag für Männer, 300 mg für Frauen: die EU-Schätzwerte. Das ist die Gesamtmenge, Essen inklusive."
    es:
      title: "350 mg"
      body: "De magnesio al día para hombres, 300 mg para mujeres: la ingesta adecuada en la UE. Es el total, con comida."
    fr:
      title: "350 mg"
      body: "De magnésium par jour pour les hommes, 300 mg pour les femmes : l'apport adéquat UE. C'est le total, repas compris."
    pt:
      title: "350 mg"
      body: "De magnésio por dia para homens, 300 mg para mulheres: a ingestão adequada na UE. É o total, com comida."
    tr:
      title: "350 mg"
      body: "AB'ye göre erkeklere günlük yeterli magnezyum, kadınlara 300 mg. Bu yiyecekler dahil toplam miktar."

  - key: limiet-niet-voor-eten
    kind: myth
    en:
      title: "250 mg"
      body: "Myth: 250 mg is your magnesium max. That limit is for supplements and added magnesium. Food doesn't count."
    nl:
      title: "250 mg"
      body: "Mythe: 250 mg is je maximum magnesium. Die grens geldt voor supplementen en toegevoegd magnesium. Eten telt niet mee."
    de:
      title: "250 mg"
      body: "Mythos: 250 mg sind dein Magnesium-Maximum. Das Limit gilt für Supplements und Zusätze. Essen zählt nicht."
    es:
      title: "250 mg"
      body: "Mito: 250 mg es tu máximo de magnesio. Ese límite es para suplementos y magnesio añadido. La comida no cuenta."
    fr:
      title: "250 mg"
      body: "Mythe : 250 mg, c'est ton max de magnésium. Cette limite vise compléments et ajouts. L'alimentation ne compte pas."
    pt:
      title: "250 mg"
      body: "Mito: 250 mg é o teu máximo de magnésio. Esse limite é para suplementos e magnésio adicionado. A comida não conta."
    tr:
      title: "250 mg"
      body: "Efsane: 250 mg magnezyum üst sınırın. Bu sınır takviyeler ve eklenen magnezyum için. Yiyecekler sayılmaz."

  - key: waarom-eten-niet-telt
    kind: fact
    en:
      title: "Food vs pills"
      body: "Magnesium in food is bound. Supplement salts dissolve, with a laxative effect that grows with the dose."
    nl:
      title: "Eten of pil"
      body: "Magnesium in eten zit gebonden. Zouten in supplementen lossen op, met een laxerend effect dat groeit met de dosis."
    de:
      title: "Essen oder Pille"
      body: "Magnesium im Essen ist gebunden. Salze in Supplements lösen sich, mit abführender Wirkung je nach Dosis."
    es:
      title: "Comida o pastilla"
      body: "El magnesio de la comida va ligado. Las sales de los suplementos se disuelven y son laxantes según la dosis."
    fr:
      title: "Assiette ou gélule"
      body: "Dans les aliments, le magnésium est lié. Les sels des compléments se dissolvent, avec un effet laxatif."
    pt:
      title: "Comida ou comprimido"
      body: "O magnésio da comida está ligado. Os sais dos suplementos dissolvem-se, com efeito laxante conforme a dose."
    tr:
      title: "Yemek mi hap mı"
      body: "Yiyecekteki magnezyum bağlıdır. Takviyedeki tuzlar çözünür, dozla artan müshil etkisi yapar."

  - key: geen-dosis
    kind: myth
    en:
      title: "300 mg"
      body: "Myth: 300 mg is the dose to take. That's what healthy people typically eat, not a dose shown to do something."
    nl:
      title: "300 mg"
      body: "Mythe: 300 mg is de dosis die je moet nemen. Zoveel eten gezonde mensen meestal, geen dosis die iets bewees."
    de:
      title: "300 mg"
      body: "Mythos: 300 mg sind die richtige Dosis. So viel essen Gesunde meist, keine Dosis mit belegter Wirkung."
    es:
      title: "300 mg"
      body: "Mito: 300 mg es la dosis que tomar. Es lo que suelen comer las personas sanas, no una dosis con efecto probado."
    fr:
      title: "300 mg"
      body: "Mythe : 300 mg, c'est la dose à prendre. C'est ce que mangent les gens en bonne santé, pas une dose testée."
    pt:
      title: "300 mg"
      body: "Mito: 300 mg é a dose a tomar. É o que as pessoas saudáveis costumam comer, não uma dose com efeito provado."
    tr:
      title: "300 mg"
      body: "Efsane: alınacak doz 300 mg. Sağlıklı insanların genelde yediği miktar bu, etkisi kanıtlı bir doz değil."

  - key: diarree
    kind: fact
    en:
      title: "360 mg"
      body: "From supplements, on top of food, gave mild diarrhoea to a small share of adults. That's the first sign."
    nl:
      title: "360 mg"
      body: "Uit supplementen, bovenop je eten, gaf bij een klein deel van de volwassenen lichte diarree. Het eerste signaal."
    de:
      title: "360 mg"
      body: "Aus Supplements, zusätzlich zum Essen, gaben einem kleinen Teil der Erwachsenen leichten Durchfall."
    es:
      title: "360 mg"
      body: "De suplementos, además de la comida, dieron diarrea leve a una pequeña parte de adultos. Es la primera señal."
    fr:
      title: "360 mg"
      body: "En compléments, en plus des repas, ont donné une diarrhée légère à quelques adultes. C'est le premier signe."
    pt:
      title: "360 mg"
      body: "De suplementos, além da comida, deram diarreia ligeira a uma pequena parte dos adultos. É o primeiro sinal."
    tr:
      title: "360 mg"
      body: "Yiyeceklere ek olarak takviyeden alınınca yetişkinlerin küçük bir kısmında hafif ishal yaptı. İlk işaret bu."

  - key: mineraalwater
    kind: fact
    en:
      title: "33.5 mg"
      body: "Magnesium per litre, the median in German mineral waters. Water counts toward the 250 mg limit."
    nl:
      title: "33,5 mg"
      body: "Magnesium per liter, de mediaan in Duitse mineraalwaters. Water telt mee voor de grens van 250 mg."
    de:
      title: "33,5 mg"
      body: "Magnesium pro Liter, der Median in deutschen Mineralwässern. Wasser zählt zum 250-mg-Limit."
    es:
      title: "33,5 mg"
      body: "De magnesio por litro, la mediana en aguas minerales alemanas. El agua cuenta para el límite de 250 mg."
    fr:
      title: "33,5 mg"
      body: "De magnésium par litre, la médiane des eaux minérales allemandes. L'eau compte dans la limite de 250 mg."
    pt:
      title: "33,5 mg"
      body: "De magnésio por litro, a mediana em águas minerais alemãs. A água conta para o limite de 250 mg."
    tr:
      title: "33,5 mg"
      body: "Alman maden sularında litre başına medyan magnezyum. Su, 250 mg sınırına dahildir."

  - key: nieren
    kind: fact
    en:
      title: "Kidneys"
      body: "Badly impaired kidneys raise the risk of too much magnesium in your blood. Ask your doctor first."
    nl:
      title: "Nieren"
      body: "Slecht werkende nieren vergroten de kans op te veel magnesium in je bloed. Vraag eerst je arts."
    de:
      title: "Nieren"
      body: "Stark eingeschränkte Nieren erhöhen das Risiko für zu viel Magnesium im Blut. Frag erst deinen Arzt."
    es:
      title: "Riñones"
      body: "Unos riñones muy dañados suben el riesgo de exceso de magnesio en sangre. Pregunta antes a tu médico."
    fr:
      title: "Reins"
      body: "Des reins très affaiblis augmentent le risque d'excès de magnésium dans le sang. Demande d'abord à ton médecin."
    pt:
      title: "Rins"
      body: "Rins muito afetados aumentam o risco de magnésio a mais no sangue. Pergunta primeiro ao médico."
    tr:
      title: "Böbrekler"
      body: "Ciddi böbrek sorunu kanda fazla magnezyum riskini artırır. Önce doktoruna sor."

  - key: medicijnen
    kind: fact
    en:
      title: "Medication"
      body: "Magnesium may affect zinc absorption and drugs like tetracycline and digoxin. Ask your pharmacist."
    nl:
      title: "Medicijnen"
      body: "Magnesium kan de opname van zink en medicijnen als tetracycline en digoxine raken. Vraag je apotheker."
    de:
      title: "Medikamente"
      body: "Magnesium kann die Aufnahme von Zink und Mitteln wie Tetracyclin und Digoxin stören. Frag in der Apotheke."
    es:
      title: "Medicación"
      body: "El magnesio puede afectar al zinc y a fármacos como tetraciclina y digoxina. Pregunta en la farmacia."
    fr:
      title: "Médicaments"
      body: "Le magnésium peut gêner le zinc et des médicaments comme la tétracycline et la digoxine. Demande au pharmacien."
    pt:
      title: "Medicação"
      body: "O magnésio pode afetar o zinco e fármacos como tetraciclina e digoxina. Pergunta ao farmacêutico."
    tr:
      title: "İlaçlar"
      body: "Magnezyum çinko emilimini ve tetrasiklin, digoksin gibi ilaçları etkileyebilir. Eczacına sor."

  - key: training
    kind: myth
    en:
      title: "Performance"
      body: "Myth: magnesium boosts training. Not unless you're deficient. Most good research finds no effect in athletes."
    nl:
      title: "Prestatie"
      body: "Mythe: magnesium boost je training. Niet zonder tekort. Het meeste goede onderzoek vindt geen effect bij sporters."
    de:
      title: "Leistung"
      body: "Mythos: Magnesium pusht dein Training. Nur bei Mangel. Gute Studien finden meist keinen Effekt bei Sportlern."
    es:
      title: "Rendimiento"
      body: "Mito: el magnesio mejora tu entreno. No si no tienes déficit. La buena investigación no ve efecto en atletas."
    fr:
      title: "Performance"
      body: "Mythe : le magnésium booste l'entraînement. Pas sans carence. Les bonnes études ne voient pas d'effet."
    pt:
      title: "Rendimento"
      body: "Mito: o magnésio melhora o treino. Não sem défice. A boa investigação não vê efeito em atletas."
    tr:
      title: "Performans"
      body: "Efsane: magnezyum antrenmanı güçlendirir. Eksiklik yoksa hayır. İyi araştırmalar sporcularda etki bulmuyor."

  - key: zwanger
    kind: fact
    en:
      title: "Pregnant"
      body: "Or breastfeeding? Same adequate intake as other women: 300 mg a day. EFSA found no sign you need more."
    nl:
      title: "Zwanger"
      body: "Of geef je borstvoeding? Dezelfde adequate inname als andere vrouwen: 300 mg per dag. Meer is niet nodig, zegt EFSA."
    de:
      title: "Schwanger"
      body: "Oder stillst du? Gleicher Schätzwert wie bei anderen Frauen: 300 mg am Tag. Laut EFSA brauchst du nicht mehr."
    es:
      title: "Embarazada"
      body: "¿O das el pecho? La misma ingesta adecuada que otras mujeres: 300 mg al día. La EFSA no ve que necesites más."
    fr:
      title: "Enceinte"
      body: "Ou tu allaites ? Même apport adéquat que les autres femmes : 300 mg par jour. Pas besoin de plus selon l'EFSA."
    pt:
      title: "Grávida"
      body: "Ou a amamentar? A mesma ingestão adequada das outras mulheres: 300 mg por dia. A EFSA não vê necessidade de mais."
    tr:
      title: "Hamile"
      body: "Ya da emziriyor musun? Diğer kadınlarla aynı yeterli alım: günde 300 mg. EFSA daha fazlasına gerek görmedi."

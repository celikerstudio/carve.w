article: goal-setting
emoji: "🎯"
tips:
  - key: doelen-werken
    kind: fact
    en:
      title: "45 studies"
      body: "Programs built around activity goals got people moving more than groups without goals."
    nl:
      title: "45 studies"
      body: "Programma's rond beweegdoelen lieten mensen meer bewegen dan groepen zonder doel."
    de:
      title: "45 Studien"
      body: "Programme mit Bewegungszielen brachten Menschen mehr in Bewegung als Gruppen ohne Ziel."
    es:
      title: "45 estudios"
      body: "Los programas con metas de actividad hicieron moverse más que los grupos sin metas."
    fr:
      title: "45 études"
      body: "Les programmes avec objectifs d'activité ont fait plus bouger que les groupes sans objectif."
    pt:
      title: "45 estudos"
      body: "Programas com metas de atividade puseram as pessoas a mexer-se mais do que grupos sem metas."
    tr:
      title: "45 çalışma"
      body: "Hareket hedefli programlar insanları hedefsiz gruplardan daha çok hareket ettirdi."

  - key: doel-alleen
    kind: myth
    en:
      title: "Just a goal"
      body: "Myth: setting a goal is enough. On its own it had a small effect. Planning and tracking turn it into action."
    nl:
      title: "Alleen een doel"
      body: "Mythe: een doel stellen is genoeg. Los had het een klein effect. Plannen en bijhouden maken er actie van."
    de:
      title: "Nur ein Ziel"
      body: "Mythos: Ein Ziel reicht. Allein wirkte es wenig. Planen und Festhalten machen daraus Handeln."
    es:
      title: "Solo una meta"
      body: "Mito: basta con fijarse una meta. Sola tuvo poco efecto. Planificar y registrar la convierten en acción."
    fr:
      title: "Juste un objectif"
      body: "Mythe : se fixer un objectif suffit. Seul, l'effet était faible. Planifier et suivre le font passer à l'action."
    pt:
      title: "Só uma meta"
      body: "Mito: basta definir uma meta. Sozinha teve pouco efeito. Planear e registar transformam-na em ação."
    tr:
      title: "Sadece hedef"
      body: "Efsane: hedef koymak yeter. Tek başına etkisi küçüktü. Plan ve takip onu eyleme dönüştürür."

  - key: moeilijk-doel
    kind: fact
    en:
      title: "A hard goal"
      body: "Goal setting worked best when the goal was difficult, a broad meta-analysis found."
    nl:
      title: "Een moeilijk doel"
      body: "Doelen stellen werkte het best als het doel moeilijk was, vond een brede meta-analyse."
    de:
      title: "Ein schweres Ziel"
      body: "Ziele setzen wirkte am besten, wenn das Ziel schwer war, so eine breite Metaanalyse."
    es:
      title: "Una meta difícil"
      body: "Fijarse metas funcionó mejor cuando la meta era difícil, según un amplio metaanálisis."
    fr:
      title: "Un objectif dur"
      body: "Se fixer un but marchait mieux quand il était difficile, selon une large méta-analyse."
    pt:
      title: "Uma meta difícil"
      body: "Definir metas funcionou melhor quando a meta era difícil, segundo uma ampla meta-análise."
    tr:
      title: "Zor bir hedef"
      body: "Geniş bir meta-analize göre hedef koymak, hedef zor olduğunda en iyi işe yaradı."

  - key: groot-doel-kleine-stap
    kind: fact
    en:
      title: "A few months"
      body: "Set a goal that far out that really challenges you. Make this week's step one you expect to manage."
    nl:
      title: "Een paar maanden"
      body: "Zet zo ver vooruit een doel dat je echt uitdaagt. Maak de stap van deze week er een die je gaat halen."
    de:
      title: "Ein paar Monate"
      body: "Setz so weit voraus ein Ziel, das dich fordert. Mach den Schritt dieser Woche einen, den du schaffst."
    es:
      title: "Unos meses"
      body: "Pon a esa distancia una meta que te rete. Que el paso de esta semana sea uno que vas a lograr."
    fr:
      title: "Quelques mois"
      body: "Fixe à cette distance un but qui te pousse. Fais du pas de la semaine un pas que tu vas réussir."
    pt:
      title: "Uns meses"
      body: "Põe a essa distância uma meta que te desafie. Faz do passo desta semana um que vais conseguir."
    tr:
      title: "Birkaç ay"
      body: "O kadar ileriye seni zorlayan bir hedef koy. Bu haftanın adımı başarabileceğin bir adım olsun."

  - key: smart
    kind: myth
    en:
      title: "SMART"
      body: "Myth: a goal has to be SMART. A review found the acronym isn't based on evidence. A clear, measurable goal still helps."
    nl:
      title: "SMART"
      body: "Mythe: een doel moet SMART zijn. Een review vond geen bewijs achter het acroniem. Een helder, meetbaar doel helpt wel."
    de:
      title: "SMART"
      body: "Mythos: Ein Ziel muss SMART sein. Eine Übersicht fand keine Belege dafür. Ein klares, messbares Ziel hilft trotzdem."
    es:
      title: "SMART"
      body: "Mito: una meta tiene que ser SMART. Una revisión no vio pruebas detrás. Una meta clara y medible sí ayuda."
    fr:
      title: "SMART"
      body: "Mythe : un objectif doit être SMART. Une revue n'y a vu aucune base solide. Un but clair et mesurable aide quand même."
    pt:
      title: "SMART"
      body: "Mito: uma meta tem de ser SMART. Uma revisão não viu provas por trás. Uma meta clara e mensurável ajuda."
    tr:
      title: "SMART"
      body: "Efsane: hedef SMART olmalı. Bir derleme bu kısaltmanın kanıta dayanmadığını buldu. Net ve ölçülebilir hedef yine iyi."

  - key: wanneer-waar-hoe
    kind: fact
    en:
      title: "When, where, how"
      body: "Planning those helped people be active, in 35 trials. Adding a plan for setbacks did no better."
    nl:
      title: "Wanneer, waar, hoe"
      body: "Dat plannen hielp mensen bewegen, in 35 studies. Een plan voor tegenslag erbij deed het niet beter."
    de:
      title: "Wann, wo, wie"
      body: "Das zu planen half in 35 Studien beim Bewegen. Ein Plan für Rückschläge brachte nicht mehr."
    es:
      title: "Cuándo, dónde, cómo"
      body: "Planearlo ayudó a moverse, en 35 ensayos. Añadir un plan para tropiezos no mejoró nada."
    fr:
      title: "Quand, où, comment"
      body: "Le planifier a aidé à bouger, sur 35 essais. Ajouter un plan pour les échecs n'a rien amélioré."
    pt:
      title: "Quando, onde, como"
      body: "Planear isso ajudou a mexer, em 35 ensaios. Juntar um plano para contratempos não melhorou."
    tr:
      title: "Ne zaman, nerede"
      body: "35 çalışmada bunu planlamak harekete yardım etti. Aksilikler için plan eklemek fark yaratmadı."

  - key: plannen-en-stappentellers
    kind: fact
    en:
      title: "Step counters"
      body: "In the few planning trials that used them, the effect was small and not significant. Most used questionnaires."
    nl:
      title: "Stappentellers"
      body: "In de paar planstudies die ze gebruikten, was het effect klein en niet significant. De meeste gebruikten vragenlijsten."
    de:
      title: "Schrittzähler"
      body: "In den wenigen Planungsstudien damit war der Effekt klein und nicht signifikant. Die meisten nutzten Fragebögen."
    es:
      title: "Podómetros"
      body: "En los pocos estudios de planificación que los usaron, el efecto fue pequeño y no significativo."
    fr:
      title: "Podomètres"
      body: "Dans les rares études qui en utilisaient, l'effet du planning était petit et non significatif."
    pt:
      title: "Contadores de passos"
      body: "Nos poucos estudos de planeamento que os usaram, o efeito foi pequeno e não significativo."
    tr:
      title: "Adımsayar"
      body: "Bunları kullanan az sayıdaki planlama çalışmasında etki küçük ve anlamsızdı. Çoğu anket kullandı."

  - key: vooruitgang-bijhouden
    kind: fact
    en:
      title: "138 studies"
      body: "Monitoring progress helped people reach goals. More so when they wrote it down or shared it."
    nl:
      title: "138 studies"
      body: "Vooruitgang bijhouden hielp mensen hun doel halen. Nog meer als ze het opschreven of deelden."
    de:
      title: "138 Studien"
      body: "Fortschritt festzuhalten half beim Erreichen von Zielen. Noch mehr, wenn man es aufschrieb oder teilte."
    es:
      title: "138 estudios"
      body: "Seguir el progreso ayudó a lograr metas. Más aún si lo apuntaban o lo compartían."
    fr:
      title: "138 études"
      body: "Suivre ses progrès aidait à atteindre ses buts. Encore plus en les notant ou en les partageant."
    pt:
      title: "138 estudos"
      body: "Acompanhar o progresso ajudou a atingir metas. Mais ainda quando o escreviam ou partilhavam."
    tr:
      title: "138 çalışma"
      body: "İlerlemeyi takip etmek hedefe ulaşmaya yardım etti. Yazınca ya da paylaşınca daha da çok."

  - key: een-of-twee
    kind: fact
    en:
      title: "1 or 2 goals"
      body: "Too many at once is a common mistake. Pick the one or two that matter most and plan those well."
    nl:
      title: "1 of 2 doelen"
      body: "Te veel tegelijk is een veelgemaakte fout. Kies de één of twee die het meest tellen en plan die goed."
    de:
      title: "1 oder 2 Ziele"
      body: "Zu viele auf einmal sind ein häufiger Fehler. Nimm die ein, zwei wichtigsten und plan sie gut."
    es:
      title: "1 o 2 metas"
      body: "Demasiadas a la vez es un error común. Elige una o dos que importen y planéalas bien."
    fr:
      title: "1 ou 2 objectifs"
      body: "Trop à la fois, c'est une erreur courante. Garde les un ou deux qui comptent et planifie-les bien."
    pt:
      title: "1 ou 2 metas"
      body: "Demasiadas de uma vez é um erro comum. Escolhe uma ou duas que importam e planeia-as bem."
    tr:
      title: "1-2 hedef"
      body: "Aynı anda çok hedef sık bir hata. En önemli bir iki tanesini seç ve iyi planla."

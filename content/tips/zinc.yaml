article: zinc
emoji: "🦪"
tips:
  - key: hoeveel-per-dag
    kind: fact
    en:
      title: "9.4 to 16.3 mg"
      body: "Zinc a day for men, 7.5 to 12.7 mg for women, says EFSA. Phytate in your diet decides where you land."
    nl:
      title: "9,4 tot 16,3 mg"
      body: "Zink per dag voor mannen, 7,5 tot 12,7 mg voor vrouwen, zegt EFSA. Fytaat in je eten bepaalt waar je uitkomt."
    de:
      title: "9,4 bis 16,3 mg"
      body: "Zink am Tag für Männer, 7,5 bis 12,7 mg für Frauen, so die EFSA. Phytat im Essen bestimmt den Wert."
    es:
      title: "9,4 a 16,3 mg"
      body: "De zinc al día para hombres, 7,5 a 12,7 mg para mujeres, según la EFSA. El fitato de tu dieta decide."
    fr:
      title: "9,4 à 16,3 mg"
      body: "De zinc par jour pour les hommes, 7,5 à 12,7 mg pour les femmes, selon l'EFSA. Le phytate décide."
    pt:
      title: "9,4 a 16,3 mg"
      body: "De zinco por dia para homens, 7,5 a 12,7 mg para mulheres, diz a EFSA. O fitato da dieta decide."
    tr:
      title: "9,4-16,3 mg"
      body: "EFSA'ya göre erkeğe günlük çinko, kadına 7,5-12,7 mg. Nerede olacağını diyetindeki fitat belirler."

  - key: fytaat
    kind: fact
    en:
      title: "50%"
      body: "More zinc may be needed by vegetarians. Phytate in plant foods binds zinc and blocks its absorption."
    nl:
      title: "50%"
      body: "Meer zink hebben vegetariërs mogelijk nodig. Fytaat in plantaardig eten bindt zink en remt de opname."
    de:
      title: "50 %"
      body: "Mehr Zink brauchen Vegetarier womöglich. Phytat in Pflanzenkost bindet Zink und bremst die Aufnahme."
    es:
      title: "50 %"
      body: "Más zinc pueden necesitar los vegetarianos. El fitato de los vegetales lo atrapa y frena su absorción."
    fr:
      title: "50 %"
      body: "De zinc en plus peut être nécessaire aux végétariens. Le phytate des végétaux le fixe et bloque son absorption."
    pt:
      title: "50%"
      body: "Mais zinco podem precisar os vegetarianos. O fitato dos vegetais prende o zinco e trava a absorção."
    tr:
      title: "%50"
      body: "Vejetaryenlerin çinko ihtiyacı bu kadar fazla olabilir. Bitkilerdeki fitat çinkoyu bağlar, emilimi engeller."

  - key: grens-telt-eten-mee
    kind: myth
    en:
      title: "25 mg"
      body: "Myth: the 25 mg limit is for supplements only. It's for all your zinc, food and supplements together."
    nl:
      title: "25 mg"
      body: "Mythe: de grens van 25 mg geldt alleen voor supplementen. Hij geldt voor al je zink, eten en supplementen samen."
    de:
      title: "25 mg"
      body: "Mythos: Das 25-mg-Limit gilt nur für Supplements. Es gilt für dein ganzes Zink, Essen und Supplements zusammen."
    es:
      title: "25 mg"
      body: "Mito: el límite de 25 mg es solo para suplementos. Es para todo tu zinc, comida y suplementos juntos."
    fr:
      title: "25 mg"
      body: "Mythe : la limite de 25 mg ne vise que les compléments. Elle compte tout ton zinc, repas et compléments."
    pt:
      title: "25 mg"
      body: "Mito: o limite de 25 mg é só para suplementos. É para todo o zinco, comida e suplementos juntos."
    tr:
      title: "25 mg"
      body: "Efsane: 25 mg sınırı sadece takviye için. Yiyecek ve takviye dahil tüm çinko için geçerli."

  - key: capsule-van-30-mg
    kind: fact
    en:
      title: "30 mg"
      body: "In a common zinc capsule. That's over the 25 mg daily limit on its own, before you count your food."
    nl:
      title: "30 mg"
      body: "Zit er in een gangbare zinkcapsule. Dat is al boven de daggrens van 25 mg, voor je eten meetelt."
    de:
      title: "30 mg"
      body: "Stecken in einer üblichen Zinkkapsel. Das liegt allein schon über dem 25-mg-Tageslimit, ohne Essen."
    es:
      title: "30 mg"
      body: "Lleva una cápsula de zinc común. Ya supera el límite diario de 25 mg sola, antes de contar la comida."
    fr:
      title: "30 mg"
      body: "Dans une gélule de zinc courante. C'est déjà au-dessus de la limite de 25 mg, avant ton alimentation."
    pt:
      title: "30 mg"
      body: "Tem uma cápsula de zinco comum. Já passa sozinha o limite diário de 25 mg, antes da comida."
    tr:
      title: "30 mg"
      body: "Yaygın bir çinko kapsülünde var. Yemeği saymadan tek başına günlük 25 mg sınırını aşar."

  - key: zink-uit-eten
    kind: fact
    en:
      title: "13 mg"
      body: "Of zinc a day already comes from food for men in Europe. Women get about 9 mg."
    nl:
      title: "13 mg"
      body: "Zink per dag halen mannen in Europa al uit eten. Vrouwen zo'n 9 mg."
    de:
      title: "13 mg"
      body: "Zink am Tag bekommen Männer in Europa schon übers Essen. Frauen etwa 9 mg."
    es:
      title: "13 mg"
      body: "De zinc al día ya sacan de la comida los hombres en Europa. Las mujeres, unos 9 mg."
    fr:
      title: "13 mg"
      body: "De zinc par jour viennent déjà de l'alimentation chez les hommes en Europe. Les femmes, environ 9 mg."
    pt:
      title: "13 mg"
      body: "De zinco por dia já vêm da comida nos homens na Europa. As mulheres, cerca de 9 mg."
    tr:
      title: "13 mg"
      body: "Avrupa'da erkekler yemekten günde zaten bu kadar çinko alıyor. Kadınlar yaklaşık 9 mg."

  - key: koper
    kind: fact
    en:
      title: "Copper"
      body: "Too much zinc for a long time goes with signs of copper deficiency."
    nl:
      title: "Koper"
      body: "Lang te veel zink gaat samen met tekenen van kopertekort."
    de:
      title: "Kupfer"
      body: "Lange zu viel Zink geht mit Anzeichen von Kupfermangel einher."
    es:
      title: "Cobre"
      body: "Demasiado zinc durante mucho tiempo va con signos de falta de cobre."
    fr:
      title: "Cuivre"
      body: "Trop de zinc pendant longtemps va avec des signes de manque de cuivre."
    pt:
      title: "Cobre"
      body: "Zinco a mais durante muito tempo anda com sinais de falta de cobre."
    tr:
      title: "Bakır"
      body: "Uzun süre fazla çinko bakır eksikliği belirtileriyle birlikte görülür."

  - key: grote-dosis-in-een-keer
    kind: fact
    en:
      title: "Big dose"
      body: "A large single dose of zinc brings nausea, vomiting, stomach pain and diarrhoea."
    nl:
      title: "Grote dosis"
      body: "Een grote dosis zink in één keer geeft misselijkheid, braken, buikpijn en diarree."
    de:
      title: "Große Dosis"
      body: "Eine große Einzeldosis Zink bringt Übelkeit, Erbrechen, Bauchschmerzen und Durchfall."
    es:
      title: "Dosis grande"
      body: "Una dosis grande de zinc de golpe da náuseas, vómitos, dolor de tripa y diarrea."
    fr:
      title: "Grosse dose"
      body: "Une grosse dose de zinc d'un coup donne nausées, vomissements, maux de ventre et diarrhée."
    pt:
      title: "Dose grande"
      body: "Uma dose grande de zinco de uma vez dá náuseas, vómitos, dor de barriga e diarreia."
    tr:
      title: "Büyük doz"
      body: "Tek seferde yüksek doz çinko bulantı, kusma, karın ağrısı ve ishal yapar."

  - key: testosteron
    kind: myth
    en:
      title: "Testosterone"
      body: "Myth: zinc raises testosterone. A review of 52 studies didn't rate it so, and 2 of 3 ZMA studies saw no change."
    nl:
      title: "Testosteron"
      body: "Mythe: zink verhoogt testosteron. Een review van 52 studies zag dat niet, en 2 van 3 ZMA-studies vonden niets."
    de:
      title: "Testosteron"
      body: "Mythos: Zink erhöht Testosteron. Eine Übersicht über 52 Studien sah das nicht, 2 von 3 ZMA-Studien auch nicht."
    es:
      title: "Testosterona"
      body: "Mito: el zinc sube la testosterona. Una revisión de 52 estudios no lo vio, y 2 de 3 estudios de ZMA tampoco."
    fr:
      title: "Testostérone"
      body: "Mythe : le zinc monte la testo. Une revue de 52 études ne l'a pas retenu, et 2 études ZMA sur 3 n'ont rien vu."
    pt:
      title: "Testosterona"
      body: "Mito: o zinco sobe a testosterona. Uma revisão de 52 estudos não o viu, e 2 de 3 estudos de ZMA também não."
    tr:
      title: "Testosteron"
      body: "Efsane: çinko testosteronu artırır. 52 çalışmalık bir derleme bunu görmedi, 3 ZMA çalışmasının 2'si de."

  - key: zma-en-tekort
    kind: fact
    en:
      title: "ZMA"
      body: "The one ZMA study with a testosterone rise also found zinc and magnesium depletion. A deficiency may explain it."
    nl:
      title: "ZMA"
      body: "De ene ZMA-studie met meer testosteron vond ook een tekort aan zink en magnesium. Dat kan het verklaren."
    de:
      title: "ZMA"
      body: "Die eine ZMA-Studie mit mehr Testosteron fand auch Zink- und Magnesiummangel. Das könnte es erklären."
    es:
      title: "ZMA"
      body: "El único estudio de ZMA con subida de testosterona también vio falta de zinc y magnesio. Eso podría explicarlo."
    fr:
      title: "ZMA"
      body: "La seule étude ZMA avec une hausse de testo notait aussi un manque de zinc et de magnésium. Ça peut l'expliquer."
    pt:
      title: "ZMA"
      body: "O único estudo de ZMA com subida de testosterona viu também falta de zinco e magnésio. Isso pode explicá-lo."
    tr:
      title: "ZMA"
      body: "Testosteron artışı bulan tek ZMA çalışmasında çinko ve magnezyum eksikliği de vardı. Açıklama bu olabilir."

  - key: calcium-en-ijzer
    kind: fact
    en:
      title: "Calcium and iron"
      body: "Large doses of calcium and lots of iron in your diet can lower how much zinc you absorb."
    nl:
      title: "Calcium en ijzer"
      body: "Grote doses calcium en veel ijzer in je eten kunnen je zinkopname verlagen."
    de:
      title: "Kalzium und Eisen"
      body: "Große Mengen Kalzium und viel Eisen im Essen können die Zinkaufnahme senken."
    es:
      title: "Calcio y hierro"
      body: "Dosis altas de calcio y mucho hierro en la dieta pueden bajar cuánto zinc absorbes."
    fr:
      title: "Calcium et fer"
      body: "De fortes doses de calcium et beaucoup de fer peuvent réduire l'absorption du zinc."
    pt:
      title: "Cálcio e ferro"
      body: "Doses altas de cálcio e muito ferro na dieta podem baixar o zinco que absorves."
    tr:
      title: "Kalsiyum ve demir"
      body: "Yüksek doz kalsiyum ve diyette çok demir, çinko emilimini azaltabilir."

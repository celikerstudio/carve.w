article: calorie-surplus
emoji: "🥜"
tips:
  - key: klein-overschot
    kind: fact
    en:
      title: "150 to 300 kcal"
      body: "Extra a day is enough. That gains you roughly 0.25 to 0.5% of your bodyweight a week."
    nl:
      title: "150 tot 300 kcal"
      body: "Extra per dag is genoeg. Zo kom je ongeveer 0,25 tot 0,5% van je gewicht per week aan."
    de:
      title: "150 bis 300 kcal"
      body: "Extra am Tag reichen. So nimmst du etwa 0,25 bis 0,5 % deines Gewichts pro Woche zu."
    es:
      title: "150 a 300 kcal"
      body: "Extra al día bastan. Así ganas más o menos un 0,25 a 0,5 % de tu peso por semana."
    fr:
      title: "150 à 300 kcal"
      body: "En plus par jour suffisent. Tu prends ainsi environ 0,25 à 0,5 % de ton poids par semaine."
    pt:
      title: "150 a 300 kcal"
      body: "A mais por dia chegam. Assim ganhas cerca de 0,25 a 0,5% do teu peso por semana."
    tr:
      title: "150-300 kcal"
      body: "Günlük bu kadar fazlası yeter. Böylece haftada vücut ağırlığının yaklaşık %0,25-0,5'i kadar alırsın."

  - key: meer-is-niet-sneller
    kind: myth
    en:
      title: "Faster growth"
      body: "Myth: eat more, grow faster. A big surplus mostly adds fat. Your muscles don't grow meaningfully faster."
    nl:
      title: "Sneller groeien"
      body: "Mythe: meer eten is sneller groeien. Een groot overschot geeft vooral vet. Je spieren groeien niet echt sneller."
    de:
      title: "Schneller wachsen"
      body: "Mythos: Mehr essen, schneller wachsen. Ein großer Überschuss bringt vor allem Fett, kaum schnelleren Muskel."
    es:
      title: "Crecer más rápido"
      body: "Mito: comer más es crecer más rápido. Un gran superávit añade sobre todo grasa, no músculo más rápido."
    fr:
      title: "Grossir plus vite"
      body: "Mythe : manger plus, c'est prendre du muscle plus vite. Un gros surplus ajoute surtout du gras."
    pt:
      title: "Crescer mais rápido"
      body: "Mito: comer mais é crescer mais rápido. Um grande excedente junta sobretudo gordura, não músculo mais rápido."
    tr:
      title: "Daha hızlı büyümek"
      body: "Efsane: çok ye, hızlı büyü. Büyük fazla çoğunlukla yağ ekler, kaslar belirgin şekilde hızlanmaz."

  - key: bijsturen
    kind: fact
    en:
      title: "100 to 200 kcal"
      body: "Gaining faster than planned? Drop that much. Weight stuck for 2 weeks? Add 100 to 150 kcal."
    nl:
      title: "100 tot 200 kcal"
      body: "Kom je sneller aan dan gepland? Haal er zoveel af. Staat je gewicht 2 weken stil? Doe er 100 tot 150 bij."
    de:
      title: "100 bis 200 kcal"
      body: "Nimmst du schneller zu als geplant? Streich so viel. Steht das Gewicht 2 Wochen? Leg 100 bis 150 drauf."
    es:
      title: "100 a 200 kcal"
      body: "¿Subes más rápido de lo previsto? Quita eso. ¿Peso parado 2 semanas? Suma 100 a 150 kcal."
    fr:
      title: "100 à 200 kcal"
      body: "Tu prends plus vite que prévu ? Enlève ça. Poids bloqué 2 semaines ? Ajoute 100 à 150 kcal."
    pt:
      title: "100 a 200 kcal"
      body: "Estás a subir mais rápido do que o previsto? Tira isso. Peso parado 2 semanas? Junta 100 a 150 kcal."
    tr:
      title: "100-200 kcal"
      body: "Plandan hızlı mı alıyorsun? Bu kadar azalt. Kilo 2 haftadır duruyor mu? 100-150 kcal ekle."

  - key: calorierijk-eten
    kind: fact
    en:
      title: "Can't eat enough"
      body: "Rice, oats and nut butters help you hit your target without overloading your stomach."
    nl:
      title: "Krijg je het niet op"
      body: "Rijst, havermout en notenpasta helpen je je doel te halen zonder dat je maag overvol raakt."
    de:
      title: "Schaffst es nicht"
      body: "Reis, Haferflocken und Nussmus helfen dir ans Ziel, ohne dass dein Magen überläuft."
    es:
      title: "No llegas"
      body: "El arroz, la avena y las cremas de frutos secos te ayudan a llegar sin llenar demasiado el estómago."
    fr:
      title: "Tu n'y arrives pas"
      body: "Riz, flocons d'avoine et purées d'oléagineux t'aident à atteindre ta cible sans te gaver."
    pt:
      title: "Não consegues comer"
      body: "Arroz, aveia e manteigas de frutos secos ajudam-te a chegar ao alvo sem encher demasiado o estômago."
    tr:
      title: "Yetiştiremiyorsan"
      body: "Pirinç, yulaf ve fıstık ezmesi gibi ezmeler mideni doldurmadan hedefe ulaşmanı sağlar."

  - key: kracht-moet-meegroeien
    kind: fact
    en:
      title: "Stronger too"
      body: "Gaining weight should come with more weight or reps in the gym. If not, adjust your training or surplus."
    nl:
      title: "Ook sterker"
      body: "Aankomen hoort samen te gaan met meer gewicht of herhalingen. Zo niet, pas je training of overschot aan."
    de:
      title: "Auch stärker"
      body: "Zunehmen sollte mit mehr Gewicht oder Wiederholungen einhergehen. Sonst Training oder Überschuss anpassen."
    es:
      title: "También más fuerte"
      body: "Subir de peso debería traer más kilos o repeticiones. Si no, ajusta el entreno o el superávit."
    fr:
      title: "Plus fort aussi"
      body: "Prendre du poids doit aller avec plus de charge ou de reps. Sinon, ajuste ton entraînement ou ton surplus."
    pt:
      title: "Mais forte também"
      body: "Ganhar peso deve vir com mais carga ou repetições. Se não, ajusta o treino ou o excedente."
    tr:
      title: "Güç de artmalı"
      body: "Kilo alırken ağırlık ya da tekrar da artmalı. Artmıyorsa antrenmanı ya da fazlayı ayarla."

  - key: onderhoudspauze
    kind: fact
    en:
      title: "1 to 2 weeks"
      body: "At maintenance caps fat gain when your weight climbs faster than your strength."
    nl:
      title: "1 tot 2 weken"
      body: "Op onderhoud remt vetwinst als je gewicht sneller stijgt dan je kracht."
    de:
      title: "1 bis 2 Wochen"
      body: "Auf Erhalt bremsen den Fettzuwachs, wenn dein Gewicht schneller steigt als deine Kraft."
    es:
      title: "1 a 2 semanas"
      body: "En mantenimiento frenan la grasa cuando tu peso sube más rápido que tu fuerza."
    fr:
      title: "1 à 2 semaines"
      body: "En maintenance freinent le gras quand ton poids monte plus vite que ta force."
    pt:
      title: "1 a 2 semanas"
      body: "Em manutenção travam a gordura quando o peso sobe mais rápido do que a força."
    tr:
      title: "1-2 hafta"
      body: "Kilon gücünden hızlı artıyorsa bu kadar korumada kalmak yağ artışını durdurur."

  - key: mini-cut
    kind: fact
    en:
      title: "2 to 4 weeks"
      body: "A mini-cut that short can tidy things up after a long surplus, without losing momentum."
    nl:
      title: "2 tot 4 weken"
      body: "Zo'n korte mini-cut ruimt na een lange bulk wat op, zonder dat je vaart verliest."
    de:
      title: "2 bis 4 Wochen"
      body: "So ein kurzer Mini-Cut räumt nach langem Überschuss auf, ohne dass du Schwung verlierst."
    es:
      title: "2 a 4 semanas"
      body: "Una mini definición así de corta ordena las cosas tras un superávit largo, sin perder ritmo."
    fr:
      title: "2 à 4 semaines"
      body: "Une mini-sèche aussi courte remet de l'ordre après un long surplus, sans casser ta lancée."
    pt:
      title: "2 a 4 semanas"
      body: "Um mini-cut assim curto arruma as coisas depois de um excedente longo, sem perder embalo."
    tr:
      title: "2-4 hafta"
      body: "Uzun bir fazladan sonra bu kadar kısa bir mini cut, ivme kaybetmeden ortalığı toparlar."

article: macros
emoji: "📊"
tips:
  - key: eiwit-eerst
    kind: fact
    en:
      title: "Protein first"
      body: "At 1.6 to 2.2 g per kg. Then choose your fats, and fill the calories that are left with carbs."
    nl:
      title: "Eerst eiwit"
      body: "Op 1,6 tot 2,2 gram per kilo. Kies dan je vet, en vul de calorieën die over zijn met koolhydraten."
    de:
      title: "Erst Protein"
      body: "Mit 1,6 bis 2,2 g pro kg. Dann das Fett wählen und die restlichen Kalorien mit Kohlenhydraten füllen."
    es:
      title: "Primero proteína"
      body: "A 1,6 a 2,2 g por kg. Luego elige la grasa y llena las calorías que quedan con hidratos."
    fr:
      title: "D'abord les protéines"
      body: "À 1,6 à 2,2 g par kg. Choisis ensuite le gras, et complète le reste des calories en glucides."
    pt:
      title: "Primeiro proteína"
      body: "A 1,6 a 2,2 g por kg. Depois escolhe a gordura e enche as calorias que sobram com hidratos."
    tr:
      title: "Önce protein"
      body: "Kilo başına 1,6-2,2 g. Sonra yağı seç, kalan kaloriyi karbonhidratla doldur."

  - key: vet-bandbreedte
    kind: fact
    en:
      title: "0.6 to 1.0 g"
      body: "Fat per kg is a common start. Where you land depends on what keeps you full and how much you like carbs."
    nl:
      title: "0,6 tot 1,0 gram"
      body: "Vet per kilo is een gangbaar begin. Waar je uitkomt hangt af van wat je vol houdt en hoe graag je koolhydraten eet."
    de:
      title: "0,6 bis 1,0 g"
      body: "Fett pro kg ist ein üblicher Start. Der Rest hängt davon ab, was dich satt macht und wie gern du Kohlenhydrate isst."
    es:
      title: "0,6 a 1,0 g"
      body: "De grasa por kg es un inicio habitual. Dónde acabes depende de lo que te sacia y cuánto te gustan los hidratos."
    fr:
      title: "0,6 à 1,0 g"
      body: "De gras par kg pour commencer. Ensuite, ça dépend de ce qui te cale et de ton goût pour les glucides."
    pt:
      title: "0,6 a 1,0 g"
      body: "De gordura por kg é um início comum. Onde ficas depende do que te sacia e de quanto gostas de hidratos."
    tr:
      title: "0,6-1,0 g"
      body: "Kilo başına yağ yaygın bir başlangıç. Gerisi seni neyin tok tuttuğuna ve karbonhidratı ne kadar sevdiğine bağlı."

  - key: koolhydraten-start
    kind: fact
    en:
      title: "3 to 5 g"
      body: "Carbs per kg is a common start, depending on your goal. Carbs refill the glycogen that powers training."
    nl:
      title: "3 tot 5 gram"
      body: "Koolhydraten per kilo is een gangbaar begin, afhankelijk van je doel. Ze vullen het glycogeen voor je training aan."
    de:
      title: "3 bis 5 g"
      body: "Kohlenhydrate pro kg sind ein üblicher Start, je nach Ziel. Sie füllen das Glykogen fürs Training auf."
    es:
      title: "3 a 5 g"
      body: "De hidratos por kg es un inicio habitual, según tu meta. Reponen el glucógeno que mueve tu entreno."
    fr:
      title: "3 à 5 g"
      body: "De glucides par kg pour commencer, selon ton but. Ils remplissent le glycogène qui alimente ta séance."
    pt:
      title: "3 a 5 g"
      body: "De hidratos por kg é um início comum, conforme o objetivo. Repõem o glicogénio que alimenta o treino."
    tr:
      title: "3-5 g"
      body: "Hedefine göre kilo başına karbonhidrat başlangıcı. Antrenmanı besleyen glikojeni doldurur."

  - key: eiwit-verdelen
    kind: fact
    en:
      title: "20 to 40 g"
      body: "Protein per meal, spread over 3 to 5 meals a day."
    nl:
      title: "20 tot 40 gram"
      body: "Eiwit per maaltijd, verdeeld over 3 tot 5 maaltijden per dag."
    de:
      title: "20 bis 40 g"
      body: "Protein pro Mahlzeit, verteilt auf 3 bis 5 Mahlzeiten am Tag."
    es:
      title: "20 a 40 g"
      body: "De proteína por comida, repartidos en 3 a 5 comidas al día."
    fr:
      title: "20 à 40 g"
      body: "De protéines par repas, sur 3 à 5 repas par jour."
    pt:
      title: "20 a 40 g"
      body: "De proteína por refeição, em 3 a 5 refeições por dia."
    tr:
      title: "20-40 g"
      body: "Öğün başına protein, günde 3-5 öğüne yayılmış."

  - key: rond-de-training
    kind: fact
    en:
      title: "20 to 60 g"
      body: "Carbs before and after training. Keep some fat out of your pre-lift meal so it digests easier."
    nl:
      title: "20 tot 60 gram"
      body: "Koolhydraten voor en na de training. Houd je maaltijd vooraf wat vetarmer, dan verteert die makkelijker."
    de:
      title: "20 bis 60 g"
      body: "Kohlenhydrate vor und nach dem Training. Iss vorher etwas fettärmer, dann verdaust du leichter."
    es:
      title: "20 a 60 g"
      body: "De hidratos antes y después de entrenar. Quita algo de grasa a la comida previa para digerir mejor."
    fr:
      title: "20 à 60 g"
      body: "De glucides avant et après la séance. Allège le gras du repas d'avant pour mieux digérer."
    pt:
      title: "20 a 60 g"
      body: "De hidratos antes e depois do treino. Tira alguma gordura à refeição antes para digerir melhor."
    tr:
      title: "20-60 g"
      body: "Antrenmandan önce ve sonra karbonhidrat. Öncesindeki öğünde yağı az tut, kolay sindirilsin."

  - key: alleen-calorieen
    kind: myth
    en:
      title: "Only calories"
      body: "Myth: only calories matter. They decide gain or loss. Macros decide how much is muscle and how much fat."
    nl:
      title: "Alleen calorieën"
      body: "Mythe: alleen calorieën tellen. Die bepalen aankomen of afvallen. Macro's bepalen hoeveel daarvan spier en vet is."
    de:
      title: "Nur Kalorien"
      body: "Mythos: Nur Kalorien zählen. Sie entscheiden über Zu- oder Abnahme. Makros, wie viel davon Muskel und Fett ist."
    es:
      title: "Solo calorías"
      body: "Mito: solo cuentan las calorías. Deciden si subes o bajas. Los macros deciden cuánto es músculo y cuánto grasa."
    fr:
      title: "Que les calories"
      body: "Mythe : seules les calories comptent. Elles décident prise ou perte. Les macros, la part de muscle et de gras."
    pt:
      title: "Só calorias"
      body: "Mito: só contam as calorias. Decidem se ganhas ou perdes. Os macros decidem quanto é músculo e quanto é gordura."
    tr:
      title: "Sadece kalori"
      body: "Efsane: sadece kalori önemli. Kalori alıp vermeyi belirler. Makrolar bunun ne kadarının kas, ne kadarının yağ olduğunu."

  - key: rustdagen
    kind: fact
    en:
      title: "Rest days"
      body: "Slightly fewer carbs than on hard training days. Keep your protein the same every day."
    nl:
      title: "Rustdagen"
      body: "Iets minder koolhydraten dan op zware trainingsdagen. Je eiwit blijft elke dag gelijk."
    de:
      title: "Ruhetage"
      body: "Etwas weniger Kohlenhydrate als an harten Tagen. Protein bleibt jeden Tag gleich."
    es:
      title: "Días de descanso"
      body: "Algo menos de hidratos que en días duros. La proteína, igual todos los días."
    fr:
      title: "Jours de repos"
      body: "Un peu moins de glucides que les jours durs. Les protéines restent les mêmes chaque jour."
    pt:
      title: "Dias de descanso"
      body: "Um pouco menos de hidratos do que nos dias duros. A proteína fica igual todos os dias."
    tr:
      title: "Dinlenme günleri"
      body: "Sert günlerden biraz daha az karbonhidrat. Protein her gün aynı kalsın."

article: collagen
emoji: "🦴"
tips:
  - key: wat-is-collageen
    kind: fact
    en:
      title: "A third"
      body: "Of all the protein in your body is collagen. It's also most of the dry weight of your tendons."
    nl:
      title: "Een derde"
      body: "Van al het eiwit in je lichaam is collageen. Het is ook het grootste deel van het drooggewicht van je pezen."
    de:
      title: "Ein Drittel"
      body: "Allen Proteins im Körper ist Kollagen. Es macht auch den Großteil des Trockengewichts deiner Sehnen aus."
    es:
      title: "Un tercio"
      body: "De toda la proteína de tu cuerpo es colágeno. También es casi todo el peso seco de tus tendones."
    fr:
      title: "Un tiers"
      body: "Des protéines de ton corps, c'est du collagène. C'est aussi l'essentiel du poids sec de tes tendons."
    pt:
      title: "Um terço"
      body: "De toda a proteína do corpo é colagénio. É também a maior parte do peso seco dos tendões."
    tr:
      title: "Üçte bir"
      body: "Vücudundaki tüm proteinin bu kadarı kolajendir. Tendonlarının kuru ağırlığının da çoğunu oluşturur."

  - key: geen-spiereiwit
    kind: myth
    en:
      title: "30 g"
      body: "Myth: collagen builds muscle like whey. It lacks tryptophan, and 30 g built less muscle than 30 g of whey."
    nl:
      title: "30 gram"
      body: "Mythe: collageen bouwt spier zoals whey. Het mist tryptofaan, en 30 gram gaf minder spieropbouw dan 30 gram whey."
    de:
      title: "30 g"
      body: "Mythos: Kollagen baut Muskeln wie Whey. Ihm fehlt Tryptophan, und 30 g brachten weniger Aufbau als 30 g Whey."
    es:
      title: "30 g"
      body: "Mito: el colágeno da músculo como el whey. Le falta triptófano, y 30 g dieron menos síntesis que 30 g de whey."
    fr:
      title: "30 g"
      body: "Mythe : le collagène fait du muscle comme la whey. Il manque de tryptophane, et 30 g ont fait moins que 30 g de whey."
    pt:
      title: "30 g"
      body: "Mito: o colagénio dá músculo como a whey. Falta-lhe triptofano, e 30 g deram menos síntese do que 30 g de whey."
    tr:
      title: "30 g"
      body: "Efsane: kolajen whey gibi kas yapar. Triptofan içermez, 30 g'ı 30 g whey'den daha az kas yapımı sağladı."

  - key: huid
    kind: fact
    en:
      title: "2.5 g a day"
      body: "Of one collagen product for 8 weeks: EFSA found no better skin shown. That's one product, not all of them."
    nl:
      title: "2,5 gram per dag"
      body: "Van één collageenproduct, 8 weken lang: volgens EFSA geen betere huid aangetoond. Eén product, niet alle."
    de:
      title: "2,5 g am Tag"
      body: "Eines Kollagenprodukts über 8 Wochen: Laut EFSA keine bessere Haut belegt. Ein Produkt, nicht alle."
    es:
      title: "2,5 g al día"
      body: "De un colágeno durante 8 semanas: según la EFSA, no se demostró mejor piel. Es un producto, no todos."
    fr:
      title: "2,5 g par jour"
      body: "D'un collagène pendant 8 semaines : selon l'EFSA, pas de meilleure peau prouvée. Un produit, pas tous."
    pt:
      title: "2,5 g por dia"
      body: "De um colagénio durante 8 semanas: segundo a EFSA, não se provou pele melhor. É um produto, não todos."
    tr:
      title: "Günde 2,5 g"
      body: "Bir kolajen ürünü 8 hafta: EFSA'ya göre daha iyi cilt kanıtlanmadı. Tek bir ürün, hepsi değil."

  - key: gewrichten
    kind: fact
    en:
      title: "5 or 10 g"
      body: "A day for 3 to 6 months eased joint pain in five small trials. The European regulator wasn't convinced."
    nl:
      title: "5 of 10 gram"
      body: "Per dag, 3 tot 6 maanden: vijf kleine studies zagen minder gewrichtspijn. De Europese toezichthouder was niet overtuigd."
    de:
      title: "5 oder 10 g"
      body: "Am Tag über 3 bis 6 Monate linderten in fünf kleinen Studien Gelenkschmerz. Die EU-Behörde überzeugte das nicht."
    es:
      title: "5 o 10 g"
      body: "Al día, 3 a 6 meses: menos dolor articular en cinco estudios pequeños. El regulador europeo no se convenció."
    fr:
      title: "5 ou 10 g"
      body: "Par jour, 3 à 6 mois : moins de douleurs articulaires dans cinq petites études. L'autorité européenne doute."
    pt:
      title: "5 ou 10 g"
      body: "Por dia, 3 a 6 meses: menos dor articular em cinco estudos pequenos. O regulador europeu não ficou convencido."
    tr:
      title: "5 veya 10 g"
      body: "Günde, 3-6 ay boyunca beş küçük çalışmada eklem ağrısını azalttı. Avrupa otoritesi ikna olmadı."

  - key: placebo-ook
    kind: fact
    en:
      title: "24 weeks"
      body: "Of 10 g collagen a day: joint pain fell in student athletes, but on placebo too. No real difference."
    nl:
      title: "24 weken"
      body: "10 gram collageen per dag: gewrichtspijn zakte bij studentsporters, maar ook met placebo. Geen echt verschil."
    de:
      title: "24 Wochen"
      body: "10 g Kollagen am Tag: Gelenkschmerz sank bei Studentensportlern, aber auch mit Placebo. Kein echter Unterschied."
    es:
      title: "24 semanas"
      body: "De 10 g de colágeno al día: el dolor bajó en atletas universitarios, pero también con placebo. Sin diferencia real."
    fr:
      title: "24 semaines"
      body: "De 10 g de collagène par jour : la douleur a baissé chez des étudiants sportifs, mais aussi sous placebo."
    pt:
      title: "24 semanas"
      body: "De 10 g de colagénio por dia: a dor baixou em atletas universitários, mas também com placebo. Sem diferença real."
    tr:
      title: "24 hafta"
      body: "Günde 10 g kolajen: öğrenci sporcularda eklem ağrısı azaldı ama plaseboda da. Gerçek fark yok."

  - key: pezen
    kind: fact
    en:
      title: "3 of 4 studies"
      body: "Saw thicker tendons with collagen than with placebo, alongside heavy training. So: maybe."
    nl:
      title: "3 van 4 studies"
      body: "Zagen dikkere pezen met collageen dan met placebo, bij zware training. Dus: misschien."
    de:
      title: "3 von 4 Studien"
      body: "Sahen mit Kollagen dickere Sehnen als mit Placebo, bei hartem Training. Also: vielleicht."
    es:
      title: "3 de 4 estudios"
      body: "Vieron tendones más gruesos con colágeno que con placebo, con entreno duro. O sea: quizá."
    fr:
      title: "3 études sur 4"
      body: "Ont vu des tendons plus épais avec du collagène qu'avec un placebo, avec un entraînement lourd. Donc : peut-être."
    pt:
      title: "3 de 4 estudos"
      body: "Viram tendões mais grossos com colagénio do que com placebo, com treino pesado. Ou seja: talvez."
    tr:
      title: "4 çalışmanın 3'ü"
      body: "Ağır antrenmanla kolajende plasebodan daha kalın tendon gördü. Yani: belki."

  - key: dosis-pezen
    kind: fact
    en:
      title: "15 to 30 g"
      body: "Collagen with at least 50 mg of vitamin C, reviewers suggest for tendons. A suggestion, not a tested plan."
    nl:
      title: "15 tot 30 gram"
      body: "Collageen met minstens 50 mg vitamine C, opperen reviewers voor pezen. Een suggestie, geen getest plan."
    de:
      title: "15 bis 30 g"
      body: "Kollagen mit mindestens 50 mg Vitamin C schlagen Fachleute für Sehnen vor. Ein Vorschlag, kein getesteter Plan."
    es:
      title: "15 a 30 g"
      body: "De colágeno con al menos 50 mg de vitamina C, sugieren para tendones. Una sugerencia, no un plan probado."
    fr:
      title: "15 à 30 g"
      body: "De collagène avec au moins 50 mg de vitamine C, suggèrent des experts pour les tendons. Pas un protocole testé."
    pt:
      title: "15 a 30 g"
      body: "De colagénio com pelo menos 50 mg de vitamina C, sugerem para tendões. Uma sugestão, não um plano testado."
    tr:
      title: "15-30 g"
      body: "Tendonlar için en az 50 mg C vitaminiyle bu kadar kolajen öneriliyor. Test edilmiş plan değil, öneri."

  - key: kracht
    kind: myth
    en:
      title: "Stronger"
      body: "Myth: collagen makes you stronger. In six trials, training raised strength and collagen added nothing."
    nl:
      title: "Sterker"
      body: "Mythe: collageen maakt je sterker. In zes studies steeg de kracht door training, collageen voegde niets toe."
    de:
      title: "Stärker"
      body: "Mythos: Kollagen macht stärker. In sechs Studien stieg die Kraft durchs Training, Kollagen brachte nichts dazu."
    es:
      title: "Más fuerza"
      body: "Mito: el colágeno te hace más fuerte. En seis ensayos la fuerza subió por el entreno y el colágeno no sumó."
    fr:
      title: "Plus fort"
      body: "Mythe : le collagène rend plus fort. Dans six essais, la force a monté avec l'entraînement, sans bonus du collagène."
    pt:
      title: "Mais forte"
      body: "Mito: o colagénio torna-te mais forte. Em seis ensaios a força subiu com o treino e o colagénio não somou."
    tr:
      title: "Daha güçlü"
      body: "Efsane: kolajen güçlendirir. Altı çalışmada güç antrenmanla arttı, kolajen bir şey katmadı."

  - key: artrose
    kind: fact
    en:
      title: "Arthritis"
      body: "The joint review left out people with osteoarthritis. So it can't tell you whether collagen helps there."
    nl:
      title: "Artrose"
      body: "De gewrichtsreview liet mensen met artrose buiten beschouwing. Of collageen daarbij helpt, weet je dus niet."
    de:
      title: "Arthrose"
      body: "Die Gelenk-Übersicht ließ Menschen mit Arthrose außen vor. Ob Kollagen da hilft, sagt sie also nicht."
    es:
      title: "Artrosis"
      body: "La revisión dejó fuera a personas con artrosis. Así que no dice si el colágeno ayuda en ese caso."
    fr:
      title: "Arthrose"
      body: "La revue sur les articulations a exclu l'arthrose. Elle ne dit donc pas si le collagène aide dans ce cas."
    pt:
      title: "Artrose"
      body: "A revisão deixou de fora pessoas com artrose. Por isso não diz se o colagénio ajuda nesse caso."
    tr:
      title: "Kireçlenme"
      body: "Eklem derlemesi kireçlenmesi olanları dışarıda bıraktı. Yani kolajenin orada işe yarayıp yaramadığını söylemiyor."

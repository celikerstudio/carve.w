article: progressive-overload
emoji: "🧗"
tips:
  - key: langere-termijn
    kind: fact
    en:
      title: "A bit harder"
      body: "Lifting helps before you add anything. To keep improving, you likely need to make it harder over time."
    nl:
      title: "Iets zwaarder"
      body: "Tillen helpt al voor je iets toevoegt. Om vooruit te blijven gaan moet het waarschijnlijk steeds iets zwaarder."
    de:
      title: "Etwas härter"
      body: "Krafttraining hilft schon, bevor du steigerst. Für weiteren Fortschritt muss es wohl mit der Zeit härter werden."
    es:
      title: "Algo más duro"
      body: "Las pesas ayudan antes de sumar nada. Para seguir mejorando, seguramente debas ponerlo más duro con el tiempo."
    fr:
      title: "Un peu plus dur"
      body: "La muscu aide avant même d'ajouter quoi que ce soit. Pour progresser encore, il faudra sans doute corser."
    pt:
      title: "Um pouco mais duro"
      body: "O treino ajuda antes de juntares algo. Para continuar a melhorar, deves torná-lo mais duro com o tempo."
    tr:
      title: "Biraz daha zor"
      body: "Ağırlık bir şey eklemeden de işe yarar. Gelişmeye devam etmek için zamanla zorlaştırman gerekebilir."

  - key: niet-elke-sessie
    kind: myth
    en:
      title: "Every session"
      body: "Myth: add weight every session. An extra rep, a cleaner rep or one more set at the same weight is progress too."
    nl:
      title: "Elke training"
      body: "Mythe: elke training meer gewicht. Een herhaling extra, een nettere herhaling of een set meer is ook vooruitgang."
    de:
      title: "Jede Einheit"
      body: "Mythos: Jede Einheit mehr Gewicht. Eine Wiederholung mehr, eine saubere oder ein Satz mehr ist auch Fortschritt."
    es:
      title: "Cada sesión"
      body: "Mito: sube peso cada sesión. Una repetición más, más limpia o una serie extra también es progreso."
    fr:
      title: "Chaque séance"
      body: "Mythe : plus lourd à chaque séance. Une rep de plus, une rep plus propre ou une série en plus, c'est aussi progresser."
    pt:
      title: "Cada treino"
      body: "Mito: sobe o peso em cada treino. Uma repetição a mais, mais limpa ou uma série extra também é progresso."
    tr:
      title: "Her antrenman"
      body: "Efsane: her antrenmanda ağırlık ekle. Bir tekrar fazlası, daha temiz tekrar ya da bir set fazlası da ilerlemedir."

  - key: reps-erbij
    kind: fact
    en:
      title: "More reps"
      body: "Adding reps or adding weight gave similar results over 8 weeks, in 43 people with leg training experience."
    nl:
      title: "Meer herhalingen"
      body: "Herhalingen of gewicht toevoegen gaf over 8 weken vergelijkbare resultaten, bij 43 ervaren mensen."
    de:
      title: "Mehr Wiederholungen"
      body: "Mehr Wiederholungen oder mehr Gewicht brachten in 8 Wochen ähnliche Ergebnisse, bei 43 Erfahrenen."
    es:
      title: "Más repeticiones"
      body: "Sumar repeticiones o peso dio resultados parecidos en 8 semanas, en 43 personas con experiencia."
    fr:
      title: "Plus de reps"
      body: "Ajouter des reps ou du poids a donné des résultats proches sur 8 semaines, chez 43 personnes entraînées."
    pt:
      title: "Mais repetições"
      body: "Juntar repetições ou peso deu resultados parecidos em 8 semanas, em 43 pessoas com experiência."
    tr:
      title: "Daha çok tekrar"
      body: "Tekrar ya da ağırlık eklemek, 43 deneyimli kişide 8 haftada benzer sonuç verdi."

  - key: wanneer-zwaarder
    kind: fact
    en:
      title: "2 to 10%"
      body: "Add that much after beating your rep target by 1 or 2, two sessions in a row. An old ACSM rule of thumb."
    nl:
      title: "2 tot 10%"
      body: "Zoveel gewicht erbij als je twee trainingen op rij 1 of 2 herhalingen boven je doel zit. Een oude ACSM-vuistregel."
    de:
      title: "2 bis 10 %"
      body: "So viel mehr, wenn du dein Wdh.-Ziel zwei Einheiten in Folge um 1 oder 2 übertriffst. Alte ACSM-Faustregel."
    es:
      title: "2 a 10 %"
      body: "Sube eso tras superar tu meta en 1 o 2 repeticiones dos sesiones seguidas. Una vieja regla del ACSM."
    fr:
      title: "2 à 10 %"
      body: "Ajoute ça après avoir dépassé ta cible de 1 ou 2 reps deux séances de suite. Vieille règle de l'ACSM."
    pt:
      title: "2 a 10%"
      body: "Sobe isso depois de passar a meta em 1 ou 2 repetições dois treinos seguidos. Uma velha regra do ACSM."
    tr:
      title: "%2-10"
      body: "İki antrenman üst üste hedef tekrarı 1-2 aşınca bu kadar ekle. Eski bir ACSM kuralı."

  - key: kleine-stap
    kind: fact
    en:
      title: "Small steps"
      body: "A big jump makes form and reps hard. A small step every few weeks adds up over a year."
    nl:
      title: "Kleine stapjes"
      body: "Een grote sprong maakt techniek en herhalingen lastig. Elke paar weken een stapje telt op over een jaar."
    de:
      title: "Kleine Schritte"
      body: "Ein großer Sprung macht Technik und Wiederholungen schwer. Alle paar Wochen ein kleiner Schritt summiert sich."
    es:
      title: "Pasos pequeños"
      body: "Un salto grande complica técnica y repeticiones. Un paso pequeño cada pocas semanas suma en un año."
    fr:
      title: "Petits pas"
      body: "Un gros saut rend la technique et les reps difficiles. Un petit pas toutes les quelques semaines s'additionne."
    pt:
      title: "Passos pequenos"
      body: "Um salto grande dificulta técnica e repetições. Um passo pequeno a cada poucas semanas soma num ano."
    tr:
      title: "Küçük adımlar"
      body: "Büyük sıçrama formu ve tekrarları zorlaştırır. Birkaç haftada bir küçük adım bir yılda birikir."

  - key: slechte-dag
    kind: myth
    en:
      title: "Bad session"
      body: "Myth: a bad session means lost strength. Sleep, food and stress vary. Look at the trend over 3 or 4 weeks."
    nl:
      title: "Slechte training"
      body: "Mythe: een slechte training is kracht kwijt. Slaap, eten en stress wisselen. Kijk naar 3 of 4 weken."
    de:
      title: "Schlechte Einheit"
      body: "Mythos: Eine schlechte Einheit heißt Kraft verloren. Schlaf, Essen, Stress schwanken. Schau auf 3 bis 4 Wochen."
    es:
      title: "Mala sesión"
      body: "Mito: una mala sesión es fuerza perdida. Sueño, comida y estrés varían. Mira la tendencia de 3 o 4 semanas."
    fr:
      title: "Mauvaise séance"
      body: "Mythe : une mauvaise séance, c'est de la force perdue. Sommeil, repas, stress varient. Regarde 3 ou 4 semaines."
    pt:
      title: "Treino mau"
      body: "Mito: um treino mau é força perdida. Sono, comida e stress variam. Olha para a tendência de 3 ou 4 semanas."
    tr:
      title: "Kötü antrenman"
      body: "Efsane: kötü bir antrenman güç kaybı demek. Uyku, beslenme ve stres değişir. 3-4 haftalık eğilime bak."

  - key: vastlopen
    kind: myth
    en:
      title: "A stall"
      body: "Myth: a stall means your plan is wrong. Stalls are normal. Check log, sleep and food, then a set more or a smaller step."
    nl:
      title: "Vastlopen"
      body: "Mythe: vastlopen is een fout schema. Normaal. Check logboek, slaap en eten. Dan een set meer of een kleinere stap."
    de:
      title: "Stillstand"
      body: "Mythos: Stillstand heißt falscher Plan. Ist normal. Prüf Log, Schlaf, Essen. Dann ein Satz mehr oder kleinere Schritte."
    es:
      title: "Estancarse"
      body: "Mito: estancarse es tener mal plan. Es normal. Revisa registro, sueño y comida, luego una serie más o un paso menor."
    fr:
      title: "Stagner"
      body: "Mythe : stagner veut dire mauvais plan. Non, c'est normal. Vois carnet, sommeil, repas, puis ajoute une série."
    pt:
      title: "Estagnar"
      body: "Mito: estagnar é ter um mau plano. É normal. Vê registo, sono e comida, depois uma série a mais ou um passo menor."
    tr:
      title: "Takılmak"
      body: "Efsane: takılmak planın yanlış demek. Bu normal. Kaydına, uykuna, beslenmene bak, sonra bir set ekle ya da adımı küçült."

  - key: techniek
    kind: fact
    en:
      title: "Deeper reps"
      body: "A deeper, controlled rep is harder than a bouncy one at the same weight. That's progress too."
    nl:
      title: "Diepere herhalingen"
      body: "Een diepere, gecontroleerde herhaling is zwaarder dan een stuiterende, bij hetzelfde gewicht. Ook vooruitgang."
    de:
      title: "Tiefere Wdh."
      body: "Eine tiefere, kontrollierte Wiederholung ist härter als eine federnde, beim gleichen Gewicht. Auch Fortschritt."
    es:
      title: "Más profundidad"
      body: "Una repetición más profunda y controlada cuesta más que una con rebote, con el mismo peso. También es progreso."
    fr:
      title: "Reps plus profondes"
      body: "Une rep plus profonde et contrôlée est plus dure qu'une rep qui rebondit, à poids égal. C'est un progrès."
    pt:
      title: "Mais profundidade"
      body: "Uma repetição mais funda e controlada custa mais do que uma com ressalto, com o mesmo peso. É progresso."
    tr:
      title: "Daha derin tekrar"
      body: "Aynı ağırlıkta daha derin ve kontrollü tekrar, sekmeli olandan zordur. Bu da ilerleme."

  - key: kleine-oefeningen
    kind: fact
    en:
      title: "Lateral raises"
      body: "A small percentage can be less than your lightest plate there. Add reps until you can make the jump."
    nl:
      title: "Laterale raises"
      body: "Een klein percentage is daar soms minder dan je lichtste schijf. Doe herhalingen erbij tot je de sprong kunt maken."
    de:
      title: "Seitheben"
      body: "Ein kleiner Prozentsatz ist da oft weniger als die leichteste Scheibe. Mach mehr Wdh., bis der Sprung geht."
    es:
      title: "Elevaciones laterales"
      body: "Ahí un porcentaje pequeño puede ser menos que tu disco más ligero. Suma repeticiones hasta poder saltar."
    fr:
      title: "Élévations latérales"
      body: "Un petit pourcentage peut y être plus léger que ton plus petit disque. Ajoute des reps jusqu'au saut."
    pt:
      title: "Elevações laterais"
      body: "Aí uma percentagem pequena pode ser menos do que o disco mais leve. Junta repetições até dares o salto."
    tr:
      title: "Yana açış"
      body: "Orada küçük bir yüzde en hafif plakandan bile az olabilir. Atlamaya hazır olana kadar tekrar ekle."

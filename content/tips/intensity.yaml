article: intensity
emoji: "🎚️"
tips:
  - key: twee-betekenissen
    kind: myth
    en:
      title: "How heavy"
      body: "Myth: intensity means how heavy the weight is. It can also mean how close to failure you end a set."
    nl:
      title: "Hoe zwaar"
      body: "Mythe: intensiteit is hoe zwaar het gewicht is. Het kan ook betekenen hoe dicht bij falen je een set stopt."
    de:
      title: "Wie schwer"
      body: "Mythos: Intensität heißt, wie schwer das Gewicht ist. Es kann auch heißen, wie nah am Versagen du aufhörst."
    es:
      title: "Cuánto pesa"
      body: "Mito: intensidad es cuánto pesa la carga. También puede ser lo cerca del fallo que acabas la serie."
    fr:
      title: "Combien c'est lourd"
      body: "Mythe : l'intensité, c'est le poids de la charge. Ça peut aussi être ta proximité de l'échec."
    pt:
      title: "Quão pesado"
      body: "Mito: intensidade é o peso da carga. Também pode ser quão perto da falha acabas a série."
    tr:
      title: "Ne kadar ağır"
      body: "Efsane: yoğunluk ağırlığın ne kadar olduğudur. Seti tükenişe ne kadar yakın bitirdiğin de olabilir."

  - key: beginners-niet-tot-falen
    kind: myth
    en:
      title: "Beginners"
      body: "Myth: beginners must train close to failure. Experts say novices grow well without it. The need grows with experience."
    nl:
      title: "Beginners"
      body: "Mythe: beginners moeten dicht bij falen trainen. Volgens experts groeien ze prima zonder. Dat wordt pas later nodig."
    de:
      title: "Anfänger"
      body: "Mythos: Anfänger müssen nah ans Versagen. Laut Fachleuten wachsen sie auch so gut. Das braucht es erst später."
    es:
      title: "Principiantes"
      body: "Mito: los novatos deben ir cerca del fallo. Según expertos crecen bien sin eso. Hace falta con la experiencia."
    fr:
      title: "Débutants"
      body: "Mythe : les débutants doivent frôler l'échec. Selon des experts, ils progressent bien sans. Ça vient avec l'expérience."
    pt:
      title: "Iniciantes"
      body: "Mito: iniciantes têm de ir perto da falha. Segundo especialistas crescem bem sem isso. É preciso com a experiência."
    tr:
      title: "Yeni başlayanlar"
      body: "Efsane: yeniler tükenişe yakın çalışmalı. Uzmanlara göre onsuz da iyi gelişirler. İhtiyaç deneyimle artar."

  - key: niet-te-makkelijk
    kind: fact
    en:
      title: "Too easy"
      body: "You don't need failure, but the ACSM still asks for high effort. Ending sets far from hard is a common mistake."
    nl:
      title: "Te makkelijk"
      body: "Falen hoeft niet, maar de ACSM vraagt wel flinke inzet. Sets ver van zwaar stoppen is een veelgemaakte fout."
    de:
      title: "Zu leicht"
      body: "Versagen musst du nicht, aber das ACSM will hohen Einsatz. Sätze weit vor schwer zu beenden ist ein häufiger Fehler."
    es:
      title: "Demasiado fácil"
      body: "No hace falta el fallo, pero el ACSM pide esfuerzo alto. Acabar las series muy lejos de duro es un error común."
    fr:
      title: "Trop facile"
      body: "Pas besoin d'aller à l'échec, mais l'ACSM veut un gros effort. Finir loin de la difficulté est une erreur courante."
    pt:
      title: "Fácil demais"
      body: "Não precisas da falha, mas o ACSM pede esforço alto. Acabar as séries longe do difícil é um erro comum."
    tr:
      title: "Fazla kolay"
      body: "Tükeniş şart değil ama ACSM yüksek efor istiyor. Setleri zorlanmadan bitirmek sık bir hata."

  - key: kracht-2009
    kind: fact
    en:
      title: "60% of 1RM"
      body: "Gave novices the most strength in data the ACSM cited in 2009, 80% trained lifters. The 2026 stand replaced that."
    nl:
      title: "60% van 1RM"
      body: "Gaf beginners de meeste kracht in ACSM-data uit 2009, 80% getrainden. Het standpunt van 2026 verving dat."
    de:
      title: "60 % vom 1RM"
      body: "Brachten Anfängern laut ACSM-Daten von 2009 am meisten Kraft, 80 % Trainierten. 2026 wurde das ersetzt."
    es:
      title: "60 % del 1RM"
      body: "Dio más fuerza a novatos en datos del ACSM de 2009, y el 80 % a entrenados. La postura de 2026 lo sustituyó."
    fr:
      title: "60 % du 1RM"
      body: "Donnait le plus de force aux débutants dans les données ACSM 2009, 80 % aux confirmés. Remplacé en 2026."
    pt:
      title: "60% do 1RM"
      body: "Deu mais força a iniciantes em dados do ACSM de 2009, e 80% a treinados. A posição de 2026 substituiu-o."
    tr:
      title: "1RM'nin %60'ı"
      body: "ACSM'nin 2009 verilerinde yenilere en çok gücü bu, deneyimlilere %80 verdi. 2026 bildirgesi bunu değiştirdi."

  - key: gemiddeld-gewicht
    kind: fact
    en:
      title: "Moderate loads"
      body: "For most of your sets, they may be the more practical choice for muscle growth, experts on athletes say."
    nl:
      title: "Gemiddeld gewicht"
      body: "Voor de meeste sets is dat misschien de praktischere keus voor spiergroei, zeggen experts over sporters."
    de:
      title: "Mittlere Lasten"
      body: "Für die meisten Sätze sind sie wohl die praktischere Wahl für Muskelwachstum, sagen Fachleute."
    es:
      title: "Cargas moderadas"
      body: "Para la mayoría de series pueden ser la opción más práctica para ganar músculo, dicen los expertos."
    fr:
      title: "Charges modérées"
      body: "Pour la plupart des séries, c'est peut-être le choix le plus pratique pour le muscle, disent des experts."
    pt:
      title: "Cargas moderadas"
      body: "Na maioria das séries podem ser a escolha mais prática para ganhar músculo, dizem especialistas."
    tr:
      title: "Orta yükler"
      body: "Uzmanlara göre setlerin çoğunda kas büyümesi için daha pratik seçim olabilir."

article: consistency
emoji: "📅"
tips:
  - key: geen-21-dagen
    kind: myth
    en:
      title: "21 days"
      body: "Myth: a habit takes 21 days. A review of 20 studies found typical times of 59 to 66 days."
    nl:
      title: "21 dagen"
      body: "Mythe: een gewoonte duurt 21 dagen. Een review van 20 studies vond doorgaans 59 tot 66 dagen."
    de:
      title: "21 Tage"
      body: "Mythos: Eine Gewohnheit braucht 21 Tage. Eine Übersicht über 20 Studien fand meist 59 bis 66 Tage."
    es:
      title: "21 días"
      body: "Mito: un hábito tarda 21 días. Una revisión de 20 estudios encontró de 59 a 66 días de media."
    fr:
      title: "21 jours"
      body: "Mythe : une habitude prend 21 jours. Une revue de 20 études a trouvé plutôt 59 à 66 jours."
    pt:
      title: "21 dias"
      body: "Mito: um hábito leva 21 dias. Uma revisão de 20 estudos encontrou tipicamente 59 a 66 dias."
    tr:
      title: "21 gün"
      body: "Efsane: alışkanlık 21 günde oluşur. 20 çalışmalık bir derleme genelde 59-66 gün buldu."

  - key: twee-tot-vijf-maanden
    kind: fact
    en:
      title: "2 to 5 months"
      body: "Plan on that before a habit feels automatic. The studies are few, so it's a range, not a deadline."
    nl:
      title: "2 tot 5 maanden"
      body: "Reken daarop voor een gewoonte vanzelf gaat. Er zijn weinig studies, dus zie het als bandbreedte."
    de:
      title: "2 bis 5 Monate"
      body: "Plan so viel ein, bis eine Gewohnheit sitzt. Es gibt wenige Studien, also eine Spanne, keine Frist."
    es:
      title: "2 a 5 meses"
      body: "Cuenta con eso antes de que un hábito sea automático. Hay pocos estudios: es un rango, no una fecha."
    fr:
      title: "2 à 5 mois"
      body: "Prévois ça avant qu'une habitude soit automatique. Peu d'études, donc c'est une fourchette, pas un délai."
    pt:
      title: "2 a 5 meses"
      body: "Conta com isso até um hábito ser automático. Há poucos estudos: é um intervalo, não um prazo."
    tr:
      title: "2-5 ay"
      body: "Bir alışkanlığın otomatikleşmesi için bunu hesapla. Çalışma az, bu bir aralık, son tarih değil."

  - key: eigen-tempo
    kind: fact
    en:
      title: "4 to 335 days"
      body: "Estimates for one eating habit ranged that wide in a trial, partly projected. People differ a lot."
    nl:
      title: "4 tot 335 dagen"
      body: "Zo ver liepen schattingen voor één eetgewoonte uiteen, deels doorgerekend. Mensen verschillen enorm."
    de:
      title: "4 bis 335 Tage"
      body: "So weit lagen Schätzungen für eine Essgewohnheit auseinander, teils hochgerechnet. Menschen sind verschieden."
    es:
      title: "4 a 335 días"
      body: "Es lo que variaron las estimaciones para un hábito de comida, en parte proyectadas. Cada persona es distinta."
    fr:
      title: "4 à 335 jours"
      body: "C'est l'écart des estimations pour une habitude alimentaire, en partie extrapolées. On est tous différents."
    pt:
      title: "4 a 335 dias"
      body: "Foi o intervalo das estimativas para um hábito alimentar, em parte projetadas. As pessoas variam muito."
    tr:
      title: "4-335 gün"
      body: "Bir beslenme alışkanlığı için tahminler bu kadar değişti, kısmen hesaplanarak. İnsanlar çok farklı."

  - key: dag-gemist
    kind: myth
    en:
      title: "One missed day"
      body: "Myth: one missed day breaks a habit. In a 12-week study it barely mattered. Just carry on the next day."
    nl:
      title: "Eén dag gemist"
      body: "Mythe: één gemiste dag breekt een gewoonte. In een studie van 12 weken maakte het weinig uit. Ga morgen gewoon door."
    de:
      title: "Ein Tag verpasst"
      body: "Mythos: Ein verpasster Tag zerstört die Gewohnheit. In einer 12-Wochen-Studie kaum. Mach am nächsten Tag weiter."
    es:
      title: "Un día perdido"
      body: "Mito: saltarte un día rompe el hábito. En un estudio de 12 semanas apenas importó. Sigue al día siguiente."
    fr:
      title: "Un jour raté"
      body: "Mythe : rater un jour casse l'habitude. Sur une étude de 12 semaines, ça n'a presque rien changé. Reprends le lendemain."
    pt:
      title: "Um dia falhado"
      body: "Mito: falhar um dia quebra o hábito. Num estudo de 12 semanas quase não importou. Continua no dia seguinte."
    tr:
      title: "Bir gün kaçırmak"
      body: "Efsane: bir gün kaçırmak alışkanlığı bozar. 12 haftalık bir çalışmada pek fark etmedi. Ertesi gün devam et."

  - key: niet-inhalen
    kind: fact
    en:
      title: "Missed a day"
      body: "Just go back to your normal plan. No need to train double or eat much less the next day."
    nl:
      title: "Dag gemist"
      body: "Ga gewoon verder met je normale plan. Niet dubbel trainen en de dag erna ook niet veel minder eten."
    de:
      title: "Tag verpasst"
      body: "Mach einfach mit deinem normalen Plan weiter. Kein doppeltes Training, am Tag danach nicht viel weniger essen."
    es:
      title: "Te saltaste un día"
      body: "Vuelve a tu plan normal. No hace falta entrenar doble ni comer mucho menos al día siguiente."
    fr:
      title: "Jour manqué"
      body: "Reprends ton plan normal. Pas besoin de doubler la séance ni de beaucoup moins manger le lendemain."
    pt:
      title: "Falhaste um dia"
      body: "Volta ao plano normal. Não precisas de treinar a dobrar nem de comer muito menos no dia seguinte."
    tr:
      title: "Bir gün kaçtı"
      body: "Normal planına dön. Ertesi gün iki kat çalışmaya ya da çok az yemeye gerek yok."

  - key: zelfde-plek
    kind: fact
    en:
      title: "Same time, same place"
      body: "A stable setting built stronger habits. Train at a set time and place, bag packed the night before."
    nl:
      title: "Vaste tijd, vaste plek"
      body: "Een vaste omgeving gaf sterkere gewoontes. Train op een vast moment en plek, tas de avond ervoor ingepakt."
    de:
      title: "Feste Zeit, fester Ort"
      body: "Ein stabiles Umfeld schuf stärkere Gewohnheiten. Trainier fest, die Tasche am Vorabend gepackt."
    es:
      title: "Misma hora y lugar"
      body: "Un entorno estable creó hábitos más fuertes. Entrena a hora y lugar fijos, con la bolsa lista la noche antes."
    fr:
      title: "Même heure, même lieu"
      body: "Un cadre stable a créé des habitudes plus fortes. Heure et lieu fixes, sac prêt la veille."
    pt:
      title: "Mesma hora e sítio"
      body: "Um contexto estável criou hábitos mais fortes. Treina a hora e sítio fixos, saco feito na véspera."
    tr:
      title: "Aynı saat, aynı yer"
      body: "Sabit bir ortam daha güçlü alışkanlık kurdu. Sabit saatte ve yerde çalış, çantanı önceki akşam hazırla."

  - key: vast-signaal
    kind: fact
    en:
      title: "After breakfast"
      body: "Tying a habit to a routine like this worked about as well as a set time, in a trial of 192 adults."
    nl:
      title: "Na het ontbijt"
      body: "Een gewoonte koppelen aan zo'n routine werkte ongeveer even goed als een vaste tijd, bij 192 volwassenen."
    de:
      title: "Nach dem Frühstück"
      body: "Eine Gewohnheit an so eine Routine zu koppeln wirkte etwa so gut wie eine feste Uhrzeit, bei 192 Erwachsenen."
    es:
      title: "Tras desayunar"
      body: "Unir un hábito a una rutina así funcionó casi igual que una hora fija, en un ensayo con 192 adultos."
    fr:
      title: "Après le petit-déj"
      body: "Lier une habitude à une routine marchait presque aussi bien qu'une heure fixe, chez 192 adultes."
    pt:
      title: "Após o pequeno-almoço"
      body: "Ligar um hábito a uma rotina assim funcionou quase como uma hora fixa, em 192 adultos."
    tr:
      title: "Kahvaltıdan sonra"
      body: "Alışkanlığı böyle bir rutine bağlamak, 192 yetişkinde sabit saat kadar işe yaradı."

  - key: zelf-kiezen
    kind: fact
    en:
      title: "Your own choice"
      body: "Habits people picked themselves ended up stronger than ones handed to them, in one study."
    nl:
      title: "Zelf kiezen"
      body: "Gewoontes die mensen zelf kozen werden sterker dan gewoontes die ze kregen opgelegd, in één studie."
    de:
      title: "Selbst gewählt"
      body: "Selbst gewählte Gewohnheiten wurden in einer Studie stärker als vorgegebene."
    es:
      title: "Elegido por ti"
      body: "Los hábitos que la gente eligió fueron más fuertes que los impuestos, en un estudio."
    fr:
      title: "Ton choix"
      body: "Les habitudes choisies soi-même sont devenues plus fortes que celles imposées, dans une étude."
    pt:
      title: "Escolha tua"
      body: "Os hábitos escolhidos pela própria pessoa ficaram mais fortes do que os impostos, num estudo."
    tr:
      title: "Kendi seçimin"
      body: "Bir çalışmada insanların kendi seçtiği alışkanlıklar, verilenlerden daha güçlü oldu."

  - key: eerste-herhalingen
    kind: fact
    en:
      title: "Early days"
      body: "A habit grows fastest in the first repetitions. Later ones add less."
    nl:
      title: "De eerste keren"
      body: "Een gewoonte groeit het snelst in de eerste herhalingen. Latere voegen minder toe."
    de:
      title: "Die ersten Male"
      body: "Eine Gewohnheit wächst in den ersten Wiederholungen am schnellsten. Spätere bringen weniger."
    es:
      title: "Los primeros días"
      body: "Un hábito crece más rápido en las primeras repeticiones. Las siguientes suman menos."
    fr:
      title: "Les premiers jours"
      body: "Une habitude grandit le plus vite au début. Les fois suivantes ajoutent moins."
    pt:
      title: "Os primeiros dias"
      body: "Um hábito cresce mais depressa nas primeiras repetições. As seguintes somam menos."
    tr:
      title: "İlk günler"
      body: "Alışkanlık en hızlı ilk tekrarlarda gelişir. Sonrakiler daha az katkı sağlar."

  - key: welk-dieet
    kind: myth
    en:
      title: "The right diet"
      body: "Myth: picking the right diet is key. In a year-long trial of four diets, sticking to one mattered. Which hardly did."
    nl:
      title: "Het juiste dieet"
      body: "Mythe: het juiste dieet kiezen is de sleutel. In een jaarstudie met vier diëten telde volhouden, niet welk."
    de:
      title: "Die richtige Diät"
      body: "Mythos: Die richtige Diät ist entscheidend. In einer Jahresstudie mit vier Diäten zählte Durchhalten, nicht welche."
    es:
      title: "La dieta correcta"
      body: "Mito: elegir bien la dieta es la clave. En un ensayo de un año con cuatro dietas, importó cumplirla, no cuál."
    fr:
      title: "Le bon régime"
      body: "Mythe : choisir le bon régime est la clé. Sur un an et quatre régimes, c'est le suivi qui a compté, pas lequel."
    pt:
      title: "A dieta certa"
      body: "Mito: escolher a dieta certa é a chave. Num ensaio de um ano com quatro dietas, contou cumpri-la, não qual."
    tr:
      title: "Doğru diyet"
      body: "Efsane: önemli olan doğru diyeti seçmek. Dört diyetli bir yıllık çalışmada önemli olan sürdürmekti, hangisi değil."

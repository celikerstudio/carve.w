article: protein-sources
emoji: "🥚"
tips:
  - key: leucine-schakelaar
    kind: fact
    en:
      title: "1 to 3 g"
      body: "Leucine in a meal switches on muscle building. 20 to 40 g of protein from a good source gets you there."
    nl:
      title: "1 tot 3 gram"
      body: "Leucine in een maaltijd zet spieropbouw aan. 20 tot 40 gram eiwit uit een goede bron brengt je daar."
    de:
      title: "1 bis 3 g"
      body: "Leucin in einer Mahlzeit schalten den Muskelaufbau ein. 20 bis 40 g Protein aus guter Quelle reichen dafür."
    es:
      title: "1 a 3 g"
      body: "De leucina en una comida activan la síntesis muscular. 20 a 40 g de proteína de buena fuente te llevan ahí."
    fr:
      title: "1 à 3 g"
      body: "De leucine par repas lancent la construction musculaire. 20 à 40 g de bonnes protéines y suffisent."
    pt:
      title: "1 a 3 g"
      body: "De leucina numa refeição ligam a síntese muscular. 20 a 40 g de proteína de boa fonte chegam."
    tr:
      title: "1-3 g"
      body: "Bir öğündeki bu kadar lösin kas yapımını başlatır. İyi bir kaynaktan 20-40 g protein bunu sağlar."

  - key: geen-leucine-los
    kind: myth
    en:
      title: "Leucine pills"
      body: "Myth: a leucine supplement builds muscle. You need the other essential amino acids too. Get it from good protein."
    nl:
      title: "Leucinepillen"
      body: "Mythe: een leucinesupplement bouwt spier. Je hebt ook de andere essentiële aminozuren nodig. Haal het uit goed eiwit."
    de:
      title: "Leucin-Kapseln"
      body: "Mythos: Ein Leucin-Supplement baut Muskeln. Du brauchst auch die anderen essenziellen Aminosäuren. Nimm gutes Protein."
    es:
      title: "Pastillas de leucina"
      body: "Mito: un suplemento de leucina da músculo. Necesitas también el resto de aminoácidos esenciales. Tómala de proteína."
    fr:
      title: "Gélules de leucine"
      body: "Mythe : la leucine en gélule fait du muscle. Il faut aussi les autres acides aminés essentiels."
    pt:
      title: "Cápsulas de leucina"
      body: "Mito: um suplemento de leucina dá músculo. Precisas também dos outros aminoácidos essenciais. Tira-a de boa proteína."
    tr:
      title: "Lösin hapı"
      body: "Efsane: lösin takviyesi kas yapar. Diğer temel amino asitler de gerekir. Lösini iyi proteinden al."

  - key: soja-net-als-melk
    kind: myth
    en:
      title: "Soy"
      body: "Myth: you can't build muscle on plant protein. Vegans on soy gained as much as whey eaters in a 12-week study."
    nl:
      title: "Soja"
      body: "Mythe: met plantaardig eiwit bouw je geen spier. Veganisten op soja groeiden in 12 weken even hard als whey-eters."
    de:
      title: "Soja"
      body: "Mythos: Mit Pflanzenprotein baust du keine Muskeln. Veganer mit Soja legten in 12 Wochen so viel zu wie Whey-Nutzer."
    es:
      title: "Soja"
      body: "Mito: con proteína vegetal no ganas músculo. Veganos con soja ganaron lo mismo que con whey en 12 semanas."
    fr:
      title: "Soja"
      body: "Mythe : pas de muscle avec des protéines végétales. Des végans au soja ont pris autant que sous whey en 12 semaines."
    pt:
      title: "Soja"
      body: "Mito: com proteína vegetal não ganhas músculo. Veganos com soja ganharam o mesmo do que com whey em 12 semanas."
    tr:
      title: "Soya"
      body: "Efsane: bitkisel proteinle kas yapılmaz. 12 haftalık çalışmada soya alan veganlar whey alanlar kadar kazandı."

  - key: kracht-plantaardig
    kind: myth
    en:
      title: "30 trials"
      body: "Myth: plant protein makes you weaker. Muscle gains were slightly lower with most plant protein, strength the same."
    nl:
      title: "30 studies"
      body: "Mythe: plantaardig eiwit maakt je zwakker. Spiergroei was met de meeste plantaardige eiwitten iets lager, kracht gelijk."
    de:
      title: "30 Studien"
      body: "Mythos: Pflanzenprotein macht schwächer. Der Muskelzuwachs war meist etwas geringer, die Kraft gleich."
    es:
      title: "30 ensayos"
      body: "Mito: la proteína vegetal te debilita. El músculo creció algo menos con casi todas, pero la fuerza fue igual."
    fr:
      title: "30 essais"
      body: "Mythe : les protéines végétales affaiblissent. Un peu moins de muscle avec la plupart, mais autant de force."
    pt:
      title: "30 ensaios"
      body: "Mito: a proteína vegetal enfraquece. O músculo cresceu um pouco menos com quase todas, mas a força foi igual."
    tr:
      title: "30 çalışma"
      body: "Efsane: bitkisel protein güçsüzleştirir. Çoğu bitkisel proteinle kas kazancı biraz düşüktü, güç aynıydı."

  - key: eieren
    kind: fact
    en:
      title: "6 g"
      body: "Of protein in one large egg. Three eggs give you 18 g."
    nl:
      title: "6 gram"
      body: "Eiwit zit er in één groot ei. Drie eieren geven je 18 gram."
    de:
      title: "6 g"
      body: "Protein stecken in einem großen Ei. Drei Eier liefern 18 g."
    es:
      title: "6 g"
      body: "De proteína tiene un huevo grande. Tres huevos te dan 18 g."
    fr:
      title: "6 g"
      body: "De protéines dans un gros œuf. Trois œufs t'en donnent 18 g."
    pt:
      title: "6 g"
      body: "De proteína num ovo grande. Três ovos dão-te 18 g."
    tr:
      title: "6 g"
      body: "Büyük bir yumurtada bu kadar protein var. Üç yumurta 18 g eder."

  - key: leucine-per-bron
    kind: fact
    en:
      title: "11%"
      body: "Of whey protein is leucine, egg 8.6% and meat 8%. So 25 g of protein from meat gives about 2 g of leucine."
    nl:
      title: "11%"
      body: "Van wei-eiwit is leucine, ei 8,6% en vlees 8%. Dus 25 gram eiwit uit vlees geeft zo'n 2 gram leucine."
    de:
      title: "11 %"
      body: "Von Whey ist Leucin, bei Ei 8,6 % und Fleisch 8 %. 25 g Fleischprotein liefern also etwa 2 g Leucin."
    es:
      title: "11 %"
      body: "Del whey es leucina, del huevo 8,6 % y de la carne 8 %. 25 g de proteína de carne dan unos 2 g de leucina."
    fr:
      title: "11 %"
      body: "De la whey est de la leucine, 8,6 % pour l'œuf et 8 % pour la viande. 25 g de protéines de viande = environ 2 g."
    pt:
      title: "11%"
      body: "Da whey é leucina, do ovo 8,6% e da carne 8%. 25 g de proteína de carne dão cerca de 2 g de leucina."
    tr:
      title: "%11"
      body: "Whey'in bu kadarı lösin, yumurtada %8,6, ette %8. Yani etten 25 g protein yaklaşık 2 g lösin verir."

  - key: plantaardig-verschilt
    kind: fact
    en:
      title: "21 vs 43%"
      body: "Essential amino acids in oat, lupin or wheat protein against whey. Plant blends can come close to animal protein."
    nl:
      title: "21 tegen 43%"
      body: "Essentiële aminozuren in haver-, lupine- of tarwe-eiwit tegen whey. Plantaardige mixen komen dicht bij dierlijk."
    de:
      title: "21 zu 43 %"
      body: "Essenzielle Aminosäuren in Hafer-, Lupinen- oder Weizenprotein gegenüber Whey. Mischungen kommen nah ran."
    es:
      title: "21 frente a 43 %"
      body: "Aminoácidos esenciales en proteína de avena, altramuz o trigo frente al whey. Las mezclas se acercan a la animal."
    fr:
      title: "21 contre 43 %"
      body: "D'acides aminés essentiels dans l'avoine, le lupin ou le blé contre la whey. Les mélanges s'en approchent."
    pt:
      title: "21 contra 43%"
      body: "Aminoácidos essenciais na proteína de aveia, tremoço ou trigo face à whey. As misturas aproximam-se da animal."
    tr:
      title: "%21'e karşı %43"
      body: "Yulaf, acıbakla ya da buğday proteininde temel amino asit, whey'e karşı. Bitkisel karışımlar hayvansala yaklaşır."

  - key: grotere-portie-plantaardig
    kind: fact
    en:
      title: "60 g"
      body: "Of wheat protein raised muscle building in older men, where 35 g fell short of casein. Plant-based? Go bigger."
    nl:
      title: "60 gram"
      body: "Tarwe-eiwit verhoogde de spieropbouw bij oudere mannen, waar 35 gram tekortschoot tegen caseïne. Plantaardig? Neem meer."
    de:
      title: "60 g"
      body: "Weizenprotein steigerten bei älteren Männern den Muskelaufbau, 35 g blieben hinter Kasein. Pflanzlich? Mehr nehmen."
    es:
      title: "60 g"
      body: "De proteína de trigo subieron la síntesis en hombres mayores, y 35 g no llegaron a la caseína. ¿Vegetal? Más cantidad."
    fr:
      title: "60 g"
      body: "De protéines de blé ont relancé le muscle chez des hommes âgés, 35 g restaient sous la caséine. Végétal ? Plus gros."
    pt:
      title: "60 g"
      body: "De proteína de trigo aumentaram a síntese em homens mais velhos, 35 g ficaram abaixo da caseína. Vegetal? Mais."
    tr:
      title: "60 g"
      body: "Buğday proteini yaşlı erkeklerde kas yapımını artırdı, 35 g kazeinin gerisinde kaldı. Bitkisel mi? Porsiyonu büyüt."

  - key: eten-of-shake
    kind: fact
    en:
      title: "Whole foods"
      body: "Build meals around them for vitamins and minerals, like iron and B12 from meat. Use a shake to close a gap."
    nl:
      title: "Gewoon eten"
      body: "Bouw je maaltijden daaromheen voor vitamines en mineralen, zoals ijzer en B12 uit vlees. Een shake vult een gat."
    de:
      title: "Echte Lebensmittel"
      body: "Bau Mahlzeiten darum für Vitamine und Mineralien, etwa Eisen und B12 aus Fleisch. Ein Shake füllt Lücken."
    es:
      title: "Comida real"
      body: "Monta tus comidas con ella por vitaminas y minerales, como hierro y B12 de la carne. Un batido tapa huecos."
    fr:
      title: "Vrais aliments"
      body: "Construis tes repas autour pour vitamines et minéraux, comme le fer et la B12 de la viande. Le shake comble un trou."
    pt:
      title: "Comida a sério"
      body: "Monta as refeições à volta dela por vitaminas e minerais, como ferro e B12 da carne. Um batido tapa falhas."
    tr:
      title: "Gerçek yemek"
      body: "Öğünlerini vitamin ve mineral için onun etrafında kur, etten demir ve B12 gibi. Shake boşluğu doldurur."

article: pre-workout
emoji: "🫙"
tips:
  - key: cafeine-doet-het-werk
    kind: fact
    en:
      title: "Caffeine"
      body: "Does most of the work in a pre-workout. Products with it improve both strength and endurance performance."
    nl:
      title: "Cafeïne"
      body: "Doet het meeste werk in een pre-workout. Producten met cafeïne verbeteren kracht en uithouding."
    de:
      title: "Koffein"
      body: "Macht im Pre-Workout den Großteil. Produkte damit verbessern Kraft und Ausdauer."
    es:
      title: "Cafeína"
      body: "Hace casi todo el trabajo en un pre-entreno. Los productos con ella mejoran fuerza y resistencia."
    fr:
      title: "Caféine"
      body: "Elle fait l'essentiel du travail d'un pré-workout. Les produits avec caféine améliorent force et endurance."
    pt:
      title: "Cafeína"
      body: "Faz quase todo o trabalho num pré-treino. Produtos com ela melhoram força e resistência."
    tr:
      title: "Kafein"
      body: "Pre-workout'ta işin çoğunu yapar. Kafeinli ürünler hem güç hem dayanıklılık performansını artırır."

  - key: een-schep-250-mg
    kind: fact
    en:
      title: "250 mg"
      body: "Caffeine in the average scoop. That's more than the 200 mg single dose seen as safe for healthy adults."
    nl:
      title: "250 mg"
      body: "Cafeïne in een gemiddelde schep. Meer dan de 200 mg per keer die als veilig geldt voor gezonde volwassenen."
    de:
      title: "250 mg"
      body: "Koffein in einem durchschnittlichen Messlöffel. Mehr als die 200 mg pro Dosis, die als sicher gelten."
    es:
      title: "250 mg"
      body: "De cafeína en un cacito medio. Más que los 200 mg por toma que se ven seguros en adultos sanos."
    fr:
      title: "250 mg"
      body: "De caféine dans une dose moyenne. Plus que les 200 mg par prise jugés sûrs pour un adulte sain."
    pt:
      title: "250 mg"
      body: "De cafeína numa dose média. Mais do que os 200 mg por toma considerados seguros em adultos saudáveis."
    tr:
      title: "250 mg"
      body: "Ortalama bir ölçekteki kafein. Sağlıklı yetişkin için güvenli sayılan tek seferlik 200 mg'dan fazla."

  - key: dertien-uur-voor-bed
    kind: fact
    en:
      title: "13 hours"
      body: "Between a standard serving and bedtime is what it takes to protect your sleep, a meta-analysis estimates."
    nl:
      title: "13 uur"
      body: "Tussen een standaardportie en bedtijd is nodig om je slaap te sparen, schat een meta-analyse."
    de:
      title: "13 Stunden"
      body: "Zwischen einer Standardportion und dem Schlafengehen schützen deinen Schlaf, schätzt eine Metaanalyse."
    es:
      title: "13 horas"
      body: "Entre una dosis estándar y la hora de dormir protegen tu sueño, estima un metaanálisis."
    fr:
      title: "13 heures"
      body: "Entre une dose standard et le coucher protègent ton sommeil, estime une méta-analyse."
    pt:
      title: "13 horas"
      body: "Entre uma dose padrão e a hora de deitar protegem o teu sono, estima uma meta-análise."
    tr:
      title: "13 saat"
      body: "Standart bir porsiyonla yatma saati arasında uykunu korumak için gereken süre, bir meta-analize göre."

  - key: blend-zonder-hoeveelheden
    kind: fact
    en:
      title: "44%"
      body: "Of ingredients in top-selling pre-workouts sat in a blend without amounts. You can't tell if there's enough."
    nl:
      title: "44%"
      body: "Van de ingrediënten in best verkochte pre-workouts zat in een blend zonder hoeveelheden. Of het genoeg is, zie je niet."
    de:
      title: "44 %"
      body: "Der Zutaten in Bestseller-Pre-Workouts steckten in einer Mischung ohne Mengen. Ob es reicht, siehst du nicht."
    es:
      title: "44 %"
      body: "De los ingredientes de los pre-entrenos más vendidos iban en una mezcla sin cantidades. No sabes si basta."
    fr:
      title: "44 %"
      body: "Des ingrédients des pré-workouts les plus vendus étaient dans un mélange sans quantités. Impossible de juger."
    pt:
      title: "44%"
      body: "Dos ingredientes dos pré-treinos mais vendidos estavam numa mistura sem quantidades. Não sabes se chega."
    tr:
      title: "%44"
      body: "En çok satan pre-workout'larda içeriklerin bu kadarı miktarsız bir karışımdaydı. Yeterli mi, bilemezsin."

  - key: beta-alanine-vandaag
    kind: myth
    en:
      title: "2 g"
      body: "Myth: beta-alanine works the day you take it. It builds up over weeks at 4 to 6 g a day. The average tub has 2 g."
    nl:
      title: "2 gram"
      body: "Mythe: bèta-alanine werkt op de dag zelf. Het bouwt weken op bij 4 tot 6 gram per dag. Een gemiddelde pot geeft 2 gram."
    de:
      title: "2 g"
      body: "Mythos: Beta-Alanin wirkt am selben Tag. Es baut sich über Wochen mit 4 bis 6 g am Tag auf. Im Schnitt sind 2 g drin."
    es:
      title: "2 g"
      body: "Mito: la beta-alanina funciona el mismo día. Se acumula en semanas con 4 a 6 g al día. El bote medio trae 2 g."
    fr:
      title: "2 g"
      body: "Mythe : la bêta-alanine agit le jour même. Elle s'accumule sur des semaines à 4 à 6 g par jour. En moyenne : 2 g."
    pt:
      title: "2 g"
      body: "Mito: a beta-alanina funciona no próprio dia. Acumula-se em semanas com 4 a 6 g por dia. A média traz 2 g."
    tr:
      title: "2 g"
      body: "Efsane: beta-alanin aldığın gün işe yarar. Günde 4-6 g ile haftalarda birikir. Ortalama ürün 2 g içerir."

  - key: etiket-en-pot
    kind: fact
    en:
      title: "8 to 9 times"
      body: "The caffeine in pre-workouts has been measured to differ that much. The label isn't always what's inside."
    nl:
      title: "8 tot 9 keer"
      body: "Zoveel bleek de cafeïne in pre-workouts te verschillen. Het etiket is niet altijd wat er in de pot zit."
    de:
      title: "8- bis 9-mal"
      body: "So stark schwankte das gemessene Koffein in Pre-Workouts. Das Etikett stimmt nicht immer mit dem Inhalt."
    es:
      title: "8 a 9 veces"
      body: "Es lo que llegó a variar la cafeína medida en pre-entrenos. La etiqueta no siempre dice lo que hay dentro."
    fr:
      title: "8 à 9 fois"
      body: "C'est l'écart mesuré de caféine entre pré-workouts. L'étiquette ne dit pas toujours ce qu'il y a dedans."
    pt:
      title: "8 a 9 vezes"
      body: "Foi quanto variou a cafeína medida em pré-treinos. O rótulo nem sempre diz o que está lá dentro."
    tr:
      title: "8-9 kat"
      body: "Pre-workout'larda ölçülen kafein bu kadar farklı çıktı. Etiket her zaman içindekini söylemiyor."

  - key: tel-je-koffie-mee
    kind: fact
    en:
      title: "400 mg"
      body: "A pre-workout plus two coffees can pass that, the daily amount seen as safe. Count your coffee too."
    nl:
      title: "400 mg"
      body: "Een pre-workout plus twee koffie kan daar overheen gaan, de dagelijkse veilige hoeveelheid. Tel je koffie mee."
    de:
      title: "400 mg"
      body: "Pre-Workout plus zwei Kaffee können das überschreiten, die als sicher geltende Tagesmenge. Zähl Kaffee mit."
    es:
      title: "400 mg"
      body: "Un pre-entreno y dos cafés pueden pasar esa cantidad diaria segura. Cuenta también el café."
    fr:
      title: "400 mg"
      body: "Un pré-workout plus deux cafés peuvent dépasser cette dose quotidienne jugée sûre. Compte ton café."
    pt:
      title: "400 mg"
      body: "Um pré-treino e dois cafés podem passar essa dose diária segura. Conta também o café."
    tr:
      title: "400 mg"
      body: "Bir pre-workout ve iki kahve, güvenli sayılan bu günlük miktarı aşabilir. Kahveni de say."

  - key: creatine-in-de-pot
    kind: myth
    en:
      title: "2.1 g"
      body: "Myth: your pre-workout covers your creatine. That's the average, on training days only. You need 3 to 5 g daily."
    nl:
      title: "2,1 gram"
      body: "Mythe: je pre-workout dekt je creatine. Dat is het gemiddelde, alleen op trainingsdagen. Nodig is 3 tot 5 gram per dag."
    de:
      title: "2,1 g"
      body: "Mythos: Dein Pre-Workout deckt dein Kreatin. Das ist der Schnitt, nur an Trainingstagen. Nötig: 3 bis 5 g täglich."
    es:
      title: "2,1 g"
      body: "Mito: tu pre-entreno cubre tu creatina. Es la media, solo días de entreno. Hacen falta 3 a 5 g al día."
    fr:
      title: "2,1 g"
      body: "Mythe : ton pré-workout couvre ta créatine. C'est la moyenne, et que les jours de séance. Il faut 3 à 5 g par jour."
    pt:
      title: "2,1 g"
      body: "Mito: o pré-treino cobre a tua creatina. É a média, só em dias de treino. Precisas de 3 a 5 g por dia."
    tr:
      title: "2,1 g"
      body: "Efsane: pre-workout kreatin ihtiyacını karşılar. Bu ortalama, sadece antrenman günlerinde. Günde 3-5 g gerekir."

  - key: tieners
    kind: fact
    en:
      title: "Under 18"
      body: "EFSA uses 3 mg of caffeine per kg a day for teens. Under about 85 kg, one average scoop is already more."
    nl:
      title: "Onder de 18"
      body: "EFSA gebruikt voor tieners 3 mg cafeïne per kilo per dag. Onder zo'n 85 kilo is één schep al meer."
    de:
      title: "Unter 18"
      body: "Die EFSA nutzt für Teens 3 mg Koffein pro kg am Tag. Unter etwa 85 kg ist ein Messlöffel schon mehr."
    es:
      title: "Menos de 18"
      body: "La EFSA usa 3 mg de cafeína por kg al día para adolescentes. Bajo unos 85 kg, un cacito ya lo supera."
    fr:
      title: "Moins de 18 ans"
      body: "L'EFSA retient 3 mg de caféine par kg par jour pour les ados. Sous 85 kg environ, une dose dépasse déjà."
    pt:
      title: "Menos de 18"
      body: "A EFSA usa 3 mg de cafeína por kg por dia para adolescentes. Abaixo de 85 kg, uma dose já passa."
    tr:
      title: "18 yaş altı"
      body: "EFSA gençler için kilo başına günde 3 mg kafeini esas alıyor. 85 kilonun altında tek ölçek bile fazla."

  - key: citrulline-maximale-kracht
    kind: myth
    en:
      title: "Your max"
      body: "Myth: citrulline makes you stronger. Not your max, in trained lifters. It did add about 3 reps to sets to failure."
    nl:
      title: "Je max"
      body: "Mythe: citrulline maakt je sterker. Je max niet, bij getrainden. Wel zo'n 3 herhalingen extra in sets tot falen."
    de:
      title: "Dein Maximum"
      body: "Mythos: Citrullin macht stärker. Nicht dein Maximum, bei Trainierten. Aber etwa 3 Wdh. mehr bis zum Versagen."
    es:
      title: "Tu máximo"
      body: "Mito: la citrulina te hace más fuerte. No tu máximo, en entrenados. Sí sumó unas 3 repeticiones hasta el fallo."
    fr:
      title: "Ton max"
      body: "Mythe : la citrulline rend plus fort. Pas ton max, chez les entraînés. Elle a ajouté environ 3 reps jusqu'à l'échec."
    pt:
      title: "O teu máximo"
      body: "Mito: a citrulina torna-te mais forte. Não o máximo, em treinados. Juntou cerca de 3 repetições até à falha."
    tr:
      title: "Maksimumun"
      body: "Efsane: sitrülin güçlendirir. Deneyimlilerde maksimumu artırmadı. Tükenişe kadar setlere 3 tekrar kadar ekledi."

article: omega-3
emoji: "🐟"
tips:
  - key: een-keer-vis
    kind: fact
    en:
      title: "200 mg"
      body: "Omega-3 from fish a day, says Dutch advice. One fish meal a week covers it, ideally herring or salmon."
    nl:
      title: "200 mg"
      body: "Omega-3 uit vis per dag, is het advies. Eén keer vis per week dekt dat, liefst vette vis zoals haring of zalm."
    de:
      title: "200 mg"
      body: "Omega-3 aus Fisch am Tag rät man in den Niederlanden. Eine Fischmahlzeit pro Woche reicht, am besten Hering oder Lachs."
    es:
      title: "200 mg"
      body: "De omega-3 de pescado al día, aconsejan en Países Bajos. Un pescado a la semana lo cubre, mejor arenque o salmón."
    fr:
      title: "200 mg"
      body: "D'oméga-3 de poisson par jour, conseillent les Pays-Bas. Un repas de poisson par semaine suffit, idéalement gras."
    pt:
      title: "200 mg"
      body: "De ómega-3 de peixe por dia, aconselham os Países Baixos. Uma refeição de peixe por semana chega, de preferência gordo."
    tr:
      title: "200 mg"
      body: "Hollanda'da balıktan günlük omega-3 önerisi. Haftada bir balık yemeği yeter, tercihen ringa ya da somon."

  - key: capsule-of-vis
    kind: myth
    en:
      title: "Capsule"
      body: "Myth: a fish oil capsule equals a fish meal. There isn't enough research to say it gives the same health effects."
    nl:
      title: "Capsule"
      body: "Mythe: een visoliecapsule staat gelijk aan een vismaaltijd. Er is te weinig onderzoek om dat te zeggen."
    de:
      title: "Kapsel"
      body: "Mythos: Eine Fischölkapsel ist so gut wie eine Fischmahlzeit. Dafür gibt es zu wenig Forschung."
    es:
      title: "Cápsula"
      body: "Mito: una cápsula de aceite de pescado vale lo que un plato de pescado. No hay estudios suficientes para decirlo."
    fr:
      title: "Gélule"
      body: "Mythe : une gélule d'huile de poisson vaut un repas de poisson. Pas assez de recherche pour l'affirmer."
    pt:
      title: "Cápsula"
      body: "Mito: uma cápsula de óleo de peixe vale uma refeição de peixe. Não há estudos suficientes para o dizer."
    tr:
      title: "Kapsül"
      body: "Efsane: balık yağı kapsülü bir balık yemeğine denktir. Bunu söylemek için yeterli araştırma yok."

  - key: hartritme
    kind: fact
    en:
      title: "4 g a day"
      body: "High-dose EPA and DHA supplements can raise the risk of heart rhythm problems. It's largest at that dose."
    nl:
      title: "4 gram per dag"
      body: "Hoge doses EPA en DHA kunnen het risico op hartritmestoornissen verhogen. Bij die dosis is het het grootst."
    de:
      title: "4 g am Tag"
      body: "Hochdosiertes EPA und DHA kann das Risiko für Herzrhythmusstörungen erhöhen. Bei dieser Dosis am meisten."
    es:
      title: "4 g al día"
      body: "Los suplementos de EPA y DHA a dosis altas pueden subir el riesgo de arritmias. Es mayor a esa dosis."
    fr:
      title: "4 g par jour"
      body: "Les compléments d'EPA et DHA à forte dose peuvent augmenter le risque d'arythmie. Surtout à cette dose."
    pt:
      title: "4 g por dia"
      body: "Suplementos de EPA e DHA em dose alta podem aumentar o risco de arritmias. É maior nessa dose."
    tr:
      title: "Günde 4 g"
      body: "Yüksek doz EPA ve DHA takviyesi ritim bozukluğu riskini artırabilir. Risk en çok bu dozda."

  - key: vijf-gram
    kind: myth
    en:
      title: "5 g"
      body: "Myth: 5 g a day is a fine target. EFSA saw no safety issue there in 2012. Dutch advice warns about high doses."
    nl:
      title: "5 gram"
      body: "Mythe: 5 gram omega-3 per dag is prima. EFSA zag daar in 2012 geen probleem. Nederland waarschuwt voor hoge doses."
    de:
      title: "5 g"
      body: "Mythos: 5 g Omega-3 am Tag sind ein gutes Ziel. Dort sah die EFSA 2012 keine Bedenken. Dennoch Warnung bei hohen Dosen."
    es:
      title: "5 g"
      body: "Mito: 5 g de omega-3 al día es buena meta. Es donde la EFSA no vio riesgos en 2012. Hay avisos sobre dosis altas."
    fr:
      title: "5 g"
      body: "Mythe : 5 g d'oméga-3 par jour, c'est une bonne cible. L'EFSA n'y voyait pas de risque en 2012. Prudence à forte dose."
    pt:
      title: "5 g"
      body: "Mito: 5 g de ómega-3 por dia é um bom alvo. Foi onde a EFSA não viu riscos em 2012. Há avisos para doses altas."
    tr:
      title: "5 g"
      body: "Efsane: günde 5 g omega-3 iyi bir hedef. EFSA 2012'de burada güvenlik sorunu görmedi. Yüksek doza uyarı var."

  - key: bloedverdunners
    kind: fact
    en:
      title: "Blood thinners"
      body: "On them and taking over 1 g of EPA and DHA a day? Talk to your doctor. Blood may clot more slowly."
    nl:
      title: "Bloedverdunners"
      body: "Slik je die en neem je meer dan 1 gram EPA en DHA per dag? Overleg met je arts. Je bloed stolt mogelijk trager."
    de:
      title: "Blutverdünner"
      body: "Nimmst du sie und über 1 g EPA und DHA am Tag? Sprich mit deinem Arzt. Das Blut gerinnt womöglich langsamer."
    es:
      title: "Anticoagulantes"
      body: "¿Los tomas junto a más de 1 g de EPA y DHA al día? Habla con tu médico. La sangre puede coagular más lento."
    fr:
      title: "Anticoagulants"
      body: "Tu en prends avec plus de 1 g d'EPA et DHA par jour ? Parles-en à ton médecin. Le sang peut coaguler moins vite."
    pt:
      title: "Anticoagulantes"
      body: "Tomas e ainda mais de 1 g de EPA e DHA por dia? Fala com o médico. O sangue pode coagular mais devagar."
    tr:
      title: "Kan sulandırıcı"
      body: "Kullanıyor ve günde 1 g'dan fazla EPA ile DHA alıyor musun? Doktoruna danış. Kan daha yavaş pıhtılaşabilir."

  - key: ldl
    kind: fact
    en:
      title: "2 g of DHA"
      body: "A day raises LDL cholesterol by about 0.20 mmol/l, says the Dutch nutrition centre."
    nl:
      title: "2 gram DHA"
      body: "Per dag verhoogt je LDL-cholesterol met zo'n 0,20 mmol/l, zegt het Voedingscentrum."
    de:
      title: "2 g DHA"
      body: "Am Tag erhöhen das LDL-Cholesterin um etwa 0,20 mmol/l, so das niederländische Ernährungszentrum."
    es:
      title: "2 g de DHA"
      body: "Al día suben el colesterol LDL unos 0,20 mmol/l, según el centro de nutrición neerlandés."
    fr:
      title: "2 g de DHA"
      body: "Par jour montent le LDL d'environ 0,20 mmol/l, selon le centre néerlandais de nutrition."
    pt:
      title: "2 g de DHA"
      body: "Por dia sobem o colesterol LDL cerca de 0,20 mmol/l, diz o centro de nutrição neerlandês."
    tr:
      title: "2 g DHA"
      body: "Hollanda beslenme merkezine göre günde bu kadarı LDL kolesterolü yaklaşık 0,20 mmol/l artırır."

  - key: zwanger
    kind: fact
    en:
      title: "Twice a week"
      body: "Fish when pregnant, once oily and once lean. Can't manage that? Take 250 to 450 mg DHA a day."
    nl:
      title: "Twee keer per week"
      body: "Vis als je zwanger bent, één keer vet en één keer mager. Lukt dat niet? Neem 250 tot 450 mg DHA per dag."
    de:
      title: "Zweimal pro Woche"
      body: "Fisch in der Schwangerschaft, einmal fett, einmal mager. Klappt nicht? 250 bis 450 mg DHA am Tag."
    es:
      title: "Dos veces por semana"
      body: "Pescado en el embarazo, una vez azul y otra blanco. ¿No llegas? Toma 250 a 450 mg de DHA al día."
    fr:
      title: "Deux fois par semaine"
      body: "Du poisson enceinte, une fois gras, une fois maigre. Pas possible ? Prends 250 à 450 mg de DHA par jour."
    pt:
      title: "Duas vezes por semana"
      body: "Peixe na gravidez, uma vez gordo e outra magro. Não dá? Toma 250 a 450 mg de DHA por dia."
    tr:
      title: "Haftada iki kez"
      body: "Hamileyken balık, bir yağlı bir yağsız. Olmuyorsa günde 250-450 mg DHA al."

  - key: adhd-depressie
    kind: myth
    en:
      title: "Depression"
      body: "Myth: omega-3 pills help depression. There's not enough evidence, and the same goes for ADHD and dementia."
    nl:
      title: "Depressie"
      body: "Mythe: omega-3-pillen helpen tegen depressie. Er is te weinig bewijs, net als voor ADHD en dementie."
    de:
      title: "Depression"
      body: "Mythos: Omega-3-Kapseln helfen bei Depression. Dafür fehlen Belege, genau wie bei ADHS und Demenz."
    es:
      title: "Depresión"
      body: "Mito: las cápsulas de omega-3 ayudan con la depresión. No hay pruebas suficientes, ni para TDAH o demencia."
    fr:
      title: "Dépression"
      body: "Mythe : les gélules d'oméga-3 aident contre la dépression. Pas assez de preuves, ni pour le TDAH ou la démence."
    pt:
      title: "Depressão"
      body: "Mito: cápsulas de ómega-3 ajudam na depressão. Não há provas suficientes, nem para PHDA ou demência."
    tr:
      title: "Depresyon"
      body: "Efsane: omega-3 hapları depresyona iyi gelir. Yeterli kanıt yok, DEHB ve demans için de öyle."

  - key: efsa-250
    kind: fact
    en:
      title: "250 mg"
      body: "EPA and DHA a day is EFSA's adequate intake for heart health, a bit above the Dutch 200 mg."
    nl:
      title: "250 mg"
      body: "EPA en DHA per dag is de adequate inname van EFSA voor je hart, iets boven de Nederlandse 200 mg."
    de:
      title: "250 mg"
      body: "EPA und DHA am Tag ist der EFSA-Schätzwert für die Herzgesundheit, etwas über den niederländischen 200 mg."
    es:
      title: "250 mg"
      body: "De EPA y DHA al día es la ingesta adecuada de la EFSA para el corazón, algo más que los 200 mg neerlandeses."
    fr:
      title: "250 mg"
      body: "D'EPA et DHA par jour, c'est l'apport adéquat de l'EFSA pour le cœur, un peu plus que les 200 mg néerlandais."
    pt:
      title: "250 mg"
      body: "De EPA e DHA por dia é a ingestão adequada da EFSA para o coração, um pouco acima dos 200 mg neerlandeses."
    tr:
      title: "250 mg"
      body: "Günlük EPA ve DHA, EFSA'nın kalp sağlığı için yeterli alım değeri. Hollanda'nın 200 mg'ından biraz fazla."

  - key: hartpatienten
    kind: fact
    en:
      title: "10%"
      body: "Lower risk of dying from heart disease with 1 g of EPA and DHA a day, in people with or at high risk of it."
    nl:
      title: "10%"
      body: "Minder kans om aan hartziekte te overlijden met 1 gram EPA en DHA per dag, bij mensen met (hoog risico op) hartziekte."
    de:
      title: "10 %"
      body: "Weniger Risiko, an Herzkrankheit zu sterben, mit 1 g EPA und DHA am Tag, bei Menschen mit hohem Risiko."
    es:
      title: "10 %"
      body: "Menos riesgo de morir del corazón con 1 g de EPA y DHA al día, en personas con enfermedad cardiaca o alto riesgo."
    fr:
      title: "10 %"
      body: "De risque en moins de mourir du cœur avec 1 g d'EPA et DHA par jour, chez les cardiaques ou à haut risque."
    pt:
      title: "10%"
      body: "Menos risco de morrer do coração com 1 g de EPA e DHA por dia, em pessoas com doença cardíaca ou alto risco."
    tr:
      title: "%10"
      body: "Kalp hastası ya da yüksek riskli kişilerde günde 1 g EPA ve DHA ile kalpten ölüm riski bu kadar düştü."

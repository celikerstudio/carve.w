article: home-gym
emoji: "🏠"
tips:
  - key: geen-reistijd
    kind: fact
    en:
      title: "No commute"
      body: "A home gym saves the trip. That means fewer skipped sessions, which helps you stay consistent."
    nl:
      title: "Geen reistijd"
      body: "Een thuisgym scheelt de rit. Zo sla je minder trainingen over, en dat helpt volhouden."
    de:
      title: "Kein Anfahrtsweg"
      body: "Ein Homegym spart den Weg. Weniger ausgefallene Einheiten helfen dir dranzubleiben."
    es:
      title: "Sin trayecto"
      body: "Un gym en casa te ahorra el viaje. Así te saltas menos sesiones y eres más constante."
    fr:
      title: "Zéro trajet"
      body: "Une salle à la maison évite le trajet. Moins de séances sautées, plus de régularité."
    pt:
      title: "Sem viagem"
      body: "Um ginásio em casa poupa a viagem. Falhas menos treinos e manténs-te mais constante."
    tr:
      title: "Yol yok"
      body: "Ev salonu yolu ortadan kaldırır. Daha az antrenman kaçırırsın, bu da devamlılığa yardım eder."

  - key: de-basis
    kind: fact
    en:
      title: "The basics"
      body: "Adjustable dumbbells or a barbell, a bench, a rack with safeties and bands. A pull-up bar and mats come next."
    nl:
      title: "De basis"
      body: "Verstelbare dumbbells of een stang, een bank, een rek met veiligheden en elastieken. Daarna een optrekstang en matten."
    de:
      title: "Die Basis"
      body: "Verstellbare Hanteln oder Langhantel, Bank, Rack mit Ablagen und Bänder. Dann Klimmzugstange und Matten."
    es:
      title: "Lo básico"
      body: "Mancuernas ajustables o barra, un banco, un rack con seguros y gomas. Luego barra de dominadas y esterillas."
    fr:
      title: "L'essentiel"
      body: "Haltères réglables ou barre, un banc, un rack avec sécurités et des élastiques. Puis barre de traction et tapis."
    pt:
      title: "O básico"
      body: "Halteres ajustáveis ou barra, um banco, um rack com seguranças e elásticos. Depois barra de elevações e tapetes."
    tr:
      title: "Temel set"
      body: "Ayarlı dambıl ya da bar, sehpa, güvenlikli rack ve bantlar. Sonra barfiks barı ve paspaslar."

  - key: veiligheden
    kind: fact
    en:
      title: "Safeties"
      body: "Use your rack's safeties for heavy lifts. Skipping them is a common home gym mistake."
    nl:
      title: "Veiligheden"
      body: "Gebruik de veiligheidsstangen van je rek bij zware sets. Ze overslaan is een bekende thuisgymfout."
    de:
      title: "Sicherungen"
      body: "Nutz die Ablagen deines Racks bei schweren Sätzen. Sie wegzulassen ist ein typischer Homegym-Fehler."
    es:
      title: "Seguros"
      body: "Usa los seguros del rack en las series pesadas. Saltártelos es un fallo típico en casa."
    fr:
      title: "Sécurités"
      body: "Utilise les sécurités du rack pour le lourd. Les zapper est une erreur classique à la maison."
    pt:
      title: "Seguranças"
      body: "Usa as seguranças do rack nas séries pesadas. Saltá-las é um erro típico em casa."
    tr:
      title: "Güvenlik barları"
      body: "Ağır setlerde rack'in güvenlik barlarını kullan. Atlamak ev salonlarında sık bir hata."

  - key: niet-te-veel-kopen
    kind: fact
    en:
      title: "Buy it later"
      body: "Overbuying niche gear before you use the basics is a common mistake. Add items when you clearly need them."
    nl:
      title: "Later kopen"
      body: "Nichespullen kopen voor je de basis gebruikt is een bekende fout. Koop pas iets als je het echt nodig hebt."
    de:
      title: "Später kaufen"
      body: "Spezialzeug kaufen, bevor du die Basis nutzt, ist ein häufiger Fehler. Kauf erst, wenn du es brauchst."
    es:
      title: "Cómpralo después"
      body: "Comprar cosas raras antes de usar lo básico es un error común. Añade algo solo cuando lo necesites."
    fr:
      title: "Achète plus tard"
      body: "Acheter du matos de niche avant d'utiliser l'essentiel est une erreur courante. Attends d'en avoir besoin."
    pt:
      title: "Compra depois"
      body: "Comprar material de nicho antes de usar o básico é um erro comum. Junta coisas só quando precisares."
    tr:
      title: "Sonra al"
      body: "Temelleri kullanmadan özel ekipman almak sık bir hata. Gerçekten ihtiyacın olunca ekle."

  - key: trainen-met-wat-je-hebt
    kind: fact
    en:
      title: "What you've got"
      body: "Build your plan around your tools: dumbbell presses and rows, goblet squats or front squats."
    nl:
      title: "Wat je hebt"
      body: "Bouw je plan rond je spullen: dumbbellpress en roeien, goblet squats of front squats."
    de:
      title: "Was du hast"
      body: "Bau deinen Plan um dein Material: Kurzhanteldrücken und Rudern, Goblet- oder Frontkniebeugen."
    es:
      title: "Lo que tienes"
      body: "Arma tu plan con tu material: press y remo con mancuerna, sentadilla goblet o frontal."
    fr:
      title: "Ce que tu as"
      body: "Construis ton plan autour de ton matos : développé et rowing haltères, goblet ou front squat."
    pt:
      title: "O que tens"
      body: "Monta o plano com o teu material: press e remada com halteres, agachamento goblet ou frontal."
    tr:
      title: "Elindekiyle"
      body: "Planını ekipmanına göre kur: dambıl press ve row, goblet ya da front squat."

  - key: vanzelf-volhouden
    kind: myth
    en:
      title: "Consistency"
      body: "Myth: a home gym keeps you consistent by itself. The convenience helps, but set fixed training times anyway."
    nl:
      title: "Volhouden"
      body: "Mythe: met een thuisgym hou je het vanzelf vol. Het gemak helpt, maar plan toch vaste trainingstijden."
    de:
      title: "Dranbleiben"
      body: "Mythos: Mit Homegym bleibst du von selbst dran. Der Komfort hilft, aber plan trotzdem feste Zeiten."
    es:
      title: "Constancia"
      body: "Mito: con un gym en casa eres constante sin más. La comodidad ayuda, pero fija horarios igual."
    fr:
      title: "Régularité"
      body: "Mythe : avec une salle à la maison, on est régulier tout seul. Ça aide, mais fixe quand même des horaires."
    pt:
      title: "Constância"
      body: "Mito: com ginásio em casa és constante sem esforço. A comodidade ajuda, mas marca horários na mesma."
    tr:
      title: "Devamlılık"
      body: "Efsane: ev salonu seni kendiliğinden düzenli tutar. Kolaylık yardım eder ama yine de sabit saat belirle."

  - key: opgeruimd
    kind: fact
    en:
      title: "Keep it tidy"
      body: "A cluttered space makes starting harder. Keep your corner organised so it's ready when you are."
    nl:
      title: "Opgeruimd"
      body: "Een rommelige plek maakt beginnen lastiger. Houd je hoek netjes, zodat hij klaarstaat als jij dat bent."
    de:
      title: "Aufgeräumt"
      body: "Ein vollgestellter Raum macht den Start schwerer. Halt deine Ecke ordentlich, dann ist sie bereit."
    es:
      title: "Ordenado"
      body: "Un espacio desordenado cuesta más para empezar. Ten tu rincón ordenado para que esté listo."
    fr:
      title: "Rangé"
      body: "Un coin en bazar rend le départ plus dur. Garde-le rangé pour qu'il soit prêt quand tu l'es."
    pt:
      title: "Arrumado"
      body: "Um espaço desarrumado dificulta começar. Mantém o teu canto arrumado para estar pronto."
    tr:
      title: "Toplu"
      body: "Dağınık alan başlamayı zorlaştırır. Köşeni düzenli tut ki sen hazır olunca o da hazır olsun."

article: hunger-and-satiety
emoji: "🍽️"
tips:
  - key: geen-discipline
    kind: myth
    en:
      title: "Weak willpower"
      body: "Myth: hunger on a diet means weak discipline. Losing weight shifts your hunger signals. It's your body responding."
    nl:
      title: "Zwakke wil"
      body: "Mythe: honger tijdens het lijnen is zwakke discipline. Afvallen verschuift je hongersignalen. Zo reageert je lijf."
    de:
      title: "Schwacher Wille"
      body: "Mythos: Hunger in der Diät heißt schwache Disziplin. Abnehmen verschiebt die Hungersignale. So reagiert der Körper."
    es:
      title: "Poca voluntad"
      body: "Mito: tener hambre a dieta es falta de disciplina. Adelgazar cambia tus señales de hambre. Es tu cuerpo."
    fr:
      title: "Manque de volonté"
      body: "Mythe : avoir faim au régime, c'est manquer de discipline. Maigrir modifie les signaux de faim. C'est ton corps."
    pt:
      title: "Pouca força de vontade"
      body: "Mito: fome na dieta é falta de disciplina. Emagrecer muda os sinais de fome. É o teu corpo a reagir."
    tr:
      title: "Zayıf irade"
      body: "Efsane: diyette acıkmak disiplinsizliktir. Kilo vermek açlık sinyallerini değiştirir. Bu vücudunun tepkisi."

  - key: jaar-later
    kind: fact
    en:
      title: "A year later"
      body: "After a very strict 10-week diet, hunger still hadn't returned to where it was. One group, one harsh diet."
    nl:
      title: "Een jaar later"
      body: "Na een heel streng dieet van 10 weken was de honger nog niet terug op het oude niveau. Eén groep, één streng dieet."
    de:
      title: "Ein Jahr später"
      body: "Nach einer sehr strengen 10-Wochen-Diät war der Hunger noch nicht wie vorher. Eine Gruppe, eine harte Diät."
    es:
      title: "Un año después"
      body: "Tras una dieta muy estricta de 10 semanas, el hambre no había vuelto a su nivel. Un grupo, una dieta dura."
    fr:
      title: "Un an après"
      body: "Après un régime très strict de 10 semaines, la faim n'était pas revenue à son niveau. Un groupe, un régime dur."
    pt:
      title: "Um ano depois"
      body: "Depois de uma dieta muito rígida de 10 semanas, a fome ainda não tinha voltado ao nível. Um grupo, uma dieta dura."
    tr:
      title: "Bir yıl sonra"
      body: "Çok sıkı 10 haftalık diyetten sonra açlık hâlâ eski seviyesine dönmemişti. Tek grup, sert bir diyet."

  - key: eiwit-vult
    kind: fact
    en:
      title: "441 kcal"
      body: "Less a day eaten when protein went from 15 to 30% of calories, in a small study. Fat dropped too."
    nl:
      title: "441 kcal"
      body: "Minder per dag aten mensen toen eiwit van 15 naar 30% van hun calorieën ging, in een kleine studie. Ook vet daalde."
    de:
      title: "441 kcal"
      body: "Weniger am Tag aßen Menschen, als Protein von 15 auf 30 % der Kalorien stieg, in einer kleinen Studie. Fett sank auch."
    es:
      title: "441 kcal"
      body: "Menos al día comió la gente al pasar la proteína del 15 al 30 %, en un estudio pequeño. La grasa también bajó."
    fr:
      title: "441 kcal"
      body: "De moins par jour quand les protéines sont passées de 15 à 30 %, dans une petite étude. Le gras a aussi baissé."
    pt:
      title: "441 kcal"
      body: "A menos por dia quando a proteína passou de 15 para 30%, num estudo pequeno. A gordura também desceu."
    tr:
      title: "441 kcal"
      body: "Küçük bir çalışmada protein kalorinin %15'inden %30'una çıkınca günde bu kadar az yendi. Yağ da düştü."

  - key: stroperige-vezels
    kind: fact
    en:
      title: "Oats and beans"
      body: "Their thick fibre cut appetite in 59% of trial comparisons. Thinner fibre did so in 14%."
    nl:
      title: "Havermout en bonen"
      body: "Hun stroperige vezels remden de eetlust in 59% van de vergelijkingen. Dunnere vezels in 14%."
    de:
      title: "Hafer und Bohnen"
      body: "Ihre zähen Fasern bremsten den Appetit in 59 % der Vergleiche. Dünnflüssigere in 14 %."
    es:
      title: "Avena y legumbres"
      body: "Su fibra espesa frenó el apetito en el 59 % de las comparaciones. La fibra fina, en el 14 %."
    fr:
      title: "Avoine et haricots"
      body: "Leurs fibres visqueuses ont coupé l'appétit dans 59 % des comparaisons. Les fluides, dans 14 %."
    pt:
      title: "Aveia e feijão"
      body: "A sua fibra espessa travou o apetite em 59% das comparações. A fibra fina, em 14%."
    tr:
      title: "Yulaf ve fasulye"
      body: "Koyu lifleri karşılaştırmaların %59'unda iştahı azalttı. Akışkan lifler %14'ünde."

  - key: groot-en-licht
    kind: fact
    en:
      title: "Big plate"
      body: "Fruit, veg and soup give a big plate for few calories. Women eating more of them felt less hungry."
    nl:
      title: "Volle borden"
      body: "Fruit, groente en soep geven een vol bord voor weinig calorieën. Vrouwen die er meer van aten, hadden minder honger."
    de:
      title: "Großer Teller"
      body: "Obst, Gemüse und Suppe füllen den Teller mit wenig Kalorien. Frauen, die mehr davon aßen, hatten weniger Hunger."
    es:
      title: "Plato grande"
      body: "Fruta, verdura y sopa llenan el plato con pocas calorías. Las mujeres que comían más tenían menos hambre."
    fr:
      title: "Grande assiette"
      body: "Fruits, légumes et soupe remplissent l'assiette pour peu de calories. En mangeant plus, des femmes avaient moins faim."
    pt:
      title: "Prato grande"
      body: "Fruta, legumes e sopa enchem o prato com poucas calorias. As mulheres que comiam mais tinham menos fome."
    tr:
      title: "Büyük tabak"
      body: "Meyve, sebze ve çorba az kaloriyle tabağı doldurur. Bunlardan daha çok yiyen kadınlar daha az acıktı."

  - key: bewerkt-eten
    kind: myth
    en:
      title: "Ultra-processed"
      body: "Myth: processed food makes you hungrier. People ate 500 kcal a day more of it, yet felt no hungrier."
    nl:
      title: "Ultrabewerkt"
      body: "Mythe: bewerkt eten geeft meer honger. Mensen aten er 500 kcal per dag meer van, maar hadden niet meer honger."
    de:
      title: "Hochverarbeitet"
      body: "Mythos: Verarbeitetes Essen macht hungriger. Man aß 500 kcal am Tag mehr davon, aber ohne mehr Hunger."
    es:
      title: "Ultraprocesados"
      body: "Mito: lo procesado da más hambre. La gente comió 500 kcal al día más, pero sin más hambre."
    fr:
      title: "Ultra-transformé"
      body: "Mythe : l'ultra-transformé donne plus faim. On en a mangé 500 kcal de plus par jour, sans avoir plus faim."
    pt:
      title: "Ultraprocessados"
      body: "Mito: o processado dá mais fome. As pessoas comeram 500 kcal a mais por dia, sem mais fome."
    tr:
      title: "Ultra işlenmiş"
      body: "Efsane: işlenmiş yiyecek daha çok acıktırır. Günde 500 kcal fazla yendi ama açlık artmadı."

  - key: korte-nacht
    kind: fact
    en:
      title: "4 hours"
      body: "Of sleep, and young men ate about 559 kcal more the next day than after 8 hours. A small study, one night."
    nl:
      title: "4 uur"
      body: "Slaap, en jonge mannen aten de dag erna zo'n 559 kcal meer dan na 8 uur. Een kleine studie, één nacht."
    de:
      title: "4 Stunden"
      body: "Schlaf, und junge Männer aßen am nächsten Tag etwa 559 kcal mehr als nach 8 Stunden. Kleine Studie, eine Nacht."
    es:
      title: "4 horas"
      body: "De sueño, y unos jóvenes comieron 559 kcal más al día siguiente que tras 8 horas. Estudio pequeño, una noche."
    fr:
      title: "4 heures"
      body: "De sommeil, et des jeunes hommes ont mangé 559 kcal de plus le lendemain qu'après 8 h. Petite étude, une nuit."
    pt:
      title: "4 horas"
      body: "De sono, e jovens comeram cerca de 559 kcal a mais no dia seguinte do que após 8 horas. Estudo pequeno, uma noite."
    tr:
      title: "4 saat"
      body: "Uykudan sonra genç erkekler ertesi gün 8 saate göre 559 kcal fazla yedi. Küçük çalışma, tek gece."

  - key: vaker-eten
    kind: myth
    en:
      title: "More meals"
      body: "Myth: eating more often speeds up fat loss. It barely affects weight loss. Use it only if it eases your hunger."
    nl:
      title: "Vaker eten"
      body: "Mythe: vaker eten versnelt vetverlies. Het maakt weinig uit voor afvallen. Doe het alleen als het je honger dempt."
    de:
      title: "Öfter essen"
      body: "Mythos: Öfter essen beschleunigt den Fettabbau. Kaum Effekt aufs Abnehmen. Nur sinnvoll, wenn es Hunger dämpft."
    es:
      title: "Comer más veces"
      body: "Mito: comer más a menudo acelera la pérdida de grasa. Apenas influye. Hazlo solo si te calma el hambre."
    fr:
      title: "Manger plus souvent"
      body: "Mythe : manger plus souvent fait maigrir plus vite. Effet minime. Fais-le seulement si ça calme ta faim."
    pt:
      title: "Comer mais vezes"
      body: "Mito: comer mais vezes acelera a perda de gordura. Quase não influencia. Faz isso só se te acalmar a fome."
    tr:
      title: "Daha sık yemek"
      body: "Efsane: sık yemek yağ kaybını hızlandırır. Kilo vermeye etkisi az. Sadece açlığı azaltıyorsa yap."

  - key: soep-vooraf
    kind: fact
    en:
      title: "Start with soup"
      body: "Hungry on a cut? Fill half your plate with veg or fruit, and open a meal with soup or salad."
    nl:
      title: "Begin met soep"
      body: "Honger tijdens het cutten? Vul je bord voor de helft met groente of fruit, en begin met soep of salade."
    de:
      title: "Mit Suppe starten"
      body: "Hunger in der Diät? Füll den halben Teller mit Gemüse oder Obst und starte mit Suppe oder Salat."
    es:
      title: "Empieza con sopa"
      body: "¿Hambre al definir? Llena medio plato de verdura o fruta y empieza con sopa o ensalada."
    fr:
      title: "Commence par la soupe"
      body: "Faim en sèche ? Remplis la moitié de l'assiette de légumes ou fruits, et ouvre avec soupe ou salade."
    pt:
      title: "Começa com sopa"
      body: "Fome no cut? Enche metade do prato com legumes ou fruta e começa com sopa ou salada."
    tr:
      title: "Çorbayla başla"
      body: "Cut'ta aç mısın? Tabağının yarısını sebze ya da meyveyle doldur, öğüne çorba ya da salatayla başla."

  - key: kleiner-tekort
    kind: fact
    en:
      title: "Still hungry"
      body: "Enough protein, fibre, volume and sleep and still starving? Try a smaller deficit for a while."
    nl:
      title: "Nog steeds honger"
      body: "Genoeg eiwit, vezels, volume en slaap en toch uitgehongerd? Probeer een tijdje een kleiner tekort."
    de:
      title: "Immer noch Hunger"
      body: "Genug Protein, Ballaststoffe, Volumen und Schlaf und trotzdem ausgehungert? Versuch ein kleineres Defizit."
    es:
      title: "Sigues con hambre"
      body: "¿Con proteína, fibra, volumen y sueño y aún muerto de hambre? Prueba un déficit menor un tiempo."
    fr:
      title: "Toujours faim"
      body: "Assez de protéines, fibres, volume et sommeil, et toujours affamé ? Essaie un déficit plus petit."
    pt:
      title: "Ainda com fome"
      body: "Proteína, fibra, volume e sono suficientes e ainda esfomeado? Experimenta um défice menor."
    tr:
      title: "Hâlâ aç"
      body: "Yeterli protein, lif, hacim ve uykuya rağmen açlıktan ölüyorsan bir süre daha küçük açık dene."

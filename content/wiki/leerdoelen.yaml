  artikel: bulking

- id: spiergroei-belasting
  laag: spier-opbouwen
  doel: "Weet dat je voor spiergroei vooral in de zone van 6 tot 12 RM traint, met 1 tot 2 minuten rust tussen sets."
  bron: acsm-resistance-training-2009
  passage: "For loading, it is recommended that loads corresponding to 1-12 RM be used in periodized fashion with emphasis on the 6-12 RM zone using 1- to 2-min rest periods between sets at a moderate velocity."

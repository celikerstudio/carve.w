article: cold-water-therapy
emoji: "🧊"
tips:
  - key: niet-direct-na-krachttraining
    kind: myth
    en:
      title: "Right after lifting"
      body: "Myth: an ice bath right after lifting is best. Done routinely, it can dampen muscle-building signals and slow gains."
    nl:
      title: "Direct na het trainen"
      body: "Mythe: een ijsbad direct na krachttraining is het best. Vaak gedaan kan het spiergroei-signalen dempen."
    de:
      title: "Direkt danach"
      body: "Mythos: Eisbad direkt nach dem Krafttraining ist ideal. Regelmäßig kann es Wachstumssignale dämpfen."
    es:
      title: "Justo tras entrenar"
      body: "Mito: el baño de hielo justo tras las pesas es lo mejor. Si es rutina, puede frenar las señales de crecimiento."
    fr:
      title: "Juste après la séance"
      body: "Mythe : le bain glacé juste après la muscu, c'est idéal. En routine, il peut freiner les signaux de croissance."
    pt:
      title: "Logo após treinar"
      body: "Mito: o banho de gelo logo após o treino é o ideal. Feito sempre, pode travar os sinais de crescimento."
    tr:
      title: "Hemen sonra"
      body: "Efsane: ağırlıktan hemen sonra buz banyosu en iyisi. Alışkanlık olursa kas yapım sinyallerini azaltabilir."

  - key: wanneer-wel
    kind: fact
    en:
      title: "Rest days"
      body: "Like cold plunges? Do them on rest days or several hours after lifting."
    nl:
      title: "Rustdagen"
      body: "Hou je van koude baden? Doe ze op rustdagen of een paar uur na je krachttraining."
    de:
      title: "Ruhetage"
      body: "Du magst Eisbäder? Mach sie an Ruhetagen oder einige Stunden nach dem Krafttraining."
    es:
      title: "Días de descanso"
      body: "¿Te gusta el agua fría? Hazlo en días de descanso o varias horas después de entrenar."
    fr:
      title: "Jours de repos"
      body: "Tu aimes l'eau glacée ? Fais-le les jours de repos ou plusieurs heures après la muscu."
    pt:
      title: "Dias de descanso"
      body: "Gostas de água gelada? Faz isso em dias de descanso ou várias horas depois do treino."
    tr:
      title: "Dinlenme günleri"
      body: "Soğuk suyu seviyor musun? Dinlenme günlerinde ya da antrenmandan birkaç saat sonra yap."

  - key: vijf-tot-vijftien-minuten
    kind: fact
    en:
      title: "5 to 15 minutes"
      body: "Is long enough, at a temperature you can tolerate. Stop if it gets too uncomfortable."
    nl:
      title: "5 tot 15 minuten"
      body: "Is lang genoeg, op een temperatuur die je aankunt. Stop als het te ongemakkelijk wordt."
    de:
      title: "5 bis 15 Minuten"
      body: "Reichen, bei einer Temperatur, die du verträgst. Hör auf, wenn es zu unangenehm wird."
    es:
      title: "5 a 15 minutos"
      body: "Bastan, a una temperatura que toleres. Para si se vuelve demasiado incómodo."
    fr:
      title: "5 à 15 minutes"
      body: "Suffisent, à une température que tu supportes. Arrête si ça devient trop désagréable."
    pt:
      title: "5 a 15 minutos"
      body: "Chegam, a uma temperatura que aguentes. Para se ficar desconfortável demais."
    tr:
      title: "5-15 dakika"
      body: "Dayanabileceğin bir sıcaklıkta yeterli. Fazla rahatsız edici olursa çık."

  - key: hoe-het-werkt
    kind: fact
    en:
      title: "Less sore"
      body: "Cold lowers tissue temperature and may dampen inflammation and nerve signals. So you feel less sore."
    nl:
      title: "Minder spierpijn"
      body: "Kou verlaagt de weefseltemperatuur en dempt mogelijk ontsteking en zenuwsignalen. Zo voel je minder pijn."
    de:
      title: "Weniger Muskelkater"
      body: "Kälte senkt die Gewebetemperatur und dämpft womöglich Entzündung und Nervensignale. Das lindert den Kater."
    es:
      title: "Menos agujetas"
      body: "El frío baja la temperatura del tejido y quizá calme la inflamación y los nervios. Así notas menos dolor."
    fr:
      title: "Moins de courbatures"
      body: "Le froid baisse la température des tissus et calme peut-être l'inflammation et les nerfs. Tu as moins mal."
    pt:
      title: "Menos dores"
      body: "O frio baixa a temperatura dos tecidos e talvez acalme a inflamação e os nervos. Sentes menos dor."
    tr:
      title: "Daha az ağrı"
      body: "Soğuk doku sıcaklığını düşürür, iltihabı ve sinir sinyallerini azaltabilir. Daha az ağrı hissedersin."

  - key: geen-vervanging-voor-slaap
    kind: myth
    en:
      title: "Bad sleep"
      body: "Myth: an ice bath makes up for bad sleep. Sleep and protein do the real recovery work. Cold is optional."
    nl:
      title: "Slecht geslapen"
      body: "Mythe: een ijsbad maakt slecht slapen goed. Slaap en eiwit doen het echte herstelwerk. Kou is optioneel."
    de:
      title: "Schlecht geschlafen"
      body: "Mythos: Ein Eisbad gleicht schlechten Schlaf aus. Schlaf und Protein erledigen die Erholung. Kälte ist ein Extra."
    es:
      title: "Dormir mal"
      body: "Mito: un baño de hielo compensa dormir mal. El sueño y la proteína hacen la recuperación. El frío es opcional."
    fr:
      title: "Mauvaise nuit"
      body: "Mythe : un bain glacé compense une mauvaise nuit. Sommeil et protéines font la vraie récup. Le froid est en option."
    pt:
      title: "Dormir mal"
      body: "Mito: um banho de gelo compensa dormir mal. O sono e a proteína é que recuperam. O frio é opcional."
    tr:
      title: "Kötü uyku"
      body: "Efsane: buz banyosu kötü uykuyu telafi eder. Asıl toparlanmayı uyku ve protein yapar. Soğuk isteğe bağlı."

  - key: veilig-opwarmen
    kind: fact
    en:
      title: "Warm up slowly"
      body: "After the cold, don't push through numbness or pain. Skip it if you have a cold-related condition."
    nl:
      title: "Langzaam opwarmen"
      body: "Ga na de kou niet door gevoelloosheid of pijn heen. Sla het over als je een aandoening hebt die met kou te maken heeft."
    de:
      title: "Langsam aufwärmen"
      body: "Nach der Kälte nicht über Taubheit oder Schmerz hinweggehen. Bei kältebedingten Leiden lieber lassen."
    es:
      title: "Entra en calor"
      body: "Tras el frío, no ignores el entumecimiento ni el dolor. Sáltatelo si el frío te causa problemas de salud."
    fr:
      title: "Se réchauffer"
      body: "Après le froid, ne force pas sur l'engourdissement ou la douleur. Évite si tu as un souci lié au froid."
    pt:
      title: "Aquece devagar"
      body: "Depois do frio, não ignores dormência nem dor. Salta isto se tens algum problema ligado ao frio."
    tr:
      title: "Yavaşça ısın"
      body: "Soğuktan sonra uyuşma ya da ağrıyı zorlama. Soğukla ilgili bir rahatsızlığın varsa hiç yapma."

  - key: te-lang-te-koud
    kind: fact
    en:
      title: "Longer isn't tougher"
      body: "Staying in too long or too cold risks feeling faint or going numb."
    nl:
      title: "Langer is niet beter"
      body: "Te lang of te koud erin blijven kan je duizelig of gevoelloos maken."
    de:
      title: "Länger bringt nichts"
      body: "Zu lange oder zu kalt drin bleiben kann dich schwindlig oder taub machen."
    es:
      title: "Más no es mejor"
      body: "Quedarte demasiado o en agua muy fría puede marearte o dejarte entumecido."
    fr:
      title: "Pas plus long"
      body: "Rester trop longtemps ou trop froid peut te faire tourner de l'œil ou t'engourdir."
    pt:
      title: "Mais não é melhor"
      body: "Ficar tempo demais ou em água fria demais pode deixar-te tonto ou dormente."
    tr:
      title: "Uzun kalmak"
      body: "Çok uzun ya da çok soğukta kalmak baş dönmesi veya uyuşma riski taşır."

  - key: helpt-volhouden
    kind: fact
    en:
      title: "Feeling good"
      body: "Cold may help you stick with training just because it makes you feel better. The evidence is still early."
    nl:
      title: "Lekker voelen"
      body: "Kou helpt je misschien volhouden, gewoon omdat je je er beter door voelt. Het bewijs is nog pril."
    de:
      title: "Gutes Gefühl"
      body: "Kälte hilft dir vielleicht dranzubleiben, einfach weil du dich besser fühlst. Die Beweislage ist noch dünn."
    es:
      title: "Sentirte bien"
      body: "El frío quizá te ayude a ser constante solo porque te sienta bien. La evidencia aún es incipiente."
    fr:
      title: "Se sentir bien"
      body: "Le froid t'aide peut-être à tenir, juste parce qu'il fait du bien. Les preuves sont encore minces."
    pt:
      title: "Sentir-te bem"
      body: "O frio talvez te ajude a manter o treino só porque te faz sentir melhor. A evidência ainda é recente."
    tr:
      title: "İyi hissetmek"
      body: "Soğuk sadece iyi hissettirdiği için antrenmana bağlı kalmana yardım edebilir. Kanıtlar henüz yeni."

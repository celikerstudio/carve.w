article: beta-alanine
emoji: "🔋"
tips:
  - key: dosis-en-duur
    kind: fact
    en:
      title: "4 to 6 g"
      body: "Beta-alanine a day for at least 2 to 4 weeks, in doses of 2 g or less. It builds up in muscle over weeks."
    nl:
      title: "4 tot 6 gram"
      body: "Bèta-alanine per dag, minstens 2 tot 4 weken, in porties van hooguit 2 gram. Het stapelt zich op in je spieren."
    de:
      title: "4 bis 6 g"
      body: "Beta-Alanin am Tag, mindestens 2 bis 4 Wochen, in Portionen bis 2 g. Es baut sich über Wochen im Muskel auf."
    es:
      title: "4 a 6 g"
      body: "De beta-alanina al día durante al menos 2 a 4 semanas, en tomas de 2 g o menos. Se acumula en el músculo."
    fr:
      title: "4 à 6 g"
      body: "De bêta-alanine par jour, au moins 2 à 4 semaines, en prises de 2 g max. Elle s'accumule dans le muscle."
    pt:
      title: "4 a 6 g"
      body: "De beta-alanina por dia, pelo menos 2 a 4 semanas, em doses de 2 g ou menos. Acumula-se no músculo."
    tr:
      title: "4-6 g"
      body: "Günde beta-alanin, en az 2-4 hafta, 2 g'ı geçmeyen dozlarla. Haftalar içinde kasta birikir."

  - key: voor-de-training
    kind: myth
    en:
      title: "Before training"
      body: "Myth: take it right before training. It works by building carnosine over weeks. Single big doses didn't help."
    nl:
      title: "Vlak voor de training"
      body: "Mythe: neem het vlak voor de training. Het werkt door weken carnosine op te bouwen. Losse grote doses hielpen niet."
    de:
      title: "Direkt vorher"
      body: "Mythos: Nimm es direkt vor dem Training. Es wirkt über Wochen via Carnosin. Einzelne große Dosen halfen nicht."
    es:
      title: "Antes de entrenar"
      body: "Mito: tómala justo antes de entrenar. Funciona subiendo la carnosina durante semanas. Una dosis grande no ayudó."
    fr:
      title: "Juste avant la séance"
      body: "Mythe : prends-la juste avant la séance. Elle agit en montant la carnosine sur des semaines. Une dose unique n'aide pas."
    pt:
      title: "Antes do treino"
      body: "Mito: toma-a mesmo antes do treino. Funciona ao subir a carnosina durante semanas. Doses grandes isoladas não ajudaram."
    tr:
      title: "Antrenmandan önce"
      body: "Efsane: antrenmandan hemen önce al. Haftalar içinde karnozini artırarak çalışır. Tek büyük doz işe yaramadı."

  - key: een-tot-vier-minuten
    kind: fact
    en:
      title: "1 to 4 minutes"
      body: "Hard efforts of that length, where the burn makes you stop. That's where beta-alanine helps."
    nl:
      title: "1 tot 4 minuten"
      body: "Zware inspanningen van die duur, waar de verzuring je laat stoppen. Daar helpt bèta-alanine."
    de:
      title: "1 bis 4 Minuten"
      body: "Harte Belastungen dieser Länge, bei denen das Brennen dich stoppt. Da hilft Beta-Alanin."
    es:
      title: "1 a 4 minutos"
      body: "Esfuerzos duros de esa duración, donde el ardor te hace parar. Ahí ayuda la beta-alanina."
    fr:
      title: "1 à 4 minutes"
      body: "Des efforts durs de cette durée, où la brûlure te fait arrêter. C'est là que la bêta-alanine aide."
    pt:
      title: "1 a 4 minutos"
      body: "Esforços duros com essa duração, em que o ardor te faz parar. É aí que a beta-alanina ajuda."
    tr:
      title: "1-4 dakika"
      body: "Yanmanın seni durdurduğu bu uzunlukta zorlu eforlar. Beta-alanin tam burada işe yarar."

  - key: korte-sprints
    kind: myth
    en:
      title: "Under 60 seconds"
      body: "Myth: beta-alanine helps short sprints. A meta-analysis found no benefit in efforts that short."
    nl:
      title: "Onder 60 seconden"
      body: "Mythe: bèta-alanine helpt bij korte sprints. Een meta-analyse vond geen voordeel bij zulke korte inspanningen."
    de:
      title: "Unter 60 Sekunden"
      body: "Mythos: Beta-Alanin hilft bei kurzen Sprints. Eine Metaanalyse fand bei so kurzen Belastungen keinen Vorteil."
    es:
      title: "Menos de 60 segundos"
      body: "Mito: la beta-alanina ayuda en sprints cortos. Un metaanálisis no vio beneficio en esfuerzos tan breves."
    fr:
      title: "Moins de 60 secondes"
      body: "Mythe : la bêta-alanine aide sur les sprints courts. Une méta-analyse n'a vu aucun gain sur des efforts si brefs."
    pt:
      title: "Menos de 60 segundos"
      body: "Mito: a beta-alanina ajuda nos sprints curtos. Uma meta-análise não viu benefício em esforços tão curtos."
    tr:
      title: "60 saniyeden kısa"
      body: "Efsane: beta-alanin kısa sprintlerde işe yarar. Bir meta-analiz bu kadar kısa eforlarda fayda bulmadı."

  - key: tintelen
    kind: fact
    en:
      title: "60 to 90 minutes"
      body: "The prickling in your face, neck and hands usually fades within that time. It isn't harmful."
    nl:
      title: "60 tot 90 minuten"
      body: "Zo lang duurt het tintelen in je gezicht, nek en handen meestal. Het kan geen kwaad."
    de:
      title: "60 bis 90 Minuten"
      body: "So lange dauert das Kribbeln in Gesicht, Nacken und Händen meist. Es ist harmlos."
    es:
      title: "60 a 90 minutos"
      body: "Es lo que suele durar el hormigueo en cara, cuello y manos. No es dañino."
    fr:
      title: "60 à 90 minutes"
      body: "C'est le temps que durent en général les picotements au visage, au cou et aux mains. C'est sans danger."
    pt:
      title: "60 a 90 minutos"
      body: "É quanto costuma durar o formigueiro na cara, no pescoço e nas mãos. Não faz mal."
    tr:
      title: "60-90 dakika"
      body: "Yüzde, boyunda ve ellerde karıncalanma genelde bu sürede geçer. Zararsızdır."

  - key: minder-tintelen
    kind: fact
    en:
      title: "1.6 g"
      body: "Smaller doses like this, or a sustained-release product, reduce the tingle. Less, not always none."
    nl:
      title: "1,6 gram"
      body: "Kleinere doses zoals deze, of een vertraagde afgifte, geven minder tinteling. Minder, niet altijd geen."
    de:
      title: "1,6 g"
      body: "Kleinere Dosen wie diese oder ein Retardprodukt mindern das Kribbeln. Weniger, nicht immer gar keins."
    es:
      title: "1,6 g"
      body: "Dosis pequeñas así, o un producto de liberación lenta, reducen el hormigueo. Menos, no siempre nada."
    fr:
      title: "1,6 g"
      body: "Des doses plus petites comme celle-ci, ou une forme à libération lente, réduisent les picotements. Pas toujours à zéro."
    pt:
      title: "1,6 g"
      body: "Doses mais pequenas como esta, ou libertação prolongada, reduzem o formigueiro. Menos, nem sempre nenhum."
    tr:
      title: "1,6 g"
      body: "Bu kadar küçük dozlar ya da yavaş salımlı ürün karıncalanmayı azaltır. Azaltır, her zaman yok etmez."

  - key: wedstrijd-of-test
    kind: fact
    en:
      title: "Fixed distance"
      body: "It helped most in tests to exhaustion. For a race over a set distance, the effect is less certain."
    nl:
      title: "Vaste afstand"
      body: "Het hielp vooral in tests tot je niet meer kon. Bij een wedstrijd over een vaste afstand is het minder zeker."
    de:
      title: "Feste Distanz"
      body: "Es half am meisten in Tests bis zur Erschöpfung. Für ein Rennen über eine feste Strecke ist es unsicherer."
    es:
      title: "Distancia fija"
      body: "Ayudó sobre todo en pruebas hasta el agotamiento. En una carrera de distancia fija, el efecto es menos seguro."
    fr:
      title: "Distance fixe"
      body: "Elle a surtout aidé dans les tests jusqu'à épuisement. Sur une course à distance fixe, l'effet est moins sûr."
    pt:
      title: "Distância fixa"
      body: "Ajudou sobretudo em testes até à exaustão. Numa prova de distância fixa, o efeito é menos certo."
    tr:
      title: "Sabit mesafe"
      body: "En çok tükenene kadar yapılan testlerde işe yaradı. Sabit mesafeli yarışta etkisi daha belirsiz."

  - key: kracht
    kind: myth
    en:
      title: "Stronger"
      body: "Myth: beta-alanine makes you stronger. It may help training volume, but whether that adds strength isn't known yet."
    nl:
      title: "Sterker"
      body: "Mythe: bèta-alanine maakt je sterker. Het helpt misschien je volume, maar of dat kracht oplevert is nog niet bekend."
    de:
      title: "Stärker"
      body: "Mythos: Beta-Alanin macht stärker. Es hilft vielleicht beim Volumen, ob das Kraft bringt, ist noch offen."
    es:
      title: "Más fuerza"
      body: "Mito: la beta-alanina te hace más fuerte. Quizá ayude al volumen, pero no se sabe aún si eso suma fuerza."
    fr:
      title: "Plus fort"
      body: "Mythe : la bêta-alanine rend plus fort. Elle aide peut-être le volume, mais on ignore encore si ça donne de la force."
    pt:
      title: "Mais forte"
      body: "Mito: a beta-alanina torna-te mais forte. Talvez ajude no volume, mas ainda não se sabe se isso dá força."
    tr:
      title: "Daha güçlü"
      body: "Efsane: beta-alanin seni güçlendirir. Hacme yardım edebilir ama bunun güce dönüşüp dönüşmediği henüz bilinmiyor."

  - key: stoppen
    kind: fact
    en:
      title: "6 to 15 weeks"
      body: "That's how long muscle carnosine took to return to normal after stopping, in one study."
    nl:
      title: "6 tot 15 weken"
      body: "Zo lang duurde het in één studie voor carnosine in de spieren na het stoppen weer normaal was."
    de:
      title: "6 bis 15 Wochen"
      body: "So lange brauchte Carnosin im Muskel in einer Studie, um nach dem Absetzen normal zu werden."
    es:
      title: "6 a 15 semanas"
      body: "Es lo que tardó la carnosina muscular en volver a lo normal tras dejarla, en un estudio."
    fr:
      title: "6 à 15 semaines"
      body: "C'est le temps qu'a mis la carnosine musculaire à revenir à la normale après l'arrêt, dans une étude."
    pt:
      title: "6 a 15 semanas"
      body: "Foi o que a carnosina muscular demorou a voltar ao normal depois de parar, num estudo."
    tr:
      title: "6-15 hafta"
      body: "Bir çalışmada bıraktıktan sonra kastaki karnozinin normale dönmesi bu kadar sürdü."

  - key: langer-dan-een-jaar
    kind: fact
    en:
      title: "1 year"
      body: "Beta-alanine seems safe at normal doses, but there's no safety data on use beyond a year."
    nl:
      title: "1 jaar"
      body: "Bèta-alanine lijkt veilig bij normale doses, maar over gebruik langer dan een jaar is niets bekend."
    de:
      title: "1 Jahr"
      body: "Beta-Alanin scheint in normalen Dosen sicher, aber für mehr als ein Jahr fehlen Sicherheitsdaten."
    es:
      title: "1 año"
      body: "La beta-alanina parece segura a dosis normales, pero no hay datos de seguridad de más de un año."
    fr:
      title: "1 an"
      body: "La bêta-alanine semble sûre à dose normale, mais on n'a aucune donnée au-delà d'un an."
    pt:
      title: "1 ano"
      body: "A beta-alanina parece segura em doses normais, mas não há dados de segurança para além de um ano."
    tr:
      title: "1 yıl"
      body: "Beta-alanin normal dozda güvenli görünüyor ama bir yılı aşan kullanımda güvenlik verisi yok."

article: beginner-mistakes
emoji: "🔰"
tips:
  - key: klein-beginnen
    kind: fact
    en:
      title: "Start small"
      body: "The WHO advises starting small, then slowly building up how often, how hard and how long you train."
    nl:
      title: "Klein beginnen"
      body: "De WHO adviseert klein te beginnen en daarna langzaam op te bouwen: vaker, zwaarder, langer."
    de:
      title: "Klein anfangen"
      body: "Die WHO rät, klein anzufangen und dann langsam zu steigern, wie oft, wie hart und wie lange du trainierst."
    es:
      title: "Empieza poco a poco"
      body: "La OMS aconseja empezar con poco e ir subiendo despacio la frecuencia, la intensidad y la duración."
    fr:
      title: "Commence petit"
      body: "L'OMS conseille de commencer petit, puis d'augmenter doucement la fréquence, l'intensité et la durée."
    pt:
      title: "Começa devagar"
      body: "A OMS aconselha começar com pouco e ir aumentando devagar a frequência, a intensidade e a duração."
    tr:
      title: "Küçük başla"
      body: "DSÖ küçük başlamayı, sonra sıklığı, zorluğu ve süreyi yavaş yavaş artırmayı öneriyor."

  - key: drie-die-je-volhoudt
    kind: fact
    en:
      title: "3 a week"
      body: "Kept up for a year, that beats six a week that you quit after a month."
    nl:
      title: "3 keer per week"
      body: "Een jaar volhouden is meer waard dan zes keer per week en na een maand stoppen."
    de:
      title: "3-mal pro Woche"
      body: "Ein Jahr lang durchgezogen ist mehr wert als sechsmal pro Woche und nach einem Monat aufhören."
    es:
      title: "3 por semana"
      body: "Mantenidas un año valen más que seis por semana que dejas al mes."
    fr:
      title: "3 par semaine"
      body: "Tenues pendant un an, elles valent plus que six par semaine abandonnées au bout d'un mois."
    pt:
      title: "3 por semana"
      body: "Mantidas durante um ano valem mais do que seis por semana que largas ao fim de um mês."
    tr:
      title: "Haftada 3"
      body: "Bir yıl sürdürülen 3 antrenman, bir ay sonra bırakılan haftada 6 antrenmandan daha değerli."

  - key: opschrijven
    kind: fact
    en:
      title: "Write it down"
      body: "Weight, sets and reps. You can only make it harder if you know what you lifted last time."
    nl:
      title: "Schrijf het op"
      body: "Gewicht, sets en herhalingen. Je kunt het pas zwaarder maken als je weet wat je vorige keer deed."
    de:
      title: "Schreib es auf"
      body: "Gewicht, Sätze und Wiederholungen. Steigern kannst du nur, wenn du weißt, was du letztes Mal geschafft hast."
    es:
      title: "Apúntalo"
      body: "Peso, series y repeticiones. Solo puedes subir si sabes lo que levantaste la última vez."
    fr:
      title: "Note-le"
      body: "Charge, séries et répétitions. Tu ne peux progresser que si tu sais ce que tu as soulevé la dernière fois."
    pt:
      title: "Aponta"
      body: "Peso, séries e repetições. Só consegues subir se souberes o que levantaste da última vez."
    tr:
      title: "Not al"
      body: "Ağırlık, set ve tekrar. Ancak geçen sefer ne kaldırdığını biliyorsan zorlaştırabilirsin."

  - key: vijf-extra
    kind: fact
    en:
      title: "5 more reps"
      body: "Could you easily do five more on your last set? Then the weight is too light for that rep range."
    nl:
      title: "5 herhalingen extra"
      body: "Kon je op je laatste set makkelijk nog vijf? Dan is het gewicht te licht voor dat aantal herhalingen."
    de:
      title: "5 Wiederholungen mehr"
      body: "Gehen im letzten Satz locker noch fünf? Dann ist das Gewicht zu leicht für diesen Bereich."
    es:
      title: "5 repeticiones más"
      body: "¿Podrías hacer cinco más fácil en tu última serie? Entonces el peso es muy ligero para ese rango."
    fr:
      title: "5 reps de plus"
      body: "Tu pourrais en faire cinq de plus sur ta dernière série ? Alors la charge est trop légère pour cette plage."
    pt:
      title: "5 repetições a mais"
      body: "Na última série conseguias mais cinco com facilidade? Então o peso é leve demais para esse intervalo."
    tr:
      title: "5 tekrar daha"
      body: "Son sette rahatça beş tekrar daha yapabilir miydin? O zaman ağırlık o tekrar aralığı için hafif."

  - key: willekeurig-wisselen
    kind: myth
    en:
      title: "New exercises"
      body: "Myth: new exercises keep you growing. Swapping often and at random may hold back gains. Planned variation can help."
    nl:
      title: "Nieuwe oefeningen"
      body: "Mythe: nieuwe oefeningen laten je groeien. Vaak en willekeurig wisselen kan je remmen. Gepland variëren kan helpen."
    de:
      title: "Neue Übungen"
      body: "Mythos: Neue Übungen halten dich im Wachstum. Häufiges, zufälliges Wechseln kann bremsen. Geplante Abwechslung hilft."
    es:
      title: "Ejercicios nuevos"
      body: "Mito: cambiar de ejercicio te hace crecer. Cambiar a menudo y al azar puede frenarte. Variar con plan sí ayuda."
    fr:
      title: "Nouveaux exercices"
      body: "Mythe : changer d'exercice fait grossir le muscle. Changer souvent et au hasard peut freiner. Varier avec un plan aide."
    pt:
      title: "Exercícios novos"
      body: "Mito: mudar de exercício faz crescer. Trocar muitas vezes e ao acaso pode travar. Variar com plano ajuda."
    tr:
      title: "Yeni hareketler"
      body: "Efsane: yeni hareketler büyümeyi sürdürür. Sık ve rastgele değiştirmek frenleyebilir. Planlı çeşitlilik işe yarar."

  - key: plan-tijd-geven
    kind: fact
    en:
      title: "A few months"
      body: "Give a plan that long before you judge it. Change one exercise only for a reason, like pain or no progress."
    nl:
      title: "Een paar maanden"
      body: "Zo lang geef je een plan voor je oordeelt. Wissel één oefening alleen met reden, zoals pijn of geen vooruitgang."
    de:
      title: "Ein paar Monate"
      body: "So lange bekommt ein Plan, bevor du urteilst. Tausch eine Übung nur mit Grund, etwa bei Schmerz oder Stillstand."
    es:
      title: "Unos meses"
      body: "Dale ese tiempo a un plan antes de juzgarlo. Cambia un ejercicio solo con motivo, como dolor o estancamiento."
    fr:
      title: "Quelques mois"
      body: "Donne ce temps à un plan avant de le juger. Change un exercice seulement pour une raison : douleur, stagnation."
    pt:
      title: "Uns meses"
      body: "Dá esse tempo a um plano antes de o julgar. Troca um exercício só com motivo, como dor ou estagnação."
    tr:
      title: "Birkaç ay"
      body: "Bir programı yargılamadan önce bu kadar süre ver. Bir hareketi ancak ağrı ya da ilerlememe gibi bir sebeple değiştir."

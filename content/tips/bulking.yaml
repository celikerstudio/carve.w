article: bulking
emoji: "🍚"
tips:
  - key: hoe-groot
    kind: fact
    en:
      title: "10 to 20%"
      body: "Above maintenance is enough for a bulk. On 2,800 kcal that's 280 to 560 kcal extra."
    nl:
      title: "10 tot 20%"
      body: "Boven onderhoud is genoeg voor een bulk. Bij 2.800 kcal is dat 280 tot 560 kcal extra."
    de:
      title: "10 bis 20 %"
      body: "Über dem Erhaltungsbedarf reichen für einen Aufbau. Bei 2.800 kcal sind das 280 bis 560 kcal mehr."
    es:
      title: "10 a 20 %"
      body: "Por encima del mantenimiento basta para un volumen. Con 2.800 kcal son 280 a 560 kcal extra."
    fr:
      title: "10 à 20 %"
      body: "Au-dessus de la maintenance suffit pour une prise de masse. À 2 800 kcal, ça fait 280 à 560 kcal en plus."
    pt:
      title: "10 a 20%"
      body: "Acima da manutenção chega para um bulk. Com 2.800 kcal, são 280 a 560 kcal a mais."
    tr:
      title: "%10-20"
      body: "Bulk için koruma kalorisinin bu kadar üstü yeter. 2.800 kcal'de 280-560 kcal fazlası demek."

  - key: tempo
    kind: fact
    en:
      title: "0.2 to 0.4 kg"
      body: "A week is a good gain rate at 80 kg, for beginners and intermediates. That's 0.25 to 0.5% of bodyweight."
    nl:
      title: "0,2 tot 0,4 kilo"
      body: "Per week is een goed tempo bij 80 kilo, voor beginners en gevorderden. Dat is 0,25 tot 0,5% van je gewicht."
    de:
      title: "0,2 bis 0,4 kg"
      body: "Pro Woche sind bei 80 kg ein gutes Tempo für Anfänger und Fortgeschrittene. Das sind 0,25 bis 0,5 %."
    es:
      title: "0,2 a 0,4 kg"
      body: "Por semana es buen ritmo con 80 kg, para novatos e intermedios. Es un 0,25 a 0,5 % de tu peso."
    fr:
      title: "0,2 à 0,4 kg"
      body: "Par semaine, c'est un bon rythme à 80 kg pour débutants et intermédiaires. Soit 0,25 à 0,5 % du poids."
    pt:
      title: "0,2 a 0,4 kg"
      body: "Por semana é bom ritmo com 80 kg, para iniciantes e intermédios. É 0,25 a 0,5% do teu peso."
    tr:
      title: "0,2-0,4 kg"
      body: "80 kiloda yeni ve orta seviye için iyi haftalık artış. Vücut ağırlığının %0,25-0,5'i."

  - key: zoveel-mogelijk
    kind: myth
    en:
      title: "All you can eat"
      body: "Myth: eat as much as you can. A big surplus raises the risk of extra fat, and that has to come off later."
    nl:
      title: "Zoveel mogelijk"
      body: "Mythe: eet zoveel als je kunt. Een groot overschot vergroot de kans op extra vet, en dat moet er later weer af."
    de:
      title: "So viel wie geht"
      body: "Mythos: Iss so viel du kannst. Ein großer Überschuss erhöht das Risiko für Fett, und das muss später runter."
    es:
      title: "Todo lo que puedas"
      body: "Mito: come todo lo que puedas. Un gran superávit sube el riesgo de grasa extra, y luego hay que quitarla."
    fr:
      title: "Tout ce que tu peux"
      body: "Mythe : mange autant que possible. Un gros surplus augmente le risque de gras, qu'il faudra perdre ensuite."
    pt:
      title: "Tudo o que puderes"
      body: "Mito: come tudo o que puderes. Um grande excedente aumenta o risco de gordura, que depois tens de perder."
    tr:
      title: "Yiyebildiğin kadar"
      body: "Efsane: yiyebildiğin kadar ye. Büyük fazla, ekstra yağ riskini artırır ve o yağ sonra gitmeli."

  - key: groter-overschot
    kind: myth
    en:
      title: "Bigger surplus"
      body: "Myth: a bigger surplus builds more muscle. In trained lifters, muscle didn't clearly differ. Fat gain did."
    nl:
      title: "Groter overschot"
      body: "Mythe: een groter overschot bouwt meer spier. Bij getrainde sporters verschilde spier niet duidelijk. Vet wel."
    de:
      title: "Größerer Überschuss"
      body: "Mythos: Mehr Überschuss, mehr Muskeln. Bei Trainierten gab es keinen klaren Unterschied beim Muskel. Beim Fett schon."
    es:
      title: "Más superávit"
      body: "Mito: más superávit da más músculo. En entrenados el músculo no difirió claramente. La grasa sí."
    fr:
      title: "Plus gros surplus"
      body: "Mythe : plus de surplus, plus de muscle. Chez des entraînés, le muscle n'a pas nettement différé. Le gras, si."
    pt:
      title: "Excedente maior"
      body: "Mito: mais excedente dá mais músculo. Em treinados, o músculo não diferiu claramente. A gordura sim."
    tr:
      title: "Daha büyük fazla"
      body: "Efsane: büyük fazla daha çok kas yapar. Deneyimlilerde kasta net fark çıkmadı. Yağda çıktı."

  - key: beginners-meer
    kind: fact
    en:
      title: "2.9 kg"
      body: "Lean mass gained by untrained people eating about 2,000 kcal extra a day for 8 weeks. Fat: only 0.2 kg."
    nl:
      title: "2,9 kilo"
      body: "Vetvrije massa erbij voor ongetrainde mensen die 8 weken 2.000 kcal per dag extra aten. Vet: maar 0,2 kilo."
    de:
      title: "2,9 kg"
      body: "Fettfreie Masse bauten Untrainierte mit etwa 2.000 kcal extra am Tag in 8 Wochen auf. Fett: nur 0,2 kg."
    es:
      title: "2,9 kg"
      body: "De masa magra ganaron novatos comiendo unas 2.000 kcal extra al día durante 8 semanas. Grasa: solo 0,2 kg."
    fr:
      title: "2,9 kg"
      body: "De masse maigre pour des non-entraînés à 2 000 kcal de plus par jour pendant 8 semaines. Gras : 0,2 kg."
    pt:
      title: "2,9 kg"
      body: "De massa magra para destreinados a comer cerca de 2.000 kcal extra por dia durante 8 semanas. Gordura: 0,2 kg."
    tr:
      title: "2,9 kg"
      body: "Antrenmansız kişiler 8 hafta günde 2.000 kcal fazla yiyerek bu kadar yağsız kütle kazandı. Yağ: sadece 0,2 kg."

  - key: weegschaal-staat-stil
    kind: fact
    en:
      title: "432 kcal"
      body: "Stored out of 1,000 extra a day, in one study. Most of the rest went into moving more."
    nl:
      title: "432 kcal"
      body: "Opgeslagen van de 1.000 extra per dag, in één studie. De rest ging grotendeels op aan meer bewegen."
    de:
      title: "432 kcal"
      body: "Von 1.000 extra pro Tag wurden in einer Studie gespeichert. Der Rest ging meist in mehr Bewegung."
    es:
      title: "432 kcal"
      body: "Se almacenaron de 1.000 extra al día, en un estudio. Casi todo lo demás se fue en moverse más."
    fr:
      title: "432 kcal"
      body: "Stockées sur 1 000 en plus par jour, dans une étude. Le reste est surtout parti en mouvement."
    pt:
      title: "432 kcal"
      body: "Armazenadas de 1.000 extra por dia, num estudo. Quase todo o resto foi gasto a mexer mais."
    tr:
      title: "432 kcal"
      body: "Bir çalışmada günlük 1.000 fazlanın bu kadarı depolandı. Kalanın çoğu daha fazla harekete gitti."

  - key: eiwit-in-overschot
    kind: fact
    en:
      title: "4.0 kg"
      body: "Lean mass gained in a surplus on high protein. On very little protein, people lost 0.7 kg. Fat gain was equal."
    nl:
      title: "4,0 kilo"
      body: "Vetvrije massa erbij in een overschot met veel eiwit. Met heel weinig eiwit ging er 0,7 kilo af. Vet: gelijk."
    de:
      title: "4,0 kg"
      body: "Fettfreie Masse im Überschuss mit viel Protein. Mit sehr wenig Protein gingen 0,7 kg verloren. Fett: gleich."
    es:
      title: "4,0 kg"
      body: "De masa magra en superávit con mucha proteína. Con muy poca se perdieron 0,7 kg. La grasa ganada fue igual."
    fr:
      title: "4,0 kg"
      body: "De masse maigre en surplus avec beaucoup de protéines. Avec très peu, 0,7 kg perdus. Le gras pris était égal."
    pt:
      title: "4,0 kg"
      body: "De massa magra em excedente com muita proteína. Com muito pouca, perderam 0,7 kg. A gordura foi igual."
    tr:
      title: "4,0 kg"
      body: "Yüksek proteinle fazlada kazanılan yağsız kütle. Çok az proteinle 0,7 kg kaybedildi. Yağ artışı aynıydı."

  - key: zonder-overschot
    kind: myth
    en:
      title: "No surplus"
      body: "Myth: no surplus, no muscle. People have gained muscle in a deficit, more often beginners and those with overweight."
    nl:
      title: "Geen overschot"
      body: "Mythe: zonder overschot geen spier. Ook in een tekort bouwen mensen spier, vaker beginners en mensen met overgewicht."
    de:
      title: "Kein Überschuss"
      body: "Mythos: Ohne Überschuss keine Muskeln. Auch im Defizit gelingt es, eher Anfängern und Menschen mit Übergewicht."
    es:
      title: "Sin superávit"
      body: "Mito: sin superávit no hay músculo. También se gana en déficit, más a menudo en novatos y personas con sobrepeso."
    fr:
      title: "Sans surplus"
      body: "Mythe : pas de surplus, pas de muscle. On en prend aussi en déficit, surtout débutant ou en surpoids."
    pt:
      title: "Sem excedente"
      body: "Mito: sem excedente não há músculo. Também se ganha em défice, mais vezes em iniciantes e pessoas com excesso de peso."
    tr:
      title: "Fazla yoksa"
      body: "Efsane: kalori fazlası yoksa kas da yok. Açıkta da kas kazanılır, daha çok yenilerde ve kilolularda."

  - key: wanneer-stoppen
    kind: fact
    en:
      title: "When to stop"
      body: "When your weight rises faster than planned for weeks, or the fat bothers you. Then eat at maintenance or below."
    nl:
      title: "Wanneer stoppen"
      body: "Als je weken sneller aankomt dan gepland, of het vet je stoort. Eet dan op onderhoud of eronder."
    de:
      title: "Wann aufhören"
      body: "Wenn du wochenlang schneller zunimmst als geplant oder dich das Fett stört. Dann auf Erhalt oder darunter."
    es:
      title: "Cuándo parar"
      body: "Si llevas semanas subiendo más rápido de lo previsto o te molesta la grasa. Pasa a mantenimiento o déficit."
    fr:
      title: "Quand arrêter"
      body: "Si tu prends plus vite que prévu depuis des semaines, ou si le gras te gêne. Passe en maintenance ou en déficit."
    pt:
      title: "Quando parar"
      body: "Se há semanas que sobes mais rápido do que o previsto, ou a gordura te incomoda. Passa a manutenção ou défice."
    tr:
      title: "Ne zaman durmalı"
      body: "Kilon haftalarca plandan hızlı artıyorsa ya da yağ seni rahatsız ediyorsa. Korumaya ya da açığa geç."

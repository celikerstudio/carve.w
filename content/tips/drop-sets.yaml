article: drop-sets
emoji: "🪜"
tips:
  - key: hoe-het-werkt
    kind: fact
    en:
      title: "10 to 25%"
      body: "Drop the weight that much after a near-failure set and keep going. One or two drops is enough."
    nl:
      title: "10 tot 25%"
      body: "Zoveel haal je eraf na een set tot bijna falen, en je gaat door. Eén of twee drops is genoeg."
    de:
      title: "10 bis 25 %"
      body: "So viel Gewicht runter nach einem Satz nah am Versagen, dann weiter. Ein, zwei Drops reichen."
    es:
      title: "10 a 25 %"
      body: "Baja eso el peso tras una serie cerca del fallo y sigue. Con una o dos bajadas basta."
    fr:
      title: "10 à 25 %"
      body: "Baisse la charge d'autant après une série proche de l'échec, et continue. Un ou deux drops suffisent."
    pt:
      title: "10 a 25%"
      body: "Baixa o peso isso depois de uma série perto da falha e continua. Uma ou duas descidas chegam."
    tr:
      title: "%10-25"
      body: "Tükenmeye yakın bir setten sonra ağırlığı bu kadar düşür ve devam et. Bir iki düşüş yeter."

  - key: waar-ze-passen
    kind: fact
    en:
      title: "Curls"
      body: "Drop sets fit curls, laterals or leg extensions. Keep them out of heavy lifts that load your spine."
    nl:
      title: "Curls"
      body: "Dropsets passen bij curls, laterals of leg extensions. Niet bij zware oefeningen die je rug belasten."
    de:
      title: "Curls"
      body: "Drop-Sätze passen zu Curls, Seitheben oder Beinstrecken. Nicht zu schweren Übungen, die die Wirbelsäule laden."
    es:
      title: "Curls"
      body: "Las series descendentes van bien en curls, elevaciones o extensiones. No en levantamientos que cargan la espalda."
    fr:
      title: "Curls"
      body: "Les drop sets vont bien aux curls, élévations ou leg extensions. Pas aux gros mouvements qui chargent le dos."
    pt:
      title: "Roscas"
      body: "Drop sets dão bem em roscas, elevações ou extensões. Não em exercícios pesados que carregam a coluna."
    tr:
      title: "Curl"
      body: "Drop set curl, yana açış ya da bacak uzatmaya uyar. Omurgayı yükleyen ağır hareketlerde yapma."

  - key: niet-elke-set
    kind: myth
    en:
      title: "Every set"
      body: "Myth: make every set a drop set. That spikes fatigue and wrecks recovery. Save them for your last set."
    nl:
      title: "Elke set"
      body: "Mythe: maak van elke set een dropset. Dat jaagt vermoeidheid op en sloopt je herstel. Bewaar ze voor de laatste."
    de:
      title: "Jeder Satz"
      body: "Mythos: Mach jeden Satz zum Drop-Satz. Das treibt die Ermüdung hoch und ruiniert die Erholung. Nur im letzten."
    es:
      title: "Cada serie"
      body: "Mito: haz cada serie descendente. Dispara la fatiga y arruina la recuperación. Guárdalas para la última."
    fr:
      title: "Chaque série"
      body: "Mythe : fais de chaque série un drop set. Ça explose la fatigue et la récup. Garde-les pour la dernière."
    pt:
      title: "Cada série"
      body: "Mito: faz de cada série um drop set. Dispara a fadiga e estraga a recuperação. Guarda-os para a última."
    tr:
      title: "Her set"
      body: "Efsane: her seti drop set yap. Yorgunluğu fırlatır ve toparlanmayı bozar. Son sete sakla."

  - key: let-op-hoofdlifts
    kind: fact
    en:
      title: "Main lifts"
      body: "If your main lifts start to suffer, cut back on drop sets or skip them for a while."
    nl:
      title: "Hoofdoefeningen"
      body: "Gaan je hoofdoefeningen achteruit, doe dan minder dropsets of sla ze een tijdje over."
    de:
      title: "Hauptübungen"
      body: "Leiden deine Hauptübungen, mach weniger Drop-Sätze oder lass sie eine Weile weg."
    es:
      title: "Ejercicios principales"
      body: "Si empiezan a resentirse, haz menos series descendentes o déjalas un tiempo."
    fr:
      title: "Exercices principaux"
      body: "S'ils commencent à souffrir, fais moins de drop sets ou laisse-les de côté un temps."
    pt:
      title: "Exercícios principais"
      body: "Se começarem a sofrer, faz menos drop sets ou deixa-os por uns tempos."
    tr:
      title: "Ana hareketler"
      body: "Ana hareketlerin kötüleşmeye başlarsa drop set'i azalt ya da bir süre bırak."

  - key: techniek-onder-vermoeidheid
    kind: fact
    en:
      title: "Under the burn"
      body: "Keep your form tight as the burn builds. Sloppy late reps give you less out of a drop set."
    nl:
      title: "Als het brandt"
      body: "Houd je techniek strak als het begint te branden. Slordige laatste herhalingen leveren minder op."
    de:
      title: "Wenn es brennt"
      body: "Halt die Technik sauber, wenn es brennt. Schlampige späte Wiederholungen bringen weniger."
    es:
      title: "Cuando quema"
      body: "Mantén la técnica cuando empiece a quemar. Las últimas repeticiones descuidadas rinden menos."
    fr:
      title: "Quand ça brûle"
      body: "Garde une technique propre quand ça brûle. Des dernières reps bâclées rapportent moins."
    pt:
      title: "Quando arde"
      body: "Mantém a técnica quando começar a arder. Repetições finais desleixadas rendem menos."
    tr:
      title: "Yanma başlayınca"
      body: "Yanma artarken formunu sıkı tut. Sondaki özensiz tekrarlar daha az kazandırır."

  - key: korte-sessies
    kind: fact
    en:
      title: "Same time"
      body: "Drop sets add stress and time under tension to a muscle, without making your session longer."
    nl:
      title: "Zelfde tijd"
      body: "Dropsets geven een spier meer prikkel en tijd onder spanning, zonder dat je training langer duurt."
    de:
      title: "Gleiche Zeit"
      body: "Drop-Sätze geben dem Muskel mehr Reiz und Zeit unter Spannung, ohne dass die Einheit länger dauert."
    es:
      title: "Mismo tiempo"
      body: "Las series descendentes dan más estímulo y tiempo bajo tensión sin alargar tu sesión."
    fr:
      title: "Même durée"
      body: "Les drop sets ajoutent du stress et du temps sous tension au muscle, sans rallonger ta séance."
    pt:
      title: "Mesmo tempo"
      body: "Drop sets dão mais estímulo e tempo sob tensão ao músculo, sem alongar o treino."
    tr:
      title: "Aynı süre"
      body: "Drop set, antrenmanı uzatmadan kasa daha çok uyarı ve gerilim altında süre ekler."

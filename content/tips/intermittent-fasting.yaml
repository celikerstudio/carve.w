article: intermittent-fasting
emoji: "⏳"
tips:
  - key: meer-vet-verbranden
    kind: myth
    en:
      title: "More fat burned"
      body: "Myth: fasting burns more fat. Overall it gives no clear edge over eating a bit less every day."
    nl:
      title: "Meer vetverbranding"
      body: "Mythe: vasten verbrandt meer vet. Over het geheel geeft het geen duidelijk voordeel boven elke dag iets minder eten."
    de:
      title: "Mehr Fettabbau"
      body: "Mythos: Fasten verbrennt mehr Fett. Insgesamt bringt es keinen klaren Vorteil gegenüber täglich etwas weniger."
    es:
      title: "Más grasa quemada"
      body: "Mito: el ayuno quema más grasa. En conjunto no gana claramente a comer un poco menos cada día."
    fr:
      title: "Plus de gras brûlé"
      body: "Mythe : le jeûne brûle plus de gras. Dans l'ensemble, pas d'avantage net sur manger un peu moins chaque jour."
    pt:
      title: "Mais gordura queimada"
      body: "Mito: o jejum queima mais gordura. No geral não bate claramente comer um pouco menos todos os dias."
    tr:
      title: "Daha çok yağ yakımı"
      body: "Efsane: oruç daha çok yağ yakar. Genelde her gün biraz az yemeye göre net bir üstünlüğü yok."

  - key: lange-termijn
    kind: fact
    en:
      title: "24 weeks"
      body: "From that point on, no form of fasting beat a normal diet, across 99 trials. Only short trials favoured it."
    nl:
      title: "24 weken"
      body: "Vanaf dat punt deed geen enkele vorm van vasten het beter dan een normaal dieet, in 99 studies."
    de:
      title: "24 Wochen"
      body: "Ab da war keine Form des Fastens besser als eine normale Diät, über 99 Studien. Nur kurze Studien zeigten mehr."
    es:
      title: "24 semanas"
      body: "Desde ahí, ningún tipo de ayuno ganó a una dieta normal, en 99 ensayos. Solo los cortos le daban ventaja."
    fr:
      title: "24 semaines"
      body: "Au-delà, aucune forme de jeûne n'a battu un régime normal, sur 99 essais. Seuls les essais courts le favorisaient."
    pt:
      title: "24 semanas"
      body: "A partir daí, nenhum tipo de jejum bateu uma dieta normal, em 99 ensaios. Só os curtos lhe davam vantagem."
    tr:
      title: "24 hafta"
      body: "99 çalışmada bu noktadan sonra hiçbir oruç türü normal diyeti geçmedi. Sadece kısa çalışmalar öndeydi."

  - key: acht-tot-vier
    kind: fact
    en:
      title: "8 am to 4 pm"
      body: "Eating only then for a year: 8.0 kg lost against 6.3 kg, on the same calories. Not a significant difference."
    nl:
      title: "8 tot 16 uur"
      body: "Een jaar alleen dan eten: 8,0 kilo eraf tegen 6,3, bij dezelfde calorieën. Geen significant verschil."
    de:
      title: "8 bis 16 Uhr"
      body: "Ein Jahr nur dann essen: 8,0 kg weniger gegenüber 6,3, bei gleichen Kalorien. Kein signifikanter Unterschied."
    es:
      title: "De 8 a 16 h"
      body: "Comer solo entonces durante un año: 8,0 kg perdidos frente a 6,3, con las mismas calorías. Sin diferencia significativa."
    fr:
      title: "De 8 h à 16 h"
      body: "Manger seulement là pendant un an : 8,0 kg perdus contre 6,3, à calories égales. Pas de différence significative."
    pt:
      title: "Das 8h às 16h"
      body: "Comer só nesse horário durante um ano: 8,0 kg perdidos contra 6,3, com as mesmas calorias. Sem diferença real."
    tr:
      title: "08:00-16:00"
      body: "Bir yıl sadece bu saatlerde yemek: aynı kaloride 8,0 kg'a karşı 6,3 kg kayıp. Anlamlı fark yok."

  - key: afhakers
    kind: fact
    en:
      title: "38% quit"
      body: "Alternate-day fasting, against 29% eating 25% less daily. Weight loss over a year was the same."
    nl:
      title: "38% haakte af"
      body: "Bij om-de-dag-vasten, tegen 29% bij elke dag 25% minder eten. Het gewichtsverlies na een jaar was gelijk."
    de:
      title: "38 % brachen ab"
      body: "Beim Fasten jeden zweiten Tag, gegenüber 29 % bei täglich 25 % weniger. Gewichtsverlust nach einem Jahr: gleich."
    es:
      title: "38 % lo dejó"
      body: "Con ayuno en días alternos, frente al 29 % comiendo un 25 % menos cada día. Igual peso perdido en un año."
    fr:
      title: "38 % ont lâché"
      body: "Le jeûne un jour sur deux, contre 29 % en mangeant 25 % de moins chaque jour. Même perte en un an."
    pt:
      title: "38% desistiu"
      body: "Do jejum em dias alternados, contra 29% a comer 25% menos todos os dias. Mesma perda num ano."
    tr:
      title: "%38 bıraktı"
      body: "Gün aşırı oruçta, her gün %25 az yemede %29. Bir yıllık kilo kaybı aynıydı."

  - key: venster-alleen
    kind: myth
    en:
      title: "Noon to 8 pm"
      body: "Myth: the eating window does the work. Eating only then, with nothing else changed, gave no extra weight loss."
    nl:
      title: "12 tot 20 uur"
      body: "Mythe: het eetvenster doet het werk. Alleen dan eten, verder niets veranderen, gaf niet meer gewichtsverlies."
    de:
      title: "12 bis 20 Uhr"
      body: "Mythos: Das Essfenster macht die Arbeit. Nur dann essen, sonst nichts ändern, brachte kein Gewicht weniger."
    es:
      title: "De 12 a 20 h"
      body: "Mito: la ventana hace el trabajo. Comer solo entonces, sin cambiar nada más, no hizo perder más peso."
    fr:
      title: "De 12 h à 20 h"
      body: "Mythe : la fenêtre fait le travail. Manger seulement là, sans rien changer d'autre, n'a pas fait perdre plus."
    pt:
      title: "Das 12h às 20h"
      body: "Mito: a janela faz o trabalho. Comer só nesse horário, sem mudar mais nada, não fez perder mais peso."
    tr:
      title: "12:00-20:00"
      body: "Efsane: işi yeme penceresi yapar. Başka hiçbir şeyi değiştirmeden sadece bu saatlerde yemek fazla kilo verdirmedi."

  - key: minder-eten
    kind: fact
    en:
      title: "175 kcal"
      body: "Less a day eaten by lifters on a time-restricted schedule. A shorter window can make eating less easier."
    nl:
      title: "175 kcal"
      body: "Minder per dag aten krachtsporters met een eetvenster. Een korter venster kan minder eten makkelijker maken."
    de:
      title: "175 kcal"
      body: "Weniger am Tag aßen Kraftsportler mit Essfenster. Ein kürzeres Fenster kann weniger Essen leichter machen."
    es:
      title: "175 kcal"
      body: "Menos al día comieron quienes entrenaban fuerza con ventana horaria. Una ventana corta facilita comer menos."
    fr:
      title: "175 kcal"
      body: "De moins par jour chez des pratiquants avec fenêtre alimentaire. Une fenêtre courte aide à manger moins."
    pt:
      title: "175 kcal"
      body: "A menos por dia em quem treinava força com janela alimentar. Uma janela curta facilita comer menos."
    tr:
      title: "175 kcal"
      body: "Zaman kısıtlı yiyen ağırlık sporcuları günde bu kadar az yedi. Kısa pencere az yemeyi kolaylaştırabilir."

  - key: spierverlies
    kind: myth
    en:
      title: "0.20 kg"
      body: "Myth: fasting eats your muscle. Fasting lost that much more fat-free mass. In lifters, muscle and strength held."
    nl:
      title: "0,20 kilo"
      body: "Mythe: vasten vreet je spieren op. Vasten kostte zoveel meer vetvrije massa. Bij krachtsporters bleven spier en kracht."
    de:
      title: "0,20 kg"
      body: "Mythos: Fasten frisst Muskeln. Es kostete so viel mehr fettfreie Masse. Bei Kraftsportlern hielten Muskeln und Kraft."
    es:
      title: "0,20 kg"
      body: "Mito: el ayuno se come tu músculo. Costó eso más de masa magra. Con pesas, músculo y fuerza se mantuvieron."
    fr:
      title: "0,20 kg"
      body: "Mythe : le jeûne mange le muscle. Il a coûté ça de masse maigre en plus. Chez les pratiquants, muscle et force ont tenu."
    pt:
      title: "0,20 kg"
      body: "Mito: o jejum come o músculo. Custou isso a mais de massa magra. Em quem treinava força, músculo e força mantiveram-se."
    tr:
      title: "0,20 kg"
      body: "Efsane: oruç kasını yer. Oruç bu kadar fazla yağsız kütle kaybettirdi. Ağırlık çalışanlarda kas ve güç korundu."

  - key: getrainde-vrouwen
    kind: fact
    en:
      title: "7.5 hours"
      body: "Trained women eating in a window that long gained as much muscle and strength as normal eaters."
    nl:
      title: "7,5 uur"
      body: "Getrainde vrouwen die binnen zo'n venster aten, wonnen evenveel spier en kracht als wie normaal at."
    de:
      title: "7,5 Stunden"
      body: "Trainierte Frauen, die in so einem Fenster aßen, legten so viel Muskeln und Kraft zu wie Normalesser."
    es:
      title: "7,5 horas"
      body: "Mujeres entrenadas que comían en una ventana así ganaron tanto músculo y fuerza como las que comían normal."
    fr:
      title: "7,5 heures"
      body: "Des femmes entraînées mangeant dans cette fenêtre ont pris autant de muscle et de force que les autres."
    pt:
      title: "7,5 horas"
      body: "Mulheres treinadas a comer numa janela assim ganharam tanto músculo e força como quem comia normal."
    tr:
      title: "7,5 saat"
      body: "Bu kadar pencerede yiyen antrenmanlı kadınlar, normal yiyenler kadar kas ve güç kazandı."

  - key: eiwit-in-venster
    kind: fact
    en:
      title: "8-hour window"
      body: "Spread protein every 3 to 4 hours. That means two or three protein-rich meals."
    nl:
      title: "Venster van 8 uur"
      body: "Spreid je eiwit om de 3 à 4 uur. Dat zijn twee of drie eiwitrijke maaltijden."
    de:
      title: "8-Stunden-Fenster"
      body: "Verteil Protein alle 3 bis 4 Stunden. Das sind zwei oder drei proteinreiche Mahlzeiten."
    es:
      title: "Ventana de 8 horas"
      body: "Reparte la proteína cada 3 o 4 horas. Eso son dos o tres comidas ricas en proteína."
    fr:
      title: "Fenêtre de 8 h"
      body: "Répartis tes protéines toutes les 3 à 4 heures. Ça fait deux ou trois repas riches en protéines."
    pt:
      title: "Janela de 8 horas"
      body: "Distribui a proteína a cada 3 a 4 horas. São duas ou três refeições ricas em proteína."
    tr:
      title: "8 saatlik pencere"
      body: "Proteini 3-4 saatte bir dağıt. Bu, iki ya da üç proteinli öğün demek."

  - key: niet-vasten
    kind: fact
    en:
      title: "Skip fasting"
      body: "If you're pregnant, breastfeeding or underweight, or have had an eating disorder."
    nl:
      title: "Niet vasten"
      body: "Als je zwanger bent, borstvoeding geeft, ondergewicht hebt of een eetstoornis hebt gehad."
    de:
      title: "Nicht fasten"
      body: "Wenn du schwanger bist, stillst, untergewichtig bist oder eine Essstörung hattest."
    es:
      title: "No ayunes"
      body: "Si estás embarazada, das el pecho, tienes bajo peso o has tenido un trastorno alimentario."
    fr:
      title: "Pas de jeûne"
      body: "Si tu es enceinte, allaites, es en sous-poids ou as eu un trouble alimentaire."
    pt:
      title: "Não jejues"
      body: "Se estás grávida, a amamentar, abaixo do peso ou já tiveste uma perturbação alimentar."
    tr:
      title: "Oruç tutma"
      body: "Hamileysen, emziriyorsan, zayıfsan ya da yeme bozukluğu geçirdiysen."
